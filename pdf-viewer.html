<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF 查看器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#333}
#viewer-header{position:fixed;top:0;left:0;right:0;height:44px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
#book-title{color:#fff;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin:0 10px}
.header-btn{background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:background 0.2s;white-space:nowrap}
.header-btn:hover{background:rgba(255,255,255,0.35)}
#pdf-frame{position:absolute;top:44px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 44px);border:none;background:#525659}
#loading-overlay{position:fixed;top:44px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#525659;color:#fff;z-index:50;transition:opacity 0.3s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:14px;color:rgba(255,255,255,0.8)}
#error-msg{display:none;position:fixed;top:44px;left:0;right:0;bottom:0;flex-direction:column;align-items:center;justify-content:center;background:#525659;color:#fff;z-index:60;text-align:center;padding:20px}
#error-msg .icon{font-size:64px;margin-bottom:16px}
#error-msg .text{font-size:16px;margin-bottom:20px;color:rgba(255,255,255,0.8)}
#error-msg .dl-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;padding:10px 24px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div id="viewer-header">
  <button class="header-btn" onclick="goBack()">← 返回</button>
  <span id="book-title">加载中...</span>
  <button class="header-btn" onclick="downloadPDF()">⬇ 下载</button>
</div>
<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">正在加载文档...</div>
</div>
<div id="error-msg">
  <div class="icon">📄</div>
  <div class="text">文档加载失败，请直接下载</div>
  <a id="error-dl-btn" class="dl-btn" href="#" download>下载 PDF</a>
</div>
<iframe id="pdf-frame" src="" allow="autoplay"></iframe>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var pdfUrl = params.get('url');
  var bookName = params.get('name') || 'PDF 文档';

  document.getElementById('book-title').textContent = bookName;
  document.title = bookName + ' - PDF 查看器';

  if (!pdfUrl) {
    showError();
    return;
  }

  // Try loading PDF in iframe
  var frame = document.getElementById('pdf-frame');
  var loading = document.getElementById('loading-overlay');
  var loaded = false;

  frame.onload = function() {
    loaded = true;
    loading.classList.add('hidden');
  };

  // Fallback: hide loading after 8s regardless
  setTimeout(function() {
    if (!loaded) {
      // Might be cross-origin blocking onload, hide loading anyway
      loading.classList.add('hidden');
    }
  }, 8000);

  frame.src = pdfUrl;

  // Store URL for download
  window._pdfUrl = pdfUrl;
  window._bookName = bookName;

  function showError() {
    document.getElementById('loading-overlay').classList.add('hidden');
    var errDiv = document.getElementById('error-msg');
    errDiv.style.display = 'flex';
    var dlBtn = document.getElementById('error-dl-btn');
    if (pdfUrl) {
      dlBtn.href = pdfUrl;
      dlBtn.download = window._bookName + '.pdf';
    }
  }
  window.showError = showError;
})();

function goBack() {
  if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
    window.history.back();
  } else {
    window.close();
  }
}

function downloadPDF() {
  if (window._pdfUrl) {
    var a = document.createElement('a');
    a.href = window._pdfUrl;
    a.download = window._bookName + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}
</script>
</body>
</html>
