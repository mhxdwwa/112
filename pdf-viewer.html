<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF 查看器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#525659;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#viewer-header{position:fixed;top:0;left:0;right:0;height:48px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
#book-title{color:#fff;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin:0 8px;text-align:center}
.hdr-btn{background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.hdr-btn:active{background:rgba(255,255,255,0.4)}
#page-info{color:rgba(255,255,255,0.9);font-size:12px;white-space:nowrap;flex-shrink:0;min-width:60px;text-align:center}
#pdf-container{position:absolute;top:48px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 0}
.pdf-page-wrap{margin:0 auto 12px auto;position:relative;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.pdf-page-wrap canvas{display:block;width:100%;height:auto}
#loading-overlay{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#525659;color:#fff;z-index:50;transition:opacity 0.3s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:14px;color:rgba(255,255,255,0.8)}
#progress-bar{width:200px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin-top:12px;overflow:hidden}
#progress-fill{width:0%;height:100%;background:#fff;border-radius:2px;transition:width 0.2s}
#error-msg{display:none;position:fixed;top:48px;left:0;right:0;bottom:0;flex-direction:column;align-items:center;justify-content:center;background:#525659;color:#fff;z-index:60;text-align:center;padding:20px}
#error-msg .icon{font-size:64px;margin-bottom:16px}
#error-msg .text{font-size:16px;margin-bottom:20px;color:rgba(255,255,255,0.8)}
#error-msg .dl-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;padding:10px 24px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div id="viewer-header">
  <button class="hdr-btn" onclick="goBack()">← 返回</button>
  <span id="page-info"></span>
  <span id="book-title">加载中...</span>
  <button class="hdr-btn" onclick="downloadPDF()">⬇ 下载</button>
</div>
<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">正在加载文档...</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>
<div id="error-msg">
  <div class="icon">📄</div>
  <div class="text">文档加载失败，请直接下载</div>
  <a id="error-dl-btn" class="dl-btn" href="#" download>下载 PDF</a>
</div>
<div id="pdf-container"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

var params = new URLSearchParams(window.location.search);
var pdfUrl = params.get('url');
var bookName = params.get('name') || 'PDF 文档';

document.getElementById('book-title').textContent = bookName;
document.title = bookName + ' - PDF 查看器';

window._pdfUrl = pdfUrl;
window._bookName = bookName;

if (!pdfUrl) {
  showError();
} else {
  loadPDF(pdfUrl);
}

function loadPDF(url) {
  var loading = document.getElementById('loading-overlay');
  var progressFill = document.getElementById('progress-fill');
  var loadingText = document.getElementById('loading-text');
  var container = document.getElementById('pdf-container');

  loadingText.textContent = '正在下载文档...';

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.responseType = 'arraybuffer';
  xhr.onprogress = function(e) {
    if (e.lengthComputable) {
      var pct = Math.round(e.loaded / e.total * 50);
      progressFill.style.width = pct + '%';
      loadingText.textContent = '正在下载... ' + Math.round(e.loaded/1024) + 'KB / ' + Math.round(e.total/1024) + 'KB';
    }
  };

  xhr.onload = function() {
    if (xhr.status === 200 || xhr.status === 0) {
      loadingText.textContent = '正在渲染文档...';
      progressFill.style.width = '50%';
      renderPDF(xhr.response);
    } else {
      loading.classList.add('hidden');
      showError();
    }
  };

  xhr.onerror = function() {
    loading.classList.add('hidden');
    showError();
  };

  xhr.send();
}

function renderPDF(data) {
  var loading = document.getElementById('loading-overlay');
  var progressFill = document.getElementById('progress-fill');
  var loadingText = document.getElementById('loading-text');
  var container = document.getElementById('pdf-container');

  pdfjsLib.getDocument({ data: data }).promise.then(function(pdf) {
    var totalPages = pdf.numPages;
    loadingText.textContent = '共 ' + totalPages + ' 页，正在渲染...';

    var containerWidth = container.clientWidth - 20;
    var scale = Math.min(containerWidth / 612, 2);

    var currentPage = 0;

    function renderNextPage(pageNum) {
      if (pageNum > totalPages) {
        loading.classList.add('hidden');
        return;
      }

      pdf.getPage(pageNum).then(function(page) {
        var viewport = page.getViewport({ scale: scale });

        var wrap = document.createElement('div');
        wrap.className = 'pdf-page-wrap';
        wrap.style.width = viewport.width + 'px';

        var canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';

        wrap.appendChild(canvas);
        container.appendChild(wrap);

        var ctx = canvas.getContext('2d');
        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
          var pct = 50 + Math.round(pageNum / totalPages * 50);
          progressFill.style.width = pct + '%';
          document.getElementById('page-info').textContent = pageNum + ' / ' + totalPages;
          renderNextPage(pageNum + 1);
        });
      });
    }

    renderNextPage(1);
  }).catch(function(err) {
    console.error('PDF render error:', err);
    loading.classList.add('hidden');
    showError();
  });
}

function showError() {
  document.getElementById('loading-overlay').classList.add('hidden');
  var errDiv = document.getElementById('error-msg');
  errDiv.style.display = 'flex';
  var dlBtn = document.getElementById('error-dl-btn');
  if (pdfUrl) {
    dlBtn.href = pdfUrl;
    dlBtn.download = bookName + '.pdf';
  }
}

function goBack() {
  if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
    window.history.back();
  } else {
    window.close();
  }
}

function downloadPDF() {
  if (window._pdfUrl) {
    var a = document.createElement('a');
    a.href = window._pdfUrl;
    a.download = window._bookName + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}
</script>
</body>
</html>
