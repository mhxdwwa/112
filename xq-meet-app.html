<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#12352a">
<title>九圩中学第三十二届校运会 · 登分台</title>
<style>
:root{
  --paper:#f6f3ea;
  --card:#fffdf7;
  --ink:#16211c;
  --muted:#6d7770;
  --line:#e5dfd0;
  --brand:#c23b28;
  --brand-soft:#fbe9e4;
  --green:#1b6a4f;
  --green-deep:#12352a;
  --green-soft:#e6f0ea;
  --gold:#c8962b;
  --gold-soft:#fbf2dc;
  --blue:#2f6f8f;
  --shadow:0 1px 2px rgba(22,33,28,.04),0 8px 24px -12px rgba(22,33,28,.18);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 82% -10%,rgba(27,106,79,.10),transparent 60%),
    radial-gradient(700px 420px at -10% 8%,rgba(194,59,40,.07),transparent 60%);
}
.app{max-width:980px;margin:0 auto;padding:0 14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  margin:0;
  padding:14px 14px 16px;
  color:#f7f4ea;
  background:
    radial-gradient(120% 140% at 92% 0%,rgba(200,150,43,.30),transparent 55%),
    linear-gradient(150deg,#0f2c23 0%,#174534 45%,#1b6a4f 100%);
  box-shadow:0 10px 30px -18px rgba(18,53,42,.8);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.topbar-inner{display:flex;align-items:center;gap:11px;max-width:952px;margin:0 auto}
.brand-badge{
  flex:0 0 auto;width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#fdf6e3,#efdcae);
  color:#7a2a1c;font-weight:800;font-size:19px;letter-spacing:.5px;
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 #fff,0 6px 14px -6px rgba(0,0,0,.5);
  position:relative;
}
.brand-badge small{position:absolute;bottom:4px;font-size:8px;font-weight:600;letter-spacing:1px;color:#9a6a20}
.brand-text{min-width:0;flex:1}
.brand-text h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text p{margin:2px 0 0;font-size:11.5px;color:rgba(255,255,255,.72);letter-spacing:1.4px}
.top-status{flex:0 0 auto;font-size:11px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#8fe3b0;box-shadow:0 0 0 3px rgba(143,227,176,.16)}

/* ============ 通用 ============ */
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.section-title h2{margin:0;font-size:15px;letter-spacing:.5px}
.section-title .sub{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.row{display:flex;gap:10px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.h1{font-size:22px;font-weight:800;letter-spacing:.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.tag.grade{color:var(--green);border-color:#bfd6c9;background:var(--green-soft)}
.tag.girls{color:#a4527e;border-color:#e8cbdc;background:#faecf4}
.tag.boys{color:#2f6f8f;border-color:#c9dde7;background:#eaf3f7}
.tag.prelim{color:#8a6a12;border-color:#e7d9b0;background:var(--gold-soft)}
.tag.final{color:var(--brand);border-color:#ecc4bc;background:var(--brand-soft)}
.tag.team{color:#5b5480;border-color:#d6d2e8;background:#f0eef8}
.tag.rec{color:#8a6a12;border-color:#e2cf98;background:linear-gradient(180deg,#fdf6e4,#f7ead0);font-weight:600}
.qual-box{background:#fffdf6;border:1px solid #eadfc2;border-radius:14px;padding:12px 14px;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.qual-box .qh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qual-box .qh b{font-size:13px;color:var(--ink)}
.qual-box .ql{font-size:11.5px;color:var(--muted);line-height:1.6}
.qual-chips{display:flex;flex-wrap:wrap;gap:5px}
.qual-chips .qc{font-size:11px;padding:2px 7px;border-radius:999px;background:#f2efe7;color:#5d5a4e;border:1px solid #e6e0d0}
.qual-chips .qc.on{background:var(--green-soft);border-color:#bfd6c9;color:var(--green)}
.row-badge-rec{font-size:10px;color:#8a6a12;background:var(--gold-soft);border:1px solid #e2cf98;border-radius:999px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.name-edit{cursor:pointer}
.name-edit .pen{display:inline-block;margin-left:4px;color:#b6ac93;font-size:11px;opacity:.75}
.name-edit:active .pen{opacity:1;color:var(--green)}
.pick-chip{font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5d5a4e;cursor:pointer}
.pick-chip.on{background:var(--green-soft);border-color:#bfd6c9;color:var(--green)}
.pick-wrap{display:flex;flex-wrap:wrap;gap:6px;max-height:168px;overflow:auto;margin:10px 0 4px}

/* ============ 概览 ============ */
.hero{
  position:relative;overflow:hidden;border-radius:20px;margin-top:14px;padding:18px;
  background:linear-gradient(140deg,#174534,#12352a 55%,#0f2c23);
  color:#f3efe3;box-shadow:0 18px 40px -24px rgba(18,53,42,.9);
}
.hero::after{
  content:"";position:absolute;right:-46px;top:-52px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(200,150,43,.42),rgba(200,150,43,.06) 65%,transparent 70%);
}
.hero h2{margin:0;font-size:19px;letter-spacing:1px;font-weight:700}
.hero .sub{margin-top:5px;font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.8px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero-chip{
  font-size:11.5px;padding:5px 10px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.88)
}
.hero-count{position:absolute;right:18px;bottom:14px;text-align:right;z-index:1}
.hero-count b{font-size:26px;font-variant-numeric:tabular-nums;color:#f2d99b}
.hero-count span{font-size:11px;color:rgba(255,255,255,.6);margin-left:4px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stat{padding:12px 12px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.stat.a b{color:var(--green)} .stat.b b{color:var(--brand)} .stat.c b{color:var(--blue)} .stat.d b{color:var(--gold)}

.today-list{display:flex;flex-direction:column}
.today-item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px dashed var(--line)}
.today-item:last-child{border-bottom:0}
.today-item .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--green);font-weight:700}
.today-item .n{font-size:13.5px;min-width:0}
.today-item .n small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);border:1px solid #bfd6c9}
.pill.gray{background:#f1f0ea;color:var(--muted);border-color:var(--line)}
.pill.red{background:var(--brand-soft);color:var(--brand);border-color:#ecc4bc}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick-btn{
  display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow);cursor:pointer;text-align:left;font-size:13px;color:var(--ink)
}
.quick-btn .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);flex:0 0 auto}
.quick-btn.alt .ic{background:var(--brand-soft);color:var(--brand)}
.quick-btn b{display:block;font-size:13.5px}
.quick-btn small{display:block;font-size:11px;color:var(--muted);margin-top:1px}

/* ============ 赛程 ============ */
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.18s
}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 16px -8px rgba(27,106,79,.8)}
.day-block{margin-bottom:8px}
.day-head{display:flex;align-items:center;gap:8px;margin:14px 2px 8px}
.day-head b{font-size:13.5px}
.day-head .line{flex:1;height:1px;background:var(--line)}

.ev-card{
  display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;
  padding:13px 14px;border-bottom:1px dashed var(--line);cursor:pointer;transition:background .15s
}
.ev-card:hover{background:#fbfaf4}
.ev-card:last-child{border-bottom:0}
.ev-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--green);letter-spacing:.5px}
.ev-time small{display:block;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0}
.ev-main{min-width:0}
.ev-main b{font-size:14px}
.ev-main .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.ev-right{text-align:right;font-size:11px;color:var(--muted);min-width:64px}
.ev-right .p{font-size:12px;color:var(--green);font-weight:700}
.ev-right .p.zero{color:var(--muted);font-weight:400}

/* ============ 登分页 ============ */
.crumb{font-size:11.5px;color:var(--muted);margin:14px 2px 8px;display:flex;gap:6px;align-items:center;cursor:pointer}
.ev-hero{padding:16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#fffdf7,#f6f2e6);box-shadow:var(--shadow)}
.ev-hero h2{margin:0 0 4px;font-size:19px;letter-spacing:.6px}
.ev-hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:12px;border:1px solid var(--line);
  background:#fff;color:var(--ink);padding:9px 13px;font-size:12.5px;cursor:pointer;transition:.16s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 10px 22px -12px rgba(194,59,40,.9)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 10px 22px -12px rgba(27,106,79,.9)}
.btn.ghost{background:transparent}
.btn.mini{padding:6px 10px;font-size:11.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.score-wrap{overflow-x:auto;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
table.score{border-collapse:collapse;width:100%}
table.score th,table.score td{padding:7px 6px;border-bottom:1px solid #efeade;font-size:13px;text-align:left}
table.score th{
  position:sticky;top:0;background:#f4f1e6;color:#57635b;font-weight:600;font-size:11.5px;letter-spacing:.6px;z-index:2;
  border-bottom:1px solid #e0d9c7
}
table.score td.idx{width:28px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
table.score td.name{font-weight:600;white-space:nowrap}
table.score td.cls{width:46px;color:var(--muted);font-variant-numeric:tabular-nums}
table.score input.sc{
  width:100%;max-width:96px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;
  font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.6px;text-align:center;color:var(--ink);
  transition:.15s
}
table.score input.sc:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(27,106,79,.12)}
table.score input.sc.filled{border-color:#c6d8cd;background:#f4faf6}
table.score td.rank{width:44px;text-align:center}
.rank-badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.r1{background:#fbe6b4;color:#8a6212} .r2{background:#e8ecef;color:#5c6873} .r3{background:#f3ddcb;color:#95572b}
.rn{background:#f1f0e9;color:var(--muted)}
td.pts{width:38px;text-align:center;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
td.note{width:54px}
.note-btn{border:1px dashed var(--line);background:transparent;border-radius:9px;padding:5px 8px;font-size:11px;color:var(--muted);cursor:pointer}
.note-btn.on{border-style:solid;border-color:#e0b76a;background:var(--gold-soft);color:#8a6212}
.empty-hint{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.qual-hint{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:10px 2px 0}

/* ============ 榜单 ============ */
.chart-card{padding:14px 10px 8px}
.chart-card canvas{width:100%;height:190px;display:block}
.rank-table{width:100%;border-collapse:collapse;font-size:13px}
.rank-table th,.rank-table td{padding:9px 8px;border-bottom:1px solid #f0ebdf;text-align:right;font-variant-numeric:tabular-nums}
.rank-table th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;background:#faf8f1}
.rank-table th:first-child,.rank-table td:first-child{text-align:left}
.rank-table td.medal{color:var(--gold);font-weight:700}
.rank-table tr.top1 td{background:linear-gradient(90deg,#fdf4dd,transparent)}

.result-list{display:flex;flex-direction:column}
.result-ev{padding:12px 14px;border-bottom:1px dashed var(--line);cursor:pointer}
.result-ev:last-child{border-bottom:0}
.result-ev .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.result-ev .h b{font-size:13.5px}
.result-ev .top3{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.result-ev .top3 i{font-style:normal;font-weight:700;color:var(--ink);margin-left:3px}
.scroll-x{overflow-x:auto}

/* ============ 学生 ============ */
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:none;font-size:14px;background:transparent;color:var(--ink)}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:12px}
.stu-card{padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.15s;box-shadow:0 2px 10px -8px rgba(22,33,28,.4)}
.stu-card:hover{border-color:#cbd8cd;transform:translateY(-1px)}
.stu-card b{font-size:14px;display:block}
.stu-card small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.stu-events{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.stu-event{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fdfbf4}
.stu-event .hd{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}
.stu-event .hd b{font-weight:600}
.stu-event .val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green)}
.stu-event .ft{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px}

/* ============ 抽屉/弹层 ============ */
.sheet-mask{position:fixed;inset:0;background:rgba(16,26,21,.45);backdrop-filter:blur(3px);z-index:60;display:none}
.sheet-mask.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-radius:22px 22px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86vh;overflow:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.9,.3,1);
  max-width:980px;margin:0 auto;box-shadow:0 -20px 50px -20px rgba(0,0,0,.3)
}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:#ded9c9;margin:0 auto 12px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}

/* ============ 拍照识别 ============ */
.ocr-layer{position:fixed;inset:0;z-index:80;background:#0b1512;color:#eef4ec;display:none;flex-direction:column}
.ocr-layer.on{display:flex}
.ocr-head{display:flex;align-items:center;justify-content:space-between;padding:var(--pad,14px) 16px;padding-top:calc(14px + env(safe-area-inset-top))}
.ocr-head b{font-size:14px;letter-spacing:.5px}
.ocr-close{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}
.ocr-stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;padding:8px 14px}
#ocrVideo,.ocr-shot{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.ocr-guide{position:absolute;pointer-events:none;border:1.5px dashed rgba(240,214,150,.85);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
.ocr-guide::before,.ocr-guide::after{content:"";position:absolute;width:22px;height:22px;border:2px solid rgba(240,214,150,.9);border-radius:8px}
.ocr-guide::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.ocr-guide::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.ocr-tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11.5px;color:rgba(255,255,255,.7);padding:0 20px}
.ocr-foot{padding:12px 16px calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.shutter{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle,#fdf7e6 0 58%,#c8962b 60%);cursor:pointer;box-shadow:0 8px 24px -8px #000}
.ocr-progress{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,18,14,.82);z-index:3;text-align:center;padding:20px}
.ocr-progress .bar{width:200px;height:4px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:12px}
.ocr-progress .bar i{display:block;height:100%;background:#f0d296;width:0;transition:width .3s}
.ocr-review{padding:12px 16px 0;overflow:auto;flex:1}
.ocr-row{display:grid;grid-template-columns:52px 1fr 92px 28px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.16)}
.ocr-row .who{font-size:12.5px}
.ocr-row .who small{display:block;font-size:10.5px;color:rgba(255,255,255,.55)}
.ocr-row input.ocrv{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;padding:6px 8px;font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.ocr-row .conf{font-size:10px}
.ocr-row input[type=checkbox]{width:18px;height:18px;accent-color:#c8962b}
.ocr-chips{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 0}
.chip{flex:0 0 auto;font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#eef4ec;cursor:pointer}
.chip.on{background:#f0d296;color:#25301f;border-color:#f0d296}

/* ============ 数据页 ============ */
.data-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px dashed var(--line)}
.data-item:last-child{border-bottom:0}
.data-item .t b{font-size:13.5px}
.data-item .t small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}

/* ============ 底部导航 ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,253,247,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px -20px rgba(22,33,28,.5)
}
.tabbar-inner{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:12px;color:#828b84;font-size:11px;background:transparent;border:0;cursor:pointer}
.tab .ic{display:grid;place-items:center;width:26px;height:24px}
.tab.on{color:var(--green);background:var(--green-soft);font-weight:600}
.tab .ic svg{display:block}

/* ============ 提示 ============ */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:120;
  background:#16211c;color:#fdf9ee;font-size:12.5px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.24s;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);max-width:86vw;text-align:center
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:520px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:400px){
  .quick{grid-template-columns:1fr}
}
@media (max-width:420px){
  table.score th,table.score td{padding:6px 4px}
  table.score input.sc{max-width:76px}
  .brand-text h1{font-size:15px}
}
@media print{
  .topbar,.tabbar,.toolbar,.crumb{display:none!important}
  body{background:#fff;padding:0}
  .card,.ev-hero{box-shadow:none;border-color:#ddd}
}

/* ================= 嵌入引导（独立打开时全部不生效） ================= */
/* 两种嵌入方式：
   ① 学勤管家用 iframe[src] 打开本页：?meet=<活动id>&u=<教师名>[&ro=1]
   ② 学勤管家用 iframe[srcdoc] 内嵌（推荐，单文件部署即可）：
      宿主在本页 <head> 注入 window.MT_FORCE = {meet, u, ro}
   两种方式都会把该活动的秩序册数据/成绩从 localStorage 的 xqmeet_boot_<id> 读进来 */
var MT_Q = (function () {
  try { return new URLSearchParams(location.search); }
  catch (e) { return { get: function () { return null; } }; }
})();
var MT_FORCE = (typeof window !== 'undefined' && window.MT_FORCE && typeof window.MT_FORCE === 'object') ? window.MT_FORCE : null;
var MT_MEET = (MT_FORCE && MT_FORCE.meet) || MT_Q.get('meet') || '';
var MT_RO = MT_FORCE ? !!MT_FORCE.ro : (MT_Q.get('ro') === '1');
var MT_U = (MT_FORCE && MT_FORCE.u) || MT_Q.get('u') || '';
var MT_BOOT = null;
(function () {
  if (!MT_MEET) return;
  try {
    var raw = localStorage.getItem('xqmeet_boot_' + MT_MEET);
    MT_BOOT = raw ? JSON.parse(raw) : null;
  } catch (e) { MT_BOOT = null; }
})();
/* 宿主指定了落点（如进入登分台直达「赛程」）时，先把 hash 设好 */
(function () {
  if (!MT_FORCE || !MT_FORCE.route) return;
  try { if (!location.hash) location.hash = '#/' + MT_FORCE.route; } catch (e) { }
})();
/* 嵌入别的届次时，把顶栏标题/副标题换成该届运动会的信息 */
function mtApplyMeta() {
  if (typeof MT_BOOT === 'undefined' || !MT_BOOT || !MT_BOOT.data || !MT_BOOT.data.meta) return;
  var m = MT_BOOT.data.meta;
  var t = document.getElementById('mtTitle'), s = document.getElementById('mtSub');
  if (t) t.textContent = (m.school || '') + (m.meet || '田径运动会');
  if (s) s.textContent = [m.dates, m.venue].filter(Boolean).join(' · ');
  document.title = (t ? t.textContent : '校运会') + ' · 登分台';
}

/* 初三那套是全校最高纪录表，作为兜底；其余年级取本年级记录表 */
const RECORDS = RECORDS_GRADE['初三'];
function recordFor(ev) {
  const arr = RECORDS_GRADE[ev.grade];
  let r = arr && arr.find(x => x.g === ev.gender && x.name === ev.name);
  if (!r) r = RECORDS.find(x => x.g === ev.gender && x.name === ev.name);
  return r || null;
}
// 是否优于校纪录：径赛更小、田赛更大
function beatsRecord(ev, val) {
  const rec = recordFor(ev);
  if (!rec || val == null) return false;
  return ev.kind === '田赛' ? val > rec.v + 1e-9 : val < rec.v - 1e-9;
}

/* ================= 成绩解析 ================= */
function parseScore(raw, kind) {
  if (raw == null) return null;
  let s = String(raw).trim();
  if (!s) return null;
  s = s.replace(/[，,。]/g, '.').replace(/[＂”″]/g, '"').replace(/[＇′’‘]/g, "'").replace(/：/g, ':').replace(/\s+/g, '');
  let m = s.match(/(\d{1,2})'\s*(\d{1,2})(?:\.?[’'′"]?(\d{1,2}))?/);
  if (m) {
    const mm = +m[1], ss = +m[2], cc = m[3] ? +m[3] : 0;
    let v = mm * 60 + ss + cc / 100;
    if (ss >= 60) v = mm * 60 + ss;
    return { value: v, unit: 's' };
  }
  m = s.match(/^(\d{1,2})["″”](\d{1,2})$/);
  if (m) return { value: (+m[1]) + (+m[2]) / 100, unit: 's' };
  m = s.match(/^(\d{1,2}):(\d{1,2})(?:\.(\d{1,2}))?$/);
  if (m) {
    const v = (+m[1]) * 60 + (+m[2]) + (m[3] ? (+m[3]) / 100 : 0);
    return { value: v, unit: 's' };
  }
  m = s.match(/(\d+(?:\.\d+)?)(?:m|米)/i);
  if (m) return { value: +m[1], unit: 'm' };
  m = s.match(/(\d+(?:\.\d+)?)/);
  if (m) {
    let v = +m[1];
    if (kind === '田赛' && v > 50) v = v / 100;
    return { value: v, unit: kind === '田赛' ? 'm' : 's' };
  }
  return null;
}
function fmtSec(v) {
  if (v == null) return '—';
  if (v >= 60) {
    let m = Math.floor(v / 60);
    let s = v - m * 60;
    if (s >= 59.995) { m += 1; s = 0; }
    return m + "'" + (s < 10 ? '0' : '') + s.toFixed(2) + '"';
  }
  return v.toFixed(2) + '"';
}
function fmtScore(ev, r) {
  if (r.rankManual != null && r.value == null) return '第' + r.rankManual + '名';
  if (r.value == null) return '—';
  return ev.kind === '田赛' ? r.value.value.toFixed(2) + ' m' : fmtSec(r.value.value);
}

/* ================= 事件行 ================= */
function rowKey(x) { return x.n ? (x.c + '|' + x.n) : x.c; }
// 决赛名单：优先用人工锁定名单，否则按预赛成绩自动取前 12/10 名
function autoQualKeys(ev) {
  const pre = prelimOf(ev);
  if (!pre) return null;
  const c = computeEvent(pre);
  if (!c.scored) return null;
  const n = ev.kind === '田赛' ? 10 : 12;
  return c.rows.filter(r => r.rank && !r.dq)
    .sort((a, b) => a.rank - b.rank)
    .slice(0, n)
    .map(r => r.cls + '|' + r.name);
}
function eventRows(ev) {
  let quals = S.quals[ev.id];
  if ((!quals || !quals.length) && ev.phase !== '预赛') quals = autoQualKeys(ev);
  let list = ev.entries.map((x, i) => ({ x: x, ei: i, ej: -1 }));
  if (quals && quals.length) list = list.filter(p => quals.indexOf(p.x.c + '|' + p.x.n) >= 0);
  const baseLen = list.length;
  (S.extra[ev.id] || []).forEach((x, j) => list.push({ x: x, ei: -1, ej: j }));
  const res = S.results[ev.id] || {};
  return list.map((p, i) => {
    const x = p.x;
    const k = p.ej >= 0 ? (rowKey(x) + '|x' + p.ej) : rowKey(x);
    const r = res[k] || {};
    return {
      i, key: k, name: x.n, cls: x.c, ei: p.ei, ej: p.ej,
      raw: r.raw || '', note: r.note || '', pb: false, dq: !!r.dq,
      rankManual: r.rankManual != null ? r.rankManual : null,
      value: r.dq ? null : parseScore(r.raw, ev.kind),
      rank: null, pts: 0, adv: false
    };
  });
}
function computeEvent(ev) {
  if (CACHE['e' + ev.id]) return CACHE['e' + ev.id];
  const rows = eventRows(ev);
  rows.forEach(r => { if (r.dq) { r.rank = null; r.pts = 0; } });
  const scored = rows.filter(r => r.value != null && !r.dq);
  const dir = ev.kind === '田赛' ? -1 : 1;
  scored.sort((a, b) => dir * (a.value.value - b.value.value));
  let lastV = null, lastRank = 0;
  scored.forEach((r, i) => {
    const v = r.value.value;
    if (lastV !== null && Math.abs(v - lastV) < 1e-9) r.rank = lastRank;
    else { r.rank = i + 1; lastRank = r.rank; lastV = v; }
  });
  // 手动名次（民族团队项目用）
  rows.filter(r => r.value == null && r.rankManual != null && !r.dq)
    .sort((a, b) => a.rankManual - b.rankManual)
    .forEach(r => { r.rank = +r.rankManual; });

  const isFinal = ev.phase !== '预赛';
  const ptsArr = ev.team ? PTS_TEAM : PTS_SOLO;
  // 破纪录：与校纪录比对，决赛（含直接决赛）自动标记；预赛只提示不计分
  rows.forEach(r => {
    if (r.value == null || r.dq) return;
    if (beatsRecord(ev, r.value.value)) {
      if (isFinal) r.pb = true; else r.pbPre = true;
    }
  });
  rows.forEach(r => {
    if (r.rank && isFinal) {
      const base = ptsArr[r.rank - 1] || 0;
      r.pts = r.pb ? base * 2 : base;
    }
    if (r.rank && !isFinal) r.adv = r.rank <= (ev.kind === '田赛' ? 10 : 12);
  });
  const out = { rows, isFinal, scored: scored.length, filled: rows.filter(r => r.raw || r.rankManual != null).length, total: rows.length };
  CACHE['e' + ev.id] = out;
  return out;
}
function eventDone(ev) {
  const c = computeEvent(ev);
  return c.filled > 0;
}
function prelimOf(ev) {
  if (ev.phase === '预赛') return null;
  return EVENTS.find(x => x.grade === ev.grade && x.gender === ev.gender && x.name === ev.name && x.phase === '预赛') || null;
}
function finalOf(ev) {
  if (ev.phase !== '预赛') return null;
  return EVENTS.find(x => x.grade === ev.grade && x.gender === ev.gender && x.name === ev.name && x.phase !== '预赛') || null;
}

/* ================= 班级总分 ================= */
function standings(grade) {
  const key = 'st' + grade;
  if (CACHE[key]) return CACHE[key];
  const map = {};
  CLASS_LIST.filter(c => gradeOf(c) === grade).forEach(c => {
    map[c] = { cls: c, name: c + '班', pts: 0, g: 0, s: 0, b: 0, pb: 0, items: 0 };
  });
  EVENTS.forEach(ev => {
    if (ev.phase === '预赛') return;
    const c = computeEvent(ev);
    c.rows.forEach(r => {
      if (!r.rank || !r.pts) return;
      const row = map[r.cls];
      if (!row) return;
      row.pts += r.pts; row.items += 1;
      if (r.rank === 1) row.g++; else if (r.rank === 2) row.s++; else if (r.rank === 3) row.b++;
      if (r.pb) row.pb++;
    });
  });
  const list = Object.values(map).sort((a, b) => b.pts - a.pts || b.g - a.g || b.s - a.s);
  CACHE[key] = list;
  return list;
}

/* ================= 学生索引 ================= */
let STUDENTS = {};
function buildStudents() {
  STUDENTS = {};
  EVENTS.forEach(ev => {
    ev.entries.forEach(x => {
      if (!x.n) return;
      const k = x.c + '|' + x.n;
      (STUDENTS[k] || (STUDENTS[k] = { name: x.n, cls: x.c, grade: gradeOf(x.c), evs: [] })).evs.push(ev.id);
    });
  });
}
// 名单改动（临时换人）：启动时先把上次保存的改名回放到秩序册名单上
EVENTS.forEach(ev => ev.entries.forEach(e => { if (e.orig === undefined) e.orig = e.n; }));
function applyRenames() {
  Object.keys(S.renames || {}).forEach(k => {
    const ev = EVENTS[+k];
    if (!ev) return;
    const m = S.renames[k] || {};
    Object.keys(m).forEach(i => {
      const idx = +i, e = ev.entries[idx];
      if (e && m[i]) e.n = m[i];
    });
  });
}
applyRenames();
buildStudents();
function rebuildStudents() { buildStudents(); }
function migrateKey(obj, oldK, newK) {
  if (!obj || oldK === newK || obj[oldK] == null) return;
  obj[newK] = obj[oldK];
  delete obj[oldK];
}
// 临时换人：只改姓名，班级不变；已录成绩、晋级名单随之迁移
function applyRename(evId, ei, ej, newName) {
  const ev = EVENTS[evId];
  const x = ej >= 0 ? (S.extra[evId] || [])[ej] : ev.entries[ei];
  if (!x) return false;
  const cls = x.c, oldName = x.n || '';
  const oldK = oldName ? cls + '|' + oldName : cls;
  const newK = newName ? cls + '|' + newName : cls;
  if (ej >= 0) {
    migrateKey(S.results[evId], oldK + '|x' + ej, newK + '|x' + ej);
    x.n = newName;
  } else {
    migrateKey(S.results[evId], oldK, newK);
    const q = S.quals[evId];
    if (q && q.length) S.quals[evId] = q.map(k => (k === oldK ? newK : k));
    (S.renames[evId] || (S.renames[evId] = {}))[ei] = newName;
    x.n = newName;
  }
  rebuildStudents();
  save();
  return true;
}

/* ================= 全局统计 ================= */
function globalStats() {
  const allEvents = EVENTS.length;
  let doneEv = 0, resultRows = 0, pts = 0;
  EVENTS.forEach(ev => {
    const c = computeEvent(ev);
    if (c.filled > 0) doneEv++;
    resultRows += c.scored;
    if (ev.phase !== '预赛') c.rows.forEach(r => { if (r.pts) pts += r.pts; });
  });
  const stuSet = new Set();
  EVENTS.forEach(ev => ev.entries.forEach(x => { if (x.n) stuSet.add(x.c + '|' + x.n); }));
  return { allEvents, doneEv, resultRows, pts, students: stuSet.size };
}

function meetStatus() {
  const now = new Date();
  const d = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  // 从秩序册的日期里取比赛区间；取不到就不显示倒计时
  const span = meetDateSpan();
  if (!span) return { text: '共 ' + EVENTS.length + ' 个项目', on: false };
  if (d < span[0]) {
    const days = Math.round((new Date(span[0] + 'T00:00:00') - new Date(d + 'T00:00:00')) / 86400000);
    return { text: '距开幕 ' + days + ' 天', on: false };
  }
  if (d > span[1]) return { text: '运动会已结束', on: false };
  return { text: '比赛进行中', on: true };
}
function meetDateSpan() {
  const src = metaDates();
  const m = String(src).match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日(?:[—\-~至]+(\d{1,2})\s*日?)?/);
  if (!m) return null;
  const pad = n => String(n).padStart(2, '0');
  const start = m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  const end = m[4] ? (m[1] + '-' + pad(m[2]) + '-' + pad(m[4])) : start;
  return [start, end];
}
function todayEvents() {
  const now = new Date();

function drawAllCharts() {
  const cv = $('#chartClass');
  if (cv) drawBarChart(cv, standings(boardGrade).map(r => ({ label: r.cls, value: r.pts })), { max: null });
  else requestAnimationFrame(() => {
    const c2 = $('#chartClass');
    if (c2) drawBarChart(c2, standings(boardGrade).map(r => ({ label: r.cls, value: r.pts })), { max: null });
  });
}
function drawBarChart(cv, items, opt) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight || 190;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!items.length) return;
  const padL = 30, padB = 30, padT = 18, padR = 6;
  const maxV = Math.max(1, ...items.map(i => i.value));
  const n = items.length;
  const slot = (w - padL - padR) / n;
  const bw = Math.min(30, slot * 0.6);
  // grid
  ctx.strokeStyle = '#eae4d5'; ctx.lineWidth = 1;
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const y = padT + (h - padT - padB) * t / ticks;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = '#98a097'; ctx.font = '10px system-ui'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxV * (ticks - t) / ticks), padL - 5, y + 3);
  }
  items.forEach((it, i) => {
    const bh = (h - padT - padB) * (it.value / maxV);
    const x = padL + slot * i + (slot - bw) / 2;
    const y = h - padB - bh;
    const grd = ctx.createLinearGradient(0, y, 0, h - padB);
    if (i === 0) { grd.addColorStop(0, '#e2b95f'); grd.addColorStop(1, '#c8962b'); }
    else { grd.addColorStop(0, '#3f9a76'); grd.addColorStop(1, '#1b6a4f'); }
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, bw, Math.max(bh, 1), 4) : ctx.rect(x, y, bw, Math.max(bh, 1));
    ctx.fill();
    ctx.fillStyle = '#5c6860'; ctx.font = '10.5px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(it.label, padL + slot * i + slot / 2, h - padB + 14);
    if (it.value) {
      ctx.fillStyle = '#16211c'; ctx.font = '600 11px system-ui';
      ctx.fillText(it.value, padL + slot * i + slot / 2, y - 4);
    }
  });
}

document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { closeSheet(); go(goEl.dataset.go); return; }
  const tab = e.target.closest('[data-sched]');
  if (tab) { schedFilter = tab.dataset.sched; render(); return; }
  const bd = e.target.closest('[data-board]');
  if (bd) { boardGrade = bd.dataset.board; render(); return; }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'scan') openOcr(+act.dataset.id);
  else if (a === 'paste') openPaste(+act.dataset.id);
  else if (a === 'prelim') applyPrelim(+act.dataset.id);
  else if (a === 'goto-event') { location.hash = '#/event/' + act.dataset.ev; }
  else if (a === 'lock-qual') toggleLockQual(+act.dataset.id);
  else if (a === 'clear') clearEvent(+act.dataset.id);
  else if (a === 'note') openNote(+act.dataset.id, act.dataset.key, act.dataset.i);
  else if (a === 'add') openAdd(+act.dataset.id);
  else if (a === 'rename') openRename(+act.dataset.id, +act.dataset.i);
  else if (a === 'sort-toggle') {
    if (S.settings.sortResult !== false) { S.settings.sortResult = false; save(); render(); toast('已切回秩序册名单顺序'); }
    else { S.settings.sortResult = true; save(); render(); toast('已按成绩排序'); }
  }
  else if (a === 'note-help') toast('「标记」里可设弃权或手动给名次；破纪录由校纪录自动判定');
  else if (a === 'stu') stuDetail(act.dataset.k);
  else if (a === 'evdetail') eventDetailSheet(+act.dataset.id);
  else if (a === 'export') exportJson();
  else if (a === 'csv') exportCsv();
  else if (a === 'reset') resetAll();
  else if (a === 'print') window.print();
  else if (a === 'sheet-close') closeSheet();
});

function bindCamera() {
  const guide = $('#ocrGuide');

    guide.style.width = w + 'px';
    guide.style.height = h + 'px';
    guide.style.left = ((box.width - w) / 2) + 'px';
    guide.style.top = ((box.height - h) / 2) + 'px';
  }
}
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    OCR.stream = stream;
    const v = $('#ocrVideo');
    if (!v) { stream.getTracks().forEach(t => t.stop()); return; }
    v.srcObject = stream;
    await v.play().catch(() => {});
    v.style.width = '100%';
  } catch (err) {
    const v = $('#ocrVideo');
    if (v) v.style.display = 'none';
    const tip = $('#ocrTip');
    if (tip) tip.innerHTML = '摄像头不可用（' + (err.name || '错误') + '）<br>可点下方「相册/文件」选择成绩单照片';

    if (st && !$('#camFallback')) {
      const d = document.createElement('div');
      d.id = 'camFallback';
      d.style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.75);font-size:12.5px;padding:0 30px;line-height:1.8';
      d.innerHTML = '<div><div style="font-size:44px;opacity:.5;margin-bottom:10px">▣</div>当前环境没有可用摄像头<br>点底部「相册/文件」上传成绩单照片<br><span style="color:#f0d296">电脑端建议用手机拍摄后传图</span></div>';
      st.appendChild(d);
    }

}
function stopCamera() {
  if (OCR.stream) { OCR.stream.getTracks().forEach(t => t.stop()); OCR.stream = null; }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-ocr]');
  const tone = e.target.closest('[data-tone]');
  if (tone) {
    OCR.tone = tone.dataset.tone;
    document.querySelectorAll('[data-tone]').forEach(b => b.classList.toggle('on', b === tone));
    if (OCR.matches.length && OCR.source) reReview();
    return;
  }
  if (!t) return;
  const act = t.dataset.ocr;
  if (act === 'close') { closeOcr(); }
  else if (act === 'shoot') { shoot(); }
  else if (act === 'upload') { const f = $('#ocrFile'); if (f) f.click(); }
  else if (act === 'paste') { showPasteInOcr(); }
  else if (act === 'apply') { applyMatches(); }
  else if (act === 'retry') { backToCamera(); }
  else if (act === 'toggleAll') {
    const all = document.querySelectorAll('.ocr-row input[type=checkbox]');
    const on = Array.from(all).every(x => x.checked);

document.addEventListener('change', async e => {
  if (e.target.id === 'ocrFile' && e.target.files && e.target.files[0]) {
    const file = e.target.files[0];
    const img = new Image();

      const src = document.createElement('canvas');
      const maxW = 1700;
      const s = Math.min(1, maxW / img.width);
      src.width = Math.round(img.width * s);
      src.height = Math.round(img.height * s);
      src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);

function shoot() {
  const v = $('#ocrVideo'), guide = $('#ocrGuide');
  if (!v || !v.videoWidth) { toast('还没有画面，试试「相册/文件」'); return; }
  const disp = v.getBoundingClientRect();
  const gr = guide.getBoundingClientRect();
  const scale = Math.min(disp.width / v.videoWidth, disp.height / v.videoHeight);
  const offX = disp.left + (disp.width - v.videoWidth * scale) / 2;
  const offY = disp.top + (disp.height - v.videoHeight * scale) / 2;
  let sx = (gr.left - offX) / scale, sy = (gr.top - offY) / scale;
  let sw = gr.width / scale, sh = gr.height / scale;
  sx = Math.max(0, sx); sy = Math.max(0, sy);
  sw = Math.min(v.videoWidth - sx, sw); sh = Math.min(v.videoHeight - sy, sh);
  const c = document.createElement('canvas');
  c.width = Math.round(sw); c.height = Math.round(sh);
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  recognizeFromCanvas(c);
}
function backToCamera() {
  const ev = EVENTS[OCR.evId];

async function recognizeFromCanvas(src) {

    stage.innerHTML = '';
    const img = new Image();
    img.src = src.toDataURL('image/jpeg', 0.92);

  if (foot) foot.innerHTML = '<button class="btn" data-ocr="close" style="background:transparent;color:#dfe8e0;border-color:rgba(255,255,255,.2)">取消</button>';
  try {
    const prepared = preprocess(src, OCR.tone);
    setProg(0.05, '图像已增强，准备识别', '');
    const text = await runTesseract(prepared);
    OCR.text = text;

  } catch (err) {

    const p = $('#ocrProg');
    if (p) {

        <div style="font-size:11.5px;color:rgba(255,255,255,.7);margin-top:8px;line-height:1.8;max-width:260px;margin-left:auto;margin-right:auto">${esc(err.message || '网络或浏览器限制')}<br>可以直接手动录，或用「粘贴文本」把号码贴进来。</div>
        <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn" data-ocr="retry" style="background:transparent;color:#dfe8e0;border-color:rgba(255,255,255,.25)">重拍</button>
          <button class="btn" data-ocr="paste" style="background:transparent;color:#dfe8e0;border-color:rgba(255,255,255,.25)">粘贴文本</button>
          <button class="btn" data-ocr="close" style="background:#f0d296;color:#20301f;border-color:#f0d296">手动录入</button>
        </div></div>`;

function setProg(p, text, sub) {
  const bar = $('#ocrProgBar'), tx = $('#ocrProgText'), sb = $('#ocrProgSub');
  if (bar) bar.style.width = Math.round(p * 100) + '%';
  if (tx && text) tx.textContent = text;
  if (sb && sub != null) sb.textContent = sub;
}
function preprocess(src, tone) {
  const maxW = 1800;
  const s = Math.min(2, maxW / Math.max(1, src.width));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * s);
  c.height = Math.round(src.height * s);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i] = d[i + 1] = d[i + 2] = g;
  }
  // Otsu
  const hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4) hist[d[i]]++;
  const total = d.length / 4;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = i; }
  }
  for (let i = 0; i < d.length; i += 4) {
    if (tone === 'raw') continue;
    if (tone === 'bw') {
      const v = d[i] > thr ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    } else {
      let v = (d[i] - thr) * 2.2 + 150;
      v = Math.max(0, Math.min(255, v));
      d[i] = d[i + 1] = d[i + 2] = v;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (TESS_LOADING) return TESS_LOADING;
  TESS_LOADING = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://fastly.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = () => res();
    s.onerror = () => rej(new Error('识别引擎加载失败（需联网）'));
    document.head.appendChild(s);
    setTimeout(() => { if (!window.Tesseract) rej(new Error('识别引擎加载超时（需联网）')); }, 25000);
  });
  return TESS_LOADING;
}
async function runTesseract(canvas) {
  await loadTesseract();
  setProg(0.12, '加载识别模型…', '首次使用需要下载约十几 MB，请保持联网');
  let worker;
  const langs = ['chi_sim+eng', 'eng'];
  let lastErr;
  for (const lang of langs) {
    try {
      worker = await Tesseract.createWorker(lang, 1, {
        logger: m => {
          if (typeof m.progress === 'number') {
            const p = 0.12 + m.progress * 0.8;
            const map = { 'loading language traineddata': '下载识别模型', 'initializing api': '初始化引擎', 'recognizing text': '正在识别文字' };
            setProg(p, map[m.status] || m.status, '');
          }
        }
      });
      const { data } = await worker.recognize(canvas);
      await worker.terminate();
      return data.text || '';
    } catch (err) {
      lastErr = err;
      try { if (worker) await worker.terminate(); } catch (e) {}
      worker = null;
    }
  }
  throw new Error('识别失败：' + (lastErr && lastErr.message ? lastErr.message : '未知错误'));
}
/* ---- 文本解析 ---- */
function stripNoise(line) {
  let s = (' ' + line).replace(/2[4-6][1-9]/g, '  ').replace(/\u3000/g, ' ');
  s = s.replace(/^\s*(\d{1,2})\s*[、，,．.]?\s*(?=[^\d\s.])/, ' ');
  return s.replace(/\s+/g, ' ').trim();
}
function extractVal(line, kind) {
  const s = stripNoise(line);
  let m = s.match(/(\d{1,2})\s*['′’]\s*(\d{1,2})(?:\s*["″”]?\s*(\d{1,2}))?/);
  if (m) return m[1] + "'" + m[2] + (m[3] ? '"' + m[3] : '');
  m = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})(?:[.．]\s*(\d{1,2}))?/);
  if (m) return m[1] + ':' + m[2] + (m[3] ? '.' + m[3] : '');
  m = s.match(/\d{1,3}[.．,，]\d{1,2}/);
  if (m) return m[0].replace(/[．,，]/g, '.');
  m = s.match(/\d+(?:[.．]\d+)?\s*(?:m|米)/i);
  if (m) return m[0].replace(/[．]/g, '.');
  m = s.match(/\d{1,4}/g);
  if (m && m.length) {
    // 取最可能是成绩的数字：排除 1~9 的小序号
    const cand = m.filter(x => x.length >= 2).pop() || m.pop();
    return cand;
  }
  return null;
}
function buildMatches(text) {
  const ev = EVENTS[OCR.evId];
  const rows = eventRows(ev);
  const nameIdx = {};
  rows.forEach((r, i) => { if (r.name) (nameIdx[r.name] || (nameIdx[r.name] = [])).push(i); });
  const lines = String(text).split(/\r?\n/).map(x => x.trim()).filter(x => x.length > 0);
  const used = new Set();
  const out = [];
  lines.forEach(line => {
    const v = extractVal(line, ev.kind);
    if (v == null) return;
    let idx = -1, conf = 0.35, why = '顺位';
    const clsM = (' ' + line).match(/2[4-6][1-9]/);
    let nm = null;
    Object.keys(nameIdx).forEach(n => { if (line.indexOf(n) >= 0 && (!nm || n.length > nm.length)) nm = n; });
    if (nm && OCR.mode !== 'index') {
      const list = nameIdx[nm];
      const cand = list.find(i => !used.has(i)) != null ? list.find(i => !used.has(i)) : list[0];
      idx = cand; conf = 0.9; why = '姓名';
      if (clsM && rows[idx].cls === clsM[0]) conf = 0.99;
    }
    if (idx < 0 && clsM) {
      const list = rows.map((r, i) => r.cls === clsM[0] ? i : -1).filter(i => i >= 0 && !used.has(i));
      if (list.length === 1) { idx = list[0]; conf = 0.72; why = '班级'; }
    }
    if (idx < 0) {
      const m = line.match(/^(\d{1,2})\s*[、，,．.]?\s+/);
      if (m) { const n = +m[1] - 1; if (rows[n] && !used.has(n)) { idx = n; conf = 0.62; why = '序号'; } }
    }
    if (idx < 0) {
      idx = rows.findIndex((r, i) => !used.has(i) && !r.raw);
    }
    if (idx < 0) return;
    used.add(idx);
    out.push({ idx, raw: v, conf, why, line });
  });
  OCR.matches = out;
}
function showReview() {
  const ev = EVENTS[OCR.evId];
  const rows = eventRows(ev);
  const body = OCR.matches.map((m, k) => {
    const r = rows[m.idx];
    const lvl = m.conf >= 0.85 ? '高' : m.conf >= 0.6 ? '中' : '低';
    const color = m.conf >= 0.85 ? '#8fe3b0' : m.conf >= 0.6 ? '#f0d296' : '#f0a08e';
    return `<div class="ocr-row">
      <div style="font-size:10.5px;color:rgba(255,255,255,.5)" class="num">${k + 1}</div>
      <div class="who">${r.name || r.cls}<small>${r.cls} · ${m.why}</small></div>
      <input class="ocrv" value="${esc(m.raw)}" data-m="${k}" inputmode="decimal">
      <div style="text-align:right"><span class="conf" style="color:${color}">${lvl}</span><br><input type="checkbox" checked data-c="${k}"></div>
    </div>`;
  }).join('');
  ocrLayer().innerHTML = `
    <div class="ocr-head">
      <b>核对识别结果</b>
      <button class="ocr-close" data-ocr="close">✕</button>
    </div>
    <div class="ocr-chips">
      <span class="chip on" style="cursor:default">共识别 ${OCR.matches.length} 条 / ${rows.length} 人</span>
      <button class="chip" data-ocr="toggleAll">全选/全不选</button>
      <button class="chip" data-ocr="retry">重拍</button>
    </div>
    <div class="ocr-review">
      ${body || '<div class="empty-hint" style="color:#dfe8e0">没有识别到有效成绩，换个角度重拍，或改用「粘贴文本」</div>'}
      <div style="height:10px"></div>
    <div style="font-size:11px;color:rgba(255,255,255,.55);padding:6px 0 2px">识别原文：</div>
    <textarea readonly style="width:100%;height:90px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:rgba(255,255,255,.7);font-size:11px;padding:8px">${esc(OCR.text || '')}</textarea>
    </div>
    <div class="ocr-foot">
      <button class="btn" data-ocr="retry" style="background:transparent;color:#dfe8e0;border-color:rgba(255,255,255,.2)">重拍</button>
      <button class="btn" data-ocr="apply" style="background:#c23b28;border-color:#c23b28;color:#fff">写入成绩（${OCR.matches.length}）</button>
    </div>`;
  document.querySelectorAll('[data-m]').forEach(inp => {
    inp.addEventListener('input', e => {
      const k = +e.target.dataset.m;
      if (OCR.matches[k]) OCR.matches[k].raw = e.target.value;
    });
  });
}
function reReview() {
  if (!OCR.source) return;
  // 换增强方式后重识别
  recognizeFromCanvas(OCR.source);
}
function showPasteInOcr() {
  const ev = EVENTS[OCR.evId];
  ocrLayer().innerHTML = `
    <div class="ocr-head"><b>粘贴识别文本 · ${evTitle(ev)}</b><button class="ocr-close" data-ocr="close">✕</button></div>
    <div class="ocr-review">
      <div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.8;margin-bottom:10px">
        把成绩单上的文字粘进来，一行一人即可。支持「1 韦艺鸿 13.52」「韦艺鸿 13.52」「241 13.52」等写法。
      </div>
      <textarea id="pasteBox" placeholder="1 韦艺鸿 13.52&#10;2 覃钰涵 13.78&#10;3 韦樱诗 14.02" style="width:100%;height:46vh;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;color:#eef4ec;font-size:13.5px;padding:12px;line-height:1.8"></textarea>
    </div>
    <div class="ocr-foot">
      <button class="btn" data-ocr="parsePaste" style="background:#c23b28;border-color:#c23b28;color:#fff">解析</button>
      <button class="btn" data-ocr="retry" style="background:transparent;color:#dfe8e0;border-color:rgba(255,255,255,.2)">返回拍照</button>
    </div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ocr="parsePaste"]');
  if (!t) return;
  const txt = ($('#pasteBox') || {}).value || '';
  if (!txt.trim()) { toast('先粘贴一些文字'); return; }
  OCR.text = txt;
  buildMatches(txt);
  showReview();
});
function applyMatches() {
  const ev = EVENTS[OCR.evId];
  const rows = eventRows(ev);
  const res = S.results[ev.id] || (S.results[ev.id] = {});
  let n = 0;
  document.querySelectorAll('[data-c]').forEach(cb => {
    if (!cb.checked) return;
    const k = +cb.dataset.c;
    const m = OCR.matches[k];
    if (!m) return;
    const inp = document.querySelector('[data-m="' + k + '"]');
    const val = inp ? inp.value.trim() : m.raw;
    if (!val) return;
    const key = rows[m.idx].key;
    (res[key] || (res[key] = {})).raw = val;
    n++;
  });
  save();
  closeOcr();
  render();
  toast('已写入 ' + n + ' 条成绩');
}
function closeOcr() {
  stopCamera();
  ocrLayer().classList.remove('on');
  ocrLayer().innerHTML = '';
  OCR.source = null; OCR.matches = []; OCR.text = '';
}
function openPaste(evId) {
  if (typeof MT_RO !== 'undefined' && MT_RO) { toast('只读模式：没有登分权限'); return; }
  OCR.evId = evId;
  ocrLayer().classList.add('on');
  showPasteInOcr();
}

/* 图片点击放大（成绩预览） */
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('ocr-shot')) {
    const w = window.open('', '_blank');
    if (w) w.document.write('<img src="' + e.target.src + '" style="max-width:100%">');
  }
});

render();
</script>
