let canRestart=false;

function getClickPos(e){
    if(isDisplayRotated()){
        const mapped=mapTouchToGame(e.clientX,e.clientY);
        return {x:mapped.gx, y:mapped.gy};
    }
    const rect=cvs.getBoundingClientRect();
    const scaleX=cvs.width/rect.width,scaleY=cvs.height/rect.height;
    return{x:(e.clientX-rect.left)*scaleX/SF,y:(e.clientY-rect.top)*scaleY/SF};
}

function doJump(){
    if(state!=='playing'||paused)return;
    if(P.gnd){
        const surfY=P.onPlat>=0?P.onPlatH:(P.onCrate>=0?P.onCrateTop:GY);
        P.vy=JUMP_V;P.gnd=false;P.onPlat=-1;P.onCrate=-1;
        playSound('jump');mkParts(PX-P.pushX+PW/2,surfY,6,'#FFD700');
    }
}

function doDuck(on){
    if(state!=='playing'||paused)return;
    if(on){if(P.gnd)P.duck=true;}
    else P.duck=false;
}

function togglePause(){
    if(state!=='playing'&&state!=='bossFight'&&state!=='transitionRoom')return;
    paused=!paused;
}

cvs.addEventListener('click',(e)=>{
    const{x,y}=getClickPos(e);
    if(state==='playing'){
        // Check game buttons first
        if(hitSkillBtn(x,y)){activateSkill();return;}
        if(hitPauseBtn(x,y)){togglePause();return;}
        if(hitUpBtn(x,y)){doJump();return;}
        if(hitDownBtn(x,y)){doDuck(true);setTimeout(()=>{doDuck(false);},250);return;}
        if(paused)return;
        // No fallback - only button icons trigger actions
        return;
    }
    if(state==='mainMenu'){
        if(x>=310&&x<=490&&y>=235&&y<=271)startGame();
        else if(x>=310&&x<=490&&y>=278&&y<=314)state='charShop';
        else if(x>=310&&x<=490&&y>=318&&y<=354)state='levelSelect';
    } else if(state==='charShop'){
        const cardW=100,cardH=130,gapX=12,gapY=8,totalW=cardW*5+gapX*4,startX=400-totalW/2;
        for(let i=0;i<10;i++){
            const row=Math.floor(i/5),col=i%5;
            const cx=startX+col*(cardW+gapX),cy=60+row*(cardH+gapY);
            if(x>=cx&&x<=cx+cardW&&y>=cy&&y<=cy+cardH){
                if(ownedCharacters.indexOf(i)>=0){
                    selectedCharacter=i;
                } else {
                    if(silverBalance>=9999){
                        silverBalance-=9999;
                        ownedCharacters.push(i);
                        selectedCharacter=i;
                        saveLevelProgress();
                        playSound('powerup');
                    } else {
                        playSound('hit');
                    }
                }
                break;
            }
        }
        if(x>=220&&x<=380&&y>=330&&y<=364)state='mainMenu';
        if(x>=420&&x<=580&&y>=330&&y<=364){
            if(ownedCharacters.indexOf(selectedCharacter)>=0){
                state='mainMenu';
            }
        }
    } else if(state==='levelSelect'){
        const cols=5,bSize=60,gap=16,totalW=cols*bSize+(cols-1)*gap,startXG=(800-totalW)/2,startYG=60;
        for(let i=1;i<=15;i++){
            const col=(i-1)%cols,row=Math.floor((i-1)/cols);
            const bx=startXG+col*(bSize+gap),by=startYG+row*(bSize+gap+18);
            if(x>=bx&&x<=bx+bSize&&y>=by&&y<=by+bSize&&i<=maxUnlockedLevel){startGame(i);break;}
        }
        if(x>=320&&x<=480&&y>=340&&y<=378)state='mainMenu';
    } else if(state==='over'){
        if(x>=130&&x<=280&&y>=278&&y<=320){
            if(quizRevivalFailed){quizRevivalAttempts=0;quizRevivalFailed=false;}
            revivePlayer();
        }
        else if(x>=320&&x<=470&&y>=278&&y<=320)restartFromLevel();
        else if(x>=510&&x<=660&&y>=278&&y<=320)goToMainMenu();
    } else if(state==='quizRevival'){
        if(quizCurrentQuestion && !quizAnswered){
            for(var qi=0;qi<quizOptions.length;qi++){
                var oy=160+qi*52;
                if(x>=100&&x<=700&&y>=oy&&y<=oy+42){
                    // Check if option is disabled
                    if(quizDisabledOptions.indexOf(qi) !== -1) break;
                    quizAnsweredIdx = qi;
                    var isCorrect = (qi === quizCorrectIdx);
                    handleQuizAnswer(isCorrect);
                    break;
                }
            }
        }
    } else if(state==='quizResult'){
        // 复活失败画面按钮
        if(x>=100&&x<=280&&y>=200&&y<=242){
            // 继续答题复活：重置次数和失败标记，重新进入答题
            quizRevivalAttempts=0;quizRevivalFailed=false;
            quizRevivalActive=true;quizAnswered=false;
            state='quizRevival';
            revivePlayer();
        }
        if(x>=310&&x<=490&&y>=200&&y<=242)restartFromLevel();
        if(x>=520&&x<=700&&y>=200&&y<=242)goToMainMenu();
    }
    if(state==='bossFight'){
        // Pause button - bottom left (moved up)
        if(x>=12&&x<=67&&y>=338&&y<=360){togglePause();return;}
        if(paused)return;
        const half=BF_BTN/2;
        const upX=BF_CX-half, upY=BF_CY-half-BF_BTN-BF_GAP;
        const dnX=BF_CX-half, dnY=BF_CY+half+BF_GAP;
        const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
        const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
        // Left button
        if(x>=ltX&&x<=ltX+BF_BTN&&y>=ltY&&y<=ltY+BF_BTN){P.moveLeft=true;setTimeout(()=>{P.moveLeft=false;},150);return;}
        // Right button
        if(x>=rtX&&x<=rtX+BF_BTN&&y>=rtY&&y<=rtY+BF_BTN){P.moveRight=true;setTimeout(()=>{P.moveRight=false;},150);return;}
        // Up button
        if(x>=upX&&x<=upX+BF_BTN&&y>=upY&&y<=upY+BF_BTN){P.moveUp=true;setTimeout(()=>{P.moveUp=false;},150);return;}
        // Down button
        if(x>=dnX&&x<=dnX+BF_BTN&&y>=dnY&&y<=dnY+BF_BTN){P.moveDown=true;setTimeout(()=>{P.moveDown=false;},150);return;}
        // Boss skill button (circle at 39,300 r=22) - moved up
        const sdx=x-39,sdy=y-300;
        if(sdx*sdx+sdy*sdy<=22*22){activateBossSkill();return;}
    }
    if(state==='transitionRoom'){
        // Skill button - above pause button
        if(hitSkillBtn(x,y)){activateSkill();return;}
        // Pause button - bottom left (moved up)
        if(x>=12&&x<=67&&y>=338&&y<=360){togglePause();return;}
        if(paused)return;
        const half=BF_BTN/2;
        const upX=BF_CX-half, upY=BF_CY-half-BF_BTN-BF_GAP;
        const dnX=BF_CX-half, dnY=BF_CY+half+BF_GAP;
        const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
        const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
        // Left button
        if(x>=ltX&&x<=ltX+BF_BTN&&y>=ltY&&y<=ltY+BF_BTN){P.moveLeft=true;setTimeout(()=>{P.moveLeft=false;},150);return;}
        // Right button
        if(x>=rtX&&x<=rtX+BF_BTN&&y>=rtY&&y<=rtY+BF_BTN){P.moveRight=true;setTimeout(()=>{P.moveRight=false;},150);return;}
        // Up button
        if(x>=upX&&x<=upX+BF_BTN&&y>=upY&&y<=upY+BF_BTN){P.moveUp=true;setTimeout(()=>{P.moveUp=false;},150);return;}
        // Down button
        if(x>=dnX&&x<=dnX+BF_BTN&&y>=dnY&&y<=dnY+BF_BTN){P.moveDown=true;setTimeout(()=>{P.moveDown=false;},150);return;}
    }
    if(state==='bossReward'){
        if(bossRewardPhase===1 || bossRewardPhase===2){
            // Allow movement
            const half=BF_BTN/2;
            const upX=BF_CX-half, upY=BF_CY-half-BF_BTN-BF_GAP;
            const dnX=BF_CX-half, dnY=BF_CY+half+BF_GAP;
            const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
            const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
            if(x>=ltX&&x<=ltX+BF_BTN&&y>=ltY&&y<=ltY+BF_BTN){P.moveLeft=true;setTimeout(()=>{P.moveLeft=false;},150);return;}
            if(x>=rtX&&x<=rtX+BF_BTN&&y>=rtY&&y<=rtY+BF_BTN){P.moveRight=true;setTimeout(()=>{P.moveRight=false;},150);return;}
            if(x>=upX&&x<=upX+BF_BTN&&y>=upY&&y<=upY+BF_BTN){P.moveUp=true;setTimeout(()=>{P.moveUp=false;},150);return;}
            if(x>=dnX&&x<=dnX+BF_BTN&&y>=dnY&&y<=dnY+BF_BTN){P.moveDown=true;setTimeout(()=>{P.moveDown=false;},150);return;}
        }
        if(bossRewardPhase===3 && bossRewardShowContinue){
            // Continue button at 300,320 to 500,370
            if(x>=300&&x<=500&&y>=320&&y<=370){
                startTransitionRoom();
                return;
            }
        }
    }
    if(state==='bossDefeatReward'){
        if(bossDefeatRewardPhase===3 && bossDefeatShowContinue){
            // Continue button at 300,320 to 500,370
            if(x>=300&&x<=500&&y>=320&&y<=370){
                startTransitionRoom();
                return;
            }
        }
    }
});

document.addEventListener('keydown',e=>{
    const k=e.key;
    if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){
        e.preventDefault();
        if(state==='mainMenu')startGame();
        else if(state==='playing')doJump();
        else if(state==='bossFight'||state==='transitionRoom'||state==='bossReward'||state==='bossDefeatReward')P.moveUp=true;
    }
    if(k==='ArrowDown'||k==='s'||k==='S'){
        e.preventDefault();
        if(state==='playing')doDuck(true);
        else if(state==='bossFight'||state==='transitionRoom'||state==='bossReward'||state==='bossDefeatReward')P.moveDown=true;
    }
    if(k==='ArrowLeft'||k==='a'||k==='A'){
        e.preventDefault();
        if(state==='bossFight'||state==='transitionRoom'||state==='bossReward'||state==='bossDefeatReward')P.moveLeft=true;
    }
    if(k==='ArrowRight'||k==='d'||k==='D'){
        e.preventDefault();
        if(state==='bossFight'||state==='transitionRoom'||state==='bossReward'||state==='bossDefeatReward')P.moveRight=true;
    }
    if(k==='e'||k==='E'){
        if(state==='playing')activateSkill();
        else if(state==='bossFight')activateBossSkill();
    }
    if(k==='j'||k==='J'){
        if(state==='bossFight')activateBossSkill();
    }
    if(k==='Escape'||k==='p'||k==='P'){
        if(state==='charShop')state='mainMenu';
        else if(state==='levelSelect')state='mainMenu';
        else if(state==='playing')togglePause();
        else if(state==='quizRevival'||state==='quizResult')goToMainMenu();
    }
});
document.addEventListener('keyup',e=>{

                    if(gx>=100&&gx<=700&&gy>=oy&&gy<=oy+42){
                        // Check if option is disabled
                        if(quizDisabledOptions.indexOf(qi) !== -1) break;
                        quizAnsweredIdx = qi;
                        var isCorrect = (qi === quizCorrectIdx);
                        handleQuizAnswer(isCorrect);
                        break;
                    }
                }
            }
            return;
        }
        if(state==='quizResult'){
            // 复活失败画面按钮
            if(gx>=100&&gx<=280&&gy>=200&&gy<=242){
                // 继续答题复活：重置次数和失败标记，重新进入答题
                quizRevivalAttempts=0;quizRevivalFailed=false;
                quizRevivalActive=true;quizAnswered=false;
                state='quizRevival';
                revivePlayer();
            }
            if(gx>=310&&gx<=490&&gy>=200&&gy<=242)restartFromLevel();
            if(gx>=520&&gx<=700&&gy>=200&&gy<=242)goToMainMenu();
            return;
        }
        if(state==='playing'){
            // Check buttons first (with multi-touch)
            if(hitSkillBtn(gx,gy)){activateSkill();activeTouches[tid]='skill';continue;}
            if(hitPauseBtn(gx,gy)){togglePause();activeTouches[tid]='pause';continue;}
            if(hitUpBtn(gx,gy)){doJump();activeTouches[tid]='up';continue;}
            if(hitDownBtn(gx,gy)){doDuck(true);activeTouches[tid]='down';continue;}
            if(paused){activeTouches[tid]='other';continue;}
            // No fallback - only button icons trigger actions
            activeTouches[tid]='other';
        }
        if(state==='bossFight'){
            // Pause button - bottom left (moved up)
            if(gx>=12&&gx<=67&&gy>=338&&gy<=360){togglePause();activeTouches[tid]='pause';continue;}
            if(paused){activeTouches[tid]='other';continue;}
            const half=BF_BTN/2;
            const upX=BF_CX-half, upY=BF_CY-half-BF_BTN-BF_GAP;
            const dnX=BF_CX-half, dnY=BF_CY+half+BF_GAP;
            const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
            const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
            // Left button
            if(gx>=ltX&&gx<=ltX+BF_BTN&&gy>=ltY&&gy<=ltY+BF_BTN){P.moveLeft=true;activeTouches[tid]='left';continue;}
            // Right button
            if(gx>=rtX&&gx<=rtX+BF_BTN&&gy>=rtY&&gy<=rtY+BF_BTN){P.moveRight=true;activeTouches[tid]='right';continue;}
            // Up button
            if(gx>=upX&&gx<=upX+BF_BTN&&gy>=upY&&gy<=upY+BF_BTN){P.moveUp=true;activeTouches[tid]='up2';continue;}
            // Down button
            if(gx>=dnX&&gx<=dnX+BF_BTN&&gy>=dnY&&gy<=dnY+BF_BTN){P.moveDown=true;activeTouches[tid]='down2';continue;}
            // Boss skill button (circle at 39,300 r=22) - moved up
            const sdx=gx-39,sdy=gy-300;
            if(sdx*sdx+sdy*sdy<=22*22){activateBossSkill();activeTouches[tid]='skill2';continue;}
        }
        if(state==='transitionRoom'){
            // Skill button - above pause button
            if(hitSkillBtn(gx,gy)){activateSkill();activeTouches[tid]='skill';continue;}
            // Pause button - bottom left (moved up)
            if(gx>=12&&gx<=67&&gy>=338&&gy<=360){togglePause();activeTouches[tid]='pause';continue;}
            if(paused){activeTouches[tid]='other';continue;}
            const half=BF_BTN/2;
            const upX=BF_CX-half, upY=BF_CY-half-BF_BTN-BF_GAP;
            const dnX=BF_CX-half, dnY=BF_CY+half+BF_GAP;
            const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
            const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
            // Left button
            if(gx>=ltX&&gx<=ltX+BF_BTN&&gy>=ltY&&gy<=ltY+BF_BTN){P.moveLeft=true;activeTouches[tid]='left';continue;}
            // Right button
            if(gx>=rtX&&gx<=rtX+BF_BTN&&gy>=rtY&&gy<=rtY+BF_BTN){P.moveRight=true;activeTouches[tid]='right';continue;}
            // Up button
            if(gx>=upX&&gx<=upX+BF_BTN&&gy>=upY&&gy<=upY+BF_BTN){P.moveUp=true;activeTouches[tid]='up2';continue;}
            // Down button
            if(gx>=dnX&&gx<=dnX+BF_BTN&&gy>=dnY&&gy<=dnY+BF_BTN){P.moveDown=true;activeTouches[tid]='down2';continue;}
        }
        if(state==='bossReward' && (bossRewardPhase===1 || bossRewardPhase===2)){
            const half=BF_BTN/2;
            const upX=BF_CX-half, upY=BF_CY-half-BF_BTN-BF_GAP;
            const dnX=BF_CX-half, dnY=BF_CY+half+BF_GAP;
            const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
            const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
            if(gx>=ltX&&gx<=ltX+BF_BTN&&gy>=ltY&&gy<=ltY+BF_BTN){P.moveLeft=true;activeTouches[tid]='left';continue;}
            if(gx>=rtX&&gx<=rtX+BF_BTN&&gy>=rtY&&gy<=rtY+BF_BTN){P.moveRight=true;activeTouches[tid]='right';continue;}
            if(gx>=upX&&gx<=upX+BF_BTN&&gy>=upY&&gy<=upY+BF_BTN){P.moveUp=true;activeTouches[tid]='up2';continue;}
            if(gx>=dnX&&gx<=dnX+BF_BTN&&gy>=dnY&&gy<=dnY+BF_BTN){P.moveDown=true;activeTouches[tid]='down2';continue;}
        }
        if(state==='bossReward' && bossRewardPhase===3 && bossRewardShowContinue){
            if(gx>=300&&gx<=500&&gy>=320&&gy<=370){
                lives=Math.min(lives+3, 5);
                coinCount+=20;
                totalCoinsInLevel+=20;
                startTransitionRoom();
                continue;
            }
        }
        if(state==='bossDefeatReward' && (bossDefeatRewardPhase===1 || bossDefeatRewardPhase===2)){
            const half=BF_BTN/2;
            const upX=BF_CX-half, upY=BF_CY-half-BF_BTN-BF_GAP;
            const dnX=BF_CX-half, dnY=BF_CY+half+BF_GAP;
            const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
            const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
            if(gx>=ltX&&gx<=ltX+BF_BTN&&gy>=ltY&&gy<=ltY+BF_BTN){P.moveLeft=true;activeTouches[tid]='left';continue;}
            if(gx>=rtX&&gx<=rtX+BF_BTN&&gy>=rtY&&gy<=rtY+BF_BTN){P.moveRight=true;activeTouches[tid]='right';continue;}
            if(gx>=upX&&gx<=upX+BF_BTN&&gy>=upY&&gy<=upY+BF_BTN){P.moveUp=true;activeTouches[tid]='up2';continue;}
            if(gx>=dnX&&gx<=dnX+BF_BTN&&gy>=dnY&&gy<=dnY+BF_BTN){P.moveDown=true;activeTouches[tid]='down2';continue;}
        }
        if(state==='bossDefeatReward' && bossDefeatRewardPhase===3 && bossDefeatShowContinue){
            if(gx>=300&&gx<=500&&gy>=320&&gy<=370){
                startTransitionRoom();
                continue;
            }
        }
    }
},{passive:false});

cvs.addEventListener('touchend',e=>{
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i];
        const tid=t.identifier;
        const action=activeTouches[tid];
        if(action==='down')doDuck(false);
        if(action==='left')P.moveLeft=false;
        if(action==='right')P.moveRight=false;
        if(action==='up2')P.moveUp=false;
        if(action==='down2')P.moveDown=false;
        if(action==='shoot'||action==='skill2'){/* boss skill is single-press */}
        delete activeTouches[tid];
    }
    // If no touches remain, ensure duck is released
    if(Object.keys(activeTouches).length===0)P.duck=false;
},{passive:false});

cvs.addEventListener('touchcancel',e=>{
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++){
        const t=e.changedTouches[i];
        const tid=t.identifier;
        const action=activeTouches[tid];
        if(action==='down')doDuck(false);
        if(action==='left')P.moveLeft=false;
        if(action==='right')P.moveRight=false;
        if(action==='up2')P.moveUp=false;
        if(action==='down2')P.moveDown=false;
        if(action==='shoot'||action==='skill2'){/* boss skill is single-press */}
        delete activeTouches[tid];
    }
    if(Object.keys(activeTouches).length===0)P.duck=false;
},{passive:false});

// Refresh rate compensation: run multiple logic updates per frame to match 240Hz experience
let _lastFrameTs=0;
const TARGET_FPS=240;
const TARGET_FRAME_MS=1000/TARGET_FPS;
(function loop(ts){
    try{
        if(!_lastFrameTs){_lastFrameTs=ts;update();draw();requestAnimationFrame(loop);return;}
        let dt=ts-_lastFrameTs;
        _lastFrameTs=ts;
        if(dt>100)dt=100; // cap to prevent spiral of death
        const steps=Math.max(1,Math.round(dt/TARGET_FRAME_MS));
        for(let i=0;i<steps;i++) update();
        draw();
    }catch(e){console.error('Loop error:',e);ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;}
    requestAnimationFrame(loop);
})();
