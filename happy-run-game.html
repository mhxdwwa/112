            c.fillStyle='rgba(150,150,150,0.3)';
            for(let i=0;i<3;i++){const sx=cx-6+Math.sin(fc*0.1+i)*4,sy=bootY+10+i*3;c.beginPath();c.arc(sx,sy,2,0,Math.PI*2);c.fill();}
        } else if(selectedCharacter===9){
            // 翠烟 - 翠雾旋 (Jade mist swirl)
            const cloudY=py+PH-5;
            const mistGrad=c.createRadialGradient(cx,cloudY,3,cx,cloudY,18);
            mistGrad.addColorStop(0,'rgba(0,184,148,0.7)');
            mistGrad.addColorStop(0.5,'rgba(232,245,233,0.4)');
            mistGrad.addColorStop(1,'rgba(0,184,148,0)');
            c.fillStyle=mistGrad;
            c.beginPath();c.ellipse(cx,cloudY,18,10,0,0,Math.PI*2);c.fill();
            c.fillStyle='rgba(232,245,233,0.6)';
            for(let i=0;i<6;i++){const angle=fc*0.1+i*Math.PI/3,r=10+Math.sin(fc*0.12+i)*4;
            const sx=cx+Math.cos(angle)*r,sy=cloudY+Math.sin(angle)*r*0.4;
            c.beginPath();c.arc(sx,sy,1.5,0,Math.PI*2);c.fill();}
            c.strokeStyle='rgba(0,184,148,0.3)';c.lineWidth=1;
            for(let i=0;i<3;i++){const tx=cx-8-i*5,ty=cloudY+Math.sin(fc*0.15+i)*2;c.beginPath();c.moveTo(tx,ty);c.quadraticCurveTo(tx-4,ty+2,tx-8,ty);c.stroke();}
        }
    }
    if(hasShield){c.strokeStyle='rgba(0,200,255,0.6)';c.lineWidth=2.5;c.setLineDash([4,3]);c.beginPath();c.arc(cx,py+PH/2,PW/2+8,0,Math.PI*2);c.stroke();c.setLineDash([]);}
    const running=P.gnd&&wingTimer<=0,jumping=!P.gnd&&wingTimer<=0,flyMode=wingTimer>0;
    const legSwing=running?Math.sin(P.af*0.18)*12:0;
    const bounce=running?Math.abs(Math.sin(P.af*0.18))*1.5:0;
    if(selectedCharacter===1)drawFlameGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===2)drawIceGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===3)drawMechGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===4)drawAssassinGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===5)drawDragonGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===6)drawPhoenixGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===7)drawInkGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===8)drawHammerGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else if(selectedCharacter===9)drawJadeGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    else drawNinjaGameplay(c,cx,py,bounce,ducking,jumping,flyMode,legSwing);
    }finally{c.globalAlpha=1;c.restore();}
}

// Vibrant colors, big expressive eyes, dynamic designs

function drawAnimeLegs(c,cx,bodyBot,legSwing,pantsCol,shoeCol,flyMode,flyBob,accentCol){
    c.strokeStyle=pantsCol;c.lineWidth=6;c.lineCap='round';
    if(flyMode){
        // Always animate legs dynamically during flight
        const flyLegSwing = Math.sin(fc*0.25)*10;
        const flyLegSwing2 = Math.cos(fc*0.2)*6;
        // Left leg - dynamic streaming pose
        c.beginPath();c.moveTo(cx-4,bodyBot+flyBob);c.lineTo(cx-8+flyLegSwing*0.6,bodyBot+12+flyBob);c.stroke();
        c.fillStyle=shoeCol;
        c.beginPath();c.ellipse(cx-8+flyLegSwing*0.6,bodyBot+13+flyBob,6,3.5,flyLegSwing*0.02,0,Math.PI*2);c.fill();
        c.fillStyle=accentCol||'rgba(255,255,255,0.3)';
        c.beginPath();c.ellipse(cx-8+flyLegSwing*0.6,bodyBot+11+flyBob,3,1.5,0,0,Math.PI*2);c.fill();
        // Right leg - offset dynamic pose
        c.strokeStyle=pantsCol;
        c.beginPath();c.moveTo(cx+2,bodyBot+flyBob);c.lineTo(cx-2+flyLegSwing2*0.5,bodyBot+14+flyBob);c.stroke();
        c.fillStyle=shoeCol;
        c.beginPath();c.ellipse(cx-2+flyLegSwing2*0.5,bodyBot+15+flyBob,6,3.5,flyLegSwing2*0.02,0,Math.PI*2);c.fill();
        c.fillStyle=accentCol||'rgba(255,255,255,0.3)';
        c.beginPath();c.ellipse(cx-2+flyLegSwing2*0.5,bodyBot+13+flyBob,3,1.5,0,0,Math.PI*2);c.fill();
        // Wind trail particles behind legs
        c.strokeStyle=`rgba(255,255,255,0.2)`;c.lineWidth=1;
        for(let i=0;i<2;i++){const tx=cx-12-i*6+flyLegSwing*0.3,ty=bodyBot+10+flyBob+Math.sin(fc*0.3+i)*2;c.beginPath();c.moveTo(tx,ty);c.lineTo(tx-8,ty+1);c.stroke();}
    } else {
        c.beginPath();c.moveTo(cx-3,bodyBot);c.lineTo(cx-3-legSwing*0.8,bodyBot+13);c.stroke();
        c.fillStyle=shoeCol;
        c.beginPath();c.ellipse(cx-1-legSwing*0.8,bodyBot+14,6,4,0.1,0,Math.PI*2);c.fill();
        c.fillStyle=accentCol||'rgba(255,255,255,0.4)';
        c.beginPath();c.ellipse(cx-1-legSwing*0.8,bodyBot+12,3,2,0,0,Math.PI*2);c.fill();
        c.strokeStyle=pantsCol;
        c.beginPath();c.moveTo(cx+3,bodyBot);c.lineTo(cx+3+legSwing*0.8,bodyBot+13);c.stroke();
        c.fillStyle=shoeCol;
        c.beginPath();c.ellipse(cx+5+legSwing*0.8,bodyBot+14,6,4,0.1,0,Math.PI*2);c.fill();
        c.fillStyle=accentCol||'rgba(255,255,255,0.4)';
        c.beginPath();c.ellipse(cx+5+legSwing*0.8,bodyBot+12,3,2,0,0,Math.PI*2);c.fill();
    }
}

function drawAnimeArms(c,cx,bodyTop,skinCol,flyMode,flyBob,accentCol){
    c.strokeStyle=skinCol;c.lineWidth=5;c.lineCap='round';
    if(flyMode){
        // Dynamic flying arm pose - arms streaming behind with animation
        const armSwing = Math.sin(fc*0.2)*5;
        const armSwing2 = Math.cos(fc*0.18)*4;
        // Left arm - flowing back
        c.beginPath();c.moveTo(cx-6,bodyTop+5+flyBob);c.lineTo(cx-16+armSwing,bodyTop+2+flyBob);c.stroke();
        c.fillStyle=skinCol;c.beginPath();c.arc(cx-16+armSwing,bodyTop+2+flyBob,3.5,0,Math.PI*2);c.fill();
        // Right arm - offset flowing
        c.beginPath();c.moveTo(cx+5,bodyTop+5+flyBob);c.lineTo(cx+14+armSwing2,bodyTop+0+flyBob);c.stroke();
        c.fillStyle=skinCol;c.beginPath();c.arc(cx+14+armSwing2,bodyTop+0+flyBob,3.5,0,Math.PI*2);c.fill();
        // Wind trails behind arms
        c.strokeStyle=`rgba(255,255,255,0.15)`;c.lineWidth=1;
        for(let i=0;i<2;i++){const tx=cx-18+armSwing-i*5,ty=bodyTop+3+flyBob+Math.sin(fc*0.25+i)*2;c.beginPath();c.moveTo(tx,ty);c.lineTo(tx-6,ty+1);c.stroke();}
    } else {
        const aSwing=Math.sin(fc*0.18)*5;
        c.beginPath();c.moveTo(cx-6,bodyTop+3);c.lineTo(cx-14,bodyTop+8+aSwing);c.stroke();
        c.fillStyle=skinCol;c.beginPath();c.arc(cx-14,bodyTop+8+aSwing,3,0,Math.PI*2);c.fill();
        c.strokeStyle=skinCol;
        c.beginPath();c.moveTo(cx+6,bodyTop+3);c.lineTo(cx+14,bodyTop+8-aSwing);c.stroke();
        c.fillStyle=skinCol;c.beginPath();c.arc(cx+14,bodyTop+8-aSwing,3,0,Math.PI*2);c.fill();
    }
}

function drawAnimeHead(c,cx,headCY,faceCol,hairCol,hairStyle){
    // hairStyle: 'twintail','spiky','flowing','helmet','long'
    // Head - slightly larger for anime proportions
    c.fillStyle=faceCol;
    c.beginPath();c.arc(cx+2,headCY,17,0,Math.PI*2);c.fill();
    // Hair back volume
    c.fillStyle=hairCol;
    c.beginPath();c.arc(cx+2,headCY-3,17,Math.PI*0.55,Math.PI*2.45);c.fill();
    // Side hair
    c.beginPath();c.ellipse(cx-7,headCY,11,14,-0.12,0,Math.PI*2);c.fill();
    // Hair style specifics
    if(hairStyle==='twintail'){
        // Twin tails
        c.beginPath();c.moveTo(cx-10,headCY-2);c.quadraticCurveTo(cx-22,headCY+5,cx-20,headCY+22);c.lineTo(cx-15,headCY+20);c.quadraticCurveTo(cx-17,headCY+5,cx-7,headCY);c.closePath();c.fill();
        c.beginPath();c.moveTo(cx+14,headCY-2);c.quadraticCurveTo(cx+26,headCY+5,cx+24,headCY+22);c.lineTo(cx+19,headCY+20);c.quadraticCurveTo(cx+21,headCY+5,cx+11,headCY);c.closePath();c.fill();
        // Hair ties
        c.fillStyle='#00FFCC';
        c.beginPath();c.arc(cx-12,headCY,3,0,Math.PI*2);c.fill();
        c.beginPath();c.arc(cx+16,headCY,3,0,Math.PI*2);c.fill();
    } else if(hairStyle==='spiky'){
        // Spiky flame hair
        c.fillStyle=hairCol;
        c.beginPath();c.moveTo(cx-8,headCY-14);c.lineTo(cx-4,headCY-28);c.lineTo(cx,headCY-16);c.lineTo(cx+5,headCY-30);c.lineTo(cx+8,headCY-14);c.lineTo(cx+12,headCY-26);c.lineTo(cx+16,headCY-12);c.closePath();c.fill();
    } else if(hairStyle==='flowing'){
        // Flowing long hair
        c.beginPath();c.moveTo(cx-10,headCY+2);c.quadraticCurveTo(cx-14,headCY+20,cx-12,headCY+32);c.lineTo(cx-7,headCY+30);c.quadraticCurveTo(cx-9,headCY+18,cx-6,headCY+2);c.closePath();c.fill();
        c.beginPath();c.moveTo(cx+14,headCY+2);c.quadraticCurveTo(cx+18,headCY+20,cx+16,headCY+32);c.lineTo(cx+11,headCY+30);c.quadraticCurveTo(cx+13,headCY+18,cx+10,headCY+2);c.closePath();c.fill();
    } else if(hairStyle==='long'){
        // Long straight dark hair
        c.beginPath();c.moveTo(cx-10,headCY+2);c.quadraticCurveTo(cx-13,headCY+18,cx-11,headCY+30);c.lineTo(cx-6,headCY+28);c.quadraticCurveTo(cx-8,headCY+16,cx-6,headCY+2);c.closePath();c.fill();
        c.beginPath();c.moveTo(cx+14,headCY+2);c.quadraticCurveTo(cx+17,headCY+18,cx+15,headCY+30);c.lineTo(cx+10,headCY+28);c.quadraticCurveTo(cx+12,headCY+16,cx+10,headCY+2);c.closePath();c.fill();
    }
    // Bangs (anime style - sharp, layered)
    c.fillStyle=hairCol;
    c.beginPath();
    c.moveTo(cx+12,headCY-15);
    c.quadraticCurveTo(cx+20,headCY-10,cx+20,headCY-3);
    c.quadraticCurveTo(cx+17,headCY-5,cx+15,headCY-9);
    c.quadraticCurveTo(cx+14,headCY-3,cx+12,headCY-7);
    c.quadraticCurveTo(cx+10,headCY-1,cx+8,headCY-5);
    c.quadraticCurveTo(cx+6,headCY+1,cx+4,headCY-4);
    c.closePath();c.fill();
    // Hair shine
    c.fillStyle='rgba(255,255,255,0.25)';
    c.beginPath();c.ellipse(cx+1,headCY-13,6,2.5,0.15,0,Math.PI*2);c.fill();
    // Human ears
    c.fillStyle=faceCol;
    c.beginPath();c.ellipse(cx-8,headCY+2,3.5,4.5,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(cx+12,headCY+2,3.5,4.5,0,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(255,180,160,0.5)';
    c.beginPath();c.ellipse(cx-8,headCY+2,2,3,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(cx+12,headCY+2,2,3,0,0,Math.PI*2);c.fill();
}

function drawAnimeFace(c,cx,headCY,irisCol1,irisCol2,jumping,flyMode){
    const faceCX=cx+2;
    // Large anime eyes
    // Left eye - white
    c.fillStyle='#FFF';
    c.beginPath();c.ellipse(faceCX-5,headCY+1,5.5,7,0,0,Math.PI*2);c.fill();
    // Left iris - gradient effect
    const lgr=c.createRadialGradient(faceCX-5,headCY+2,1,faceCX-5,headCY+1,5);
    lgr.addColorStop(0,irisCol1);lgr.addColorStop(1,irisCol2);
    c.fillStyle=lgr;
    c.beginPath();c.ellipse(faceCX-5,headCY+1.5,4,5.5,0,0,Math.PI*2);c.fill();
    // Left pupil
    c.fillStyle='#111';
    c.beginPath();c.ellipse(faceCX-4.5,headCY+2,2.2,3,0,0,Math.PI*2);c.fill();
    // Left eye highlights
    c.fillStyle='#FFF';
    c.beginPath();c.arc(faceCX-6.5,headCY-0.5,2,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(faceCX-3,headCY+4,1,0,Math.PI*2);c.fill();
    // Left eyelash
    c.strokeStyle='rgba(40,20,40,0.8)';c.lineWidth=2;c.lineCap='round';
    c.beginPath();c.arc(faceCX-5,headCY-3,5.5,Math.PI+0.5,-0.2);c.stroke();

    // Right eye - white
    c.fillStyle='#FFF';
    c.beginPath();c.ellipse(faceCX+6,headCY+1,6,7.5,0,0,Math.PI*2);c.fill();
    // Right iris
    const rgr=c.createRadialGradient(faceCX+6,headCY+2,1,faceCX+6,headCY+1,5.5);
    rgr.addColorStop(0,irisCol1);rgr.addColorStop(1,irisCol2);
    c.fillStyle=rgr;
    c.beginPath();c.ellipse(faceCX+6.5,headCY+1.5,4.5,6,0,0,Math.PI*2);c.fill();
    // Right pupil
    c.fillStyle='#111';
    c.beginPath();c.ellipse(faceCX+7,headCY+2,2.5,3.2,0,0,Math.PI*2);c.fill();
    // Right eye highlights
    c.fillStyle='#FFF';
    c.beginPath();c.arc(faceCX+4.5,headCY-0.5,2.2,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(faceCX+8.5,headCY+4,1.2,0,Math.PI*2);c.fill();
    // Right eyelash
    c.strokeStyle='rgba(40,20,40,0.8)';c.lineWidth=2;
    c.beginPath();c.arc(faceCX+6,headCY-3.5,6,Math.PI+0.5,-0.2);c.stroke();

    // Eyebrows
    c.strokeStyle='rgba(60,30,60,0.7)';c.lineWidth=1.8;c.lineCap='round';
    if(jumping){
        c.beginPath();c.arc(faceCX-5,headCY-7,4,Math.PI+0.3,-0.3);c.stroke();
        c.beginPath();c.arc(faceCX+6,headCY-8,4.5,Math.PI+0.3,-0.3);c.stroke();
    } else {
        c.beginPath();c.arc(faceCX-5,headCY-6,3.5,Math.PI+0.4,-0.4);c.stroke();
        c.beginPath();c.arc(faceCX+6,headCY-7,4,Math.PI+0.4,-0.4);c.stroke();
    }
    // Blush
    c.fillStyle='rgba(255,140,170,0.45)';
    c.beginPath();c.ellipse(faceCX-9,headCY+7,4,2.2,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(faceCX+11,headCY+7,4.5,2.5,0,0,Math.PI*2);c.fill();
    // Small nose
    c.fillStyle='rgba(255,180,160,0.6)';
    c.beginPath();c.arc(faceCX+2,headCY+5,1.2,0,Math.PI*2);c.fill();
    // Mouth
    c.strokeStyle='#E06070';c.lineWidth=1.5;c.lineCap='round';
    if(jumping){
        c.fillStyle='#FF9999';c.beginPath();c.ellipse(faceCX+2,headCY+9,3.5,2.5,0,0,Math.PI*2);c.fill();
        c.strokeStyle='#E06070';c.beginPath();c.ellipse(faceCX+2,headCY+9,3.5,2.5,0,0,Math.PI*2);c.stroke();
    } else if(flyMode){
        c.beginPath();c.arc(faceCX+1,headCY+8,4,0.1,Math.PI-0.1);c.stroke();
    } else {
        c.beginPath();c.arc(faceCX+1,headCY+8,2.5,0.2,Math.PI-0.2);c.stroke();
    }
}

function drawDuckingAnime(c,cx,py,headCY,bodyCY,bodyCol,accentCol,legCol,shoeCol,armCol,faceCol,hairCol,hairStyle,irisCol1,irisCol2,drawAccessory){
    c.strokeStyle=legCol;c.lineWidth=5;c.lineCap='round';
    c.beginPath();c.moveTo(cx-2,bodyCY+6);c.lineTo(cx-4,py+28);c.stroke();
    c.beginPath();c.moveTo(cx+2,bodyCY+6);c.lineTo(cx+4,py+28);c.stroke();
    c.fillStyle=shoeCol;
    c.beginPath();c.ellipse(cx-4,py+29,5,3,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(cx+4,py+29,5,3,0,0,Math.PI*2);c.fill();

    c.beginPath();c.ellipse(cx,bodyCY,12,9,0,0,Math.PI*2);c.fill();
    if(accentCol){c.fillStyle=accentCol;c.beginPath();c.arc(cx,bodyCY+1,4,0,Math.PI*2);c.fill();}

// Draw character-specific weapon in hand
function drawWeapon(c,cx,bodyTop,flyMode,flyBob,charIndex){
    const aSwing = flyMode ? 0 : Math.sin(fc*0.18)*5;
    const handX = cx+14;
    const handY = bodyTop+8-aSwing+flyBob;
    const handLX = cx-14;
    const handLY = bodyTop+8+aSwing+flyBob;
    
    if(charIndex===0){
        // 星刃 - Glowing energy fan (扇子)
        c.save();
        c.translate(handX+2, handY-2);
        const fanAngle = flyMode ? -0.3 : Math.sin(fc*0.12)*0.3-0.5;
        c.rotate(fanAngle);
        // Fan ribs
        for(let i=0;i<5;i++){
            const a = -Math.PI*0.5 + i*Math.PI*0.25;
            c.strokeStyle='rgba(0,255,204,0.6)';c.lineWidth=1;
            c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*22,Math.sin(a)*22);c.stroke();
        }
        // Fan surface
        c.fillStyle='rgba(0,255,204,0.25)';
        c.beginPath();c.moveTo(0,0);
        c.arc(0,0,22,-Math.PI*0.5,-Math.PI*0.5+Math.PI);
        c.closePath();c.fill();
        // Fan glow
        c.fillStyle='rgba(0,255,204,0.15)';
        c.beginPath();c.arc(0,0,24,-Math.PI*0.5,-Math.PI*0.5+Math.PI);c.closePath();c.fill();
        // Handle
        c.fillStyle='#335';c.fillRect(-1.5,0,3,8);
        c.restore();
    } else if(charIndex===1){
        // 炎灵 - Fire staff (火棍)
        c.save();
        c.translate(handX+2, handY);
        const staffAngle = flyMode ? -0.2 : Math.sin(fc*0.1)*0.15-0.8;
        c.rotate(staffAngle);
        // Staff shaft
        c.strokeStyle='#8B4513';c.lineWidth=3;c.lineCap='round';
        c.beginPath();c.moveTo(0,6);c.lineTo(0,-32);c.stroke();
        // Wrapping
        c.strokeStyle='#CC6600';c.lineWidth=1;
        for(let i=0;i<4;i++){c.beginPath();c.moveTo(-2,2-i*4);c.lineTo(2,4-i*4);c.stroke();}
        // Flame tip
        const fl = 8+Math.sin(fc*0.3)*3;
        const flGrad=c.createLinearGradient(0,-32,0,-32-fl);
        flGrad.addColorStop(0,'rgba(255,200,0,0.9)');flGrad.addColorStop(0.5,'rgba(255,100,0,0.7)');flGrad.addColorStop(1,'rgba(255,0,0,0)');
        c.fillStyle=flGrad;
        c.beginPath();c.moveTo(-4,-32);c.quadraticCurveTo(0,-32-fl,4,-32);c.closePath();c.fill();
        // Side flames
        c.fillStyle='rgba(255,150,0,0.5)';
        c.beginPath();c.moveTo(-3,-18);c.quadraticCurveTo(-6,-22-Math.sin(fc*0.4)*2,-2,-16);c.closePath();c.fill();
        c.beginPath();c.moveTo(3,-18);c.quadraticCurveTo(6,-22-Math.cos(fc*0.4)*2,2,-16);c.closePath();c.fill();
        c.restore();
    } else if(charIndex===2){
        // 冰语 - Crystal wand (水晶魔杖)
        c.save();
        c.translate(handX+2, handY-2);
        const wandAngle = flyMode ? -0.1 : Math.sin(fc*0.1)*0.1-0.6;
        c.rotate(wandAngle);
        // Wand shaft
        c.strokeStyle='#AADDFF';c.lineWidth=2;c.lineCap='round';
        c.beginPath();c.moveTo(0,6);c.lineTo(0,-22);c.stroke();
        // Crystal tip
        c.fillStyle='rgba(136,204,255,0.8)';c.strokeStyle='rgba(200,240,255,0.9)';c.lineWidth=1;
        c.beginPath();c.moveTo(0,-22);c.lineTo(6,-30);c.lineTo(0,-38);c.lineTo(-6,-30);c.closePath();
        c.fill();c.stroke();
        // Crystal sparkle
        const sparkle=Math.sin(fc*0.15)*0.5+0.5;
        c.fillStyle=`rgba(255,255,255,${sparkle*0.8})`;

// ===== Menu Screens =====
function drawGameButtons(c){
    // Compute pressed states from active touches
    let upPressed=false, dnPressed=false;
    for(const tid in activeTouches){
        if(activeTouches[tid]==='up')upPressed=true;
        if(activeTouches[tid]==='down')dnPressed=true;
    }
    
    // Skill button: above pause button (bottom left) - moved up for mobile
    const skillX=35, skillY=305, skillR=18;
    const canUseSkill = skillReady && !skillActive && coinCount >= charSkillCosts[selectedCharacter];
    const skillActiveGlow = skillActive ? Math.sin(fc*0.2)*0.3+0.7 : 0;
    
    // Skill button background
    if(canUseSkill){
        // Glowing when ready
        const glowGrad=c.createRadialGradient(skillX,skillY,skillR*0.5,skillX,skillY,skillR*1.5);
        glowGrad.addColorStop(0,'rgba(255,204,0,0.8)');
        glowGrad.addColorStop(1,'rgba(255,204,0,0)');
        c.fillStyle=glowGrad;
        c.beginPath();c.arc(skillX,skillY,skillR*1.5,0,Math.PI*2);c.fill();
        
        c.fillStyle='rgba(255,204,0,0.9)';
    } else if(skillActive){
        // Active skill indicator
        c.fillStyle=`rgba(100,255,100,${skillActiveGlow})`;
    } else {
        // Grayed out
        c.fillStyle='rgba(100,100,100,0.6)';
    }
    c.beginPath();c.arc(skillX,skillY,skillR,0,Math.PI*2);c.fill();
    
    // Skill button border
    c.strokeStyle=canUseSkill?'#ffcc00':(skillActive?'#66ff66':'rgba(255,255,255,0.3)');
    c.lineWidth=canUseSkill?2:1;
    c.beginPath();c.arc(skillX,skillY,skillR,0,Math.PI*2);c.stroke();
    
    // Skill icon text
    c.fillStyle=canUseSkill||skillActive?'#fff':'#888';
    c.font='bold 14px Arial';
    c.textAlign='center';
    c.fillText('技',skillX,skillY+5);
    // Cost display
    if(!skillActive){
        c.fillStyle=canUseSkill?'#ffcc00':'#888';
        c.font='bold 8px Arial';
        c.fillText(charSkillCosts[selectedCharacter]+'★',skillX,skillY+16);
    }
    
    // Skill timer display when active
    if(skillActive){
        const remaining = Math.ceil(skillTimer/60);
        c.fillStyle='rgba(0,0,0,0.7)';
        c.beginPath();c.roundRect(skillX-15,skillY-25,30,14,3);c.fill();
        c.fillStyle='#66ff66';
        c.font='bold 10px Arial';
        c.fillText(remaining+'s',skillX,skillY-15);
    }
    
    // Pause/Settings button: bottom left (smaller) - moved up for mobile
    const pbX=10, pbY=338, pbW=50, pbH=22;
    c.fillStyle=paused?'rgba(46,204,113,0.7)':'rgba(0,0,0,0.4)';
    c.beginPath();c.roundRect(pbX,pbY,pbW,pbH,5);c.fill();
    c.strokeStyle='rgba(255,255,255,0.4)';c.lineWidth=1;
    c.beginPath();c.roundRect(pbX,pbY,pbW,pbH,5);c.stroke();
    c.fillStyle='#ccc';c.font='11px Arial';c.textAlign='center';
    c.fillText(paused?'▶继续':'⏸暂停',pbX+pbW/2,pbY+pbH/2+4);

    // Up/Down buttons: bottom right - larger size with more spacing to prevent mis-touch
    const btnSz=52, btnGap=22;
    const upX=800-btnSz-6, upY=400-btnSz*2-btnGap-18;
    const dnX=800-btnSz-6, dnY=400-btnSz-18;
    // Up (jump) button
    c.fillStyle=upPressed?'rgba(46,204,113,0.8)':'rgba(0,0,0,0.5)';
    c.beginPath();c.roundRect(upX,upY,btnSz,btnSz,8);c.fill();
    c.strokeStyle='rgba(255,255,255,0.6)';c.lineWidth=2;
    c.beginPath();c.roundRect(upX,upY,btnSz,btnSz,8);c.stroke();
    c.fillStyle='#fff';c.font='bold 24px Arial';
    c.fillText('↑',upX+btnSz/2,upY+btnSz/2+8);
    // Down (duck) button
    c.fillStyle=dnPressed?'rgba(231,76,60,0.8)':'rgba(0,0,0,0.5)';
    c.beginPath();c.roundRect(dnX,dnY,btnSz,btnSz,8);c.fill();
    c.strokeStyle='rgba(255,255,255,0.6)';c.lineWidth=2;
    c.beginPath();c.roundRect(dnX,dnY,btnSz,btnSz,8);c.stroke();
    c.fillStyle='#fff';c.font='bold 24px Arial';
    c.fillText('↓',dnX+btnSz/2,dnY+btnSz/2+8);
    c.textAlign='left';

    // Pause overlay
    if(paused){
        c.fillStyle='rgba(0,0,0,0.5)';c.fillRect(0,0,800,400);
        c.fillStyle='#fff';c.font='bold 40px Arial';c.textAlign='center';
        c.fillText('暂停',400,190);
        c.fillStyle='#ccc';c.font='18px Arial';
        c.fillText('点击「继续」按钮继续游戏',400,230);
        c.textAlign='left';
    }
}

function drawLevelSelect(c){

            const g=c.createLinearGradient(bx,by,bx,by+bSize);

    if(wrongCount === 0) hintText = '答对可得 +2❤';
    else if(wrongCount === 1) hintText = '答对可得 +1❤';
    else hintText = '已答错'+wrongCount+'次，无法获得爱心但需继续作答';
    c.fillText(hintText,400,75);
    
    if(quizCurrentQuestion){
        // Question text
        c.fillStyle='#fff';c.font='18px Arial';
        var qText = quizCurrentQuestion;
        // Word wrap
        var maxW = 700;
        if(c.measureText(qText).width > maxW){
            var words = qText.split('');
            var line = '';
            var ly = 115;
            for(var i=0;i<words.length;i++){
                var testLine = line + words[i];
                if(c.measureText(testLine).width > maxW){
                    c.fillText(line, 400, ly);
                    line = words[i];
                    ly += 25;
                } else {
                    line = testLine;
                }
            }
            c.fillText(line, 400, ly);
        } else {
            c.fillText(qText,400,115);
        }
        
        // Options as buttons
        for(var i=0;i<quizOptions.length;i++){
            var oy = 160 + i*52;
            var isDisabled = quizDisabledOptions.indexOf(i) !== -1;
            if(isDisabled){
                // Gray out disabled option
                c.fillStyle='#555';c.beginPath();c.roundRect(100,oy,600,42,8);c.fill();
                c.fillStyle='#888';c.font='16px Arial';
                c.fillText(quizOptions[i], 400, oy+28);
            } else {
                drawBtn(c, 100, oy, 600, 42, quizOptions[i], '#2c3e50', '#34495e', 16);
                // Option letter
                c.fillStyle='#ffcc00';c.font='bold 16px Arial';
                c.fillText(String.fromCharCode(65+i)+'.', 120, oy+28);
            }
        }
    } else {
        // Waiting for question
        c.fillStyle='#aaa';c.font='20px Arial';
        c.fillText('正在加载题目...',400,200);
    }
    
    c.textAlign='left';
}

// Boss approaching transition drawing
function drawBossApproaching(c){
    // Draw the game scene with slowdown effect
    const theme = getTheme();
    // Darkening overlay based on progress
    const darkness = Math.min(0.5, bossApproachTimer/200);
    
    // Draw vignette effect
    const vigGrad=c.createRadialGradient(400,200,100,400,200,400);
    vigGrad.addColorStop(0,'rgba(0,0,0,0)');

    if(bossApproachPhase>=2){
        const portalProgress = Math.min(1, (bossApproachTimer-60)/120);
        const portalX = 400;
        const portalY = 200;
        const portalR = 80 * portalProgress;
        
        // Portal glow
        const portalGrad=c.createRadialGradient(portalX,portalY,0,portalX,portalY,portalR*1.5);
        portalGrad.addColorStop(0,'rgba(150,50,255,0.8)');
        portalGrad.addColorStop(0.5,'rgba(100,0,200,0.4)');
        portalGrad.addColorStop(1,'rgba(50,0,100,0)');
        c.fillStyle=portalGrad;
        c.beginPath();
        c.arc(portalX,portalY,portalR*1.5,0,Math.PI*2);
        c.fill();
        
        // Portal rings
        c.strokeStyle=`rgba(200,100,255,${0.6*portalProgress})`;
        c.lineWidth=3;
        for(let i=0;i<3;i++){
            const ringR = portalR * (0.5+i*0.2);
            const rotation = fc*0.05 + i*0.5;
            c.beginPath();
            c.ellipse(portalX,portalY,ringR,ringR*0.3,rotation,0,Math.PI*2);

// Draw a beautiful gift box (3D wrapped present with ribbon and bow)
// scheme: 'gold' for victory, 'silver' for defeat
function drawGiftBox(c, cx, cy, size, scheme){
    const s = size; // base size
    const half = s/2;
    
    // Color palettes
    const colors = scheme === 'gold' ? {
        // Box body
        boxFront: '#FFD700',
        boxFrontDark: '#DAA520',
        boxTop: '#FFE44D',
        boxRight: '#CCaa00',
        // Ribbon
        ribbon: '#E63946',
        ribbonDark: '#B71C1C',
        ribbonLight: '#FF5252',
        // Pattern
        pattern: 'rgba(255,240,180,0.35)',
        // Glow
        glow: 'rgba(255,215,0,0.5)',
        glowInner: 'rgba(255,215,0,0.8)'
    } : {
        // Silver scheme
        boxFront: '#C0C0C0',
        boxFrontDark: '#A0A0A0',
        boxTop: '#D8D8D8',
        boxRight: '#888888',
        ribbon: '#6A5ACD',
        ribbonDark: '#483D8B',
        ribbonLight: '#9370DB',
        pattern: 'rgba(220,220,240,0.3)',
        glow: 'rgba(192,192,192,0.4)',
        glowInner: 'rgba(200,200,220,0.6)'
    };
    
    // 3D offsets for perspective
    const depthX = s * 0.22;
    const depthY = s * 0.18;
    
    // Outer glow
    const glowGrad = c.createRadialGradient(cx, cy, s*0.2, cx, cy, s*1.2);
    glowGrad.addColorStop(0, colors.glowInner);
    glowGrad.addColorStop(0.5, colors.glow);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = glowGrad;
    c.beginPath();
    c.arc(cx, cy, s*1.2, 0, Math.PI*2);
    c.fill();
    
    // Sparkle particles around box
    const sparkleTime = fc * 0.08;
    c.fillStyle = scheme === 'gold' ? 'rgba(255,255,200,0.8)' : 'rgba(220,220,255,0.7)';
    for(let i = 0; i < 6; i++){
        const angle = sparkleTime + i * Math.PI * 2 / 6;
        const dist = s * 0.8 + Math.sin(fc*0.05+i)*s*0.15;
        const sx = cx + Math.cos(angle) * dist;
        const sy = cy + Math.sin(angle) * dist * 0.6;
        const sr = 1.5 + Math.sin(fc*0.1+i*1.5)*0.8;
        c.beginPath();
        c.arc(sx, sy, sr, 0, Math.PI*2);
        c.fill();
    }
    
    // --- Box body (front face) ---
    const boxLeft = cx - half;
    const boxTop2 = cy - half * 0.6;
    const boxW = s;
    const boxH = s * 0.7;
    
    // Front face gradient
    const frontGrad = c.createLinearGradient(boxLeft, boxTop2, boxLeft+boxW, boxTop2+boxH);
    frontGrad.addColorStop(0, colors.boxFront);
    frontGrad.addColorStop(0.5, colors.boxFrontDark);
    frontGrad.addColorStop(1, colors.boxFront);
    c.fillStyle = frontGrad;
    c.fillRect(boxLeft, boxTop2, boxW, boxH);
    
    // Front face subtle pattern (floral swirls)
    c.fillStyle = colors.pattern;
    for(let i = 0; i < 3; i++){
        for(let j = 0; j < 2; j++){
            const px = boxLeft + 8 + i * (boxW/3);
            const py = boxTop2 + 8 + j * (boxH/2);
            c.beginPath();
            c.arc(px, py, 4, 0, Math.PI*2);
            c.fill();
            // Small leaf shapes
            c.beginPath();
            c.ellipse(px+5, py-2, 3, 1.5, 0.5, 0, Math.PI*2);
            c.fill();
            c.beginPath();
            c.ellipse(px-3, py+3, 2.5, 1.2, -0.3, 0, Math.PI*2);
            c.fill();
        }
    }
    
    // Front face border
    c.strokeStyle = 'rgba(0,0,0,0.15)';
    c.lineWidth = 1;
    c.strokeRect(boxLeft, boxTop2, boxW, boxH);
    
    // --- Right side face (3D depth) ---
    c.fillStyle = colors.boxRight;
    c.beginPath();
    c.moveTo(boxLeft + boxW, boxTop2);
    c.lineTo(boxLeft + boxW + depthX, boxTop2 - depthY);
    c.lineTo(boxLeft + boxW + depthX, boxTop2 - depthY + boxH);
    c.lineTo(boxLeft + boxW, boxTop2 + boxH);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.15)';
    c.stroke();
    
    // --- Top face (3D depth) ---
    const topGrad = c.createLinearGradient(boxLeft, boxTop2, boxLeft+depthX, boxTop2-depthY);
    topGrad.addColorStop(0, colors.boxTop);
    topGrad.addColorStop(1, colors.boxFront);
    c.fillStyle = topGrad;
    c.beginPath();
    c.moveTo(boxLeft, boxTop2);
    c.lineTo(boxLeft + depthX, boxTop2 - depthY);
    c.lineTo(boxLeft + boxW + depthX, boxTop2 - depthY);
    c.lineTo(boxLeft + boxW, boxTop2);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.1)';
    c.stroke();
    
    // --- Vertical ribbon on front ---
    const ribbonW = s * 0.12;
    const ribbonX = cx - ribbonW/2;
    c.fillStyle = colors.ribbon;
    c.fillRect(ribbonX, boxTop2, ribbonW, boxH);
    // Ribbon shine
    const rShine = c.createLinearGradient(ribbonX, 0, ribbonX+ribbonW, 0);
    rShine.addColorStop(0, 'rgba(255,255,255,0)');
    rShine.addColorStop(0.3, 'rgba(255,255,255,0.3)');
    rShine.addColorStop(0.5, 'rgba(255,255,255,0.1)');
    rShine.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = rShine;
    c.fillRect(ribbonX, boxTop2, ribbonW, boxH);
    // Ribbon border
    c.strokeStyle = colors.ribbonDark;
    c.lineWidth = 0.5;
    c.strokeRect(ribbonX, boxTop2, ribbonW, boxH);
    
    // --- Horizontal ribbon on front ---
    const hRibbonH = s * 0.1;
    const hRibbonY = boxTop2 + boxH/2 - hRibbonH/2;
    c.fillStyle = colors.ribbon;
    c.fillRect(boxLeft, hRibbonY, boxW, hRibbonH);
    // Shine
    const hShine = c.createLinearGradient(0, hRibbonY, 0, hRibbonY+hRibbonH);
    hShine.addColorStop(0, 'rgba(255,255,255,0.25)');
    hShine.addColorStop(0.5, 'rgba(255,255,255,0.05)');
    hShine.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hShine;
    c.fillRect(boxLeft, hRibbonY, boxW, hRibbonH);
    c.strokeStyle = colors.ribbonDark;
    c.lineWidth = 0.5;
    c.strokeRect(boxLeft, hRibbonY, boxW, hRibbonH);
    
    // --- Ribbon on right side (vertical) ---
    c.fillStyle = colors.ribbonDark;
    c.beginPath();
    c.moveTo(boxLeft+boxW, hRibbonY);
    c.lineTo(boxLeft+boxW+depthX, hRibbonY-depthY);
    c.lineTo(boxLeft+boxW+depthX, hRibbonY-depthY+hRibbonH);
    c.lineTo(boxLeft+boxW, hRibbonY+hRibbonH);
    c.closePath();
    c.fill();
    
    // --- Ribbon on top (vertical strip) ---
    c.fillStyle = colors.ribbonLight;
    c.beginPath();
    c.moveTo(ribbonX, boxTop2);
    c.lineTo(ribbonX+depthX, boxTop2-depthY);
    c.lineTo(ribbonX+ribbonW+depthX, boxTop2-depthY);
    c.lineTo(ribbonX+ribbonW, boxTop2);
    c.closePath();
    c.fill();
    
    // --- Bow on top ---
    const bowCX = cx + depthX/2;
    const bowCY = boxTop2 - depthY/2;
    
    // Bow tails (hanging down)
    c.fillStyle = colors.ribbon;
    // Left tail
    c.beginPath();
    c.moveTo(bowCX-3, bowCY+2);
    c.quadraticCurveTo(bowCX-12, bowCY+15, bowCX-8, bowCY+22);
    c.lineTo(bowCX-5, bowCY+20);
    c.quadraticCurveTo(bowCX-8, bowCY+12, bowCX-1, bowCY+3);
    c.closePath();
    c.fill();
    // Right tail
    c.beginPath();
    c.moveTo(bowCX+3, bowCY+2);
    c.quadraticCurveTo(bowCX+12, bowCY+15, bowCX+10, bowCY+22);
    c.lineTo(bowCX+7, bowCY+20);
    c.quadraticCurveTo(bowCX+10, bowCY+12, bowCX+1, bowCY+3);
    c.closePath();
    c.fill();
    
    // Bow loops (4 petals)
    const bowSize = s * 0.28;
    // Top-left loop
    c.fillStyle = colors.ribbon;
    c.beginPath();
    c.ellipse(bowCX-bowSize*0.6, bowCY-bowSize*0.3, bowSize*0.55, bowSize*0.35, -0.5, 0, Math.PI*2);
    c.fill();
    // Top-right loop
    c.beginPath();
    c.ellipse(bowCX+bowSize*0.6, bowCY-bowSize*0.3, bowSize*0.55, bowSize*0.35, 0.5, 0, Math.PI*2);
    c.fill();
    // Bottom-left loop
    c.beginPath();
    c.ellipse(bowCX-bowSize*0.4, bowCY+bowSize*0.1, bowSize*0.4, bowSize*0.28, -0.3, 0, Math.PI*2);
    c.fill();
    // Bottom-right loop
    c.beginPath();
    c.ellipse(bowCX+bowSize*0.4, bowCY+bowSize*0.1, bowSize*0.4, bowSize*0.28, 0.3, 0, Math.PI*2);
    c.fill();
    
    // Bow highlights (shine on loops)
    c.fillStyle = colors.ribbonLight;
    c.globalAlpha = 0.5;
    c.beginPath();
    c.ellipse(bowCX-bowSize*0.5, bowCY-bowSize*0.4, bowSize*0.2, bowSize*0.12, -0.5, 0, Math.PI*2);
    c.fill();
    c.beginPath();
    c.ellipse(bowCX+bowSize*0.5, bowCY-bowSize*0.4, bowSize*0.2, bowSize*0.12, 0.5, 0, Math.PI*2);
    c.fill();
    c.globalAlpha = 1;
    
    // Bow center knot
    c.fillStyle = colors.ribbonDark;
    c.beginPath();
    c.arc(bowCX, bowCY, bowSize*0.18, 0, Math.PI*2);
    c.fill();
    // Knot highlight
    c.fillStyle = colors.ribbonLight;
    c.beginPath();
    c.arc(bowCX-1, bowCY-1, bowSize*0.08, 0, Math.PI*2);
    c.fill();
    
    // --- Box highlight (top-left corner shine) ---
    c.fillStyle = 'rgba(255,255,255,0.25)';
    c.beginPath();
    c.moveTo(boxLeft+2, boxTop2+2);
    c.lineTo(boxLeft+s*0.3, boxTop2+2);
    c.lineTo(boxLeft+2, boxTop2+s*0.2);
    c.closePath();
    c.fill();
}

// Boss reward drawing (victory)
function drawBossReward(c){
    // Draw boss arena background
    drawBossArenaBackground(c, false);
    
    // Draw player
    drawPlayer(c);
    
    // Draw golden gift box if visible
    if(bossRewardChest.visible && !bossRewardChest.collected){
        const chestX = bossRewardChest.x;
        const chestY = bossRewardChest.y;
        const bob = Math.sin(fc*0.1)*3;
        drawGiftBox(c, chestX, chestY+bob, 50, 'gold');
    }
    
    // Draw reward items
    for(const item of bossRewardItems){
        if(!item.collected){
            const bob = Math.sin(fc*0.08+item.bobOffset)*5;
            const itemX = item.x;
            const itemY = item.y + bob;
            
            if(item.type==='coin'){
                // Silver coin
                const coinGrad=c.createRadialGradient(itemX-2,itemY-2,1,itemX,itemY,12);
                coinGrad.addColorStop(0,'#E8E8E8');
                coinGrad.addColorStop(0.5,'#C0C0C0');
                coinGrad.addColorStop(1,'#808080');
                c.fillStyle=coinGrad;
                c.beginPath();
                c.arc(itemX,itemY,12,0,Math.PI*2);
                c.fill();
                // Coin shine
                c.fillStyle='rgba(255,255,255,0.6)';
                c.beginPath();
                c.arc(itemX-3,itemY-3,4,0,Math.PI*2);
                c.fill();
                // Coin symbol
                c.fillStyle='#707070';
                c.font='bold 14px Arial';
                c.textAlign='center';
                c.fillText('$',itemX,itemY+5);
            } else {
                // Red heart
                c.fillStyle='#ff3355';
                c.beginPath();
                c.moveTo(itemX,itemY+12);
                c.bezierCurveTo(itemX-12,itemY,itemX-12,itemY-12,itemX,itemY-6);
                c.bezierCurveTo(itemX+12,itemY-12,itemX+12,itemY,itemX,itemY+12);
                c.closePath();
                c.fill();
                // Heart shine
                c.fillStyle='rgba(255,255,255,0.5)';
                c.beginPath();
                c.arc(itemX-4,itemY-4,3,0,Math.PI*2);
                c.fill();
            }
        }
    }
    
    // Draw particles
    for(const p of parts){
        c.fillStyle=p.col;
        c.globalAlpha=Math.max(0,p.life/35);
        c.beginPath();
        c.arc(p.x,p.y,p.r,0,Math.PI*2);
        c.fill();
    }
    c.globalAlpha=1;
    
    // Draw text overlay
    c.textAlign='center';
    if(bossRewardPhase===0){
        // Victory text
        const textAlpha = Math.min(1, bossRewardTimer/60);
        c.fillStyle=`rgba(255,215,0,${textAlpha})`;
        c.font='bold 36px Arial';
        c.shadowColor='rgba(255,215,0,0.8)';
        c.shadowBlur=20;
        c.fillText(bossRewardText, 400, 180);
        c.shadowBlur=0;
        
        c.fillStyle=`rgba(255,255,255,${textAlpha*0.8})`;
        c.font='24px Arial';
        c.fillText('靠近金色礼盒领取奖励!', 400, 230);
    } else if(bossRewardPhase===2){
        // Auto-collecting prompt
        c.fillStyle='rgba(0,0,0,0.6)';
        c.beginPath();c.roundRect(250,10,300,40,8);c.fill();
        c.fillStyle='#ffcc00';
        c.font='bold 20px Arial';
        c.fillText('奖励自动收取中...', 400, 35);
    } else if(bossRewardPhase===3 && bossRewardShowContinue){
        // Continue button
        c.fillStyle='rgba(0,0,0,0.7)';
        c.beginPath();c.roundRect(300,320,200,50,10);c.fill();
        c.strokeStyle='#ffcc00';
        c.lineWidth=3;
        c.beginPath();c.roundRect(300,320,200,50,10);c.stroke();
        c.fillStyle='#ffcc00';
        c.font='bold 24px Arial';
        c.fillText('继续', 400, 355);
    }
    c.textAlign='left';
}

            c.fillStyle=boxGrad;
            c.fillRect(obs.x, obs.y, obs.w, obs.h);
            c.strokeStyle='rgba(60,40,10,0.4)';
            c.lineWidth=1;
            const plankH = obs.h / 3;
            for(let i=1; i<3; i++){
                c.beginPath();
                c.moveTo(obs.x+2, obs.y + i*plankH);
                c.lineTo(obs.x+obs.w-2, obs.y + i*plankH);
                c.stroke();
            }
            c.beginPath();
            c.moveTo(obs.x + obs.w/2, obs.y+2);
            c.lineTo(obs.x + obs.w/2, obs.y+obs.h-2);
            c.stroke();
            c.strokeStyle='rgba(120,120,120,0.7)';
            c.lineWidth=2;
            const cornerSize = 6;
            c.beginPath();c.moveTo(obs.x+cornerSize, obs.y+1);c.lineTo(obs.x+1, obs.y+1);c.lineTo(obs.x+1, obs.y+cornerSize);c.stroke();
            c.beginPath();c.moveTo(obs.x+obs.w-cornerSize, obs.y+1);c.lineTo(obs.x+obs.w-1, obs.y+1);c.lineTo(obs.x+obs.w-1, obs.y+cornerSize);c.stroke();
            c.beginPath();c.moveTo(obs.x+1, obs.y+obs.h-cornerSize);c.lineTo(obs.x+1, obs.y+obs.h-1);c.lineTo(obs.x+cornerSize, obs.y+obs.h-1);c.stroke();
            c.beginPath();c.moveTo(obs.x+obs.w-cornerSize, obs.y+obs.h-1);c.lineTo(obs.x+obs.w-1, obs.y+obs.h-1);c.lineTo(obs.x+obs.w-1, obs.y+obs.h-cornerSize);c.stroke();
            c.fillStyle='rgba(200,170,100,0.3)';
            c.fillRect(obs.x+2, obs.y, obs.w-4, 3);
            c.strokeStyle=`rgba(150,120,50,${0.4+runePulse*0.3})`;
            c.lineWidth=1;
            c.strokeRect(obs.x, obs.y, obs.w, obs.h);
        } else if(obs.type === 'stone'){
            // Tall stone slab/pillar
            c.fillStyle='rgba(0,0,0,0.3)';
            c.beginPath();c.roundRect(obs.x+3, obs.y+3, obs.w, obs.h, 3);c.fill();
            const stoneGrad=c.createLinearGradient(obs.x, obs.y, obs.x+obs.w, obs.y+obs.h);
            stoneGrad.addColorStop(0,'#5a5a6a');
            stoneGrad.addColorStop(0.4,'#4a4a5a');
            stoneGrad.addColorStop(0.8,'#3a3a4a');
            stoneGrad.addColorStop(1,'#2a2a3a');
            c.fillStyle=stoneGrad;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 3);c.fill();
            c.strokeStyle='rgba(20,20,30,0.4)';
            c.lineWidth=1;
            c.beginPath();
            c.moveTo(obs.x + obs.w*0.3, obs.y + obs.h*0.2);
            c.lineTo(obs.x + obs.w*0.5, obs.y + obs.h*0.5);
            c.lineTo(obs.x + obs.w*0.4, obs.y + obs.h*0.8);
            c.stroke();
            c.beginPath();
            c.moveTo(obs.x + obs.w*0.7, obs.y + obs.h*0.3);
            c.lineTo(obs.x + obs.w*0.6, obs.y + obs.h*0.6);
            c.stroke();
            c.fillStyle='rgba(140,140,160,0.4)';
            c.fillRect(obs.x+2, obs.y, obs.w-4, 3);
            c.fillStyle=`rgba(100,180,255,${runePulse})`;
            c.font='bold 10px Arial';c.textAlign='center';
            c.fillText('◇', obs.x+obs.w/2, obs.y+obs.h/2+4);
            c.strokeStyle=`rgba(100,150,255,${runePulse*0.5})`;
            c.lineWidth=1;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 3);c.stroke();
        } else {
            // Default: floating stone slab
            c.fillStyle='rgba(0,0,0,0.2)';
            c.beginPath();c.roundRect(obs.x+2, obs.y+3, obs.w, obs.h, 4);c.fill();
            const platGrad=c.createLinearGradient(obs.x, obs.y, obs.x, obs.y+obs.h);
            platGrad.addColorStop(0,'#6a5a7a');
            platGrad.addColorStop(0.5,'#4a3a5a');
            platGrad.addColorStop(1,'#3a2a4a');
            c.fillStyle=platGrad;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 4);c.fill();
            c.fillStyle='rgba(150,120,180,0.4)';
            c.fillRect(obs.x+2, obs.y, obs.w-4, 3);
            c.fillStyle=`rgba(150,100,200,${runePulse})`;
            c.font='bold 10px Arial';c.textAlign='center';
            c.fillText('◆', obs.x+obs.w/2, obs.y+obs.h/2+4);
            c.strokeStyle=`rgba(150,80,255,${runePulse*0.5})`;
            c.lineWidth=1;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 4);c.stroke();
        }
    }
    c.textAlign='left';
    
    // Draw defeated boss (faded)
    if(boss){
        c.globalAlpha=0.3;
        // Draw boss faded out
        const bcx=boss.x+boss.w/2, bcy=boss.y+boss.h/2;
        c.fillStyle='rgba(100,100,100,0.5)';
        c.beginPath();
        c.ellipse(bcx,bcy,boss.w/2,boss.h/2,0,0,Math.PI*2);
        c.fill();
        c.globalAlpha=1;
    }
    
    // Draw player
    drawPlayer(c);
    
    // Draw particles
    for(const p of parts){
        c.fillStyle=p.col;
        c.globalAlpha=Math.max(0,p.life/35);
        c.beginPath();
        c.arc(p.x,p.y,p.r,0,Math.PI*2);
        c.fill();
    }
    c.globalAlpha=1;
}

// Boss defeat reward drawing
function drawBossDefeatReward(c){
    drawBossDefeatArena(c);
    
    // Draw silver gift box if visible
    if(bossDefeatChest.visible && bossDefeatRewardPhase<3){
        const chestX = bossDefeatChest.x;
        const chestY = bossDefeatChest.y;
        const bob = Math.sin(fc*0.1)*3;
        drawGiftBox(c, chestX, chestY+bob, 50, 'silver');
    }
    
    // Draw reward items (scattered coins/hearts flying toward player)
    if(bossDefeatRewardPhase===2){
        for(const item of bossDefeatRewardItems){
            if(!item.collected){
                const bob = Math.sin(fc*0.08+item.bobOffset)*3;
                const itemX = item.x;
                const itemY = item.y + bob;
                if(item.type==='coin'){
                    const coinGrad=c.createRadialGradient(itemX-2,itemY-2,1,itemX,itemY,10);
                    coinGrad.addColorStop(0,'#E8E8E8');coinGrad.addColorStop(0.5,'#C0C0C0');coinGrad.addColorStop(1,'#808080');
                    c.fillStyle=coinGrad;c.beginPath();c.arc(itemX,itemY,10,0,Math.PI*2);c.fill();
                    c.fillStyle='rgba(255,255,255,0.5)';c.beginPath();c.arc(itemX-2,itemY-2,3,0,Math.PI*2);c.fill();
                    c.fillStyle='#707070';c.font='bold 12px Arial';c.textAlign='center';c.fillText('$',itemX,itemY+4);
                } else {
                    c.fillStyle='#ff3355';c.beginPath();
                    c.moveTo(itemX,itemY+10);c.bezierCurveTo(itemX-10,itemY,itemX-10,itemY-10,itemX,itemY-5);
                    c.bezierCurveTo(itemX+10,itemY-10,itemX+10,itemY,itemX,itemY+10);c.closePath();c.fill();
                    c.fillStyle='rgba(255,255,255,0.4)';c.beginPath();c.arc(itemX-3,itemY-3,2,0,Math.PI*2);c.fill();
                }
            }
        }
    }
    
    // Draw text overlay
    c.textAlign='center';
    if(bossDefeatRewardPhase===0){
        // Defeat text
        const textAlpha = Math.min(1, bossDefeatRewardTimer/60);
        c.fillStyle=`rgba(255,100,100,${textAlpha})`;
        c.font='bold 36px Arial';
        c.shadowColor='rgba(255,0,0,0.8)';
        c.shadowBlur=20;
        c.fillText('你已被BOSS击杀', 400, 180);
        c.shadowBlur=0;
        
        c.fillStyle=`rgba(255,255,255,${textAlpha*0.8})`;
        c.font='24px Arial';
        c.fillText('获得50银币和3个爱心', 400, 230);
    } else if(bossDefeatRewardPhase===1){
        // Show prompt to approach chest
        c.fillStyle='rgba(0,0,0,0.5)';
        c.beginPath();c.roundRect(250,10,300,40,8);c.fill();
        c.fillStyle='#C0C0C0';
        c.font='bold 20px Arial';
        c.fillText('靠近银色礼盒领取奖励!', 400, 35);
    } else if(bossDefeatRewardPhase===2){
        // Items flying toward player
        c.fillStyle='rgba(0,0,0,0.5)';
        c.beginPath();c.roundRect(250,10,300,40,8);c.fill();
        c.fillStyle='#ffcc00';
        c.font='bold 18px Arial';
        c.fillText('奖励正在飞来...', 400, 35);
    } else if(bossDefeatRewardPhase===3 && bossDefeatShowContinue){
        // Continue button
        c.fillStyle='rgba(0,0,0,0.7)';
        c.beginPath();c.roundRect(300,320,200,50,10);c.fill();
        c.strokeStyle='#C0C0C0';
        c.lineWidth=3;
        c.beginPath();c.roundRect(300,320,200,50,10);c.stroke();
        c.fillStyle='#C0C0C0';
        c.font='bold 24px Arial';
        c.fillText('继续', 400, 355);
    }
    c.textAlign='left';
}

// Helper: Draw boss arena background
function drawBossArenaBackground(c, isScary){
    // Sky/ceiling gradient
    const grad=c.createLinearGradient(0,0,0,400);
    if(isScary){
        grad.addColorStop(0,'#0a0010');
        grad.addColorStop(0.3,'#15051f');
        grad.addColorStop(0.7,'#1f0a2e');
        grad.addColorStop(1,'#2a1040');
    } else {
        grad.addColorStop(0,'#0a0515');
        grad.addColorStop(0.5,'#1a0a2e');
        grad.addColorStop(1,'#2a1040');
    }
    c.fillStyle=grad;
    c.fillRect(0,0,800,400);
    
    // Ornate archways
    c.strokeStyle='rgba(80,40,120,0.35)';
    c.lineWidth=3;
    for(let i=0;i<3;i++){
        const ax = 130 + i*270;
        c.beginPath();
        c.moveTo(ax-40, GY);
        c.lineTo(ax-40, 100);
        c.quadraticCurveTo(ax, 40, ax+40, 100);
        c.lineTo(ax+40, GY);
        c.stroke();
    }
    
    // Ground
    const groundGrad=c.createLinearGradient(0,GY,0,400);
    groundGrad.addColorStop(0,isScary?'#3a1a3a':'#3a2a4a');
    groundGrad.addColorStop(1,isScary?'#1a0015':'#1a0a2a');
    c.fillStyle=groundGrad;
    c.fillRect(0,GY,800,65);
    
    // Ground edge glow
    c.strokeStyle=isScary?'rgba(255,0,100,0.5)':'rgba(150,80,255,0.5)';
    c.lineWidth=2;
    c.beginPath();
    c.moveTo(0,GY);
    c.lineTo(800,GY);
    c.stroke();
}

// Boss fight drawing
function drawBossFight(c){
    // Draw arena background - atmospheric dungeon with aesthetic design
    const isScary = boss && boss.formIndex >= 5;
    
    // Sky/ceiling gradient
    const grad=c.createLinearGradient(0,0,0,400);
    if(isScary){
        grad.addColorStop(0,'#0a0010');
        grad.addColorStop(0.3,'#15051f');
        grad.addColorStop(0.7,'#1f0a2e');
        grad.addColorStop(1,'#2a1040');
    } else {
        grad.addColorStop(0,'#0a0515');
        grad.addColorStop(0.5,'#1a0a2e');
        grad.addColorStop(1,'#2a1040');
    }
    c.fillStyle=grad;
    c.fillRect(0,0,800,400);
    
    // Ornate archways in background
    c.strokeStyle='rgba(80,40,120,0.35)';
    c.lineWidth=3;
    for(let i=0;i<3;i++){
        const ax = 130 + i*270;
        c.beginPath();
        c.moveTo(ax-40, GY);
        c.lineTo(ax-40, 100);
        c.quadraticCurveTo(ax, 40, ax+40, 100);
        c.lineTo(ax+40, GY);
        c.stroke();
        // Inner arch
        c.strokeStyle='rgba(100,50,150,0.2)';
        c.lineWidth=1.5;
        c.beginPath();
        c.moveTo(ax-30, GY);
        c.lineTo(ax-30, 110);
        c.quadraticCurveTo(ax, 55, ax+30, 110);
        c.lineTo(ax+30, GY);
        c.stroke();
        c.strokeStyle='rgba(80,40,120,0.35)';
        c.lineWidth=3;
    }
    
    // Torch flames on pillars
    for(let i=0;i<4;i++){
        const tx = 80 + i*220;
        // Pillar
        c.fillStyle='rgba(50,25,70,0.5)';
        c.fillRect(tx-6, 70, 12, GY-70);
        c.fillStyle='rgba(70,35,90,0.4)';
        c.fillRect(tx-10, 65, 20, 10);
        // Flame
        const flicker = Math.sin(fc*0.15+i*2)*3;
        const flameGrad = c.createRadialGradient(tx, 55+flicker, 2, tx, 50+flicker, 15);
        flameGrad.addColorStop(0,'rgba(255,200,50,0.9)');
        flameGrad.addColorStop(0.4,'rgba(255,120,20,0.6)');
        flameGrad.addColorStop(1,'rgba(255,50,0,0)');
        c.fillStyle=flameGrad;
        c.beginPath();c.arc(tx, 52+flicker, 14, 0, Math.PI*2);c.fill();
        // Glow on floor
        c.fillStyle='rgba(255,150,50,0.05)';
        c.beginPath();c.ellipse(tx, GY+10, 40, 15, 0, 0, Math.PI*2);c.fill();
    }
    
    // Mystical runes on the ground - animated glow
    c.lineWidth=1.5;
    for(let i=0;i<10;i++){
        const rx = 40 + i*80;
        const pulse = Math.sin(fc*0.04 + i*0.7)*0.2 + 0.35;
        const runeCol = isScary ? `rgba(255,0,100,${pulse})` : `rgba(150,80,255,${pulse})`;
        c.strokeStyle=runeCol;
        c.beginPath();
        c.arc(rx, GY+18, 12, 0, Math.PI*2);
        c.stroke();
        // Rune symbol
        c.beginPath();
        c.moveTo(rx-6, GY+18);c.lineTo(rx, GY+10);c.lineTo(rx+6, GY+18);c.lineTo(rx, GY+26);
        c.closePath();c.stroke();
    }
    
    // Ground with stone texture
    const groundGrad=c.createLinearGradient(0,GY,0,400);
    groundGrad.addColorStop(0,isScary?'#3a1a3a':'#3a2a4a');
    groundGrad.addColorStop(0.3,isScary?'#2a0a2a':'#2a1a3a');
    groundGrad.addColorStop(1,isScary?'#1a0015':'#1a0a2a');
    c.fillStyle=groundGrad;
    c.fillRect(0,GY,800,65);
    
    // Ground edge with magical glow
    const edgeGrad=c.createLinearGradient(0,GY-2,0,GY+4);
    edgeGrad.addColorStop(0,'rgba(0,0,0,0)');
    edgeGrad.addColorStop(0.5, isScary?'rgba(255,0,100,0.6)':'rgba(150,80,255,0.6)');
    edgeGrad.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=edgeGrad;
    c.fillRect(0,GY-2,800,6);
    
    // Stone tile pattern
    c.strokeStyle='rgba(100,60,140,0.15)';
    c.lineWidth=1;
    for(let i=0;i<17;i++){
        c.beginPath();c.moveTo(i*50,GY);c.lineTo(i*50,400);c.stroke();
    }
    for(let j=0;j<3;j++){
        c.beginPath();c.moveTo(0,GY+20+j*20);c.lineTo(800,GY+20+j*20);c.stroke();
    }
    
    // Floating magical particles
    const pCol = isScary ? '200,50,100' : '200,100,255';
    for(let i=0;i<18;i++){
        const ex = (i*53 + fc*0.2)%800;
        const ey = 30 + Math.sin(fc*0.015 + i*1.8)*40 + (i%5)*50;
        const er = 1 + Math.sin(fc*0.04+i)*0.8;
        c.fillStyle=`rgba(${pCol},${0.3+Math.sin(fc*0.06+i)*0.15})`;
        c.beginPath();c.arc(ex,ey,er,0,Math.PI*2);c.fill();
    }
    
    // Mist at ground level
    c.fillStyle='rgba(100,50,150,0.06)';
    for(let i=0;i<5;i++){
        const mx = (i*200 - fc*0.3)%1000 - 100;
        c.beginPath();
        c.ellipse(mx, GY+5, 80, 15, 0, 0, Math.PI*2);
        c.fill();
    }
    
    // Vignette effect (darker edges)
    const vigGrad=c.createRadialGradient(400,200,150,400,200,450);
    vigGrad.addColorStop(0,'rgba(0,0,0,0)');
    vigGrad.addColorStop(1,'rgba(0,0,0,0.4)');
    c.fillStyle=vigGrad;
    c.fillRect(0,0,800,400);
    
    // Draw player
    drawPlayer(c);
    
    // Draw player bullets (directional with trail) - per character colors
    const bulletColors = [
        {trail:'rgba(0,255,204,0.4)',glow:'rgba(0,255,204,0.3)',core:'#00ffcc',center:'#aaffee',rgb:'0,255,204'},
        {trail:'rgba(255,100,0,0.4)',glow:'rgba(255,100,0,0.3)',core:'#ff6600',center:'#ffcc00',rgb:'255,100,0'},
        {trail:'rgba(136,204,255,0.4)',glow:'rgba(136,204,255,0.3)',core:'#88ccff',center:'#ddf0ff',rgb:'136,204,255'},
        {trail:'rgba(255,136,0,0.4)',glow:'rgba(255,136,0,0.3)',core:'#ff8800',center:'#ffcc66',rgb:'255,136,0'},
        {trail:'rgba(170,68,255,0.4)',glow:'rgba(170,68,255,0.3)',core:'#aa44ff',center:'#dd99ff',rgb:'170,68,255'},
        {trail:'rgba(34,102,204,0.4)',glow:'rgba(34,102,204,0.3)',core:'#2266cc',center:'#88bbee',rgb:'34,102,204'},
        {trail:'rgba(255,215,0,0.4)',glow:'rgba(255,215,0,0.3)',core:'#ffd700',center:'#ffee88',rgb:'255,215,0'},
        {trail:'rgba(0,204,136,0.4)',glow:'rgba(0,204,136,0.3)',core:'#00cc88',center:'#88ffcc',rgb:'0,204,136'},
        {trail:'rgba(205,127,50,0.4)',glow:'rgba(205,127,50,0.3)',core:'#cd7f32',center:'#eebb88',rgb:'205,127,50'},
        {trail:'rgba(0,184,148,0.4)',glow:'rgba(0,184,148,0.3)',core:'#00b894',center:'#88eedd',rgb:'0,184,148'}
    ];
    for(const b of playerBullets){
        const bc = bulletColors[b.charIdx !== undefined ? b.charIdx : 0];
        const trailLen = 15;
        const speed = Math.sqrt(b.vx*b.vx + b.vy*b.vy) || 1;
        const tx = b.x - (b.vx/speed)*trailLen;
        const ty = b.y - (b.vy/speed)*trailLen;
        c.strokeStyle=bc.trail;
        c.lineWidth=6;
        c.beginPath();
        c.moveTo(b.x, b.y);
        c.lineTo(tx, ty);
        c.stroke();
        c.fillStyle=bc.glow;
        c.beginPath();
        c.arc(b.x,b.y,10,0,Math.PI*2);
        c.fill();
        c.fillStyle=bc.core;
        c.beginPath();
        c.arc(b.x,b.y,5,0,Math.PI*2);
        c.fill();
        c.fillStyle=bc.center;
        c.beginPath();
        c.arc(b.x,b.y,2,0,Math.PI*2);
        c.fill();
    }
    
    // Draw boss obstacles (different types: slab, box, stone)
    for(const obs of bossObstacles){
        const runePulse = Math.sin(fc*0.05+obs.x)*0.3+0.4;
        
        if(obs.type === 'box'){
            // Wooden crate box
            // Shadow
            c.fillStyle='rgba(0,0,0,0.25)';
            c.fillRect(obs.x+3, obs.y+3, obs.w, obs.h);
            
            // Box body with wood gradient
            const boxGrad=c.createLinearGradient(obs.x, obs.y, obs.x, obs.y+obs.h);
            boxGrad.addColorStop(0,'#8B6914');
            boxGrad.addColorStop(0.3,'#A0782C');
            boxGrad.addColorStop(0.7,'#7A5A10');
            boxGrad.addColorStop(1,'#5C4408');
            c.fillStyle=boxGrad;
            c.fillRect(obs.x, obs.y, obs.w, obs.h);
            
            // Wood plank lines
            c.strokeStyle='rgba(60,40,10,0.4)';
            c.lineWidth=1;
            const plankH = obs.h / 3;
            for(let i=1; i<3; i++){
                c.beginPath();
                c.moveTo(obs.x+2, obs.y + i*plankH);
                c.lineTo(obs.x+obs.w-2, obs.y + i*plankH);
                c.stroke();
            }
            // Vertical center plank
            c.beginPath();
            c.moveTo(obs.x + obs.w/2, obs.y+2);
            c.lineTo(obs.x + obs.w/2, obs.y+obs.h-2);
            c.stroke();
            
            // Metal corner brackets
            c.strokeStyle='rgba(120,120,120,0.7)';
            c.lineWidth=2;
            const cornerSize = 6;
            // Top-left
            c.beginPath();c.moveTo(obs.x+cornerSize, obs.y+1);c.lineTo(obs.x+1, obs.y+1);c.lineTo(obs.x+1, obs.y+cornerSize);c.stroke();
            // Top-right
            c.beginPath();c.moveTo(obs.x+obs.w-cornerSize, obs.y+1);c.lineTo(obs.x+obs.w-1, obs.y+1);c.lineTo(obs.x+obs.w-1, obs.y+cornerSize);c.stroke();
            // Bottom-left
            c.beginPath();c.moveTo(obs.x+1, obs.y+obs.h-cornerSize);c.lineTo(obs.x+1, obs.y+obs.h-1);c.lineTo(obs.x+cornerSize, obs.y+obs.h-1);c.stroke();
            // Bottom-right
            c.beginPath();c.moveTo(obs.x+obs.w-cornerSize, obs.y+obs.h-1);c.lineTo(obs.x+obs.w-1, obs.y+obs.h-1);c.lineTo(obs.x+obs.w-1, obs.y+obs.h-cornerSize);c.stroke();
            
            // Top highlight
            c.fillStyle='rgba(200,170,100,0.3)';
            c.fillRect(obs.x+2, obs.y, obs.w-4, 3);
            
            // Edge outline
            c.strokeStyle=`rgba(150,120,50,${0.4+runePulse*0.3})`;
            c.lineWidth=1;
            c.strokeRect(obs.x, obs.y, obs.w, obs.h);
            
        } else if(obs.type === 'stone'){
            // Tall stone slab/pillar
            // Shadow
            c.fillStyle='rgba(0,0,0,0.3)';
            c.beginPath();c.roundRect(obs.x+3, obs.y+3, obs.w, obs.h, 3);c.fill();
            
            // Stone body gradient
            const stoneGrad=c.createLinearGradient(obs.x, obs.y, obs.x+obs.w, obs.y+obs.h);
            stoneGrad.addColorStop(0,'#5a5a6a');
            stoneGrad.addColorStop(0.4,'#4a4a5a');
            stoneGrad.addColorStop(0.8,'#3a3a4a');
            stoneGrad.addColorStop(1,'#2a2a3a');
            c.fillStyle=stoneGrad;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 3);c.fill();
            
            // Crack lines for texture
            c.strokeStyle='rgba(20,20,30,0.4)';
            c.lineWidth=1;
            c.beginPath();
            c.moveTo(obs.x + obs.w*0.3, obs.y + obs.h*0.2);
            c.lineTo(obs.x + obs.w*0.5, obs.y + obs.h*0.5);
            c.lineTo(obs.x + obs.w*0.4, obs.y + obs.h*0.8);
            c.stroke();
            c.beginPath();
            c.moveTo(obs.x + obs.w*0.7, obs.y + obs.h*0.3);
            c.lineTo(obs.x + obs.w*0.6, obs.y + obs.h*0.6);
            c.stroke();
            
            // Top highlight
            c.fillStyle='rgba(140,140,160,0.4)';
            c.fillRect(obs.x+2, obs.y, obs.w-4, 3);
            
            // Rune glow
            c.fillStyle=`rgba(100,180,255,${runePulse})`;
            c.font='bold 10px Arial';c.textAlign='center';
            c.fillText('◇', obs.x+obs.w/2, obs.y+obs.h/2+4);
            
            // Edge glow
            c.strokeStyle=`rgba(100,150,255,${runePulse*0.5})`;
            c.lineWidth=1;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 3);c.stroke();
            
        } else {
            // Default: floating stone slab (original style)
            // Platform shadow
            c.fillStyle='rgba(0,0,0,0.2)';
            c.beginPath();c.roundRect(obs.x+2, obs.y+3, obs.w, obs.h, 4);c.fill();
            
            // Platform body with stone gradient
            const platGrad=c.createLinearGradient(obs.x, obs.y, obs.x, obs.y+obs.h);
            platGrad.addColorStop(0,'#6a5a7a');
            platGrad.addColorStop(0.5,'#4a3a5a');
            platGrad.addColorStop(1,'#3a2a4a');
            c.fillStyle=platGrad;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 4);c.fill();
            
            // Platform top highlight
            c.fillStyle='rgba(150,120,180,0.4)';
            c.fillRect(obs.x+2, obs.y, obs.w-4, 3);
            
            // Rune glow on platform
            c.fillStyle=`rgba(150,100,200,${runePulse})`;
            c.font='bold 10px Arial';c.textAlign='center';
            c.fillText('◆', obs.x+obs.w/2, obs.y+obs.h/2+4);
            
            // Edge glow
            c.strokeStyle=`rgba(150,80,255,${runePulse*0.5})`;
            c.lineWidth=1;
            c.beginPath();c.roundRect(obs.x, obs.y, obs.w, obs.h, 4);c.stroke();
        }
    }
    c.textAlign='left';
    
    // Draw boss
    if(boss){
        const bossColors={
            slime:{body:'#44ff44',dark:'#228822',eye:'#ff0000',glow:'100,255,100'},
            dragon:{body:'#ff4444',dark:'#aa2222',eye:'#ffff00',glow:'255,100,100'},
            golem:{body:'#888888',dark:'#555555',eye:'#ff8800',glow:'180,180,180'},
            ghost:{body:'#aaaaff',dark:'#6666aa',eye:'#ff00ff',glow:'150,150,255'},
            demon:{body:'#ff2200',dark:'#880000',eye:'#ffff00',glow:'255,50,0'},
            arachnid:{body:'#4a0066',dark:'#2a0044',eye:'#ff0066',glow:'100,0,150'},
            hydra:{body:'#006644',dark:'#003322',eye:'#00ff88',glow:'0,200,100'},
            reaper:{body:'#1a1a2e',dark:'#0a0a15',eye:'#ff0044',glow:'200,0,80'},
            abomination:{body:'#664422',dark:'#442200',eye:'#ff4400',glow:'180,100,50'},
            voidlord:{body:'#0a0020',dark:'#050010',eye:'#aa00ff',glow:'100,0,255'}
        };
        const colors=bossColors[boss.type]||bossColors.slime;
        const bcx=boss.x+boss.w/2, bcy=boss.y+boss.h/2;
        const breathe = Math.sin(fc*0.06)*3;
        const isScary = boss.formIndex >= 5;
        
        // Boss shadow
        c.fillStyle='rgba(0,0,0,0.3)';
        c.beginPath();
        c.ellipse(bcx, GY+5, boss.w/2+5, 8, 0, 0, Math.PI*2);
        c.fill();
        
        // Boss glow aura - scarier forms have pulsing glow
        const glowPulse = isScary ? Math.sin(fc*0.08)*5 : breathe;
        c.fillStyle=`rgba(${colors.glow},${isScary?0.25:0.15})`;
        c.beginPath();
        c.ellipse(bcx,bcy,boss.w/2+15+glowPulse,boss.h/2+15+glowPulse,0,0,Math.PI*2);
        c.fill();
        if(isScary){
            // Double aura for scary forms
            c.fillStyle=`rgba(${colors.glow},0.08)`;
            c.beginPath();
            c.ellipse(bcx,bcy,boss.w/2+30+glowPulse*2,boss.h/2+25+glowPulse*2,0,0,Math.PI*2);
            c.fill();
        }
        
        // Boss body - different shapes per type
        const bodyGrad=c.createRadialGradient(bcx-10,bcy-15,5,bcx,bcy,boss.w/2+5);
        bodyGrad.addColorStop(0,colors.body);
        bodyGrad.addColorStop(1,colors.dark);
        c.fillStyle=bodyGrad;
        
        if(boss.type==='ghost'){
            c.beginPath();
            c.moveTo(bcx-boss.w/2, bcy);
            for(let i=0; i<=8; i++){
                const angle = (i/8)*Math.PI;
                const wave = Math.sin(fc*0.1+i)*3;
                c.quadraticCurveTo(
                    bcx-boss.w/2+Math.cos(angle)*(boss.w/2+wave),
                    bcy+Math.sin(angle)*(boss.h/2+wave),
                    bcx-boss.w/2+Math.cos(angle+0.4)*(boss.w/2),
                    bcy+Math.sin(angle+0.4)*(boss.h/2)
                );
            }
            c.closePath();c.fill();
            c.globalAlpha=0.7;c.fill();c.globalAlpha=1;
        } else if(boss.type==='arachnid'){
            // Spider body - round with segmented abdomen
            c.beginPath();
            c.ellipse(bcx,bcy,boss.w/2+breathe/2,boss.h/2+breathe/2,0,0,Math.PI*2);
            c.fill();
            // Abdomen
            c.fillStyle=colors.dark;
            c.beginPath();
            c.ellipse(bcx,bcy+boss.h*0.3,boss.w*0.4,boss.h*0.25,0,0,Math.PI*2);
            c.fill();
            // Hourglass marking
            c.fillStyle='#ff0044';
            c.beginPath();
            c.moveTo(bcx-6,bcy+boss.h*0.2);
            c.lineTo(bcx,bcy+boss.h*0.3);
            c.lineTo(bcx+6,bcy+boss.h*0.2);
            c.lineTo(bcx,bcy+boss.h*0.4);
            c.closePath();c.fill();
        } else if(boss.type==='hydra'){
            // Multi-headed body - thick serpentine trunk
            c.beginPath();
            c.ellipse(bcx,bcy+10,boss.w*0.35,boss.h*0.4,0,0,Math.PI*2);
            c.fill();
            // Three necks and heads
            for(let h=0;h<3;h++){
                const neckX = bcx + (h-1)*25;
                const neckWave = Math.sin(fc*0.08+h*2)*8;
                c.strokeStyle=colors.body;
                c.lineWidth=8;
                c.beginPath();
                c.moveTo(bcx+(h-1)*10, bcy-10);
                c.quadraticCurveTo(neckX+neckWave, bcy-40, neckX+neckWave*1.5, boss.y-10+h*5);
                c.stroke();
                // Head
                c.fillStyle=colors.body;
                c.beginPath();
                c.ellipse(neckX+neckWave*1.5, boss.y-10+h*5, 12, 9, 0, 0, Math.PI*2);
                c.fill();
                // Head eye
                c.fillStyle=colors.eye;
                c.beginPath();
                c.arc(neckX+neckWave*1.5+3, boss.y-12+h*5, 3, 0, Math.PI*2);
                c.fill();
            }
        } else if(boss.type==='reaper'){
            // Hooded figure with tattered cloak
            c.beginPath();
            c.moveTo(bcx, boss.y-5);
            c.lineTo(bcx+boss.w*0.4, bcy);
            c.lineTo(bcx+boss.w*0.5, boss.y+boss.h);
            c.lineTo(bcx-boss.w*0.5, boss.y+boss.h);
            c.lineTo(bcx-boss.w*0.4, bcy);
            c.closePath();c.fill();
            // Hood
            c.fillStyle=colors.dark;
            c.beginPath();
            c.arc(bcx, boss.y+15, 22, 0, Math.PI*2);
            c.fill();
            // Hood shadow
            c.fillStyle='rgba(0,0,0,0.7)';
            c.beginPath();
            c.arc(bcx, boss.y+18, 16, 0, Math.PI*2);
            c.fill();
            // Scythe
            const scytheAngle = Math.sin(fc*0.05)*0.3;
            c.save();
            c.translate(bcx+boss.w*0.35, bcy);
            c.rotate(scytheAngle);
            c.strokeStyle='#666';c.lineWidth=3;
            c.beginPath();c.moveTo(0,-30);c.lineTo(0,30);c.stroke();
            c.fillStyle='#aaa';
            c.beginPath();c.moveTo(0,-30);c.quadraticCurveTo(-20,-35,-15,-20);c.lineTo(0,-25);c.closePath();c.fill();
            c.restore();
        } else if(boss.type==='abomination'){
            // Twisted mass - irregular lumpy body
            c.beginPath();
            c.moveTo(bcx-boss.w*0.4, bcy-boss.h*0.3);
            for(let i=0;i<12;i++){
                const angle = (i/12)*Math.PI*2;
                const r = boss.w*0.4 + Math.sin(fc*0.05+i*3)*8 + (i%3)*5;
                c.lineTo(bcx+Math.cos(angle)*r, bcy+Math.sin(angle)*r*0.8);
            }
            c.closePath();c.fill();
            // Multiple eyes scattered on body
            c.fillStyle=colors.eye;
            for(let i=0;i<5;i++){
                const ex = bcx + Math.cos(i*1.3)*boss.w*0.25;
                const ey = bcy + Math.sin(i*1.7)*boss.h*0.2;
                c.beginPath();c.arc(ex,ey,3+Math.sin(fc*0.1+i)*1,0,Math.PI*2);c.fill();
            }
        } else if(boss.type==='voidlord'){
            // Ethereal void entity - shifting geometric shape
            c.beginPath();
            const points = 7;
            for(let i=0;i<=points;i++){
                const angle = (i/points)*Math.PI*2;
                const r = boss.w*0.45 + Math.sin(fc*0.04+i*2)*10;
                const px = bcx+Math.cos(angle)*r;
                const py = bcy+Math.sin(angle)*r*0.85;
                if(i===0) c.moveTo(px,py); else c.lineTo(px,py);
            }
            c.closePath();c.fill();
            // Void core
            c.fillStyle='rgba(0,0,0,0.8)';
            c.beginPath();
            c.arc(bcx,bcy,15+Math.sin(fc*0.1)*3,0,Math.PI*2);
            c.fill();
            // Orbiting runes
            c.fillStyle=`rgba(${colors.glow},0.6)`;
            for(let i=0;i<4;i++){
                const orbAngle = fc*0.03+i*Math.PI/2;
                const orbR = boss.w*0.35;
                c.beginPath();
                c.arc(bcx+Math.cos(orbAngle)*orbR, bcy+Math.sin(orbAngle)*orbR*0.6, 4, 0, Math.PI*2);
                c.fill();
            }
        } else if(boss.type==='demon'){
            c.beginPath();
            c.moveTo(bcx, boss.y);
            c.lineTo(bcx+boss.w/2, bcy);
            c.lineTo(bcx+boss.w/3, boss.y+boss.h);
            c.lineTo(bcx-boss.w/3, boss.y+boss.h);
            c.lineTo(bcx-boss.w/2, bcy);
            c.closePath();c.fill();
        } else {
            c.beginPath();
            c.ellipse(bcx,bcy+breathe/2,boss.w/2+breathe/2,boss.h/2+breathe/2,0,0,Math.PI*2);
            c.fill();
        }
        
        // Boss outline
        c.strokeStyle='rgba(0,0,0,0.6)';
        c.lineWidth=isScary?4:3;
        c.stroke();
        
        // Type-specific features (horns, wings, legs, etc.)
        if(boss.type==='dragon'){
            c.fillStyle=colors.dark;
            c.beginPath();c.moveTo(bcx-20,boss.y+10);c.lineTo(bcx-30,boss.y-15);c.lineTo(bcx-10,boss.y+15);c.closePath();c.fill();
            c.beginPath();c.moveTo(bcx+20,boss.y+10);c.lineTo(bcx+30,boss.y-15);c.lineTo(bcx+10,boss.y+15);c.closePath();c.fill();
            c.fillStyle='rgba(200,50,50,0.6)';
            c.beginPath();c.moveTo(bcx-boss.w/2,bcy);c.lineTo(bcx-boss.w-10,bcy-20);c.lineTo(bcx-boss.w/2,bcy+20);c.closePath();c.fill();
            c.beginPath();c.moveTo(bcx+boss.w/2,bcy);c.lineTo(bcx+boss.w+10,bcy-20);c.lineTo(bcx+boss.w/2,bcy+20);c.closePath();c.fill();
        } else if(boss.type==='golem'){
            c.fillStyle=colors.dark;
            c.fillRect(bcx-25,boss.y+5,12,20);
            c.fillRect(bcx+13,boss.y+5,12,20);
            c.strokeStyle='rgba(0,0,0,0.3)';c.lineWidth=1;
            c.beginPath();c.moveTo(bcx-10,bcy);c.lineTo(bcx-5,bcy+15);c.stroke();
            c.beginPath();c.moveTo(bcx+10,bcy-5);c.lineTo(bcx+8,bcy+10);c.stroke();
        } else if(boss.type==='ghost'){
            c.fillStyle='rgba(200,200,255,0.5)';
            for(let i=0; i<5; i++){
                const px = bcx + Math.sin(fc*0.05+i*1.2)*20;
                const py = bcy + Math.cos(fc*0.05+i*1.2)*15;
                c.beginPath();c.arc(px,py,2,0,Math.PI*2);c.fill();
            }
        } else if(boss.type==='demon'){
            c.fillStyle='#440000';
            c.beginPath();c.moveTo(bcx-15,boss.y);c.lineTo(bcx-20,boss.y-20);c.lineTo(bcx-10,boss.y+5);c.closePath();c.fill();
            c.beginPath();c.moveTo(bcx+15,boss.y);c.lineTo(bcx+20,boss.y-20);c.lineTo(bcx+10,boss.y+5);c.closePath();c.fill();
            c.strokeStyle='#880000';c.lineWidth=4;
            c.beginPath();c.moveTo(bcx,boss.y+boss.h);c.quadraticCurveTo(bcx+20,boss.y+boss.h+10,bcx+30,boss.y+boss.h-5);c.stroke();
        } else if(boss.type==='slime'){
            c.fillStyle=colors.body;
            for(let i=0; i<3; i++){
                const dx = bcx-15+i*15;
                const dy = boss.y+boss.h+Math.sin(fc*0.1+i)*3;
                c.beginPath();c.arc(dx,dy,4,0,Math.PI*2);c.fill();
            }
        } else if(boss.type==='arachnid'){
            // 8 spider legs with joints
            c.strokeStyle=colors.body;c.lineWidth=3;c.lineCap='round';
            for(let i=0;i<8;i++){
                const side = i<4?-1:1;
                const legIdx = i%4;
                const baseX = bcx + side*boss.w*0.3;
                const baseY = bcy - 5 + legIdx*12;
                const legWave = Math.sin(fc*0.12+i*0.8)*8;
                const midX = baseX + side*25;
                const midY = baseY - 15 + legWave;
                const endX = baseX + side*40 + legWave*0.5;
                const endY = GY - 5;
                c.beginPath();
                c.moveTo(baseX, baseY);
                c.quadraticCurveTo(midX, midY, endX, endY);
                c.stroke();
            }
            // Fangs
            c.fillStyle='#ff0044';
            c.beginPath();c.moveTo(bcx-8,bcy+5);c.lineTo(bcx-5,bcy+15);c.lineTo(bcx-2,bcy+5);c.closePath();c.fill();
            c.beginPath();c.moveTo(bcx+8,bcy+5);c.lineTo(bcx+5,bcy+15);c.lineTo(bcx+2,bcy+5);c.closePath();c.fill();
        } else if(boss.type==='hydra'){
            // Tail
            const tailWave = Math.sin(fc*0.06)*15;
            c.strokeStyle=colors.body;c.lineWidth=6;
            c.beginPath();
            c.moveTo(bcx, bcy+boss.h*0.3);
            c.quadraticCurveTo(bcx+tailWave, bcy+boss.h*0.5, bcx+tailWave*1.5, boss.y+boss.h+10);
            c.stroke();
            // Scales shimmer
            c.fillStyle='rgba(0,255,100,0.2)';
            for(let i=0;i<6;i++){
                const sx = bcx+Math.sin(i*1.5)*boss.w*0.2;
                const sy = bcy-boss.h*0.1+i*8;
                c.beginPath();c.arc(sx,sy,3,0,Math.PI*2);c.fill();
            }
        } else if(boss.type==='reaper'){
            // Tattered cloak edges fluttering
            c.fillStyle='rgba(20,10,30,0.6)';
            for(let i=0;i<5;i++){
                const tX = bcx-boss.w*0.4+i*boss.w*0.2;
                const tWave = Math.sin(fc*0.08+i*1.5)*5;
                c.beginPath();
                c.moveTo(tX, boss.y+boss.h-10);
                c.lineTo(tX+5, boss.y+boss.h+10+tWave);
                c.lineTo(tX+10, boss.y+boss.h-10);
                c.closePath();c.fill();
            }
            // Glowing eyes in hood
            c.fillStyle=colors.eye;
            c.beginPath();c.arc(bcx-6, boss.y+16, 3+Math.sin(fc*0.15)*0.5, 0, Math.PI*2);c.fill();
            c.beginPath();c.arc(bcx+6, boss.y+16, 3+Math.sin(fc*0.15)*0.5, 0, Math.PI*2);c.fill();
        } else if(boss.type==='abomination'){
            // Extra limbs - arms and tentacles growing from body
            c.strokeStyle=colors.body;c.lineWidth=5;c.lineCap='round';
            // Left arm (clawed)
            const armWave = Math.sin(fc*0.07)*10;
            c.beginPath();
            c.moveTo(bcx-boss.w*0.35, bcy-10);
            c.quadraticCurveTo(bcx-boss.w*0.6, bcy-20+armWave, bcx-boss.w*0.7, bcy+armWave);
            c.stroke();
            // Claw
            c.fillStyle=colors.dark;
            c.beginPath();
            c.moveTo(bcx-boss.w*0.7, bcy+armWave);
            c.lineTo(bcx-boss.w*0.75, bcy-8+armWave);
            c.lineTo(bcx-boss.w*0.65, bcy+armWave);
            c.lineTo(bcx-boss.w*0.75, bcy+8+armWave);
            c.closePath();c.fill();
            // Right arm
            c.beginPath();
            c.moveTo(bcx+boss.w*0.35, bcy-10);
            c.quadraticCurveTo(bcx+boss.w*0.6, bcy-25-armWave, bcx+boss.w*0.7, bcy-armWave);
            c.stroke();
            c.fillStyle=colors.dark;
            c.beginPath();
            c.moveTo(bcx+boss.w*0.7, bcy-armWave);
            c.lineTo(bcx+boss.w*0.75, bcy-8-armWave);
            c.lineTo(bcx+boss.w*0.65, bcy-armWave);
            c.lineTo(bcx+boss.w*0.75, bcy+8-armWave);
            c.closePath();c.fill();
            // Tentacle legs
            for(let i=0;i<3;i++){
                const tx = bcx-15+i*15;
                const tWave = Math.sin(fc*0.1+i*2)*6;
                c.strokeStyle=colors.dark;c.lineWidth=4;
                c.beginPath();
                c.moveTo(tx, bcy+boss.h*0.3);
                c.quadraticCurveTo(tx+tWave, bcy+boss.h*0.6, tx+tWave*1.5, GY-5);
                c.stroke();
            }
        } else if(boss.type==='voidlord'){
            // Void tendrils extending from body
            c.strokeStyle=`rgba(${colors.glow},0.5)`;c.lineWidth=3;
            for(let i=0;i<6;i++){
                const angle = (i/6)*Math.PI*2 + fc*0.02;
                const tendrilLen = boss.w*0.5 + Math.sin(fc*0.05+i)*10;
                const startX = bcx + Math.cos(angle)*boss.w*0.3;
                const startY = bcy + Math.sin(angle)*boss.h*0.3;
                const endX = bcx + Math.cos(angle)*tendrilLen;
                const endY = bcy + Math.sin(angle)*tendrilLen*0.7;
                const cpX = (startX+endX)/2 + Math.sin(fc*0.08+i)*15;
                const cpY = (startY+endY)/2 + Math.cos(fc*0.06+i)*15;
                c.beginPath();
                c.moveTo(startX, startY);
                c.quadraticCurveTo(cpX, cpY, endX, endY);
                c.stroke();
                // Void spark at tip
                c.fillStyle=`rgba(${colors.glow},0.7)`;
                c.beginPath();c.arc(endX,endY,3,0,Math.PI*2);c.fill();
            }
            // Floating void runes around the body
            c.fillStyle=`rgba(${colors.glow},0.4)`;
            c.font='bold 12px Arial';c.textAlign='center';
            const runes = ['◆','◇','★','◎'];
            for(let i=0;i<4;i++){
                const runeAngle = fc*0.02+i*Math.PI/2;
                const runeR = boss.w*0.6;
                const rx = bcx + Math.cos(runeAngle)*runeR;
                const ry = bcy + Math.sin(runeAngle)*runeR*0.5;
                c.fillText(runes[i], rx, ry);
            }
        }
        
        // Boss eyes (main eyes) - skip for hydra (has head eyes) and reaper (has hood eyes)

    c.beginPath();c.roundRect(dnX,dnY,BF_BTN,BF_BTN,6);c.fill();
    c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=1.5;

    c.fillStyle='#fff';
    c.fillText('↓',dnX+half,dnY+half+5);
    
    // Left button
    const ltX=BF_CX-half-BF_BTN-BF_GAP, ltY=BF_CY-half;
    c.fillStyle='rgba(255,255,255,0.25)';
    c.beginPath();c.roundRect(ltX,ltY,BF_BTN,BF_BTN,6);c.fill();
    c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=1.5;

    c.fillText('←',ltX+half,ltY+half+5);
    
    // Right button
    const rtX=BF_CX+half+BF_GAP, rtY=BF_CY-half;
    c.fillStyle='rgba(255,255,255,0.25)';
    c.beginPath();c.roundRect(rtX,rtY,BF_BTN,BF_BTN,6);c.fill();
    c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=1.5;

    c.fillStyle='#fff';
    c.fillText('→',rtX+half,rtY+half+5);
    
    // Skill button - above pause button
    const skillX=35, skillY=345, skillR=12;
    const canUseSkill = skillReady && !skillActive && coinCount >= charSkillCosts[selectedCharacter];
    const skillActiveGlow = skillActive ? Math.sin(fc*0.2)*0.3+0.7 : 0;
    if(canUseSkill){
        const glowGrad=c.createRadialGradient(skillX,skillY,skillR*0.5,skillX,skillY,skillR*1.5);
        glowGrad.addColorStop(0,'rgba(255,204,0,0.8)');
        glowGrad.addColorStop(1,'rgba(255,204,0,0)');
        c.fillStyle=glowGrad;
        c.beginPath();c.arc(skillX,skillY,skillR*1.5,0,Math.PI*2);c.fill();
        c.fillStyle='rgba(255,204,0,0.9)';
    } else if(skillActive){
        c.fillStyle=`rgba(100,255,100,${skillActiveGlow})`;
    } else {
        c.fillStyle='rgba(100,100,100,0.6)';
    }
    c.beginPath();c.arc(skillX,skillY,skillR,0,Math.PI*2);c.fill();
    c.strokeStyle=canUseSkill?'#ffcc00':(skillActive?'#66ff66':'rgba(255,255,255,0.3)');
    c.lineWidth=canUseSkill?2:1;
    c.beginPath();c.arc(skillX,skillY,skillR,0,Math.PI*2);c.stroke();
    c.fillStyle=canUseSkill||skillActive?'#fff':'#888';
    c.font='bold 14px Arial';
    c.textAlign='center';
    c.fillText('技',skillX,skillY+5);
    if(skillActive){
        const remaining = Math.ceil(skillTimer/60);
        c.fillStyle='rgba(0,0,0,0.7)';
        c.beginPath();c.roundRect(skillX-15,skillY-25,30,14,3);c.fill();
        c.fillStyle='#66ff66';
        c.font='bold 10px Arial';
        c.fillText(remaining+'s',skillX,skillY-15);
    }
    c.textAlign='left';
    
    // Settings/Pause button - bottom left
    c.fillStyle=paused?'rgba(46,204,112,0.7)':'rgba(0,0,0,0.35)';
    c.beginPath();c.roundRect(12,370,55,22,5);c.fill();
    c.strokeStyle='rgba(255,255,255,0.4)';c.lineWidth=1;
    c.beginPath();c.roundRect(12,370,55,22,5);c.stroke();
    c.fillStyle='#ccc';c.font='11px Arial';
    c.fillText(paused?'▶继续':'⏸暂停',39,384);
    c.textAlign='left';
}
