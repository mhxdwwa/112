<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>酷跑冒险</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; user-select: none; touch-action: none;
        }
        .game-wrapper {
            position: relative;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .game-canvas {
            width: 100%; max-width: 1850px;
            aspect-ratio: 185 / 90;
            position: relative; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        @media (max-width: 768px) and (orientation: landscape) {
            .game-canvas { width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto; }
        }
        /* Portrait: rotate game to fill screen as landscape */
        @media (max-width: 768px) and (orientation: portrait) {
            .game-canvas {
                width: 100vh !important; height: 100vw !important;
                max-width: none !important; aspect-ratio: auto !important;
                transform: rotate(90deg);
                transform-origin: center center;
                position: absolute;
                top: 50% !important; left: 50% !important;
                margin-top: calc(-50vw) !important;
                margin-left: calc(-50vh) !important;
            }
        }
        /* Manual force-landscape override */
        .force-landscape .game-canvas {
            width: 100vh !important; height: 100vw !important;
            max-width: none !important; aspect-ratio: auto !important;
            transform: rotate(90deg) !important;
            transform-origin: center center;
            position: absolute;
            top: 50% !important; left: 50% !important;
            margin-top: calc(-50vw) !important;
            margin-left: calc(-50vh) !important;
        }
        /* Orientation toggle button */
        #rotateBtn {
            position: fixed;
            z-index: 10000;
            bottom: 10px; right: 10px;
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(0,0,0,0.75);
            border: 2px solid rgba(255,255,255,0.5);
            color: #fff;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }
        #rotateBtn:active { background: rgba(80,80,80,0.9); }
        
        /* 隐藏桌面端的旋转按钮，只在手机端显示 */
        @media (min-width: 769px) {
            #rotateBtn {
                display: none !important;
            }
        }
    </style>
</head>

// Orientation rotation system
let isGameRotated = false;
function isPortraitMode() {
    if (isGameRotated) return false; // forced landscape via button
    return window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
}
function isDisplayRotated() {
    return isPortraitMode() || isGameRotated;
}
// Map touch coordinates to game coordinates (800x400 virtual canvas)
function mapTouchToGame(clientX, clientY) {
    const cvsEl = document.querySelector('.game-canvas');
    const rect = cvsEl.getBoundingClientRect();
    // Raw ratio within the bounding rect
    const rx = (clientX - rect.left) / rect.width;
    const ry = (clientY - rect.top) / rect.height;
    if (isDisplayRotated()) {
        // CSS rotate(90deg): visual X comes from canvas Y, visual Y from canvas (width-X)
        // Mapping: gameX = ry * 800, gameY = (1 - rx) * 400
        return { gx: ry * 800, gy: (1 - rx) * 400 };
    } else {
        return { gx: rx * 800, gy: ry * 400 };
    }
}
// Rotate button handler
(function(){
    const btn = document.getElementById('rotateBtn');
    btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        isGameRotated = !isGameRotated;
        const wrapper = document.querySelector('.game-wrapper');
        if(isGameRotated){
            wrapper.classList.add('force-landscape');
            btn.innerHTML = '&#x21BA;'; // reverse arrow
        } else {
            wrapper.classList.remove('force-landscape');
            btn.innerHTML = '&#x21BB;'; // forward arrow
        }
    });
    btn.addEventListener('touchstart', function(e){
        e.preventDefault();
        e.stopPropagation();
        btn.click();
    });
})();

let maxUnlockedLevel=1;
let levelHighScores={};
let levelBestCoins={};
let totalSilverEarned=0;
let petGoldCoins=0;
let silverBalance=0;
let ownedCharacters=[0];
let bossKillBonusClaimed={};

window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d || !d.type) return;
    if (d.type === 'happyrun-init') {
        maxUnlockedLevel = d.data.maxLevel || 1;
        levelHighScores = d.data.levelScores || {};
        levelBestCoins = d.data.levelBestCoins || {};
        totalSilverEarned = d.data.totalSilver || 0;
        silverBalance = d.data.silverBalance || 0;
        petGoldCoins = d.data.petGold || 0;
        ownedCharacters = d.data.ownedChars || [0];
        bossKillBonusClaimed = d.data.bossKillBonus || {};
    }
    if (d.type === 'happyrun-quiz-answer') {
        handleQuizAnswer(d.data.correct);
    }
    if (d.type === 'happyrun-quiz-question') {
        quizCurrentQuestion = d.data.question;
        quizOptions = d.data.options || [];
        quizCorrectIdx = d.data.correctIndex || 0;
    }
});

function saveLevelProgress(){
    parent.postMessage({type:'happyrun-save', data:{
        maxLevel: maxUnlockedLevel,
        levelScores: levelHighScores,
        levelBestCoins: levelBestCoins,
        totalSilver: totalSilverEarned,
        silverBalance: silverBalance,
        petGold: petGoldCoins,
        ownedChars: ownedCharacters,
        bossKillBonus: bossKillBonusClaimed

}

function recalcSilver() {
    totalSilverEarned = 0;
    for (var k in levelBestCoins) {
        if (levelBestCoins.hasOwnProperty(k)) {
            totalSilverEarned += levelBestCoins[k];
        }
    }
}

let P={x:PX,y:GY-PH,vy:0,vx:0,gnd:true,duck:false,af:0,onPlat:-1,onCrate:-1,onPlatH:0,onCrateTop:0,pushX:0,moveLeft:false,moveRight:false,moveUp:false,moveDown:false,shooting:false,facing:1};
let pits=[],ohs=[],plats=[],nails=[],bullets=[],powerups=[],parts=[],coins=[];
let bats=[],tigers=[],stormClouds=[],skillClones=[];
let nextSpawn=0,gndScr=0;
let coinCount=0;
let totalCoinsInLevel=0; // Track total coins collected this level (not deducted by skills)
let clouds=[],mtns=[];

// Boss fight system
let boss=null;

let transRoomX=400;

for(let i=0;i<5;i++) clouds.push({x:Math.random()*800,y:30+Math.random()*70,w:50+Math.random()*70,s:0.2+Math.random()*0.3});
for(let i=0;i<8;i++) mtns.push({x:i*130-50,h:50+Math.random()*70});

function startGame(fromLevel){
    if(state==='playing') return;
    getAudioCtx();
    P={x:PX,y:GY-PH,vy:0,vx:0,gnd:true,duck:false,af:0,onPlat:-1,onCrate:-1,onPlatH:0,onCrateTop:0,pushX:0,moveLeft:false,moveRight:false,moveUp:false,moveDown:false,shooting:false,facing:1};
    pits=[];ohs=[];plats=[];nails=[];bullets=[];powerups=[];parts=[];coins=[];bats=[];tigers=[];stormClouds=[];skillClones=[];
    fc=0;dist=0;spd=BASE_SPD;nextSpawn=0;gndScr=0;
    lives=3;invincible=0;hasShield=false;wingTimer=0;coinCount=0;totalCoinsInLevel=0;
    skillReady=false;skillActive=false;skillTimer=0;skillDuration=0;
    skillEffects={glide:false,dash:false,freeze:false,shield:false,doubleScore:false};
    playerBullets=[];boss=null;bossHP=0;bossDefeated=false;bossWarning=0;bossBullets=[];bossSkillTimer=0;bossCurrentSkill=0;bossLaser=null;bossBombs=[];bossObstacles=[];weaponProjectile=null;pendingBossSkill=-1;
    if(fromLevel&&fromLevel>1){
        currentLevel=fromLevel;

        dist=d; levelStartDist=d;

    quizRevivalAttempts=0; quizRevivalHeartsEarned=0; quizRevivalFailed=false;

}

function restartFromLevel(){ startGame(currentLevel); }
function goToMainMenu(){ state='mainMenu'; }
function revivePlayer(){
    quizDisabledOptions = [];
    quizRevivalActive = true;
    quizAnswered = false;
    state = 'quizRevival';
    parent.postMessage({type:'happyrun-quiz-request', data:{
        attempts: quizRevivalAttempts
    }}, '*');
}

function handleQuizAnswer(correct) {
    if (!quizRevivalActive || quizAnswered) return;
    quizAnswered = true;
    
    if (correct) {
        quizRevivalAttempts++;
        
        // 答错3次后，即使答对也复活失败
        if (quizDisabledOptions.length >= 3) {
            quizRevivalActive = false;
            quizRevivalFailed = true;
            state = 'quizResult';
            return;
        }
        
        var hearts = 0;
        if (quizRevivalAttempts === 1) hearts = 2;
        else if (quizRevivalAttempts === 2) hearts = 1;
        
        if (hearts > 0) {
            // 答对复活成功
            quizRevivalHeartsEarned += hearts;
            lives = quizRevivalHeartsEarned;
            invincible = INVINCIBLE_TIME + 60;
            wingTimer = 720;
            P.y = GY - PH; P.vy = 0; P.gnd = false; P.duck = false;
            P.onPlat = -1; P.onCrate = -1; P.pushX = 0;
            mkParts(PX + PW/2, GY - PH/2, 20, '#2ecc71');
            mkParts(PX + PW/2, GY - PH/2, 15, '#ffdd00');
            playSound('powerup');
            quizRevivalActive = false;
            state = 'playing';
        } else {
            // 第3次答对，复活失败
            quizRevivalActive = false;
            quizRevivalFailed = true;
            state = 'quizResult';
        }
    } else {
        // 答错：禁用该选项，保持在答题界面
        playSound('hit');
        quizDisabledOptions.push(quizAnsweredIdx);
        setTimeout(function(){ quizAnswered = false; }, 300);
    }
}

let audioCtx=null;
function getAudioCtx(){ if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} return audioCtx; }

function playSound(type){
    const ac=getAudioCtx();if(!ac)return;
    try{
        if(ac.state==='suspended')ac.resume();
        const osc=ac.createOscillator(),gain=ac.createGain();
        osc.connect(gain);gain.connect(ac.destination);const now=ac.currentTime;
        if(type==='hit'){osc.type='sawtooth';osc.frequency.setValueAtTime(220,now);osc.frequency.exponentialRampToValueAtTime(80,now+0.3);gain.gain.setValueAtTime(0.3,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.3);osc.start(now);osc.stop(now+0.3);}
        else if(type==='die'){osc.type='square';osc.frequency.setValueAtTime(400,now);osc.frequency.exponentialRampToValueAtTime(50,now+0.6);gain.gain.setValueAtTime(0.3,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.6);osc.start(now);osc.stop(now+0.6);}
        else if(type==='shield'){osc.type='sine';osc.frequency.setValueAtTime(800,now);osc.frequency.exponentialRampToValueAtTime(400,now+0.2);gain.gain.setValueAtTime(0.2,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.2);osc.start(now);osc.stop(now+0.2);}
        else if(type==='powerup'){osc.type='sine';osc.frequency.setValueAtTime(500,now);osc.frequency.exponentialRampToValueAtTime(1200,now+0.25);gain.gain.setValueAtTime(0.2,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.3);osc.start(now);osc.stop(now+0.3);}
        else if(type==='jump'){osc.type='sine';osc.frequency.setValueAtTime(300,now);osc.frequency.exponentialRampToValueAtTime(600,now+0.1);gain.gain.setValueAtTime(0.1,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.1);osc.start(now);osc.stop(now+0.1);}
        else if(type==='coin'){osc.type='sine';osc.frequency.setValueAtTime(988,now);osc.frequency.setValueAtTime(1319,now+0.08);gain.gain.setValueAtTime(0.15,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.15);osc.start(now);osc.stop(now+0.15);}
    }catch(e){}
}

// Skill activation
function activateSkill(){
    if(!skillReady || skillActive || state!=='playing') return;
    const actualCost = charSkillCosts[selectedCharacter];
    if(coinCount < actualCost) return;
    
    coinCount -= actualCost;
    skillActive = true;
    skillReady = false;
    skillCoinsCollected = 0; // Reset coin counter for this skill duration
    playSound('powerup');
    
    // Clear all obstacles, pits, boards, nails and spawn lots of coins for flat road
    pits = [];
    ohs = [];
    plats = [];
    nails = [];
    bullets = [];
    // Spawn many coins in a long flat line
    const baseCoinX = fc * spd + 200;
    for(let i = 0; i < 30; i++){
        const coinY = GY - 20 - Math.sin(i * 0.3) * 30;
        coins.push({wx: baseCoinX + i * 25, wy: coinY, magnetX: 0, magnetY: 0, collected: false});
    }
    // Also spawn some high floating coins
    for(let i = 0; i < 10; i++){
        coins.push({wx: baseCoinX + 100 + i * 30, wy: 210 + Math.sin(i * 0.5) * 20, magnetX: 0, magnetY: 0, collected: false});
    }
    
    // Character-specific skill effects (rebalanced for fair gameplay)
    if(selectedCharacter===0){
        // 星刃 - 空中滑翔8秒 (Glide - avoid obstacles, cost 180)
        skillDuration = 480; // 8 seconds at 60fps
        skillEffects.glide = true;
        wingTimer = skillDuration;
    } else if(selectedCharacter===1){
        // 炎灵 - 火焰冲刺5秒 (Fire dash - speed + invincibility, cost 120)
        skillDuration = 300; // 5 seconds
        skillEffects.dash = true;
        invincible = skillDuration;
        spd = BASE_SPD * 2;
    } else if(selectedCharacter===2){
        skillDuration = 480;
        skillEffects.doubleScore = true;
        invincible = skillDuration;
        skillClones = [];
        for(let i = 0; i < 5; i++){
            skillClones.push({
                x: PX + (i-2)*60,
                y: GY - PH - Math.random()*100,
                targetCoin: -1,
                speed: 4 + Math.random()*2,
                af: 0
            });
        }
    } else if(selectedCharacter===3){
        // 铁卫 - 护盾强化8秒 (Shield boost - invincibility, cost 150)
        skillDuration = 480; // 8 seconds
        skillEffects.shield = true;
        invincible = skillDuration;
        hasShield = true;
    } else if(selectedCharacter===4){
        // 月影 - 影分身12秒 (Shadow clone - double score + speed boost, cost 120)
        skillDuration = 720; // 12 seconds
        skillEffects.doubleScore = true;
        spd = BASE_SPD * 1.3;
    } else if(selectedCharacter===5){
        // 龙胆 - 龙枪突刺 (Dragon charge - speed boost + invincibility, cost 140)
        skillDuration = 360; // 6 seconds
        skillEffects.dash = true;
        invincible = skillDuration;
        spd = BASE_SPD * 1.8;
    } else if(selectedCharacter===6){
        // 凤舞 - 凤翼天翔 (Phoenix soar - high jump + glide, cost 160)
        skillDuration = 480; // 8 seconds
        skillEffects.glide = true;
        wingTimer = skillDuration;
    } else if(selectedCharacter===7){
        // 墨魂 - 墨染乾坤 (Ink domain - slow all obstacles, cost 150)
        skillDuration = 600; // 10 seconds
        skillEffects.freeze = true;
    } else if(selectedCharacter===8){
        // 铁拳 - 流星赶月 (Meteor rush - charging dash, cost 130)
        skillDuration = 300; // 5 seconds
        skillEffects.dash = true;
        invincible = skillDuration;
        spd = BASE_SPD * 2.2;
    } else {
        // 翠烟 - 烟影迷踪 (Mist vanish - teleport forward + invincibility, cost 120)
        skillDuration = 240; // 4 seconds
        skillEffects.shield = true;
        invincible = skillDuration;
        hasShield = true;
        P.x += 80;
    }
    
    skillTimer = skillDuration;
    mkParts(PX+PW/2, P.y+PH/2, 20, '#ffcc00');
}

function activateBossSkill() {
    if(state!=='bossFight' || !boss || bossDefeated) return;
    if(playerMP < 50 || bossSkillCooldown > 0 || bossSkillActiveTimer > 0 || weaponProjectile) return;
    playerMP -= 50;
    bossSkillCooldown = 180;
    pendingBossSkill = selectedCharacter;
    bossSkillType = selectedCharacter;
    const startX = P.x + PW/2;
    const startY = P.y + PH/2;
    const targetX = boss.x + boss.w/2;
    const targetY = boss.y + boss.h/2;
    const flightDuration = 55;
    weaponProjectile = {
        x: startX, y: startY,
        startX: startX, startY: startY,
        targetX: targetX, targetY: targetY,
        charIndex: selectedCharacter,
        timer: 0,
        maxTimer: flightDuration,
        angle: Math.atan2(targetY - startY, targetX - startX),
        trail: [],
        landed: false
    };
    playSound('powerup');
    mkParts(startX, startY, 12, ['#00FFCC','#FF4400','#88CCFF','#FF8800','#AA44FF','#2266CC','#FFD700','#00CC88','#CD7F32','#00B894'][selectedCharacter]);
}

// Update skill effects
function updateSkill(){
    if(!skillActive) return;
    
    skillTimer--;
    if(skillTimer <= 0){
        skillActive = false;
        skillEffects = {glide:false,dash:false,freeze:false,shield:false,doubleScore:false};
        skillClones = [];
        if(selectedCharacter===1 || selectedCharacter===4 || selectedCharacter===5 || selectedCharacter===6 || selectedCharacter===8) spd = BASE_SPD;
        return;
    }
    
    if(skillEffects.freeze){
        spd = BASE_SPD * 0.5;
    }
    if(skillActive && selectedCharacter===2 && skillClones.length > 0){
        // Mark all visible coins as available for clone collection
        for(let i=0; i<coins.length; i++){
            if(!coins[i].collected){
                const sx = w2s(coins[i].wx);
                if(sx >= -50 && sx <= 850){
                    coins[i].targeted = false; // Reset targeted flag for all visible coins
                }
            }
        }
        for(let ci=0; ci<skillClones.length; ci++){
            const clone = skillClones[ci];
            clone.af++;
            // Find nearest uncollected visible coin (ignore targeted flag, all visible coins are fair game)
            let nearestDist = Infinity;
            let nearestIdx = -1;
            for(let i=0; i<coins.length; i++){
                if(coins[i].collected) continue;
                const sx = w2s(coins[i].wx);
                // Collect all coins visible on screen
                if(sx < -50 || sx > 850) continue;
                const dx = sx - clone.x;
                const dy = coins[i].wy - clone.y;
                const d = Math.sqrt(dx*dx + dy*dy);
                if(d < nearestDist){ nearestDist = d; nearestIdx = i; }
            }
            if(nearestIdx >= 0){
                const coin = coins[nearestIdx];
                const sx = w2s(coin.wx);
                const dx = sx - clone.x;
                const dy = coin.wy - clone.y;
                const d = Math.sqrt(dx*dx + dy*dy) || 1;
                // Fast movement toward coin
                const collectSpeed = clone.speed * 1.8;
                clone.x += (dx/d) * collectSpeed;
                clone.y += (dy/d) * collectSpeed;
                if(d < 25){
                    coin.collected = true;
                    const coinValue = skillEffects.doubleScore ? 2 : 1;
                    // During Wukong skill, cap coins collected at 180
                    if(skillCoinsCollected < 180) {
                        const canCollect = Math.min(coinValue, 180 - skillCoinsCollected);
                        coinCount += canCollect;
                        totalCoinsInLevel += canCollect;
                        skillCoinsCollected += canCollect;
                    }
                    playSound('coin');
                    mkParts(clone.x, clone.y, 4, '#C0C0C0');
                }
            } else {
                // No more coins on screen, float around player
                const targetX = PX + (ci - 2) * 50;
                const targetY = P.y - 30 + Math.sin(clone.af * 0.08) * 20;
                clone.x += (targetX - clone.x) * 0.05;
                clone.y += (targetY - clone.y) * 0.05;
            }
        }
    }
}

function hitPlayer(){
    if(invincible>0||wingTimer>0||skillActive)return;
    if(hasShield){hasShield=false;invincible=60;playSound('shield');mkParts(PX-P.pushX+PW/2,P.y+PH/2,12,'#00ccff');return;}
    lives--;playSound('hit');
    if(lives<=0)die();else{invincible=INVINCIBLE_TIME;mkParts(PX-P.pushX+PW/2,P.y+PH/2,15,'#ff4444');}
}

function respawnFromPit(){
    lives--;playSound('hit');
    if(lives<=0){die();return;}
    const wx=s2w(PX+PW/2);let pitStart=0;
    for(const p of pits){if(wx>=p.wx-20&&wx<=p.wx+p.w+20){pitStart=p.wx;break;}}
    P.y=GY-PH;P.vy=0;P.gnd=true;P.duck=false;P.onPlat=-1;P.onCrate=-1;P.pushX=0;
    invincible=INVINCIBLE_TIME+60;mkParts(PX+PW/2,GY,10,'#ffaa44');
}

function die(){
    if(state==='bossFight'){
        // Boss fight defeat - go to defeat reward phase
        lives=1;
        bossDefeated=false;
        calcLevelScore();
        if(currentLevel>maxUnlockedLevel) maxUnlockedLevel=currentLevel;
        saveLevelProgress();
        playSound('die');
        // Clear boss fight elements
        bossBullets=[];
        bossBombs=[];
        bossLaser=null;
        weaponProjectile=null;
        boss=null;
        bossObstacles=[];
        // Reset movement flags to prevent inertia
        P.moveLeft=P.moveRight=P.moveUp=P.moveDown=false;
        // Start defeat reward phase
        state='bossDefeatReward';
        bossDefeatRewardPhase=0;
        bossDefeatRewardTimer=0;
        bossDefeatChest.visible=false;
        bossDefeatShowContinue=false;
        return;
    }
    state='over';
    if(currentLevel>maxUnlockedLevel) maxUnlockedLevel=currentLevel;
    calcLevelScore();
    saveLevelProgress();
    playSound('die');
    mkParts(PX-P.pushX+PW/2,Math.min(P.y+PH/2,GY),20,'#ff4444');
    quizRevivalAttempts = 0;
    quizRevivalHeartsEarned = 0;
    quizRevivalFailed = false;
    quizDisabledOptions = [];
}

function s2w(sx){return sx+fc*spd;}
function w2s(wx){return wx-fc*spd;}

// Calculate level score (200-400 range)
function calcLevelScore(){
    const distScore=Math.min(100,Math.floor((dist-levelStartDist)/30));
    const coinScore=Math.min(50,coinCount);
    const lifeScore=lives*20;
    const bossScore=bossDefeated?100:0;
    levelScore=distScore+coinScore+lifeScore+bossScore;
    levelScore=Math.max(200,Math.min(400,levelScore));
    totalScore+=levelScore;
    if(!levelHighScores[currentLevel]||levelScore>levelHighScores[currentLevel]){
        levelHighScores[currentLevel]=levelScore;
    }
    if(!levelBestCoins[currentLevel] || coinCount > levelBestCoins[currentLevel]){
        var oldBest = levelBestCoins[currentLevel] || 0;
        levelBestCoins[currentLevel] = coinCount;
        recalcSilver();
        silverBalance = totalSilverEarned;
    }
}

// Boss arena obstacles
let bossObstacles=[];

// Initialize boss fight
// 10 demon forms - first 5 are basic, last 5 are scarier (more limbs/horrifying)
const demonForms = [
    'slime','dragon','golem','ghost','demon',
    'arachnid','hydra','reaper','abomination','voidlord'
];
const demonNames = {
    slime:'黏液魔',dragon:'炎龙',golem:'石头人',ghost:'幽灵',demon:'恶魔',
    arachnid:'蛛魔',hydra:'九头蛇',reaper:'死神',abomination:'畸变体',voidlord:'虚空领主'
};

function initBoss(){
    const formIndex = Math.floor(Math.random() * demonForms.length);
    const bossType = demonForms[formIndex];
    const lv = currentLevel - 1;
    const bossHPVal = 3500 + lv * 200; // Gentle linear growth: Lv1=3500, Lv10=5300, Lv50=13300
    const isScary = formIndex >= 5;
    const bw = isScary ? 90 + (formIndex-5)*5 : 80;
    const bh = isScary ? 110 + (formIndex-5)*5 : 100;
    boss={
        type:bossType,
        formIndex:formIndex,
        x:550,y:GY-bh,
        w:bw,h:bh,
        vx:0,vy:0,
        attackTimer:0,
        attackPattern:0,
        hp:bossHPVal,
        maxHP:bossHPVal
    };
    bossMaxHP=boss.hp;
    bossHP=boss.hp;
    bossDefeated=false;
    bossShootTimer=0;
    playerHP=lives*600; // Increased player HP pool for better survivability
    playerBullets=[];
    bossBullets=[];
    bullets=[];
    bossSkillTimer=0;
    bossCurrentSkill=0;
    bossLaser=null;
    bossBombs=[];
    playerMP=50;bossSkillCooldown=0;bossSkillActiveTimer=0;bossSkillType=-1;bossAutoShootTimer=0;weaponProjectile=null;pendingBossSkill=-1;
    bossObstacles=[];
    const obstacleCount = 3 + Math.floor(currentLevel/3);
    // Generate stone slab obstacles (flat floating platforms) - these don't block ground movement
    for(let i=0; i<obstacleCount; i++){
        bossObstacles.push({
            x: 150 + i*150 + Math.random()*50,
            y: 150 + Math.random()*150,
            w: 60 + Math.random()*40,
            h: 20,
            type: 'slab'
        });
    }
    
    // Collect ground obstacles and ensure they don't form enclosed spaces
    // Player width is PW=36, need at least 60px clearance between ground obstacles
    const minGap = 70; // Minimum gap between ground obstacles
    const groundObstacles = [];
    
    // Add box obstacles (crate-like, sit on ground)
    const boxCount = 2 + Math.floor(currentLevel/4);
    for(let i=0; i<boxCount; i++){
        const bw = 35 + Math.random()*20;
        const bh = 35 + Math.random()*25;
        let bx = 80 + i*160 + Math.random()*60;
        const by = GY - bh;
        
        // Ensure not too close to left wall
        bx = Math.max(60, bx);
        // Ensure not too close to right wall
        bx = Math.min(720 - bw, bx);
        
        // Check spacing with existing ground obstacles
        let valid = true;
        for(const obs of groundObstacles){
            const gap = Math.max(0, Math.max(obs.x - (bx + bw), bx - (obs.x + obs.w)));
            if(gap < minGap){
                valid = false;
                break;
            }
        }
        
        if(valid){
            const newObs = { x: bx, y: by, w: bw, h: bh, type: 'box' };
            groundObstacles.push(newObs);
            bossObstacles.push(newObs);
        }
    }
    
    // Add tall stone slab obstacles (vertical stone blocks)
    const slabCount = 1 + Math.floor(currentLevel/5);
    for(let i=0; i<slabCount; i++){
        const sw = 25 + Math.random()*15;
        const sh = 50 + Math.random()*40;
        let sx = 150 + i*180 + Math.random()*60;
        const sy = GY - sh;
        
        // Ensure not too close to walls
        sx = Math.max(60, sx);
        sx = Math.min(720 - sw, sx);
        
        // Check spacing with existing ground obstacles
        let valid = true;
        for(const obs of groundObstacles){
            const gap = Math.max(0, Math.max(obs.x - (sx + sw), sx - (obs.x + obs.w)));
            if(gap < minGap){
                valid = false;
                break;
            }
        }
        
        if(valid){
            const newObs = { x: sx, y: sy, w: sw, h: sh, type: 'stone' };
            groundObstacles.push(newObs);
            bossObstacles.push(newObs);
        }
    }
    
    // Final validation: ensure no obstacle creates enclosed space with walls
    // Check if any ground obstacle is too close to both walls or creates tight corners
    for(const obs of bossObstacles){
        if(obs.type === 'box' || obs.type === 'stone'){
            // Ensure at least 50px from left wall
            if(obs.x < 50) obs.x = 50;
            // Ensure at least 50px from right wall (accounting for obstacle width)
            if(obs.x + obs.w > 750) obs.x = 750 - obs.w;
        }
    }
    
    P.x=150;P.y=GY-PH;
    P.vx=0;P.vy=0;
    P.gnd=true;
    if(wingTimer <= 0) wingTimer = 720;
    state='bossFight';
}

function lastObsEnd(){
    let e=0;
    for(const p of pits)e=Math.max(e,p.wx+p.w);
    for(const o of ohs)e=Math.max(e,o.wx+o.w);
    for(const p of plats)e=Math.max(e,p.wx+p.w);
    for(const n of nails)e=Math.max(e,n.wx+20);
    return e;
}

function spawnObs(){
    const lf=Math.min(currentLevel,20); // Extended scaling to level 20
    const minGap=Math.max(140,420-fc*0.004-lf*10); // Gentle: tighter gaps at higher levels
    const base=Math.max(lastObsEnd(),fc*spd+850);
    const wx=base+minGap+Math.random()*(220-lf*5); // Gentle: shorter random range
    const r=Math.random();
    const bp=0.08+lf*0.01,np=0.08+lf*0.008; // Gentle: more bullets and nails at higher levels
    if(r<0.18+lf*0.005){pits.push({wx,w:35+Math.random()*30+lf*1});} // Gentle: wider pits
    else if(r<0.32+lf*0.003){const cH=35+Math.random()*12+lf*1,cT=GY-65-Math.random()*25;ohs.push({wx,w:50+Math.random()*35+lf*1,top:cT,h:cH});} // Gentle: bigger crates
    else if(r<0.46){plats.push({wx,w:100+Math.random()*80-lf*1,h:190+Math.random()*25});} // Gentle: narrower platforms
    else if(r<0.46+np){nails.push({wx,w:35+Math.random()*25+lf*1});} // Gentle: more nails
    else if(r<0.46+np+bp){
        const bs=2.0+Math.random()*1.2+lf*0.15; // Gentle: faster bullets
        bullets.push({wx:wx+700,wy:GY-30-Math.random()*20,speed:bs});
        if(lf>=4&&Math.random()<0.3+lf*0.02)bullets.push({wx:wx+750,wy:GY-25-Math.random()*25,speed:bs+0.4}); // Gentle: earlier double bullets
        if(lf>=8&&Math.random()<0.2+lf*0.02)bullets.push({wx:wx+800,wy:GY-35-Math.random()*15,speed:bs+0.8}); // Gentle: earlier triple bullets
    }else if(r<0.46+np+bp+0.12){
        const r2=Math.random();let t;if(r2<0.45)t='shield';else if(r2<0.90)t='wing';else t='heart';
        powerups.push({wx,wy:200+Math.random()*80,type:t,collected:false,magnetX:0,magnetY:0});
    }else if(r<0.46+np+bp+0.19){
        nails.push({wx,w:30+Math.random()*20+lf*1});
        ohs.push({wx:wx+10,w:50+lf*1,top:GY-70-Math.random()*18,h:35+lf*1});
    }else{
        pits.push({wx,w:35+Math.random()*25+lf*1});
        bullets.push({wx:wx+350,wy:GY-25-Math.random()*15,speed:1.8+Math.random()*1.2+lf*0.15});
    }
    const lf2 = Math.min(currentLevel, 20);
    if(lf2 >= 2 && Math.random() < 0.15+lf2*0.01){ // Gentle: more frequent bats
        const batY = 150 + Math.random() * 100;
        bats.push({
            wx: wx + 100 + Math.random()*300,
            wy: batY,
            baseY: batY,
            w: 28, h: 18,
            phase: Math.random() * Math.PI * 2,
            fireTimer: Math.max(80, 120 - lf2*3) + Math.floor(Math.random()*80), // Gentle: faster firing
            fireBreathing: false,
            fireBreathTimer: 0,
            fireBullets: []
        });
    }
    if(lf2 >= 3 && Math.random() < 0.12+lf2*0.01){ // Gentle: earlier and more tigers
        tigers.push({
            wx: wx + 400 + Math.random()*300,
            wy: GY - 35,
            w: 50, h: 35,
            speed: 3 + Math.random()*2 + lf2*0.2, // Gentle: faster tigers
            active: false,
            chargeSpeed: 0
        });
    }
    if(lf2 >= 4 && Math.random() < 0.12+lf2*0.01){ // Gentle: earlier and more storm clouds
        stormClouds.push({
            wx: wx + 50 + Math.random()*300,
            wy: 30 + Math.random()*40,
            w: 60, h: 25,
            lightningTimer: Math.max(120, 180 - lf2*4) + Math.floor(Math.random()*100), // Gentle: faster lightning
            lightning: null,
            lightningcooldown: 0
        });
    }
    nextSpawn=fc+Math.max(60,Math.floor(240-spd*7-lf*4)); // Gentle: faster spawn rate
}

function spawnCoins(){
    const base=Math.max(lastCoinEnd(),fc*spd+600);
    const r=Math.random();
    if(r<0.35){
        // Ground line of coins (running on ground)
        const count=3+Math.floor(Math.random()*5);
        const startY=GY-20;
        for(let i=0;i<count;i++){
            coins.push({wx:base+i*28,wy:startY,magnetX:0,magnetY:0,collected:false});
        }
    } else if(r<0.55){
        // Arc pattern (jump to collect)
        const count=5;
        const startX=base;
        for(let i=0;i<count;i++){
            const t=i/(count-1);
            const arcY=GY-30-Math.sin(t*Math.PI)*60;
            coins.push({wx:startX+i*30,wy:arcY,magnetX:0,magnetY:0,collected:false});
        }
    } else if(r<0.70){
        // High floating coins (need to jump high or fly)
        const count=3+Math.floor(Math.random()*3);
        const startY=210+Math.random()*40;
        for(let i=0;i<count;i++){
            coins.push({wx:base+i*28,wy:startY+Math.sin(i*0.8)*15,magnetX:0,magnetY:0,collected:false});
        }
    } else if(r<0.85){
        // Diagonal staircase going up
        const count=4;
        for(let i=0;i<count;i++){
            coins.push({wx:base+i*35,wy:GY-25-i*20,magnetX:0,magnetY:0,collected:false});
        }
    } else {
        // Cluster around platform height
        const platH=210+Math.random()*30;
        const count=4+Math.floor(Math.random()*3);
        for(let i=0;i<count;i++){
            coins.push({wx:base+i*25,wy:platH-15+Math.sin(i)*8,magnetX:0,magnetY:0,collected:false});
        }
    }
}

function lastCoinEnd(){
    let e=0;
    for(const c of coins) e=Math.max(e,c.wx);
    return e;
}

function mkParts(x,y,n,col){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-2,life:20+Math.random()*15,col:col||'#c8a96e',r:1+Math.random()*2.5});}
function rr(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function updatePhysics(){
    if(wingTimer>0){
        wingTimer--;
        const flyTargetY=133,flyBob=Math.sin(fc*0.08)*8;
        const targetY=flyTargetY+flyBob,diff=targetY-P.y;
        P.vy=diff*0.1;P.y+=P.vy;
        if(P.y<50){P.y=50;P.vy=0;}if(P.y>GY-PH){P.y=GY-PH;P.vy=0;}
        P.gnd=false;P.onPlat=-1;P.onCrate=-1;return;
    }
    if(!P.gnd){P.vy+=GRAV;P.y+=P.vy;}
    if(P.gnd&&P.onPlat>=0){const pl=plats[P.onPlat];if(!pl){P.onPlat=-1;P.gnd=false;P.vy=0;}else{const plSX=w2s(pl.wx);if(PX>plSX+pl.w-2||PX+PW<plSX+2){P.gnd=false;P.vy=0;P.onPlat=-1;}}}
    if(P.gnd&&P.onCrate>=0){const cr=ohs[P.onCrate];if(!cr){P.onCrate=-1;P.gnd=false;P.vy=0;}else{const crSX=w2s(cr.wx);if(PX>crSX+cr.w-2||PX+PW<crSX+2){P.gnd=false;P.vy=0;P.onCrate=-1;}}}
    if(!P.gnd&&P.vy>0){
        const prevBottom=P.y+PH-P.vy,currBottom=P.y+PH;
        for(let i=0;i<plats.length;i++){
            const pl=plats[i],plSX=w2s(pl.wx);
            if(PX+PW-8>plSX+6&&PX+8<plSX+pl.w-6&&prevBottom<=pl.h+2&&currBottom>=pl.h){
                P.y=pl.h-PH;P.vy=0;P.gnd=true;P.onPlat=i;P.onPlatH=pl.h;P.onCrate=-1;mkParts(PX+PW/2,pl.h,4,'#c8a060');break;
            }
        }
        if(!P.gnd){
            for(let i=0;i<ohs.length;i++){
                const cr=ohs[i],crSX=w2s(cr.wx);
                if(PX+PW-8>crSX+4&&PX+8<crSX+cr.w-4&&prevBottom<=cr.top+2&&currBottom>=cr.top){
                    P.y=cr.top-PH;P.vy=0;P.gnd=true;P.onCrate=i;P.onCrateTop=cr.top;P.onPlat=-1;mkParts(PX+PW/2,cr.top,4,'#c8a060');break;
                }
            }
        }
        if(!P.gnd){
            const wx=s2w(PX+PW/2);let overPit=false;
            for(const p of pits){if(wx>p.wx+8&&wx<p.wx+p.w-8){overPit=true;break;}}
            if(!overPit&&currBottom>=GY){P.y=GY-PH;P.vy=0;P.gnd=true;P.onPlat=-1;P.onCrate=-1;mkParts(PX+PW/2,GY,5,'#c8a96e');}
            else if(overPit&&currBottom>GY+60){respawnFromPit();return;}
        }
    }
    if(!P.gnd&&P.y<-50){P.y=-50;P.vy=0;}
    if(P.gnd&&P.onPlat<0&&P.onCrate<0){
        const wx=s2w(PX+PW/2);
        for(const p of pits){if(wx>p.wx+10&&wx<p.wx+p.w-10){P.gnd=false;P.vy=0;break;}}
    }
}

function checkHazards(){
    if(invincible>0||wingTimer>0)return;
    const pEffX=PX-P.pushX;
    const ph=P.duck?PDH:PH;
        const py=P.duck?(P.onPlat>=0?P.onPlatH-PDH:(P.onCrate>=0?P.onCrateTop-PDH:GY-PDH)):P.y;
    // When ducking, use a thin hitbox centered on the upper body to clear ground hazards (nails at GY-18)
    const pb=P.duck?{x:pEffX+4,y:py+4,w:PW-8,h:8}:{x:pEffX+4,y:py+4,w:PW-8,h:ph-6};
    for(const n of nails){const sx=w2s(n.wx);if(rr(pb,{x:sx+2,y:GY-8,w:n.w-4,h:8})){hitPlayer();return;}}
    for(const b of bullets){const sx=w2s(b.wx);if(rr(pb,{x:sx,y:b.wy-5,w:18,h:10})){hitPlayer();return;}}
    if(!P.gnd&&P.onCrate<0){
        for(const cr of ohs){const sx=w2s(cr.wx);if(pb.y>cr.top&&pb.y+pb.h>cr.top+4&&rr(pb,{x:sx,y:cr.top,w:cr.w,h:cr.h})){hitPlayer();return;}}
    }
}

function checkPowerups(){
    const pEffX=PX-P.pushX;
    const pb={x:pEffX,y:P.y,w:PW,h:PH};
    for(const pu of powerups){
        if(pu.collected)continue;
        const sx=w2s(pu.wx);
        const puCX=sx,puCY=pu.wy+Math.sin(fc*0.06+pu.wx)*5;
        const plCX=pEffX+PW/2,plCY=P.y+PH/2;
        const dx=plCX-puCX,dy=plCY-puCY,d=Math.sqrt(dx*dx+dy*dy);
        if(d<80&&d>0){pu.magnetX+=(dx/d)*4;pu.magnetY+=(dy/d)*4;}
        const fSX=sx+pu.magnetX,fWY=pu.wy+pu.magnetY+Math.sin(fc*0.06+pu.wx)*5;
        if(rr(pb,{x:fSX-12,y:fWY-12,w:24,h:24})){
            pu.collected=true;playSound('powerup');
            if(pu.type==='shield'){hasShield=true;mkParts(pEffX+PW/2,P.y+PH/2,10,'#00ccff');}
            else if(pu.type==='wing'){wingTimer=720;mkParts(pEffX+PW/2,P.y+PH/2,10,'#ffdd00');}
            else if(pu.type==='heart'){lives=Math.min(lives+1,5);mkParts(pEffX+PW/2,P.y+PH/2,15,'#ff4444');}
        }
    }
}

function checkCoins(){
    const pEffX=PX-P.pushX;
    const pb={x:pEffX,y:P.y,w:PW,h:PH};
    const isFlying=wingTimer>0;
    const magnetRange=isFlying?180:30;
    const magnetStrength=isFlying?8:3;
    for(const coin of coins){
        if(coin.collected)continue;
        const sx=w2s(coin.wx);
        const coinCX=sx+coin.magnetX;
        const coinCY=coin.wy+coin.magnetY+Math.sin(fc*0.08+coin.wx*0.1)*3;
        const plCX=pEffX+PW/2,plCY=P.y+PH/2;
        const dx=plCX-coinCX,dy=plCY-coinCY,d=Math.sqrt(dx*dx+dy*dy);
        // Magnet effect
        if(d<magnetRange&&d>0){
            coin.magnetX+=(dx/d)*magnetStrength;
            coin.magnetY+=(dy/d)*magnetStrength;
        }
        // Collection check
        const fSX=sx+coin.magnetX,fWY=coin.wy+coin.magnetY+Math.sin(fc*0.08+coin.wx*0.1)*3;
        if(rr(pb,{x:fSX-8,y:fWY-8,w:16,h:16})){
            coin.collected=true;
            const coinValue = skillEffects.doubleScore ? 2 : 1;
            if(skillActive) {
                // During skill, cap total coins collected at 180
                if(skillCoinsCollected < 180) {
                    const canCollect = Math.min(coinValue, 180 - skillCoinsCollected);
                    coinCount += canCollect;
                    totalCoinsInLevel += canCollect;
                    skillCoinsCollected += canCollect;
                }
            } else {
                // Outside skill, collect normally
                coinCount += coinValue;
                totalCoinsInLevel += coinValue;
            }
            playSound('coin');
            mkParts(pEffX+PW/2,P.y+PH/2,4,'#C0C0C0');
            // Check if skill is ready
            if(!skillReady && !skillActive && coinCount >= charSkillCosts[selectedCharacter]){
                skillReady = true;
            }
        }
    }
}

function update(){
    clouds.forEach(c=>{c.x-=c.s;if(c.x+c.w<0){c.x=820;c.y=25+Math.random()*75;}});
    
    // Handle boss approaching transition
    if(state==='bossApproaching'){
        updateBossApproaching();
        return;
    }
    
    // Handle boss warning
    if(state==='bossWarning'){
        bossWarning--;
        if(bossWarning<=0){
            initBoss();
        }
        return;
    }
    
    // Handle boss fight
    if(state==='bossFight'){
        updateBossFight();
        return;
    }
    
    // Handle transition room
    if(state==='transitionRoom'){
        updateTransitionRoom();
        return;
    }
    
    // Handle boss reward phase (victory)
    if(state==='bossReward'){
        updateBossReward();
        return;
    }
    
    // Handle boss defeat reward phase
    if(state==='bossDefeatReward'){
        updateBossDefeatReward();
        return;
    }
    
    if(state!=='playing'||paused){
        for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;if(p.life<=0)parts.splice(i,1);}
        return;
    }
    fc++;spd=BASE_SPD+fc*0.000015;dist+=spd*0.05;gndScr=(gndScr+spd)%40;P.af++;
    if(invincible>0)invincible--;
    updateSkill(); // Update skill effects
    if(levelTransition>0)levelTransition--;
    const levelDist=dist-levelStartDist,currentLevelDist=getLevelDistance(currentLevel);
    
    // Boss approach transition - smooth slowdown and portal effect
    if(levelDist>=currentLevelDist&&levelTransition<=0&&state==='playing'){
        if(bossApproachPhase===0){
            // Start slowing down
            bossApproachPhase=1;
            bossApproachTimer=0;
            state='bossApproaching';
            playSound('hit');
        }
    }
    
    if(state==='bossApproaching'){
        bossApproachTimer++;
        // Gradually slow down the game
        spd = Math.max(0.3, BASE_SPD * (1 - bossApproachTimer/120));
        
        if(bossApproachTimer>=60 && bossApproachTimer<120){
            bossApproachPhase=2;
        }
        
        if(bossApproachTimer>=180){
            // Transition to boss warning
            bossWarning=150;
            state='bossWarning';
            bossApproachPhase=0;
            bossApproachTimer=0;
            // Reset speed for boss fight
            spd=BASE_SPD;
        }
        return;
    }
    if(fc>300&&fc>=nextSpawn)spawnObs();
    // Spawn coins more frequently
    if(fc>60&&fc%40===0)spawnCoins();
    updatePhysics();if(state!=='playing')return;
    checkHazards();if(state!=='playing')return;
    if(wingTimer<=0){
        const pEffX=PX-P.pushX,ph=P.duck?PDH:PH;
    const py=P.duck?(P.onPlat>=0?P.onPlatH-PDH:(P.onCrate>=0?P.onCrateTop-PDH:GY-PDH)):P.y;
        let pushed=false;
        for(let i=0;i<ohs.length;i++){
            if(P.onCrate===i)continue;
            const cr=ohs[i],crSX=w2s(cr.wx);
            if(pEffX+PW>crSX&&pEffX<crSX+cr.w){
                // When ducking, use larger tolerance to allow passing under floating crates
                const topTol=P.duck?12:4;
                const botTol=P.duck?12:4;
                if(py+ph>cr.top+topTol&&py<cr.top+cr.h-botTol){pushed=true;break;}
            }
        }
        if(pushed){P.pushX+=spd;if(P.gnd&&P.pushX>PX-10){hitPlayer();P.pushX=0;}}
        else P.pushX=Math.max(0,P.pushX-spd*0.5);
    }
    checkPowerups();
    checkCoins();
    for(const bat of bats){
        const sx = w2s(bat.wx);
        bat.phase += 0.05;
        bat.wy = bat.baseY + Math.sin(bat.phase) * 20;
        bat.fireTimer--;
        if(bat.fireTimer <= 0 && sx > -50 && sx < 850){
            bat.fireBreathing = true;
            bat.fireBreathTimer = 30;
            bat.fireTimer = 150 + Math.floor(Math.random()*100);
            const pEffX = PX - P.pushX;
            const dx = pEffX - sx;
            const dy = (GY - PH/2) - bat.wy;
            const d = Math.sqrt(dx*dx+dy*dy) || 1;
            const fspd = 2.5;
            bat.fireBullets.push({
                x: sx, y: bat.wy + 10,
                vx: (dx/d)*fspd, vy: (dy/d)*fspd,
                life: 120
            });
        }
        if(bat.fireBreathing){
            bat.fireBreathTimer--;
            if(bat.fireBreathTimer <= 0) bat.fireBreathing = false;
        }
        for(let i = bat.fireBullets.length-1; i >= 0; i--){
            const fb = bat.fireBullets[i];
            fb.x += fb.vx;
            fb.y += fb.vy;
            fb.life--;
            if(fb.life <= 0 || fb.x < -20 || fb.x > 820 || fb.y > GY + 20){
                bat.fireBullets.splice(i, 1);
                continue;
            }
            if(invincible <= 0 && wingTimer <= 0){
                const pEffX2 = PX - P.pushX;
                const ph2 = P.duck ? PDH : PH;
                const py2 = P.y;
                if(fb.x > pEffX2 && fb.x < pEffX2 + PW && fb.y > py2 && fb.y < py2 + ph2){
                    bat.fireBullets.splice(i, 1);
                    hitPlayer();
                }
            }
        }
    }
    for(const tiger of tigers){
        const sx = w2s(tiger.wx);
        if(!tiger.active && sx < 820 && sx > -100){
            tiger.active = true;
            tiger.chargeSpeed = tiger.speed;
        }
        if(tiger.active){
            tiger.wx -= tiger.chargeSpeed;
            if(invincible <= 0 && wingTimer <= 0){
                const pEffX = PX - P.pushX;
                const ph = P.duck ? PDH : PH;
                const py = P.y;
                const tRect = {x: sx, y: tiger.wy, w: tiger.w, h: tiger.h};
                const pRect = {x: pEffX, y: py, w: PW, h: ph};
                if(rr(pRect, tRect)){
                    hitPlayer();
                }
            }
        }
    }
    for(const cloud of stormClouds){
        const sx = w2s(cloud.wx);
        cloud.lightningTimer--;
        if(cloud.lightningCooldown > 0) cloud.lightningCooldown--;
        if(cloud.lightningTimer <= 0 && sx > 0 && sx < 800 && cloud.lightningCooldown <= 0){
            const startX = sx + cloud.w/2;
            const startY = cloud.wy + cloud.h;
            const endY = GY;
            const segments = [];
            let curX = startX, curY = startY;
            const numSegs = 4 + Math.floor(Math.random()*3);
            const segH = (endY - startY) / numSegs;
            for(let i = 0; i < numSegs; i++){
                const nextX = curX + (Math.random() - 0.5) * 40;
                const nextY = curY + segH;
                segments.push({x1: curX, y1: curY, x2: nextX, y2: nextY});
                curX = nextX;
                curY = nextY;
            }
            cloud.lightning = {segments: segments, timer: 20};
            cloud.lightningTimer = 200 + Math.floor(Math.random()*150);
            cloud.lightningCooldown = 60;
            if(invincible <= 0 && wingTimer <= 0){
                const pEffX = PX - P.pushX;
                const lastSeg = segments[segments.length-1];
                if(Math.abs(lastSeg.x2 - (pEffX + PW/2)) < 30 && Math.abs(lastSeg.y2 - (P.y + PH)) < 30){
                    hitPlayer();
                }
            }
        }
        if(cloud.lightning){
            cloud.lightning.timer--;
            if(cloud.lightning.timer <= 0) cloud.lightning = null;
        }
    }
    for(const b of bullets)b.wx-=b.speed;
    if(P.gnd&&wingTimer<=0&&fc%5===0){
        const pEffX=PX-P.pushX;
        const surfY=P.onPlat>=0?P.onPlatH:(P.onCrate>=0?P.onCrateTop:GY);
        mkParts(pEffX+4,surfY-1,1,'#b89960');
    }
    if(wingTimer>0&&fc%3===0){const pEffX=PX-P.pushX;mkParts(pEffX+PW/2,P.y+PH,1,'#ffdd00');}
    const cull=fc*spd;
    pits=pits.filter(o=>o.wx+o.w>cull-300);
    ohs=ohs.filter(o=>o.wx+o.w>cull-300);
    plats=plats.filter(p=>p.wx+p.w>cull-300);
    nails=nails.filter(n=>n.wx+30>cull-300);
    bullets=bullets.filter(b=>b.wx+20>cull-500);
    powerups=powerups.filter(p=>p.wx+20>cull-300&&!p.collected);
    coins=coins.filter(c=>c.wx+20>cull-300&&!c.collected);
    bats = bats.filter(b => b.wx + 30 > cull - 300);
    tigers = tigers.filter(t => t.wx + 60 > cull - 300);
    stormClouds = stormClouds.filter(sc => sc.wx + 70 > cull - 300);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;if(p.life<=0)parts.splice(i,1);}
}

// Boss fight update
function updateBossFight(){
    if(!boss||paused) return;
    
    // Advance frame counter for animations (walking legs, effects)
    fc++; P.af++;
    if(invincible>0) invincible--;
    
    // Update player facing direction (face toward boss)
    const bossCX = boss.x + boss.w/2;
    const playerCX = P.x + PW/2;
    P.facing = (playerCX < bossCX) ? 1 : -1; // 1=right, -1=left
    
    // Player movement in boss fight - slower speed
    const moveSpeed = 2.5;
    // Move X axis
    if(P.moveLeft) P.x -= moveSpeed;
    if(P.moveRight) P.x += moveSpeed;
    // Check X collision with obstacles
    for(const obs of bossObstacles){
        if(P.x + PW > obs.x && P.x < obs.x + obs.w && P.y + PH > obs.y && P.y < obs.y + obs.h){
            // Push player out on X axis
            if(P.moveLeft){
                P.x = obs.x + obs.w;
            } else if(P.moveRight){
                P.x = obs.x - PW;
            }
        }
    }
    // Move Y axis
    if(P.moveUp && P.y > 50) P.y -= moveSpeed;
    if(P.moveDown && P.y < GY-PH) P.y += moveSpeed;
    // Check Y collision with obstacles
    for(const obs of bossObstacles){
        if(P.x + PW > obs.x && P.x < obs.x + obs.w && P.y + PH > obs.y && P.y < obs.y + obs.h){
            // Push player out on Y axis
            if(P.moveUp){
                P.y = obs.y + obs.h;
            } else if(P.moveDown){
                P.y = obs.y - PH;
            }
        }
    }
    
    // Keep player in bounds (full screen width)
    P.x = Math.max(20, Math.min(760, P.x));
    P.y = Math.max(50, Math.min(GY-PH, P.y));
    
    // Player auto-shooting - always aim at boss
    bossAutoShootTimer++;
    if(bossAutoShootTimer >= 35){
        const bx = P.x + PW/2;
        const by = P.y + PH/2;
        const dx = bossCX - bx;
        const dy = (boss.y + boss.h/2) - by;
        const d = Math.sqrt(dx*dx + dy*dy) || 1;
        const bspd = 2.0;
        const autoDmg = 25 + (currentLevel-1) * 1; // Very gentle: Lv1=25, Lv10=34, Lv20=44
        playerBullets.push({x: bx, y: by, vx: (dx/d)*bspd, vy: (dy/d)*bspd, dmg: autoDmg, charIdx: selectedCharacter});
        bossAutoShootTimer = 0;
        playSound('jump');
    }
    if(bossSkillCooldown<=0 && playerMP<playerMaxMP) playerMP=Math.min(playerMaxMP, playerMP+0.5/60); // 2秒回复1滴蓝 (0.5 MP/秒)
    if(bossSkillCooldown>0) bossSkillCooldown--;
    
    // Update weapon projectile in flight
    if(weaponProjectile && !weaponProjectile.landed) {
        weaponProjectile.timer++;
        const t = weaponProjectile.timer / weaponProjectile.maxTimer;
        const eased = 1 - Math.pow(1 - t, 2);
        // Update target position to track boss movement
        weaponProjectile.targetX = boss.x + boss.w/2;
        weaponProjectile.targetY = boss.y + boss.h/2;
        weaponProjectile.x = weaponProjectile.startX + (weaponProjectile.targetX - weaponProjectile.startX) * eased;
        weaponProjectile.y = weaponProjectile.startY + (weaponProjectile.targetY - weaponProjectile.startY) * eased;
        weaponProjectile.angle += 0.15;
        weaponProjectile.trail.push({x: weaponProjectile.x, y: weaponProjectile.y, life: 25});
        if(weaponProjectile.trail.length > 30) weaponProjectile.trail.shift();
        for(let i = weaponProjectile.trail.length-1; i >= 0; i--) {
            weaponProjectile.trail[i].life--;
            if(weaponProjectile.trail[i].life <= 0) weaponProjectile.trail.splice(i, 1);
        }
        // Absorb coins, hearts, and shields during flight
        const absorbRadius = 80;
        for(const coin of coins){
            if(coin.collected) continue;
            const sx=w2s(coin.wx);
            const dx=weaponProjectile.x-sx, dy=weaponProjectile.y-coin.wy;
            const d=Math.sqrt(dx*dx+dy*dy);
            if(d < absorbRadius && d > 0){
                coin.magnetX += (dx/d)*6;
                coin.magnetY += (dy/d)*6;
            }
            if(d < 20){
                coin.collected=true;
                const coinValue = skillEffects.doubleScore ? 2 : 1;
                coinCount += coinValue;
                totalCoinsInLevel += coinValue;
                playSound('coin');
            }
        }
        for(const pu of powerups){
            if(pu.collected) continue;
            const sx=w2s(pu.wx);
            const dx=weaponProjectile.x-sx, dy=weaponProjectile.y-pu.wy;
            const d=Math.sqrt(dx*dx+dy*dy);
            if(d < absorbRadius && d > 0){
                pu.magnetX += (dx/d)*6;
                pu.magnetY += (dy/d)*6;
            }
            if(d < 20){
                pu.collected=true;
                const pEffX=P.x+PW/2, pEffY=P.y+PH/2;
                if(pu.type==='shield'){hasShield=true;mkParts(pEffX,pEffY,10,'#00ccff');}
                else if(pu.type==='wing'){wingTimer=720;mkParts(pEffX,pEffY,10,'#ffdd00');}
                else if(pu.type==='heart'){lives=Math.min(lives+1,5);mkParts(pEffX,pEffY,15,'#ff4444');}
                playSound('powerup');
            }
        }
        // Add sparkle particles along the path
        if(weaponProjectile.timer % 3 === 0) {
            mkParts(weaponProjectile.x, weaponProjectile.y, 2, ['#00FFCC','#FF4400','#88CCFF','#FF8800','#AA44FF','#2266CC','#FFD700','#00CC88','#CD7F32','#00B894'][weaponProjectile.charIndex]);
        }
        if(weaponProjectile.timer >= weaponProjectile.maxTimer) {
            weaponProjectile.landed = true;
            weaponProjectile.returning = true;
            weaponProjectile.returnTimer = 0;
            weaponProjectile.returnMaxTimer = 40;

                for(let i=0;i<count;i++){
                    const angle = (i/count)*Math.PI*2 + Math.PI/count;
                    bossBullets.push({x:bcx,y:bcy,vx:Math.cos(angle)*spd*0.6,vy:Math.sin(angle)*spd*0.6,r:4,type:'void'});
                }
            }
        }
        playSound('hit');
    }
    
    // Boss physics
    if(boss.vy !== 0){
        boss.y += boss.vy;
        boss.vy += 0.4;
        if(boss.y >= GY - boss.h){
            boss.y = GY - boss.h;
            boss.vy = 0;
        }
    }
    if(boss.vx !== 0){
        boss.x += boss.vx;
        boss.vx *= 0.9;
        if(Math.abs(boss.vx) < 0.5) boss.vx = 0;
        // Tight bounds to keep boss on screen
        boss.x = Math.max(300, Math.min(700, boss.x));
    }
    // Also clamp boss.y
    boss.y = Math.max(50, Math.min(GY - boss.h, boss.y));
    
    // Update boss bullets (screen coordinates) - check obstacle collision
    for(let i=bossBullets.length-1; i>=0; i--){
        const b = bossBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        
        // Check collision with obstacles
        let hitObstacle = false;
        for(const obs of bossObstacles){
            if(b.x > obs.x && b.x < obs.x + obs.w && b.y > obs.y && b.y < obs.y + obs.h){
                hitObstacle = true;
                mkParts(b.x, b.y, 3, '#888888');
                break;
            }
        }
        
        // Remove if off screen or hit obstacle
        if(hitObstacle || b.x < -30 || b.x > 830 || b.y < -30 || b.y > 430){
            bossBullets.splice(i, 1);
        }
    }
    
    // Update laser
    if(bossLaser){
        bossLaser.timer++;
        // Update target position during warning
        if(bossLaser.timer < bossLaser.warningTime){
            bossLaser.targetX = P.x + PW/2;
            bossLaser.targetY = P.y + PH/2;
        }
        // Deal damage during fire phase
        if(bossLaser.timer >= bossLaser.warningTime){
            // Check if player is in laser path
            const lx1 = bossLaser.x;
            const ly1 = bossLaser.y;
            const lx2 = bossLaser.targetX;
            const ly2 = bossLaser.targetY;
            // Point-to-line distance check
            const dx = lx2-lx1, dy = ly2-ly1;
            const len = Math.sqrt(dx*dx+dy*dy) || 1;
            const px = P.x+PW/2 - lx1;
            const py = P.y+PH/2 - ly1;
            const proj = (px*dx + py*dy) / (len*len);
            if(proj >= 0 && proj <= 1){
                const distX = px - proj*dx;
                const distY = py - proj*dy;
                const dist = Math.sqrt(distX*distX + distY*distY);
                if(dist < 25 && invincible <= 0){
                    playerHP -= 35 + (currentLevel-1) * 3; // Gentle: Lv1=35, Lv10=62, Lv20=92
                    lives = Math.ceil(playerHP / 600);
                    invincible = 30;
                    mkParts(P.x+PW/2, P.y+PH/2, 5, '#ff00ff');
                    playSound('hit');
                    if(playerHP <= 0){ die(); return; }
                }
            }
        }
        if(bossLaser.timer >= bossLaser.maxTimer){
            bossLaser = null;
        }
    }
    
    // Update bombs
    for(let i=bossBombs.length-1; i>=0; i--){
        const bomb = bossBombs[i];
        bomb.y += bomb.vy;
        bomb.vy += 0.1;
        bomb.timer++;
        // Explode when hitting ground
        if(bomb.y >= GY - 15 && !bomb.exploded){
            bomb.exploded = true;
            // Create explosion bullets
            const count = 10 + Math.floor(currentLevel/5); // Gentle: more explosion bullets at higher levels
            for(let j=0; j<count; j++){
                const angle = (j/count)*Math.PI*2;
                const spd = 3.5 + currentLevel*0.08; // Gentle: faster explosion
                bossBullets.push({
                    x: bomb.x, y: bomb.y,
                    vx: Math.cos(angle)*spd,
                    vy: Math.sin(angle)*spd - 1,
                    r: 5, type:'bomb'
                });
            }
            mkParts(bomb.x, bomb.y, 12, '#ff8800');
            playSound('hit');
            bossBombs.splice(i, 1);
            continue;
        }
        // Remove if too old
        if(bomb.timer > 300) bossBombs.splice(i, 1);
    }
    
    // Check bullet-boss collisions
    for(let i=playerBullets.length-1; i>=0; i--){
        const b = playerBullets[i];
        if(b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h){
            playerBullets.splice(i, 1);
            bossHP -= (b.dmg || 25);
            mkParts(b.x, b.y, 5, '#ff4444');
            playSound('shield');
            
            if(bossHP <= 0){
                // Boss defeated - go to reward phase
                bossDefeated = true;
                calcLevelScore();
                if(currentLevel >= maxUnlockedLevel){
                    maxUnlockedLevel = currentLevel + 1;
                    saveLevelProgress();
                }
                // Award pet gold coins for boss kill
                var bossGoldReward2 = 2;
                petGoldCoins += bossGoldReward2;
                bossKillBonusClaimed[currentLevel] = true;
                saveLevelProgress();
                playSound('powerup');
                // Clear boss fight elements
                bossBullets=[];
                bossBombs=[];
                bossLaser=null;
                weaponProjectile=null;
                bossObstacles=[];
                P.moveLeft=P.moveRight=P.moveUp=P.moveDown=false;
                state='bossReward';
                bossRewardPhase=0;
                bossRewardTimer=0;
                bossRewardText='🎉 击杀BOSS! +2宠物金币 | 随机宠物金币待结算';
                bossRewardChest.visible=false;
                bossRewardChest.collected=false;
                bossRewardItems=[];
                bossRewardShowContinue=false;
                return;
            }
        }
    }
    
    // Check boss-player collision
    if(P.x + PW > boss.x && P.x < boss.x + boss.w && P.y + PH > boss.y && P.y < boss.y + boss.h){
        if(invincible <= 0){
            playerHP -= 80 + (currentLevel-1) * 4; // Gentle: Lv1=80, Lv10=116, Lv20=156
            lives = Math.ceil(playerHP / 600);
            invincible = 60;
            mkParts(P.x + PW/2, P.y + PH/2, 8, '#ff0000');
            playSound('hit');
            
            if(playerHP <= 0){
                die();
                return;
            }
        }
    }
    
    // Check boss bullets hitting player (screen coordinates)
    for(let i=bossBullets.length-1; i>=0; i--){
        const b = bossBullets[i];
        const dx = b.x - (P.x + PW/2);
        const dy = b.y - (P.y + PH/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < b.r + PW/2){
            bossBullets.splice(i, 1);
            if(invincible <= 0){
                playerHP -= 60 + (currentLevel-1) * 4; // Gentle: Lv1=60, Lv10=96, Lv20=136
                lives = Math.ceil(playerHP / 600);
                invincible = 60;
                mkParts(P.x + PW/2, P.y + PH/2, 5, '#ff0000');
                playSound('hit');
                
                if(playerHP <= 0){
                    die();
                    return;
                }
            }
        }
    }
    
    // Update particles
    for(let i=parts.length-1;i>=0;i--){
        const p=parts[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)parts.splice(i,1);
    }
}

// Transition room update
function updateTransitionRoom(){
    if(paused) return;
    const moveSpeed = 3;
    
    if(P.moveLeft) transRoomX -= moveSpeed;
    if(P.moveRight) transRoomX += moveSpeed;
    if(P.moveUp) transRoomY -= moveSpeed;
    if(P.moveDown) transRoomY += moveSpeed;
    
    // Keep character in room (full width)
    transRoomX = Math.max(50, Math.min(750, transRoomX));
    transRoomY = Math.max(100, Math.min(380, transRoomY));
    
    // Check if walked through right door
    if(transRoomX >= 730){
        // Award random pet gold coins for clearing level (3-6)
        var petGoldReward = 3 + Math.floor(Math.random() * 4); // 3-6
        petGoldCoins += petGoldReward;
        saveLevelProgress();
        // Level complete, start next level
        currentLevel++;
        levelStartDist = dist;
        fc = 301; // Set past the 300-frame safe zone so obstacles spawn immediately
        nextSpawn = 0;
        spd = BASE_SPD;
        state = 'playing';
        P.x = 120;
        P.y = GY - PH;

        ohs = [];

        bullets = [];
        powerups = [];

        playerBullets = [];

    }
}

// Boss approaching transition update
function updateBossApproaching(){
    bossApproachTimer++;
    fc++;
    
    // Gradually slow down the game
    spd = Math.max(0.3, BASE_SPD * (1 - bossApproachTimer/120));
    
    // Update player animation
    P.af++;
    if(invincible>0) invincible--;
    
    // Update particles
    for(let i=parts.length-1;i>=0;i--){
        const p=parts[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)parts.splice(i,1);
    }
    
    if(bossApproachTimer>=60 && bossApproachTimer<120){
        bossApproachPhase=2;
    }
    
    if(bossApproachTimer>=180){
        // Transition to boss warning
        bossWarning=150;
        state='bossWarning';
        bossApproachPhase=0;
        bossApproachTimer=0;
        spd=BASE_SPD;
    }
}

                    x: chestCX + Math.cos(angle)*scatterDist,
                    y: chestCY + Math.sin(angle)*scatterDist*0.6,
                    type: i<10?'coin':'heart',
                    collected:false,
                    vx: Math.cos(angle)*3,
                    vy: Math.sin(angle)*2,
                    bobOffset: Math.random()*Math.PI*2
                });
            }
        }
    }
    // Phase 2: Items scattered, player must manually collect them
    else if(bossRewardPhase===2){
        // Allow player movement
        const moveSpeed = 3;
        if(P.moveLeft) P.x -= moveSpeed;
        if(P.moveRight) P.x += moveSpeed;
        if(P.moveUp && P.y > 50) P.y -= moveSpeed;
        if(P.moveDown && P.y < GY-PH) P.y += moveSpeed;
        for(const obs of bossObstacles){
            if(P.x + PW > obs.x && P.x < obs.x + obs.w && P.y + PH > obs.y && P.y < obs.y + obs.h){
                if(P.moveLeft) P.x = obs.x + obs.w;
                else if(P.moveRight) P.x = obs.x - PW;
            }

        for(const obs of bossObstacles){
            if(P.x + PW > obs.x && P.x < obs.x + obs.w && P.y + PH > obs.y && P.y < obs.y + obs.h){
                if(P.moveUp) P.y = obs.y + obs.h;
                else if(P.moveDown) P.y = obs.y - PH;
            }
        }
        P.x = Math.max(20, Math.min(760, P.x));
        P.y = Math.max(50, Math.min(GY-PH, P.y));
        
        // Items settle to ground with physics
        for(const item of bossRewardItems){
            if(item.collected) continue;
            // Apply gravity and friction
            item.vy = (item.vy || 0) + 0.3;
            item.vx = (item.vx || 0) * 0.95;
            item.x += item.vx;
            item.y += item.vy;

                item.vy = 0;
                item.vx *= 0.8;

            const dy = P.y + PH/2 - item.y;

        for(const item of bossRewardItems){
            if(!item.collected) { allCollected = false; break; }
        }
        if(allCollected) {
            bossRewardPhase=3;
            bossRewardTimer=0;
            bossRewardShowContinue=true;
        }
    }
    // Phase 3: All collected, show continue button
    else if(bossRewardPhase===3){
        // Wait for player to click continue
    }
    
    // Update particles
    for(let i=parts.length-1;i>=0;i--){
        const p=parts[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)parts.splice(i,1);
    }
}

function draw(){
    const c=ctx;
    // Reset canvas state at the start of each frame to prevent state leaks
    c.setTransform(1,0,0,1,0,0);
    c.globalAlpha=1;
    c.save();try{c.scale(SF,SF);
    const theme = getTheme();
    // Sky gradient based on theme
    const sky=c.createLinearGradient(0,0,0,GY);
    sky.addColorStop(0,theme.skyTop);sky.addColorStop(1,theme.skyBot);
    c.fillStyle=sky;c.fillRect(0,0,800,400);
    // Stars (more visible in space/ice themes)
    const starAlpha = currentLevel > 9 ? 0.7 : 0.4;
    c.fillStyle=`rgba(255,255,255,${starAlpha})`;
    for(let i=0;i<35;i++){const sx=(i*137.5+50)%800,sy=(i*73.7+10)%180;c.beginPath();c.arc(sx,sy,0.5+(i%3)*0.5,0,Math.PI*2);c.fill();}
    // Mountains with theme colors
    mtns.forEach(m=>{const mx=((m.x-fc*0.15)%1040+1040)%1040-120;c.fillStyle=theme.mountainCol;c.beginPath();c.moveTo(mx,GY);c.lineTo(mx+55,GY-m.h);c.lineTo(mx+110,GY);c.fill();});
    // Theme-specific decorations
    drawThemeDecor(c, theme);
    // Ground with theme colors
    c.fillStyle=theme.groundTop;c.fillRect(0,GY,800,4);
    const gg=c.createLinearGradient(0,GY+4,0,400);gg.addColorStop(0,theme.groundBot);gg.addColorStop(1,'#1a0f05');
    c.fillStyle=gg;c.fillRect(0,GY+4,800,65);
    c.strokeStyle='rgba(255,255,255,0.06)';c.lineWidth=1;
    for(let x=-gndScr;x<820;x+=40){c.beginPath();c.moveTo(x,GY+14);c.lineTo(x+18,GY+14);c.stroke();}
    // Pits - Bubbling toxic/lava pits with angry faces
    for(const p of pits){
        const sx=w2s(p.wx);if(sx>820||sx+p.w<-20)continue;
        const theme = getTheme();
        // Pit hole

                c.moveTo(seg.x1, seg.y1);
                c.lineTo(seg.x2, seg.y2);
            }
            c.stroke();
            const lastSeg = cloud.lightning.segments[cloud.lightning.segments.length - 1];
            c.fillStyle = `rgba(255,255,200,${alpha * 0.5})`;
            c.beginPath();
            c.arc(lastSeg.x2, lastSeg.y2, 15 * alpha, 0, Math.PI * 2);
            c.fill();
        }
    }
    drawPlayer(c);
    if(skillActive && selectedCharacter===2 && skillClones.length > 0){
        for(const clone of skillClones){
            c.globalAlpha = 0.7;
            c.fillStyle = '#DAA520';
            c.beginPath();
            c.arc(clone.x, clone.y + PH/2, PW/2, 0, Math.PI*2);
            c.fill();
            c.fillStyle = '#8B4513';
            c.beginPath();
            c.arc(clone.x, clone.y + PH/2 - 5, 12, 0, Math.PI*2);
            c.fill();
            c.fillStyle = '#DEB887';
            c.beginPath();
            c.ellipse(clone.x, clone.y + PH/2 - 2, 8, 7, 0, 0, Math.PI*2);
            c.fill();
            c.fillStyle = '#FF8C00';
            c.beginPath();
            c.arc(clone.x - 3, clone.y + PH/2 - 3, 2, 0, Math.PI*2);
            c.fill();
            c.beginPath();
            c.arc(clone.x + 3, clone.y + PH/2 - 3, 2, 0, Math.PI*2);
            c.fill();
            c.fillStyle = '#FFD700';
            c.fillRect(clone.x - 10, clone.y + PH/2 - 14, 20, 3);
            const legSwing = Math.sin(clone.af * 0.2) * 8;
            c.strokeStyle = '#DAA520';
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(clone.x - 3, clone.y + PH - 5);
            c.lineTo(clone.x - 3 - legSwing, clone.y + PH + 5);
            c.stroke();
            c.beginPath();
            c.moveTo(clone.x + 3, clone.y + PH - 5);
            c.lineTo(clone.x + 3 + legSwing, clone.y + PH + 5);
            c.stroke();
            c.fillStyle = 'rgba(255,215,0,0.4)';
            c.beginPath();
            c.arc(clone.x - 5 + Math.sin(clone.af*0.3)*3, clone.y + PH + 3, 2, 0, Math.PI*2);
            c.fill();
            c.globalAlpha = 1;
        }
    }
    // Ensure globalAlpha is reset after drawing player
    c.globalAlpha=1;
    parts.forEach(p=>{c.globalAlpha=Math.max(0,p.life/35);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();});
    c.globalAlpha=1;
    // HUD - Compact layout to avoid overlap
    c.globalAlpha=1; // Ensure HUD is fully opaque
    c.fillStyle='rgba(0,0,0,0.45)';c.fillRect(0,0,800,32);
    // Row 1: Main info
    c.fillStyle='#e0e0ff';c.font='bold 13px Arial';c.textAlign='left';
    c.fillText('距离:'+Math.floor(dist)+'m',10,14);
    c.fillStyle='#ff4444';c.font='13px Arial';let ls='';for(let i=0;i<lives;i++)ls+='❤';c.fillText(ls,110,14);
    // Coin display: total collected this level and current available
    c.fillStyle='#C0C0C0';c.font='bold 11px Arial';
    c.fillText('本关:'+totalCoinsInLevel+' 当前:'+coinCount,175,14);
    c.fillStyle='#ffcc00';c.font='bold 13px Arial';c.textAlign='center';
    c.fillText('关卡'+currentLevel+' '+theme.name,380,14);
    c.fillStyle='#e0e0ff';c.font='12px Arial';c.fillText('分数:'+totalScore,580,14);
    c.fillStyle='#e0e0ff';c.font='bold 13px Arial';c.textAlign='right';
    c.fillText('速度:'+(spd/BASE_SPD).toFixed(1)+'x',790,14);c.textAlign='left';
    // Row 2: Progress bar and status effects
    if(state==='playing'&&levelTransition<=0){
        const ld=dist-levelStartDist,cd=getLevelDistance(currentLevel),pr=Math.min(1,ld/cd);
        // Progress bar under level text
        c.fillStyle='rgba(255,255,255,0.15)';c.fillRect(280,20,80,6);
        c.fillStyle='#ffcc00';c.fillRect(280,20,80*pr,6);
        c.strokeStyle='rgba(255,255,255,0.3)';c.lineWidth=1;c.strokeRect(280,20,80,6);
        // Progress percentage
        c.fillStyle='#ff0000';c.font='bold 10px Arial';c.textAlign='center';
        c.fillText(Math.floor(pr*100)+'%',320,28);c.textAlign='left';
    }
    // Status effects (shield/wing) in row 2
    let statusX=400;
    if(hasShield){c.fillStyle='#00ccff';c.font='bold 11px Arial';c.fillText('🛡护盾',statusX,28);statusX+=60;}
    if(wingTimer>0){c.fillStyle='#ffdd00';c.font='bold 11px Arial';c.fillText('🪽'+(wingTimer/60).toFixed(1)+'s',statusX,28);}
    // Level transition
    if(levelTransition>0){
        const a=Math.min(1,levelTransition/60);
        c.fillStyle=`rgba(0,0,0,${a*0.6})`;c.fillRect(0,0,800,400);
        c.fillStyle=`rgba(255,204,0,${a})`;c.font='bold 48px Arial';c.textAlign='center';
        c.fillText('关卡 '+currentLevel,400,150);
        c.fillStyle=`rgba(200,230,255,${a})`;c.font='bold 28px Arial';
        c.fillText(theme.name,400,190);
        c.fillStyle=`rgba(224,224,255,${a})`;c.font='22px Arial';
        c.fillText('上一关得分: '+levelScore,400,235);
        c.fillText('总分: '+totalScore,400,265);
        c.fillStyle=`rgba(255,100,100,${a})`;c.font='18px Arial';
        c.fillText('难度提升! 本关目标: '+getLevelDistance(currentLevel)+'m',400,305);c.textAlign='left';
    }
    if(state==='mainMenu')drawMainMenu(c);
    else if(state==='charShop')drawCharShop(c);
    else if(state==='levelSelect')drawLevelSelect(c);
    else if(state==='over')drawOver(c);
    else if(state==='quizRevival')drawQuizRevival(c);
    else if(state==='quizResult')drawQuizResult(c);
    else if(state==='bossApproaching')drawBossApproaching(c);
    else if(state==='bossWarning')drawBossWarning(c);
    else if(state==='bossFight'){drawBossFight(c);drawBossFightButtons(c);}
    else if(state==='bossReward'){drawBossFight(c);drawBossReward(c);drawBossFightButtons(c);}
    else if(state==='bossDefeatReward'){drawBossDefeatArena(c);drawBossDefeatReward(c);drawDefeatRewardButtons(c);}
    else if(state==='transitionRoom'){drawTransitionRoom(c);drawTransitionRoomButtons(c);}
    // Pause overlay for bossFight, bossReward, transitionRoom
    if(paused && (state==='bossFight'||state==='bossReward'||state==='transitionRoom')){
        c.fillStyle='rgba(0,0,0,0.5)';c.fillRect(0,0,800,400);
        c.fillStyle='#fff';c.font='bold 40px Arial';c.textAlign='center';
        c.fillText('暂停',400,190);
        c.fillStyle='#ccc';c.font='18px Arial';
        c.fillText('点击「继续」按钮继续游戏',400,230);
        c.textAlign='left';
    }
    // Touch control buttons (drawn on canvas during gameplay)
    if(state==='playing'){
        drawGameButtons(c);
    }
    }finally{c.restore();}
}

function drawPlayer(c){
    c.save();try{
    const ducking=P.duck&&P.gnd&&wingTimer<=0;
    let pEffX, cx;
    
    // Use P.x for boss fight, boss reward states, and transition room
    if(state==='bossFight' || state==='bossReward'){
        pEffX = P.x;
        cx = P.x + PW/2;
    } else if(state==='bossDefeatReward'){
        pEffX = P.x;
        cx = P.x + PW/2;
    } else if(state==='transitionRoom'){
        pEffX = transRoomX - PW/2;
        cx = transRoomX;
    } else {
        pEffX = PX - P.pushX;
        cx = pEffX + PW/2;
    }
    
    // Flip character based on facing direction
    let facingRight = true;
    if(state==='bossFight' || state==='bossReward'){
        facingRight = P.facing >= 0;
    } else if(state==='bossDefeatReward'){
        facingRight = P.facing >= 0;
    } else if(state==='transitionRoom'){
        if(P.moveLeft && !P.moveRight) facingRight = false;
        else if(P.moveRight && !P.moveLeft) facingRight = true;
    }
    
    // Apply horizontal flip if facing left
    if(!facingRight){
        c.translate(cx*2, 0);
        c.scale(-1, 1);
    }
    
    let py;
    if(state==='transitionRoom'){
        py = transRoomY - PH;
    } else if(wingTimer>0)py=P.y;
    else if(P.onPlat>=0)py=P.onPlatH-PH;
    else if(P.onCrate>=0)py=P.onCrateTop-PH;
    else if(P.gnd)py=GY-PH;
    else py=P.y;
    if(ducking)py=(P.onPlat>=0?P.onPlatH:(P.onCrate>=0?P.onCrateTop:GY))-PDH;
    const surfY=P.onPlat>=0?P.onPlatH:(P.onCrate>=0?P.onCrateTop:GY);
    if(invincible>0&&Math.floor(fc/4)%2===0)c.globalAlpha=0.4;
    if(P.gnd&&wingTimer<=0&&state!=='transitionRoom'){c.fillStyle='rgba(0,0,0,0.3)';c.beginPath();c.ellipse(cx,surfY+2,18,5,0,0,Math.PI*2);c.fill();}
    // Character-specific flight effects
    if(wingTimer>0){
        if(selectedCharacter===0){
            // 星刃 - 脚踩风火轮 (Wind-fire wheels)
            const wheelR=8, wheelY=py+PH-5;
            const spin=fc*0.3;
            // Left wheel
            c.save();c.translate(cx-8,wheelY);c.rotate(spin);
            c.strokeStyle='#00FFCC';c.lineWidth=2;
            c.beginPath();c.arc(0,0,wheelR,0,Math.PI*2);c.stroke();
            for(let i=0;i<4;i++){const a=i*Math.PI/2;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*wheelR,Math.sin(a)*wheelR);c.stroke();}
            c.fillStyle='rgba(0,255,204,0.3)';c.beginPath();c.arc(0,0,wheelR,0,Math.PI*2);c.fill();
            c.restore();
            // Right wheel
            c.save();c.translate(cx+8,wheelY);c.rotate(-spin);
            c.strokeStyle='#00FFCC';c.lineWidth=2;
            c.beginPath();c.arc(0,0,wheelR,0,Math.PI*2);c.stroke();
            for(let i=0;i<4;i++){const a=i*Math.PI/2;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*wheelR,Math.sin(a)*wheelR);c.stroke();}
            c.fillStyle='rgba(0,255,204,0.3)';c.beginPath();c.arc(0,0,wheelR,0,Math.PI*2);c.fill();
            c.restore();
            // Wind trails
            c.strokeStyle='rgba(0,255,204,0.4)';c.lineWidth=1;
            for(let i=0;i<3;i++){const tx=cx-15-i*8,ty=wheelY+Math.sin(fc*0.2+i)*3;c.beginPath();c.moveTo(tx,ty);c.lineTo(tx-10,ty);c.stroke();}
        } else if(selectedCharacter===1){
            // 炎灵 - 脚踩火焰飞行 (Riding flames)
            const flameY=py+PH-8;
            // Main flame body
            const flameGrad=c.createRadialGradient(cx,flameY,5,cx,flameY+10,20);
            flameGrad.addColorStop(0,'rgba(255,255,100,0.9)');
            flameGrad.addColorStop(0.5,'rgba(255,100,0,0.7)');
            flameGrad.addColorStop(1,'rgba(255,0,0,0)');
            c.fillStyle=flameGrad;
            c.beginPath();c.ellipse(cx,flameY+5,15,12,0,0,Math.PI*2);c.fill();
            // Flame tongues
            for(let i=0;i<5;i++){const fx=cx-10+i*5,fy=flameY+10+Math.sin(fc*0.3+i)*3,fh=8+Math.sin(fc*0.4+i*2)*4;
            c.fillStyle=`rgba(255,${150+i*20},0,${0.6-i*0.1})`;
            c.beginPath();c.moveTo(fx-3,fy);c.quadraticCurveTo(fx,fy-fh,fx+3,fy);c.fill();}
            // Sparks
            c.fillStyle='rgba(255,200,0,0.8)';
            for(let i=0;i<4;i++){const sx=cx-8+Math.sin(fc*0.2+i*1.5)*12,sy=flameY+15+i*3+Math.cos(fc*0.3+i)*2;c.beginPath();c.arc(sx,sy,1.5,0,Math.PI*2);c.fill();}
        } else if(selectedCharacter===2){
            // 冰语 - 脚踩冰晶云朵 (Ice crystal cloud)
            const cloudY=py+PH-5;
            // Cloud base
            c.fillStyle='rgba(200,230,255,0.7)';
            c.beginPath();c.ellipse(cx,cloudY,18,8,0,0,Math.PI*2);c.fill();
            c.beginPath();c.ellipse(cx-8,cloudY-3,10,6,0,0,Math.PI*2);c.fill();
            c.beginPath();c.ellipse(cx+8,cloudY-3,10,6,0,0,Math.PI*2);c.fill();
            // Ice crystals floating around
            c.fillStyle='rgba(150,220,255,0.8)';c.strokeStyle='rgba(200,240,255,0.9)';c.lineWidth=1;
            for(let i=0;i<3;i++){const icx=cx-12+i*12,icy=cloudY-8+Math.sin(fc*0.15+i)*4,icr=3+Math.sin(fc*0.2+i)*1;
            c.save();c.translate(icx,icy);c.rotate(fc*0.05+i);
            c.beginPath();c.moveTo(0,-icr);c.lineTo(icr*0.7,0);c.lineTo(0,icr);c.lineTo(-icr*0.7,0);c.closePath();
            c.fill();c.stroke();c.restore();}
            // Snowflake particles
            c.fillStyle='rgba(255,255,255,0.6)';
            for(let i=0;i<6;i++){const sx=cx-15+Math.sin(fc*0.1+i*1.2)*18,sy=cloudY+5+i*2+Math.cos(fc*0.15+i)*3;c.beginPath();c.arc(sx,sy,1,0,Math.PI*2);c.fill();}
        } else if(selectedCharacter===3){

            c.fillRect(cx+4,packY,8,20);

            const exGrad2=c.createLinearGradient(cx+8,packY+20,cx+8,packY+20+exLen);

            c.fillStyle=exGrad2;
            c.beginPath();c.moveTo(cx+4,packY+20);c.lineTo(cx+8,packY+20+exLen);c.lineTo(cx+12,packY+20);c.closePath();c.fill();
            // Smoke particles
            c.fillStyle='rgba(150,150,150,0.4)';
            for(let i=0;i<4;i++){const sx=cx-8+Math.sin(fc*0.1+i)*5,sy=packY+25+i*4+Math.cos(fc*0.15+i)*2;c.beginPath();c.arc(sx,sy,2+i*0.5,0,Math.PI*2);c.fill();}
        } else if(selectedCharacter===4){
