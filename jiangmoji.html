            });
            playSound('shoot');
        }

        function explodeFireball(fb) {
            if (fb.exploded) return;
            fb.exploded = true; fb.alive = false;
            screenShake = Math.max(screenShake, 8);
            playSound('hit');
            // Damage all enemies in radius
            enemies.forEach(en => {
                if (!en.alive) return;
                const dx = en.x - fb.x, dy = en.y - fb.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < fb.explodeRadius) {
                    const falloff = 1 - (dist / fb.explodeRadius) * 0.5;
                    const dmg = Math.round(fb.damage * falloff);
                    en.hp -= dmg; en.hitFlash = 0.3;
                    createFloatingText(en.x, en.y - en.height * 0.5, dmg + '', '#ff4400');
                    if (en.hp <= 0) killEnemy(en);
                }
            });
            // Explosion particles
            for (let i = 0; i < 40; i++) {
                const a = Math.random() * Math.PI * 2;
                const spd = 80 + Math.random() * 250;
                particles.push({ x: fb.x, y: fb.y,
                    vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                    life: 0.4 + Math.random() * 0.6, maxLife: 0.4 + Math.random() * 0.6,
                    color: ['#ff4400','#ff8800','#ffcc00','#ff2200'][Math.floor(Math.random()*4)],
                    size: 4 + Math.random() * 8, type: 'spark' });
            }
            // Smoke ring
            for (let i = 0; i < 16; i++) {
                const a = (i / 16) * Math.PI * 2;
                particles.push({ x: fb.x + Math.cos(a) * 30, y: fb.y + Math.sin(a) * 30,
                    vx: Math.cos(a) * 60, vy: Math.sin(a) * 60,
                    life: 0.6 + Math.random() * 0.4, maxLife: 0.6 + Math.random() * 0.4,
                    color: 'rgba(80,40,10,0.6)', size: 10 + Math.random() * 8, type: 'smoke' });
            }
        }

        function createGhostFireball(ex, ey, damage, targetX, targetY) {
            const dx = targetX - ex, dy = targetY - ey;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const speed = 220 + Math.random() * 80;
            ghostFireballs.push({
                x: ex, y: ey,
                vx: (dx / dist) * speed, vy: (dy / dist) * speed,
                damage, alive: true, life: 3.5, maxLife: 3.5,
                size: 14 + Math.random() * 6, trail: [],
                rotation: Math.atan2(dy, dx),
                pulsePhase: Math.random() * Math.PI * 2,
                hasHit: false,
            });
        }

        // === PHANTOM RUNE (幽冥法阵) ===
        function createPhantomRune(targetX, targetY, damage) {
            phantomRunes.push({
                x: targetX, y: targetY,
                damage, alive: true,
                chargeTime: 1.2, // warning phase
                life: 1.2, // starts as warning, then detonates
                detonated: false,
                radius: 70 + Math.random() * 30,
                rotation: Math.random() * Math.PI * 2,
                hasHit: false,
            });
        }

        // === SMOKE CLOUD ===
        function createSmokeCloud(ex, ey, damage, duration) {
            const cloud = { x: ex, y: ey, targetX: player.x, targetY: player.y,
                damage, duration: duration || 4, life: duration || 4, alive: true,
                particles: [], radius: 60 + Math.random() * 40 };
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2, dist = Math.random() * cloud.radius;
                cloud.particles.push({ x: cloud.x + Math.cos(angle) * dist, y: cloud.y + Math.sin(angle) * dist,
                    baseX: Math.cos(angle) * dist, baseY: Math.sin(angle) * dist,
                    size: 4 + Math.random() * 14, life: 1.5 + Math.random() * (duration || 4),
                    maxLife: 1.5 + Math.random() * (duration || 4), offsetX: 0, offsetY: 0,
                    driftVx: (Math.random() - 0.5) * 20, driftVy: (Math.random() - 0.5) * 20 });
            }
            smokeClouds.push(cloud);
        }

        function createFloatingText(x, y, text, color, big) {
            floatingTexts.push({ x, y, text, color, life: 1.0, maxLife: 1.0, vy: -60 - Math.random() * 40, big: big || false });
        }

        function createLightning(x, y) {
            const bolt = { x, y, segments: [], life: 0.5, maxLife: 0.5, alive: true };
            const segCount = 6 + Math.floor(Math.random() * 8);
            let cx = x, cy = y;
            for (let i = 0; i < segCount; i++) {
                const sx = cx, sy = cy;
                cx += (Math.random() - 0.5) * 50; cy += 30 + Math.random() * 50;
                bolt.segments.push({ x1: sx, y1: sy, x2: cx, y2: cy });
            }
            lightningBolts.push(bolt);
        }

        // === PICKUP SYSTEM ===
        function spawnPickup(x, y, type) {
            pickups.push({ x, y, type, life: 8, maxLife: 8, vy: -40, bobPhase: Math.random() * Math.PI * 2,
                collected: false, magnetDist: 80 });
        }

        // === DAMAGE PLAYER ===
        function damagePlayer(amount) {
            if (player.invincible > 0 || player.goldenShield > 0 || gameState !== 'playing') return;
            // Cap single hit to 50% of max HP
            amount = Math.min(amount, player.maxHp * 0.5);
            player.hp -= amount;
            player.hitFlash = 0.25; player.invincible = 0.5; // 0.5s invincibility after hit
            screenShake = Math.max(screenShake, 6 + amount * 0.3);
            createFloatingText(player.x, player.y - 20, '-' + Math.round(amount), '#ff4444');
            playSound('hurt');
            speakVoice('hurt');
            for (let i = 0; i < 10; i++) {
                particles.push({ x: player.x, y: player.y,
                    vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
                    life: 0.4 + Math.random() * 0.4, maxLife: 0.4 + Math.random() * 0.4,
                    color: '#ff6666', size: 2 + Math.random() * 4, type: 'blood' });
            }
            if (player.hp <= 0) {
                player.hp = 0;
                // If questions remain, show quiz for revival
                if (currentQuestionIndex < questionImages.length && !quizActive) {
                    player.invincible = 2.0; // temporary invincibility during quiz
                    createFloatingText(player.x, player.y - 40, '生死一线！答题续命！', '#ffaa00', true);
                    showQuiz();
                } else {
                    gameState = 'gameover';
                    if (score > highScore) { highScore = score; localStorage.setItem('daoistGhostHighScore', String(score)); }
                    createFloatingText(player.x, player.y - 40, '你倒在了' + getWaveName(waveNumber), '#ff0000', true);
                    for (let i = 0; i < 50; i++) {
                        particles.push({ x: player.x, y: player.y,
                            vx: (Math.random() - 0.5) * 350, vy: (Math.random() - 0.5) * 350,
                            life: 0.8 + Math.random() * 1.2, maxLife: 0.8 + Math.random() * 1.2,
                            color: Math.random() < 0.5 ? '#ffaa00' : '#ff4400',
                            size: 3 + Math.random() * 7, type: 'explosion' });
                    }
                }
            }
        }

        // === GAIN XP ===
        function gainXP(amount) {
            playerXP += amount;
            while (playerXP >= xpToNext) {
                playerXP -= xpToNext;
                playerLevel++;
                xpToNext = Math.floor(80 + playerLevel * 30 + playerLevel * playerLevel * 2);
                // Trigger level up
                playSound('levelup');
                speakVoice('levelup');
                upgradeChoices = [];
                const available = [...ALL_UPGRADES];
                for (let i = 0; i < 3 && available.length > 0; i++) {
                    const idx = Math.floor(Math.random() * available.length);
                    upgradeChoices.push(available.splice(idx, 1)[0]);
                }
                gameState = 'levelup';
                selectedUpgrade = -1;
                // Partial heal on level up
                player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3);
                player.mp = Math.min(player.maxMp, player.mp + player.maxMp * 0.3);
                createFloatingText(player.x, player.y - 50, '修为提升!', '#ffd700', true);
                for (let i = 0; i < 25; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    particles.push({ x: player.x + Math.cos(angle) * 40, y: player.y + Math.sin(angle) * 40,
                        vx: Math.cos(angle) * 100, vy: Math.sin(angle) * 100,
                        life: 0.8 + Math.random() * 0.8, maxLife: 0.8 + Math.random() * 0.8,
                        color: '#ffd700', size: 3 + Math.random() * 5, type: 'golden' });
                }
                return; // Only one level up at a time
            }
        }

        // === KILL ENEMY ===
        function killEnemy(enemy) {
            if (!enemy.alive) return;
            enemy.alive = false; totalKills++;
            comboCount++; comboTimer = 2.5;
            if (comboCount > maxCombo) maxCombo = comboCount;
            const comboMultiplier = Math.min(6, 1 + Math.floor(comboCount / 3) * 0.5);
            const earnedScore = Math.round(enemy.score * comboMultiplier);
            score += earnedScore;
            createFloatingText(enemy.x, enemy.y - 15, '+' + earnedScore, '#ffd700');
            if (comboCount >= 5) createFloatingText(enemy.x, enemy.y - 35, comboCount + '连击!', '#ff9900');
            playSound('kill');
            if (enemy.type === 'boss') speakVoice('boss');
            else if (comboCount >= 5) speakVoice('combo');
            else speakVoice('kill');
            gainXP(enemy.xpValue);
            // Life on kill
            if (player.lifeOnKill > 0) {
                player.hp = Math.min(player.maxHp, player.hp + player.lifeOnKill);
            }
            // Explosion particles
            const pCount = enemy.type === 'boss' ? 60 : 20;
            for (let i = 0; i < pCount; i++) {
                particles.push({ x: enemy.x, y: enemy.y,
                    vx: (Math.random() - 0.5) * (enemy.type === 'boss' ? 400 : 250),
                    vy: (Math.random() - 0.5) * (enemy.type === 'boss' ? 400 : 250),
                    life: 0.5 + Math.random() * (enemy.type === 'boss' ? 1.5 : 0.8),
                    maxLife: 0.5 + Math.random() * (enemy.type === 'boss' ? 1.5 : 0.8),
                    color: enemy.type === 'boss' ? '#ff6600' : '#cc9944',
                    size: 2 + Math.random() * (enemy.type === 'boss' ? 8 : 5), type: 'explosion' });
            }
            // Drop pickups
            if (Math.random() < 0.20) spawnPickup(enemy.x, enemy.y, 'hp');
            if (Math.random() < 0.15) spawnPickup(enemy.x, enemy.y, 'mp');
            if (enemy.type === 'boss') {
                spawnPickup(enemy.x - 30, enemy.y, 'hp');
                spawnPickup(enemy.x + 30, enemy.y, 'mp');
                if (Math.random() < 0.4) spawnPickup(enemy.x, enemy.y - 20, 'power');
            } else if (Math.random() < 0.06) {
                spawnPickup(enemy.x, enemy.y, 'power');
            }
            if (enemy.type === 'boss') {
                screenShake = 18; flashAlpha = 0.6;
                for (let i = 0; i < 8; i++) createLightning(enemy.x + (Math.random() - 0.5) * 200, enemy.y - 100);
            }
        }

        // === RESET GAME ===
        function resetGame() {
            player.x = 200; player.y = GAME_HEIGHT / 2;
            player.hp = 100; player.maxHp = 100; player.mp = 100; player.maxMp = 100;
            player.invincible = 0; player.goldenShield = 0; player.shieldDuration = 3.5;
            player.attackCooldown = 0; player.attackRate = 0.35; player.baseDamage = 25;
            player.hitFlash = 0; player.attackFlash = 0;
            player.speed = 260; player.mpRegen = 0.6; player.hpRegen = 0;
            player.critChance = 0.05; player.lifeOnKill = 0; player.pierce = 0;
            player.dashing = false; player.dashTimer = 0;
            skills.q.cooldown = 0; skills.q.maxCooldown = 7;
            skills.dash.cooldown = 0; skills.dash.maxCooldown = 2.5;
            skills.e.cooldown = 0; skills.e.maxCooldown = 13;
            skills.r.cooldown = 0; skills.r.maxCooldown = 20;
            talismans = []; enemies = []; particles = []; fireballs = [];
            smokeClouds = []; floatingTexts = []; lightningBolts = []; pickups = [];
            ghostFireballs = []; phantomRunes = []; laserBeams = [];
            score = 0; comboCount = 0; comboTimer = 0; maxCombo = 0;
            gameTime = 0; difficultyLevel = 1; spawnTimer = 0;
            totalKills = 0; nextBossAt = 1500; screenShake = 0; flashAlpha = 0;
            playerLevel = 1; playerXP = 0; xpToNext = 80;
            upgradeChoices = []; selectedUpgrade = -1;
            waveNumber = 0; waveEnemiesLeft = 0; waveTimer = 0;
            gameState = 'playing';
            quizTimer = 0; quizActive = false; currentQuestionIndex = 0;
            document.getElementById('gameOverOverlay').classList.remove('active');
            document.getElementById('quizOverlay').classList.remove('active');
            graceTimer = 3.0; // 3 seconds of opening invincibility
            player.invincible = 3.0;
            createFloatingText(player.x, player.y - 50, '道法护身 3秒', '#88ccff', true);
            startWave(1);
        }

        // === UPDATE ===
        function update(dt) {
            menuAnimTimer += dt;
            if (gameState === 'menu') { mouseClicked = false; return; }
            if (gameState === 'paused') { mouseClicked = false; return; }
            if (gameState === 'levelup') {
                updateParticles(dt); updateFloatingTexts(dt);
                // Handle upgrade selection
                if (keys['1'] || keys['digit1']) { applyUpgrade(0); keys['1'] = false; keys['digit1'] = false; }
                if (keys['2'] || keys['digit2']) { applyUpgrade(1); keys['2'] = false; keys['digit2'] = false; }
                if (keys['3'] || keys['digit3']) { applyUpgrade(2); keys['3'] = false; keys['digit3'] = false; }
                // Mouse click on upgrade cards
                if (mouseClicked) {
                    const cardW = 200, cardH = 160, gap = 30;
                    const totalW = upgradeChoices.length * cardW + (upgradeChoices.length - 1) * gap;
                    const startX = GAME_WIDTH / 2 - totalW / 2;
                    const cardY = GAME_HEIGHT / 2 - cardH / 2 + 20;
                    for (let i = 0; i < upgradeChoices.length; i++) {
                        const cx = startX + i * (cardW + gap);
                        if (mouseX >= cx && mouseX <= cx + cardW && mouseY >= cardY && mouseY <= cardY + cardH) {
                            applyUpgrade(i); break;
                        }
                    }
                }
                mouseClicked = false; return;
            }
            if (gameState === 'gameover') {
                updateParticles(dt); updateFloatingTexts(dt); updateLightning(dt);
                document.getElementById('gameOverOverlay').classList.add('active');
                // if (keys['r'] || mouseClicked) { resetGame(); } // disabled - use HTML button
                mouseClicked = false; return;
            }

            const realDt = Math.min(dt, 0.1);
            gameTime += realDt;

            // Voice cooldown
            if (voiceCooldown > 0) voiceCooldown -= realDt;

            // Grace timer countdown
            if (graceTimer > 0) {
                graceTimer -= realDt;
                player.invincible = Math.max(player.invincible, graceTimer);
            }

            // Combo timer
            if (comboTimer > 0) { comboTimer -= realDt; if (comboTimer <= 0) { comboCount = 0; comboTimer = 0; } }

            // Wave announce timer
            if (waveAnnounceTimer > 0) waveAnnounceTimer -= realDt;

            // Screen shake decay
            if (screenShake > 0) {
                screenShake *= Math.exp(-12 * realDt);
                if (screenShake < 0.1) screenShake = 0;
                screenShakeX = (Math.random() - 0.5) * screenShake * 2;
                screenShakeY = (Math.random() - 0.5) * screenShake * 2;
            } else { screenShakeX = 0; screenShakeY = 0; }
            if (flashAlpha > 0) { flashAlpha *= Math.exp(-8 * realDt); if (flashAlpha < 0.005) flashAlpha = 0; }

            // Player movement (keyboard + dpad)
            let moveX = 0, moveY = 0;
            if (keys['w'] || keys['arrowup'] || dpadState.up) moveY = -1;
            if (keys['s'] || keys['arrowdown'] || dpadState.down) moveY = 1;
            if (keys['a'] || keys['arrowleft'] || dpadState.left) moveX = -1;
            if (keys['d'] || keys['arrowright'] || dpadState.right) moveX = 1;

            // Dash
            if (player.dashing) {
                player.dashTimer -= realDt;
                player.x += player.dashVx * realDt;
                player.y += player.dashVy * realDt;
                player.invincible = Math.max(player.invincible, 0.05);
                // Dash trail
                if (Math.random() < 0.6) {
                    particles.push({ x: player.x + (Math.random()-0.5)*20, y: player.y + (Math.random()-0.5)*20,
                        vx: -player.dashVx * 0.2, vy: -player.dashVy * 0.2,
                        life: 0.3, maxLife: 0.3, color: '#88ccff', size: 3 + Math.random() * 4, type: 'golden' });
                }
                if (player.dashTimer <= 0) player.dashing = false;
            } else {
                if (moveX !== 0 || moveY !== 0) {
                    const len = Math.sqrt(moveX * moveX + moveY * moveY);
                    moveX /= len; moveY /= len; player.legPhase += realDt * 10;
                }
                player.vx = moveX * player.speed; player.vy = moveY * player.speed;
                player.x += player.vx * realDt; player.y += player.vy * realDt;
            }
            player.x = Math.max(40, Math.min(GAME_WIDTH - 40, player.x));
            player.y = Math.max(50, Math.min(GAME_HEIGHT - 50, player.y));
            if (moveX > 0.1) player.facingRight = true;
            if (moveX < -0.1) player.facingRight = false;
            player.animTimer += realDt;

            // Regen
            player.mp = Math.min(player.maxMp, player.mp + player.mpRegen * realDt);
            if (player.hpRegen > 0) player.hp = Math.min(player.maxHp, player.hp + player.hpRegen * realDt);
            if (player.invincible > 0) player.invincible -= realDt;
            if (player.goldenShield > 0) player.goldenShield -= realDt;
            if (player.attackCooldown > 0) player.attackCooldown -= realDt;
            if (player.hitFlash > 0) player.hitFlash -= realDt;
            if (player.attackFlash > 0) player.attackFlash -= realDt;
            for (const key in skills) { if (skills[key].cooldown > 0) skills[key].cooldown -= realDt; }

            // === DASH (Shift) ===
            if ((keys['shift'] || keys['shiftleft'] || keys['shiftright']) && skills.dash.cooldown <= 0 && !player.dashing) {
                skills.dash.cooldown = skills.dash.maxCooldown;
                player.dashing = true; player.dashTimer = 0.15;
                let dx = moveX, dy = moveY;
                if (dx === 0 && dy === 0) { dx = player.facingRight ? 1 : -1; dy = 0; }
                const dl = Math.sqrt(dx*dx+dy*dy)||1;
                player.dashVx = (dx/dl) * 900; player.dashVy = (dy/dl) * 900;
                player.invincible = Math.max(player.invincible, 0.2);
                playSound('dash');
                speakVoice('dash');
            }

            // === SKILL Q (勤奋之光 - 书本激光) ===
            if (keys['q'] && skills.q.cooldown <= 0 && player.mp >= skills.q.cost) {
                skills.q.cooldown = skills.q.maxCooldown; player.mp -= skills.q.cost;
                player.attackFlash = 0.5;
                speakVoice('q');
                screenShake = Math.max(screenShake, 6);
                flashAlpha = Math.max(flashAlpha, 0.3);
                // Fire lasers at ALL alive enemies on screen
                const laserDamage = 30 + playerLevel * 3;
                const aliveEnemies = enemies.filter(en => en.alive);
                const bookX = player.x + (player.facingRight ? 20 : -20);
                const bookY = player.y - 15;
                // Book burst particles (golden pages)
                for (let i = 0; i < 16; i++) {
                    const a = (i / 16) * Math.PI * 2;
                    particles.push({ x: bookX, y: bookY,
                        vx: Math.cos(a) * (60 + Math.random() * 80), vy: Math.sin(a) * (60 + Math.random() * 80),
                        life: 0.4 + Math.random() * 0.4, maxLife: 0.4 + Math.random() * 0.4,
                        color: ['#ffd700','#fff4a0','#ffaa00','#ffffff'][Math.floor(Math.random()*4)],
                        size: 3 + Math.random() * 5, type: 'spark' });
                }
                if (aliveEnemies.length > 0) {
                    aliveEnemies.forEach((en, idx) => {
                        // Stagger laser creation slightly for visual flair
                        const delay = idx * 0.04;
                        laserBeams.push({
                            x1: bookX, y1: bookY,
                            x2: en.x, y2: en.y,
                            life: 0.6, maxLife: 0.6,
                            delay: delay,
                            damage: laserDamage,
                            target: en,
                            hit: false,
                            color: Math.random() < 0.5 ? '#ffd700' : '#44ddff',
                            width: 4 + Math.random() * 3,
                        });
                    });
                } else {
                    // No enemies, fire a single laser forward for visual effect
                    const angle = player.facingRight ? 0 : Math.PI;
                    laserBeams.push({
                        x1: bookX, y1: bookY,
                        x2: bookX + Math.cos(angle) * 800, y2: bookY,
                        life: 0.6, maxLife: 0.6, delay: 0,
                        damage: 0, target: null, hit: false,
                        color: '#ffd700', width: 5,
                    });
                }
                playSound('thunder');
            }
            // === SKILL E ===
            if (keys['e'] && skills.e.cooldown <= 0 && player.mp >= skills.e.cost) {
                skills.e.cooldown = skills.e.maxCooldown; player.mp -= skills.e.cost;
                flashAlpha = 0.8; screenShake = 14; player.attackFlash = 0.5;
                playSound('thunder');
                speakVoice('e');
                enemies.forEach(en => {
                    if (!en.alive) return;
                    en.hp -= 65; en.hitFlash = 0.4;
                    createLightning(en.x, en.y - 60);
                    if (en.hp <= 0) killEnemy(en);
                });
                for (let i = 0; i < 15; i++) createLightning(100 + Math.random() * (GAME_WIDTH - 200), 50 + Math.random() * 100);
                for (let i = 0; i < 40; i++) {
                    particles.push({ x: player.x + (Math.random() - 0.5) * GAME_WIDTH, y: Math.random() * GAME_HEIGHT,
                        vx: 0, vy: 300 + Math.random() * 400,
                        life: 0.3 + Math.random() * 0.5, maxLife: 0.3 + Math.random() * 0.5,
                        color: '#ffffff', size: 2 + Math.random() * 5, type: 'lightning_spark' });
                }
            }
            // === SKILL R ===
            if (keys['r'] && skills.r.cooldown <= 0 && player.mp >= skills.r.cost) {
                skills.r.cooldown = skills.r.maxCooldown; player.mp -= skills.r.cost;
                player.goldenShield = player.shieldDuration; player.attackFlash = 0.6;
                playSound('shield');
                speakVoice('r');
                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * 50;
                    particles.push({ x: player.x + Math.cos(angle) * dist, y: player.y + Math.sin(angle) * dist,
                        vx: Math.cos(angle) * 80, vy: Math.sin(angle) * 80,
                        life: 0.6 + Math.random() * 1, maxLife: 0.6 + Math.random() * 1,
                        color: '#ffd700', size: 3 + Math.random() * 6, type: 'golden' });
                }
            }

            // === NORMAL ATTACK (auto-aim at nearest enemy) ===
            if ((mouseDown || touchAttackDown || keys[' '] || keys['space'] || keys['j'] || keys['attack']) && player.attackCooldown <= 0 && !player.dashing) {
                player.attackCooldown = player.attackRate; player.attackFlash = 0.15;
                let dmg = player.baseDamage;
                let isCrit = Math.random() < player.critChance;
                if (isCrit) dmg = Math.round(dmg * 1.8);
                // Auto-aim: find nearest alive enemy
                let targetX = player.x + (player.facingRight ? 300 : -300), targetY = player.y;
                let nearestDist = Infinity;
                enemies.forEach(en => {
                    if (!en.alive) return;
                    const dx = en.x - player.x, dy = en.y - player.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < nearestDist) { nearestDist = d; targetX = en.x; targetY = en.y; }
                });
                fireTalisman(targetX, targetY, 520, dmg, isCrit ? '#ff8800' : '#f5d442', isCrit ? 20 : 16);
            }

            // === UPDATE TALISMANS ===
            talismans.forEach(t => {
                if (!t.alive) return;
                t.x += t.vx * realDt; t.y += t.vy * realDt;
                t.rotation = Math.atan2(t.vy, t.vx);
                t.sparkTimer += realDt;
                if (t.sparkTimer > 0.04) {
                    t.sparkTimer = 0;
                    particles.push({ x: t.x - t.vx * 0.02, y: t.y - t.vy * 0.02,
                        vx: (Math.random()-0.5)*40, vy: (Math.random()-0.5)*40,
                        life: 0.2, maxLife: 0.2, color: '#ffe566', size: 1.5 + Math.random()*2, type: 'spark' });
                }
                if (t.x < -60 || t.x > GAME_WIDTH + 60 || t.y < -60 || t.y > GAME_HEIGHT + 60) t.alive = false;
                enemies.forEach(en => {
                    if (!en.alive || !t.alive || t.hitEnemies.has(en)) return;
                    const dx = t.x - en.x, dy = t.y - en.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < en.width * 0.7 + t.size * 0.6) {
                        t.hitEnemies.add(en);
                        if (t.pierceLeft <= 0) t.alive = false;
                        else t.pierceLeft--;
                        en.hp -= t.damage; en.hitFlash = 0.2;
                        playSound('hit');
                        for (let i = 0; i < 5; i++) {
                            particles.push({ x: t.x, y: t.y,
                                vx: (Math.random()-0.5)*180, vy: (Math.random()-0.5)*180,
                                life: 0.25, maxLife: 0.25, color: '#ffcc00', size: 2 + Math.random()*3, type: 'hit' });
                        }
                        if (t.damage > player.baseDamage) createFloatingText(t.x, t.y - 10, '暴击!', '#ff8800');
                        if (en.hp <= 0) killEnemy(en);
                    }
                });
            });
            talismans = talismans.filter(t => t.alive);

            // === UPDATE FIREBALLS ===
            fireballs.forEach(fb => {
                if (!fb.alive) return;
                // Homing: steer toward strongest (highest HP) alive enemy
                let target = null, bestHp = -1;
                enemies.forEach(en => {
                    if (!en.alive) return;
                    if (en.hp > bestHp) { bestHp = en.hp; target = en; }
                });
                if (target) {
                    const dx = target.x - fb.x, dy = target.y - fb.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const curSpeed = Math.sqrt(fb.vx * fb.vx + fb.vy * fb.vy) || 480;
                    const desiredVx = (dx / dist) * curSpeed;
                    const desiredVy = (dy / dist) * curSpeed;
                    const turnRate = 5.0; // radians/sec steering strength
                    fb.vx += (desiredVx - fb.vx) * turnRate * realDt;
                    fb.vy += (desiredVy - fb.vy) * turnRate * realDt;
                    // Maintain constant speed
                    const newSpeed = Math.sqrt(fb.vx * fb.vx + fb.vy * fb.vy) || 1;
                    fb.vx = (fb.vx / newSpeed) * curSpeed;
                    fb.vy = (fb.vy / newSpeed) * curSpeed;
                }
                fb.x += fb.vx * realDt; fb.y += fb.vy * realDt;
                fb.rotation = Math.atan2(fb.vy, fb.vx);
                fb.life -= realDt;
                fb.sparkTimer += realDt;
                if (fb.sparkTimer > 0.025) {
                    fb.sparkTimer = 0;
                    particles.push({ x: fb.x - fb.vx * 0.015, y: fb.y - fb.vy * 0.015,
                        vx: (Math.random()-0.5)*60, vy: (Math.random()-0.5)*60,
                        life: 0.3, maxLife: 0.3,
                        color: ['#ff4400','#ff8800','#ffcc00'][Math.floor(Math.random()*3)],
                        size: 3 + Math.random()*5, type: 'spark' });
                }
                if (fb.x < -80 || fb.x > GAME_WIDTH + 80 || fb.y < -80 || fb.y > GAME_HEIGHT + 80 || fb.life <= 0) {
                    explodeFireball(fb);
                }
                // Check collision with enemies
                enemies.forEach(en => {
                    if (!en.alive || !fb.alive) return;
                    const dx = fb.x - en.x, dy = fb.y - en.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < en.width * 0.7 + fb.size * 0.5) {
                        explodeFireball(fb);
                    }
                });
            });
            fireballs = fireballs.filter(fb => fb.alive);

            // === UPDATE ENEMIES ===
            enemies.forEach(en => {
                if (!en.alive) return;
                if (en.hitFlash > 0) en.hitFlash -= realDt;
                en.phase += realDt;
                const dx = player.x - en.x, dy = player.y - en.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                // Charger AI
                if (en.type === 'charger') {
                    if (en.charging) {
                        en.x += en.chargeVx * realDt; en.y += en.chargeVy * realDt;
                        en.chargeTimer -= realDt;
                        if (en.chargeTimer <= 0) { en.charging = false; en.chargeTimer = 2.5 + Math.random() * 2; }
                        // Charge trail
                        if (Math.random() < 0.5) particles.push({ x: en.x, y: en.y,
                            vx: (Math.random()-0.5)*60, vy: (Math.random()-0.5)*60,
                            life: 0.3, maxLife: 0.3, color: '#ffaa33', size: 3, type: 'spark' });
                    } else {
                        en.chargeTimer -= realDt;
                        if (en.chargeTimer <= 0 && dist < 500) {
                            en.charging = true; en.chargeTimer = 0.6;
                            en.chargeVx = (dx / dist) * 450; en.chargeVy = (dy / dist) * 450;
                            createFloatingText(en.x, en.y - 30, '冲!', '#ffaa33');
                        }
                        // Idle movement
                        if (dist > 300) { en.vx = (dx / dist) * en.speed; en.vy = (dy / dist) * en.speed * 0.5; }
                        else { en.vx = (Math.sin(en.phase) * 40); en.vy = (Math.cos(en.phase * 0.7) * 30); }
                        en.x += en.vx * realDt; en.y += en.vy * realDt;
                    }
                } else if (en.type === 'flyer') {
                    const targetX = player.x + Math.cos(en.phase * 0.7) * en.retreatDistance;
                    const targetY = player.y + Math.sin(en.phase * 0.9) * en.retreatDistance * 0.8;
                    en.vx = (targetX - en.x) * 2.0; en.vy = (targetY - en.y) * 2.0;
                    en.x += en.vx * realDt; en.y += en.vy * realDt;
                } else if (dist < en.retreatDistance) {
                    en.vx = (-dx / dist) * en.speed * 1.3; en.vy = (-dy / dist) * en.speed * 0.7;
                    en.x += en.vx * realDt; en.y += en.vy * realDt;
                } else if (dist > en.retreatDistance + 150) {
                    en.vx = (dx / dist) * en.speed; en.vy = (dy / dist) * en.speed * 0.5;
                    en.x += en.vx * realDt; en.y += en.vy * realDt;
                } else {
                    en.vx = (-dx / dist) * en.speed * 0.3;
                    en.vy = (Math.sin(en.phase * 1.5) * en.floatAmp) * 1.5;
                    en.x += en.vx * realDt; en.y += en.vy * realDt;
                }
                en.y += Math.sin(en.phase * en.floatSpeed) * en.floatAmp * realDt;
                en.x = Math.max(40, Math.min(GAME_WIDTH - 40, en.x));
                en.y = Math.max(50, Math.min(GAME_HEIGHT - 50, en.y));

                // Contact damage for charger
                if (en.type === 'charger' && en.charging && dist < 45) {
                    damagePlayer(25 + waveNumber * 3);
                    en.charging = false; en.chargeTimer = 2;
                }

                // Ghost Fireball attack (鬼火弹) with charge-up warning
                en.sonicTimer -= realDt;
                if (en.sonicTimer <= 0 && en.sonicTimer > -0.6 && dist < 500 && en.type !== 'charger') {
                    // Charging phase: show warning but don't fire yet
                    en.sonicCharging = true;
                }
                if (en.sonicCharging && en.sonicTimer <= -0.6) {
                    en.sonicCharging = false;
                    en.sonicTimer = en.sonicCooldown;
                    createGhostFireball(en.x, en.y, en.type === 'boss' ? 50 + waveNumber * 4 : en.type === 'big' ? 25 + waveNumber * 2 : 18 + waveNumber * 1.5, player.x, player.y);
                    createFloatingText(en.x, en.y - en.height * 0.6 - 10, '鬼火!', '#44ff88');
                }
                // Phantom Rune attack (幽冥法阵)
                if ((en.type === 'big' || en.type === 'flyer' || en.type === 'boss') && en.type !== 'charger') {
                    en.smokeTimer -= realDt;
                    if (en.smokeTimer <= 0 && dist < 450) {
                        en.smokeTimer = en.smokeCooldown;
                        createPhantomRune(player.x + (Math.random()-0.5)*60, player.y + (Math.random()-0.5)*60, en.type === 'boss' ? 40 + waveNumber * 3 : 20 + waveNumber * 1.5);
                    }
                }
            });
            enemies = enemies.filter(en => en.alive);

            // === UPDATE GHOST FIREBALLS ===
            ghostFireballs.forEach(fb => {
                if (!fb.alive) return;
                fb.life -= realDt;
                fb.pulsePhase += realDt * 12;
                fb.x += fb.vx * realDt;
                fb.y += fb.vy * realDt;
                fb.rotation = Math.atan2(fb.vy, fb.vx);
                // Trail particles
                if (Math.random() < 0.7) {
                    particles.push({ x: fb.x + (Math.random()-0.5)*8, y: fb.y + (Math.random()-0.5)*8,
                        vx: -fb.vx * 0.15 + (Math.random()-0.5)*40, vy: -fb.vy * 0.15 + (Math.random()-0.5)*40,
                        life: 0.3 + Math.random()*0.3, maxLife: 0.3 + Math.random()*0.3,
                        color: Math.random() < 0.5 ? '#44ff88' : '#22cc66', size: 3 + Math.random()*4, type: 'spark' });
                }
                // Check collision with player
                const dx = player.x - fb.x, dy = player.y - fb.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 30 && !fb.hasHit) {
                    fb.hasHit = true; fb.alive = false;
                    damagePlayer(fb.damage);
                    // Explosion particles
                    for (let i = 0; i < 15; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        particles.push({ x: fb.x, y: fb.y,
                            vx: Math.cos(angle) * (80 + Math.random()*120), vy: Math.sin(angle) * (80 + Math.random()*120),
                            life: 0.4 + Math.random()*0.4, maxLife: 0.4 + Math.random()*0.4,
                            color: Math.random() < 0.5 ? '#44ff88' : '#88ffcc', size: 3 + Math.random()*5, type: 'explosion' });
                    }
                    screenShake = Math.max(screenShake, 5);
                }
                if (fb.x < -60 || fb.x > GAME_WIDTH + 60 || fb.y < -60 || fb.y > GAME_HEIGHT + 60) fb.alive = false;
                if (fb.life <= 0) fb.alive = false;
            });
            ghostFireballs = ghostFireballs.filter(fb => fb.alive);

            // === UPDATE PHANTOM RUNES ===
            phantomRunes.forEach(rune => {
                if (!rune.alive) return;
                rune.life -= realDt;
                rune.rotation += realDt * 2.5;
                if (rune.life <= 0 && !rune.detonated) {
                    rune.detonated = true;
                    // Detonate! Check if player is in radius
                    const dx = player.x - rune.x, dy = player.y - rune.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < rune.radius * 0.85) {
                        damagePlayer(rune.damage);
                    }
                    // Detonation explosion particles
                    for (let i = 0; i < 30; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const r = Math.random() * rune.radius;
                        particles.push({ x: rune.x + Math.cos(angle)*r, y: rune.y + Math.sin(angle)*r,
                            vx: Math.cos(angle) * (60 + Math.random()*100), vy: Math.sin(angle) * (60 + Math.random()*100) - 50,
                            life: 0.5 + Math.random()*0.6, maxLife: 0.5 + Math.random()*0.6,
                            color: Math.random() < 0.4 ? '#ff2266' : Math.random() < 0.7 ? '#cc44ff' : '#ff6600',
                            size: 4 + Math.random()*6, type: 'explosion' });
                    }
                    screenShake = Math.max(screenShake, 8);
                    // Keep alive briefly for detonation animation
                    rune.life = -0.5;
                }
                if (rune.life < -0.5) rune.alive = false;
            });
            phantomRunes = phantomRunes.filter(r => r.alive);

            // === UPDATE SMOKE CLOUDS ===
            smokeClouds.forEach(cloud => {
                if (!cloud.alive) return;
                cloud.life -= realDt;
                const dx = player.x - cloud.x, dy = player.y - cloud.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                cloud.x += (dx / dist) * 35 * realDt; cloud.y += (dy / dist) * 35 * realDt;
                cloud.particles.forEach(p => {
                    p.life -= realDt;
                    p.driftVx += (Math.random()-0.5)*30*realDt; p.driftVy += (Math.random()-0.5)*30*realDt;
                    p.offsetX += p.driftVx * realDt; p.offsetY += p.driftVy * realDt;
                    p.x = cloud.x + p.baseX + p.offsetX; p.y = cloud.y + p.baseY + p.offsetY;
                });
                const pdist = Math.sqrt((player.x-cloud.x)**2 + (player.y-cloud.y)**2);
                if (pdist < cloud.radius * 0.8) damagePlayer(cloud.damage * realDt);
                if (cloud.life <= 0) cloud.alive = false;
            });
            smokeClouds = smokeClouds.filter(c => c.alive);

            // === UPDATE PICKUPS ===
            pickups.forEach(p => {
                if (p.collected) return;
                p.life -= realDt; p.bobPhase += realDt * 3;
                p.vy *= 0.95; p.y += p.vy * realDt;
                // Magnet effect
                const dx = player.x - p.x, dy = player.y - p.y;
                const dist = Math.sqrt(dx*dx+dy*dy);
                if (dist < p.magnetDist) {
                    const pull = (1 - dist / p.magnetDist) * 400;
                    p.x += (dx/dist) * pull * realDt; p.y += (dy/dist) * pull * realDt;
                }
                if (dist < 25) {
                    p.collected = true; playSound('pickup');
                    if (p.type === 'hp') { player.hp = Math.min(player.maxHp, player.hp + 20); createFloatingText(p.x, p.y, '+20HP', '#44ff44'); }
                    else if (p.type === 'mp') { player.mp = Math.min(player.maxMp, player.mp + 30); createFloatingText(p.x, p.y, '+30MP', '#4488ff'); }
                    else if (p.type === 'power') { player.baseDamage += 3; createFloatingText(p.x, p.y, '攻击+3', '#ff8800'); }
                }
                if (p.life <= 0) p.collected = true;
            });
            pickups = pickups.filter(p => !p.collected);

            updateParticles(realDt); updateFloatingTexts(realDt); updateLightning(realDt); updateLaserBeams(realDt);

            // === QUIZ TIMER ===
            if (currentQuestionIndex < questionImages.length && !quizActive) {
                quizTimer += realDt;
                if (quizTimer >= QUIZ_INTERVAL) {
                    quizTimer = 0;
                    showQuiz();
                }
            }

            // === WAVE SPAWNING ===
            if (waveEnemiesLeft > 0) {
                spawnTimer -= realDt;
                if (spawnTimer <= 0) {
                    spawnTimer = spawnInterval;
                    waveEnemiesLeft--;
                    const roll = Math.random();
                    if (waveEnemiesLeft === 0) {
                        spawnEnemy('boss');
                        createFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, '鬼王现身！', '#ff0000', true);
                    } else if (waveNumber <= 2) {
                        // Wave 1-2: only small ghosts
                        spawnEnemy('small');
                    } else if (waveNumber <= 3) {
                        // Wave 3: small + big
                        if (roll < 0.6) spawnEnemy('small');
                        else spawnEnemy('big');
                    } else if (waveNumber <= 4) {
                        // Wave 4: small + big + flyer (introduced)
                        if (roll < 0.45) spawnEnemy('small');
                        else if (roll < 0.7) spawnEnemy('big');
                        else spawnEnemy('flyer');
                    } else {
                        // Wave 5+: all types
                        if (roll < 0.30) spawnEnemy('small');
                        else if (roll < 0.50) spawnEnemy('big');
                        else if (roll < 0.72) spawnEnemy('flyer');
                        else spawnEnemy('charger');
                    }
                    // Extra spawn at higher difficulty - spawn groups
                    if (waveNumber >= 2 && Math.random() < 0.7 && waveEnemiesLeft > 2) {
                        waveEnemiesLeft -= 3; spawnEnemy('small'); spawnEnemy('small'); spawnEnemy('small');
                    } else if (waveNumber >= 1 && Math.random() < 0.5 && waveEnemiesLeft > 1) {
                        waveEnemiesLeft -= 2; spawnEnemy('small'); spawnEnemy('small');
                    }
                }
            }
            // Check wave clear
            if (waveEnemiesLeft <= 0 && enemies.length === 0 && gameState === 'playing') {
                waveTimer += realDt;
                if (waveTimer > 2.0) {
                    waveTimer = 0;
                    waveClearBonus = 200 + waveNumber * 50;
                    score += waveClearBonus;
                    createFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 30, `恭喜你通过了${getWaveName(waveNumber)}! +${waveClearBonus}`, '#ffd700', true);
                    startWave(waveNumber + 1);
                }
            }

            mouseClicked = false;
        }

        function applyUpgrade(index) {
            if (index < 0 || index >= upgradeChoices.length) return;
            upgradeChoices[index].apply();
            gameState = 'playing';
            upgradeChoices = [];
        }

        function updateParticles(dt) {
            particles.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.type === 'spark') p.size *= 0.98; });
            particles = particles.filter(p => p.life > 0);
            if (particles.length > 400) particles = particles.slice(-350);
        }
        function updateFloatingTexts(dt) {
            floatingTexts.forEach(ft => { ft.life -= dt; ft.y += ft.vy * dt; });
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
        }
        function updateLightning(dt) {
            lightningBolts.forEach(l => { l.life -= dt; if (l.life <= 0) l.alive = false; });
            lightningBolts = lightningBolts.filter(l => l.alive);
        }

        function updateLaserBeams(dt) {
            laserBeams.forEach(beam => {
                if (beam.delay > 0) { beam.delay -= dt; return; }
                beam.life -= dt;
                // Apply damage once when laser activates
                if (!beam.hit && beam.target && beam.target.alive) {
                    beam.hit = true;
                    const en = beam.target;
                    // Update endpoint to current enemy position
                    beam.x2 = en.x; beam.y2 = en.y;
                    en.hp -= beam.damage; en.hitFlash = 0.3;
                    createFloatingText(en.x, en.y - en.height * 0.5, beam.damage + '', '#ffd700');
                    // Hit spark particles at target
                    for (let i = 0; i < 8; i++) {
                        particles.push({ x: en.x, y: en.y,
                            vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
                            life: 0.3 + Math.random() * 0.3, maxLife: 0.3 + Math.random() * 0.3,
                            color: ['#ffd700','#ffffff','#44ddff'][Math.floor(Math.random()*3)],
                            size: 2 + Math.random() * 4, type: 'spark' });
                    }
                    if (en.hp <= 0) killEnemy(en);
                }
                if (beam.life <= 0) beam.alive = false;
                else beam.alive = true;
            });
            laserBeams = laserBeams.filter(b => b.alive !== false && b.life > 0);
        }

        // ====== DRAWING ======
        function drawBackground() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            skyGrad.addColorStop(0, '#1a1520'); skyGrad.addColorStop(0.3, '#1c1825');
            skyGrad.addColorStop(0.6, '#1a1622'); skyGrad.addColorStop(1, '#15101c');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            // Stars
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 80; i++) {
                const sx = ((i * 137 + 42) % GAME_WIDTH);
                const sy = ((i * 251 + 126) % (GAME_HEIGHT * 0.55));
                ctx.globalAlpha = (0.3 + 0.7 * Math.abs(Math.sin(gameTime * 0.8 + i))) * 0.7;
                ctx.fillRect(sx, sy, 1.5, 1.5);
            }
            ctx.globalAlpha = 1;
            // Moon
            const moonX = GAME_WIDTH * 0.78, moonY = 130;
            const moonGrad = ctx.createRadialGradient(moonX, moonY, 20, moonX, moonY, 90);
            moonGrad.addColorStop(0, '#fffef0'); moonGrad.addColorStop(0.3, '#f5f0d0');
            moonGrad.addColorStop(0.7, '#c8b880'); moonGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = moonGrad; ctx.beginPath(); ctx.arc(moonX, moonY, 85, 0, Math.PI * 2); ctx.fill();
            const glowGrad = ctx.createRadialGradient(moonX, moonY, 30, moonX, moonY, 180);
            glowGrad.addColorStop(0, 'rgba(255,250,220,0.25)'); glowGrad.addColorStop(1, 'rgba(255,250,220,0)');
            ctx.fillStyle = glowGrad; ctx.beginPath(); ctx.arc(moonX, moonY, 175, 0, Math.PI * 2); ctx.fill();
            // Mountains
            ctx.fillStyle = '#0f0c18'; ctx.beginPath(); ctx.moveTo(0, GAME_HEIGHT);
            ctx.quadraticCurveTo(200, GAME_HEIGHT-180, 350, GAME_HEIGHT-130);
            ctx.quadraticCurveTo(500, GAME_HEIGHT-200, 650, GAME_HEIGHT-100);
            ctx.quadraticCurveTo(800, GAME_HEIGHT-240, 950, GAME_HEIGHT-150);
            ctx.quadraticCurveTo(1100, GAME_HEIGHT-190, 1250, GAME_HEIGHT-120);
            ctx.quadraticCurveTo(1350, GAME_HEIGHT-160, GAME_WIDTH, GAME_HEIGHT-80);
            ctx.lineTo(GAME_WIDTH, GAME_HEIGHT); ctx.lineTo(0, GAME_HEIGHT); ctx.fill();
            ctx.fillStyle = '#0a0812'; ctx.beginPath(); ctx.moveTo(0, GAME_HEIGHT);
            ctx.quadraticCurveTo(150, GAME_HEIGHT-100, 300, GAME_HEIGHT-60);
            ctx.quadraticCurveTo(500, GAME_HEIGHT-140, 700, GAME_HEIGHT-50);
            ctx.quadraticCurveTo(900, GAME_HEIGHT-110, 1100, GAME_HEIGHT-70);
            ctx.quadraticCurveTo(1250, GAME_HEIGHT-90, GAME_WIDTH, GAME_HEIGHT-40);
            ctx.lineTo(GAME_WIDTH, GAME_HEIGHT); ctx.lineTo(0, GAME_HEIGHT); ctx.fill();
            // Ground
            const groundGrad = ctx.createLinearGradient(0, GAME_HEIGHT-40, 0, GAME_HEIGHT);
            groundGrad.addColorStop(0, '#1a1510'); groundGrad.addColorStop(1, '#0d0a06');
            ctx.fillStyle = groundGrad; ctx.fillRect(0, GAME_HEIGHT-40, GAME_WIDTH, 40);
            // Mist
            for (let i = 0; i < 5; i++) {
                const mx = (i * 300 + gameTime * 15) % (GAME_WIDTH + 400) - 200;
                ctx.fillStyle = 'rgba(180,175,190,0.04)';
                ctx.beginPath(); ctx.ellipse(mx, GAME_HEIGHT - 100 + i * 30, 200 + i * 40, 25 + i * 8, 0, 0, Math.PI * 2); ctx.fill();
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.scale(1.8, 1.8);
            ctx.translate(-player.x, -player.y);

        function drawEnemy(enemy) {
            if (!enemy.alive && enemy.hitFlash <= 0) return;

                auraGrad.addColorStop(0.5, 'rgba(40,40,40,0.1)');
