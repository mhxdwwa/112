<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>降魔记</title>
    <style>
        :root { --bg: #1a0a0a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d; overflow: hidden;
            font-family: 'STSong', 'SimSun', 'KaiTi', '楷体', '宋体', serif;
            cursor: crosshair; user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
        }
        canvas {
            display: block; border-radius: 4px;
            box-shadow: 0 0 60px rgba(180,40,20,0.4), 0 0 120px rgba(180,40,20,0.2), 0 0 10px rgba(255,180,60,0.3);
        }
        /* center skill indicators removed for classroom edition */
        /* === CLASSROOM EDITION ADDITIONS === */
        #imageUpload { display: none; }
        #menuOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:20;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #menuOverlay.active { display: flex; }
        #menuButtons {
            display: flex; flex-direction: column; gap: 16px; align-items: center;
            margin-top: 280px;
        }
        #menuButtons button {
            padding: 14px 48px; font-size: 22px; font-weight: bold;
            font-family: 'STSong','SimSun','KaiTi','楷体','宋体',serif;
            border: 2px solid #d4a840; border-radius: 8px; cursor: pointer;
            color: #ffd700; background: rgba(139,32,32,0.9);
            box-shadow: 0 0 20px rgba(200,100,0,0.4);
        }
        #menuButtons button:disabled {
            opacity: 0.45; cursor: not-allowed;
        }
        #menuButtons button:not(:disabled):hover {
            background: rgba(180,50,50,0.95);
            box-shadow: 0 0 30px rgba(255,150,0,0.6);
        }
        #importStatus {
            color: #aa8866; font-size: 14px; margin-top: 8px;
            font-family: 'STSong','SimSun','KaiTi',serif;
        }

        /* Quiz overlay */
        #quizOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:30;
            background: rgba(0,0,0,0.82); display:none; align-items:center; justify-content:center;
            flex-direction: column;
        }
        #quizOverlay.active { display: flex; }
        #quizContainer {
            position: relative; background: #fff; border-radius: 10px;
            box-shadow: 0 0 40px rgba(255,200,0,0.5);
            width: 1250px; height: 700px; overflow: hidden;
        }
        #quizImage {
            display: block; width: 1250px; height: 700px; object-fit: contain;
        }
        #drawingCanvas {
            position: absolute; top:0; left:0; width:100%; height:100%;
            cursor: crosshair;
        }
        #quizToolbar {
            display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap;
            justify-content: center;
        }
        #quizToolbar button {
            padding: 10px 20px; font-size: 16px; border-radius: 6px; border: 2px solid #888;
            cursor: pointer; font-weight: bold;
            font-family: 'STSong','SimSun','KaiTi',serif;
            background: #333; color: #fff;
        }
        .color-btn {
            width: 36px !important; height: 36px !important; padding: 0 !important;
            border-radius: 50% !important; border: 3px solid #fff !important;
            min-width: 36px;
        }
        .color-btn.selected { border-color: #ffd700 !important; box-shadow: 0 0 10px #ffd700; }
        #eraserBtn.selected { background: #ffd700 !important; color: #000 !important; }
        #submitBtn { background: #2a6040; color: #fff; border-color: #4a9060; }
        #clearBtn { background: #555; color: #fff; }
        #quizResult {
            display: none; gap: 16px; margin-top: 12px; justify-content: center;
        }
        #quizResult.active { display: flex; }
        #correctBtn { background: #2d8040; color: #fff; font-size: 28px; padding: 10px 32px; border: 2px solid #4a4; border-radius: 8px; cursor: pointer; }
        #wrongBtn { background: #a03030; color: #fff; font-size: 28px; padding: 10px 32px; border: 2px solid #c44; border-radius: 8px; cursor: pointer; }

        /* Game over overlay */
        #gameOverOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:25;
            display:none; align-items:center; justify-content:center;
            pointer-events: none;
        }
        #gameOverOverlay.active { display:flex; pointer-events:auto; }
        #gameOverOverlay button {
            margin-top: 20px; padding: 14px 48px; font-size: 22px; font-weight: bold;
            font-family: 'STSong','SimSun','KaiTi','楷体','宋体',serif;
            border: 2px solid #d4a840; border-radius: 8px; cursor: pointer;
            color: #ffd700; background: rgba(139,32,32,0.9);
        }

        /* Touch D-pad - left side bottom */
        #dpad {
            position: fixed; bottom: 20px; left: 16px; z-index: 15;
            width: 120px; height: 120px; pointer-events: none;
            display: none;
        }
        #dpad.active { display: block; }
        .dpad-btn {
            position: absolute; width: 38px; height: 38px;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: rgba(255,255,255,0.6); pointer-events: auto;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .dpad-btn:active, .dpad-btn.pressed { background: rgba(255,200,80,0.4); border-color: #ffd700; }
        #dpad-up { top: 0; left: 41px; }
        #dpad-down { bottom: 0; left: 41px; }
        #dpad-left { top: 41px; left: 0; }
        #dpad-right { top: 41px; left: 82px; }

        /* Touch skill buttons - right of d-pad, close together for single-hand */
        #touchSkills {
            position: fixed; bottom: 20px; left: 150px; z-index: 15;
            width: 190px; height: 130px; pointer-events: none;
            display: none;
        }
        #touchSkills.active { display: block; }
        .touch-skill {
            position: absolute; width: 48px; height: 48px;
            background: rgba(30,15,5,0.8); border: 2px solid #8b6914;
            border-radius: 50%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 10px; color: #d4a840; pointer-events: auto;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'STSong','SimSun','KaiTi',serif;
            line-height: 1.2;
        }
        .touch-skill .key-label {
            font-size: 8px; color: #aa8844; font-family: 'Georgia',serif;
            margin-top: 1px; opacity: 0.8;
        }
        .touch-skill:active, .touch-skill.pressed { background: rgba(200,150,40,0.5); border-color: #ffd700; }
        /* Row 1 (top): Q, E */
        #touch-q { top: 0; left: 0; }
        #touch-e { top: 0; left: 56px; }
        /* Row 2 (bottom): R, Shift */
        #touch-r { top: 56px; left: 0; }
        #touch-shift { top: 56px; left: 56px; font-size: 9px; }
        /* Attack: large, right column spanning both rows */
        #touch-attack {
            top: 6px; left: 120px;
            width: 64px; height: 64px; font-size: 12px;
            background: rgba(180,40,20,0.6); border-color: #cc4420;
        }
        #touch-pause {
            top: 80px; left: 128px;
            width: 48px; height: 32px; font-size: 11px;
            background: rgba(80,80,120,0.7); border-color: #8888cc;
            border-radius: 6px !important;
        }
        #touch-pause:active, #touch-pause.pressed { background: rgba(120,120,200,0.7); border-color: #aaaaff; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <!-- ui-overlay skill indicators removed for classroom edition -->

    <!-- Hidden file input -->
    <input type="file" id="imageUpload" accept="image/*" multiple>

    <!-- Menu overlay -->
    <div id="menuOverlay" class="active">
        <div id="menuButtons">
            <button id="importBtn">导入题目</button>
            <span id="importStatus">请先导入题目图片</span>
            <button id="startBtn" disabled>开始修炼</button>
        </div>
    </div>

    <!-- Quiz overlay -->
    <div id="quizOverlay">
        <div id="quizContainer">
            <img id="quizImage" src="">
            <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="quizToolbar">
            <button class="color-btn selected" style="background:#000" data-color="#000000"></button>
            <button class="color-btn" style="background:#cc0000" data-color="#cc0000"></button>
            <button class="color-btn" style="background:#0044cc" data-color="#0044cc"></button>
            <button class="color-btn" style="background:#008800" data-color="#008800"></button>
            <button id="eraserBtn" onclick="window._quizToggleEraser()">橡皮</button>
            <button id="clearBtn" onclick="window._quizClear()">清除</button>
            <button id="submitBtn" onclick="window._quizSubmit()">提交</button>
        </div>
        <div id="quizResult">
            <button id="correctBtn" onclick="window._quizCorrect()">&#10003; 正确</button>
            <button id="wrongBtn" onclick="window._quizWrong()">&#10007; 错误</button>
        </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameOverOverlay">
        <button id="returnMenuBtn" onclick="window._returnToMenu()">返回菜单</button>
    </div>

    <!-- Touch D-pad -->
    <div id="dpad">
        <div class="dpad-btn" id="dpad-up">&#9650;</div>
        <div class="dpad-btn" id="dpad-down">&#9660;</div>
        <div class="dpad-btn" id="dpad-left">&#9664;</div>
        <div class="dpad-btn" id="dpad-right">&#9654;</div>
    </div>

    <!-- Touch skill buttons - right side -->
    <div id="touchSkills">
        <div class="touch-skill" id="touch-q">勤奋之光<span class="key-label">[Q]</span></div>
        <div class="touch-skill" id="touch-e">正义之雷<span class="key-label">[E]</span></div>
        <div class="touch-skill" id="touch-r">自律护盾<span class="key-label">[R]</span></div>
        <div class="touch-skill" id="touch-shift">奋进冲锋<span class="key-label">[Shift]</span></div>
        <div class="touch-skill" id="touch-attack">攻击<span class="key-label">[左键]</span></div>
        <div class="touch-skill" id="touch-pause">暂停</div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GAME_WIDTH = 1400, GAME_HEIGHT = 800;
        let scale = 1;

        function resize() {
            const ww = window.innerWidth, wh = window.innerHeight;
            scale = Math.min(ww / GAME_WIDTH, wh / GAME_HEIGHT);
            canvas.width = GAME_WIDTH; canvas.height = GAME_HEIGHT;
            canvas.style.width = (GAME_WIDTH * scale) + 'px';
            canvas.style.height = (GAME_HEIGHT * scale) + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        // === INPUT ===
        const keys = {};
        let mouseX = GAME_WIDTH / 2, mouseY = GAME_HEIGHT / 2;
        let mouseDown = false, mouseClicked = false;
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; keys[e.code] = true; e.preventDefault(); });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.code] = false; e.preventDefault(); });
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) / scale;
            mouseY = (e.clientY - rect.top) / scale;
        });
        canvas.addEventListener('mousedown', e => { mouseDown = true; mouseClicked = true; e.preventDefault(); });
        canvas.addEventListener('mouseup', () => { mouseDown = false; });
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        // Touch support
        canvas.addEventListener('touchstart', e => {
            e.preventDefault(); const t = e.touches[0]; const rect = canvas.getBoundingClientRect();
            mouseX = (t.clientX - rect.left) / scale; mouseY = (t.clientY - rect.top) / scale;
            mouseDown = true; mouseClicked = true;
        }, {passive: false});
        canvas.addEventListener('touchmove', e => {
            e.preventDefault(); const t = e.touches[0]; const rect = canvas.getBoundingClientRect();
            mouseX = (t.clientX - rect.left) / scale; mouseY = (t.clientY - rect.top) / scale;
        }, {passive: false});
        canvas.addEventListener('touchend', e => { e.preventDefault(); mouseDown = false; }, {passive: false});

        // === CLASSROOM EDITION: Question System ===
        let questionImages = [];
        let currentQuestionIndex = 0;
        let quizActive = false;
        let quizTimer = 0;
        const QUIZ_INTERVAL = 20;
        let drawingColor = '#000000';
        let isErasing = false;
        let drawingCtxRef = null;
        let isDrawing = false;
        let lastDrawX = 0, lastDrawY = 0;

        // === D-PAD STATE ===
        const dpadState = { up: false, down: false, left: false, right: false };
        let touchAttackDown = false;

        // === IMAGE IMPORT ===
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            let loaded = 0;
            files.forEach(function(file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        questionImages.push(img);
                        loaded++;
                        if (loaded === files.length) {
                            alert('成功导入 ' + questionImages.length + ' 道题目！');
                            document.getElementById('importStatus').textContent = '已导入 ' + questionImages.length + ' 道题目';
                            document.getElementById('startBtn').disabled = false;
                        }
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        // Start button
        document.getElementById('startBtn').addEventListener('click', function() {
            if (questionImages.length === 0) return;
            document.getElementById('menuOverlay').classList.remove('active');
            document.getElementById('dpad').classList.add('active');
            document.getElementById('touchSkills').classList.add('active');
            ensureAudio();
            resetGame();
        });

        // Import button additional images
        document.getElementById('importBtn').addEventListener('click', function() {
            document.getElementById('imageUpload').value = '';
            document.getElementById('imageUpload').click();
        });

        // === QUIZ FUNCTIONS ===
        function showQuiz() {
            if (currentQuestionIndex >= questionImages.length || quizActive) return;
            quizActive = true;
            const img = questionImages[currentQuestionIndex];
            currentQuestionIndex++;
            const quizImg = document.getElementById('quizImage');
            quizImg.src = img.src;
            quizImg.onload = function() {
                const dc = document.getElementById('drawingCanvas');
                dc.width = quizImg.naturalWidth;
                dc.height = quizImg.naturalHeight;
                drawingCtxRef = dc.getContext('2d');
                drawingCtxRef.clearRect(0, 0, dc.width, dc.height);
            };
            document.getElementById('quizOverlay').classList.add('active');
            document.getElementById('quizResult').classList.remove('active');
            document.getElementById('submitBtn').style.display = '';
        }

        // Drawing on quiz canvas
        (function setupDrawing() {
            const dc = document.getElementById('drawingCanvas');
            function getPos(e) {
                const rect = dc.getBoundingClientRect();
                const scX = dc.width / rect.width, scY = dc.height / rect.height;
                if (e.touches) {
                    return { x: (e.touches[0].clientX - rect.left) * scX, y: (e.touches[0].clientY - rect.top) * scY };
                }
                return { x: (e.clientX - rect.left) * scX, y: (e.clientY - rect.top) * scY };
            }
            function startDraw(e) {
                e.preventDefault(); isDrawing = true;
                const p = getPos(e); lastDrawX = p.x; lastDrawY = p.y;
            }
            function moveDraw(e) {
                if (!isDrawing || !drawingCtxRef) return;
                e.preventDefault();
                const p = getPos(e);
                drawingCtxRef.beginPath();
                drawingCtxRef.moveTo(lastDrawX, lastDrawY);
                drawingCtxRef.lineTo(p.x, p.y);
                if (isErasing) {
                    drawingCtxRef.globalCompositeOperation = 'destination-out';
                    drawingCtxRef.lineWidth = 20;
                } else {
                    drawingCtxRef.globalCompositeOperation = 'source-over';
                    drawingCtxRef.strokeStyle = drawingColor;
                    drawingCtxRef.lineWidth = 1.5;
                    drawingCtxRef.globalAlpha = 1.0;
                }
                drawingCtxRef.lineCap = 'round';
                drawingCtxRef.stroke();
                lastDrawX = p.x; lastDrawY = p.y;
            }
            function endDraw(e) { isDrawing = false; }
            dc.addEventListener('mousedown', startDraw);
            dc.addEventListener('mousemove', moveDraw);
            dc.addEventListener('mouseup', endDraw);
            dc.addEventListener('mouseleave', endDraw);
            dc.addEventListener('touchstart', startDraw, {passive:false});
            dc.addEventListener('touchmove', moveDraw, {passive:false});
            dc.addEventListener('touchend', endDraw, {passive:false});
        })();

        // Color buttons
        document.querySelectorAll('.color-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                drawingColor = btn.dataset.color;
                isErasing = false;
                document.querySelectorAll('.color-btn').forEach(function(b) { b.classList.remove('selected'); });
                btn.classList.add('selected');
                document.getElementById('eraserBtn').classList.remove('selected');
            });
        });

        window._quizToggleEraser = function() {
            isErasing = !isErasing;
            document.getElementById('eraserBtn').classList.toggle('selected', isErasing);
            document.querySelectorAll('.color-btn').forEach(function(b) { b.classList.remove('selected'); });
        };
        window._quizClear = function() {
            if (drawingCtxRef) {
                const dc = document.getElementById('drawingCanvas');
                drawingCtxRef.clearRect(0, 0, dc.width, dc.height);
            }
        };
        window._quizSubmit = function() {
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('quizResult').classList.add('active');
        };
        window._quizCorrect = function() {
            if (player.hp <= 0) {
                // Revival: answer correct while dead
                player.hp = Math.ceil(player.maxHp * 0.5);
                player.mp = Math.min(player.maxMp, player.mp + player.maxMp * 0.5);
                player.invincible = 3.0;
                createFloatingText(player.x, player.y - 40, '续命成功! 复活50%HP', '#44ff44', true);
            } else {
                // Normal quiz heal
                player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.5);
                player.mp = Math.min(player.maxMp, player.mp + player.maxMp * 0.5);
                createFloatingText(player.x, player.y - 40, '答对! +50%HP +50%MP', '#44ff44', true);
            }
            closeQuiz();
        };
        window._quizWrong = function() {
            if (player.hp <= 0) {
                // Dead and answered wrong = game over
                createFloatingText(player.x, player.y - 40, '答错! 道陨!', '#ff0000', true);
                gameState = 'gameover';
                if (score > highScore) { highScore = score; localStorage.setItem('daoistGhostHighScore', String(score)); }
                for (let i = 0; i < 50; i++) {
                    particles.push({ x: player.x, y: player.y,
                        vx: (Math.random() - 0.5) * 350, vy: (Math.random() - 0.5) * 350,
                        life: 0.8 + Math.random() * 1.2, maxLife: 0.8 + Math.random() * 1.2,
                        color: Math.random() < 0.5 ? '#ffaa00' : '#ff4400',
                        size: 3 + Math.random() * 7, type: 'explosion' });
                }
            } else {
                // Normal quiz penalty
                player.hp -= player.maxHp * 0.5;
                player.mp = Math.max(0, player.mp - player.maxMp * 0.5);
                createFloatingText(player.x, player.y - 40, '答错! -50%HP -50%MP', '#ff4444', true);
                if (player.hp <= 0) {
                    player.hp = 0;
                    gameState = 'gameover';
                    if (score > highScore) { highScore = score; localStorage.setItem('daoistGhostHighScore', String(score)); }
                }
            }
            closeQuiz();
        };
        function closeQuiz() {
            quizActive = false;
            quizTimer = 0;
            document.getElementById('quizOverlay').classList.remove('active');
            document.getElementById('quizResult').classList.remove('active');
        }

        // === GAME OVER: Return to menu ===
        window._returnToMenu = function() {
            gameState = 'menu';
            document.getElementById('gameOverOverlay').classList.remove('active');
            document.getElementById('menuOverlay').classList.add('active');
            document.getElementById('dpad').classList.remove('active');
            document.getElementById('touchSkills').classList.remove('active');
        };

        // === TOUCH D-PAD SETUP ===
        (function setupDpad() {
            const dirs = ['up','down','left','right'];
            dirs.forEach(function(dir) {
                const el = document.getElementById('dpad-' + dir);
                el.addEventListener('touchstart', function(e) { e.preventDefault(); dpadState[dir] = true; el.classList.add('pressed'); }, {passive:false});
                el.addEventListener('touchend', function(e) { e.preventDefault(); dpadState[dir] = false; el.classList.remove('pressed'); }, {passive:false});
                el.addEventListener('touchcancel', function(e) { dpadState[dir] = false; el.classList.remove('pressed'); });
                el.addEventListener('mousedown', function(e) { e.preventDefault(); dpadState[dir] = true; el.classList.add('pressed'); });
                el.addEventListener('mouseup', function(e) { dpadState[dir] = false; el.classList.remove('pressed'); });
                el.addEventListener('mouseleave', function(e) { dpadState[dir] = false; el.classList.remove('pressed'); });
            });
        })();

        // === TOUCH SKILL BUTTONS (touch + mouse) ===
        (function setupTouchSkills() {
            function bindTouch(id, keyName) {
                const el = document.getElementById(id);
                function onDown(e) {
                    e.preventDefault(); e.stopPropagation();
                    if (keyName === 'attack') { touchAttackDown = true; }
                    else { keys[keyName] = true; }
                    el.classList.add('pressed');
                }
                function onUp(e) {
                    if (e) { e.preventDefault(); e.stopPropagation(); }
                    if (keyName === 'attack') { touchAttackDown = false; }
                    else { keys[keyName] = false; }
                    el.classList.remove('pressed');
                }
                el.addEventListener('touchstart', onDown, {passive:false});
                el.addEventListener('touchend', onUp, {passive:false});
                el.addEventListener('touchcancel', onUp);
                el.addEventListener('mousedown', onDown);
                el.addEventListener('mouseup', onUp);
                el.addEventListener('mouseleave', onUp);
            }
            bindTouch('touch-q', 'q');
            bindTouch('touch-e', 'e');
            bindTouch('touch-r', 'r');
            bindTouch('touch-shift', 'shift');
            bindTouch('touch-attack', 'attack');

            // Pause button
            const pauseBtn = document.getElementById('touch-pause');
            pauseBtn.addEventListener('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                if (gameState === 'playing') {
                    gameState = 'paused';
                    pauseBtn.textContent = '继续';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    pauseBtn.textContent = '暂停';
                }
            });
            pauseBtn.addEventListener('touchstart', function(e) {
                e.preventDefault(); e.stopPropagation();
                if (gameState === 'playing') {
                    gameState = 'paused';
                    pauseBtn.textContent = '继续';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    pauseBtn.textContent = '暂停';
                }
            }, {passive:false});
        })();

        // === AUDIO (Web Audio API) ===
        let audioCtx = null;
        function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            try {
                ensureAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                switch(type) {
                    case 'shoot':
                        osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                        gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1); break;
                    case 'hit':
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                        gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15); break;
                    case 'kill':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                        gain.gain.setValueAtTime(0.45, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2); break;
                    case 'thunder':
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now);
                        gain.gain.setValueAtTime(0.6, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5); break;
                    case 'shield':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
                        osc.frequency.linearRampToValueAtTime(800, now + 0.3);
                        gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now); osc.stop(now + 0.4); break;
                    case 'dash':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
                        gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                        osc.start(now); osc.stop(now + 0.12); break;
                    case 'levelup':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523, now);
                        osc.frequency.setValueAtTime(659, now + 0.1);
                        osc.frequency.setValueAtTime(784, now + 0.2);
                        osc.frequency.setValueAtTime(1047, now + 0.3);
                        gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5); break;
                    case 'pickup':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
                        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
                        gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15); break;
                    case 'hurt':
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
                        gain.gain.setValueAtTime(0.45, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now); osc.stop(now + 0.25); break;
                    case 'boss':
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, now);
                        osc.frequency.linearRampToValueAtTime(120, now + 0.3);
                        osc.frequency.linearRampToValueAtTime(60, now + 0.6);
                        gain.gain.setValueAtTime(0.55, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                        osc.start(now); osc.stop(now + 0.8); break;
                }

        const FEMALE_KEYWORDS = /female|女|xiaoxiao|xiaoyi|xiaomo|xiaorui|xiaoshuang|xiaoxuan|xiaohan|xiaomeng|xiaozhen|xiaoni|xiaojun|nana|lili|huihui|yaoyao|siqi|yunxia|tingting|ting-ting|meijia|yating|hanhan|lulu|girl|woman|anna|zira|hazel|susan|linda|jenny|aria|sara|sonia|elsa|hortense|heami|heera|hemant.*f|美|晓|小|雅|甜|萌|柔/i;
        // 已知的男声名称关键词（全平台覆盖）
        const MALE_KEYWORDS = /male|男|yunyang|yunjian|yunze|yunhao|yunfeng|yunxi(?!a)|yunye|yunsung|yunxiao|kangkang|zhiyu|guangxi|boyuan|longwei|david|mark|daniel|george|james|richard|guy|thomas|sean|ravi|kuan|li-mu/i;

        function findMaleVoice() {
            const voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) return null;
            const cnVoices = voices.filter(v => v.lang && (v.lang.startsWith('zh') || v.lang.startsWith('cmn')));
            // 打印所有可用的中文语音到控制台供调试
            console.log('[道士伏鬼录] 可用中文语音:', cnVoices.map(v => v.name + ' (' + v.lang + ')'));
            if (cnVoices.length === 0) {
                console.log('[道士伏鬼录] 无中文语音可用，将使用任意语音+极低pitch');
                return null;
            }
            // 第一优先：名称明确包含男声关键词
            let male = cnVoices.find(v => MALE_KEYWORDS.test(v.name));
            if (male) { console.log('[道士伏鬼录] 选中男声:', male.name); return male; }
            // 第二优先：排除所有已知女声名称
            let notFemale = cnVoices.filter(v => !FEMALE_KEYWORDS.test(v.name));
            if (notFemale.length > 0) { console.log('[道士伏鬼录] 排除女声后选中:', notFemale[0].name); return notFemale[0]; }
            // 兜底：返回最后一个中文语音（通常第一个是默认女声，后面的可能是男声）
            let last = cnVoices[cnVoices.length - 1];
