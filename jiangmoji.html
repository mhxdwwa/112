            auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = auraGrad; ctx.beginPath(); ctx.arc(ex, ey + floatOff, w * 1.4, 0, Math.PI * 2); ctx.fill();

            // === BODY by type ===
            if (enemy.type === 'flyer') {
                // Wraith-like flying ghost with wispy tail
                const bc = flashColor ? '#eeddff' : '#6a4a80';
                const bodyGrad = ctx.createLinearGradient(ex, ey - h * 0.6, ex, ey + h * 0.8);
                bodyGrad.addColorStop(0, flashColor ? '#ffffff' : '#8a6aa0');
                bodyGrad.addColorStop(0.5, bc);
                bodyGrad.addColorStop(1, 'rgba(80,40,100,0)');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(ex, ey - h * 0.6 + floatOff);
                ctx.bezierCurveTo(ex - w * 0.5, ey - h * 0.3 + floatOff, ex - w * 0.55, ey + h * 0.2, ex - w * 0.2, ey + h * 0.7);
                ctx.quadraticCurveTo(ex, ey + h * 0.5, ex + w * 0.2, ey + h * 0.7);
                ctx.bezierCurveTo(ex + w * 0.55, ey + h * 0.2, ex + w * 0.5, ey - h * 0.3 + floatOff, ex, ey - h * 0.6 + floatOff);
                ctx.fill();
                // Wings
                const wingFlap = Math.sin(enemy.phase * 5) * 0.3;
                ctx.fillStyle = flashColor ? 'rgba(220,200,255,0.5)' : 'rgba(120,70,160,0.35)';
                ctx.beginPath();
                ctx.moveTo(ex - w * 0.3, ey - h * 0.1);
                ctx.quadraticCurveTo(ex - w * 1.1, ey - h * 0.5 + wingFlap * 30, ex - w * 0.8, ey + h * 0.1);
                ctx.quadraticCurveTo(ex - w * 0.5, ey, ex - w * 0.3, ey - h * 0.1);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(ex + w * 0.3, ey - h * 0.1);
                ctx.quadraticCurveTo(ex + w * 1.1, ey - h * 0.5 + wingFlap * 30, ex + w * 0.8, ey + h * 0.1);
                ctx.quadraticCurveTo(ex + w * 0.5, ey, ex + w * 0.3, ey - h * 0.1);
                ctx.fill();
                // Wispy tail strands
                ctx.strokeStyle = flashColor ? 'rgba(200,180,255,0.4)' : 'rgba(100,60,140,0.3)'; ctx.lineWidth = 2;
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(ex + i * 6, ey + h * 0.5);
                    ctx.quadraticCurveTo(ex + i * 10 + Math.sin(gameTime * 3 + i) * 8, ey + h * 0.85, ex + i * 12 + Math.sin(gameTime * 2.5 + i) * 12, ey + h * 1.1);
                    ctx.stroke();
                }

            } else if (enemy.type === 'charger') {
                // Bull-demon / aggressive oni shape
                const bc = flashColor ? '#ffe0c0' : '#7a5a3a';
                const bodyGrad = ctx.createLinearGradient(ex, ey - h * 0.5, ex, ey + h * 0.5);
                bodyGrad.addColorStop(0, flashColor ? '#ffffff' : '#9a7a50');
                bodyGrad.addColorStop(0.5, bc);
                bodyGrad.addColorStop(1, flashColor ? '#ffcc99' : '#4a3520');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(ex, ey - h * 0.5 + floatOff);
                ctx.lineTo(ex - w * 0.5, ey - h * 0.1);
                ctx.quadraticCurveTo(ex - w * 0.45, ey + h * 0.4, ex - w * 0.2, ey + h * 0.5);
                ctx.lineTo(ex + w * 0.2, ey + h * 0.5);
                ctx.quadraticCurveTo(ex + w * 0.45, ey + h * 0.4, ex + w * 0.5, ey - h * 0.1);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
                // Arms (muscular)
                ctx.fillStyle = flashColor ? '#ffcc99' : '#6a4a2a';
                ctx.beginPath();
                ctx.roundRect(ex - w * 0.65, ey - h * 0.1, w * 0.25, h * 0.4, 4); ctx.fill();
                ctx.beginPath();
                ctx.roundRect(ex + w * 0.4, ey - h * 0.1, w * 0.25, h * 0.4, 4); ctx.fill();
                // Fists
                ctx.fillStyle = flashColor ? '#ffe0c0' : '#8a6a40';
                ctx.beginPath(); ctx.arc(ex - w * 0.52, ey + h * 0.3, 5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(ex + w * 0.52, ey + h * 0.3, 5, 0, Math.PI * 2); ctx.fill();
                // Horns (larger, curved)
                const hornColor = enemy.charging ? '#ffcc33' : '#c8a050';
                ctx.fillStyle = hornColor;
                ctx.beginPath();
                ctx.moveTo(ex - 12, ey - h * 0.35 + floatOff);
                ctx.quadraticCurveTo(ex - 18, ey - h * 0.8 + floatOff, ex - 6, ey - h * 0.75 + floatOff);
                ctx.lineTo(ex - 5, ey - h * 0.4 + floatOff);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(ex + 12, ey - h * 0.35 + floatOff);
                ctx.quadraticCurveTo(ex + 18, ey - h * 0.8 + floatOff, ex + 6, ey - h * 0.75 + floatOff);
                ctx.lineTo(ex + 5, ey - h * 0.4 + floatOff);
                ctx.closePath(); ctx.fill();
                // Charge trail
                if (enemy.charging) {
                    ctx.shadowColor = 'rgba(255,170,50,0.7)'; ctx.shadowBlur = 15;
                    ctx.strokeStyle = 'rgba(255,200,80,0.6)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(ex, ey, w * 0.7, 0, Math.PI * 2); ctx.stroke();
                    ctx.shadowBlur = 0;
                }

            } else if (enemy.type === 'boss') {
                // Large menacing ghost king
                const bc = flashColor ? '#ffcccc' : '#6a2020';
                const bodyGrad = ctx.createRadialGradient(ex, ey - h * 0.1, w * 0.1, ex, ey + h * 0.1, w * 0.8);
                bodyGrad.addColorStop(0, flashColor ? '#ffffff' : '#8a3030');
                bodyGrad.addColorStop(0.6, bc);
                bodyGrad.addColorStop(1, flashColor ? '#ff8888' : '#2a0808');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(ex, ey - h * 0.55 + floatOff);
                ctx.bezierCurveTo(ex - w * 0.7, ey - h * 0.4 + floatOff, ex - w * 0.65, ey + h * 0.3, ex - w * 0.3, ey + h * 0.55);
                // Jagged bottom
                ctx.quadraticCurveTo(ex - w * 0.15, ey + h * 0.45, ex, ey + h * 0.55);
                ctx.quadraticCurveTo(ex + w * 0.15, ey + h * 0.45, ex + w * 0.3, ey + h * 0.55);
                ctx.bezierCurveTo(ex + w * 0.65, ey + h * 0.3, ex + w * 0.7, ey - h * 0.4 + floatOff, ex, ey - h * 0.55 + floatOff);
                ctx.fill();
                ctx.strokeStyle = 'rgba(180,40,20,0.4)'; ctx.lineWidth = 2; ctx.stroke();
                // Shoulder pads / armor
                ctx.fillStyle = flashColor ? '#ffaaaa' : '#4a1515';
                ctx.beginPath();
                ctx.ellipse(ex - w * 0.45, ey - h * 0.2, w * 0.22, h * 0.15, -0.2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.ellipse(ex + w * 0.45, ey - h * 0.2, w * 0.22, h * 0.15, 0.2, 0, Math.PI * 2); ctx.fill();
                // Crown (elaborate)
                ctx.fillStyle = flashColor ? '#ffcc00' : '#8b0000';
                ctx.beginPath();
                ctx.moveTo(ex - 18, ey - h * 0.45 + floatOff);
                ctx.lineTo(ex - 14, ey - h * 0.8 + floatOff);
                ctx.lineTo(ex - 6, ey - h * 0.55 + floatOff);
                ctx.lineTo(ex, ey - h * 0.9 + floatOff);
                ctx.lineTo(ex + 6, ey - h * 0.55 + floatOff);
                ctx.lineTo(ex + 14, ey - h * 0.8 + floatOff);
                ctx.lineTo(ex + 18, ey - h * 0.45 + floatOff);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#d4a840'; ctx.lineWidth = 1.5; ctx.stroke();
                // Crown gems
                ctx.fillStyle = '#ff2200';
                ctx.beginPath(); ctx.arc(ex, ey - h * 0.82 + floatOff, 4, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff6600';
                ctx.beginPath(); ctx.arc(ex - 13, ey - h * 0.72 + floatOff, 2.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(ex + 13, ey - h * 0.72 + floatOff, 2.5, 0, Math.PI * 2); ctx.fill();
                // Dark energy wisps around body
                ctx.strokeStyle = 'rgba(200,40,40,0.25)'; ctx.lineWidth = 2;
                for (let i = 0; i < 4; i++) {
                    const a = gameTime * 1.5 + i * Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(ex + Math.cos(a) * w * 0.5, ey + Math.sin(a) * h * 0.4);
                    ctx.quadraticCurveTo(ex + Math.cos(a + 0.5) * w * 0.8, ey + Math.sin(a + 0.5) * h * 0.6, ex + Math.cos(a + 1) * w * 0.6, ey + Math.sin(a + 1) * h * 0.5);
                    ctx.stroke();
                }

            } else if (enemy.type === 'big') {
                // Larger ghost, more intimidating
                const bc = flashColor ? '#eeeedd' : '#4a4040';
                const bodyGrad = ctx.createLinearGradient(ex, ey - h * 0.5, ex, ey + h * 0.6);
                bodyGrad.addColorStop(0, flashColor ? '#ffffff' : '#6a5a5a');
                bodyGrad.addColorStop(0.6, bc);
                bodyGrad.addColorStop(1, 'rgba(50,40,40,0)');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(ex, ey - h * 0.55 + floatOff);
                ctx.bezierCurveTo(ex - w * 0.6, ey - h * 0.3 + floatOff, ex - w * 0.55, ey + h * 0.3, ex - w * 0.15, ey + h * 0.6);
                ctx.quadraticCurveTo(ex, ey + h * 0.5, ex + w * 0.15, ey + h * 0.6);
                ctx.bezierCurveTo(ex + w * 0.55, ey + h * 0.3, ex + w * 0.6, ey - h * 0.3 + floatOff, ex, ey - h * 0.55 + floatOff);
                ctx.fill();
                // Ghost pattern on body
                ctx.fillStyle = flashColor ? 'rgba(200,200,200,0.3)' : 'rgba(80,70,70,0.3)';
                ctx.beginPath(); ctx.arc(ex - 6, ey + h * 0.1, 6, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(ex + 8, ey + h * 0.15, 4, 0, Math.PI * 2); ctx.fill();

            } else {
                // Small ghost - gaunt, twisted wraith shape
                const bc = flashColor ? '#ccccbb' : '#4a3a3a';
                const bodyGrad = ctx.createLinearGradient(ex, ey - h * 0.5, ex, ey + h * 0.6);
                bodyGrad.addColorStop(0, flashColor ? '#dddddd' : '#5a4040');
                bodyGrad.addColorStop(0.5, bc);
                bodyGrad.addColorStop(1, 'rgba(30,15,15,0)');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(ex, ey - h * 0.55 + floatOff);
                ctx.bezierCurveTo(ex - w * 0.6, ey - h * 0.35 + floatOff, ex - w * 0.55, ey + h * 0.15, ex - w * 0.3, ey + h * 0.5);
                // Jagged torn bottom
                ctx.lineTo(ex - w * 0.2, ey + h * 0.4);
                ctx.lineTo(ex - w * 0.1, ey + h * 0.55);
                ctx.lineTo(ex, ey + h * 0.38);
                ctx.lineTo(ex + w * 0.1, ey + h * 0.55);
                ctx.lineTo(ex + w * 0.2, ey + h * 0.4);
                ctx.lineTo(ex + w * 0.3, ey + h * 0.5);
                ctx.bezierCurveTo(ex + w * 0.55, ey + h * 0.15, ex + w * 0.6, ey - h * 0.35 + floatOff, ex, ey - h * 0.55 + floatOff);
                ctx.fill();
                // Bony claw-like arms
                ctx.strokeStyle = flashColor ? 'rgba(200,200,200,0.6)' : 'rgba(60,40,40,0.7)';
                ctx.lineWidth = 1.5; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ex - w * 0.4, ey - h * 0.05);
                ctx.lineTo(ex - w * 0.65, ey + h * 0.15);
                ctx.lineTo(ex - w * 0.72, ey + h * 0.08);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ex - w * 0.65, ey + h * 0.15);
                ctx.lineTo(ex - w * 0.7, ey + h * 0.22);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ex + w * 0.4, ey - h * 0.05);
                ctx.lineTo(ex + w * 0.65, ey + h * 0.15);
                ctx.lineTo(ex + w * 0.72, ey + h * 0.08);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ex + w * 0.65, ey + h * 0.15);
                ctx.lineTo(ex + w * 0.7, ey + h * 0.22);
                ctx.stroke();
            }

            // === FACE (all types) - UGLY & FIERCE ===
            const eyeY = ey - h * 0.12 + floatOff;
            const eyeSpacing = enemy.type === 'boss' ? w * 0.25 : w * 0.22;
            const eyeSize = enemy.type === 'boss' ? 8 : enemy.type === 'big' ? 7 : 5;

            // Angry slanted eye sockets (dark sunken hollows)
            const socketColor = flashColor ? 'rgba(80,0,0,0.3)' : 'rgba(0,0,0,0.7)';
            ctx.fillStyle = socketColor;
            ctx.save();
            ctx.translate(ex - eyeSpacing, eyeY); ctx.rotate(-0.25);
            ctx.beginPath(); ctx.ellipse(0, 0, eyeSize * 1.4, eyeSize * 0.9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.translate(ex + eyeSpacing, eyeY); ctx.rotate(0.25);
            ctx.beginPath(); ctx.ellipse(0, 0, eyeSize * 1.4, eyeSize * 0.9, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            // Eye glow - sinister red/green
            const eyeGlowColor = flashColor ? '#ffffff' : (enemy.type === 'boss' ? '#ff0000' : enemy.type === 'charger' ? '#ff4400' : '#cc0000');
            const eyeGlowRad = eyeSize * 3;
            const eg1 = ctx.createRadialGradient(ex - eyeSpacing, eyeY, 1, ex - eyeSpacing, eyeY, eyeGlowRad);
            eg1.addColorStop(0, eyeGlowColor); eg1.addColorStop(0.4, eyeGlowColor + '88'); eg1.addColorStop(1, 'transparent');
            ctx.fillStyle = eg1;
            ctx.beginPath(); ctx.arc(ex - eyeSpacing, eyeY, eyeGlowRad, 0, Math.PI * 2); ctx.fill();
            const eg2 = ctx.createRadialGradient(ex + eyeSpacing, eyeY, 1, ex + eyeSpacing, eyeY, eyeGlowRad);
            eg2.addColorStop(0, eyeGlowColor); eg2.addColorStop(0.4, eyeGlowColor + '88'); eg2.addColorStop(1, 'transparent');
            ctx.fillStyle = eg2;
            ctx.beginPath(); ctx.arc(ex + eyeSpacing, eyeY, eyeGlowRad, 0, Math.PI * 2); ctx.fill();

            // Angry slanted eyeballs (narrowed, tilted inward = angry)
            ctx.fillStyle = flashColor ? '#ffcccc' : '#ffddaa';
            ctx.save();
            ctx.translate(ex - eyeSpacing, eyeY); ctx.rotate(-0.3);
            ctx.beginPath(); ctx.ellipse(0, 0, eyeSize * 0.9, eyeSize * 0.45, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.translate(ex + eyeSpacing, eyeY); ctx.rotate(0.3);
            ctx.beginPath(); ctx.ellipse(0, 0, eyeSize * 0.9, eyeSize * 0.45, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            // Bloodshot veins in eyes
            if (!flashColor) {
                ctx.strokeStyle = 'rgba(200,0,0,0.5)'; ctx.lineWidth = 0.5;
                for (let v = 0; v < 3; v++) {
                    const va = -0.6 + v * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(ex - eyeSpacing + Math.cos(va) * eyeSize * 0.3, eyeY + Math.sin(va) * eyeSize * 0.2);
                    ctx.lineTo(ex - eyeSpacing + Math.cos(va) * eyeSize * 0.9, eyeY + Math.sin(va) * eyeSize * 0.4);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(ex + eyeSpacing + Math.cos(Math.PI - va) * eyeSize * 0.3, eyeY + Math.sin(va) * eyeSize * 0.2);
                    ctx.lineTo(ex + eyeSpacing + Math.cos(Math.PI - va) * eyeSize * 0.9, eyeY + Math.sin(va) * eyeSize * 0.4);
                    ctx.stroke();
                }
            }

            // Vertical slit pupils (reptilian/demonic)
            const lookDx = (player.x - ex) * 0.003, lookDy = (player.y - ey) * 0.003;
            ctx.fillStyle = flashColor ? '#330000' : '#000';
            ctx.beginPath(); ctx.ellipse(ex - eyeSpacing + lookDx, eyeY + lookDy, eyeSize * 0.12, eyeSize * 0.4, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(ex + eyeSpacing + lookDx, eyeY + lookDy, eyeSize * 0.12, eyeSize * 0.4, 0, 0, Math.PI * 2); ctx.fill();

            // Angry eyebrow ridges
            ctx.strokeStyle = flashColor ? '#aa6666' : 'rgba(30,0,0,0.8)'; ctx.lineWidth = enemy.type === 'boss' ? 3 : 2;
            ctx.beginPath();
            ctx.moveTo(ex - eyeSpacing - eyeSize * 1.2, eyeY - eyeSize * 0.4);
            ctx.lineTo(ex - eyeSpacing + eyeSize * 0.6, eyeY - eyeSize * 1.0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ex + eyeSpacing + eyeSize * 1.2, eyeY - eyeSize * 0.4);
            ctx.lineTo(ex + eyeSpacing - eyeSize * 0.6, eyeY - eyeSize * 1.0);
            ctx.stroke();

            // Scars / wrinkles on face
            if (enemy.type === 'boss' || enemy.type === 'big') {
                ctx.strokeStyle = 'rgba(80,0,0,0.35)'; ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(ex - eyeSpacing + eyeSize, eyeY - eyeSize * 0.3);
                ctx.lineTo(ex - eyeSpacing + eyeSize * 1.5, eyeY + eyeSize * 1.2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(ex + eyeSpacing - eyeSize * 0.5, eyeY + eyeSize * 0.2);
                ctx.lineTo(ex + eyeSpacing + eyeSize * 0.3, eyeY + eyeSize * 1.5);
                ctx.stroke();
            }

            // Mouth - always menacing
            const mouthOpen = enemy.sonicTimer < 0.4 || enemy.smokeTimer < 0.6 || (enemy.type === 'charger' && enemy.charging);
            const mouthY = ey + h * 0.18 + floatOff;
            const mouthW = enemy.type === 'boss' ? w * 0.28 : w * 0.22;
            const mouthH = enemy.type === 'boss' ? h * 0.16 : h * 0.13;
            if (mouthOpen) {
                // Wide gaping maw
                const mGrad = ctx.createRadialGradient(ex, mouthY, 0, ex, mouthY, mouthW);
                mGrad.addColorStop(0, '#300010'); mGrad.addColorStop(0.6, '#100005'); mGrad.addColorStop(1, '#000');
                ctx.fillStyle = mGrad;
                ctx.beginPath();
                ctx.moveTo(ex - mouthW, mouthY - mouthH * 0.2);
                ctx.quadraticCurveTo(ex, mouthY - mouthH * 0.8, ex + mouthW, mouthY - mouthH * 0.2);
                ctx.quadraticCurveTo(ex, mouthY + mouthH * 1.2, ex - mouthW, mouthY - mouthH * 0.2);
                ctx.fill();
                // Jagged sharp fangs - upper row
                ctx.fillStyle = '#eeddcc';
                const fangCount = enemy.type === 'boss' ? 7 : enemy.type === 'big' ? 5 : 4;
                for (let f = 0; f < fangCount; f++) {
                    const fx = ex - mouthW * 0.8 + (mouthW * 1.6 / (fangCount - 1)) * f;
                    const fh = (f % 2 === 0 ? 5 : 3) * (enemy.type === 'boss' ? 1.5 : 1);
                    ctx.beginPath();
                    ctx.moveTo(fx - 2, mouthY - mouthH * 0.15);
                    ctx.lineTo(fx, mouthY + fh);
                    ctx.lineTo(fx + 2, mouthY - mouthH * 0.15);
                    ctx.fill();
                }
                // Lower fangs
                for (let f = 0; f < Math.floor(fangCount * 0.6); f++) {
                    const fx = ex - mouthW * 0.5 + (mouthW * 1.0 / Math.max(1, Math.floor(fangCount * 0.6) - 1)) * f;
                    const fh = (f % 2 === 0 ? 4 : 2.5) * (enemy.type === 'boss' ? 1.3 : 1);
                    ctx.beginPath();
                    ctx.moveTo(fx - 1.5, mouthY + mouthH * 0.3);
                    ctx.lineTo(fx, mouthY + mouthH * 0.3 - fh);
                    ctx.lineTo(fx + 1.5, mouthY + mouthH * 0.3);
                    ctx.fill();
                }
                // Dripping saliva/blood
                if (enemy.type === 'boss' || enemy.type === 'charger') {
                    ctx.strokeStyle = 'rgba(180,0,0,0.5)'; ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(ex - mouthW * 0.3, mouthY + mouthH * 0.3);
                    ctx.lineTo(ex - mouthW * 0.3 + Math.sin(gameTime * 2) * 2, mouthY + mouthH * 0.8);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(ex + mouthW * 0.2, mouthY + mouthH * 0.3);
                    ctx.lineTo(ex + mouthW * 0.2 + Math.sin(gameTime * 2.5) * 2, mouthY + mouthH * 0.7);
                    ctx.stroke();
                }
            } else {
                // Closed mouth - snarling grimace with visible fangs
                ctx.strokeStyle = flashColor ? '#999' : 'rgba(0,0,0,0.7)'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ex - mouthW * 0.9, mouthY + 2);
                ctx.lineTo(ex - mouthW * 0.5, mouthY - 2);
                ctx.lineTo(ex, mouthY + 1);
                ctx.lineTo(ex + mouthW * 0.5, mouthY - 2);
                ctx.lineTo(ex + mouthW * 0.9, mouthY + 2);
                ctx.stroke();
                // Protruding fangs even when mouth closed
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.moveTo(ex - mouthW * 0.35, mouthY); ctx.lineTo(ex - mouthW * 0.35 + 1, mouthY + 4); ctx.lineTo(ex - mouthW * 0.35 - 1, mouthY + 4); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(ex + mouthW * 0.35, mouthY); ctx.lineTo(ex + mouthW * 0.35 + 1, mouthY + 4); ctx.lineTo(ex + mouthW * 0.35 - 1, mouthY + 4); ctx.fill();
            }

            // HP bar
            if ((enemy.type !== 'small' || enemy.hp < enemy.maxHp * 0.8) && enemy.alive) {
                const barW = w * 1.3, barH = 5, barY = ey - h * 0.7 + floatOff;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath(); ctx.roundRect(ex - barW / 2, barY, barW, barH, 2); ctx.fill();
                const hpRatio = enemy.hp / enemy.maxHp;
                const hpGrad = ctx.createLinearGradient(ex - barW / 2, barY, ex - barW / 2 + barW * hpRatio, barY);
                hpGrad.addColorStop(0, hpRatio > 0.5 ? '#ff4444' : '#ff2200');
                hpGrad.addColorStop(1, hpRatio > 0.5 ? '#ff6666' : '#ff4400');
                ctx.fillStyle = hpGrad;
                ctx.beginPath(); ctx.roundRect(ex - barW / 2 + 1, barY + 1, (barW - 2) * hpRatio, barH - 2, 1); ctx.fill();
            }

            // Ghost fireball charge-up warning
            if (enemy.sonicCharging && enemy.alive) {
                const pulse = 0.5 + 0.5 * Math.sin(gameTime * 18);
                ctx.strokeStyle = `rgba(68,255,136,${0.5 + pulse * 0.5})`; ctx.lineWidth = 3;
                ctx.shadowColor = 'rgba(34,204,102,0.8)'; ctx.shadowBlur = 20;
                ctx.beginPath(); ctx.arc(ex, ey, w * 0.9 + pulse * 8, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = `rgba(68,255,136,${0.6 + pulse * 0.4})`;
                ctx.font = 'bold 20px serif'; ctx.textAlign = 'center';
                ctx.fillText('!', ex, ey - h * 0.75 - 5);
                ctx.textAlign = 'start';
            }

            // === Ghost Name Label (鬼怪名字) ===
            if (enemy.ghostName && enemy.alive) {
                const nameY = ey - h * 0.7 - 18 + Math.sin(gameTime * 2 + enemy.floatOffset) * 2;
                const fontSize = enemy.type === 'boss' ? 22 : enemy.type === 'big' ? 18 : 15;
                ctx.font = `bold ${fontSize}px 'STSong','SimSun','KaiTi','楷体',serif`;
                ctx.textAlign = 'center';
                // Dark background for readability
                const nameWidth = ctx.measureText(enemy.ghostName).width;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.roundRect(ex - nameWidth / 2 - 6, nameY - fontSize + 2, nameWidth + 12, fontSize + 6, 4);
                ctx.fill();
                // Name text with color based on type
                if (enemy.type === 'boss') ctx.fillStyle = '#ff4444';
                else if (enemy.type === 'big') ctx.fillStyle = '#ff8844';
                else if (enemy.type === 'flyer') ctx.fillStyle = '#cc66ff';
                else if (enemy.type === 'charger') ctx.fillStyle = '#ffaa33';
                else ctx.fillStyle = '#88ff88';
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6;
                ctx.fillText(enemy.ghostName, ex, nameY);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'start';
            }

            ctx.restore();
        }

        function drawTalisman(t) {
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(t.rotation);
            // Flutter effect - the talisman paper waves as it flies
            const flutter = Math.sin(gameTime * 18 + t.x * 0.1) * 0.15;
            const sz = t.size;
            const tw = sz * 0.55; // talisman half-width
            const th = sz * 0.9;  // talisman half-height

            // Subtle trailing energy wisps (not a ball glow)
            ctx.globalAlpha = 0.35;
            ctx.strokeStyle = '#ffe080';
            ctx.lineWidth = 1.5;
            for (let i = 1; i <= 3; i++) {
                const trailX = -i * 8;
                const trailFlutter = Math.sin(gameTime * 15 + i * 1.5) * (3 + i * 2);
                ctx.beginPath();
                ctx.moveTo(trailX, -th * 0.3 + trailFlutter);
                ctx.quadraticCurveTo(trailX - 6, trailFlutter, trailX - 10 - i * 3, th * 0.2 + trailFlutter);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Small directional glow (elongated, not circular)
            const glowGrad = ctx.createRadialGradient(0, 0, sz * 0.15, 0, 0, sz * 0.7);
            glowGrad.addColorStop(0, 'rgba(255,230,140,0.5)');
            glowGrad.addColorStop(1, 'rgba(255,200,60,0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, sz * 0.9, sz * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // === Talisman paper body ===
            ctx.save();
            ctx.transform(1, flutter, 0, 1, 0, 0);

            // Paper shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(-tw + 2, -th + 2, tw * 2, th * 2);

            // Paper base - aged yellow
            const paperGrad = ctx.createLinearGradient(-tw, -th, tw, th);
            paperGrad.addColorStop(0, '#fef8d8');
            paperGrad.addColorStop(0.3, '#fdf2c0');
            paperGrad.addColorStop(0.7, '#f8e8a0');
            paperGrad.addColorStop(1, '#f0d880');
            ctx.fillStyle = paperGrad;
            ctx.fillRect(-tw, -th, tw * 2, th * 2);

            // Paper border
            ctx.strokeStyle = '#c8a040';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(-tw, -th, tw * 2, th * 2);

            // Inner border line
            ctx.strokeStyle = 'rgba(180,120,40,0.4)';
            ctx.lineWidth = 0.7;
            ctx.strokeRect(-tw + 2.5, -th + 2.5, tw * 2 - 5, th * 2 - 5);

            // === Red cinnabar "敕" character ===
            ctx.fillStyle = '#cc1100';
            ctx.font = `bold ${Math.round(th * 1.4)}px 'STSong','SimSun','KaiTi','楷体','宋体',serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('敕', 0, 0);
            ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

            ctx.restore(); // end flutter transform

            // Leading edge sparks
            const sparkAngle = gameTime * 20;
            ctx.fillStyle = 'rgba(255,240,180,0.8)';
            ctx.beginPath();
            ctx.arc(tw + 3 + Math.cos(sparkAngle) * 2, Math.sin(sparkAngle) * 2, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,200,80,0.6)';
            ctx.beginPath();
            ctx.arc(tw + 1 + Math.cos(sparkAngle + 2) * 3, Math.sin(sparkAngle + 2) * 3, 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawFireball(fb) {
            if (!fb.alive) return;
            ctx.save();
            ctx.translate(fb.x, fb.y);
            const pulse = 0.8 + 0.2 * Math.sin(gameTime * 20);
            const sz = fb.size * pulse;
            // Outer glow
            ctx.shadowColor = 'rgba(255,100,0,0.9)'; ctx.shadowBlur = 30;
            const outerGrad = ctx.createRadialGradient(0, 0, sz * 0.1, 0, 0, sz * 1.8);
            outerGrad.addColorStop(0, 'rgba(255,200,50,0.7)');
            outerGrad.addColorStop(0.4, 'rgba(255,100,0,0.4)');
            outerGrad.addColorStop(1, 'rgba(255,50,0,0)');
            ctx.fillStyle = outerGrad;
            ctx.beginPath(); ctx.arc(0, 0, sz * 1.8, 0, Math.PI * 2); ctx.fill();
            // Core fireball
            const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, sz);
            coreGrad.addColorStop(0, '#ffffcc');
            coreGrad.addColorStop(0.3, '#ffcc00');
            coreGrad.addColorStop(0.6, '#ff6600');
            coreGrad.addColorStop(1, '#cc2200');
            ctx.fillStyle = coreGrad;
            ctx.beginPath(); ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            // Flame wisps trailing
            ctx.globalAlpha = 0.6;
            for (let i = 0; i < 4; i++) {
                const a = gameTime * 8 + i * Math.PI / 2;
                const fx = Math.cos(a) * sz * 0.5;
                const fy = Math.sin(a) * sz * 0.5;
                const flameGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, sz * 0.6);
                flameGrad.addColorStop(0, 'rgba(255,180,50,0.6)');
                flameGrad.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.fillStyle = flameGrad;
                ctx.beginPath(); ctx.arc(fx, fy, sz * 0.6, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function drawGhostFireball(fb) {
            if (!fb.alive) return;
            const pulse = 0.7 + 0.3 * Math.sin(fb.pulsePhase);
            const sz = fb.size * pulse;
            // Outer glow
            const glowGrad = ctx.createRadialGradient(fb.x, fb.y, sz*0.2, fb.x, fb.y, sz*2.5);
            glowGrad.addColorStop(0, 'rgba(68,255,136,0.6)'); glowGrad.addColorStop(0.4, 'rgba(34,204,102,0.3)');
            glowGrad.addColorStop(1, 'rgba(0,100,50,0)');
            ctx.fillStyle = glowGrad; ctx.beginPath(); ctx.arc(fb.x, fb.y, sz*2.5, 0, Math.PI*2); ctx.fill();
            // Core
            const coreGrad = ctx.createRadialGradient(fb.x, fb.y, 0, fb.x, fb.y, sz);
            coreGrad.addColorStop(0, '#ffffff'); coreGrad.addColorStop(0.3, '#aaffcc');
            coreGrad.addColorStop(0.6, '#44ff88'); coreGrad.addColorStop(1, 'rgba(34,204,102,0)');
            ctx.fillStyle = coreGrad; ctx.beginPath(); ctx.arc(fb.x, fb.y, sz, 0, Math.PI*2); ctx.fill();
            // Inner bright spot
            ctx.shadowColor = 'rgba(68,255,136,0.9)'; ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(200,255,220,0.9)'; ctx.beginPath(); ctx.arc(fb.x, fb.y, sz*0.35, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            // Orbiting sparks
            for (let i = 0; i < 3; i++) {
                const angle = fb.pulsePhase * 1.5 + i * Math.PI * 2 / 3;
                const ox = fb.x + Math.cos(angle) * sz * 1.2;
                const oy = fb.y + Math.sin(angle) * sz * 1.2;
                ctx.fillStyle = 'rgba(136,255,200,0.8)'; ctx.beginPath(); ctx.arc(ox, oy, 2.5, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawPhantomRune(rune) {
            if (!rune.alive) return;
            const isCharging = rune.life > 0;
            const progress = isCharging ? 1 - rune.life / rune.chargeTime : 1;
            const detonateProgress = isCharging ? 0 : Math.min(1, -rune.life / 0.5);

            if (isCharging) {
                // Warning phase - pulsing magic circle
                const pulse = 0.5 + 0.5 * Math.sin(gameTime * 15);
                const alpha = 0.3 + progress * 0.5;
                const currentRadius = rune.radius * (0.3 + progress * 0.7);

                // Danger zone fill
                ctx.fillStyle = `rgba(200,30,80,${alpha * 0.15 * pulse})`;
                ctx.beginPath(); ctx.arc(rune.x, rune.y, currentRadius, 0, Math.PI*2); ctx.fill();

                // Outer circle
                ctx.strokeStyle = `rgba(255,50,100,${alpha * pulse})`; ctx.lineWidth = 2 + progress * 2;
                ctx.shadowColor = `rgba(255,30,80,${alpha * 0.8})`; ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(rune.x, rune.y, currentRadius, 0, Math.PI*2); ctx.stroke();

                // Inner rotating rune circle
                ctx.save(); ctx.translate(rune.x, rune.y); ctx.rotate(rune.rotation);
                ctx.strokeStyle = `rgba(200,100,255,${alpha})`; ctx.lineWidth = 1.5;
                ctx.shadowColor = `rgba(180,80,255,${alpha * 0.6})`; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(0, 0, currentRadius * 0.6, 0, Math.PI*2); ctx.stroke();

                // Rune symbols (rotating lines)
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3;
                    ctx.strokeStyle = `rgba(255,100,200,${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * currentRadius * 0.3, Math.sin(a) * currentRadius * 0.3);
                    ctx.lineTo(Math.cos(a) * currentRadius * 0.85, Math.sin(a) * currentRadius * 0.85);
                    ctx.stroke();
                }
                // Star pattern
                ctx.strokeStyle = `rgba(255,180,60,${alpha * 0.7})`; ctx.lineWidth = 1.5;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3;
                    const na = (i + 2) * Math.PI / 3;
                    ctx.moveTo(Math.cos(a) * currentRadius * 0.75, Math.sin(a) * currentRadius * 0.75);
                    ctx.lineTo(Math.cos(na) * currentRadius * 0.75, Math.sin(na) * currentRadius * 0.75);
                }
                ctx.stroke();
                ctx.restore();
                ctx.shadowBlur = 0;

                // Warning "!" icon
                if (progress > 0.3) {
                    ctx.fillStyle = `rgba(255,80,80,${pulse})`; ctx.font = 'bold 22px serif'; ctx.textAlign = 'center';
                    ctx.fillText('⚠', rune.x, rune.y - currentRadius - 8);
                    ctx.textAlign = 'start';
                }
            } else {
                // Detonation phase - bright flash expanding outward
                const expandAlpha = 1 - detonateProgress;
                const expandRadius = rune.radius * (1 + detonateProgress * 0.5);

                // Flash
                const flashGrad = ctx.createRadialGradient(rune.x, rune.y, 0, rune.x, rune.y, expandRadius);
                flashGrad.addColorStop(0, `rgba(255,100,150,${expandAlpha * 0.6})`);
                flashGrad.addColorStop(0.4, `rgba(200,50,200,${expandAlpha * 0.4})`);
                flashGrad.addColorStop(0.8, `rgba(255,80,40,${expandAlpha * 0.2})`);
                flashGrad.addColorStop(1, 'rgba(255,0,0,0)');
                ctx.fillStyle = flashGrad; ctx.beginPath(); ctx.arc(rune.x, rune.y, expandRadius, 0, Math.PI*2); ctx.fill();

                // Bright ring
                ctx.strokeStyle = `rgba(255,200,100,${expandAlpha})`; ctx.lineWidth = 4;
                ctx.shadowColor = `rgba(255,150,50,${expandAlpha})`; ctx.shadowBlur = 25;
                ctx.beginPath(); ctx.arc(rune.x, rune.y, expandRadius * 0.8, 0, Math.PI*2); ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        function drawSmokeCloud(cloud) {
            // Outer warning circle for the cloud's damage area
            const cloudAlpha = Math.min(1, cloud.life / cloud.duration) * 0.35;
            ctx.strokeStyle = `rgba(180,50,220,${cloudAlpha})`; ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath(); ctx.arc(cloud.x, cloud.y, cloud.radius * 0.8, 0, Math.PI*2); ctx.stroke();
            ctx.setLineDash([]);
            cloud.particles.forEach(p => {
                if (p.life <= 0) return;
                const alpha = Math.min(1, p.life / p.maxLife) * 0.65;
                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                grad.addColorStop(0, `rgba(120,40,160,${alpha})`); grad.addColorStop(0.5, `rgba(80,20,120,${alpha*0.6})`);
                grad.addColorStop(1, `rgba(40,10,60,0)`);
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
        }

        function drawPickups() {
            pickups.forEach(p => {
                if (p.collected) return;
                const alpha = p.life < 2 ? p.life / 2 : 1;
                const bob = Math.sin(p.bobPhase) * 4;
                ctx.globalAlpha = alpha;
                const grad = ctx.createRadialGradient(p.x, p.y + bob, 3, p.x, p.y + bob, 14);
                if (p.type === 'hp') { grad.addColorStop(0, '#ff4444'); grad.addColorStop(1, 'rgba(255,0,0,0)'); }
                else if (p.type === 'mp') { grad.addColorStop(0, '#4488ff'); grad.addColorStop(1, 'rgba(0,80,255,0)'); }
                else { grad.addColorStop(0, '#ffaa00'); grad.addColorStop(1, 'rgba(255,150,0,0)'); }
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y + bob, 13, 0, Math.PI*2); ctx.fill();
                // Icon
                ctx.fillStyle = '#fff'; ctx.font = 'bold 12px serif'; ctx.textAlign = 'center';
                ctx.fillText(p.type === 'hp' ? '♥' : p.type === 'mp' ? '◆' : '★', p.x, p.y + bob + 4);
                ctx.textAlign = 'start';
                ctx.globalAlpha = 1;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                const alpha = Math.max(0, p.life / p.maxLife);
                if (p.type === 'spark' || p.type === 'hit') {
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
                } else if (p.type === 'golden') {
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    grad.addColorStop(0, `rgba(255,215,0,${alpha})`); grad.addColorStop(1, `rgba(255,180,0,0)`);
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                } else if (p.type === 'lightning_spark') {
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size*3);
                } else {
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    grad.addColorStop(0, `rgba(255,150,40,${alpha})`); grad.addColorStop(1, `rgba(255,60,10,0)`);
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
            });
            ctx.globalAlpha = 1;
        }

        function drawLightningBolts() {
            lightningBolts.forEach(bolt => {
                const alpha = bolt.life / bolt.maxLife;
                ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = 2.5;
                ctx.shadowColor = `rgba(200,200,255,${alpha})`; ctx.shadowBlur = 14;
                bolt.segments.forEach(seg => { ctx.beginPath(); ctx.moveTo(seg.x1, seg.y1); ctx.lineTo(seg.x2, seg.y2); ctx.stroke(); });
                ctx.strokeStyle = `rgba(255,255,255,${alpha*1.3})`; ctx.lineWidth = 1; ctx.shadowBlur = 6;
                bolt.segments.forEach(seg => { ctx.beginPath(); ctx.moveTo(seg.x1, seg.y1); ctx.lineTo(seg.x2, seg.y2); ctx.stroke(); });
                ctx.shadowBlur = 0;
            });
        }

        function drawLaserBeams() {
            laserBeams.forEach(beam => {
                if (beam.delay > 0) return;
                const alpha = Math.min(1, beam.life / beam.maxLife * 2);
                const pulseW = beam.width * (1 + 0.3 * Math.sin(beam.life * 30));
                // Outer glow
                ctx.save();
                ctx.globalAlpha = alpha * 0.4;
                ctx.strokeStyle = beam.color;
                ctx.lineWidth = pulseW * 3;
                ctx.shadowColor = beam.color;
                ctx.shadowBlur = 25;
                ctx.beginPath(); ctx.moveTo(beam.x1, beam.y1); ctx.lineTo(beam.x2, beam.y2); ctx.stroke();
                // Mid layer
                ctx.globalAlpha = alpha * 0.7;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = pulseW * 1.5;
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.moveTo(beam.x1, beam.y1); ctx.lineTo(beam.x2, beam.y2); ctx.stroke();
                // Core beam (brightest)
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = pulseW * 0.6;
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.moveTo(beam.x1, beam.y1); ctx.lineTo(beam.x2, beam.y2); ctx.stroke();
                ctx.restore();
                // Origin glow (book)
                ctx.save();
                ctx.globalAlpha = alpha * 0.6;
                const originGrad = ctx.createRadialGradient(beam.x1, beam.y1, 0, beam.x1, beam.y1, 20);
                originGrad.addColorStop(0, 'rgba(255,215,0,0.8)');
                originGrad.addColorStop(1, 'rgba(255,215,0,0)');
                ctx.fillStyle = originGrad;
                ctx.fillRect(beam.x1 - 20, beam.y1 - 20, 40, 40);
                // Impact glow at target
                if (beam.hit) {
                    const impGrad = ctx.createRadialGradient(beam.x2, beam.y2, 0, beam.x2, beam.y2, 25);
                    impGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    impGrad.addColorStop(0.5, beam.color === '#ffd700' ? 'rgba(255,215,0,0.4)' : 'rgba(68,221,255,0.4)');
                    impGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = impGrad;
                    ctx.fillRect(beam.x2 - 25, beam.y2 - 25, 50, 50);
                }
                ctx.restore();
            });
        }

        function drawFloatingTexts() {
            floatingTexts.forEach(ft => {
                const alpha = Math.max(0, ft.life / ft.maxLife);
                const sc = 1 + (1 - alpha) * 0.5;
                const r = parseInt(ft.color.slice(1,3),16), g = parseInt(ft.color.slice(3,5),16), b = parseInt(ft.color.slice(5,7),16);
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                const sz = ft.big ? Math.round(24 * sc) : Math.round(16 * sc);
                ctx.font = `bold ${sz}px 'STSong','SimSun','KaiTi',serif`;
                ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 4;
                ctx.fillText(ft.text, ft.x, ft.y); ctx.shadowBlur = 0;
            });
        }

        function drawUI() {
            // Top bar
            const topBarGrad = ctx.createLinearGradient(0, 0, 0, 65);
            topBarGrad.addColorStop(0, 'rgba(15,8,5,0.92)'); topBarGrad.addColorStop(1, 'rgba(15,8,5,0)');
            ctx.fillStyle = topBarGrad; ctx.fillRect(0, 0, GAME_WIDTH, 70);
            ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(20, 62); ctx.lineTo(GAME_WIDTH-20, 62); ctx.stroke();

            // HP bar
            const hpBarX = 30, hpBarY = 10, hpBarW = 220, hpBarH = 18;
            ctx.fillStyle = '#1a0a0a'; ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);
            ctx.strokeStyle = '#6b4020'; ctx.lineWidth = 2; ctx.strokeRect(hpBarX, hpBarY, hpBarW, hpBarH);
            const hpRatio = player.hp / player.maxHp;
            const hpGrad = ctx.createLinearGradient(0, hpBarY, 0, hpBarY+hpBarH);
            hpGrad.addColorStop(0, '#e83020'); hpGrad.addColorStop(0.5, '#d42018'); hpGrad.addColorStop(1, '#8b1008');
            ctx.fillStyle = hpGrad; ctx.fillRect(hpBarX+2, hpBarY+2, (hpBarW-4)*hpRatio, hpBarH-4);
            ctx.fillStyle = '#f5e0c0'; ctx.font = 'bold 12px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'center';
            ctx.fillText(`生命 ${Math.ceil(player.hp)}/${player.maxHp}`, hpBarX+hpBarW/2, hpBarY+13);

            // MP bar
            const mpBarX = 270, mpBarY = 10, mpBarW = 180, mpBarH = 18;
            ctx.fillStyle = '#1a0a0a'; ctx.fillRect(mpBarX, mpBarY, mpBarW, mpBarH);
            ctx.strokeStyle = '#3a5a8b'; ctx.lineWidth = 2; ctx.strokeRect(mpBarX, mpBarY, mpBarW, mpBarH);
            const mpRatio = player.mp / player.maxMp;
            const mpGrad = ctx.createLinearGradient(0, mpBarY, 0, mpBarY+mpBarH);
            mpGrad.addColorStop(0, '#4080e0'); mpGrad.addColorStop(0.5, '#3068c0'); mpGrad.addColorStop(1, '#1a3a70');
            ctx.fillStyle = mpGrad; ctx.fillRect(mpBarX+2, mpBarY+2, (mpBarW-4)*mpRatio, mpBarH-4);
            ctx.fillStyle = '#c8d8f0'; ctx.font = 'bold 12px "STSong","SimSun","KaiTi",serif';
            ctx.fillText(`法力 ${Math.ceil(player.mp)}/${player.maxMp}`, mpBarX+mpBarW/2, mpBarY+13);

            // XP bar
            const xpBarX = 30, xpBarY = 32, xpBarW = 420, xpBarH = 8;
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(xpBarX, xpBarY, xpBarW, xpBarH);
            ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(xpBarX, xpBarY, xpBarW, xpBarH);
            const xpRatio = playerXP / xpToNext;
            ctx.fillStyle = '#aaffaa'; ctx.fillRect(xpBarX+1, xpBarY+1, (xpBarW-2)*xpRatio, xpBarH-2);
            ctx.fillStyle = '#aaffaa'; ctx.font = '10px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'left';
            ctx.fillText(`Lv.${playerLevel}`, xpBarX + xpBarW + 8, xpBarY + 8);

            ctx.textAlign = 'start';

            // Score & wave
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 20px "STSong","SimSun","KaiTi",serif';
            ctx.fillText(`功德: ${Math.floor(score)}`, GAME_WIDTH - 320, 28);
            ctx.fillStyle = '#ddc080'; ctx.font = '14px "STSong","SimSun","KaiTi",serif';
            ctx.fillText(getWaveName(waveNumber), GAME_WIDTH - 120, 20);
            ctx.fillStyle = '#aa8866'; ctx.font = '12px "STSong","SimSun","KaiTi",serif';
            ctx.fillText(`场上: ${enemies.length}只`, GAME_WIDTH - 120, 38);

            // Combo
            if (comboCount >= 3) {
                const comboAlpha = Math.min(1, comboTimer / 0.6);
                ctx.fillStyle = `rgba(255,150,30,${comboAlpha})`;
                ctx.font = `bold ${18+comboCount*2}px "STSong","SimSun","KaiTi",serif`;
                ctx.fillText(`${comboCount}连击`, GAME_WIDTH - 320, 54);
            }

            // Controls hint
            ctx.fillStyle = 'rgba(200,170,120,0.5)'; ctx.font = '11px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'center';
            ctx.fillText('', GAME_WIDTH/2, GAME_HEIGHT-8);
            ctx.textAlign = 'start';
            // Credit
            ctx.fillStyle = 'rgba(200,170,120,0.6)'; ctx.font = '12px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'right';
            ctx.fillText('制作者：九圩中学吴胜闯老师', GAME_WIDTH - 20, GAME_HEIGHT - 22);
            ctx.textAlign = 'start';

            // Wave announcement
            if (waveAnnounceTimer > 0) {
                const alpha = waveAnnounceTimer > 2 ? (2.5-waveAnnounceTimer)*2 : Math.min(1, waveAnnounceTimer/1.5);
                ctx.fillStyle = `rgba(255,200,100,${alpha})`; ctx.font = `bold 42px 'STSong','SimSun','KaiTi',serif`;
                ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(200,100,0,0.6)'; ctx.shadowBlur = 20;
                ctx.fillText(waveAnnounceText, GAME_WIDTH/2, GAME_HEIGHT/2 - 80);
                ctx.shadowBlur = 0; ctx.textAlign = 'start';
            }

            // Edge warnings for off-screen enemies
            enemies.forEach(en => {
                if (!en.alive) return;
                const margin = 40;
                if (en.x < margin || en.x > GAME_WIDTH - margin || en.y < margin || en.y > GAME_HEIGHT - margin) {
                    const dx = en.x - player.x, dy = en.y - player.y;
                    const angle = Math.atan2(dy, dx);
                    const edgeX = Math.max(50, Math.min(GAME_WIDTH-50, player.x + Math.cos(angle) * 280));
                    const edgeY = Math.max(50, Math.min(GAME_HEIGHT-50, player.y + Math.sin(angle) * 200));
                    // Draw arrow pointing toward enemy
                    ctx.save(); ctx.translate(edgeX, edgeY); ctx.rotate(angle);
                    ctx.fillStyle = 'rgba(255,60,60,0.7)';
                    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
                    ctx.restore();
                }
            });

            // Grace period indicator
            if (graceTimer > 0) {
                ctx.fillStyle = 'rgba(100,200,255,0.8)'; ctx.font = 'bold 18px "STSong","SimSun","KaiTi",serif';
                ctx.textAlign = 'center';
                ctx.fillText(`道法护身 ${Math.ceil(graceTimer)}s`, GAME_WIDTH/2, 100);
                ctx.textAlign = 'start';
            }
        }

        function drawCursorTrail() {
            const grad = ctx.createRadialGradient(mouseX, mouseY, 2, mouseX, mouseY, 14);
            grad.addColorStop(0, 'rgba(255,220,150,0.5)'); grad.addColorStop(1, 'rgba(255,180,100,0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(mouseX, mouseY, 13, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,200,120,0.4)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(mouseX, mouseY, 7, 0, Math.PI*2); ctx.stroke();
        }

        // === MENU SCREEN ===
        function drawMenuScreen() {
            drawBackground();
            // Dim
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            // Title
            const titleY = 200 + Math.sin(menuAnimTimer * 1.5) * 8;
            ctx.shadowColor = 'rgba(200,100,0,0.8)'; ctx.shadowBlur = 30;
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 64px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'center';
            ctx.fillText('降魔记', GAME_WIDTH/2, titleY);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#cc9944'; ctx.font = '22px "STSong","SimSun","KaiTi",serif';
            ctx.fillText('暴打鬼怪', GAME_WIDTH/2, titleY + 45);
            // High score
            if (highScore > 0) {
                ctx.fillStyle = '#aa8866'; ctx.font = '16px "STSong","SimSun","KaiTi",serif';
                ctx.fillText(`最高分: ${highScore}`, GAME_WIDTH/2, titleY + 85);
            }
            // Credit on menu
            ctx.fillStyle = 'rgba(200,170,120,0.6)'; ctx.font = '14px "STSong","SimSun","KaiTi",serif';
            ctx.fillText('制作者：九圩中学吴胜闯老师', GAME_WIDTH/2, GAME_HEIGHT - 30);
            ctx.textAlign = 'start';
        }

        // === LEVEL UP SCREEN ===
        function drawLevelUpScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 36px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(200,150,0,0.6)'; ctx.shadowBlur = 15;
            ctx.fillText(`修为提升! Lv.${playerLevel}`, GAME_WIDTH/2, GAME_HEIGHT/2 - 120);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ddc080'; ctx.font = '16px "STSong","SimSun","KaiTi",serif';
            ctx.fillText('选择一项能力提升 (按1/2/3或点击)', GAME_WIDTH/2, GAME_HEIGHT/2 - 80);
            const cardW = 200, cardH = 160, gap = 30;
            const totalW = upgradeChoices.length * cardW + (upgradeChoices.length - 1) * gap;
            const startX = GAME_WIDTH/2 - totalW/2;
            const cardY = GAME_HEIGHT/2 - cardH/2 + 20;
            upgradeChoices.forEach((up, i) => {
                const cx = startX + i * (cardW + gap);
                const hover = mouseX >= cx && mouseX <= cx + cardW && mouseY >= cardY && mouseY <= cardY + cardH;
                ctx.fillStyle = hover ? 'rgba(60,40,20,0.95)' : 'rgba(30,20,10,0.9)';
                ctx.fillRect(cx, cardY, cardW, cardH);
                ctx.strokeStyle = hover ? '#ffd700' : '#8b6914'; ctx.lineWidth = hover ? 3 : 2;
                ctx.strokeRect(cx, cardY, cardW, cardH);
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold 30px serif';
                ctx.fillText(up.icon, cx + cardW/2, cardY + 45);
                ctx.fillStyle = '#f0d090'; ctx.font = 'bold 18px "STSong","SimSun","KaiTi",serif';
                ctx.fillText(up.name, cx + cardW/2, cardY + 80);
                ctx.fillStyle = '#c0a060'; ctx.font = '14px "STSong","SimSun","KaiTi",serif';
                ctx.fillText(up.desc, cx + cardW/2, cardY + 110);
                ctx.fillStyle = '#887755'; ctx.font = '12px serif';
                ctx.fillText(`[${i+1}]`, cx + cardW/2, cardY + 145);
            });
            ctx.textAlign = 'start';
        }

        // === PAUSE SCREEN ===
        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 48px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'center';
            ctx.fillText('暂停', GAME_WIDTH/2, GAME_HEIGHT/2 - 20);
            ctx.fillStyle = '#aa8866'; ctx.font = '18px "STSong","SimSun","KaiTi",serif';
            ctx.fillText('按 P 或 Esc 继续', GAME_WIDTH/2, GAME_HEIGHT/2 + 25);
            ctx.textAlign = 'start';
        }

        // === GAME OVER SCREEN ===
        function drawGameOverScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            const panelW = 500, panelH = 420, panelX = GAME_WIDTH/2-panelW/2, panelY = GAME_HEIGHT/2-panelH/2;
            const panelGrad = ctx.createLinearGradient(panelX, panelY, panelX, panelY+panelH);
            panelGrad.addColorStop(0, '#1a1010'); panelGrad.addColorStop(1, '#0d0808');
            ctx.fillStyle = panelGrad; ctx.fillRect(panelX, panelY, panelW, panelH);
            ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 3; ctx.strokeRect(panelX, panelY, panelW, panelH);
            ctx.strokeStyle = '#d4a840'; ctx.lineWidth = 1; ctx.strokeRect(panelX+6, panelY+6, panelW-12, panelH-12);
            ctx.fillStyle = '#ff4444'; ctx.font = 'bold 36px "STSong","SimSun","KaiTi",serif'; ctx.textAlign = 'center';
            ctx.fillText('道 陨', GAME_WIDTH/2, panelY + 50);
            ctx.fillStyle = '#ffcc44'; ctx.font = 'bold 22px "STSong","SimSun","KaiTi",serif';
            ctx.fillText(`你倒在了${getWaveName(waveNumber)}`, GAME_WIDTH/2, panelY + 90);
            ctx.fillStyle = '#e0d0b0'; ctx.font = '18px "STSong","SimSun","KaiTi",serif';
            ctx.fillText(`总能力: ${Math.floor(score)}`, GAME_WIDTH/2, panelY + 130);
            ctx.fillText(`最高除鬼数: ${highScore}`, GAME_WIDTH/2, panelY + 160);
            ctx.fillText(`最大连击: ${maxCombo}`, GAME_WIDTH/2, panelY + 190);
            ctx.fillText(`消灭鬼怪: ${totalKills}只`, GAME_WIDTH/2, panelY + 220);
            ctx.fillText(`当前关卡: ${getWaveName(waveNumber)}`, GAME_WIDTH/2, panelY + 250);
            ctx.fillText(`学生等级: Lv.${playerLevel}`, GAME_WIDTH/2, panelY + 280);
            ctx.fillText(`存活时间: ${Math.floor(gameTime)}秒`, GAME_WIDTH/2, panelY + 310);
            // New record
            if (score >= highScore && score > 0) {
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px "STSong","SimSun","KaiTi",serif';
                ctx.fillText('★ 新纪录! ★', GAME_WIDTH/2, panelY + 330);
            }
            const btnX = GAME_WIDTH/2-90, btnY = panelY + 350, btnW = 180, btnH = 45;
            const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY+btnH);
            btnGrad.addColorStop(0, '#8b2020'); btnGrad.addColorStop(1, '#5a1010');
            ctx.fillStyle = btnGrad; ctx.fillRect(btnX, btnY, btnW, btnH);
            ctx.strokeStyle = '#d4a840'; ctx.lineWidth = 2; ctx.strokeRect(btnX, btnY, btnW, btnH);
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 20px "STSong","SimSun","KaiTi",serif';
            ctx.fillText('重新修炼', GAME_WIDTH/2, btnY + 30);
            ctx.textAlign = 'start';
        }

        // === MAIN RENDER ===
        function render() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            if (gameState === 'menu') { drawMenuScreen(); return; }
            ctx.save(); ctx.translate(screenShakeX, screenShakeY);
            drawBackground();
            smokeClouds.forEach(drawSmokeCloud);
            ghostFireballs.forEach(drawGhostFireball);
            phantomRunes.forEach(drawPhantomRune);
            drawPickups();
            enemies.forEach(drawEnemy);
            drawPlayer();
            talismans.forEach(drawTalisman);
            fireballs.forEach(drawFireball);
            drawParticles();
            drawLightningBolts();
            drawLaserBeams();
            drawFloatingTexts();
            if (flashAlpha > 0) { ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`; ctx.fillRect(-20,-20,GAME_WIDTH+40,GAME_HEIGHT+40); }
            ctx.restore();
            drawCursorTrail();
            drawUI();
            if (gameState === 'levelup') drawLevelUpScreen();
            if (gameState === 'paused') drawPauseScreen();
            if (gameState === 'gameover') drawGameOverScreen();
        }

        // === GAME LOOP (固定60FPS逻辑更新) ===
        let lastTime = performance.now();
        const FIXED_DT = 1 / 60; // 固定16.67ms一次逻辑更新
        let accumulator = 0;

        function gameLoop(timestamp) {
            let frameDt = (timestamp - lastTime) / 1000;
            if (frameDt <= 0) frameDt = FIXED_DT;
            if (frameDt > 0.2) frameDt = 0.2; // 防止长时间挂起后的跳帧
            lastTime = timestamp;

            // Pause toggle
            if (keys['p'] || keys['escape']) {
                keys['p'] = false; keys['escape'] = false;
                const pauseBtn = document.getElementById('touch-pause');
                if (gameState === 'playing') { gameState = 'paused'; pauseBtn.textContent = '继续'; }
                else if (gameState === 'paused') { gameState = 'playing'; pauseBtn.textContent = '暂停'; }
            }
            // Menu click - disabled, using HTML button instead
            // if (gameState === 'menu' && mouseClicked) { mouseClicked = false; resetGame(); ensureAudio(); }

            // 累积时间，按固定步长更新逻辑，确保所有刷新率下体验一致
            if (!quizActive) {
                accumulator += frameDt;
                while (accumulator >= FIXED_DT) {
                    update(FIXED_DT);
                    accumulator -= FIXED_DT;
                }
            }

            render(); updateSkillUI();
            requestAnimationFrame(gameLoop);
        }

        function updateSkillUI() {
            if (gameState !== 'playing' && gameState !== 'paused') return;
            const qBtn = document.getElementById('touch-q');
            const eBtn = document.getElementById('touch-e');
            const rBtn = document.getElementById('touch-r');
            const shiftBtn = document.getElementById('touch-shift');
            const atkBtn = document.getElementById('touch-attack');
            function setReady(el, ready) {
                if (ready) {
                    el.style.background = 'rgba(255,215,0,0.7)';
                    el.style.borderColor = '#ffd700';
                    el.style.color = '#000';
                    el.style.textShadow = '0 0 8px #ffd700';
                } else {
                    el.style.background = '';
                    el.style.borderColor = '';
                    el.style.color = '';
                    el.style.textShadow = '';
                }
            }
            setReady(qBtn, skills.q.cooldown <= 0 && player.mp >= skills.q.cost);
            setReady(eBtn, skills.e.cooldown <= 0 && player.mp >= skills.e.cost);
            setReady(rBtn, skills.r.cooldown <= 0 && player.mp >= skills.r.cost);
            setReady(shiftBtn, skills.dash.cooldown <= 0 && !player.dashing);
            setReady(atkBtn, player.attackCooldown <= 0);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState === 'playing') gameState = 'paused';
            if (!document.hidden) lastTime = performance.now();
        });

        // Start
        requestAnimationFrame(gameLoop);
    })();
