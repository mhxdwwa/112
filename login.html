<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>宠物世界 - 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #ffe6dd, #ffd4e8, #ffe0f0);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  padding: 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(255, 180, 160, 0.3);
}
.login-title {
  text-align: center;
  font-size: 28px;
  color: #c04058;
  margin-bottom: 30px;
  font-weight: 700;
}
.tab-container {
  display: flex;
  margin-bottom: 30px;
  border-bottom: 2px solid #f0d8cc;
}
.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  color: #886;
  transition: all 0.3s;
}
.tab.active {
  color: #c04058;
  border-bottom: 3px solid #c04058;
  margin-bottom: -2px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #6a4040;
  font-weight: 600;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e0d0c8;
  border-radius: 12px;
  font-size: 15px;
  transition: border-color 0.3s;
}
.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: #c04058;
}
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-primary {
  background: linear-gradient(135deg, #e8637a, #f5a054);
  color: white;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255, 150, 130, 0.4);
}
.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.error-msg {
  color: #e8637a;
  font-size: 13px;
  margin-top: 8px;
  display: none;
}
.error-msg.show {
  display: block;
}
.hidden {
  display: none !important;
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-title">🍭 宠物世界 🍭</div>
  
  <div class="tab-container">
    <div class="tab active" onclick="switchTab('teacher', event)">老师登录</div>
    <div class="tab" onclick="switchTab('student', event)">学生登录</div>
  </div>

  <!-- 老师登录表单 -->
  <form id="teacherForm" onsubmit="handleTeacherLogin(event)">
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="teacherEmail" required placeholder="请输入邮箱">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="teacherPassword" required placeholder="请输入密码">
    </div>
    <div class="error-msg" id="teacherError"></div>
    <button type="submit" class="btn btn-primary">登录</button>
    <button type="button" class="btn" onclick="showQRLogin()" style="background:linear-gradient(135deg,#52c41a,#389e0d);color:white;margin-top:10px;">📱 扫码登录</button>
    <div style="text-align: center; margin-top: 15px; font-size: 14px; color: #886;">
      还没有账号？<a href="javascript:void(0)" onclick="showRegister('teacher')" style="color: #c04058;">立即注册</a>
    </div>
  </form>

  <!-- 扫码登录弹窗 -->
  <div id="qrModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:24px;padding:32px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <div style="font-size:22px;font-weight:700;color:#c04058;margin-bottom:16px;">📱 扫码登录</div>
      <div style="font-size:13px;color:#888;margin-bottom:16px;line-height:1.6;">
        请使用手机QQ扫描二维码<br>并在弹出的页面中确认登录
      </div>
      <div id="qrCodeWrap" style="display:inline-block;padding:16px;background:#fff;border:2px solid #f0d0c8;border-radius:16px;margin-bottom:16px;"></div>
      <div id="qrStatus" style="font-size:14px;color:#d4a017;margin-bottom:12px;">等待扫码...</div>
      <div style="display:flex;gap:8px;">
        <button onclick="refreshQR()" style="flex:1;padding:10px;border:none;border-radius:10px;background:#f0f0f0;color:#666;font-size:14px;font-weight:600;cursor:pointer;">🔄 刷新</button>
        <button onclick="closeQRModal()" style="flex:1;padding:10px;border:none;border-radius:10px;background:#ffe0e0;color:#c04058;font-size:14px;font-weight:600;cursor:pointer;">关闭</button>
      </div>
    </div>
  </div>

  <!-- 老师注册表单 -->
  <form id="teacherRegisterForm" class="hidden" onsubmit="handleTeacherRegister(event)">
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="regTeacherEmail" required placeholder="请输入邮箱">
    </div>
    <div class="form-group">
      <label>密码（至少6位）</label>
      <input type="password" id="regTeacherPassword" required minlength="6" placeholder="请输入密码">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" id="regTeacherPassword2" required minlength="6" placeholder="再次输入密码">
    </div>
    <div class="error-msg" id="teacherRegError"></div>
    <button type="submit" class="btn btn-primary">注册</button>
    <div style="text-align: center; margin-top: 15px; font-size: 14px; color: #886;">
      已有账号？<a href="javascript:void(0)" onclick="showLogin('teacher')" style="color: #c04058;">返回登录</a>
    </div>
  </form>

  <!-- 学生登录表单 -->
  <form id="studentForm" class="hidden" onsubmit="handleStudentLogin(event)">
    <div class="form-group">
      <label>班级名称</label>
      <input type="text" id="studentClass" required placeholder="请输入班级名称" list="classSuggestions" autocomplete="off">
      <datalist id="classSuggestions"></datalist>
      <div style="margin-top:6px;"><a href="javascript:void(0)" onclick="showClassListModal('studentClass')" style="font-size:12px;color:#c04058;">📋 查看可用班级</a></div>
    </div>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="studentName" required placeholder="请输入姓名">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="studentPassword" required placeholder="请输入密码">
    </div>
    <div class="error-msg" id="studentError"></div>
    <button type="submit" class="btn btn-primary">登录</button>
    <div style="text-align: center; margin-top: 15px; font-size: 14px; color: #886;">
      第一次登录？<a href="javascript:void(0)" onclick="showRegister('student')" style="color: #c04058;">设置密码</a>
    </div>
  </form>

  <!-- 学生注册表单 -->
  <form id="studentRegisterForm" class="hidden" onsubmit="handleStudentRegister(event)">
    <div class="form-group">
      <label>班级名称</label>
      <input type="text" id="regStudentClass" required placeholder="请输入班级名称" list="classSuggestions" autocomplete="off">
      <div style="margin-top:6px;"><a href="javascript:void(0)" onclick="showClassListModal('regStudentClass')" style="font-size:12px;color:#c04058;">📋 查看可用班级</a></div>
    </div>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="regStudentName" required placeholder="请输入姓名">
    </div>
    <div class="form-group">
      <label>设置密码（至少6位）</label>
      <input type="password" id="regStudentPassword" required minlength="6" placeholder="请输入密码">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" id="regStudentPassword2" required minlength="6" placeholder="再次输入密码">
    </div>
    <div class="error-msg" id="studentRegError"></div>
    <button type="submit" class="btn btn-primary">注册并登录</button>
    <div style="text-align: center; margin-top: 15px; font-size: 14px; color: #886;">
      已有密码？<a href="javascript:void(0)" onclick="showLogin('student')" style="color: #c04058;">返回登录</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="login.js?v=7"></script>
</body>
</html>
