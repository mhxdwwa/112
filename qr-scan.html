<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261026">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=20261026">
  <link rel="apple-touch-icon" href="/icon-180.png?v=20261026">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>扫码登录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
body.petworld {
  background: linear-gradient(135deg, #ffe6dd, #ffd4e8, #ffe0f0);
}
body.xueqinguanjia {
  background: linear-gradient(135deg, #e0f2fe, #dbeafe, #eff6ff);
}
.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  padding: 36px 28px;
  width: 100%;
  max-width: 400px;
  text-align: center;
}
body.petworld .container {
  box-shadow: 0 20px 60px rgba(255, 180, 160, 0.3);
}
body.xueqinguanjia .container {
  box-shadow: 0 20px 60px rgba(59, 130, 246, 0.15);
}
.icon { font-size: 56px; margin-bottom: 16px; }
.title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 16px;
}
body.petworld .title { color: #c04058; }
body.xueqinguanjia .title { color: #2563eb; }
.msg {
  font-size: 14px;
  color: #666;
  line-height: 1.8;
  margin-bottom: 24px;
}
body.petworld .msg strong { color: #c04058; }
body.xueqinguanjia .msg strong { color: #2563eb; }
.status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  font-size: 14px;
  display: none;
}
.status.success {
  display: block;
  background: #f0fff0;
  color: #389e0d;
  border: 1px solid #90ee90;
}
.status.error {
  display: block;
  background: #fff5f5;
  color: #e74c3c;
  border: 1px solid #ffb0b0;
}
.status.loading {
  display: block;
  background: #fffbe6;
  color: #d4a017;
  border: 1px solid #ffd080;
}
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid #ffd080;
  border-top-color: #d4a017;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container" id="mainContainer">
  <div class="icon">🔐</div>
  <div class="title" id="pageTitle">扫码登录确认</div>
  <div class="msg" id="statusMsg">
    <span class="spinner"></span> 正在检查登录状态...
  </div>

  <div class="status" id="resultStatus"></div>
</div>

<script>
// Supabase 配置
var SUPABASE_URL = 'https://xbygooadskfqllnhwmet.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieWdvb2Fkc2tmcWxsbmh3bWV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NjU0NDgsImV4cCI6MjA5ODU0MTQ0OH0.ryfpesmsFqBnaJurlMhjEJOWxZV4oFg3NBu7kQD8EKA';

var db;
var qrToken = '';
var userEmail = '';

/* 扫码票据接口：走网站自己的 /api/qr，手机和电脑都不再直连 Supabase */
function qrTicket(path, body) {
  return fetch('/api/qr/' + path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body || {})
  }).then(function (r) { return r.json(); });
}
var appName = 'petworld'; // 默认宠物世界
var appTitle = '宠物世界';

// 初始化
(async function init() {
  // 0. 检测应用类型
  var params = new URLSearchParams(window.location.search);
  appName = params.get('app') || 'petworld';
  appTitle = appName === 'xq' ? '学勤管家' : '宠物世界';
  
  // 设置页面样式和标题
  document.body.className = appName === 'xq' ? 'xueqinguanjia' : 'petworld';
  document.title = '扫码登录 - ' + appTitle;
  document.getElementById('pageTitle').textContent = appTitle + ' 扫码登录确认';
  
  // 1. 初始化 Supabase（使用独立 storageKey，避免拾取已有的登录 session）
  try {
    if (window.supabase && window.supabase.createClient) {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          storageKey: 'qr-scan-page-auth'  // 独立 key，确保是真正的匿名客户端
        }
      });
      console.log('[扫码] Supabase connected (匿名客户端)');
    } else {
      showError('Supabase SDK 未加载，请检查网络后刷新页面');
      return;
    }
  } catch (e) {
    console.error('[扫码] Supabase init error:', e);
    showError('数据库连接失败: ' + e.message);
    return;
  }

  // 2. 从URL提取token
  qrToken = params.get('token');
  if (!qrToken) {
    showError('二维码链接无效：缺少token参数');
    return;
  }
  console.log('[扫码] Token:', qrToken.substring(0, 20) + '...');
  console.log('[扫码] App:', appName, appTitle);

  // 3. 检查用户是否已登录（根据应用类型使用不同的 localStorage key）
  var userType, userId;
  if (appName === 'xq') {
    // 学勤管家 - 检查 xq_session（正常登录保存的位置）
    var xqSession = localStorage.getItem('xq_session');
    if (xqSession) {
      try {
        var sessionData = JSON.parse(xqSession);
        if (sessionData.user && sessionData.user.teacherId) {
          userType = 'teacher';
          userId = sessionData.user.teacherId;
          // teacherId 实际上是教师姓名，用作 email 字段
          userEmail = sessionData.user.teacherId;
        }
      } catch (e) {
        console.error('[扫码] 解析 xq_session 失败:', e);
      }
    }
    // 兼容旧的 xq_current_user（QR 登录保存的位置）
    if (!userType) {
      var xqUser = localStorage.getItem('xq_current_user');
      if (xqUser) {
        try {
          var userData = JSON.parse(xqUser);
          userType = 'teacher';
          userId = userData.teacherId;
          userEmail = userData.teacherId || userData.email || '';
        } catch (e) {
          console.error('[扫码] 解析 xq_current_user 失败:', e);
        }
      }
    }
  } else {
    // 宠物世界
    userType = localStorage.getItem('userType');
    userId = localStorage.getItem('userId');
    userEmail = localStorage.getItem('userEmail') || '';
  }

  if (userType !== 'teacher' || !userId || !userEmail) {
    // 未登录，保存扫码信息后跳转到主应用登录
    sessionStorage.setItem('xq_pending_qr_token', qrToken);
    sessionStorage.setItem('xq_pending_qr_app', appName);
    var mainAppUrl = appName === 'xq' ? 'xueqinguanjia.html' : 'index.html';
    document.getElementById('statusMsg').innerHTML =
      '正在跳转到登录页面...<br><br><span style="font-size:12px;color:#999;">请先登录，登录后将自动完成扫码确认</span>';
    setTimeout(function() {
      window.location.href = mainAppUrl;
    }, 1500);
    return;
  }

  // 4. 检查票据是否有效（走自己域名的 /api/qr，教室网络也能用）
  try {
    console.log('[扫码] 查询票据 token=' + qrToken);
    var tokenRes = await qrTicket('get', { token: qrToken });
    if (!tokenRes || !tokenRes.ok) {
      showError('查询失败，请稍后重试');
      return;
    }
    if (tokenRes.status === 'gone') {
      showError('二维码已失效，请在电脑端刷新二维码');
      return;
    }
    if (tokenRes.status === 'expired') {
      showError('二维码已过期，请在电脑端刷新二维码');
      return;
    }
    if (tokenRes.status === 'verified') {
      showError('该二维码已被使用，请在电脑端刷新二维码');
      return;
    }

    // 5. 已登录用户直接确认登录（名字+密码已验证过，无需再次确认）
    document.getElementById('statusMsg').innerHTML = '正在登录 <b>' + escapeHtml(userEmail) + '</b> ...';
    handleConfirm();

  } catch (e) {
    console.error('[扫码] Token check error:', e);
    showError('检查二维码失败: ' + e.message);
  }
})();

// 确认登录（已登录用户自动调用，无需手动确认）
async function handleConfirm() {
  var resultStatus = document.getElementById('resultStatus');
  resultStatus.className = 'status loading';
  resultStatus.innerHTML = '<span class="spinner"></span> 正在确认登录...';

  try {
    // 确认登录：走自己域名的 /api/qr（不直连 Supabase，教室网络也能用）
    var putRes = await qrTicket('put', { token: qrToken, payload: { email: userEmail } });
    if (!putRes || !putRes.ok) {
      var why = (putRes && putRes.reason === 'expired') ? '二维码已过期，请在电脑端刷新二维码'
              : (putRes && putRes.reason === 'used') ? '这个二维码已经用过了，请在电脑端刷新'
              : (putRes && putRes.reason === 'gone') ? '二维码无效，请在电脑端重新生成'
              : '确认失败，请重试';
      throw new Error(why);
    }

    resultStatus.className = 'status success';
    resultStatus.innerHTML = '✅ 登录成功！<br><span style="font-size:12px;color:#888;">电脑端将自动进入' + appTitle + '教师账户</span>';
    document.getElementById('statusMsg').innerHTML = '操作完成，正在返回...';

    // 1.5 秒后跳转回主应用
    setTimeout(function() {
      var mainAppUrl = appName === 'xq' ? 'xueqinguanjia.html' : 'index.html';
      window.location.href = mainAppUrl;
    }, 1500);

  } catch (e) {
    console.error('[扫码] 确认登录失败:', e);
    resultStatus.className = 'status error';
    resultStatus.innerHTML = '❌ 确认失败: ' + (e.message || '未知错误');
    document.getElementById('statusMsg').innerHTML = '请关闭页面后重试';
  }
}

// 显示错误
function showError(msg) {
  document.getElementById('statusMsg').innerHTML = msg;
  document.getElementById('statusMsg').style.color = '#e74c3c';
}

// HTML转义
function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}
</script>
</body>
</html>
