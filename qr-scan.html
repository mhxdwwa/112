<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>扫码登录 - 宠物世界</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #ffe6dd, #ffd4e8, #ffe0f0);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  padding: 36px 28px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(255, 180, 160, 0.3);
  text-align: center;
}
.icon { font-size: 56px; margin-bottom: 16px; }
.title {
  font-size: 22px;
  color: #c04058;
  font-weight: 700;
  margin-bottom: 16px;
}
.msg {
  font-size: 14px;
  color: #666;
  line-height: 1.8;
  margin-bottom: 24px;
}
.msg strong { color: #c04058; }
.btn-row { display: flex; gap: 12px; }
.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-cancel {
  background: #f0f0f0;
  color: #666;
}
.btn-cancel:hover { background: #e0e0e0; }
.btn-confirm {
  background: linear-gradient(135deg, #52c41a, #389e0d);
  color: white;
  box-shadow: 0 4px 12px rgba(82, 196, 26, 0.3);
}
.btn-confirm:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(82, 196, 26, 0.4);
}
.btn-confirm:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}
.status {
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  font-size: 14px;
  display: none;
}
.status.success {
  display: block;
  background: #f0fff0;
  color: #389e0d;
  border: 1px solid #90ee90;
}
.status.error {
  display: block;
  background: #fff5f5;
  color: #e74c3c;
  border: 1px solid #ffb0b0;
}
.status.loading {
  display: block;
  background: #fffbe6;
  color: #d4a017;
  border: 1px solid #ffd080;
}
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid #ffd080;
  border-top-color: #d4a017;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container" id="mainContainer">
  <div class="icon">🔐</div>
  <div class="title">扫码登录确认</div>
  <div class="msg" id="statusMsg">
    <span class="spinner"></span> 正在检查登录状态...
  </div>
  <div class="btn-row" id="btnRow" style="display:none;">
    <button class="btn btn-cancel" onclick="handleCancel()">取消</button>
    <button class="btn btn-confirm" id="confirmBtn" onclick="handleConfirm()">确认登录</button>
  </div>
  <div class="status" id="resultStatus"></div>
</div>

<script>
// Supabase 配置
var SUPABASE_URL = 'https://xbygooadskfqllnhwmet.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieWdvb2Fkc2tmcWxsbmh3bWV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NjU0NDgsImV4cCI6MjA5ODU0MTQ0OH0.ryfpesmsFqBnaJurlMhjEJOWxZV4oFg3NBu7kQD8EKA';

var db;
var qrToken = '';
var userEmail = '';

// 初始化
(async function init() {
  // 1. 初始化 Supabase
  try {
    if (window.supabase && window.supabase.createClient) {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('[扫码] Supabase connected');
    } else {
      showError('Supabase SDK 未加载，请检查网络后刷新页面');
      return;
    }
  } catch (e) {
    console.error('[扫码] Supabase init error:', e);
    showError('数据库连接失败: ' + e.message);
    return;
  }

  // 2. 从URL提取token
  var params = new URLSearchParams(window.location.search);
  qrToken = params.get('token');
  if (!qrToken) {
    showError('二维码链接无效：缺少token参数');
    return;
  }
  console.log('[扫码] Token:', qrToken.substring(0, 20) + '...');

  // 3. 检查用户是否已登录（教师）
  var userType = localStorage.getItem('userType');
  var userId = localStorage.getItem('userId');
  userEmail = localStorage.getItem('userEmail') || '';

  if (userType !== 'teacher' || !userId || !userEmail) {
    showError('请先在手机上以教师身份登录宠物世界，然后再扫码');
    return;
  }

  // 4. 验证 Supabase session
  try {
    var sessionResult = await db.auth.getSession();
    if (sessionResult.error || !sessionResult.data.session) {
      showError('登录已过期，请重新登录后再扫码');
      return;
    }
    console.log('[扫码] Session valid, email:', userEmail);
  } catch (e) {
    console.warn('[扫码] Session check error:', e);
    // 降级：允许继续（和 auth-check.js 保持一致）
  }

  // 5. 检查token是否有效
  try {
    var tokenResult = await db
      .from('qr_login_tokens')
      .select('*')
      .eq('token', qrToken)
      .limit(1);

    if (tokenResult.error) {
      if (tokenResult.error.message && tokenResult.error.message.indexOf('does not exist') !== -1) {
        showError('系统未配置扫码登录功能，请联系管理员');
      } else {
        showError('查询失败: ' + tokenResult.error.message);
      }
      return;
    }

    if (!tokenResult.data || tokenResult.data.length === 0) {
      showError('二维码已失效或不存在，请在电脑端刷新二维码');
      return;
    }

    var tokenRow = tokenResult.data[0];
    if (tokenRow.status !== 'pending') {
      showError('该二维码已被使用或已过期，请在电脑端刷新二维码');
      return;
    }

    // 6. 显示确认界面
    document.getElementById('statusMsg').innerHTML =
      '电脑端请求登录教师账号<br><strong>' + escapeHtml(userEmail) + '</strong><br><br>确认是本人操作？';
    document.getElementById('btnRow').style.display = 'flex';

  } catch (e) {
    console.error('[扫码] Token check error:', e);
    showError('检查二维码失败: ' + e.message);
  }
})();

// 确认登录
async function handleConfirm() {
  var confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.disabled = true;
  confirmBtn.textContent = '处理中...';
  document.getElementById('btnRow').style.display = 'none';

  var resultStatus = document.getElementById('resultStatus');
  resultStatus.className = 'status loading';
  resultStatus.innerHTML = '<span class="spinner"></span> 正在确认登录...';

  try {
    // 策略1：UPDATE（带status条件）
    var result = await db
      .from('qr_login_tokens')
      .update({
        status: 'verified',
        email: userEmail,
        verified_at: new Date().toISOString()
      })
      .eq('token', qrToken)
      .eq('status', 'pending')
      .select();

    console.log('[扫码] UPDATE结果:', result.error ? 'ERROR: ' + result.error.message : 'rows=' + (result.data ? result.data.length : 0));

    var updateOk = !result.error && result.data && result.data.length > 0;

    if (!updateOk) {
      // 策略2：不带status条件
      console.log('[扫码] 策略1失败，尝试不带status条件的UPDATE...');
      var result2 = await db
        .from('qr_login_tokens')
        .update({
          status: 'verified',
          email: userEmail,
          verified_at: new Date().toISOString()
        })
        .eq('token', qrToken)
        .select();

      console.log('[扫码] 策略2结果:', result2.error ? 'ERROR: ' + result2.error.message : 'rows=' + (result2.data ? result2.data.length : 0));
      updateOk = !result2.error && result2.data && result2.data.length > 0;
    }

    if (!updateOk) {
      // 策略3：DELETE + INSERT
      console.log('[扫码] 策略2失败，尝试 DELETE + INSERT...');
      var delResult = await db
        .from('qr_login_tokens')
        .delete()
        .eq('token', qrToken);

      if (delResult.error) {
        throw new Error('写入失败: ' + delResult.error.message);
      }

      var insertResult = await db
        .from('qr_login_tokens')
        .insert([{
          token: qrToken,
          email: userEmail,
          status: 'verified',
          verified_at: new Date().toISOString(),
          expires_at: new Date(Date.now() + 5 * 60 * 1000).toISOString()
        }])
        .select();

      console.log('[扫码] INSERT结果:', insertResult.error ? 'ERROR: ' + insertResult.error.message : 'OK');

      if (insertResult.error) {
        throw new Error('INSERT 失败: ' + insertResult.error.message);
      }
      updateOk = true;
    }

    if (updateOk) {
      // 等待数据库同步
      await new Promise(function(r) { setTimeout(r, 500); });

      // 最终验证
      var verifyResult = await db
        .from('qr_login_tokens')
        .select('status, email')
        .eq('token', qrToken)
        .limit(1);

      var verifyRow = (verifyResult.data && verifyResult.data.length > 0) ? verifyResult.data[0] : null;

      if (verifyRow && verifyRow.status === 'verified') {
        resultStatus.className = 'status success';
        resultStatus.innerHTML = '✅ 登录成功！<br><span style="font-size:12px;color:#888;">电脑端将自动进入教师账户</span>';
      } else {
        resultStatus.className = 'status success';
        resultStatus.innerHTML = '✅ 登录确认已发送！<br><span style="font-size:12px;color:#888;">如电脑端无反应，请重试</span>';
      }

      document.getElementById('statusMsg').innerHTML = '操作完成';
    }

  } catch (e) {
    console.error('[扫码] 确认登录失败:', e);
    resultStatus.className = 'status error';
    resultStatus.innerHTML = '❌ 确认失败: ' + (e.message || '未知错误');
    document.getElementById('statusMsg').innerHTML = '请关闭页面后重试';
  }
}

// 取消
function handleCancel() {
  document.getElementById('resultStatus').className = 'status loading';
  document.getElementById('resultStatus').innerHTML = '已取消登录';
  document.getElementById('btnRow').style.display = 'none';
  document.getElementById('statusMsg').innerHTML = '您已取消本次登录确认';
}

// 显示错误
function showError(msg) {
  document.getElementById('statusMsg').innerHTML = msg;
  document.getElementById('statusMsg').style.color = '#e74c3c';
}

// HTML转义
function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}
</script>
</body>
</html>
