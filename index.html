<script>
// ===== 云端模式：禁用本地文件保存机制 =====
// 数据完全走 Supabase 云端，不再需要文件授权
(function(){
  // 1. 阻止文件授权浮层出现
  window.showStartOverlay = function(){};

  // 2. 禁用 USB 连接 / 文件保存
  window.connectUSB = function(){
    showNotification('云端模式', '数据自动保存到云端，无需授权本地文件', 'info');
  };
  window.updateUSBStatus = function(){};
  window.scheduleFileSave = function(){};
  window.saveAllToFiles = function(){};

  // 3. 移除可能已经出现的浮层
  var _cleanTimer = setInterval(function(){
    var ov = document.getElementById('startOverlay');
    if (ov) ov.remove();
  }, 100);
  setTimeout(function(){ clearInterval(_cleanTimer); }, 10000);

  // 4. 更新云端同步状态指示器
  window._updateCloudStatus = function(state) {
    var el = document.getElementById('cloudSyncStatus');
    if (!el) return;
    if (state === 'syncing') {
      el.innerHTML = '☁️ 同步中...';
      el.style.color = '#b08800';
      el.style.background = 'linear-gradient(135deg,#fff8e0,#ffefb0)';
    } else if (state === 'synced') {
      el.innerHTML = '☁️ 已同步';
      el.style.color = '#6a9955';
      el.style.background = 'linear-gradient(135deg,#e8ffe8,#d0f0d0)';
    } else if (state === 'error') {
      el.innerHTML = '☁️ 同步失败(点击重试)';
      el.style.color = '#cc4444';
      el.style.background = 'linear-gradient(135deg,#ffe8e8,#ffd0d0)';
    } else {
      el.innerHTML = '☁️ 云端同步';
      el.style.color = '#6a9955';
      el.style.background = 'linear-gradient(135deg,#e8ffe8,#d0f0d0)';
    }
  };
})();
</script>
