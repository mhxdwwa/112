<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <title>武林争霸</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@700;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none
}

canvas {
    touch-action: none
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Noto Serif SC', serif;
    /* 水墨风格背景：宣纸底色 + 墨韵渐变 */
    background: #e8ddce;  /* 仿古宣纸色 */
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(180, 160, 140, 0.4) 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(120, 100, 80, 0.3) 0%, transparent 40%),
        radial-gradient(circle at 40% 80%, rgba(100, 80, 60, 0.25) 0%, transparent 50%),
        linear-gradient(145deg, rgba(200, 180, 160, 0.2) 0%, transparent 60%),
        repeating-linear-gradient(45deg, rgba(140, 120, 100, 0.02) 0px, rgba(140, 120, 100, 0.02) 2px, 
                                  transparent 2px, transparent 8px);
    background-blend-mode: overlay, normal, normal, normal, normal;
    background-size: cover, cover, cover, cover, auto;
    background-position: center;
    background-attachment: fixed;
}

/* 水墨飞白纹理叠加层（模拟毛笔枯笔） */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/><feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.08 0" in="noise" result="coloredNoise"/><feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.6"/></svg>');
    background-repeat: repeat;
    background-size: 200px 200px;
    opacity: 0.25;
    pointer-events: none;
    z-index: -1;
}

canvas#bg3d {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    pointer-events: none;
    /* 隐藏原有3D背景，完全使用CSS水墨背景 */
    opacity: 0 !important;
    visibility: hidden;
}

canvas#gc {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
    background: transparent;
    pointer-events: none
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px)
}

.overlay.active {
    display: flex
}

.title-box {
    text-align: center;
    position: relative;
    z-index: 2
}

.game-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: min(18vw, 120px);
    color: #3d2a1d;
    text-shadow: 0 0 40px rgba(210, 180, 140, 0.8), 0 0 80px rgba(160, 120, 80, 0.5), 0 4px 20px rgba(0, 0, 0, 0.3);
    letter-spacing: .3em;
    animation: glowTitle 2s ease-in-out infinite alternate, float 3s ease-in-out infinite
}

@keyframes glowTitle {
    from {
        text-shadow: 0 0 30px rgba(180, 140, 100, 0.6)
    }
    to {
        text-shadow: 0 0 80px rgba(140, 100, 70, 0.9), 0 0 160px rgba(100, 70, 50, 0.6)
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0)
    }
    50% {
        transform: translateY(-12px)
    }
}

.sub {
    font-family: 'ZCOOL KuaiLe', cursive;
    color: #5d4035;
    font-size: min(5vw, 28px);
    letter-spacing: .8em;
    margin-top: 10px;
    text-shadow: 0 2px 6px rgba(230, 210, 190, 0.8)
}

.mbtn {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: min(6vw, 36px);
    padding: 18px 64px;
    color: #3e2c1c;
    border: 2px solid #8b6f50;
    border-radius: 60px;
    cursor: pointer;
    letter-spacing: .2em;
    transition: all .2s;
    display: inline-block;
    margin: 12px;
    text-decoration: none;
    background: linear-gradient(180deg, rgba(220, 190, 160, 0.9), rgba(180, 140, 110, 0.95));
    box-shadow: 0 8px 30px rgba(100, 70, 40, 0.4), inset 0 1px 0 rgba(255, 245, 220, 0.4);
    touch-action: manipulation;
}

.mbtn:hover {
    transform: translateY(-5px);
    filter: brightness(1.1);
    box-shadow: 0 15px 40px rgba(140, 100, 60, 0.5)
}

.mbtn.blue {
    background: linear-gradient(180deg, rgba(160, 180, 200, 0.9), rgba(100, 120, 150, 0.95));
    box-shadow: 0 8px 30px rgba(80, 100, 130, 0.4)
}

.sel-title {
    font-family: 'Ma Shan Zheng', cursive;
    color: #5d4035;
    font-size: min(8vw, 52px);
    text-shadow: 0 0 30px #c8ad8a;
    margin-bottom: 24px
}

.sel-wrap {
    display: flex;
    gap: 30px;
    width: 100%;
    max-width: 1400px;
    flex-wrap: wrap;
    justify-content: center
}

.sel-col {
    flex: 1;
    min-width: 280px;
    background: rgba(230, 210, 190, 0.5);
    backdrop-filter: blur(8px);
    border-radius: 36px;
    padding: 20px 12px;
    border: 1px solid rgba(140, 110, 80, 0.4)
}

.sel-label {
    font-size: min(5vw, 26px);
    padding: 6px 20px;
    border-radius: 40px;
    margin-bottom: 16px;
    display: inline-block
}

.p1c {
    background: #a0522d;
    color: #f0e0d0;
    box-shadow: 0 0 20px #8b5a3a
}

.p2c {
    background: #3a6b7a;
    color: #f0e0d0;
    box-shadow: 0 0 20px #2e5a6b
}

.sel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 12px
}

.hcard {
    background: radial-gradient(circle at 20% 30%, rgba(220, 190, 160, 0.4), rgba(100, 80, 60, 0.8));
    border: 2px solid rgba(140, 110, 80, 0.6);
    border-radius: 20px;
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    backdrop-filter: blur(4px)
}

.hcard:hover {
    transform: scale(1.05);
    border-color: #a87b5a;
    box-shadow: 0 0 25px rgba(140, 100, 70, 0.7)
}

.hcard canvas {
    width: 70px;
    height: 70px;
    display: block;
    margin: 0 auto 6px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3))
}

.hcard .hn {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 14px;
    color: #f2e6d8
}

.hcard.sp1 {
    border-color: #b86a4a;
    background: linear-gradient(145deg, rgba(200, 120, 80, 0.4), rgba(100, 60, 40, 0.7));
    box-shadow: 0 0 35px #b86a4a
}

.hcard.sp2 {
    border-color: #4a7a9c;
    background: linear-gradient(145deg, rgba(80, 140, 180, 0.4), rgba(40, 80, 120, 0.7));
    box-shadow: 0 0 35px #4a7a9c
}

.info-panel {
    background: rgba(80, 60, 45, 0.7);
    border-radius: 24px;
    padding: 14px;
    margin-top: 16px;
    color: #f0e0d0;
    font-size: 13px;
    backdrop-filter: blur(12px)
}

.info-panel h3 {
    color: #e6c8a8;
    font-size: 22px;
    margin-bottom: 6px
}

.sk {
    background: rgba(180, 150, 120, 0.25);
    border-left: 4px solid #c8a070;
    padding: 6px 10px;
    margin: 6px 0
}

#hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    pointer-events: none;
    padding: 12px 20px
}

.hud-row {
    display: flex;
    align-items: center;
    gap: 12px
}

.hbar {
    height: 32px;
    background: rgba(60, 40, 30, 0.8);
    border: 2px solid #b89a7a;
    border-radius: 20px;
    overflow: hidden
}

.hbar-fill {
    height: 100%;
    transition: width .2s cubic-bezier(0.2, 0.9, 0.4, 1.1)
}

.hbar-fill.p1 {
    background: linear-gradient(90deg, #b84a3a, #e08870);
    box-shadow: 0 0 8px #d07060
}

.hbar-fill.p2 {
    background: linear-gradient(90deg, #3a7a9a, #70aac0);
    box-shadow: 0 0 8px #5a9ab0
}

.hbar-ghost {
    background: rgba(220, 200, 180, 0.4);
    transition: width .45s
}

.ebar {
    height: 12px;
    background: #3a2a1e;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 5px
}

.ebar-fill {
    height: 100%;
    background: linear-gradient(90deg, #d4a060, #f0d090);
    border-radius: 20px;
    transition: width .2s
}

.ebar-fill.full {
    animation: epulse .4s infinite alternate;
    box-shadow: 0 0 12px #e0b070
}

@keyframes epulse {
    to {
        filter: brightness(1.5)
    }
}

.timer-num {
    font-size: 42px;
    color: #6b4e3a;
    text-shadow: 0 0 20px #c8a878;
    font-weight: bold
}

.hud-name {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 16px;
    color: #f0e0d0;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5)
}

#announcer {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    font-size: min(12vw, 80px);
    font-weight: 900;
    color: #d4b088;
    text-shadow: 0 0 40px #8b5a3a, 0 0 80px #5a3a2a;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none
}

.combo-pop {
    position: fixed;
    z-index: 6;
    font-size: min(5vw, 42px);
    font-weight: bold;
    color: #d4a060;
    text-shadow: 0 0 18px #a04030;
    opacity: 0;
    transition: all .15s
}

#combo1 {
    top: 100px;
    left: 30px
}

#combo2 {
    top: 100px;
    right: 30px
}

.screenflash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,248,240,0.7) 30%, rgba(255,200,100,0.3) 60%, transparent 100%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: sflash .35s ease-out;
    z-index: 15
}

@keyframes sflash {
    0% {
        opacity: 1;
        transform: scale(1)
    }
    50% {
        opacity: .7;
        transform: scale(1.05)
    }
    100% {
        opacity: 0;
        transform: scale(1.1)
    }
}

.res-win-box canvas {
    filter: drop-shadow(0 0 20px #c8a070);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200, 160, 120, 0.3), transparent)
}

.hud-side {
    flex: 1
}

.hud-center {
    width: 80px;
    text-align: center
}

.p1t {
    color: #d08870
}

.p2t {
    color: #70a0c0
}

.res-container {
    text-align: center
}

.res-crown {
    font-size: min(8vw, 48px);
    color: #c8a070;
    text-shadow: 0 0 30px #a08060;
    margin-bottom: 10px
}

.res-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: min(10vw, 64px);
    color: #f0e0d0;
    text-shadow: 0 0 40px rgba(180, 130, 90, 0.8);
    margin-bottom: 10px
}

.res-sub {
    font-size: min(3vw, 18px);
    color: #e0c8b0;
    margin-bottom: 20px
}

#announcer.show {
    opacity: 1
}

.combo-pop.show {
    opacity: 1
}

.import-btn {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: min(4vw, 24px);
    padding: 12px 40px;
    color: #3e2c1c;
    border: 2px solid #8b6f50;
    border-radius: 40px;
    cursor: pointer;
    letter-spacing: .15em;
    transition: all .2s;
    display: inline-block;
    margin: 8px;
    background: linear-gradient(180deg, rgba(180, 210, 170, 0.9), rgba(120, 160, 110, 0.95));
    box-shadow: 0 6px 20px rgba(80, 130, 70, 0.4), inset 0 1px 0 rgba(255, 245, 220, 0.3);
    touch-action: manipulation;
}

.import-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.1)
}

.import-count {
    font-family: 'Ma Shan Zheng', cursive;
    color: #5a4a3a;
    font-size: min(3vw, 18px);
    margin-top: 4px;
    text-shadow: 0 1px 4px rgba(230, 210, 190, 0.8)
}

#quiz-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(40, 30, 20, 0.8);
    backdrop-filter: blur(6px)
}

#quiz-overlay.active {
    display: flex
}

.quiz-box {
    width: 1400px;
    max-width: 96vw;
    height: 800px;
    max-height: 90vh;
    background: rgba(80, 60, 45, 0.95);
    border: 3px solid #b89a7a;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(180, 140, 100, 0.4)
}

.quiz-header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 20px;
    background: linear-gradient(90deg, rgba(180, 100, 80, 0.2), rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0) 60%, rgba(80, 120, 160, 0.2));
    border-bottom: 2px solid rgba(180, 150, 120, 0.4)
}

.quiz-header-text {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: min(5vw, 32px);
    text-shadow: 0 0 20px currentColor;
    letter-spacing: .2em
}

.quiz-header-text.red {
    color: #d08870
}

.quiz-header-text.blue {
    color: #70a0c0
}

.quiz-body {
    flex: 1;
    position: relative;
    overflow: hidden
}

.quiz-body img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    z-index: 0
}

.quiz-body canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: crosshair
}

.quiz-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(60, 40, 30, 0.7);
    border-top: 2px solid rgba(180, 150, 120, 0.4);
    flex-wrap: wrap
}

.pen-color {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid rgba(220, 200, 180, 0.5);
    cursor: pointer;
    transition: all .15s
}

.pen-color:hover, .pen-color.active {
    transform: scale(1.2);
    border-color: #c8a070;
    box-shadow: 0 0 12px currentColor
}

.quiz-btn {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: min(3.5vw, 20px);
    padding: 8px 24px;
    color: #f0e0d0;
    border: 2px solid;
    border-radius: 30px;
    cursor: pointer;
    transition: all .15s;
    background: transparent;
    letter-spacing: .1em;
    touch-action: manipulation;
}

.quiz-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.3)
}

.quiz-btn.eraser {
    border-color: #c09060;
    color: #c09060
}

.quiz-btn.eraser.active {
    background: rgba(200, 144, 96, 0.3)
}

.quiz-btn.clear {
    border-color: #b07060;
    color: #b07060
}

.quiz-btn.submit {
    border-color: #80a070;
    color: #80a070;
    font-size: min(4vw, 24px);
    padding: 10px 36px
}

.quiz-btn.correct {
    border-color: #80a070;
    color: #80a070;
    font-size: min(4vw, 26px);
    padding: 10px 30px;
    background: rgba(128, 160, 112, 0.2)
}

.quiz-btn.wrong {
    border-color: #c07060;
    color: #c07060;
    font-size: min(4vw, 26px);
    padding: 10px 30px;
    background: rgba(192, 112, 96, 0.2)
}

.quiz-judge {
    display: none;
    gap: 10px;
    align-items: center
}

.quiz-judge.show {
    display: flex
}

.pen-size {
    width: 60px;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(220, 200, 180, 0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer
}

.pen-size::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #c8a070;
    cursor: pointer
}

.credit-text {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 16px;
    color: #6b4e3a;
    text-shadow: 0 1px 4px rgba(230, 210, 190, 0.6);
    pointer-events: none;
    letter-spacing: .1em;
    white-space: nowrap
}

#select-overlay {
    overflow-y: auto;
    padding: 20px 0;
    box-sizing: border-box;
}

.sel-bottom {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0 30px;
    width: 100%;
}

.mbtn {
    min-width: 140px;
    width: auto;
    padding: 14px 28px;
    font-size: min(5vw, 28px);
}
</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="credit-text">制作者：九圩中学吴胜闯老师</div>
<canvas id="bg3d"></canvas>
<canvas id="gc"></canvas>

<div id="title-overlay" class="overlay active">
    <div class="title-box">
        <div class="game-title">武林争霸</div>
        <div class="sub">谁是真大侠</div>
        <button class="mbtn" id="btnStart">开 战</button>
        <br>
        <button class="import-btn" id="btnImport">导入</button>
        <input type="file" id="quizFileInput" accept="image/*" multiple style="display:none">
        <div class="import-count" id="importCount"></div>
    </div>
</div>

<div id="select-overlay" class="overlay">
    <div class="sel-title">⚔️ 绝世英杰 ⚔️</div>
    <div class="sel-wrap">
        <div class="sel-col">
            <div class="sel-label p1c">◈ 壹号侠客 ◈</div>
            <div class="sel-grid" id="gp1"></div>
            <div class="info-panel" id="ip1"></div>
        </div>
        <div class="sel-col">
            <div class="sel-label p2c">◈ 贰号豪雄 ◈</div>
            <div class="sel-grid" id="gp2"></div>
            <div class="info-panel" id="ip2"></div>
        </div>
    </div>
    <div class="sel-bottom">
        <button class="mbtn blue" id="btnBack">返 回</button>
        <button class="mbtn" id="btnFight" disabled>⚡ 决 战 ⚡</button>
    </div>
</div>

<div id="hud" style="display:none">
    <div class="hud-row">
        <div class="hud-side">
            <div class="hbar">
                <div class="hbar-ghost p1" id="hg1"></div>
                <div class="hbar-fill p1" id="hf1"></div>
            </div>
            <div class="ebar">
                <div class="ebar-fill p1r" id="ef1"></div>
            </div>
            <div class="hud-name p1t" id="hn1"></div>
        </div>
        <div class="hud-center">
            <div class="timer-num" id="tmr">⚔️</div>
        </div>
        <div class="hud-side">
            <div class="hbar">
                <div class="hbar-ghost p2" id="hg2"></div>
                <div class="hbar-fill p2" id="hf2"></div>
            </div>
            <div class="ebar">
                <div class="ebar-fill" id="ef2"></div>
            </div>
            <div class="hud-name p2t" id="hn2"></div>
        </div>
    </div>
</div>

<div id="announcer"></div>
<div class="combo-pop" id="combo1"></div>
<div class="combo-pop" id="combo2"></div>

<div id="quiz-overlay">
    <div class="quiz-box">
        <div class="quiz-header">
            <span class="quiz-header-text" id="quizHeaderText"></span>
        </div>
        <div class="quiz-body" id="quizBody">
            <img id="quizImg" src="">
            <canvas id="quizCanvas"></canvas>
        </div>
        <div class="quiz-footer">
            <div class="pen-color active" data-color="#ff0000" style="background:#ff0000"></div>
            <div class="pen-color" data-color="#0055ff" style="background:#0055ff"></div>
            <div class="pen-color" data-color="#000000" style="background:#000000"></div>
            <div class="pen-color" data-color="#ff9800" style="background:#ff9800"></div>
            <div class="pen-color" data-color="#4caf50" style="background:#4caf50"></div>

            fighter.ep = Math.min(fighter.maxEp, fighter.ep + 0.05);

            const hero = fighter.hero;
            const pos = fighter.position;
            const scale = hero.scale || 1;
            const size = 120 * scale;
            cx.fillStyle = hero.bc || '#333';
            cx.beginPath();
            cx.arc(pos.x, pos.y, size/2 + 5, 0, Math.PI * 2);

    let AC;
    function initAC() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); }
    function sfx(type) {
        if (!AC) return;
        try {
            const o = AC.createOscillator(), g = AC.createGain();
            o.connect(g); g.connect(AC.destination);
            const t = AC.currentTime;
            if (type === 'hit') {
                o.type = 'sawtooth'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(80, t + .1);
                g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
                o.start(t); o.stop(t + .15);
            } else if (type === 'skill') {
                o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(220, t + .4);
                g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .4);
                o.start(t); o.stop(t + .4);
            } else if (type === 'ko') {
                o.type = 'sawtooth'; o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(60, t + .8);
                g.gain.setValueAtTime(.45, t); g.gain.exponentialRampToValueAtTime(.001, t + .8);
                o.start(t); o.stop(t + .8);
            } else if (type === 'click') {
                o.type = 'triangle'; o.frequency.setValueAtTime(800, t);
                g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .1);
                o.start(t); o.stop(t + .1);
            } else if (type === 'select') {
                o.type = 'triangle'; o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(600, t + .1);
                g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
                o.start(t); o.stop(t + .15);
            } else if (type === 'win') {
                const n = AC.createOscillator(), m = AC.createGain();
                n.connect(m); m.connect(AC.destination);
                n.type = 'sine'; n.frequency.setValueAtTime(523, t); n.frequency.setValueAtTime(659, t + .15); n.frequency.setValueAtTime(784, t + .3);
                m.gain.setValueAtTime(.2, t); m.gain.exponentialRampToValueAtTime(.001, t + .6);
                n.start(t); n.stop(t + .6);
                o.type = 'square'; o.frequency.setValueAtTime(262, t);
                g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + .5);
                o.start(t); o.stop(t + .5);
            }
        } catch (e) { }
    }

    function handleTouchBtn(tx, ty, down) {
        if (scene !== 'battle') return;
        zones.p1btns.forEach(b => { if (Math.hypot(tx - b.x, ty - b.y) < b.r + 15) setInput(0, b.act, down); });
        zones.p1sk.forEach(b => { if (tx > b.x - 8 && tx < b.x + b.w + 8 && ty > b.y - 8 && ty < b.y + b.h + 8) if (down) setInput(0, b.act, true); });
        zones.p2btns.forEach(b => { if (Math.hypot(tx - b.x, ty - b.y) < b.r + 15) setInput(1, b.act, down); });
        zones.p2sk.forEach(b => { if (tx > b.x - 8 && tx < b.x + b.w + 8 && ty > b.y - 8 && ty < b.y + b.h + 8) if (down) setInput(1, b.act, true); });
    }
    function setInput(pi, act, val) {
        const v = val ? 1 : 0;
        if (act === 'jp') { 
            if (val) inp[pi].jp = 1; 
        } else if (val) { 
            inp[pi][act] = 1; 
        }
    }
    function processJoysticks() {
        inp[0].l = inp[0].r = inp[0].u = inp[0].d = 0;
        inp[1].l = inp[1].r = inp[1].u = inp[1].d = 0;
        let j1touch = null, j2touch = null;
        for (let id in activeTouches) {
            const t = activeTouches[id];
            const d1 = Math.hypot(t.sx - zones.j1.x, t.sy - zones.j1.y);
            const d2 = Math.hypot(t.sx - zones.j2.x, t.sy - zones.j2.y);
            if (d1 < zones.j1.r + 30 && (j1touch === null || d1 < Math.hypot(j1touch.sx - zones.j1.x, j1touch.sy - zones.j1.y))) j1touch = t;
            if (d2 < zones.j2.r + 30 && (j2touch === null || d2 < Math.hypot(j2touch.sx - zones.j2.x, j2touch.sy - zones.j2.y))) j2touch = t;
        }
        if (activeMouse.sx !== undefined) {
            const t = activeMouse;
            const d1 = Math.hypot(t.sx - zones.j1.x, t.sy - zones.j1.y);
            const d2 = Math.hypot(t.sx - zones.j2.x, t.sy - zones.j2.y);
            if (d1 < zones.j1.r + 30 && j1touch === null) j1touch = t;
            if (d2 < zones.j2.r + 30 && j2touch === null) j2touch = t;
        }
        if (j1touch) {
            const dx = j1touch.x - zones.j1.x, dy = j1touch.y - zones.j1.y;
            const th = zones.j1.r * .25;
            if (dx < -th) inp[0].l = 1; if (dx > th) inp[0].r = 1;
            if (dy < -th) inp[0].u = 1; if (dy > th) inp[0].d = 1;
            zones.j1.kx = Math.max(-1, Math.min(1, dx / zones.j1.r));
            zones.j1.ky = Math.max(-1, Math.min(1, dy / zones.j1.r));
        } else { zones.j1.kx = 0; zones.j1.ky = 0; }
        if (j2touch) {
            const dx = j2touch.x - zones.j2.x, dy = j2touch.y - zones.j2.y;
            const th = zones.j2.r * .25;
            if (dx < -th) inp[1].l = 1; if (dx > th) inp[1].r = 1;
            if (dy < -th) inp[1].u = 1; if (dy > th) inp[1].d = 1;
            zones.j2.kx = Math.max(-1, Math.min(1, dx / zones.j2.r));
            zones.j2.ky = Math.max(-1, Math.min(1, dy / zones.j2.r));
        } else { zones.j2.kx = 0; zones.j2.ky = 0; }
    }

        if (keys['k'] || keys['K']) I[0].lk = 1;

    class Fighter {
        constructor(hi, pn) {
            this.hd = H_DATA[hi]; this.pn = pn;
            this.x = pn === 1 ? W * .28 : W * .72; this.y = GY;
            this.vx = 0; this.vy = 0;
            this.hp = 500; this.mhp = 500; this.ghp = 500; // 血量减半
            this.en = 0; this.men = 100;
            this.face = pn === 1 ? 1 : -1;
            this.st = 'idle'; this.stT = 0; this.af = 0;
            this.baseH = 300;
            this.h = this.baseH * (this.hd.scale || 1);
            this.w = 120 * (this.hd.scale || 1);
            this.block = false; this.crouch = false;
            this.hitSt = 0; this.combo = 0; this.comboT = 0;
            this.atkBox = null; this.atkDmg = 0; this.atkHit = false;
            this.skAct = null; this.flash = 0; this.dead = false;
            this.atkType = 'punch';

        setSt(s, d) { this.st = s; this.stT = d || 30; this.af = 0; this.atkHit = false; this.atkBox = null; }
        damage(dm, atk) {
            sfx(dm > 25 ? 'heavy' : 'hit');
            this.hitSt = 15;
            this.setSt('hit', 15);
            atk.combo++;
            atk.comboT = 100;
            atk.en = Math.min(atk.men, atk.en + 2);
            this.en = Math.min(this.men, this.en + 1);
            this.vx = atk.face * (dm > 35 ? 10 : 5);
            if (dm > 40) this.vy = -8;
            this.hp = Math.max(0, this.hp - dm);
            this.flash = 12;
            spawnParticles(this.x + atk.face * 15, this.y - this.h * .5, 20, '#ffcc00', 5, 10);
            spawnParticles(this.x + atk.face * 15, this.y - this.h * .5, 14, '#ff4444', 4, 8);
            spawnParticles(this.x + atk.face * 15, this.y - this.h * .5, 8, '#ffffff', 2, 4);
            screenShake(dm > 35 ? 12 : 6, dm > 35 ? 18 : 10);

        }
        update(other) {
            if (this.dead) { this.stT--; this.vx *= .9; this.x += this.vx; return; }
            if (this.ghp > this.hp) this.ghp = Math.max(this.hp, this.ghp - 4);
            if (this.comboT > 0) this.comboT--; else this.combo = 0;
            if (this.flash > 0) this.flash--;
            if (this.hitSt > 0) { this.hitSt--; this.vx *= .88; }
            if (this.stT > 0) { this.stT--; this.af++; if (this.stT <= 0 && this.st !== 'idle' && this.st !== 'walk' && this.st !== 'defeat' && this.st !== 'jump') this.setSt('idle', 0); }
            if (other && !this.dead && (this.st === 'idle' || this.st === 'walk')) this.face = other.x > this.x ? 1 : -1;
            const I = inp[this.pn - 1];
            if (this.atkCooldown > 0) this.atkCooldown--;
            if (this.hitSt <= 0 && this.st !== 'hit' && this.st !== 'defeat') {

    function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

    function spawnParticles(px, py, n, cl, minS, maxS) {
        for (let i = 0; i < n; i++) particles.push({ x: px, y: py, vx: (Math.random() - .5) * 12, vy: (Math.random() - .5) * 12 - 2, life: 15 + Math.random() * 15, cl: cl, sz: minS + Math.random() * (maxS - minS) });
    }
    function screenShake(amt, dur) { shakeX = amt; shakeY = amt; shakeDur = dur; }
    function screenFlash() { const d = document.createElement('div'); d.className = 'screenflash'; document.body.appendChild(d); setTimeout(() => d.remove(), 350); }

    function dk(hex, a) { try { let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgb(${Math.max(0, r - r * a) | 0},${Math.max(0, g - g * a) | 0},${Math.max(0, b - b * a) | 0})`; } catch (e) { return hex; } }
    function lt(hex, a) { try { let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgb(${Math.min(255, r + (255-r) * a) | 0},${Math.min(255, g + (255-g) * a) | 0},${Math.min(255, b + (255-b) * a) | 0})`; } catch (e) { return hex; } }
    function rRect(cx, x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.lineTo(x + w - r, y); cx.quadraticCurveTo(x + w, y, x + w, y + r); cx.lineTo(x + w, y + h - r); cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); cx.lineTo(x + r, y + h); cx.quadraticCurveTo(x, y + h, x, y + h - r); cx.lineTo(x, y + r); cx.quadraticCurveTo(x, y, x + r, y); cx.closePath(); }
    function hexToRgba(hex, alpha) { try { let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r},${g},${b},${alpha})`; } catch(e) { return hex; } }

    function drawBG(t) {
        cx.clearRect(0, 0, W, H);
        const skyGrad = cx.createLinearGradient(0, 0, 0, GY);
        skyGrad.addColorStop(0, '#aad4f5');
        skyGrad.addColorStop(0.7, '#e0f0ff');
        skyGrad.addColorStop(1, '#ffffff');
        cx.fillStyle = skyGrad;
        cx.fillRect(0, 0, W, GY);

        function drawCloud(x, y, w, h) {
            cx.fillStyle = 'rgba(255,255,245,0.9)';
            cx.beginPath();
            cx.ellipse(x, y, w * 0.6, h * 0.8, 0, 0, Math.PI * 2);
            cx.ellipse(x + w * 0.4, y - h * 0.2, w * 0.5, h * 0.7, 0, 0, Math.PI * 2);
            cx.ellipse(x - w * 0.3, y - h * 0.1, w * 0.5, h * 0.7, 0, 0, Math.PI * 2);
            cx.ellipse(x + w * 0.2, y + h * 0.1, w * 0.4, h * 0.5, 0, 0, Math.PI * 2);
            cx.fill();
        }
        drawCloud(W * 0.2, GY * 0.15, 80, 50);
        drawCloud(W * 0.6, GY * 0.25, 100, 60);
        drawCloud(W * 0.8, GY * 0.08, 70, 45);
        drawCloud(W * 0.05, GY * 0.3, 60, 40);
        drawCloud(W * 0.45, GY * 0.4, 90, 55);

        cx.fillStyle = '#98b8c9';
        cx.beginPath();
        cx.moveTo(0, GY * 0.65);
        cx.lineTo(W * 0.15, GY * 0.55);
        cx.lineTo(W * 0.3, GY * 0.7);
        cx.lineTo(W * 0.5, GY * 0.6);
        cx.lineTo(W * 0.7, GY * 0.68);
        cx.lineTo(W * 0.85, GY * 0.58);
        cx.lineTo(W, GY * 0.65);
        cx.lineTo(W, GY * 0.8);
        cx.lineTo(0, GY * 0.8);
        cx.fill();

        const floorY = GY;
        const floorH = H - GY;
        const plankMinWidth = 70;
        const plankCount = Math.ceil(W / plankMinWidth);
        const plankWidth = W / plankCount;
        const baseWood = '#c9955e';
        for (let i = 0; i < plankCount; i++) {
            const x = i * plankWidth;
            const w = (i === plankCount - 1) ? W - x : plankWidth;
            const hueShift = (i % 7 - 3) * 4;
            const r = parseInt(baseWood.slice(1,3), 16) + hueShift;
            const g = parseInt(baseWood.slice(3,5), 16) + hueShift;
            const b = parseInt(baseWood.slice(5,7), 16) + hueShift;
            const plankColor = `rgb(${Math.min(255,Math.max(160,r))}, ${Math.min(255,Math.max(130,g))}, ${Math.min(255,Math.max(70,b))})`;
            cx.fillStyle = plankColor;
            cx.fillRect(x, floorY, w, floorH);
            cx.beginPath();
            cx.moveTo(x, floorY);
            cx.lineTo(x, floorY + floorH);
            cx.strokeStyle = '#4a2a1a';
            cx.lineWidth = 2;
            cx.stroke();
            const grainCount = 5 + Math.floor(i % 3);
            for (let g = 0; g < grainCount; g++) {
                const yOffset = ((i * 131 + g * 37) % 97) / 97;
                const y = floorY + 8 + yOffset * (floorH - 16);
                const darken = 30 + (g * 7) % 40;
                cx.beginPath();
                cx.moveTo(x + 4, y);
                cx.lineTo(x + w - 4, y);
                cx.strokeStyle = `rgba(60, 30, 10, ${0.3 + (g % 3) * 0.1})`;
                cx.lineWidth = 1.5;
                cx.stroke();
            }
            if ((i * 7) % 13 < 4) {
                const knotCount = 1 + (i % 3);
                for (let k = 0; k < knotCount; k++) {
                    const knotX = x + 10 + ((i * 17 + k * 23) % (w - 20));
                    const knotY = floorY + 15 + ((i * 11 + k * 29) % (floorH - 30));
                    const knotR = 3 + (i % 4);
                    cx.beginPath();
                    cx.arc(knotX, knotY, knotR, 0, Math.PI * 2);
                    cx.fillStyle = '#6b3a1a';
                    cx.fill();
                    cx.beginPath();
                    cx.arc(knotX - 1, knotY - 1, knotR * 0.3, 0, Math.PI * 2);
                    cx.fillStyle = '#a55a2a';
                    cx.fill();
                }
            }
        }
        cx.beginPath();
        cx.moveTo(W, floorY);
        cx.lineTo(W, floorY + floorH);
        cx.strokeStyle = '#4a2a1a';
        cx.lineWidth = 2;
        cx.stroke();

        const pillarW = 24;
        const pillarH = 68;
        const pillarY = GY - pillarH;
        const pillarPos = [
            { x: 35, y: pillarY },
            { x: W - 35 - pillarW, y: pillarY }
        ];
        pillarPos.forEach(p => {
            const pillarGrad = cx.createLinearGradient(p.x, p.y, p.x + pillarW, p.y);
            pillarGrad.addColorStop(0, '#aa5a4a');
            pillarGrad.addColorStop(0.5, '#c86a54');
            pillarGrad.addColorStop(1, '#aa5a4a');
            cx.fillStyle = pillarGrad;
            cx.fillRect(p.x, p.y, pillarW, pillarH);
            cx.fillStyle = '#e6b422';
            cx.fillRect(p.x - 4, p.y - 6, pillarW + 8, 6);
            cx.fillStyle = '#c9942c';
            cx.fillRect(p.x - 2, p.y - 10, pillarW + 4, 8);
        });

        const ropeY = GY - 12;
        cx.beginPath();
        cx.moveTo(50, ropeY);
        cx.lineTo(W - 50, ropeY);
        cx.strokeStyle = '#e6b422';
        cx.lineWidth = 3;
        cx.stroke();
        cx.beginPath();
        cx.moveTo(50, ropeY - 8);
        cx.lineTo(W - 50, ropeY - 8);
        cx.stroke();
        for (let i = 0; i < 12; i++) {
            const x = 50 + i * ((W - 100) / 11);
            cx.beginPath();
            cx.moveTo(x, ropeY);
            cx.lineTo(x - 3, ropeY + 10);
            cx.lineTo(x + 3, ropeY + 10);
            cx.fillStyle = '#b8860b';
            cx.fill();
        }

        cx.globalAlpha = 0.6;
        cx.fillStyle = '#b5312a';
        cx.fillRect(0, 0, 50, H);
        cx.fillRect(W - 50, 0, 50, H);
        cx.globalAlpha = 1;
        cx.fillStyle = '#f7d44a';
        cx.fillRect(0, 0, 50, 8);
        cx.fillRect(W - 50, 0, 50, 8);

        const lanternX = [W * 0.2, W * 0.8];
        lanternX.forEach(x => {
            const lanternY = GY * 0.2;
            cx.beginPath();
            cx.moveTo(x, lanternY - 15);
            cx.lineTo(x, lanternY);
            cx.strokeStyle = '#8b5a2b';
            cx.lineWidth = 2;
            cx.stroke();
            const lg = cx.createRadialGradient(x - 6, lanternY - 4, 3, x, lanternY, 18);
            lg.addColorStop(0, '#f5a97f');
            lg.addColorStop(1, '#c53a1f');
            cx.fillStyle = lg;
            cx.beginPath();
            cx.ellipse(x, lanternY, 16, 22, 0, 0, Math.PI * 2);
            cx.fill();
            cx.fillStyle = '#e6b422';
            cx.fillRect(x - 12, lanternY - 12, 24, 6);
            cx.fillRect(x - 12, lanternY + 8, 24, 6);
            cx.beginPath();
            cx.moveTo(x - 5, lanternY + 14);
            cx.lineTo(x, lanternY + 24);
            cx.lineTo(x + 5, lanternY + 14);
            cx.fillStyle = '#b22222';
            cx.fill();
        });

        const flagX = [70, W - 90];
        flagX.forEach(x => {
            const flagY = GY - 85;
            cx.fillStyle = '#6b4c2c';
            cx.fillRect(x - 4, flagY, 6, 100);
            cx.fillStyle = '#bf5a36';
            cx.beginPath();
            cx.moveTo(x, flagY);
            cx.lineTo(x + 65, flagY + 10);
            cx.lineTo(x + 65, flagY + 55);
            cx.lineTo(x, flagY + 50);
            cx.fill();
            cx.font = `bold ${22}px "Ma Shan Zheng", cursive`;
            cx.fillStyle = '#f7e05e';
            cx.shadowBlur = 3;
            cx.fillText('武', x + 12, flagY + 32);
            cx.shadowBlur = 0;
        });
    }

    function skinGrad(cx, x1,y1,x2,y2){
        const g=cx.createLinearGradient(x1,y1,x2,y2);
        g.addColorStop(0,'#f0d0a0');g.addColorStop(.4,'#e8c494');g.addColorStop(1,'#d4a574');return g;
    }
    function clothGrad(cx,x1,y1,x2,y2,c1,c2){
        const g=cx.createLinearGradient(x1,y1,x2,y2);
        g.addColorStop(0,c1);g.addColorStop(1,c2||dk(c1,.25));return g;
    }

    function drawDetailedChar(f, t) {
        if (f.dead && f.stT <= 0) return;
        cx.save();
        cx.translate(f.x + (f.flash > 0 && f.flash % 2 ? 3 : 0), f.y);
        if (f.flash > 0 && f.flash % 3 === 0) cx.globalAlpha = .4;
        cx.scale(f.face, 1);
        const hd = f.hd;
        const Hh = f.h;
        const sc = hd.scale || 1.0;
        const af = f.af;
        const S = t * .001;
        const isKick = f.st === 'attack' && f.atkType === 'kick';

        let bOff=0, torsoRot=0, aAngL=0, aAngR=0, lAngL=0, lAngR=0, headTilt=0;
        if (f.st === 'idle') {
            bOff = Math.sin(S*2.5)*3*sc;
            aAngL = Math.sin(S*2)*.08; aAngR = Math.sin(S*2.2)*.06;
            lAngL = Math.sin(S*1.8)*.03; lAngR = -Math.sin(S*1.8)*.03;
            headTilt = Math.sin(S*1.5)*.02;
        } else if (f.st === 'walk') {
            lAngL = Math.sin(af*.35)*.5; lAngR = -Math.sin(af*.35)*.5;
            aAngL = -Math.sin(af*.35)*.3; aAngR = Math.sin(af*.35)*.25;
            bOff = Math.abs(Math.sin(af*.35))*4*sc;
        } else if (f.st === 'jump') {
            lAngL = -.4; lAngR = -.35; aAngL = -.3; aAngR = -.4; bOff = -4*sc;
        } else if (f.st === 'attack') {
            const pr = Math.min(1, af/(f.stT||20));
            if (isKick) {
                lAngR = -1.2-Math.sin(pr*Math.PI)*.6;
                lAngL = .2; aAngL = .2; aAngR = -.3;
                bOff = -2*sc+Math.sin(pr*Math.PI)*3*sc;
                torsoRot = -.05;
            } else {
                aAngR = -1.5-Math.sin(pr*Math.PI)*1.2;
                aAngL = .3+Math.sin(pr*Math.PI)*.2;
                bOff = 3*sc; torsoRot = -.08;
            }
        } else if (f.st === 'skill') {
            aAngR = -1.8-Math.sin(af*.15)*.3;
            aAngL = -.5+Math.sin(af*.2)*.2;
            bOff = -5*sc; torsoRot = -.06;
            headTilt = -.05;
        } else if (f.st === 'hit') {
            bOff = Math.sin(af*.8)*5*sc;
            aAngL = .4; aAngR = .3; torsoRot = .1;
            lAngL = .1; lAngR = .15;
        } else if (f.st === 'defeat') {
            cx.rotate(Math.min(af*.025, Math.PI*.45));
            cx.globalAlpha = Math.max(.1, 1-af*.004);
        }

        const bodyW = (hd.bld==='heavy'?40:hd.bld==='slim'?28:hd.bld==='short'?30:34)*sc;
        const torsoH = Hh*.34;
        const legLen = Hh*.36;
        const armLen = Hh*.28;
        const legW = bodyW*.42;
        const armW = (hd.bld==='heavy'?14:10)*sc;
        const headR = Hh*.12*sc;
        const neckH = 10*sc;

        const torsoY = -torsoH*.1+bOff;
        const hipY = torsoY;
        const shoulderY = torsoY - torsoH;
        const headY = shoulderY - neckH - headR;

        cx.save();
        const shG = cx.createRadialGradient(0,4,10*sc,0,4,65*sc);
        shG.addColorStop(0,'rgba(0,0,0,.35)');shG.addColorStop(1,'rgba(0,0,0,0)');
        cx.fillStyle=shG;
        cx.beginPath();cx.ellipse(0,4,60*sc,14*sc,0,0,Math.PI*2);cx.fill();
        cx.restore();

        cx.save();
        cx.translate(-bodyW*.28, hipY);
        cx.rotate(lAngL);
        cx.fillStyle = clothGrad(cx,-legW/2,0,legW/2,0,dk(hd.oc2,.1),dk(hd.oc2,.3));
        cx.beginPath();
        cx.moveTo(-legW*.5, 0);
        cx.quadraticCurveTo(-legW*.55, legLen*.3, -legW*.4, legLen*.52);
        cx.lineTo(legW*.4, legLen*.52);
        cx.quadraticCurveTo(legW*.55, legLen*.3, legW*.5, 0);
        cx.closePath(); cx.fill();
        cx.save();
        cx.translate(0, legLen*.5);
        cx.rotate(-lAngL*.4);
        cx.fillStyle = dk(hd.oc2,.25);
        cx.beginPath();
        cx.moveTo(-legW*.42,0);
        cx.quadraticCurveTo(-legW*.38,legLen*.3,-legW*.35,legLen*.48);
        cx.lineTo(legW*.35,legLen*.48);
        cx.quadraticCurveTo(legW*.38,legLen*.3,legW*.42,0);
        cx.closePath(); cx.fill();
        cx.fillStyle = '#2a1a0a';
        cx.beginPath();
        cx.ellipse(0,legLen*.48+3*sc,legW*.5,5*sc,0,0,Math.PI*2);
        cx.fill();
        cx.restore();
        cx.restore();

        cx.save();
        cx.translate(-bodyW-2, shoulderY+8*sc);
        cx.rotate(aAngL);
        cx.fillStyle = clothGrad(cx,-armW,0,armW,0,hd.oc,dk(hd.oc,.2));
        cx.beginPath();
        cx.moveTo(-armW*.7,0);
        cx.quadraticCurveTo(-armW*.9,armLen*.25,-armW*.6,armLen*.5);
        cx.lineTo(armW*.6,armLen*.5);
        cx.quadraticCurveTo(armW*.9,armLen*.25,armW*.7,0);
        cx.closePath(); cx.fill();
        cx.save();
        cx.translate(0,armLen*.48);
        cx.rotate(aAngL*.6);
        cx.fillStyle = skinGrad(cx,-armW*.5,0,armW*.5,armLen*.45);
        cx.beginPath();
        cx.moveTo(-armW*.5,0);
        cx.quadraticCurveTo(-armW*.4,armLen*.25,-armW*.35,armLen*.42);
        cx.lineTo(armW*.35,armLen*.42);
        cx.quadraticCurveTo(armW*.4,armLen*.25,armW*.5,0);
        cx.closePath(); cx.fill();
        cx.fillStyle='#e0b888';
        cx.beginPath();cx.arc(0,armLen*.44,5*sc,0,Math.PI*2);cx.fill();
        cx.restore();
        cx.restore();

        cx.save();
        cx.translate(0, torsoY);
        cx.rotate(torsoRot);
        const tG = clothGrad(cx,-bodyW,shoulderY-torsoY,bodyW,0,hd.oc,dk(hd.oc,.15));
        cx.fillStyle = tG;
        cx.beginPath();
        cx.moveTo(-bodyW*.9, -torsoH+2);
        cx.quadraticCurveTo(-bodyW*1.0, -torsoH*.5, -bodyW*.75, 0);
        cx.lineTo(bodyW*.75, 0);
        cx.quadraticCurveTo(bodyW*1.0, -torsoH*.5, bodyW*.9, -torsoH+2);
        cx.closePath(); cx.fill();

        cx.strokeStyle = dk(hd.oc,.3);
        cx.lineWidth = 2*sc;
        cx.beginPath();
        cx.moveTo(-bodyW*.3, -torsoH+4);
        cx.lineTo(0, -torsoH*.35);
        cx.lineTo(bodyW*.3, -torsoH+4);
        cx.stroke();

        const beltG = cx.createLinearGradient(-bodyW*.8,0,bodyW*.8,0);
        beltG.addColorStop(0,'#c9a84c');beltG.addColorStop(.5,'#e8cc6e');beltG.addColorStop(1,'#c9a84c');
        cx.fillStyle = beltG;
        cx.fillRect(-bodyW*.85, -6*sc, bodyW*1.7, 8*sc);
        cx.fillStyle='#ffd700';
        cx.beginPath();cx.arc(0,-2*sc,5*sc,0,Math.PI*2);cx.fill();
        cx.fillStyle='#b8860b';
        cx.beginPath();cx.arc(0,-2*sc,3*sc,0,Math.PI*2);cx.fill();

        cx.fillStyle = hd.bc;
        for(let i=0;i<3;i++){
            cx.beginPath();
            cx.arc(bodyW*.15, -torsoH*.7+i*12*sc, 3*sc, 0, Math.PI*2);
            cx.fill();
        }

        drawOutfitDetail(cx, hd, bodyW, torsoH, sc);
        cx.restore();

        cx.save();
        cx.translate(bodyW*.28, hipY);
        cx.rotate(lAngR);
        cx.fillStyle = clothGrad(cx,-legW/2,0,legW/2,0,hd.oc2,dk(hd.oc2,.2));
        cx.beginPath();
        cx.moveTo(-legW*.52,0);
        cx.quadraticCurveTo(-legW*.58,legLen*.3,-legW*.42,legLen*.52);
        cx.lineTo(legW*.42,legLen*.52);
        cx.quadraticCurveTo(legW*.58,legLen*.3,legW*.52,0);
        cx.closePath(); cx.fill();
        cx.save();
        cx.translate(0,legLen*.5);
        cx.rotate(-lAngR*.4);
        cx.fillStyle = dk(hd.oc2,.2);
        cx.beginPath();
        cx.moveTo(-legW*.44,0);
        cx.quadraticCurveTo(-legW*.4,legLen*.3,-legW*.36,legLen*.48);
        cx.lineTo(legW*.36,legLen*.48);
        cx.quadraticCurveTo(legW*.4,legLen*.3,legW*.44,0);
        cx.closePath(); cx.fill();
        cx.fillStyle='#2a1a0a';
        cx.beginPath();cx.ellipse(0,legLen*.48+3*sc,legW*.52,5*sc,0,0,Math.PI*2);cx.fill();
        cx.restore();
        cx.restore();

        cx.save();
        cx.translate(bodyW+2, shoulderY+8*sc);
        cx.rotate(aAngR);
        cx.fillStyle = clothGrad(cx,-armW,0,armW,0,hd.oc,dk(hd.oc,.15));
        cx.beginPath();
        cx.moveTo(-armW*.7,0);
        cx.quadraticCurveTo(-armW*.9,armLen*.25,-armW*.6,armLen*.5);
        cx.lineTo(armW*.6,armLen*.5);
        cx.quadraticCurveTo(armW*.9,armLen*.25,armW*.7,0);
        cx.closePath(); cx.fill();
        cx.save();
        cx.translate(0,armLen*.48);
        cx.rotate(aAngR*.5);
        cx.fillStyle = skinGrad(cx,-armW*.5,0,armW*.5,armLen*.45);
        cx.beginPath();
        cx.moveTo(-armW*.5,0);
        cx.quadraticCurveTo(-armW*.4,armLen*.22,-armW*.35,armLen*.42);
        cx.lineTo(armW*.35,armLen*.42);
        cx.quadraticCurveTo(armW*.4,armLen*.22,armW*.5,0);
        cx.closePath(); cx.fill();
        cx.fillStyle='#e0b888';
        cx.beginPath();cx.arc(0,armLen*.44,5*sc,0,Math.PI*2);cx.fill();
        if(!isKick) drawDetailedWeapon(cx, hd.wt, hd.bc, armLen, sc);
        cx.restore();
        cx.restore();

        cx.fillStyle = skinGrad(cx,-5*sc,shoulderY,5*sc,shoulderY-neckH);
        cx.fillRect(-6*sc, shoulderY-neckH, 12*sc, neckH+2);

        cx.save();
        cx.translate(0, headY);
        cx.rotate(headTilt);
        drawDetailedHead(cx, hd, headR, sc, S);
        cx.restore();

        if (f.st === 'skill' && f.skAct) {
            cx.save();
            cx.globalAlpha = .3+Math.sin(af*.2)*.15;
            const skC = f.skAct.cl;
            const glow = cx.createRadialGradient(0,-Hh*.4,10*sc,0,-Hh*.4,90*sc+Math.sin(af*.3)*20);
            glow.addColorStop(0, skC);
            glow.addColorStop(.5, hexToRgba(skC,.3));
            glow.addColorStop(1, 'transparent');
            cx.fillStyle = glow;
            cx.fillRect(-100*sc,-Hh-20,200*sc,Hh+40);
            cx.restore();
        }

        cx.restore();

        cx.save();
        cx.textAlign='center';
        cx.font='bold 16px "Ma Shan Zheng",cursive';
        const nw = cx.measureText(f.hd.n).width+16;
        const nx = f.x, ny = f.y-f.h-10;
        cx.fillStyle = f.pn===1?'rgba(200,50,50,.6)':'rgba(50,100,200,.6)';
        rRect(cx,nx-nw/2,ny-12,nw,22,11);cx.fill();
        cx.fillStyle='#fff';
        cx.fillText(f.hd.n, nx, ny+4);
        cx.restore();
    }

    function drawDetailedHead(cx, hd, R, sc, S) {
        cx.save();
        let faceW = R*.9, faceH = R*1.05;
        if(hd.faceType==='heroic'||hd.faceType==='fierce'){faceW=R*1.0;faceH=R*.95;}
        else if(hd.faceType==='slim'||hd.faceType==='androgynous'||hd.faceType==='heroine'){faceW=R*.8;faceH=R*1.1;}
        else if(hd.faceType==='sly'||hd.faceType==='playful'){faceW=R*.95;faceH=R*.9;}
        const fG = cx.createRadialGradient(-R*.15,-R*.15,R*.2,0,0,R*1.1);
        fG.addColorStop(0,'#f5deb3');fG.addColorStop(.6,'#e8c494');fG.addColorStop(1,'#d2a679');
        cx.fillStyle=fG;
        cx.beginPath();
        cx.ellipse(0,0,faceW,faceH,0,0,Math.PI*2);
        cx.fill();
        cx.strokeStyle='rgba(180,140,100,.3)';cx.lineWidth=1;
        cx.beginPath();cx.ellipse(0,0,faceW,faceH,0,0,Math.PI*2);cx.stroke();

        cx.fillStyle='rgba(220,150,130,.15)';
        cx.beginPath();cx.ellipse(-faceW*.55,R*.15,R*.2,R*.15,0,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.ellipse(faceW*.55,R*.15,R*.2,R*.15,0,0,Math.PI*2);cx.fill();

        cx.save();
        cx.strokeStyle=hd.hc;
        cx.lineWidth=2.5*sc;
        cx.lineCap='round';
        if(hd.faceType==='heroic'||hd.faceType==='fierce'||hd.faceType==='determined'){
            cx.lineWidth=3.5*sc;
            cx.beginPath();cx.moveTo(-faceW*.6,-R*.35);cx.quadraticCurveTo(-faceW*.3,-R*.48,-faceW*.05,-R*.35);cx.stroke();
            cx.beginPath();cx.moveTo(faceW*.6,-R*.35);cx.quadraticCurveTo(faceW*.3,-R*.48,faceW*.05,-R*.35);cx.stroke();
        } else if(hd.faceType==='androgynous'||hd.faceType==='charming'||hd.faceType==='heroine'){
            cx.lineWidth=1.8*sc;
            cx.beginPath();cx.moveTo(-faceW*.55,-R*.3);cx.quadraticCurveTo(-faceW*.3,-R*.42,-faceW*.05,-R*.32);cx.stroke();
            cx.beginPath();cx.moveTo(faceW*.55,-R*.3);cx.quadraticCurveTo(faceW*.3,-R*.42,faceW*.05,-R*.32);cx.stroke();
        } else if(hd.faceType==='playful'&&hd.hairType==='mustache'){
            cx.lineWidth=2.5*sc;
            cx.beginPath();cx.moveTo(-faceW*.6,-R*.35);cx.lineTo(-faceW*.1,-R*.35);cx.stroke();
            cx.beginPath();cx.moveTo(faceW*.6,-R*.35);cx.lineTo(faceW*.1,-R*.35);cx.stroke();
            cx.beginPath();cx.moveTo(-faceW*.55,-R*.25);cx.lineTo(-faceW*.15,-R*.25);cx.stroke();
            cx.beginPath();cx.moveTo(faceW*.55,-R*.25);cx.lineTo(faceW*.15,-R*.25);cx.stroke();
        } else {
            cx.beginPath();cx.moveTo(-faceW*.55,-R*.32);cx.quadraticCurveTo(-faceW*.3,-R*.42,-faceW*.08,-R*.33);cx.stroke();
            cx.beginPath();cx.moveTo(faceW*.55,-R*.32);cx.quadraticCurveTo(faceW*.3,-R*.42,faceW*.08,-R*.33);cx.stroke();
        }
        cx.restore();

        const eyeY = -R*.12;
        const eyeXL = -faceW*.32, eyeXR = faceW*.32;
        const eyeW = R*.18, eyeH = R*.1;
        cx.fillStyle='#fff';
        cx.beginPath();cx.ellipse(eyeXL,eyeY,eyeW,eyeH,0,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.ellipse(eyeXR,eyeY,eyeW,eyeH,0,0,Math.PI*2);cx.fill();
        let irisColor = '#3a2a1a';
        if(hd.faceType==='cold'||hd.hairType==='white_long') irisColor='#556688';
        else if(hd.faceType==='androgynous') irisColor='#8b3a5a';
        else if(hd.faceType==='royal') irisColor='#4a6a3a';
        cx.fillStyle=irisColor;
        cx.beginPath();cx.arc(eyeXL+1,eyeY,eyeH*.8,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.arc(eyeXR+1,eyeY,eyeH*.8,0,Math.PI*2);cx.fill();
        cx.fillStyle='#111';
        cx.beginPath();cx.arc(eyeXL+1,eyeY,eyeH*.4,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.arc(eyeXR+1,eyeY,eyeH*.4,0,Math.PI*2);cx.fill();
        cx.fillStyle='rgba(255,255,255,.8)';
        cx.beginPath();cx.arc(eyeXL+eyeH*.3,eyeY-eyeH*.3,eyeH*.2,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.arc(eyeXR+eyeH*.3,eyeY-eyeH*.3,eyeH*.2,0,Math.PI*2);cx.fill();
        cx.strokeStyle='#3a2a1a';cx.lineWidth=1.2*sc;
        cx.beginPath();cx.ellipse(eyeXL,eyeY,eyeW*1.05,eyeH*1.1,0,0,Math.PI*2);cx.stroke();
        cx.beginPath();cx.ellipse(eyeXR,eyeY,eyeW*1.05,eyeH*1.1,0,0,Math.PI*2);cx.stroke();

        cx.strokeStyle='rgba(180,140,100,.5)';cx.lineWidth=1.5*sc;cx.lineCap='round';
        cx.beginPath();
        cx.moveTo(0,-R*.05);cx.lineTo(1*sc,R*.12);cx.lineTo(-2*sc,R*.15);
        cx.stroke();

        if(hd.faceType==='heroine'||hd.faceType==='androgynous'||hd.faceType==='charming'){
            cx.fillStyle='#cc6666';
            cx.beginPath();
            cx.moveTo(-R*.15,R*.32);cx.quadraticCurveTo(0,R*.25,R*.15,R*.32);
            cx.quadraticCurveTo(0,R*.42,-R*.15,R*.32);cx.fill();
        } else if(hd.faceType==='heroic'||hd.faceType==='fierce'){
            cx.strokeStyle='#a07050';cx.lineWidth=2*sc;
            cx.beginPath();cx.moveTo(-R*.15,R*.35);cx.lineTo(R*.15,R*.35);cx.stroke();
        } else if(hd.faceType==='sly'||hd.faceType==='playful'){
            cx.strokeStyle='#a07050';cx.lineWidth=1.5*sc;
            cx.beginPath();cx.moveTo(-R*.15,R*.33);cx.quadraticCurveTo(0,R*.38,R*.15,R*.3);cx.stroke();
        } else {
            cx.strokeStyle='#a07050';cx.lineWidth=1.5*sc;
            cx.beginPath();cx.moveTo(-R*.12,R*.35);cx.lineTo(R*.12,R*.35);cx.stroke();
        }

        if(hd.faceType==='mysterious'){
            cx.strokeStyle=hd.hc;cx.lineWidth=1*sc;
            for(let i=-2;i<=2;i++){
                cx.beginPath();cx.moveTo(i*R*.08,R*.45);cx.lineTo(i*R*.1,R*.65);cx.stroke();
            }
        }

        drawDetailedHair(cx, hd, R, sc, S);
        cx.restore();
    }

    function drawDetailedHair(cx, hd, R, sc, S) {

        } else if(ht==='shaved'){

            cx.globalAlpha=1;

            for(let row=0;row<3;row++)for(let col=0;col<3;col++){

    function drawOutfitDetail(cx, hd, bW, tH, sc) {
        if(hd.n==='郭靖'||hd.n==='萧峰'){
            cx.fillStyle=dk(hd.oc,.2);
            cx.beginPath();
            cx.moveTo(-bW*1.1,-tH*.3);cx.lineTo(bW*1.1,-tH*.3);
            cx.lineTo(bW*1.3,tH*.15);cx.lineTo(-bW*1.3,tH*.15);cx.fill();
        }
        if(hd.n==='东方不败'){
            cx.strokeStyle='#ff69b4';cx.lineWidth=1.5*sc;
            for(let i=-2;i<=2;i++){
                cx.beginPath();cx.moveTo(i*8*sc,-tH*.2);
                cx.quadraticCurveTo(i*10*sc,-tH*.5,i*8*sc,-tH*.8);cx.stroke();
            }
        }
        if(hd.n==='段誉'){
            cx.strokeStyle='#ffd700';cx.lineWidth=1*sc;
            cx.strokeRect(-bW*.6,-tH*.8,bW*1.2,tH*.6);
        }
        if(hd.n==='霍去病'||hd.n==='花木兰'){
            cx.strokeStyle=dk(hd.bc,.1);cx.lineWidth=2*sc;
            cx.strokeRect(-bW*1.0,-tH*.95,bW*2.0,tH*.9);
            cx.beginPath();cx.moveTo(-bW*.8,-tH*.5);cx.lineTo(bW*.8,-tH*.5);cx.stroke();
        }
        if(hd.n==='韦小宝'){
            cx.fillStyle='#ffd700';
            cx.beginPath();
            cx.arc(0,-tH*.5,bW*.4,0,Math.PI*2);
            cx.fill();
            cx.fillStyle=hd.oc;
            cx.beginPath();cx.arc(0,-tH*.5,bW*.3,0,Math.PI*2);cx.fill();
        }
        if(hd.n==='西门吹雪'||hd.n==='叶孤城'){
            cx.fillStyle=hd.oc2;
            cx.fillRect(-bW-8*sc,-tH*.3,4*sc,tH*.75);
            cx.fillRect(bW+4*sc,-tH*.3,4*sc,tH*.75);
        }
        if(hd.n==='虚竹'){
            cx.fillStyle='#8b4513';
            for(let i=0;i<8;i++){
                const a=Math.PI*2*i/8;
                cx.beginPath();
                cx.arc(Math.cos(a)*bW*.5,-tH*.5+Math.sin(a)*tH*.25,3*sc,0,Math.PI*2);cx.fill();
            }
        }
    }

    function drawDetailedWeapon(cx, wt, col, al, sc) {
        const y = al*.45;
        cx.save();
        if(wt==='sword'){
            const bg=cx.createLinearGradient(-2*sc,y-6*sc,3*sc,y+al*.45);
            bg.addColorStop(0,'#ddd');bg.addColorStop(.3,'#fff');bg.addColorStop(.7,'#aaa');bg.addColorStop(1,'#888');
            cx.fillStyle=bg;
            cx.beginPath();
            cx.moveTo(0,y-8*sc);cx.lineTo(2.5*sc,y);cx.lineTo(1.5*sc,y+al*.45);
            cx.lineTo(0,y+al*.48);cx.lineTo(-1.5*sc,y+al*.45);cx.lineTo(-2.5*sc,y);cx.closePath();cx.fill();
            cx.fillStyle='#ffd700';
            cx.fillRect(-6*sc,y-9*sc,12*sc,4*sc);
            cx.fillStyle=col;
            cx.fillRect(-3*sc,y-15*sc,6*sc,8*sc);
            cx.strokeStyle='#cc3333';cx.lineWidth=2*sc;
            cx.beginPath();cx.moveTo(2*sc,y-15*sc);
            cx.quadraticCurveTo(8*sc,y-10*sc,6*sc,y-2*sc);cx.stroke();
        } else if(wt==='heavysword'){
            const bg=cx.createLinearGradient(-6*sc,y-10*sc,6*sc,y+al*.5);
            bg.addColorStop(0,'#666');bg.addColorStop(.5,'#888');bg.addColorStop(1,'#444');
            cx.fillStyle=bg;
            cx.beginPath();
            cx.moveTo(-1*sc,y-12*sc);cx.lineTo(6*sc,y-8*sc);cx.lineTo(6*sc,y+al*.5);
            cx.lineTo(-6*sc,y+al*.5);cx.lineTo(-6*sc,y-8*sc);cx.closePath();cx.fill();
            cx.fillStyle='#aa8844';
            cx.fillRect(-8*sc,y-14*sc,16*sc,5*sc);
        } else if(wt==='palm'){
            const pg=cx.createRadialGradient(0,y+6*sc,0,0,y+6*sc,14*sc);
            pg.addColorStop(0,col);pg.addColorStop(.5,hexToRgba(col,.5));pg.addColorStop(1,'transparent');
            cx.fillStyle=pg;cx.beginPath();cx.arc(0,y+6*sc,14*sc,0,Math.PI*2);cx.fill();
        } else if(wt==='finger'){
            const fg=cx.createRadialGradient(0,y,0,0,y,10*sc);
            fg.addColorStop(0,'#ffffff');fg.addColorStop(.3,col);fg.addColorStop(1,'transparent');
            cx.fillStyle=fg;cx.beginPath();cx.arc(0,y,10*sc,0,Math.PI*2);cx.fill();
        } else if(wt==='dagger'){
            cx.fillStyle='#ccc';
            cx.beginPath();cx.moveTo(0,y-3*sc);cx.lineTo(3*sc,y+al*.18);cx.lineTo(-3*sc,y+al*.18);cx.closePath();cx.fill();
            cx.fillStyle='#a08060';cx.fillRect(-4*sc,y-6*sc,8*sc,5*sc);
        } else if(wt==='flyknife'){
            const kg=cx.createLinearGradient(-6*sc,y,6*sc,y);
            kg.addColorStop(0,'#ccc');kg.addColorStop(.5,'#fff');kg.addColorStop(1,'#aaa');
            cx.fillStyle=kg;
            cx.beginPath();cx.moveTo(0,y-8*sc);cx.lineTo(7*sc,y+4*sc);
            cx.lineTo(0,y+12*sc);cx.lineTo(-7*sc,y+4*sc);cx.closePath();cx.fill();
        } else if(wt==='flute'){
            const flG=cx.createLinearGradient(-2*sc,y-12*sc,2*sc,y+al*.5);
            flG.addColorStop(0,'#6b8f5e');flG.addColorStop(1,'#4a6e3f');
            cx.fillStyle=flG;cx.fillRect(-2*sc,y-12*sc,4*sc,al*.55);
            cx.fillStyle='#2a3a1a';
            for(let i=0;i<5;i++) cx.fillRect(-1*sc,y-8*sc+i*8*sc,2*sc,2*sc);
        } else if(wt==='needle'){
            cx.strokeStyle='#ddd';cx.lineWidth=1.5*sc;
            for(let i=-2;i<=2;i++){
                cx.beginPath();cx.moveTo(i*4*sc,y-4*sc);cx.lineTo(i*4*sc,y+16*sc);cx.stroke();
            }
        } else if(wt==='fan'){
            cx.fillStyle=col;
            cx.beginPath();cx.moveTo(0,y+8*sc);cx.arc(0,y+8*sc,18*sc,-.9,.9);cx.closePath();cx.fill();
            cx.strokeStyle='#ddd';cx.lineWidth=1*sc;
            for(let i=-3;i<=3;i++){
                cx.beginPath();cx.moveTo(0,y+8*sc);
                cx.lineTo(Math.cos(i*.2)*18*sc,y+8*sc-Math.sin(i*.2)*18*sc);cx.stroke();
            }
        } else if(wt==='spear'){
            cx.fillStyle='#8d6e63';cx.fillRect(-2*sc,y-20*sc,4*sc,al*.7);
            const spG=cx.createLinearGradient(0,y-24*sc,0,y-14*sc);
            spG.addColorStop(0,'#ddd');spG.addColorStop(1,'#999');
            cx.fillStyle=spG;
            cx.beginPath();cx.moveTo(0,y-26*sc);cx.lineTo(6*sc,y-14*sc);cx.lineTo(-6*sc,y-14*sc);cx.closePath();cx.fill();
            cx.fillStyle='#cc0000';
            cx.beginPath();cx.arc(0,y-14*sc,5*sc,0,Math.PI*2);cx.fill();
        }
        cx.restore();
    }

    function drawAfterimages() {
        afterimages.forEach(a => {
            cx.save();
            const lifeRatio = a.life / 20;
            cx.globalAlpha = a.alpha * lifeRatio;
            const s = a.scale || 1.0;
            cx.translate(a.x, a.y); cx.scale(a.face, 1);
            // Outer glow
            cx.globalAlpha = a.alpha * lifeRatio * .2;
            const ag = cx.createRadialGradient(0, -60*s, 0, 0, -60*s, 80*s);
            ag.addColorStop(0, a.hd.oc || '#888'); ag.addColorStop(1, 'transparent');
            cx.fillStyle = ag;
            cx.beginPath(); cx.arc(0, -60*s, 80*s, 0, Math.PI*2); cx.fill();
            // Body
            cx.globalAlpha = a.alpha * lifeRatio;
            cx.fillStyle = (a.hd.oc || '#888') + '77';
            cx.beginPath();
            cx.moveTo(-28*s, -110*s);
            cx.quadraticCurveTo(-32*s,-60*s,-25*s,0);
            cx.lineTo(25*s,0);
            cx.quadraticCurveTo(32*s,-60*s,28*s,-110*s);
            cx.closePath(); cx.fill();
            cx.fillStyle = '#deb88788';
            cx.beginPath(); cx.arc(0, -125*s, 16*s, 0, Math.PI*2); cx.fill();
            cx.restore();
        });
    }
    function drawProj() {
        const now = performance.now();
        projectiles.forEach(p => {
            cx.save();
            cx.translate(p.x, p.y);
            const sh = p.shape || 'orb';
            const t = (now - (p.born||now)) / 1000;

            if (sh === 'dragon') {
                const seg = p.seg || 0;
                const osc = Math.sin(t * 8 + seg * 1.2) * 12;
                cx.translate(0, osc);
                for (let tr = 1; tr <= 5; tr++) {
                    cx.globalAlpha = .12 - tr * .02;
                    const tg = cx.createRadialGradient(-p.vx*tr*2, 0, 0, -p.vx*tr*2, 0, p.sz*(1-tr*.12));
                    tg.addColorStop(0, '#ff6600'); tg.addColorStop(1, 'transparent');
                    cx.fillStyle = tg;
                    cx.beginPath(); cx.arc(-p.vx*tr*2, 0, p.sz*(1-tr*.12), 0, Math.PI*2); cx.fill();
                }
                cx.globalAlpha = .95;
                if (seg === 0) {
                    const dir = p.vx > 0 ? 1 : -1;
                    const hg = cx.createRadialGradient(0, 0, 0, 0, 0, p.sz*1.5);
                    hg.addColorStop(0, '#ffcc00'); hg.addColorStop(.4, '#ff8800'); hg.addColorStop(1, 'transparent');
                    cx.fillStyle = hg; cx.beginPath(); cx.arc(0, 0, p.sz*1.5, 0, Math.PI*2); cx.fill();
                    cx.fillStyle = '#ff9900';
                    cx.beginPath();
                    cx.moveTo(dir * p.sz * 1.2, 0);
                    cx.quadraticCurveTo(dir * p.sz * .6, -p.sz * .8, -dir * p.sz * .3, -p.sz * .5);
                    cx.quadraticCurveTo(-dir * p.sz * .5, 0, -dir * p.sz * .3, p.sz * .5);
                    cx.quadraticCurveTo(dir * p.sz * .6, p.sz * .8, dir * p.sz * 1.2, 0);
                    cx.closePath(); cx.fill();
                    cx.fillStyle = '#ffd700';
                    cx.beginPath();
                    cx.moveTo(dir * p.sz * .2, -p.sz * .5);
                    cx.lineTo(dir * p.sz * .5, -p.sz * 1.1);
                    cx.lineTo(dir * p.sz * .7, -p.sz * .4);
                    cx.closePath(); cx.fill();
                    cx.beginPath();
                    cx.moveTo(-dir * p.sz * .1, -p.sz * .4);
                    cx.lineTo(0, -p.sz * 1.0);
                    cx.lineTo(dir * p.sz * .3, -p.sz * .35);
                    cx.closePath(); cx.fill();
                    cx.fillStyle = '#ff0000';
                    cx.beginPath(); cx.arc(dir * p.sz * .6, -p.sz * .2, p.sz * .12, 0, Math.PI*2); cx.fill();
                    cx.fillStyle = '#fff';
                    cx.beginPath(); cx.arc(dir * p.sz * .65, -p.sz * .22, p.sz * .05, 0, Math.PI*2); cx.fill();
                    cx.strokeStyle = '#ffcc44'; cx.lineWidth = 2;
                    cx.beginPath(); cx.moveTo(dir * p.sz * 1.1, -p.sz * .1);
                    cx.quadraticCurveTo(dir * p.sz * 1.6, -p.sz * .5 + Math.sin(t*10)*5, dir * p.sz * 1.8, -p.sz * .2);
                    cx.stroke();
                    cx.beginPath(); cx.moveTo(dir * p.sz * 1.1, p.sz * .1);
                    cx.quadraticCurveTo(dir * p.sz * 1.6, p.sz * .5 + Math.sin(t*10+1)*5, dir * p.sz * 1.8, p.sz * .2);
                    cx.stroke();
                    cx.fillStyle = '#ff3300';
                    for (let f = 0; f < 4; f++) {
                        const fx = dir * (p.sz * 1.2 + Math.random() * 15);
                        const fy = (Math.random() - .5) * p.sz * .6;
                        cx.globalAlpha = .6 + Math.random() * .3;
                        cx.beginPath(); cx.arc(fx, fy, 4 + Math.random() * 5, 0, Math.PI*2); cx.fill();
                    }
                } else {
                    const bodyR = p.sz * (.8 - seg * .08);
                    const bg = cx.createRadialGradient(0, 0, 0, 0, 0, bodyR);
                    bg.addColorStop(0, '#ffcc33'); bg.addColorStop(.5, '#ee8800'); bg.addColorStop(1, '#cc5500');
                    cx.fillStyle = bg;
                    cx.beginPath(); cx.ellipse(0, 0, bodyR * 1.3, bodyR, 0, 0, Math.PI*2); cx.fill();
                    cx.strokeStyle = '#ffd70066'; cx.lineWidth = 1;
                    for (let s = -2; s <= 2; s++) {

                cx.lineTo(p.x + p.sz*2, p.y - p.sz);
                cx.lineTo(p.x + p.sz*3, p.y + p.sz*.5);
                cx.lineTo(p.x + p.sz*5, p.y - p.sz*.3);
                cx.stroke();
            } else if (sh === 'vortex') {
                cx.translate(p.x, p.y);
                cx.globalAlpha = a * .6;
                cx.strokeStyle = p.cl; cx.lineWidth = 2;
                cx.beginPath();
                for (let v = 0; v < 20; v++) {
                    const va = v * .4 + t * 6;
                    const vr = v * p.sz * .08;
                    const vx = Math.cos(va) * vr, vy = Math.sin(va) * vr;
                    if (v === 0) cx.moveTo(vx, vy); else cx.lineTo(vx, vy);
                }
                cx.stroke();
            } else if (sh === 'catchflash') {
                cx.translate(p.x, p.y);
                cx.globalAlpha = a * .6;
                const flashR = p.sz * (1 + (1-p.life/20)*.5);
                const fg = cx.createRadialGradient(0, 0, 0, 0, 0, flashR);
                fg.addColorStop(0, '#fff'); fg.addColorStop(.3, p.cl); fg.addColorStop(1, 'transparent');
                cx.fillStyle = fg;
                cx.beginPath(); cx.arc(0, 0, flashR, 0, Math.PI*2); cx.fill();
                cx.strokeStyle = '#fff'; cx.lineWidth = 2;
                for (let l = 0; l < 8; l++) {
                    const la = l * Math.PI/4;
                    cx.beginPath();
                    cx.moveTo(Math.cos(la)*flashR*.3, Math.sin(la)*flashR*.3);
                    cx.lineTo(Math.cos(la)*flashR*.9, Math.sin(la)*flashR*.9);
                    cx.stroke();
                }
            } else if (sh === 'wave') {
                cx.translate(p.x, p.y);
                cx.globalAlpha = a * .5;
                cx.strokeStyle = p.cl; cx.lineWidth = 2.5; cx.lineCap = 'round';
                cx.beginPath();
                for (let w = 0; w < 12; w++) {
                    const wx = (w-6) * p.sz * .5;
                    const wy = Math.sin(w + t*6) * p.sz * .6;
                    if (w === 0) cx.moveTo(wx, wy); else cx.lineTo(wx, wy);
                }
                cx.stroke();
                cx.strokeStyle = '#fff'; cx.lineWidth = 1;
                cx.beginPath();
                for (let w = 0; w < 12; w++) {
                    const wx = (w-6) * p.sz * .4;
                    const wy = Math.sin(w + t*6 + .5) * p.sz * .4;
                    if (w === 0) cx.moveTo(wx, wy); else cx.lineTo(wx, wy);
                }
                cx.stroke();
            } else if (sh === 'snowflake') {
                cx.translate(p.x, p.y);
                cx.rotate(t * .8);
                cx.globalAlpha = a * .7;
                cx.strokeStyle = p.cl; cx.lineWidth = 1.5; cx.lineCap = 'round';
                const sr = p.sz;
                for (let b = 0; b < 6; b++) {
                    const ba = b * Math.PI/3;
                    cx.beginPath();
                    cx.moveTo(0, 0);
                    cx.lineTo(Math.cos(ba)*sr, Math.sin(ba)*sr);
                    cx.stroke();
                    cx.beginPath();
                    cx.moveTo(Math.cos(ba)*sr*.5, Math.sin(ba)*sr*.5);
                    cx.lineTo(Math.cos(ba+.4)*sr*.7, Math.sin(ba+.4)*sr*.7);
                    cx.stroke();
                    cx.beginPath();
                    cx.moveTo(Math.cos(ba)*sr*.5, Math.sin(ba)*sr*.5);
                    cx.lineTo(Math.cos(ba-.4)*sr*.7, Math.sin(ba-.4)*sr*.7);
                    cx.stroke();
                }
                cx.fillStyle = '#fff'; cx.globalAlpha = a*.5;
                cx.beginPath(); cx.arc(0, 0, sr*.2, 0, Math.PI*2); cx.fill();
            } else if (sh === 'lotus') {
                cx.translate(p.x, p.y);
                cx.globalAlpha = a * .7;
                const lr = p.sz;
                for (let lp = 0; lp < 8; lp++) {
                    cx.save();
                    cx.rotate(lp * Math.PI/4 + t*.5);
                    cx.fillStyle = lp%2===0 ? p.cl : hexToRgba(p.cl,.6);
                    cx.beginPath();
                    cx.moveTo(0, 0);
                    cx.quadraticCurveTo(lr*.5, -lr*.6, 0, -lr*1.2);
                    cx.quadraticCurveTo(-lr*.5, -lr*.6, 0, 0);
                    cx.closePath(); cx.fill();
                    cx.restore();
                }
                cx.fillStyle = '#ffd700'; cx.globalAlpha = a;
                cx.beginPath(); cx.arc(0, 0, lr*.25, 0, Math.PI*2); cx.fill();
            } else if (sh === 'mist') {
                cx.globalAlpha = a * .25;
                const mg = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.sz*2);
                mg.addColorStop(0, p.cl); mg.addColorStop(.5, hexToRgba(p.cl,.15)); mg.addColorStop(1, 'transparent');
                cx.fillStyle = mg;
                cx.beginPath(); cx.arc(p.x, p.y, p.sz*2, 0, Math.PI*2); cx.fill();
                cx.globalAlpha = a * .35;
                cx.beginPath(); cx.arc(p.x + p.sz*.3, p.y - p.sz*.2, p.sz, 0, Math.PI*2); cx.fill();
            } else if (sh === 'smoke') {
                cx.globalAlpha = a * .3;
                const sg = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.sz*1.5);
                sg.addColorStop(0, p.cl); sg.addColorStop(.7, hexToRgba(p.cl,.1)); sg.addColorStop(1, 'transparent');
                cx.fillStyle = sg;
                cx.beginPath(); cx.arc(p.x, p.y, p.sz*1.5, 0, Math.PI*2); cx.fill();
                cx.beginPath(); cx.arc(p.x+p.sz*.4, p.y-p.sz*.3, p.sz, 0, Math.PI*2); cx.fill();
                cx.beginPath(); cx.arc(p.x-p.sz*.3, p.y+p.sz*.2, p.sz*.8, 0, Math.PI*2); cx.fill();
            } else if (sh === 'deathline') {
                cx.translate(p.x, p.y);
                cx.globalAlpha = a * .4;
                const dgg = cx.createRadialGradient(0,0,0,0,0,p.sz*.8);
                dgg.addColorStop(0, '#ffffff'); dgg.addColorStop(.5, '#ff4444'); dgg.addColorStop(1, 'transparent');
                cx.fillStyle = dgg;
                cx.beginPath(); cx.arc(0,0,p.sz*.8,0,Math.PI*2); cx.fill();
                cx.globalAlpha = a * .95;
                const dw = p.sz * 3;
                const lg = cx.createLinearGradient(-dw, 0, dw, 0);
                lg.addColorStop(0, 'transparent'); lg.addColorStop(.2, hexToRgba(p.cl,.3)); lg.addColorStop(.4, p.cl); lg.addColorStop(.5, '#fff'); lg.addColorStop(.6, p.cl); lg.addColorStop(.8, hexToRgba(p.cl,.3)); lg.addColorStop(1, 'transparent');
                cx.strokeStyle = lg; cx.lineWidth = 8;
                cx.beginPath(); cx.moveTo(-dw, 0); cx.lineTo(dw, 0); cx.stroke();
                cx.strokeStyle = '#fff'; cx.lineWidth = 3;
                cx.beginPath(); cx.moveTo(-dw*.9, 0); cx.lineTo(dw*.9, 0); cx.stroke();
                cx.strokeStyle = hexToRgba('#ff4444',.6); cx.lineWidth = 14;
                cx.beginPath(); cx.moveTo(-dw*.7, 0); cx.lineTo(dw*.7, 0); cx.stroke();
            } else {
                cx.globalAlpha = a*.35;
                cx.fillStyle = p.cl;
                cx.beginPath(); cx.arc(p.x,p.y,p.sz*2.2,0,Math.PI*2); cx.fill();
                cx.globalAlpha = a;
                const dg = cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz);
                dg.addColorStop(0, '#fff'); dg.addColorStop(.5, p.cl); dg.addColorStop(1, hexToRgba(p.cl,.3));
                cx.fillStyle = dg;
                cx.beginPath(); cx.arc(p.x,p.y,p.sz,0,Math.PI*2); cx.fill();
                cx.globalAlpha = a*.9;
                cx.fillStyle = '#fff';
                cx.beginPath(); cx.arc(p.x,p.y,p.sz*.3,0,Math.PI*2); cx.fill();
            }
            cx.restore();
        });
    }

    function drawControls() {
        if (scene !== 'battle') return;
        cx.save();

        function drawJoystick(j) {
            if (!j) return;
            cx.save();
            cx.shadowBlur = 8;
            cx.shadowColor = '#ffd966';
            cx.beginPath();
            cx.arc(j.x, j.y, j.r, 0, Math.PI * 2);
            cx.strokeStyle = '#ffd966';
            cx.lineWidth = 3;
            cx.stroke();
            cx.fillStyle = 'rgba(30,30,60,0.75)';
            cx.fill();
            const kx = j.x + (j.kx || 0) * j.r * 0.7;
            const ky = j.y + (j.ky || 0) * j.r * 0.7;
            cx.beginPath();
            cx.arc(kx, ky, j.r * 0.4, 0, Math.PI * 2);
            cx.fillStyle = '#ffaa44';
            cx.fill();
            cx.shadowBlur = 0;
            cx.restore();
        }

        function drawBtn(b) {
            if (!b) return;
            cx.save();
            cx.shadowBlur = 6;
            cx.shadowColor = 'rgba(0,0,0,0.6)';
            cx.beginPath();
            cx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            let color;
            if (b.act === 'lp') color = '#ffaa44';
            else if (b.act === 'lk') color = '#44ffaa';
            else if (b.act === 'bl') color = '#44aaff';
            else if (b.act === 'jp') color = '#ff8844';
            else color = '#ffd966';
            cx.fillStyle = color;
            cx.fill();
            cx.strokeStyle = '#fff6d0';
            cx.lineWidth = 3;
            cx.stroke();
            cx.fillStyle = '#fff3cc';
            cx.font = `bold ${Math.floor(b.r * 0.5)}px "Ma Shan Zheng", cursive`;
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            cx.fillText(b.label || b.act, b.x, b.y);
            cx.restore();
        }

        function drawSkBtns(btns, f) {
            if (!btns || !f) return;
            btns.forEach((b, i) => {
                if (i >= f.hd.sk.length) return;
                const sk = f.hd.sk[i];
                const locked = f.en < sk.c;
                cx.save();
                cx.shadowBlur = 4;
                cx.shadowColor = 'rgba(0,0,0,0.5)';
                cx.globalAlpha = locked ? 0.5 : 0.95;
                rRect(cx, b.x, b.y, b.w, b.h, 8);
                cx.fillStyle = locked ? '#aa9966' : '#f5bc4e';
                cx.fill();
                cx.strokeStyle = '#ffdd99';
                cx.lineWidth = 2;
                cx.stroke();
                cx.fillStyle = '#fffbe6';
                cx.font = `bold ${Math.min(b.w * 0.25, 17)}px "Ma Shan Zheng", cursive`;
                cx.textAlign = 'center';
                cx.textBaseline = 'middle';
                cx.fillText(sk.n, b.x + b.w / 2, b.y + b.h / 2);
                if (locked) {
                    cx.fillStyle = '#ccaa88';
                    cx.font = '12px "Ma Shan Zheng"';
                    cx.fillText('⚡', b.x + b.w - 14, b.y + b.h - 10);
                }
                cx.restore();
            });
        }

        drawJoystick(zones.j1);
        drawJoystick(zones.j2);
        if (zones.p1btns) zones.p1btns.forEach(b => drawBtn(b));
        if (zones.p2btns) zones.p2btns.forEach(b => drawBtn(b));
        if (fighters[0] && zones.p1sk) drawSkBtns(zones.p1sk, fighters[0]);
        if (fighters[1] && zones.p2sk) drawSkBtns(zones.p2sk, fighters[1]);

        cx.restore();
    }

    function updateHUD() {
        const f1=fighters[0],f2=fighters[1];
        if(!f1||!f2) return;
        document.getElementById('hud').style.display='block';
        document.getElementById('hf1').style.width=(f1.hp/f1.mhp*100)+'%';
        document.getElementById('hf2').style.width=(f2.hp/f2.mhp*100)+'%';
