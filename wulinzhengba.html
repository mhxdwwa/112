            else el.classList.remove('show');
        });
    }

    function drawMiniChar(ctx, h, s) {
        ctx.clearRect(0, 0, s, s);
        const sc = h.scale || 1.0;
        ctx.save();
        ctx.translate(s/2, s/2);
        ctx.beginPath();
        ctx.arc(0, 0, s/2 - 4, 0, Math.PI*2);
        ctx.fillStyle = h.bc || '#6d4c41';
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();

        const headR = s * 0.28;
        ctx.beginPath();
        ctx.arc(0, -headR*0.1, headR, 0, Math.PI*2);
        ctx.fillStyle = '#f5deb3';
        ctx.fill();
        ctx.strokeStyle = '#b87c4f';
        ctx.lineWidth = 1;
        ctx.stroke();

        const eyeSize = headR * 0.18;
        ctx.fillStyle = '#2c1a0c';
        ctx.beginPath();
        ctx.arc(-headR*0.35, -headR*0.25, eyeSize, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(headR*0.35, -headR*0.25, eyeSize, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-headR*0.4, -headR*0.3, eyeSize*0.35, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(headR*0.3, -headR*0.3, eyeSize*0.35, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = '#3a2a1a';
        ctx.lineWidth = 2;
        if (h.faceType === 'heroic' || h.faceType === 'fierce') {
            ctx.beginPath(); ctx.moveTo(-headR*0.55, -headR*0.45); ctx.lineTo(-headR*0.2, -headR*0.5); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(headR*0.55, -headR*0.45); ctx.lineTo(headR*0.2, -headR*0.5); ctx.stroke();
        } else if (h.faceType === 'melancholy') {
            ctx.beginPath(); ctx.moveTo(-headR*0.5, -headR*0.4); ctx.lineTo(-headR*0.2, -headR*0.48); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(headR*0.5, -headR*0.4); ctx.lineTo(headR*0.2, -headR*0.48); ctx.stroke();
        } else {
            ctx.beginPath(); ctx.moveTo(-headR*0.45, -headR*0.45); ctx.lineTo(-headR*0.2, -headR*0.45); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(headR*0.45, -headR*0.45); ctx.lineTo(headR*0.2, -headR*0.45); ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, -headR*0.05, headR*0.25, 0, Math.PI);
        ctx.strokeStyle = '#a55a3a';
        ctx.stroke();

        const hairColor = h.hc || '#4a2a1a';
        ctx.fillStyle = hairColor;
        const ht = h.hairType;
        if (ht === 'swordman') {
            ctx.fillRect(-headR*0.7, -headR*0.6, headR*1.4, headR*0.5);
            ctx.beginPath(); ctx.moveTo(0, -headR*0.8); ctx.lineTo(-headR*0.2, -headR*0.6); ctx.lineTo(headR*0.2, -headR*0.6); ctx.fill();
        } else if (ht === 'topknot') {
            ctx.beginPath(); ctx.arc(0, -headR*0.7, headR*0.28, 0, Math.PI*2); ctx.fill();
        } else if (ht === 'long') {
            ctx.fillRect(-headR*0.75, -headR*0.6, headR*1.5, headR*0.5);
            ctx.fillRect(-headR*0.8, -headR*0.3, headR*0.2, headR*0.4);
            ctx.fillRect(headR*0.6, -headR*0.3, headR*0.2, headR*0.4);
        } else if (ht === 'wild') {
            for (let i=-2;i<=2;i++) {
                ctx.beginPath(); ctx.moveTo(i*headR*0.2, -headR*0.6);
                ctx.lineTo(i*headR*0.3, -headR*0.9); ctx.lineTo(i*headR*0.15, -headR*0.6); ctx.fill();
            }
        } else if (ht === 'crown') {
            ctx.fillStyle = '#ffd700';
            ctx.beginPath(); ctx.moveTo(-headR*0.3, -headR*0.75); ctx.lineTo(0, -headR*1.0); ctx.lineTo(headR*0.3, -headR*0.75); ctx.fill();
            ctx.fillStyle = hairColor;
            ctx.fillRect(-headR*0.7, -headR*0.6, headR*1.4, headR*0.5);
        } else if (ht === 'shaved') {
            ctx.fillRect(-headR*0.7, -headR*0.5, headR*1.4, headR*0.4);
            for (let i=0;i<3;i++) {
                ctx.beginPath(); ctx.arc(-headR*0.3 + i*headR*0.3, -headR*0.75, headR*0.08, 0, Math.PI*2); ctx.fill();
            }
        } else if (ht === 'queue') {
            ctx.fillRect(-headR*0.7, -headR*0.6, headR*1.4, headR*0.5);
            ctx.beginPath(); ctx.moveTo(headR*0.5, -headR*0.2); ctx.quadraticCurveTo(headR*0.8, 0, headR*0.6, headR*0.3); ctx.fill();
        } else {
            ctx.fillRect(-headR*0.7, -headR*0.6, headR*1.4, headR*0.5);
        }

        const wt = h.wt;
        if (wt === 'sword') {
            ctx.beginPath(); ctx.moveTo(headR*0.5, headR*0.4); ctx.lineTo(headR*0.9, headR*0.1); ctx.lineTo(headR*0.6, -headR*0.1); ctx.fillStyle = '#aaa'; ctx.fill();
        } else if (wt === 'palm') {
            ctx.beginPath(); ctx.arc(headR*0.6, headR*0.2, headR*0.12, 0, Math.PI*2); ctx.fillStyle = '#ffaa66'; ctx.fill();
        } else if (wt === 'spear') {
            ctx.fillRect(headR*0.4, headR*0.2, headR*0.5, headR*0.08); ctx.fillStyle = '#c99';
            ctx.beginPath(); ctx.moveTo(headR*0.7, headR*0.2); ctx.lineTo(headR*0.8, headR*0.35); ctx.lineTo(headR*0.9, headR*0.2); ctx.fill();
        } else if (wt === 'dagger') {
            ctx.fillRect(headR*0.5, headR*0.15, headR*0.4, headR*0.08); ctx.fillStyle = '#ccc';
        } else if (wt === 'flyknife') {
            ctx.beginPath(); ctx.moveTo(headR*0.65, headR*0.2); ctx.lineTo(headR*0.85, headR*0.05); ctx.lineTo(headR*0.7, -headR*0.05); ctx.fill();
        } else if (wt === 'flute') {
            ctx.fillRect(headR*0.5, headR*0.1, headR*0.5, headR*0.06); ctx.fillStyle = '#8b5a2b';
        } else if (wt === 'needle') {
            ctx.fillRect(headR*0.55, headR*0.1, headR*0.4, headR*0.04); ctx.fillStyle = '#dddddd';
        } else if (wt === 'fan') {
            ctx.beginPath(); ctx.ellipse(headR*0.7, headR*0.2, headR*0.12, headR*0.06, 0, 0, Math.PI*2); ctx.fillStyle = '#ffcc88'; ctx.fill();
        }

        ctx.restore();
    }
    function buildSelect() {
        ['p1','p2'].forEach((p,pi)=>{
            const g=document.getElementById('g'+p); g.innerHTML='';
            H_DATA.forEach((h,i)=>{
                const c=document.createElement('div'); c.className='hcard'; c.dataset.i=i;
                const cv2=document.createElement('canvas'); cv2.width=80; cv2.height=80;
                drawMiniChar(cv2.getContext('2d'),h,80);
                c.appendChild(cv2);
                const nm=document.createElement('div'); nm.className='hn'; nm.textContent=h.n;
                c.appendChild(nm);
                let cardTouched=false;
                c.addEventListener('touchend',(e)=>{e.preventDefault();e.stopPropagation();cardTouched=true;pickHero(p,i);setTimeout(()=>{cardTouched=false;},300);},{passive:false});
                c.addEventListener('click',()=>{if(!cardTouched)pickHero(p,i);});
                g.appendChild(c);
            });
        });
    }
    function pickHero(p,i) {
        sfx('select');
        if(p==='p1'){selP1=i;updSel('p1',i);}else{selP2=i;updSel('p2',i);}
        document.getElementById('btnFight').disabled=(selP1<0||selP2<0);
    }
    function updSel(p,i) {
        document.querySelectorAll('#g'+p+' .hcard').forEach(c=>{
            c.classList.remove('sp1','sp2');
            if(+c.dataset.i===i) c.classList.add(p==='p1'?'sp1':'sp2');
        });
        const h=H_DATA[i];
        document.getElementById('i'+p).innerHTML=
            `<h3>${h.n} <span style="color:#999;font-size:13px">${h.f}</span></h3>`+
            `<p style="margin-bottom:8px">${h.d}</p>`+
            h.sk.map(s=>`<p class="sk"><b>${s.n}</b> · 消耗 ${s.c} 气 · 伤害 ${s.dm}</p>`).join('');
    }

    function initQuizCanvas() {
        const qc = document.getElementById('quizCanvas');
        const body = document.getElementById('quizBody');
        qc.width = body.clientWidth || 1400;
        qc.height = body.clientHeight || 650;
        quizCtx = qc.getContext('2d');
        quizCtx.lineCap = 'round';
        quizCtx.lineJoin = 'round';
    }
    function showQuiz() {
        if (quizIndex >= quizImages.length) return;
        if (quizActive) return;
        quizActive = true;
        battlePaused = true;
        const f1 = fighters[0], f2 = fighters[1];
        if (f1.hp < f2.hp) quizAnswerer = 1;
        else if (f2.hp < f1.hp) quizAnswerer = 2;
        else quizAnswerer = Math.random() < 0.5 ? 1 : 2;
        const ht = document.getElementById('quizHeaderText');
        if (quizAnswerer === 1) {
            ht.textContent = '🔴 红方修炼中 🔴';
            ht.className = 'quiz-header-text red';
        } else {
            ht.textContent = '🔵 蓝方修炼中 🔵';
            ht.className = 'quiz-header-text blue';
        }
        document.getElementById('quizImg').src = quizImages[quizIndex];
        const overlay = document.getElementById('quiz-overlay');
        overlay.style.display = 'flex';
        overlay.classList.add('active');
        document.getElementById('quizJudge').classList.remove('show');
        document.getElementById('btnSubmit').style.display = '';
        quizEraserMode = false;
        document.getElementById('btnEraser').classList.remove('active');
        setTimeout(() => {
            initQuizCanvas();
            quizCtx.clearRect(0, 0, quizCtx.canvas.width, quizCtx.canvas.height);
        }, 50);
    }
    function hideQuiz() {
        quizActive = false;
        battlePaused = false;
        document.getElementById('quiz-overlay').style.display = 'none';
        document.getElementById('quiz-overlay').classList.remove('active');
        quizTimer = 0;
    }
    function quizCorrectAnswer() {
        const fi = quizAnswerer - 1;
        const f = fighters[fi];
        if (f && !f.dead) {
            f.hp = Math.min(f.mhp, f.hp + Math.floor(f.mhp * 0.2));
            f.ghp = Math.min(f.mhp, Math.max(f.ghp, f.hp));
            f.en = Math.min(f.men, f.en + Math.floor(f.men * 0.5));
        }
        quizIndex++;
        hideQuiz();
        announce(quizAnswerer === 1 ? '红方修炼成功!' : '蓝方修炼成功!', 60);
    }
    function quizWrongAnswer() {
        const fi = quizAnswerer - 1;
        const f = fighters[fi];
        if (f && !f.dead) {
            f.hp = Math.max(0, f.hp - Math.floor(f.mhp * 0.1));
            f.ghp = Math.max(f.hp, f.ghp);
            f.en = 0;
            if (f.hp <= 0) { f.dead = true; f.setSt('defeat', 200); sfx('ko'); }
        }
        quizIndex++;
        hideQuiz();
        announce('修炼失败!', 50);
    }
    function setupQuizDrawing() {
        const qc = document.getElementById('quizCanvas');
        function getPos(e) {
            const rect = qc.getBoundingClientRect();
            const scaleX = qc.width / rect.width;
            const scaleY = qc.height / rect.height;
            if (e.touches && e.touches.length > 0) {
                return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
            }
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }
        function startDraw(e) {
            e.preventDefault(); e.stopPropagation();
            quizDrawing = true;
            const pos = getPos(e);
            quizLastX = pos.x; quizLastY = pos.y;
            if (!quizCtx) return;
            quizCtx.beginPath();
            quizCtx.moveTo(pos.x, pos.y);
        }
        function moveDraw(e) {
            if (!quizDrawing || !quizCtx) return;
            e.preventDefault(); e.stopPropagation();
            const pos = getPos(e);
            if (quizEraserMode) {
                quizCtx.save();
                quizCtx.globalCompositeOperation = 'destination-out';
                quizCtx.lineWidth = quizPenSize * 5;
                quizCtx.strokeStyle = 'rgba(0,0,0,1)';
                quizCtx.beginPath();
                quizCtx.moveTo(quizLastX, quizLastY);
                quizCtx.lineTo(pos.x, pos.y);
                quizCtx.stroke();
                quizCtx.restore();
            } else {
                quizCtx.strokeStyle = quizPenColor;
                quizCtx.lineWidth = quizPenSize;
                quizCtx.globalCompositeOperation = 'source-over';
                quizCtx.beginPath();
                quizCtx.moveTo(quizLastX, quizLastY);
                quizCtx.lineTo(pos.x, pos.y);
                quizCtx.stroke();
            }
            quizLastX = pos.x; quizLastY = pos.y;
        }
        function endDraw(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            quizDrawing = false;
        }
        qc.addEventListener('mousedown', startDraw);
        qc.addEventListener('mousemove', moveDraw);
        qc.addEventListener('mouseup', endDraw);
        qc.addEventListener('mouseleave', endDraw);
        qc.addEventListener('touchstart', startDraw, { passive: false });
        qc.addEventListener('touchmove', moveDraw, { passive: false });
        qc.addEventListener('touchend', endDraw, { passive: false });
        qc.addEventListener('touchcancel', endDraw, { passive: false });
    }

    function startBattle() {
        document.getElementById('gc').style.pointerEvents='auto';
        resize(); GY=H*.68;
        fighters[0]=new Fighter(selP1,1);
        fighters[1]=new Fighter(selP2,2);
        fighters[0].x = Math.max(50, Math.min(W - 50, W * 0.28));
        fighters[1].x = Math.max(50, Math.min(W - 50, W * 0.72));
        fighters[0].y = GY;
        fighters[1].y = GY;
        particles=[]; projectiles=[]; afterimages=[];
        quizTimer=0; quizActive=false; quizIndex = 0; // 重置题目索引
        battlePaused=false; scene='battle';
        document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('active'));
        document.getElementById('hud').style.display='block';
        calcZones();
        document.addEventListener('touchstart', onTS, { passive: false });
        document.addEventListener('touchmove', onTM, { passive: false });
        document.addEventListener('touchend', onTE, { passive: false });
        document.addEventListener('touchcancel', onTE, { passive: false });
        document.addEventListener('touchcancel', onTC);
        cv.addEventListener('mousedown', onMD, { passive: false });
        cv.addEventListener('mousemove', onMM, { passive: false });
        cv.addEventListener('mouseup', onMU, { passive: false });
        announce('开战!',80);
    }
    function announce(txt,dur) {
        const el=document.getElementById('announcer');
        el.textContent=txt; el.classList.add('show');
        announceT=dur; battlePaused=true;
        setTimeout(()=>{el.classList.remove('show');setTimeout(()=>{battlePaused=false;},200);},dur*16);
    }
    function showResult(w) {
        document.getElementById('gc').style.pointerEvents='none';
        scene='result'; sfx('win');
        document.getElementById('hud').style.display='none';
        const wf=fighters[w-1];
        document.getElementById('winText').textContent=wf.hd.n+' 胜!';
        const rc=document.getElementById('winCanvas');
        const rcx=rc.getContext('2d'); rc.width=200; rc.height=200;
        rcx.clearRect(0,0,200,200);
        const rg=rcx.createRadialGradient(100,100,20,100,100,100);
        rg.addColorStop(0,wf.hd.bc+'66');rg.addColorStop(.5,wf.hd.bc+'22');rg.addColorStop(1,'transparent');
        rcx.fillStyle=rg; rcx.fillRect(0,0,200,200);
        rcx.save(); rcx.translate(100,175);
        const vs=(wf.hd.scale||1)*1.3; rcx.scale(vs,vs);
        rcx.fillStyle=wf.hd.oc;
        rcx.beginPath();
        rcx.moveTo(-22,-85);rcx.quadraticCurveTo(-25,-45,-20,0);
        rcx.lineTo(20,0);rcx.quadraticCurveTo(25,-45,22,-85);
        rcx.closePath();rcx.fill();
        rcx.fillStyle='#c9a84c';rcx.fillRect(-22,-35,44,5);
        rcx.beginPath();rcx.arc(0,-98,14,0,Math.PI*2);
        const vfg=rcx.createRadialGradient(-2,-100,3,0,-98,14);
        vfg.addColorStop(0,'#f5deb3');vfg.addColorStop(1,'#d2a679');
        rcx.fillStyle=vfg;rcx.fill();
        rcx.fillStyle=wf.hd.hc;
        rcx.beginPath();rcx.ellipse(0,-105,13,9,0,Math.PI,Math.PI*2);rcx.fill();
        rcx.fillStyle='#2a1a0a';
        rcx.fillRect(-5,-96,3,2.5);rcx.fillRect(3,-96,3,2.5);
        rcx.restore();
        document.removeEventListener('touchstart', onTS);
        document.removeEventListener('touchmove', onTM);
        document.removeEventListener('touchend', onTE);
        document.removeEventListener('touchcancel', onTE);
        cv.removeEventListener('mousedown', onMD);
        cv.removeEventListener('mousemove', onMM);
        cv.removeEventListener('mouseup', onMU);
        document.getElementById('result-overlay').classList.add('active');
    }

    let lastT=0;
    let accumulator=0;
    const FIXED_DT=16.667;
    function loop(ts) {
        requestAnimationFrame(loop);
        const dt=Math.min(ts-lastT,50); lastT=ts;
        accumulator+=dt;
        if(accumulator<FIXED_DT)
            if(scene==='title'){
                cx.clearRect(0,0,W,H); drawBG(ts);
                cx.save(); cx.globalAlpha=.35;
                cx.translate(W*.3,GY);
                cx.fillStyle='#5d4037';
                cx.beginPath();cx.moveTo(-22,-105);cx.quadraticCurveTo(-25,-55,-20,0);
                cx.lineTo(20,0);cx.quadraticCurveTo(25,-55,22,-105);cx.closePath();cx.fill();
                cx.beginPath();cx.arc(0,-118,14,0,Math.PI*2);cx.fillStyle='#deb887';cx.fill();
                cx.restore();
                cx.save(); cx.globalAlpha=.35;
                cx.translate(W*.7,GY); cx.scale(-1,1);
                cx.fillStyle='#c62828';
                cx.beginPath();cx.moveTo(-22,-105);cx.quadraticCurveTo(-25,-55,-20,0);
                cx.lineTo(20,0);cx.quadraticCurveTo(25,-55,22,-105);cx.closePath();cx.fill();
                cx.beginPath();cx.arc(0,-118,14,0,Math.PI*2);cx.fillStyle='#deb887';cx.fill();
                cx.restore();
                return;
            }
            if(scene!=='battle') return;
            processJoysticks(); readKB();
            if(shakeDur>0){shakeDur--;shakeX*=.8;shakeY*=.8;}else{shakeX=shakeY=0;}
            if(!battlePaused){
                fighters[0].update(fighters[1]);
                fighters[1].update(fighters[0]);
                projectiles.forEach(p=>{
                    p.x+=p.vx;p.y+=p.vy;p.life--;
                    if(!p.hit){
                        const tgt=p.own===1?fighters[1]:fighters[0];
                        if(tgt&&!tgt.dead){
                            const tb={x:tgt.x-tgt.w/2,y:tgt.y-tgt.h,w:tgt.w,h:tgt.h};
                            if(p.x-p.sz<tb.x+tb.w&&p.x+p.sz>tb.x&&p.y-p.sz<tb.y+tb.h&&p.y+p.sz>tb.y){
                                p.hit=1;const atk=p.own===1?fighters[0]:fighters[1];
                                tgt.damage(p.dm,atk);
                                spawnParticles(p.x,p.y,35,p.cl,8,16);
                                spawnParticles(p.x,p.y,15,'#ffffff',3,6);
                                spawnParticles(p.x,p.y,10,'#ffcc00',5,10);
                                screenShake(12,18);
                                screenFlash();
                            }
                        }
                    }
                });
                projectiles=projectiles.filter(p=>p.life>0&&!p.hit);
                particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life--;});
                particles=particles.filter(p=>p.life>0);
                afterimages.forEach(a=>a.life--);
                afterimages=afterimages.filter(a=>a.life>0);
                if(quizImages.length>0 && quizIndex<quizImages.length && !quizActive){
                    quizTimer++;
                    if(quizTimer>=QUIZ_INTERVAL){
                        showQuiz();
                    }
                }
                if(fighters[0].dead||fighters[1].dead){
                    battlePaused=true;
                    const w=fighters[0].dead?2:1;
                    setTimeout(()=>showResult(w),1800);
                }
                if(announceT>0) announceT--;
            }
            bgScroll=(fighters[0].x+fighters[1].x)/2;
            cx.save();
            cx.translate(Math.round((Math.random()-.5)*shakeX),Math.round((Math.random()-.5)*shakeY));
            cx.clearRect(-10,-10,W+20,H+20);
            drawBG(ts);
            drawAfterimages();
            const order=fighters[0].y<fighters[1].y?[0,1]:[1,0];
            drawDetailedChar(fighters[order[0]],ts);
            drawDetailedChar(fighters[order[1]],ts);
            drawProj();
            drawParts();
            cx.restore();
            drawControls();
            updateHUD();
            accumulator-=FIXED_DT;
    }

    function init() {
        function initEvents() {
            document.addEventListener('touchstart', onTS);
            document.addEventListener('touchmove', onTM);
            document.addEventListener('touchend', onTE);
            document.addEventListener('touchcancel', onTC);
            document.addEventListener('mousedown', onMD);
            document.addEventListener('mousemove', onMM);
            document.addEventListener('mouseup', onMU);
            document.addEventListener('mouseleave', onMU);
            const allBtns = document.querySelectorAll('.mbtn, .import-btn, .quiz-btn, .pen-color');
            allBtns.forEach(btn => {
                btn.style.pointerEvents = 'auto';
                btn.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                });
                btn.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                });
            });
        }
        initEvents();
        initThreeBackground();
        buildSelect();
        function tapOrClick(el, fn) {
            let touchHandled = false;
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                touchHandled = true;
            }, { passive: false });
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (touchHandled) {
                    fn(e);
                }
                touchHandled = false;
                setTimeout(() => { touchHandled = false; }, 300);
            }, { passive: false });
            el.addEventListener('click', (e) => {
                if (touchHandled) {
                    e.stopPropagation();
                    return;
                }
                fn(e);
            });
        }
        tapOrClick(document.getElementById('btnStart'), () => {
            if (quizImages.length === 0) {
                alert('请先导入题目才能开战！');
                return;
            }
            initAC(); sfx('click'); scene = 'select';
            document.getElementById('title-overlay').classList.remove('active');
            document.getElementById('select-overlay').classList.add('active');
        });
        tapOrClick(document.getElementById('btnBack'), () => {
            sfx('click'); scene = 'title';
            document.getElementById('select-overlay').classList.remove('active');
            document.getElementById('title-overlay').classList.add('active');
        });
        var fightBtn = document.getElementById('btnFight');
        fightBtn.disabled = false;
        fightBtn.style.pointerEvents = 'auto';
        fightBtn.style.opacity = '1';
        fightBtn.style.zIndex = '9999';
        fightBtn.onclick = function() {
            if (selP1 >= 0 && selP2 >= 0) {
                startBattle();
            } else {
                alert('角色未选齐，无法决战！');
            }
        };
        tapOrClick(document.getElementById('btnRematch'), () => {
            sfx('click');
            document.getElementById('result-overlay').classList.remove('active');
            startBattle();
        });
        tapOrClick(document.getElementById('btnResel'), () => {
            sfx('click');
            // 清空题目数据
            quizImages = [];
            quizIndex = 0;
            document.getElementById('importCount').textContent = '';
            // 返回主菜单
            scene = 'title';
            document.getElementById('gc').style.pointerEvents='none';
            document.getElementById('result-overlay').classList.remove('active');
            document.getElementById('select-overlay').classList.remove('active');
            document.getElementById('title-overlay').classList.add('active');
            // 重置选人状态
            selP1 = selP2 = -1;
            document.querySelectorAll('.hcard').forEach(c => c.classList.remove('sp1', 'sp2'));
            document.getElementById('btnFight').disabled = true;
            document.getElementById('ip1').innerHTML = '<span style="color:#777">点击上方卡片选择角色</span>';
            document.getElementById('ip2').innerHTML = '<span style="color:#777">点击上方卡片选择角色</span>';
        });   
        document.getElementById('quizFileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const readerPromises = [];
            for (let file of files) {
                if (!file.type.startsWith('image/')) continue;
                const reader = new FileReader();
                const promise = new Promise((resolve) => {
                    reader.onload = function(event) {
                        quizImages.push(event.target.result);
                        resolve();
                    };
                });
                reader.readAsDataURL(file);
                readerPromises.push(promise);
            }
            Promise.all(readerPromises).then(() => {
                document.getElementById('importCount').textContent = `已导入 ${quizImages.length} 道题目`;
                document.getElementById('quizFileInput').value = '';
            });
        });
        document.querySelectorAll('.pen-color').forEach(el => {
            tapOrClick(el, (e) => {
                e.stopPropagation();
                document.querySelectorAll('.pen-color').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                quizPenColor = el.dataset.color;
                quizEraserMode = false;
                document.getElementById('btnEraser').classList.remove('active');
            });
        });
        document.getElementById('penSize').addEventListener('input', (e) => {
            e.stopPropagation();
            quizPenSize = parseInt(e.target.value);
        });
        tapOrClick(document.getElementById('btnEraser'), (e) => {
            e.stopPropagation();
            quizEraserMode = !quizEraserMode;
            document.getElementById('btnEraser').classList.toggle('active', quizEraserMode);
        });
        tapOrClick(document.getElementById('btnClear'), (e) => {
            e.stopPropagation();
            if (quizCtx) {
                quizCtx.clearRect(0, 0, quizCtx.canvas.width, quizCtx.canvas.height);
            }
        });
        tapOrClick(document.getElementById('btnSubmit'), (e) => {
            e.stopPropagation();
            document.getElementById('quizJudge').classList.add('show');
        });
        tapOrClick(document.getElementById('btnCorrect'), (e) => {
            e.stopPropagation();
            sfx('win');
            quizCorrectAnswer();
        });
        tapOrClick(document.getElementById('btnWrong'), (e) => {
            e.stopPropagation();
            sfx('hit');
            quizWrongAnswer();
        });
        const qo = document.getElementById('quiz-overlay');
        qo.addEventListener('touchstart', (e) => { if (e.target.tagName !== 'INPUT') e.stopPropagation(); }, { passive: false });
        qo.addEventListener('touchmove', (e) => { e.stopPropagation(); }, { passive: false });
        qo.addEventListener('touchend', (e) => { if (e.target.tagName !== 'INPUT') e.stopPropagation(); }, { passive: false });
        qo.addEventListener('mousedown', (e) => { e.stopPropagation(); });
        qo.addEventListener('mousemove', (e) => { e.stopPropagation(); });
        qo.addEventListener('mouseup', (e) => { e.stopPropagation(); });
        setupQuizDrawing();
        requestAnimationFrame(loop);
    }
    window.addEventListener('load', init);
})();
</script>
</body>
</html>
