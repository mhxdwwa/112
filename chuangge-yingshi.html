    // Move to end (LRU-like behavior)
    const data = c.data;
    delete _searchCache[key];
    _searchCache[key] = c;
    return data;
  }
  return null;
}
function cacheSet(key, data) {
  // Remove if exists (to update position)
  if (_searchCache[key]) delete _searchCache[key];
  _searchCache[key] = { data, ts: Date.now() };
  // Keep cache size manageable (100 entries)
  const keys = Object.keys(_searchCache);
  if (keys.length > 100) {
    // Remove oldest 20% of cache
    const toRemove = keys.slice(0, 20);
    for (let i = 0; i < toRemove.length; i++) {
      delete _searchCache[toRemove[i]];
    }
  }
}

// === KEYWORD EXPANSION (智能搜索扩展) ===
function expandKeywords(keyword) {
  const kw = keyword.trim();
  if (!kw) return [kw];
  const results = new Set();
  results.add(kw);

  const numToCn = {'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九','10':'十','11':'十一','12':'十二','13':'十三','14':'十四','15':'十五'};
  const cnToNum = {};
  for (const [k,v] of Object.entries(numToCn)) cnToNum[v] = k;

  // Pattern 1: trailing Arabic digit(s) → "第X季" variant and base name
  const trailingNum = kw.match(/^(.+?)(\d+)$/);
  if (trailingNum) {
    const base = trailingNum[1].trim();
    const num = trailingNum[2];
    const cn = numToCn[num] || num;
    results.add(base + '第' + cn + '季');
    results.add(base + '第' + num + '季');
    results.add(base + num);
    results.add(base); // base name to catch all seasons
  }

  // Pattern 2: trailing Chinese number → Arabic variant
  const cnNums = Object.keys(cnToNum);
  for (const cn of cnNums) {
    if (kw.endsWith(cn) && kw.length > cn.length) {
      const base = kw.slice(0, -cn.length).trim();
      const num = cnToNum[cn];
      results.add(base + num);
      results.add(base + '第' + cn + '季');
      results.add(base);
    }
  }

  // Pattern 3: "第X季" format → extract base and number variants
  const seasonCnMatch = kw.match(/^(.+?)第([一二三四五六七八九十百]+)季$/);
  if (seasonCnMatch) {
    const base = seasonCnMatch[1].trim();
    const cnNum = seasonCnMatch[2];
    const arabicNum = cnToNum[cnNum] || '';
    if (arabicNum) results.add(base + arabicNum);
    results.add(base);
  }
  const seasonNumMatch = kw.match(/^(.+?)第(\d+)季$/);
  if (seasonNumMatch) {
    const base = seasonNumMatch[1].trim();
    const num = seasonNumMatch[2];
    const cn = numToCn[num] || num;
    results.add(base + '第' + cn + '季');
    results.add(base + num);
    results.add(base);
  }

  // Pattern 4: "SX" / "sX" suffix → "第X季"
  const sxMatch = kw.match(/^(.+?)[Ss](\d+)$/);
  if (sxMatch) {
    const base = sxMatch[1].trim();
    const num = sxMatch[2];
    const cn = numToCn[num] || num;
    results.add(base + '第' + cn + '季');
    results.add(base + num);
    results.add(base);
  }

  // Pattern 5: Roman numerals (II, III, IV...)
  const romanMap = {'II':'2','III':'3','IV':'4','V':'5','VI':'6','VII':'7','VIII':'8','IX':'9','X':'10'};
  for (const [roman, num] of Object.entries(romanMap)) {
    if (kw.toUpperCase().endsWith(roman)) {
      const base = kw.slice(0, -roman.length).trim();
      if (base.length > 0) {
        const cn = numToCn[num] || num;
        results.add(base + '第' + cn + '季');
        results.add(base + num);
        results.add(base);
      }
    }
  }

  // Pattern 6: contains space → try without spaces
  if (kw.includes(' ')) {
    results.add(kw.replace(/\s+/g, ''));
  }

  // Pattern 7: Long Chinese name → extract core keywords for short dramas
  // e.g. "闪婚嫁给残疾大佬后" → "闪婚", "闪婚嫁给", "残疾大佬"
  if (kw.length >= 5 && /^[\u4e00-\u9fff\uff00-\uffef]+$/.test(kw)) {
    var hotPrefixes = ['闪婚','重生','穿越','穿书','替嫁','离婚','退婚','团宠','萌宝','龙王','战神','神医','赘婿','豪门','逆袭','首富','特工','千金','绝品','至尊','鉴宝','凤归','医妃','龙婿','神豪','女总裁','总裁','全民','千亿'];
    for (var pi = 0; pi < hotPrefixes.length; pi++) {
      var pf = hotPrefixes[pi];
      if (kw.startsWith(pf) && kw.length > pf.length) {
        results.add(pf);
        if (kw.length >= pf.length + 2) results.add(kw.slice(0, pf.length + 2));
        if (kw.length >= pf.length + 3) results.add(kw.slice(0, pf.length + 3));
      }
    }
    // Try first 2, 3, 4 chars
    if (kw.length > 4) results.add(kw.slice(0, 4));
    if (kw.length > 3) results.add(kw.slice(0, 3));
    if (kw.length > 2) results.add(kw.slice(0, 2));
    // Remove common trailing particles
    var suffixes = ['后','了','吧','的','啊','呢','吗','着','过'];
    for (var si2 = 0; si2 < suffixes.length; si2++) {
      if (kw.endsWith(suffixes[si2]) && kw.length > 3) {
        results.add(kw.slice(0, -1));
      }
    }
    // Split on "之", "：", ":", "的", "—"
    var splitChars = ['之','：',':','的','—','·'];
    for (var sci = 0; sci < splitChars.length; sci++) {
      var scIdx = kw.indexOf(splitChars[sci]);
      if (scIdx > 1 && scIdx < kw.length - 1) {
        results.add(kw.slice(0, scIdx));
        results.add(kw.slice(scIdx + 1));
      }
    }
  }

  return [...results];
}

// === SEARCH API ===
async function apiSearch(keyword, sourceIdx, onPartial) {
  const cacheKey = 'search:' + keyword + ':' + sourceIdx;
  const cached = cacheGet(cacheKey);
  if (cached) {
    if (onPartial) onPartial(cached, 'cache');
    return cached;
  }

  // 搜索所有源（包括短剧源），先到先得
  const sources = sourceIdx === -1 ? [...API_SOURCES, ...SHORT_DRAMA_SOURCES] : [API_SOURCES[sourceIdx]];
  const allResults = [];
  const seen = new Set();
  const failedSources = [];

  // Generate expanded keywords for better coverage
  const keywords = sourceIdx === -1 ? expandKeywords(keyword) : [keyword];
  const primaryKw = keyword.trim();

  let _reportedCompleted = 0;
  const _totalSources = sources.length;

  // Build all search tasks: each source × each keyword, all run in parallel
  const tasks = [];
  for (const src of sources) {
    tasks.push({ src, kw: primaryKw, isPrimary: true });
    // Expanded keywords on top API sources AND all SHORT_DRAMA_SOURCES
    const isTopSource = API_SOURCES.indexOf(src) < 10 || SHORT_DRAMA_SOURCES.indexOf(src) >= 0;
    for (const ekw of keywords) {
      if (ekw === primaryKw) continue;
      if (isTopSource) {
        tasks.push({ src, kw: ekw, isPrimary: false });
      }
    }
  }

  const srcDone = new Map();

  function addItems(data, srcName, isPrimary) {
    if (!data || !data.list) return;
    const items = data.list.map(item => ({
      id: item.vod_id, name: item.vod_name||'', type: item.type_name||'',
      pic: item.vod_pic||'', year: item.vod_year||'', remarks: item.vod_remarks||'',
      actor: item.vod_actor||'', director: item.vod_director||'',
      desc: (item.vod_blurb||item.vod_content||'').replace(/<[^>]+>/g,'').slice(0,200),
      playFrom: item.vod_play_from||'', playUrl: item.vod_play_url||'',
      score: item.vod_score||'', source: srcName,
    }));
    items.forEach(it => {
      const normName = it.name.replace(/\s+/g,'').toLowerCase();
      const key = normName + '|' + it.source;
      
      // 每个源独立保留结果
      if (!seen.has(key)) {
        seen.add(key);
        allResults.push(it);
      }
    });
    if (isPrimary && !srcDone.has(srcName)) {
      srcDone.set(srcName, true);
      _reportedCompleted++;
      if (onPartial) onPartial([...allResults], srcName, _reportedCompleted, _totalSources);
    }
  }

  const promises = tasks.map(async (task) => {
    try {
      const url = task.src.api + '?ac=detail&wd=' + encodeURIComponent(task.kw);
      const data = await apiFetch(url);
      addItems(data, task.src.name, task.isPrimary);
    } catch(e) {
      if (task.isPrimary) {
        if (!srcDone.has(task.src.name)) {
          srcDone.set(task.src.name, true);
          _reportedCompleted++;
        }
        failedSources.push(task.src);
      }
    }
  });
  await Promise.all(promises);

  // Retry failed sources once (primary keyword only)
  if (failedSources.length > 0) {
    const retryPromises = failedSources.map(async (src) => {
      try {
        const url = src.api + '?ac=detail&wd=' + encodeURIComponent(primaryKw);
        const data = await apiFetch(url);
        addItems(data, src.name, true);
      } catch(e) {}
    });
    await Promise.all(retryPromises);
  }

  // Sort results: 量子高清优先，然后按名称匹配度
  allResults.sort(function(a, b) {
    const kwLower = primaryKw.toLowerCase();
    const aName = a.name.toLowerCase();
    const bName = b.name.toLowerCase();
    const aExact = aName === kwLower ? 0 : aName.includes(kwLower) ? 1 : 2;
    const bExact = bName === kwLower ? 0 : bName.includes(kwLower) ? 1 : 2;
    
    // 量子高清优先
    const aIsLZ = a.source && a.source.indexOf('量子') >= 0 ? 0 : 1;
    const bIsLZ = b.source && b.source.indexOf('量子') >= 0 ? 0 : 1;
    if (aIsLZ !== bIsLZ) return aIsLZ - bIsLZ;
    
    // 同级别按名称匹配度排序
    if (aExact !== bExact) return aExact - bExact;
    return 0;
  });

  if (allResults.length) cacheSet(cacheKey, allResults);
  return allResults;
}

// === CATEGORY LOADER ===
const _catCache = {};
const PER_PAGE = 24;

function mapVodItem(item, srcName) {
  return {
    id: item.vod_id, name: item.vod_name||'', type: item.type_name||'',
    pic: item.vod_pic||'', year: item.vod_year||'', remarks: item.vod_remarks||'',
    actor: item.vod_actor||'', playFrom: item.vod_play_from||'',
    playUrl: item.vod_play_url||'', source: srcName,
    area: item.vod_area||'', class: item.vod_class||'',
    sourceIdx: API_SOURCES.indexOf(API_SOURCES.find(s=>s.name===srcName)),
  };
}

function mapListItem(item, srcName) {
  return {
    id: item.vod_id, name: item.vod_name||'', type: item.type_name||'',
    pic: item.vod_pic||'', year: item.vod_year||'', remarks: item.vod_remarks||'',
    actor: '', playFrom: '', playUrl: '', source: srcName,
    area: '', class: '',
    sourceIdx: API_SOURCES.indexOf(API_SOURCES.find(s=>s.name===srcName)),
  };
}

async function apiLoadCatFull(catName) {
  if (_catCache[catName] && _catCache[catName].data.length >= 400 && Date.now() - _catCache[catName].ts < CACHE_TTL) {
    return _catCache[catName].data;
  }
  // Parent + subcategory type IDs per source (different sources use different IDs)
  const typeMap = {'电影':'1','电视剧':'2','动漫':'4','综艺':'3','纪录片':'20'};
  // Subcategory IDs that commonly map to each category across different sources
  const subTypeMap = {
    '电影':['1','6','7','8','9','10','11','12','21','22','23','24'],
    '电视剧':['2','13','14','15','16','25','26','27','28'],
    '综艺':['3','17','18','29','30'],
    '动漫':['4','19','31','32','33','29'],
    '纪录片':['20','35','36'],
  };
  const tid = typeMap[catName]||'';
  const subTids = subTypeMap[catName] || [];
  const allItems = [];
  const seen = new Set();
  const TARGET = (catName === '综艺' || catName === '纪录片') ? 150 : 300;
  const isShortDrama = (catName === '短剧');
  const isDoc = (catName === '纪录片');
  const shortDramaTids = ['44','45','46','43','34','35','36','47','48'];
  const tasks = [];
  const ALL_SOURCES = API_SOURCES;
  const TOP_SOURCES = API_SOURCES.slice(0, 8);

  if (isShortDrama) {
    // 短剧：精简抓取
    for (const src of ALL_SOURCES.slice(0, 8)) {
      for (const sTid of shortDramaTids) {
        tasks.push({ src, pg: 1, tid: sTid, mode:'list' });
        tasks.push({ src, pg: 2, tid: sTid, mode:'list' });
      }
    }
    for (const src of ALL_SOURCES.slice(0, 5)) {
      for (const sTid of shortDramaTids) {
        tasks.push({ src, pg: 1, tid: sTid, mode:'detail' });
      }
    }
  } else if (isDoc) {
    // 纪录片：支持它的源不多，轻量抓一遍就够
    for (const src of ALL_SOURCES.slice(0, 6)) {
      for (const pg of [1, 2, 3]) {
        tasks.push({ src, pg, tid: '20', mode: 'detail' });
        tasks.push({ src, pg, tid: '20', mode: 'list' });
      }
    }
  } else {
    // Strategy 1: ac=detail with parent type ID (returns playUrl, pic, etc.)
    for (const src of TOP_SOURCES) {
      for (const pg of [1,2,3,4]) {
        tasks.push({ src, pg, tid, mode:'detail' });
      }
    }
    // Strategy 2: ac=list with parent type ID (faster, more items per page)
    for (const src of TOP_SOURCES) {
      for (const pg of [1,2,3,4,5]) {
        tasks.push({ src, pg, tid, mode:'list' });
      }
    }
    // Strategy 3: ac=list with subcategory IDs (catches items missed by parent ID)
    for (const src of TOP_SOURCES.slice(0, 4)) {
      for (const sTid of subTids) {
        tasks.push({ src, pg: 1, tid: sTid, mode:'list' });
      }
    }
  }

  const results = await Promise.all(tasks.map(async ({ src, pg, tid: t, mode }) => {
    try {
      const url = src.api + '?ac=' + mode + (t ? '&t=' + t : '') + '&pg=' + pg;
      const data = await apiFetch(url);
      if (data && data.list) {
        return mode === 'detail' ? data.list.map(it => mapVodItem(it, src.name)) : data.list.map(it => mapListItem(it, src.name));
      }
    } catch(e) {}
    return [];
  }));

  // Helper: 用统一分类器判断 type_name 属于哪个大类
  function typeMatches(itemType, cat) {
    if (!itemType || itemType === '') return true; // 未知类型放行
    const c = liveCatOf(itemType);
    if (!c) return true;
    return c === cat;
  }

  for (const batch of results) {
    for (const item of batch) {
      if (!item.name) continue;
      const key = item.name;
      if (isShortDrama) {
        const t = (item.type||'').toLowerCase();
        if (t && !t.includes('短剧') && !t.includes('短片') && t !== '') continue;
      } else {
        if (!typeMatches(item.type, catName)) continue;
      }
      if (!seen.has(key) && allItems.length < TARGET) {
        seen.add(key);
        allItems.push(item);
      }
    }
  }

  if (isShortDrama && allItems.length < 30) {
    const allSrc = [...API_SOURCES.slice(0, 6), ...SHORT_DRAMA_SOURCES];
    const keywords = ['短剧','红果短剧','微短剧','竖屏短剧'];
    const kwTasks = [];
    for (const src of allSrc) {
      for (const kw of keywords) {
        kwTasks.push((async () => {
          try {
            const url = src.api + '?ac=detail&wd=' + encodeURIComponent(kw) + '&pg=1';
            const data = await apiFetch(url);
            if (data && data.list) return data.list.map(it => mapVodItem(it, src.name));
          } catch(e) {}
          return [];
        })());
      }
      for (const sTid of shortDramaTids) {
        kwTasks.push((async () => {
          try {
            const url = src.api + '?ac=list&t=' + sTid + '&pg=1';
            const data = await apiFetch(url);
            if (data && data.list) return data.list.map(it => mapListItem(it, src.name));
          } catch(e) {}
          return [];
        })());
      }
    }
    const kwResults = await Promise.all(kwTasks);
    for (const batch of kwResults) {
      for (const item of batch) {
        if (!item.name) continue;
        if (!seen.has(item.name) && allItems.length < TARGET) {
          seen.add(item.name);
          allItems.push(item);
        }
      }
    }
  }

  // Final fallback: ac=detail without type filter, filter client-side
  if (allItems.length < 30 && !isShortDrama) {
    const fallbackTasks = [];
    for (const src of API_SOURCES.slice(0, 5)) {
      for (const pg of [1, 2, 3, 4, 5]) {
        fallbackTasks.push({ src, pg });
      }
    }
    const fbResults = await Promise.all(fallbackTasks.map(async ({ src, pg }) => {
      try {
        const url = src.api + '?ac=detail&pg=' + pg;
        const data = await apiFetch(url);
        if (data && data.list) return data.list.map(it => mapVodItem(it, src.name));
      } catch(e) {}
      return [];
    }));
    for (const batch of fbResults) {
      for (const item of batch) {
        if (!item.name) continue;
        if (!contentOK(item)) continue;
        if (!typeMatches(item.type, catName)) continue;
        if (!seen.has(item.name) && allItems.length < TARGET) {
          seen.add(item.name);
          allItems.push(item);
        }
      }
    }
  }

  _catCache[catName] = { data: allItems.filter(contentOK), ts: Date.now() };
  return allItems;
}


// === RENDER FUNCTIONS ===
function proxyImg(url) {
  if (!url) return '';
  if (url.startsWith('data:')) return url;
  if (url.includes('wsrv.nl')) return url;
  // 对已经是https的图片直接使用wsrv代理，降低图片尺寸加速加载
  return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=280&h=420&fit=cover&output=webp&q=80';
}

function cardHTML(item, idx, eager) {
  let pic = item.pic;
  if (!pic) pic = getCachedImg(item.name);
  const d = JSON.stringify(item).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
  const loadAttr = eager ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"';
  const poster = pic
    ? '<img src="'+proxyImg(pic)+'" alt="'+esc(item.name)+' 海报" '+loadAttr+' referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
      + '<div class="card-ph" style="display:none">'+esc(item.name)+'</div>'
    : '<div class="card-ph">'+esc(item.name)+'</div>';
  const scoreHtml = item.score && parseFloat(item.score) > 0 ? '<span class="card-score">'+esc(item.score)+'</span>' : '';
  return '<div class="card" onclick=\'openPlayer('+d+')\'>'
    + '<div class="card-poster">'+poster
    + '<div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>'
    + (item.type?'<span class="card-badge">'+esc(item.type)+'</span>':'')
    + scoreHtml
    + (item.remarks?'<div class="card-ep">'+esc(item.remarks)+'</div>':'')
    + '</div><div class="card-info"><div class="card-title">'+esc(item.name)+'</div>'
    + '<div class="card-sub">'+(item.year?item.year+' · ':'')+esc(item.actor||'')+'</div></div></div>';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function sectionHTML(title, items, eager) {
  if (!items||!items.length) return '';
  var sliced = items.slice(0,20);
  // 后台为缺图条目搜索封面
  setTimeout(function() { queueMissingImages(sliced); }, 300);
  return '<div class="section"><div class="section-head"><div class="section-title">'+title+'</div></div>'
    + '<div class="grid">'+sliced.map((it,i)=>cardHTML(it,i,!!eager)).join('')+'</div></div>';
}

function paginatedSectionHTML(title, items, page, catName) {
  if (!items||!items.length) return '';
  const total = items.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  const start = (page - 1) * PER_PAGE;
  const pageItems = items.slice(start, start + PER_PAGE);
  // 后台为缺图的条目搜索封面
  setTimeout(function() { queueMissingImages(pageItems); }, 200);
  let html = '<div class="section"><div class="section-head"><div class="section-title">'
    + title + ' <span style="font-size:12px;color:var(--sub);font-weight:400">（共'+total+'部）</span></div></div>'
    + '<div class="grid">'+pageItems.map((it,i)=>cardHTML(it,i)).join('')+'</div>';
  if (totalPages > 1) {
    html += '<div class="pager">';
    html += '<span class="pager-btn'+(page<=1?' disabled':'')+'" onclick="catPage(\''+catName+'\','+(page-1)+')">上一页</span>';
    for (let p = 1; p <= totalPages; p++) {
      if (totalPages > 10 && Math.abs(p - page) > 3 && p !== 1 && p !== totalPages) {
        if (p === 2 || p === totalPages - 1) html += '<span class="pager-info">...</span>';
        continue;
      }
      html += '<span class="pager-btn'+(p===page?' active':'')+'" onclick="catPage(\''+catName+'\','+p+')">'+p+'</span>';
    }
    html += '<span class="pager-btn'+(page>=totalPages?' disabled':'')+'" onclick="catPage(\''+catName+'\','+(page+1)+')">下一页</span>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// === 融合渲染搜索结果（所有源混合显示，去重） ===
function renderMergedResults(results) {
  if (!results || results.length === 0) return '<div class="empty">未找到相关结果</div>';
  
  // 按视频名称去重，保留第一个出现的
  const seen = new Set();
  const unique = [];
  results.forEach(function(r) {
    const key = r.name.replace(/\s+/g,'').toLowerCase();
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(r);
    }
  });
  
  if (unique.length === 0) return '<div class="empty">未找到相关结果</div>';
  
  return '<div class="sr-grid">' + unique.map(srItemHTML).join('') + '</div>';
}

// === 从 shows.json 加载剧名列表（GitHub 仓库中的独立文件） ===
var _loadedShows = null; // 缓存从 shows.json 加载的数据
async function loadShowsFromJson() {
  if (_loadedShows) return _loadedShows;
  try {
    const resp = await fetch('shows.json', { cache: 'no-cache' });
    if (resp.ok) {
      const data = await resp.json();
      _loadedShows = data;
      return data;
    }
  } catch(e) {
    console.log('shows.json 加载失败，使用默认列表');
  }
  return null;
}

// === 后台获取最新热播数据（优先用 shows.json，失败则从API获取，最后用静态列表） ===
async function fetchHotShowsByCategory() {
  var result = { tv: [], movie: [], variety: [], anime: [], shortdrama: [] };
  var catMap = { tv: '电视剧', movie: '电影', variety: '综艺', anime: '动漫', shortdrama: '短剧' };
  
  // 优先从 shows.json 加载
  var jsonShows = await loadShowsFromJson();
  if (jsonShows) {
    Object.keys(catMap).forEach(function(key) {
      if (jsonShows[key] && jsonShows[key].length > 0) {
        result[key] = jsonShows[key];
      }
    });
  }
  
  // 对于 shows.json 中没有或为空的分类，从API获取
  var tasks = Object.keys(catMap).map(async function(key) {
    if (result[key] && result[key].length > 0) return; // 已有数据，跳过
    try {
      var catName = catMap[key];
      var items = await apiLoadCatFull(catName);
      if (items && items.length >= 5) {
        result[key] = items.slice(0, 60).map(function(it) { return it.name; }).filter(Boolean);
      }
    } catch(e) {}
  });
  await Promise.all(tasks);
  
  // 对任何没有拿到数据的分类，使用静态列表兜底
  Object.keys(result).forEach(function(key) {
    if (!result[key] || result[key].length < 3) {
      result[key] = STATIC_FALLBACK_SHOWS[key] || [];
    }
  });
  return result;
}

// 分类海报墙：电影 / 电视剧 / 综艺 / 动漫 / 短剧 / 纪录片

var LIVE_TTL = 4 * 60 * 1000;     // 内存数据多久算过期

// 榜单行按 id 引用条目，条目一变索引就必须跟着重建
function liveSetItems(list) {
  LIVE.items = list || [];
  var m = {};
  for (var i = 0; i < LIVE.items.length; i++) m[LIVE.items[i].id] = LIVE.items[i];
  LIVE.byId = m;
  return LIVE.items;
}
var _homeReg = [];                // 首页卡片顺序 → 数据，避免把整条 JSON 塞进 onclick

// type_name → 大类。顺序不能乱：「短剧」含「剧」，「综艺片」以「片」结尾
function liveCatOf(typeName) {
  var t = String(typeName || '').trim();
  if (!t) return '';
  if (/短剧|微短剧/.test(t)) return '短剧';
  if (/纪录|记录片|专题/.test(t)) return '纪录片';
  if (/动漫|动画/.test(t)) return '动漫';
  if (/综艺|真人秀|脱口秀/.test(t)) return '综艺';
  if (/电影/.test(t) || /片$/.test(t)) return '电影';
  if (/剧/.test(t)) return '电视剧';
  return '';
}

function liveTime(s) {
  if (!s) return 0;
  var n = Date.parse(String(s).replace(/-/g, '/'));
  return isNaN(n) ? 0 : n;
}

function contentOK(it) {
  if (!it) return false;
  if (_BAD_TYPE.test(String(it.type || ''))) return false;
  if (_BAD_WORD.test(String(it.name || ''))) return false;
  return true;
}
function liveKeep(x) {
  return !!x && !!x.name && contentOK(x) && !!(x.playUrl || x.playFrom || x.id);
}
function healthyBonus(it) {
  return _GOOD_TAG.test(String(it.type || '') + ' ' + String(it.name || '')) ? 1 : 0;
}

function normName(n) {
  return String(n || '').replace(/[\s·・:：!！?？,，.。'‘’"“”()（）\[\]【】-]/g, '').toLowerCase();
}

/* ---------- 海报地址：多级回退 ----------
 * 图源现状（实测）：
 *   wsrv.nl        公共中转，已返回 404，不能依赖；
 *   豆瓣 doubanio  图最全最正，但直连会被防盗链挡（418），只能靠自家 Worker 转；
 *   采集源图床     有图，但并发几十张时会整片挂起，十几秒都不报错。
 * 所以顺序是：有 Worker 就先走 /img 代理（带 Referer + 边缘缓存，最稳），
 * 没有 Worker 才退回直连，最后露剧名占位。全程配定时器兜底，
 * 任何一张图超过 7 秒没出来就直接换下一跳，不让用户对着空卡等。
 */
var IMG_STAGE = 'data-stage';
var IMG_HARD_TIMEOUT = 7000;      // 一张图最多等这么久

function imgProxy(u, w, h) {
  w = w || 280; h = h || 420;
  // 站点上挂着同源 Worker（/api/image-relay/img），能补 Referer、有边缘缓存，
  // 是所有图源里最可靠的一跳；配了外站 Worker 域名就优先用那个。
  if (typeof RELAY_BASE !== 'undefined' && RELAY_BASE) {
    return RELAY_BASE.replace(/\/+$/, '') + '/img?u=' + encodeURIComponent(u) + '&w=' + w + '&h=' + h;
  }
  return '/api/image-relay/img?url=' + encodeURIComponent(u) + '&w=' + w + '&h=' + h;
}
// 有没有可用的图片中转：站点同源 Worker 默认算有
var HAS_RELAY = true;
function livePic(u, w, h) {
  if (!u) return '';
  if (u.indexOf('data:') === 0) return u;
  return imgProxy(u, w, h);
}
function imgFallback(el) {
  var old = el.getAttribute('data-timer');
  if (old) clearTimeout(+old);
  el.removeAttribute('data-timer');
  var stage = el.getAttribute(IMG_STAGE) || '1';
  var origin = el.getAttribute('data-origin') || '';
  var alt = el.getAttribute('data-alt') || '';
  if (stage === '1') {
    // ① 主图挂了 → 换备用图源（豆瓣图 ↔ 采集源图）
    var next = alt || origin;
    el.setAttribute(IMG_STAGE, '2');
    el.setAttribute('data-origin', next);
    el.removeAttribute('data-alt');
    el.src = imgProxy(next);
    armImgTimer(el);
    return;
  }
  if (stage === '2') {
    // ② 备用图源也不出来 → 直接连原图（有些源站只拦第三方 Referer，自家域反而放行）
    el.setAttribute(IMG_STAGE, '3');
    el.src = origin;
    armImgTimer(el);
    return;
  }
  // ③ 彻底失败：藏掉图片，露出剧名占位
  el.style.display = 'none';
  var ph = el.parentNode && el.parentNode.querySelector('.hp-ph');
  if (ph) ph.style.opacity = '1';
}
// 图床「挂起不报错」是最坑的情况，用定时器把它变成 onerror
function armImgTimer(el) {
  var old = el.getAttribute('data-timer');
  if (old) clearTimeout(+old);
  var t = setTimeout(function () {
    if (el.complete && el.naturalWidth > 0) return;
    imgFallback(el);
  }, IMG_HARD_TIMEOUT);
  el.setAttribute('data-timer', String(t));
  el.onload = function () {
    clearTimeout(t);
    el.removeAttribute('data-timer');
  };
}
function imgAttrs(origin) {
  return ' src="' + esc(livePic(origin)) + '" data-origin="' + esc(origin) + '" ' +
    IMG_STAGE + '="1" onerror="imgFallback(this)" referrerpolicy="no-referrer"';
}

function liveItem(it, src) {
  return {
    id: it.vod_id, name: it.vod_name || '', type: it.type_name || '',
    pic: it.vod_pic || '', year: it.vod_year || '', area: it.vod_area || '',
    remarks: it.vod_remarks || '', score: it.vod_score || '',
    actor: it.vod_actor || '', director: it.vod_director || '',
    blurb: (function () {
      var b = String(it.vod_blurb || '').replace(/<[^>]+>/g, '').trim();
      if (!b || /^(暂无|无|没有)/.test(b)) b = String(it.vod_content || '').replace(/<[^>]+>/g, '').trim();
      if (!b || /^(暂无|无|没有)/.test(b)) return '';
      return b.slice(0, 150);
    })(),
    tf: liveTime(it.vod_time),
    hits: +it.vod_hits || 0, hitsDay: +it.vod_hits_day || 0, hitsWeek: +it.vod_hits_week || 0,
    playFrom: it.vod_play_from || '', playUrl: it.vod_play_url || '',
    source: src.name,
    sourceIdx: API_SOURCES.findIndex(function (s) { return s.name === src.name; })
  };
}

// 同一部剧在多个源都有，只留信息最全的一条
function liveMerge(list) {
  var map = {}, out = [];
  list.forEach(function (it) {
    if (!it.name) return;
    var k = normName(it.name);
    var old = map[k];
    if (!old) { map[k] = it; out.push(it); return; }
    var so = (old.pic ? 2 : 0) + (old.playUrl ? 3 : 0) + (old.blurb ? 1 : 0) + old.hitsDay / 1e6;
    var sn = (it.pic ? 2 : 0) + (it.playUrl ? 3 : 0) + (it.blurb ? 1 : 0) + it.hitsDay / 1e6;
    if (sn > so) { var idx = out.indexOf(old); if (idx >= 0) out[idx] = it; map[k] = it; }
  });
  return out;
}

async function liveFetch(force) {
  if (LIVE.loading) return;
  if (!force && LIVE.items.length && Date.now() - LIVE.ts < LIVE_TTL) return;
  LIVE.loading = true;
  try {
    var plan = [];
    API_SOURCES.slice(0, 5).forEach(function (s) { plan.push({ src: s, pg: 1 }); });

    var chunks = await Promise.all(plan.map(function (job) {
      return apiFetch(job.src.api + '?ac=detail&pg=' + job.pg + '&pagesize=30')
        .then(function (d) {
          if (!d || !d.list) return [];
          return d.list.map(function (it) { return liveItem(it, job.src); });
        })
        .catch(function () { return []; });
    }));

    var all = [];
    chunks.forEach(function (c) { all = all.concat(c); });
    if (all.length) {
      // 以预置片库为底再合并实时数据 —— 只取实时结果会把电影/纪录片这种冷门分类洗空
      var base = LIVE.seed || [];
      liveSetItems(liveMerge(base.concat(all)).filter(liveKeep));
      await liveTopUp();
      liveSetItems(LIVE.items.filter(liveKeep));
      LIVE.ts = Date.now();
      saveLiveSnap();
      console.log('[首页] 实时片库 ' + LIVE.items.length + ' 部（实时 ' + all.length + ' 条 + 预置 ' + base.length + ' 部）');
    } else {
      console.warn('[首页] 所有采集源都没返回数据');
    }
  } catch (e) {
    console.warn('[首页] 实时数据获取失败：' + e.message);
  }
  LIVE.loading = false;
}

// 首页只抓 5 个源的第一页，某一类可能一部都没有，按需补一次
var CAT_TID = { '电影': '1', '电视剧': '2', '综艺': '3', '动漫': '4' };
async function liveTopUp() {
  var cur = {};
  LIVE.items.forEach(function (it) { var c = liveCatOf(it.type); if (c) cur[c] = (cur[c] || 0) + 1; });
  var need = LIVE_CATS.filter(function (c) { return (cur[c] || 0) < 8 && CAT_TID[c]; });
  if (!need.length) return false;

  var srcs = API_SOURCES.slice(0, 3);
  var jobs = [];
  need.forEach(function (c) {
    srcs.slice(0, 2).forEach(function (src) {
      jobs.push(apiFetch(src.api + '?ac=detail&t=' + CAT_TID[c] + '&pg=1&pagesize=30')
        .then(function (d) {
          if (!d || !d.list) return [];
          return d.list.map(function (it) { return liveItem(it, src); });
        })
        .catch(function () { return []; }));
    });
  });
  var chunks = await Promise.all(jobs);
  var all = [];
  chunks.forEach(function (c) { all = all.concat(c); });
  if (!all.length) return false;
  liveSetItems(liveMerge(LIVE.items.concat(all)));
  console.log('[首页] 补充分类数据 ' + all.length + ' 条 → 总计 ' + LIVE.items.length + ' 部');
  return true;
}

function saveLiveSnap() {
  try {
    var slim = LIVE.items.slice(0, 160).map(function (x) {
      var o = {};
      for (var k in x) o[k] = x[k];
      if (o.playUrl && o.playUrl.length > 4000) o.playUrl = ''; // 超长的先不存，点开时再取详情
      return o;
    });
    localStorage.setItem(LIVE_KEY, JSON.stringify({ ts: LIVE.ts, items: slim }));
  } catch (e) {}
}

function loadLiveSnap() {
  try {
    var raw = localStorage.getItem(LIVE_KEY);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (o && o.items && o.items.length) return o;
  } catch (e) {}
  return null;
}

// 源名 → API_SOURCES 下标（预置数据里的名字可能不带前缀星标）
function _srcIdxOf(name) {
  if (!name) return 0;
  var i = API_SOURCES.findIndex(function (s) { return s.name === name; });
  if (i >= 0) return i;
  i = API_SOURCES.findIndex(function (s) { return s.name.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+/, '') === name; });
  if (i >= 0) return i;
  i = API_SOURCES.findIndex(function (s) { return name.indexOf(s.name.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+/, '')) >= 0; });
  return i < 0 ? 0 : i;
}

// 预置片库：同源 home.json，一次请求就能把六类海报全部铺满（不必等采集接口）
var _seedLoading = null;
// 站点既可能挂在 /xxx 也可能挂在 /xxx/ 下，两个相对位置都试一次
function _seedCandidates() {
  var out = [];
  function add(u) { if (u && out.indexOf(u) < 0) out.push(u); }
  try { add(new URL(LIVE_SEED, location.href).href); } catch (e) { add(LIVE_SEED); }
  try { add(new URL('/' + LIVE_SEED, location.href).href); } catch (e) {}
  return out;
}
function loadHomeSeed() {
  if (_seedLoading) return _seedLoading;

  function apply(d, from) {
    if (!d || !d.items || !d.items.length) return 0;
    var list = d.items.map(function (x) {
      var o = {};
      for (var k in x) o[k] = x[k];
      o.director = o.director || '';
      o.blurb = o.blurb || '';
      o.score = o.score || '';
      o.tf = +o.tf || 0;
      if (o.tf && o.tf < 1e12) o.tf *= 1000;
      o.sourceIdx = _srcIdxOf(o.source);
      return o;
    }).filter(contentOK);
    LIVE.seed = list;
    // 榜单（豆瓣实时热播顺序）来自种子，实时接口拿不到这种排序，所以单独存
    if (d.rows && d.rows.length) LIVE.rows = d.rows;
    // 榜单里用 id 引用条目，先建个索引
    var byId = LIVE.byId || {};
    for (var bi = 0; bi < list.length; bi++) byId[list[bi].id] = list[bi];
    LIVE.byId = byId;
    // 本地快照可能比片库小（上次只抓到几十条），和片库合起来用，别让旧快照把分类挡掉
    if (LIVE.items.length) {
      liveSetItems(liveMerge(list.concat(LIVE.items)));
      if (!LIVE.ts) LIVE.ts = d.ts || Date.now();
      console.log('[首页] 片库 ' + list.length + ' 部与本地快照合并 → ' + LIVE.items.length + ' 部 · ' + from);
    } else {
      liveSetItems(list.slice());
      LIVE.ts = d.ts || Date.now();
      console.log('[首页] 预置片库 ' + list.length + ' 部 · ' + from);
    }
    // 合并后 byId 要重建，否则榜单可能引用了被合并覆盖掉的旧对象
    var nb = {};
    for (var ni = 0; ni < LIVE.items.length; ni++) nb[LIVE.items[ni].id] = LIVE.items[ni];
    LIVE.byId = nb;
    return list.length;
  }

  // ① 内嵌数据（随页面一起下发，永远不会 404）
  var inline = window.__HOME_SEED;
  var got = apply(inline, '内嵌 · ' + ((inline && inline.generated) || '-'));

  // ② 顺便探一下仓库里有没有更新的 home.json（有就悄悄换掉，没有就算）
  var urls = _seedCandidates();
  _seedLoading = (async function () {
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i], { cache: 'no-cache' });
        if (!r.ok) continue;
        var ct = r.headers.get('content-type') || '';
        if (ct.indexOf('json') < 0) continue;   // 落到 SPA 回退页（HTML）就别解析了
        var d = await r.json();
        if (!d || !d.items || !d.items.length) continue;
        if (inline && d.ts && inline.ts && d.ts <= inline.ts) return got; // 不比内嵌的新，忽略
        var n = apply(d, '网络 · ' + urls[i]);
        if (n && !got) { got = n; paintHome(); }
        return got;
      } catch (e) { /* 换下一个位置 */ }
    }
    return got;
  })();
  return _seedLoading;
}

function liveLatest() {
  return LIVE.items.slice().sort(function (a, b) { return (b.tf - a.tf) || (b.hitsDay - a.hitsDay); });
}
function liveHot() {
  return LIVE.items.slice().sort(function (a, b) {
    return (b.hitsDay - a.hitsDay) || (b.hitsWeek - a.hitsWeek) || (b.hits - a.hits) || (b.tf - a.tf);
  });
}
function liveScore() {
  return LIVE.items.filter(function (x) { return parseFloat(x.score) > 0; })
    .sort(function (a, b) { return parseFloat(b.score) - parseFloat(a.score); });
}

/* ---------------- 卡片 ---------------- */
function pushItem(it) { _homeReg.push(it); return _homeReg.length - 1; }

function hpHTML(it, rank) {
  var i = pushItem(it);
  // 有中转时豆瓣海报更准更清晰；没有中转时豆瓣会被防盗链挡，只能用采集源那张。
  var pic = HAS_RELAY ? (it.dpic || it.pic || '') : (it.pic || it.dpic || '');
  var score = parseFloat(it.score) > 0 && parseFloat(it.score) >= 6
    ? '<span class="hp-score">' + parseFloat(it.score).toFixed(1) + '</span>' : '';
  // 排名只在榜单行显示，前三名金色
  var rankHtml = rank ? '<span class="hp-rank' + (rank <= 3 ? ' top' : '') + '">' + rank + '</span>' : '';
  // 备用图：一张不出来就换另一张
  var other = (pic === it.dpic) ? it.pic : it.dpic;
  var alt = (other && other !== pic) ? ' data-alt="' + esc(other) + '"' : '';
  return '<div class="hp" onclick="openHomeItem(' + i + ')" role="button" tabindex="0" aria-label="' + esc(it.name) + '">'

    + '<div class="hp-ph">' + esc(it.name) + '</div>'
    + (pic ? '<img' + imgAttrs(pic) + alt + ' alt="' + esc(it.name) + ' 海报" loading="lazy">' : '')
    + rankHtml
    + score
    + '</div>'
    + '<div class="hp-name">' + esc(it.name) + '</div>'
    + '<div class="hp-sub">' + esc([it.year, it.area].filter(Boolean).join(' · ') || it.type || '') + '</div>'
    + '</div>';
}

function hrowHTML(id, title, badge, sub, items, opts) {
  if (!items || !items.length) return '';
  opts = opts || {};
  var body = items.map(function (it, i) { return hpHTML(it, opts.rank ? i + 1 : 0); }).join('');
  return '<div class="hrow"><div class="hrow-head">'
    + '<div class="hrow-title">' + title + (badge ? '<em>' + badge + '</em>' : '') + '</div>'
    + (sub ? '<span class="hrow-sub">' + sub + '</span>' : '')
    + '<span class="hm-sp"></span>'
    + '<button class="hrow-arw" onclick="scrollRow(\'' + id + '\',-1)" aria-label="向左">&#8249;</button>'
    + '<button class="hrow-arw" onclick="scrollRow(\'' + id + '\',1)" aria-label="向右">&#8250;</button>'
    + '</div><div class="hrow-track" id="' + id + '">' + body + '</div></div>';
}

function scrollRow(id, dir) {
  var el = document.getElementById(id);
  if (el) el.scrollBy({ left: dir * Math.round(el.clientWidth * 0.82), behavior: 'smooth' });
}

function wallHTML(cat, items, n) {
  if (!items || !items.length) return '';
  var idx = CATS.indexOf(cat);
  return '<div class="wall"><div class="hrow-head">'
    + '<div class="hrow-title">' + cat + '</div>'
    + '<span class="hrow-sub">共 ' + items.length + ' 部</span>'
    + '<span class="hm-sp"></span>'
    + (idx > 0 ? '<span class="wall-more" onclick="switchCat(' + idx + ')">查看全部 ›</span>' : '')
    + '</div><div class="wall-grid">'
    + items.slice(0, n || 14).map(function (it) { return hpHTML(it, 0); }).join('')
    + '</div></div>';
}

/* ---------------- 巨幕轮播 ---------------- */
function showcaseHTML(items) {
  if (!items || !items.length) return '';
  var slides = items.map(function (it, n) {
    var i = pushItem(it);
    // 巨幕也用同一套图源策略：有中转走豆瓣大图，没有就用采集源那张
    var src = HAS_RELAY ? (it.dpic || it.pic || '') : (it.pic || it.dpic || '');
    var bg = src || '';
    var poster = src || '';
    var kicker = n === 0 ? '今日首推' : (n === 1 ? '正在热播' : '编辑推荐');
    // 背景图是模糊铺底，要宽屏比例
    var bgBig = bg ? (imgProxy(bg, 1200, 720) || bg) : '';
    return '<div class="sc-slide' + (n === 0 ? ' on' : '') + '">'
      + (bgBig ? '<img class="sc-bg" src="' + esc(bgBig) + '" data-origin="' + esc(bg) + '" data-stage="1" alt="" aria-hidden="true" referrerpolicy="no-referrer">' : '')
      + '<div class="sc-shade"></div>'
      + '<div class="sc-inner">'
      + '<div class="sc-poster">' + (poster ? '<img' + imgAttrs(poster) + ' alt="' + esc(it.name) + '">' : '') + '<div class="hp-ph">' + esc(it.name) + '</div></div>'
      + '<div class="sc-body">'
      + '<span class="sc-kicker">' + kicker + '</span>'
      + '<h2 class="sc-title">' + esc(it.name) + '</h2>'
      + '<div class="sc-meta">'
      + (it.type ? '<span>' + esc(it.type) + '</span>' : '')
      + (it.year ? '<span>' + it.year + '</span>' : '')
      + (it.area ? '<span>' + esc(it.area) + '</span>' : '')
      + (it.remarks ? '<span>' + esc(it.remarks) + '</span>' : '')
      + (parseFloat(it.score) > 0 ? '<span>评分 ' + esc(it.score) + '</span>' : '')
      + '</div>'
      + (it.blurb ? '<p class="sc-desc">' + esc(it.blurb) + '</p>' : '')
      + '<div class="sc-actions">'
      + '<span class="sc-play" onclick="openHomeItem(' + i + ')"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>立即播放</span>'
      + (items.length > 1 ? '<span class="sc-alt" onclick="scGo(' + ((n + 1) % items.length) + ')">换一部</span>' : '')
      + '</div></div></div></div>';
  }).join('');
  var dots = items.map(function (_, n) {
    return '<span class="sc-dot' + (n === 0 ? ' on' : '') + '" onclick="scGo(' + n + ')"></span>';
  }).join('');
  return '<div class="sc-stage" id="scStage">' + slides + '<div class="sc-dots">' + dots + '</div></div>';
}

function scGo(n) {
  var stage = document.getElementById('scStage');
  if (!stage) return;
  var sl = stage.querySelectorAll('.sc-slide');
  var dt = stage.querySelectorAll('.sc-dot');
  if (!sl.length) return;
  if (n >= sl.length) n = 0;
  if (n < 0) n = sl.length - 1;
  _scIdx = n;
  for (var i = 0; i < sl.length; i++) {
    if (sl[i].classList.contains('on') === (i === n)) continue;
    sl[i].classList.toggle('on', i === n);
  }
  for (var j = 0; j < dt.length; j++) dt[j].classList.toggle('on', j === n);
}

function scAuto() {
  if (_scTimer) clearInterval(_scTimer);
  _scTimer = setInterval(function () {
    if (document.hidden || _playerOpen) return;
    if (!document.getElementById('scStage')) return;
    scGo(_scIdx + 1);
  }, 7000);
}

/* ---------------- 顶部状态条 ---------------- */
function hmBarHTML() {
  var age = LIVE.ts ? Math.round((Date.now() - LIVE.ts) / 1000) : -1;
  var txt;
  if (age < 0) txt = '正在获取实时片库…';
  else if (age < 60) txt = '刚刚更新';
  else if (age < 3600) txt = Math.floor(age / 60) + ' 分钟前更新';
  else if (age < 86400) txt = Math.floor(age / 3600) + ' 小时前更新';
  else txt = Math.floor(age / 86400) + ' 天前更新';
  var hm = '';
  if (LIVE.ts) {
    var d = new Date(LIVE.ts);
    hm = ' · ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  return '<div class="hm-bar">'
    + '<span class="hm-time' + (age > 1800 ? ' stale' : '') + '"><i></i>' + txt + hm + '</span>'
    + '<span class="hm-sp"></span>'
    + '<span class="hm-refresh" id="hmRefresh" onclick="refreshLive()">刷新</span>'
    + '</div>';
}

function skeletonHTML() {
  var one = '<div class="hp"><div class="hp-poster sk sk-poster"></div>'
    + '<div class="hp-name sk" style="height:12px;margin-top:9px"></div></div>';
  var row = '';
  for (var i = 0; i < 9; i++) row += one;
  return '<div class="hrow"><div class="hrow-head"><div class="hrow-title">正在加载片库…</div></div>'
    + '<div class="hrow-track">' + row + '</div></div>';
}

/* ---------------- 整页渲染 ---------------- */
function homeHTML() {
  _homeReg = [];
  if (!LIVE.items.length) return hmBarHTML() + skeletonHTML();

  var latest = liveLatest();
  var hot = liveHot();
  var top = liveScore();

  // 巨幕：最近更新里挑热度最高、名字不长的 4 部
  var heroes = [];
  latest.slice(0, 50)
    .slice()
    .sort(function (a, b) { return (b.hitsDay - a.hitsDay) || (b.tf - a.tf); })
    .forEach(function (it) {
      if (heroes.length >= 4) return;
      if (it.pic && it.name && it.name.length <= 24) heroes.push(it);
    });
  if (heroes.length < 3) heroes = latest.slice(0, 4);
  scGoReset();

  var byCat = {};
  LIVE.items.forEach(function (it) {
    var c = liveCatOf(it.type);
    if (c) (byCat[c] = byCat[c] || []).push(it);
  });

  var h = hmBarHTML() + showcaseHTML(heroes);

  // 榜单行：优先用预置种子里带过来的豆瓣实时榜（顺序就是真实热度顺序）
  var drawn = {};
  var rowsDone = 0;
  if (LIVE.rows && LIVE.rows.length) {
    LIVE.rows.forEach(function (row) {
      var list = [];
      (row.items || []).forEach(function (id) {
        var it = LIVE.byId && LIVE.byId[id];
        if (it && !drawn[it.id]) { drawn[it.id] = 1; list.push(it); }
      });
      // 榜单里被过滤掉太多时，用同类实时数据补位，别让一行只剩几张
      if (list.length < 8) return;
      h += hrowHTML('hrow_' + row.key, row.name, row.badge || '', row.sub || '', list, { rank: true });
      rowsDone++;
    });
  }
  // 榜单没拿到（离线/接口全挂）时退回原来的实时排序，保证页面不至于空
  if (!rowsDone) {
    h += hrowHTML('hrowLatest', '刚刚更新', '实时', '按上线时间排序', latest.slice(0, 20));
    h += hrowHTML('hrowHot', '今日最热', 'HOT', '按今日播放量', hot.slice(0, 20), { rank: true });
    if (top.length >= 6) h += hrowHTML('hrowTop', '高分好评', '口碑', '按评分由高到低', top.slice(0, 20), { rank: true });
  }

  LIVE_CATS.forEach(function (c) {
    var arr = (byCat[c] || []).sort(function (a, b) { return (b.tf - a.tf) || (b.hitsDay - a.hitsDay); });
    if (arr.length >= 3) h += wallHTML(c, arr, 14);
  });

  if (!latest.length) h += '<div class="hm-empty"><b>片库暂时没拿到数据</b>采集源可能都在限流，点右上角「刷新」再试一次。</div>';
  return h;
}

function scGoReset() { _scIdx = 0; }

function paintHome() {
  var hp = document.getElementById('homePage');
  if (!hp || curCat !== 0) return;
  hp.innerHTML = homeHTML();
  armPosterTimers(hp);
  scAuto();
}

/* 首页每次重绘后，给海报挂上「超时兜底」。
 * 懒加载的图在进视口前不该计时，所以用 IntersectionObserver 进视口才开始倒计时。 */
var _posterIO = null;
function armPosterTimers(root) {
  var imgs = root.querySelectorAll('.hp-poster img[data-stage]');
  if (!imgs.length) return;
  if (typeof IntersectionObserver !== 'function') {
    for (var i = 0; i < imgs.length; i++) armImgTimer(imgs[i]);
    return;
  }
  if (!_posterIO) {
    _posterIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var el = en.target;
        _posterIO.unobserve(el);
        if (el.complete && el.naturalWidth > 0) { el.style.opacity = '1'; return; }
        armImgTimer(el);
      });
    }, { rootMargin: '220px 0px' });
  }
  for (var j = 0; j < imgs.length; j++) _posterIO.observe(imgs[j]);
}

async function loadHome() {
  var gen = ++_navGeneration;
  document.getElementById('searchPage').style.display = 'none';
  document.getElementById('heroSection').style.display = '';
  document.getElementById('filterBar').classList.remove('show');
  var hp = document.getElementById('homePage');
  hp.style.display = '';

  // ① 本地快照（0 请求）
  if (!LIVE.items.length) {
    var snap = loadLiveSnap();
    if (snap) { liveSetItems(snap.items.filter(contentOK)); LIVE.ts = snap.ts; }
  }
  var hadItems = LIVE.items.length > 0;
  hp.innerHTML = homeHTML();
  scAuto();

  // ② 预置片库：内嵌数据同步套用（0 请求），网络上的更新版本后台悄悄替换
  loadHomeSeed();
  if (!hadItems && LIVE.items.length) { hp.innerHTML = homeHTML(); scAuto(); }

  // ③ 实时接口增量刷新（后台，不阻塞）
  liveFetch(false).then(function () {
    if (gen !== _navGeneration) return;
    paintHome();
  });
  startLiveTimer();
}

function startLiveTimer() {
  if (_liveTimer) clearInterval(_liveTimer);
  _liveTimer = setInterval(function () {
    if (document.hidden || _playerOpen || curCat !== 0) return;
    if (Date.now() - LIVE.ts < LIVE_AUTO) return;
    refreshLive(true);
  }, 60000);
}

function refreshLive() {
  var btn = document.getElementById('hmRefresh');
  if (btn) { btn.classList.add('busy'); btn.textContent = '刷新中…'; }
  liveFetch(true).then(function () {
    var b = document.getElementById('hmRefresh');
    if (b) { b.classList.remove('busy'); b.textContent = '刷新'; }
    paintHome();
  });
}

function openHomeItem(i) {
  var it = _homeReg[i];
  if (!it) return;
  openPlayer(it);
}

// === CATEGORY PAGE ===
let _catPageNum = {};
let _navGeneration = 0; // 导航版本号，防止异步竞态

function catPage(catName, page) {
  const items = _catCache[catName] ? _catCache[catName].data : [];
  const totalPages = Math.ceil(items.length / PER_PAGE);
  if (page < 1 || page > totalPages) return;
  _catPageNum[catName] = page;
  const hp = document.getElementById('homePage');
  hp.style.opacity = '0';
  hp.style.transition = 'opacity .2s ease';
  setTimeout(function() {
    hp.innerHTML = paginatedSectionHTML(catName + '热门', items, page, catName);
    hp.style.opacity = '1';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 200);
}

async function switchCat(idx) {
  curCat = idx;
  curFilters = {year:'', region:'', genre:'', sort:'default'};
  const gen = ++_navGeneration; // 记录本次导航版本
  renderNav();
  if (idx === 0) { loadHome(); return; }
  
  const catName = CATS[idx];
  renderFilterBar(catName);
  const hp = document.getElementById('homePage');
  hp.style.display = '';
  document.getElementById('searchPage').style.display = 'none';
  document.getElementById('heroSection').style.display = 'none';

  // 立即用缓存数据渲染（含图片缓存预填充）
  const curated = (_catCache[catName] && _catCache[catName].data) || [];
  const imgCache = getImgCache();
  curated.forEach(function(item) {
    if (!item.pic && imgCache[item.name]) item.pic = imgCache[item.name];
  });
  if (curated.length) {
    _catPageNum[catName] = _catPageNum[catName] || 1;
    const page = _catPageNum[catName];
    _catCache[catName] = { data: curated, ts: Date.now() };
    hp.innerHTML = paginatedSectionHTML(catName + '热门', curated, page, catName);
    // 立刻预加载当前页面可见卡片的图片
    preloadVisibleCards();
  } else {
    hp.innerHTML = '<div class="loading"><div class="spin"></div>正在加载 '+catName+'...</div>';
  }

  apiLoadCatFull(catName).then(apiItems => {
    if (gen !== _navGeneration) return; // 用户已切走，丢弃结果
    if (!apiItems.length) return;
    const enriched = enrichWithApi(catName, curated, apiItems).filter(contentOK);
    _catCache[catName] = { data: enriched, ts: Date.now() };
    // Cache images
    const ic = getImgCache();
    enriched.forEach(function(item) { if (item.pic) ic[item.name] = item.pic; });
    setImgCache(ic);
    if (gen !== _navGeneration) return; // 再次检查
    const pg = _catPageNum[catName] || 1;
    hp.innerHTML = paginatedSectionHTML(catName + '热门', enriched, pg, catName);
    preloadVisibleCards();
  });
}

// 预加载当前页面上所有可见卡片的图片
function preloadVisibleCards() {
  if (_playerOpen) return; // 播放器打开时不加载图片
  requestAnimationFrame(function() {
    var cards = document.querySelectorAll('.card-poster img[loading="lazy"]');
    cards.forEach(function(img) {
      img.loading = 'eager';
      if (img.dataset && img.dataset.src) {
        img.src = img.dataset.src;
      }
    });
  });
}

// 后台为缺图的条目搜索封面图片
var _imgFetchQueue = [];
var _imgFetchRunning = false;
var _playerOpen = false; // 播放器打开时暂停图片加载，释放带宽给视频

function queueMissingImages(items) {
  var imgCache = getImgCache();
  var missing = items.filter(function(it) {
    return it.name && !it.pic && !imgCache[it.name];
  });
  if (!missing.length) return;
  // 去重
  var queued = new Set(_imgFetchQueue.map(function(m) { return m.name; }));
  missing.forEach(function(it) {
    if (!queued.has(it.name)) {
      _imgFetchQueue.push(it);
      queued.add(it.name);
    }
  });
  if (!_imgFetchRunning) runImageFetcher();
}

async function runImageFetcher() {
  _imgFetchRunning = true;
  var batchSize = 4; // 每批并发4个
  while (_imgFetchQueue.length > 0) {
    if (_playerOpen) { _imgFetchRunning = false; return; } // 播放器打开时暂停，释放带宽
    var batch = _imgFetchQueue.splice(0, batchSize);
    await Promise.all(batch.map(async function(item) {
      // 尝试从前3个API源搜索图片
      for (var si = 0; si < Math.min(3, API_SOURCES.length); si++) {
        try {
          var src = API_SOURCES[si];
          var data = await apiFetch(src.api + '?ac=detail&wd=' + encodeURIComponent(item.name));
          if (data && data.list) {
            var match = data.list.find(function(v) {
              return v.vod_pic && v.vod_name && (v.vod_name === item.name || v.vod_name.includes(item.name) || item.name.includes(v.vod_name));
            });
            if (match && match.vod_pic) {
              item.pic = match.vod_pic;
              cacheImg(item.name, match.vod_pic);
              // 将API匹配结果转换为完整的item对象，确保海报和播放数据一致
              var matchedItem = mapVodItem(match, src.name);
              // 保留原始item中有效的字段作为回退
              if (!matchedItem.playUrl && item.playUrl) matchedItem.playUrl = item.playUrl;
              if (!matchedItem.playFrom && item.playFrom) matchedItem.playFrom = item.playFrom;
              // 更新页面上对应的卡片（包括海报和onclick数据）
              updateCardImage(item.name, match.vod_pic, matchedItem);
              break;
            }
          }
        } catch(e) {}
      }
    }));
  }
  _imgFetchRunning = false;
}

function updateCardImage(name, picUrl, matchedItem) {
  var allCards = document.querySelectorAll('.card');
  allCards.forEach(function(card) {
    var titleEl = card.querySelector('.card-title');
    if (!titleEl || titleEl.textContent !== name) return;
    var poster = card.querySelector('.card-poster');
    if (!poster) return;
    var existingImg = poster.querySelector('img');
    if (existingImg && existingImg.src && !existingImg.src.includes('data:')) return;
    var ph = poster.querySelector('.card-ph');
    if (!ph) return;
    var img = document.createElement('img');
    img.src = proxyImg(picUrl);
    img.alt = name + ' 海报';
    img.loading = 'eager';
    img.referrerPolicy = 'no-referrer';
    img.style.opacity = '0';
    img.style.transition = 'opacity 0.4s ease';
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.style.display = 'block';
    img.onload = function() { img.style.opacity = '1'; ph.style.display = 'none'; };
    img.onerror = function() { img.style.display = 'none'; ph.style.display = 'flex'; };
    poster.insertBefore(img, ph);
    // 同步更新onclick数据，确保点击播放的内容与海报一致
    if (matchedItem) {
      var d = JSON.stringify(matchedItem).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
      card.setAttribute('onclick', 'openPlayer('+d+')');
      // 更新集数标签
      var epBadge = poster.querySelector('.card-ep');
      if (matchedItem.remarks) {
        if (epBadge) { epBadge.textContent = matchedItem.remarks; }
        else { var eb = document.createElement('div'); eb.className = 'card-ep'; eb.textContent = matchedItem.remarks; poster.appendChild(eb); }
      }
    }
  });
}

function enrichWithApi(catName, curated, apiItems) {
  const apiMap = {};
  const apiList = [];
  for (const item of apiItems) {
    if (item.name) {
      apiMap[item.name] = item;
      apiList.push(item);
    }
  }
  const usedNames = new Set();
  const result = curated.map(c => {
    let api = apiMap[c.name];
    if (!api) {
      api = apiList.find(a => !usedNames.has(a.name) && (a.name.includes(c.name) || c.name.includes(a.name)));
    }
    if (api) {
      usedNames.add(api.name);
      return { ...c, pic: api.pic || c.pic, actor: api.actor || c.actor,
               playFrom: api.playFrom || c.playFrom || '', playUrl: api.playUrl || c.playUrl || '',
               id: api.id || c.id, sourceIdx: api.sourceIdx !== undefined ? api.sourceIdx : c.sourceIdx,
               source: api.source || c.source,
               remarks: api.remarks || c.remarks };
    }
    return c;
  });
  if (result.length < 300) {
    const curatedNames = new Set(curated.map(c => c.name));
    for (const api of apiList) {
      if (result.length >= 300) break;
      if (!curatedNames.has(api.name) && !usedNames.has(api.name)) {
        result.push(api);
        usedNames.add(api.name);
      }
    }
  }
  // Cache images after enrichment
  const imgCache = getImgCache();
  result.forEach(function(item) { if (item.pic) imgCache[item.name] = item.pic; });
  setImgCache(imgCache);
  return result;
}

  const _expandedKws = expandKeywords(keyword);
  if (_expandedKws.length > 1) {
    var tipEl = document.querySelector('.sr-tip');
    if (tipEl) {
      tipEl.innerHTML = '正在搜索：<b>'+esc(keyword)+'</b>（智能扩展：'+_expandedKws.slice(1,4).map(k=>'<i style="color:var(--accent)">'+esc(k)+'</i>').join('、')+(_expandedKws.length>4?'...':'')+') · <span id="srCount">搜索中...</span>';
    }

  const srCount = document.getElementById('srCount');
  const srProgress = document.getElementById('srProgress');

  var _retryKws = expandKeywords(keyword);
  for (let _autoRetry = 0; _autoRetry < 2 && results.length === 0; _autoRetry++) {
    // On first retry, try expanded keywords; on second retry, try shorter substrings
    var retryKw = _autoRetry < _retryKws.length - 1 ? _retryKws[_autoRetry + 1] : keyword;

      if (srList) srList.innerHTML = renderMergedResults(filteredPartial);

      if (pt && completed && total) pt.textContent = '重试搜索... (' + completed + '/' + total + ') 已找到 ' + filteredPartial.length + ' 条';
    });
  }

  if (srProgress) srProgress.style.display = 'none';
  
  // 最终过滤：排除所有"电影解说"类无意义结果
  results = results.filter(r => !isJieshuo(r.name));
  
  if (results.length === 0) {
    if (srList) srList.innerHTML = '<div class="empty">未找到相关结果，请尝试其他关键词</div>';
    if (srCount) srCount.textContent = '共 0 条结果';
  } else {
    if (srCount) srCount.textContent = '共 ' + results.length + ' 条结果（来自 ' + new Set(results.map(r=>r.source)).size + ' 个源）';
    // 使用按源分组的渲染方式
    if (srList) srList.innerHTML = renderMergedResults(results);
  }
}

// === 智能选源：自动探测最优播放资源和线路 ===
// 探测m3u8 URL是否可达，返回响应时间(ms)，失败返回Infinity
async function probeM3u8(url, timeout) {
  timeout = timeout || 2000;
  var start = performance.now();
  try {
    // 尝试直接fetch m3u8（可能跨域失败，但能测试连通性）
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, timeout);
    var resp = await fetch(url, {
      method: 'HEAD',
      mode: 'no-cors',
      signal: controller.signal,
      cache: 'no-store'
    });
    clearTimeout(timer);
    return performance.now() - start;
  } catch(e) {
    // no-cors模式下即使成功也可能是opaque response，我们用时间来判断
    var elapsed = performance.now() - start;
    // 如果在超时前返回，说明服务器有响应（即使跨域被阻止）
    if (elapsed < timeout - 100) return elapsed;
    return Infinity;
  }
}

// 从所有资源路线中选出最快的一条
async function autoSelectBestRoute(playData, epIndex) {
  if (!playData || playData.length === 0) return 0;
  if (playData.length === 1) return 0;
  epIndex = epIndex || 0;

  var candidates = [];
  for (var ri = 0; ri < playData.length; ri++) {
    if (playData[ri].episodes && playData[ri].episodes.length > epIndex) {
      var url = playData[ri].episodes[epIndex].url;
      if (url && /\.m3u8/i.test(url)) {
        candidates.push({ route: ri, url: url });
      }
    }
  }
  if (candidates.length === 0) return 0;
  if (candidates.length === 1) return candidates[0].route;

  // 优先使用缓存的源评分数据
  var scoreCache = _routeScoreCache || {};
  var hasCachedScores = false;
  candidates.forEach(function(c) {
    var host = extractHost(c.url);
    if (scoreCache[host] && Date.now() - scoreCache[host].ts < 30 * 60 * 1000) {
      c.cachedTime = scoreCache[host].time;
      hasCachedScores = true;
    }
  });
  if (hasCachedScores) {
    var withCache = candidates.filter(function(c) { return c.cachedTime !== undefined; });
    if (withCache.length > 0) {
      withCache.sort(function(a, b) { return a.cachedTime - b.cachedTime; });
      if (withCache[0].cachedTime < 3000) return withCache[0].route;
    }
  }

  // 并发探测所有候选m3u8，选最快的
  var results = await Promise.all(candidates.map(async function(c) {
    var time = await probeM3u8(c.url, 1500);
    // 记录评分
    var host = extractHost(c.url);
    if (!_routeScoreCache) _routeScoreCache = {};
    _routeScoreCache[host] = { time: time, ts: Date.now() };
    return { route: c.route, time: time, url: c.url };
  }));

  // 按响应时间排序
  results.sort(function(a, b) { return a.time - b.time; });

  // 选最快的那条
  if (results[0].time < Infinity) {
    return results[0].route;
  }
  return 0; // 都超时就用第一条
}

// 辅助函数：提取URL的host
function extractHost(url) {
  try { return new URL(url).host; } catch(e) { return url.slice(0, 50); }
}

// 源响应时间缓存
var _routeScoreCache = {};

// === PLAYER ===
function parsePlayData(playFrom, playUrl) {
  const sources = (playFrom||'').split('$$$');
  const groups = (playUrl||'').split('$$$');
  const out = [];
  for (let i = 0; i < sources.length; i++) {
    if (!groups[i]) continue;
    const eps = groups[i].split('#').map(e => {
      const p = e.split('$');
      return p.length >= 2 ? {name:p[0], url:p[1]} : null;
    }).filter(Boolean);
    if (eps.length) out.push({source:sources[i], episodes:eps});
  }
  const m3u8Only = out.filter(s => /m3u8/i.test(s.source));
  return m3u8Only.length > 0 ? m3u8Only : out;
}

let _playData = [], _curRoute = 0;

// === 名称匹配评分函数：精确匹配 > 双向包含 > 单向包含 ===
function nameMatchScore(vodName, searchName) {
  if (!vodName || !searchName) return 0;
  if (vodName === searchName) return 100; // 完全匹配
  if (vodName.includes(searchName) && searchName.includes(vodName)) return 90; // 双向包含（几乎一样）
  if (vodName === searchName + ' ' || ' ' + vodName === searchName) return 85; // 多余空格
  if (vodName.includes(searchName) && vodName.length <= searchName.length + 4) return 70; // 包含且长度接近
  if (searchName.includes(vodName) && searchName.length <= vodName.length + 4) return 65;
  if (vodName.includes(searchName)) return 30; // 单向包含但长度差距大
  if (searchName.includes(vodName)) return 25;
  return 0;
}

// === 从API结果列表中选择最佳匹配 ===
function bestMatch(list, name) {
  if (!list || !list.length) return null;
  let best = null, bestScore = 0;
  for (var i = 0; i < list.length; i++) {
    var v = list[i];
    if (!v.vod_play_url) continue;
    var score = nameMatchScore(v.vod_name, name);
    if (score > bestScore) { bestScore = score; best = v; }
  }
  return best; // 如果没有任何名称匹配（score=0），返回null而不是随机结果
}

    + '</div>'
    + '</div>';

  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';

  // 设置续播进度
  if (startTime > 5) {
    window._pendingSavedTime = startTime;
    if (!_directMode) {
      seekIframeToSavedTime(startTime);
    }
    showAutoNextTip('续播: ' + (mem.epName || ('第'+(startEp+1)+'集')) + ' ' + fmtTime(startTime));

  }

  startProgressSaver();
  mergeMultiSources(name);
}

// Mobile: after first tap absorbed by overlay, auto-hide overlay so second tap goes to video
(function(){
  document.addEventListener('touchend', function(e){
    var ov = document.getElementById('adBlockOverlay');
    if(!ov || !ov.contains(e.target)) return;
    // First tap: overlay absorbs it (blocks the ad). Then disable overlay.
    ov.style.pointerEvents = 'none';
    ov.style.zIndex = 0;
    // Re-enable overlay after 8s to catch subsequent ad injections
    setTimeout(function(){
      if(ov && ov.parentNode){

        ov.style.zIndex = 2147483647;
      }
    }, 8000);
  }, true);

// Enhanced ad-click blocker for player area (desktop + mobile)
(function(){
  // Block ad clicks in player area
  document.addEventListener('click', function(e) {
    var pa = document.querySelector('.player-area');
    if (!pa || !pa.contains(e.target)) return;
    if (e.target.closest('.p-back,.p-top,.p-next-btn,.p-open-btn,.p-fs-btn,.p-side,.p-pill,.p-ep,#adBlockOverlay,#uiDetectOverlay')) return;
    if (e.target.tagName === 'A' || (e.target.closest && e.target.closest('a'))) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); return false;
    }
  }, true);

  // Mobile: block touchstart on ad overlays within player
  document.addEventListener('touchstart', function(e) {
    var pa = document.querySelector('.player-area');
    if (!pa || !pa.contains(e.target)) return;
    var t = e.target;
    if (t.id === 'adBlockOverlay' || t.id === 'uiDetectOverlay') return; // let our overlays handle it
    if (t.closest('.p-back,.p-top,.p-next-btn,.p-open-btn,.p-fs-btn,.p-side,.p-pill,.p-ep')) return;
    if (t.tagName === 'IFRAME' || t.tagName === 'VIDEO') return;
    // Block touch on suspicious overlay elements inside player
    if (t.tagName === 'A' || t.tagName === 'DIV' || t.tagName === 'SPAN' || t.tagName === 'IMG') {
      try {
        var st = getComputedStyle(t);
        if ((st.position === 'absolute' || st.position === 'fixed') && parseInt(st.zIndex) >= 1) {
          if (!t.closest('.p-top,.p-side,.p-next-btn,.p-open-btn,.p-fs-btn,.p-back') && t.id !== 'adBlockOverlay') {
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
            t.remove();
            return false;
          }
        }
      } catch(ex){}
    }
  }, {capture:true, passive:false});

  // Periodic cleanup inside player area (reduced frequency)
  setInterval(function(){
    var pa = document.querySelector('.player-area');
    if (!pa) return;
    pa.querySelectorAll('a,[style*="z-index"]').forEach(function(el){
      if (el.tagName === 'IFRAME' || el.tagName === 'VIDEO' || el.id === 'adBlockOverlay' || el.id === 'uiDetectOverlay') return;
      if (el.closest('.p-top,.p-side,.p-next-btn,.p-open-btn,.p-fs-btn,.p-back')) return;
      try {
        var st = getComputedStyle(el);
        if ((st.position === 'absolute' || st.position === 'fixed') && parseInt(st.zIndex) > 1) {
          el.remove();
        }
      } catch(ex){}
    });
  }, 5000);
})();

// 获取当前播放进度（尽一切努力拿到时间），用于切换线路/资源时保留
function getCurrentPlayTime() {
  var t = 0;
  // 1. 直连模式：从video元素读取
  if (_directMode && _hlsVideo) {
    try { if (_hlsVideo.currentTime > 0) t = Math.floor(_hlsVideo.currentTime); } catch(e) {}
  }
  // 2. iframe模式：尝试同源访问
  if (t < 1) {
    try {
      var iframe = document.querySelector('.player-area iframe');
      if (iframe) {
        var iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          var videos = iDoc.querySelectorAll('video');
          videos.forEach(function(v) { if (v.currentTime > 0) t = Math.floor(v.currentTime); });
        }
      }
    } catch(e) {}
  }
  // 3. 从localStorage读取上次保存的进度（每5秒自动保存一次）
  if (t < 5) {
    var titleEl = document.querySelector('.p-title');
    if (titleEl) {
      var memEntry = getPlaybackMemFor(titleEl.textContent);
      if (memEntry && memEntry.time > t) t = memEntry.time;
    }
  }
  return t;
}

async function fetchDetailAndOpen(item) {
  _playerOpen = true; // 暂停图片加载
  const name = item.name||'';
  document.getElementById('modalBox').innerHTML =
    '<div class="player-area"><div class="player-loading"><div class="spin"></div>正在加载 "'+esc(name)+'" ...</div></div>'

  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';

  let opened = false;
  const src = API_SOURCES[item.sourceIdx] || API_SOURCES[0];

  // 收集所有源的结果，选择最佳匹配（不再用竞速模式）
  const racingSources = [src, ...API_SOURCES.slice(0, 5).filter(s => s !== src)];
  const candidates = []; // {item, score}

  try {
    const results = await Promise.allSettled(racingSources.map(async (s, idx) => {
      const url = idx === 0
        ? s.api + '?ac=detail&ids=' + item.id
        : s.api + '?ac=detail&wd=' + encodeURIComponent(name);
      const data = await apiFetch(url);
      if (data && data.list && data.list.length > 0) {
        if (idx === 0) {
          // 使用ID查询的第一个源，取第一条结果但要验证名称
          var first = data.list[0];
          if (first && first.vod_play_url) {
            var score = nameMatchScore(first.vod_name, name);
            if (score >= 25) return { item: mapVodItem(first, s.name), score: score + 5 }; // ID查询加分
          }
        }
        // 名称搜索：用评分选最佳
        var match = bestMatch(data.list, name);
        if (match) {
          return { item: mapVodItem(match, s.name), score: nameMatchScore(match.vod_name, name) };
        }
      }
      return null;
    }));

    // 从所有结果中选最高分
    results.forEach(r => { if (r.status === 'fulfilled' && r.value) candidates.push(r.value); });
    candidates.sort((a, b) => b.score - a.score);

    if (candidates.length > 0 && candidates[0].item.playUrl) {
      opened = true;
      closePlayer();
      openPlayer(candidates[0].item);
    }
  } catch(e) {}

  if (!opened) { closePlayer(); searchAndOpen(name); }
}

async function searchAndOpen(name) {
  _playerOpen = true; // 暂停图片加载
  document.getElementById('modalBox').innerHTML =
    '<div class="player-area"><div class="player-loading"><div class="spin"></div>正在搜索 "'+esc(name)+'" ...</div></div>'
    + '<div class="p-top"><button class="p-back" onclick="closePlayer()">&#8592;</button><span class="p-title">'+esc(name)+'</span></div>';
  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';

  const cached = cacheGet('search:' + name + ':-1');
  if (cached && cached.length) {
    // 从缓存中用评分选最佳匹配
    let bestCached = null, bestCachedScore = 0;
    for (var ci = 0; ci < cached.length; ci++) {
      if (!cached[ci].playUrl) continue;
      var cs = nameMatchScore(cached[ci].name, name);
      if (cs > bestCachedScore) { bestCachedScore = cs; bestCached = cached[ci]; }
    }
    if (bestCached && bestCachedScore >= 25) { closePlayer(); openPlayer(bestCached); return; }
  }

  let opened = false;

  // 第一轮：并行查询前8个API源 + 所有短剧源，收集所有结果后选最佳匹配
  try {
    const candidates = [];
    const firstRoundSources = [...API_SOURCES.slice(0, 8), ...SHORT_DRAMA_SOURCES];
    // 去重同URL的源
    const seenUrls = new Set();
    const uniqueSources = firstRoundSources.filter(s => { if (seenUrls.has(s.api)) return false; seenUrls.add(s.api); return true; });
    const results = await Promise.allSettled(uniqueSources.map(async (src) => {
      const url = src.api + '?ac=detail&wd=' + encodeURIComponent(name);
      const data = await apiFetch(url);
      if (data && data.list && data.list.length > 0) {
        const match = bestMatch(data.list, name);
        if (match && match.vod_play_url) {
          return { item: mapVodItem(match, src.name), score: nameMatchScore(match.vod_name, name), allItems: data.list.map(v => mapVodItem(v, src.name)) };
        }
      }
      return null;
    }));

    results.forEach(r => { if (r.status === 'fulfilled' && r.value) candidates.push(r.value); });
    candidates.sort((a, b) => b.score - a.score);

    if (candidates.length > 0 && candidates[0].score >= 25) {
      opened = true;
      if (candidates[0].allItems) cacheSet('search:' + name + ':-1', candidates[0].allItems);
      closePlayer();
      openPlayer(candidates[0].item);
    }
  } catch(e) {}

  // 第二轮：如果前8个都没找到，用扩展关键词在剩余源搜索
  if (!opened) {
    try {
      const candidates2 = [];
      const expandedNames = expandKeywords(name);
      const secondRoundSources = API_SOURCES.slice(8);
      const searchTasks = [];
      for (var si3 = 0; si3 < secondRoundSources.length; si3++) {
        for (var ki = 0; ki < Math.min(expandedNames.length, 4); ki++) {
          searchTasks.push({ src: secondRoundSources[si3], kw: expandedNames[ki] });
        }
      }
      const results2 = await Promise.allSettled(searchTasks.map(async (task) => {
        const url = task.src.api + '?ac=detail&wd=' + encodeURIComponent(task.kw);
        const data = await apiFetch(url);
        if (data && data.list && data.list.length > 0) {
          const match = bestMatch(data.list, name);
          if (match && match.vod_play_url) {
            return { item: mapVodItem(match, task.src.name), score: nameMatchScore(match.vod_name, name) };
          }
          // If no exact match, also try picking the best from expanded keyword results
          for (var li = 0; li < data.list.length; li++) {
            var v = data.list[li];
            if (v.vod_play_url) {
              var sc = nameMatchScore(v.vod_name, name);
              if (sc >= 20) return { item: mapVodItem(v, task.src.name), score: sc };
            }
          }
        }
        return null;
      }));

      results2.forEach(r => { if (r.status === 'fulfilled' && r.value) candidates2.push(r.value); });
      candidates2.sort((a, b) => b.score - a.score);

      if (candidates2.length > 0 && candidates2[0].score >= 25) {
        opened = true;
        closePlayer();
        openPlayer(candidates2[0].item);
      }
    } catch(e) {}
  }

  if (!opened) {
    document.getElementById('modalBox').innerHTML =
      '<div class="player-area"><div class="player-loading" style="gap:16px">'
      + '<div style="font-size:48px;opacity:.5">&#128269;</div>'
      + '未找到 "'+esc(name)+'" 的播放源'
      + '<button onclick="retrySearchFromPlayer(\''+name.replace(/'/g,"\\'").replace(/\\/g,"\\\\")+'\')" style="margin-top:8px;padding:10px 28px;border-radius:20px;background:var(--accent-g);color:#fff;font-size:15px;font-weight:600;cursor:pointer;border:none;box-shadow:0 2px 12px rgba(255,140,107,.3)">重新搜索</button>'
      + '<span style="font-size:12px;color:rgba(255,255,255,.4);margin-top:4px">将返回搜索结果列表，手动选择要播放的内容</span>'
      + '</div></div>'
      + '<div class="p-top"><button class="p-back" onclick="closePlayer()">&#8592;</button><span class="p-title">'+esc(name)+'</span></div>';
  }
}

// === AUTO-PLAY NEXT ===
let _curEpIndex = 0;
let _autoNextLock = false;

const _origPlayEp = playEp;
playEp = function(r, i, btn) {
  _curEpIndex = i;
  _curRoute = r;
  _autoNextLock = false;
  cancelAutoNextCountdown();
  // Cancel any iframe seek timer
  if (window._iframeSeekTimer) { clearInterval(window._iframeSeekTimer); window._iframeSeekTimer = null; }
  // 如果是切换线路/资源触发的（_pendingSavedTime > 0），保留进度不清零
  var isRouteSwitch = window._pendingSavedTime && window._pendingSavedTime > 0;
  if (!isRouteSwitch) {
    // 手动切集：清除进度，从头播放
    window._pendingSavedTime = 0;
  }
  _origPlayEp(r, i, btn);
  // Save playback memory
  const currentName = document.querySelector('.p-title');
  if (currentName) {
    const epName = _playData[r] && _playData[r].episodes[i] ? _playData[r].episodes[i].name : '';
    // 切换线路/资源时保留原有进度时间，不覆盖为0
    if (isRouteSwitch) {
      setPlaybackMem(currentName.textContent, r, i, epName, window._pendingSavedTime);
    } else {
      setPlaybackMem(currentName.textContent, r, i, epName, 0);
    }
  }
  startEpMonitor();
  startProgressSaver();
};

let _epMonitorTimer = null;
let _epIframeLoadTime = 0;

function startEpMonitor() {
  if (_epMonitorTimer) clearInterval(_epMonitorTimer);
  _epIframeLoadTime = Date.now();
  _autoNextLock = false;

  _epMonitorTimer = setInterval(function() {
    if (_autoNextLock) return;
    try {
      const iframe = document.querySelector('.player-area iframe');
      if (!iframe) return;

      try {
        const iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          const videos = iDoc.querySelectorAll('video');
          videos.forEach(function(v) {
            if (v.ended && v.duration > 120 && v.currentTime > 60) {
              triggerAutoNext();
            }
            if (v.duration > 120 && v.currentTime > 60 && (v.duration - v.currentTime) < 2 && !v.paused) {
              triggerAutoNext();
            }
          });
        }
      } catch(e) {}

      try {
        iframe.contentWindow.postMessage({type:'getVideoStatus'}, '*');
        iframe.contentWindow.postMessage('getVideoStatus', '*');
      } catch(e) {}

    } catch(e) {}
  }, 3000);
}

window.addEventListener('message', function(e) {
  if (_autoNextLock) return;
  try {
    let data = e.data;
    if (typeof data === 'string') {
      if (data === 'ended' || data === 'videoEnd' || data === 'end' || data === 'complete') {
        triggerAutoNext();
        return;
      }
      try { data = JSON.parse(data); } catch(ex) { return; }
    }
    if (!data || typeof data !== 'object') return;

    const evtType = data.type || data.event || data.msg || data.cmd || data.action || data.name || '';
    if (/^(ended|end|videoEnd|complete|finish|over|playEnd|playComplete)$/i.test(evtType)) {
      triggerAutoNext();
      return;
    }

    const ct = data.currentTime || data.time || data.current || 0;
    const dur = data.duration || data.totalTime || data.total || 0;
    // Only trigger auto-next from messages if duration is substantial and time is very close to end
    if (dur > 120 && ct > 60 && (dur - ct) < 2 && (dur - ct) >= 0) {
      triggerAutoNext();
      return;
    }

    // Require very high percentage AND substantial reported duration to avoid false triggers from ad iframes
    const pct = data.percent || data.percentage || data.progress || -1;
    if (pct >= 99.5 && dur > 120) {
      triggerAutoNext();
      return;
    }
  } catch(ex) {}
});

function triggerAutoNext() {
  if (_autoNextLock) return;
  // Guard: must have played at least 60 seconds since episode load to prevent false triggers
  var elapsed = Date.now() - _epIframeLoadTime;
  if (elapsed < 60000) return;
  _autoNextLock = true;
  showAutoNextCountdown();
}

let _countdownTimer = null;
function showAutoNextCountdown() {
  cancelAutoNextCountdown();
  _autoNextLock = true;
  const eps = _playData[_curRoute] ? _playData[_curRoute].episodes : null;
  const nextIdx = _curEpIndex + 1;
  if (!eps || nextIdx >= eps.length) {
    showAutoNextTip('已是最后一集');
    _autoNextLock = false;
    return;
  }

  let seconds = 5;
  const overlay = document.createElement('div');
  overlay.id = 'autoNextOverlay';
  overlay.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);color:#fff;padding:14px 28px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);';

  function updateText() {

// === PERIODIC PLAYBACK TIME SAVER ===
let _progressSaveTimer = null;
function startProgressSaver() {
  if (_progressSaveTimer) clearInterval(_progressSaveTimer);
  _progressSaveTimer = setInterval(function() {
    var titleEl = document.querySelector('.p-title');
    if (!titleEl) return;
    var name = titleEl.textContent;
    if (!name) return;
    // 使用统一的时间获取函数（但不读localStorage回退，避免循环写入旧值）
    var currentTime = 0;
    if (_directMode && _hlsVideo) {
      try { if (_hlsVideo.currentTime > 0) currentTime = Math.floor(_hlsVideo.currentTime); } catch(e) {}
    }
    if (currentTime < 1) {
      try {
        var iframe = document.querySelector('.player-area iframe');
        if (iframe) {
          var iDoc = iframe.contentDocument || iframe.contentWindow.document;
          if (iDoc) {
            var videos = iDoc.querySelectorAll('video');
            videos.forEach(function(v) {
              if (v.currentTime > 0 && v.duration > 0) currentTime = Math.floor(v.currentTime);
            });
          }
        }
      } catch(e) {}
    }

    if (currentTime > 5) {
      var epName = _playData[_curRoute] && _playData[_curRoute].episodes[_curEpIndex]
        ? _playData[_curRoute].episodes[_curEpIndex].name : '';
      setPlaybackMem(name, _curRoute, _curEpIndex, epName, currentTime);
    }
  }, 3000); // Save every 3 seconds for reliable progress recovery
}

// Seek to saved time after video loads (for direct mode)
function seekToSavedTime(video, savedTime) {
  if (!video || !savedTime || savedTime < 5) return;
  function doSeek() {
    if (video.duration && video.duration > 0 && savedTime < video.duration - 5) {
      video.currentTime = savedTime;
      video.removeEventListener('loadedmetadata', doSeek);
      video.removeEventListener('canplay', doSeek);
      showAutoNextTip('已跳转到上次观看位置 ' + fmtTime(savedTime));
    }
  }
  if (video.readyState >= 1 && video.duration > 0) {
    doSeek();
  } else {
    video.addEventListener('loadedmetadata', doSeek);
    video.addEventListener('canplay', doSeek);
  }
}

// Seek iframe video to saved time (try periodically since cross-origin may block)
function seekIframeToSavedTime(savedTime) {
  if (!savedTime || savedTime < 5) return;
  // Cancel any previous seek timer
  if (window._iframeSeekTimer) { clearInterval(window._iframeSeekTimer); window._iframeSeekTimer = null; }
  var attempts = 0;
  var maxAttempts = 30; // Try for up to 30 seconds (iframe may load slowly)
  var seeked = false;
  function trySeek() {
    if (seeked) return;
    attempts++;
    if (attempts > maxAttempts) { clearInterval(seekTimer); window._iframeSeekTimer = null; return; }
    try {
      var iframe = document.querySelector('.player-area iframe');
      if (!iframe) return;
      // Try direct access (same-origin)
      try {
        var iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          var videos = iDoc.querySelectorAll('video');
          videos.forEach(function(v) {
            if (v.duration && v.duration > 0 && savedTime < v.duration - 5 && Math.abs(v.currentTime - savedTime) > 3) {
              v.currentTime = savedTime;
              seeked = true;
              clearInterval(seekTimer);
              window._iframeSeekTimer = null;
              showAutoNextTip('已跳转到上次观看位置 ' + fmtTime(savedTime));
            }
          });
        }
      } catch(e) { /* cross-origin */ }
      // Try postMessage (cross-origin) - multiple common formats
      if (!seeked) {
        try {
          iframe.contentWindow.postMessage({type:'seek', time: savedTime}, '*');
          iframe.contentWindow.postMessage({event:'seek', currentTime: savedTime}, '*');
          iframe.contentWindow.postMessage(JSON.stringify({method:'seek', time: savedTime}), '*');
          // DPlayer format
          iframe.contentWindow.postMessage(JSON.stringify({event:'seek', time: savedTime}), '*');
        } catch(e) {}
      }
    } catch(e) {}
  }
  var seekTimer = setInterval(trySeek, 1000);
  // Also try immediately when iframe loads
  var iframe = document.querySelector('.player-area iframe');
  if (iframe) {
    iframe.addEventListener('load', function onLoad() {
      iframe.removeEventListener('load', onLoad);
      // Wait a brief moment for the player inside iframe to initialize
      setTimeout(trySeek, 500);
      setTimeout(trySeek, 1500);
      setTimeout(trySeek, 3000);
    });
  }
  // Store timer so we can cancel it
  window._iframeSeekTimer = seekTimer;
}
