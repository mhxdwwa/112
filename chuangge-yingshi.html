// 从观看记录直接恢复播放（不走搜索页，直接打开播放器并跳转到上次位置）
async function resumeFromHistory(name) {
  if (!name) return;
  _playerOpen = true;
  // 立即显示加载界面
  document.getElementById('modalBox').innerHTML =
    '<div class="player-area"><div class="player-loading"><div class="spin"></div>正在加载 "'+esc(name)+'" ...</div></div>'
    + '<div class="p-top"><button class="p-back" onclick="closePlayer()">&#8592;</button><span class="p-title">'+esc(name)+'</span></div>';
  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';

  // 并发从多个源搜索，收集所有结果后选最佳匹配
  var opened = false;
  var allSources = [...API_SOURCES, ...SHORT_DRAMA_SOURCES];
  var candidates = [];
  var results = await Promise.allSettled(allSources.slice(0, 10).map(async function(src) {
    try {
      var data = await apiFetch(src.api + '?ac=detail&wd=' + encodeURIComponent(name));
      if (data && data.list) {
        var match = bestMatch(data.list, name);
        if (match) {
          return { item: mapVodItem(match, src.name), score: nameMatchScore(match.vod_name, name) };
        }
      }
    } catch(e) {}
    return null;
  }));
  results.forEach(function(r) { if (r.status === 'fulfilled' && r.value) candidates.push(r.value); });
  candidates.sort(function(a, b) { return b.score - a.score; });
  if (candidates.length > 0 && candidates[0].score >= 25) {
    opened = true;
    closePlayer();
    openPlayer(candidates[0].item);
  }

  // 如果前10个源没找到，继续搜索剩余源
  if (!opened && allSources.length > 10) {
    var candidates2 = [];
    var results2 = await Promise.allSettled(allSources.slice(10).map(async function(src) {
      try {
        var data = await apiFetch(src.api + '?ac=detail&wd=' + encodeURIComponent(name));
        if (data && data.list) {
          var match = bestMatch(data.list, name);
          if (match) {
            return { item: mapVodItem(match, src.name), score: nameMatchScore(match.vod_name, name) };
          }
        }
      } catch(e) {}
      return null;
    }));
    results2.forEach(function(r) { if (r.status === 'fulfilled' && r.value) candidates2.push(r.value); });
    candidates2.sort(function(a, b) { return b.score - a.score; });
    if (candidates2.length > 0 && candidates2[0].score >= 25) {
      opened = true;
      closePlayer();
      openPlayer(candidates2[0].item);
    }
  }

  // 如果所有源都没找到，回退到搜索
  if (!opened) {
    closePlayer();
    doSearch(name);
  }
}

function renderFilterBar(catName) {
  const bar = document.getElementById('filterBar');
  const inner = document.getElementById('filterInner');
  if (!catName || catName === '首页' || catName === '短剧' || catName === '排行榜') { bar.classList.remove('show'); return; }
  const genres = FILTER_GENRES[catName] || [];
  const regions = FILTER_REGIONS[catName] || ['全部','大陆','港台','日韩','欧美','其他'];
  function filterRow(label, items, filterKey, getVal, getLabel) {
    var h = '<div class="filter-row"><span class="filter-label">'+label+'</span>';
    items.forEach(function(item) {
      var val = getVal ? getVal(item) : (item === '全部' ? '' : item);
      var text = getLabel ? getLabel(item) : item;
      var isActive = curFilters[filterKey] === val;
      h += '<span class="filter-btn'+(isActive?' active':'')+'" onclick="setFilter(\''+filterKey+'\',\''+val+'\')">'+text+'</span>';
    });
    return h + '</div>';
  }
  let html = '';
  html += filterRow('年份', FILTER_YEARS, 'year');
  html += filterRow('地区', regions, 'region');
  if (genres.length) html += filterRow('类型', genres, 'genre');
  html += filterRow('排序', FILTER_SORT, 'sort', function(s){return s.key;}, function(s){return s.label;});
  // Active filter summary
  const activeFilters = [];
  if (curFilters.year) activeFilters.push({key:'year', label:'年份: '+curFilters.year});
  if (curFilters.region) activeFilters.push({key:'region', label:'地区: '+curFilters.region});
  if (curFilters.genre) activeFilters.push({key:'genre', label:'类型: '+curFilters.genre});
  if (curFilters.sort && curFilters.sort !== 'default') {
    const sl = FILTER_SORT.find(s => s.key === curFilters.sort);
    activeFilters.push({key:'sort', label:'排序: '+(sl?sl.label:'')});
  }
  if (activeFilters.length) {
    html += '<div class="filter-summary">';
    activeFilters.forEach(f => {
      html += '<span class="filter-tag-active" onclick="clearFilter(\''+f.key+'\')">'+f.label+'<span class="tag-x">&times;</span></span>';
    });
    html += '<span class="filter-tag-active" onclick="clearAllFilters()" style="background:rgba(255,100,100,.1);color:#ff8a80;border-color:rgba(255,100,100,.2)">清除全部<span class="tag-x">&times;</span></span>';
    html += '</div>';

  inner.innerHTML = html;
  bar.classList.add('show');
}

function clearFilter(key) {

  renderFilterBar(catName);

function applyFiltersAndRender(catName) {
  const cache = _catCache[catName];
  if (!cache || !cache.data.length) { switchCat(curCat); return; }
  let items = cache.data;
  if (curFilters.year) {
    if (curFilters.year === '更早') {
      items = items.filter(it => { const y = parseInt(it.year); return y && y < 2018; });
    } else {
      items = items.filter(it => (it.year||'').includes(curFilters.year));
    }
  }
  if (curFilters.region) {
    const regionMap = {
      '大陆': ['大陆','内地','中国','国产'],
      '香港': ['香港'],
      '台湾': ['台湾'],
      '港台': ['香港','台湾','港台'],
      '韩国': ['韩国'],
      '日本': ['日本'],
      '日韩': ['日本','韩国','日韩'],
      '美国': ['美国'],
      '英国': ['英国'],
      '欧美': ['美国','英国','欧美','法国','德国','加拿大','澳大利亚'],
      '法国': ['法国'],
      '德国': ['德国'],
      '印度': ['印度'],
      '泰国': ['泰国'],
      '其他': [],
    };
    const aliases = regionMap[curFilters.region] || [curFilters.region];
    if (curFilters.region === '其他') {
      const allKnown = Object.values(regionMap).flat();
      items = items.filter(it => { const area = (it.area||it.type||''); return !allKnown.some(a => area.includes(a)); });
    } else {
      items = items.filter(it => { const area = (it.area||it.type||''); return aliases.some(a => area.includes(a)); });
    }
  }
  if (curFilters.genre) {
    items = items.filter(it => { const t = (it.type||'') + (it.class||'') + (it.desc||''); return t.includes(curFilters.genre); });
  }
  // Apply sorting
  if (curFilters.sort && curFilters.sort !== 'default') {
    items = [...items];
    if (curFilters.sort === 'time') {
      // Keep original order (API returns newest first by default)
    } else if (curFilters.sort === 'name') {
      items.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'zh-CN'));
    } else if (curFilters.sort === 'year') {
      items.sort((a,b) => (parseInt(b.year)||0) - (parseInt(a.year)||0));
    }
  }
  const hp = document.getElementById('homePage');
  const pg = _catPageNum[catName] || 1;
  if (!items.length) {
    hp.innerHTML = '<div class="loading"><div class="spin"></div>正在从API加载 '+catName+' '+curFilters.year+' 数据...</div>';
    fetchFilteredFromApi(catName);
  } else {
    hp.innerHTML = paginatedSectionHTML(catName + '热门', items, pg, catName);
    // Also fetch more from API in background if filtered results are few
    if (items.length < 10) fetchFilteredFromApi(catName);
  }
}

async function fetchFilteredFromApi(catName) {
  const gen = _navGeneration;
  const typeMap = {'电影':'1','电视剧':'2','动漫':'4','综艺':'3','纪录片':'20'};
  const tid = typeMap[catName]||'';
  const yearParam = curFilters.year && curFilters.year !== '更早' ? '&year=' + curFilters.year : '';
  const allItems = [];
  const seen = new Set();

  // Also try class/area params
  const areaParam = curFilters.region ? '&area=' + encodeURIComponent(curFilters.region) : '';
  const classParam = curFilters.genre ? '&class=' + encodeURIComponent(curFilters.genre) : '';

  const tasks = [];
  for (const src of API_SOURCES.slice(0, 15)) {
    for (const pg of [1, 2, 3, 4, 5]) {
      tasks.push((async () => {
        try {
          const url = src.api + '?ac=detail' + (tid ? '&t=' + tid : '') + yearParam + areaParam + classParam + '&pg=' + pg;
          const data = await apiFetch(url);
          if (data && data.list) return data.list.map(it => mapVodItem(it, src.name));
        } catch(e) {}
        return [];
      })());
    }
  }
  const results = await Promise.all(tasks);
  for (const batch of results) {
    for (const item of batch) {
      if (!item.name || seen.has(item.name)) continue;
      seen.add(item.name);
      allItems.push(item);
    }
  }

  if (gen !== _navGeneration) return; // 用户已切走，丢弃结果

  if (allItems.length > 0) {
    // Merge into cache
    const cache = _catCache[catName];
    if (cache && cache.data) {
      const existingNames = new Set(cache.data.map(it => it.name));
      allItems.forEach(it => { if (!existingNames.has(it.name)) { cache.data.push(it); existingNames.add(it.name); } });
      cache.ts = Date.now();
    }
    // Re-apply filters with new data
    let items = cache ? cache.data : allItems;
    if (curFilters.year) {
      if (curFilters.year === '更早') {
        items = items.filter(it => { const y = parseInt(it.year); return y && y < 2018; });
      } else {
        items = items.filter(it => (it.year||'').includes(curFilters.year));
      }
    }
    if (curFilters.region) {
      const regionMap = {
        '大陆': ['大陆','内地','中国','国产'],
        '香港': ['香港'],
        '台湾': ['台湾'],
        '港台': ['香港','台湾','港台'],
        '韩国': ['韩国'],
        '日本': ['日本'],
        '日韩': ['日本','韩国','日韩'],
        '美国': ['美国'],
        '英国': ['英国'],
        '欧美': ['美国','英国','欧美','法国','德国','加拿大','澳大利亚'],
        '法国': ['法国'],
        '德国': ['德国'],
        '印度': ['印度'],
        '泰国': ['泰国'],
        '其他': [],
      };
      const aliases = regionMap[curFilters.region] || [curFilters.region];
      if (curFilters.region === '其他') {
        const allKnown = Object.values(regionMap).flat();
        items = items.filter(it => { const area = (it.area||it.type||''); return !allKnown.some(a => area.includes(a)); });
      } else {
        items = items.filter(it => { const area = (it.area||it.type||''); return aliases.some(a => area.includes(a)); });
      }
    }
    if (curFilters.genre) {
      items = items.filter(it => { const t = (it.type||'') + (it.class||'') + (it.desc||''); return t.includes(curFilters.genre); });
    }
    // Apply sorting
    if (curFilters.sort && curFilters.sort !== 'default') {
      items = [...items];
      if (curFilters.sort === 'name') items.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'zh-CN'));
      else if (curFilters.sort === 'year') items.sort((a,b) => (parseInt(b.year)||0) - (parseInt(a.year)||0));
    }
    if (gen !== _navGeneration) return; // 用户已切走
    const hp = document.getElementById('homePage');
    if (!items.length) {
      hp.innerHTML = '<div class="empty">当前筛选条件下没有找到内容，请尝试调整筛选</div>';
    } else {
      const pg = _catPageNum[catName] || 1;
      hp.innerHTML = paginatedSectionHTML(catName + '热门', items, pg, catName);
    }
  } else {
    if (gen !== _navGeneration) return; // 用户已切走
    const hp = document.getElementById('homePage');
    if (hp.querySelector('.loading')) {
      hp.innerHTML = '<div class="empty">当前筛选条件下没有找到内容，请尝试调整筛选</div>';
    }
  }
}

function setPlaybackMem(name, route, epIdx, epName, currentTime) {
  if (!name) return;
  const mem = getPlaybackMem();
  mem[name] = { route, epIdx, epName, ts: Date.now(), time: currentTime || 0 };
  const keys = Object.keys(mem);
  if (keys.length > 200) {
    const sorted = keys.sort((a,b) => (mem[a].ts||0) - (mem[b].ts||0));
    sorted.slice(0, keys.length - 200).forEach(k => delete mem[k]);
  }
  try { localStorage.setItem('wyh_playmem', JSON.stringify(mem)); } catch(e) {}
}
function getPlaybackMemFor(name) {
  const mem = getPlaybackMem();
  return mem[name] || null;
}

// === SEARCH SUGGESTIONS ===
let _suggestTimer = null;
function onSearchInput(val, suggestId) {
  clearTimeout(_suggestTimer);
  const el = document.getElementById(suggestId);
  if (!val || !val.trim()) { 
    // 当输入为空时，隐藏搜索建议/历史记录
    hideSuggest(suggestId);
    return; 
  }
  _suggestTimer = setTimeout(() => buildSuggestions(val.trim(), suggestId), 150);
}

function buildSuggestions(keyword, suggestId) {
  const el = document.getElementById(suggestId);
  const kw = keyword.toLowerCase();
  const suggestions = [];
  const seen = new Set();
  // Generate expanded keywords for better suggestion matching
  const expandedKws = expandKeywords(keyword).map(k => k.toLowerCase());
  function matchesAny(name) {
    const n = name.toLowerCase();
    return expandedKws.some(k => n.includes(k) || k.includes(n));
  }
  getHistory().forEach(h => {
    if (matchesAny(h.name) && !seen.has(h.name)) {
      seen.add(h.name);
      suggestions.push({text: h.name, tag: '历史', icon: '\u{1F550}'});
    }
  });
  HOT_WORDS.forEach(w => {
    if (matchesAny(w) && !seen.has(w) && suggestions.length < 12) {
      seen.add(w);
      suggestions.push({text: w, tag: '热搜', icon: '\u{1F525}'});
    }
  });
  if (!suggestions.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  el.innerHTML = suggestions.slice(0, 8).map(s => {
    const isHistory = s.tag === '历史';
    const encodedText = encodeURIComponent(s.text);
    const delBtn = isHistory 
      ? `<span class="sg-del" onclick="event.stopPropagation();removeHistoryItem(decodeURIComponent(this.parentElement.getAttribute('data-text')))" title="删除此记录">✕</span>` 
      : '';
    return `<div class="suggest-item" onclick="doSearch(decodeURIComponent(this.getAttribute('data-text')))" data-text="${encodedText}">`
      + `<span class="sg-icon">${s.icon}</span>`
      + `<span class="sg-text">${esc(s.text)}</span>`
      + (s.tag ? `<span class="sg-tag">${esc(s.tag)}</span>` : '')
      + delBtn
      + `</div>`;
  }).join('');
  el.classList.add('show');
}

function onSearchKeydown(e, suggestId) {
  if (e.key === 'Enter') { hideSuggest(suggestId); doSearch(e.target.value); }
  else if (e.key === 'Escape') { hideSuggest(suggestId); }
}

function hideSuggest(id) {
  const el = document.getElementById(id);
  if (el) {
    const inputId = id === 'heroSuggest' ? 'heroInput' : 'inlineInput';
    const activeEl = document.activeElement;
    // 如果焦点仍然在输入框或下拉列表内部（例如正在点击删除按钮），则不隐藏
    if (activeEl && (activeEl.id === inputId || el.contains(activeEl))) {
      return;
    }
    el.classList.remove('show');
  }
}

// === MULTI-SOURCE MERGING ===
async function mergeMultiSources(name) {
  const allRoutes = [];
  const seenSources = new Set();
  _playData.forEach(r => seenSources.add(r.source));
  const promises = API_SOURCES.slice(0, 10).map(async (src) => {
    try {
      const url = src.api + '?ac=detail&wd=' + encodeURIComponent(name);
      const data = await apiFetch(url);
      if (data && data.list) {
        const match = bestMatch(data.list, name) || data.list.find(v => v.vod_name === name);
        if (match && match.vod_play_url) {
          const routes = parsePlayData(match.vod_play_from, match.vod_play_url);
          routes.forEach(route => {
            const routeKey = src.name + ':' + route.source;
            if (!seenSources.has(routeKey)) {
              seenSources.add(routeKey);
              route.source = src.name + ' ' + route.source;
              allRoutes.push(route);
            }
          });
        }
      }
    } catch(e) {}
  });
  await Promise.all(promises);
  if (allRoutes.length > 0) {
    _playData.push(...allRoutes);
    const routeContainer = document.querySelector('.p-controls');
    if (routeContainer) {
      let routePills = _playData.map((s,i) => '<span class="p-pill'+(i===_curRoute?' active':'')+'" onclick="switchRoute('+i+')">'+esc(s.source)+'</span>').join('');
      let routeRow = routeContainer.querySelector('[data-route-row]');
      if (!routeRow) {
        const firstRow = routeContainer.querySelector('.p-row');
        routeRow = document.createElement('div');
        routeRow.className = 'p-row';
        routeRow.setAttribute('data-route-row', '1');
        if (firstRow && firstRow.nextSibling) {
          firstRow.parentNode.insertBefore(routeRow, firstRow.nextSibling);
        } else {
          routeContainer.appendChild(routeRow);
        }
      }
      routeRow.innerHTML = '<span class="p-row-label">资源线路 ('+_playData.length+'个)</span>' + routePills;
    }
    showAutoNextTip('已合并 ' + allRoutes.length + ' 条额外线路');
  }
}

// === SOURCE MANAGEMENT ===
function loadUserSources() {
  try {
    const saved = JSON.parse(localStorage.getItem('wyh_custom_sources')||'null');
    if (saved && saved.apis) {
      saved.apis.forEach(s => { if (!API_SOURCES.find(a => a.api === s.api)) { API_SOURCES.push(s); } });
    }
    if (saved && saved.players) {
      saved.players.forEach(p => { if (!PLAYERS.find(a => a.url === p.url)) { PLAYERS.push(p); } });
    }
    if (saved && saved.removedApis) {
      saved.removedApis.forEach(url => { const idx = API_SOURCES.findIndex(a => a.api === url); if (idx >= 0) API_SOURCES.splice(idx, 1); });
    }
    if (saved && saved.removedPlayers) {
      saved.removedPlayers.forEach(url => { const idx = PLAYERS.findIndex(p => p.url === url); if (idx >= 0) PLAYERS.splice(idx, 1); });
    }
  } catch(e) {}
}

function saveUserSources() {
  const defaultApiUrls = DEFAULT_API_SOURCES.map(s => s.api);
  const defaultPlayerUrls = DEFAULT_PLAYERS.map(p => p.url);
  const customApis = API_SOURCES.filter(s => !defaultApiUrls.includes(s.api));
  const customPlayers = PLAYERS.filter(p => !defaultPlayerUrls.includes(p.url));
  const removedApis = defaultApiUrls.filter(url => !API_SOURCES.find(s => s.api === url));
  const removedPlayers = defaultPlayerUrls.filter(url => !PLAYERS.find(p => p.url === url));
  try { localStorage.setItem('wyh_custom_sources', JSON.stringify({ apis: customApis, players: customPlayers, removedApis, removedPlayers })); } catch(e) {}
}

// 通过 GitHub API 保存 shows.json
async function saveShowsToGitHub() {
  const token = getGitHubToken();
  if (!token) {
    showAutoNextTip('请先配置 GitHub Token');
    return;
  }
  
  // 收集所有剧名
  const shows = {};
  ['tv', 'movie', 'variety', 'anime', 'shortdrama'].forEach(key => {
    const textarea = document.getElementById('shows_' + key);
    if (textarea) {
      const names = textarea.value.split('\n').map(s => s.trim()).filter(Boolean);
      shows[key] = names;
    }
  });
  
  const repo = getGitHubRepo();
  const [owner, repoName] = repo.split('/');
  const filePath = 'shows.json';
  const content = JSON.stringify(shows, null, 2);
  const base64Content = btoa(unescape(encodeURIComponent(content)));
  
  const saveBtn = document.getElementById('saveShowsBtn');
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中...';
  }
  
  try {
    // 先获取文件的 SHA（用于更新）
    const getUrl = `https://api.github.com/repos/${owner}/${repoName}/contents/${filePath}`;
    const getResp = await fetch(getUrl, {
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    
    let sha = null;
    if (getResp.ok) {
      const getData = await getResp.json();
      sha = getData.sha;
    }
    
    // 创建或更新文件
    const putUrl = `https://api.github.com/repos/${owner}/${repoName}/contents/${filePath}`;
    const putBody = {
      message: 'Update shows.json - 更新剧名列表',
      content: base64Content,
    };
    if (sha) {
      putBody.sha = sha;
    }
    
    const putResp = await fetch(putUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(putBody)
    });
    
    if (putResp.ok) {
      // 更新本地缓存
      _loadedShows = shows;
      showAutoNextTip('保存成功！所有用户刷新页面即可看到更新');
      renderSettings();
    } else {
      const errData = await putResp.json();
      const errMsg = errData.message || '保存失败';
      if (putResp.status === 401) {
        showAutoNextTip('Token 无效或已过期，请重新配置');
      } else if (putResp.status === 403) {
        showAutoNextTip('权限不足，请检查 Token 权限');
      } else {
        showAutoNextTip('保存失败：' + errMsg);
      }
    }
  } catch(e) {
    showAutoNextTip('网络错误：' + e.message);
  }
  
  if (saveBtn) {
    saveBtn.disabled = false;
    saveBtn.textContent = '💾 保存到 GitHub（所有人立即生效）';
  }
}

  }
  
  try {
    const [owner, repoName] = repo.split('/');
    const url = `https://api.github.com/repos/${owner}/${repoName}/contents/shows.json`;
    const resp = await fetch(url, {
      headers: {
        'Authorization': `token ${token}`,

// 导出完整的 shows.json 文件
function exportShowsJson() {
  const shows = {};
  ['tv', 'movie', 'variety', 'anime', 'shortdrama'].forEach(key => {
    const textarea = document.getElementById('shows_' + key);
    if (textarea) {
      const names = textarea.value.split('\n').map(s => s.trim()).filter(Boolean);
      shows[key] = names;
    }
  });
  const jsonStr = JSON.stringify(shows, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'shows.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showAutoNextTip('shows.json 已下载');
}

// 导入 shows.json 文件预览
function importShowsJson(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      ['tv', 'movie', 'variety', 'anime', 'shortdrama'].forEach(key => {
        const textarea = document.getElementById('shows_' + key);
        if (textarea && data[key] && Array.isArray(data[key])) {
          textarea.value = data[key].join('\n');
        }
      });
      showAutoNextTip('已导入，可编辑后点击「保存」同步到 GitHub');
    } catch(err) {
      showAutoNextTip('文件格式错误，请确保是有效的 JSON 文件');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function addSource(type) {
  if (type === 'api') {
    const name = document.getElementById('newSrcName').value.trim();
    const url = document.getElementById('newSrcUrl').value.trim();
    if (!name || !url) { showAutoNextTip('请输入名称和地址'); return; }
    if (API_SOURCES.find(s => s.api === url)) { showAutoNextTip('该源已存在'); return; }
    API_SOURCES.push({name, api: url});
  } else {
    const name = document.getElementById('newPlayerName').value.trim();
    const url = document.getElementById('newPlayerUrl').value.trim();
    if (!name || !url) { showAutoNextTip('请输入名称和地址'); return; }
    if (PLAYERS.find(p => p.url === url)) { showAutoNextTip('该线路已存在'); return; }
    PLAYERS.push({name, url});
  }
  saveUserSources();
  renderSettings();
  showAutoNextTip('添加成功');
}

function removeSource(type, idx) {
  if (type === 'api') { API_SOURCES.splice(idx, 1); } else { PLAYERS.splice(idx, 1); }
  saveUserSources();
  renderSettings();
}

function resetSources() {
  localStorage.removeItem('wyh_custom_sources');
  API_SOURCES.length = 0;
  DEFAULT_API_SOURCES.forEach(s => API_SOURCES.push({...s}));
  PLAYERS.length = 0;
  DEFAULT_PLAYERS.forEach(p => PLAYERS.push({...p}));
  renderSettings();
  showAutoNextTip('已恢复默认设置');
}

      mutations.forEach(function(mut) {
        mut.addedNodes.forEach(function(node) {
          if (node.nodeType !== 1) return;
          if (isSafeElement(node)) return;
          // Check the node itself
          if (isLikelyAd(node)) {
            node.style.display = 'none';
            node.style.visibility = 'hidden';
            node.style.pointerEvents = 'none';
            adDetected = true;
          }
          // Check children
          if (node.querySelectorAll) {
            node.querySelectorAll('div,a,iframe,img,span,section').forEach(function(child) {
              if (!isSafeElement(child) && isLikelyAd(child)) {
                child.style.display = 'none';
                child.style.visibility = 'hidden';
                adDetected = true;
              }
            });
          }
          // Rogue iframes
          if (node.tagName === 'IFRAME' && !isSafeElement(node)) {
            node.remove();
            adDetected = true;
          }
        });
      });
      if (adDetected) {
        if (_shieldVisible) {
          // Already showing shield, just keep killing ads
        } else {
          // Mid-video ad: try to skip
          if (now - _lastAdSkipTime > 12000) {
            _lastAdSkipTime = now;
            trySkip10s();
            showAdGuardTip('\u68C0\u6D4B\u5230\u5E7F\u544A\uFF0C\u5DF2\u5C1D\u8BD5\u8DF3\u8FC710\u79D2');
          }
        }
      }
    });
    _adGuardObserver.observe(document.documentElement, { childList: true, subtree: true });

    _adScanTimer = setInterval(function() {
      var mask = document.getElementById('modalMask');

      scanAndKillAds();

      // Also try to bind video events if iframe is same-origin
      try {
        var iframe = document.querySelector('.player-area iframe');
        if (!iframe) return;
        var iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          iDoc.querySelectorAll('video').forEach(function(v) {
            if (!v._adGuardBound) {
              v._adGuardBound = true;
              v.addEventListener('pause', function() {
                setTimeout(function() {
                  if (v.paused && !v.ended && v.currentTime > 0) showShield();
                }, 350);
              });
              v.addEventListener('play', function() { hideShield(); });
              v.addEventListener('playing', function() { hideShield(); });
            }
          });
        }

    }, 2000);
  }

    _adGuardActive = false;
    window.removeEventListener('blur', onWindowBlur);
    window.removeEventListener('focus', onWindowFocus);
    if (_adGuardObserver) { _adGuardObserver.disconnect(); _adGuardObserver = null; }
    if (_adScanTimer) { clearInterval(_adScanTimer); _adScanTimer = null; }
    if (_blurScanTimer) { clearTimeout(_blurScanTimer); _blurScanTimer = null; }

    if (!_adGuardActive) return;
    try {

        if (data === 'play' || data === 'playing' || data === 'resume') { hideShield(); return; }

      if (evtType === 'play' || evtType === 'playing' || evtType === 'resume') { hideShield(); }
    } catch(ex) {}
  });

  var _origOpen = window.openPlayer;
  window.openPlayer = function() { _origOpen.apply(this, arguments); setTimeout(startAdGuard, 500); };
  var _origClose = window.closePlayer;
  window.closePlayer = function() { stopAdGuard(); _origClose.apply(this, arguments); };
})();

//   1. 网址加 ?relay=https://xxx.workers.dev   —— 当场设置并记住
//   2. 上次记住的值（localStorage）
//   3. 仓库根目录的 relay.txt 里第一行 http(s) 地址
// 三个都没有 = 不走中转，退化成「直连 → 解析线路」两级。
var RELAY_BASE = (function () {
  var qs = '';
  try {
    var m = /[?&]relay=([^&#]+)/.exec(location.search);
    if (m) {
      var v = decodeURIComponent(m[1]);
      if (/^https?:\/\//i.test(v)) { qs = v; try { localStorage.setItem('wyh_relay_base', v); } catch (e) {} }
    }
    if (qs) return qs.replace(/\/+$/, '');
    var saved = '';
    try { saved = localStorage.getItem('wyh_relay_base') || ''; } catch (e) {}
    if (/^https?:\/\//i.test(saved)) return saved.replace(/\/+$/, '');
    // relay.txt 极小，同步读一下，保证播放前就绪
    var x = new XMLHttpRequest();
    x.open('GET', 'relay.txt?_=' + Date.now(), false);
    x.send(null);
    if (x.status >= 200 && x.status < 300) {
      var hit = '';
      (x.responseText || '').split(/\r?\n/).some(function (ln) {
        var t = ln.trim();
        if (/^https?:\/\//i.test(t)) { hit = t.split(/\s+/)[0]; return true; }
        return false;
      });
      if (hit) { try { localStorage.setItem('wyh_relay_base', hit); } catch (e) {} return hit.replace(/\/+$/, ''); }
    }
  } catch (e) {}
  return '';
})();

var _relayAttempted = false;
var _curSrcUrl = '';

// 强制走中转：网址加 ?force=1 打开（会记住），?force=0 关掉。
// 有些源本身就允许跨域，直连能成功，但直连不经过中转 = 广告不会被剥。
var _forceRelay = (function () {
  try {
    if (/[?&]force=1(&|$)/.test(location.search)) { localStorage.setItem('wyh_force_relay', '1'); return true; }
    if (/[?&]force=0(&|$)/.test(location.search)) { localStorage.setItem('wyh_force_relay', '0'); return false; }
    return localStorage.getItem('wyh_force_relay') === '1';
  } catch (e) { return false; }
})();

try {
  console.log('[中转] ' + (RELAY_BASE
    ? '已启用 ' + RELAY_BASE + (_forceRelay ? '（强制模式，能直连也走中转）' : '')
    : '未配置域名，改用同源 /api/image-relay（Worker 已挂在站点上）'));
} catch (e) {}

// ---- 同源 Worker 路径 ----
// wscls.cn 站点上已经挂了 Cloudflare Worker（worker/worker.js），路由是 /api/image-relay/*。
// 它和页面同域，不受 CORS 限制，比外面的公共中转稳得多：
//   取采集接口 → /api/image-relay/vod-proxy?url=
//   取海报图   → /api/image-relay/img?url=
// 所以就算没写 relay.txt，也能靠它把接口和图片都跑通。
var SAME_RELAY = '/api/image-relay';
var HAS_SAME_RELAY = true;        // 静态发布环境里路径不存在会返回 SPA 兜底页，取数失败自然降级
function pickRelay(path) {
  if (RELAY_BASE) return RELAY_BASE.replace(/\/+$/, '') + path;
  return SAME_RELAY + path;
}

// ============================================================
// 播放器内置去广告
// hls.js 拿到清单文本后、解析之前剪一刀，把插播的广告分片剔掉。
// 不依赖中转：只要源站给了 CORS（量子系就是 Access-Control-Allow-Origin: *），
// 这一段就能在浏览器里直接把那 25 秒赌场广告剪掉。
// 判定逻辑和 worker.js 里的保持一致：源站标记 / 目录根异常 / 域名异常 / 路径关键词 / 断点短岛。
// ============================================================
var _AD_TOKENS = /(?:^|[\/_\-.])(ad|ads|adv|advert|advideo|guanggao|gg|sponsor|preroll|midroll|postroll|commercial|spot|tuiguang|win|bet)(?:[\/_\-.]|$)/i;
var _AD_MARKER = /(?:ad[-_\s]?inject|ppvod-ad|advert|guanggao|插入广告)/i;

function _absUrl(u, base) {
  try { return new URL(u, base).href; } catch (e) { return u; }
}

// 目录根 = 路径前两段目录（不含文件名）。广告切片来自另一部片子，目录根和正片不同
function _pathRoot(u, base) {
  try {
    var p = new URL(u, base).pathname.split('/').filter(Boolean);
    var d = p.slice(0, -1);
    return d.length ? d.slice(0, Math.min(2, d.length)).join('/') : '';
  } catch (e) { return ''; }
}

function _stripAdsFromText(text, baseUrl) {
  if (!text || text.indexOf('#EXTM3U') !== 0) return null;
  var lines = text.split(/\r?\n/);
  var segs = [], markers = [], extinf = -1, disc = -1, i;

  for (i = 0; i < lines.length; i++) {
    var s = lines[i].trim();
    if (!s) continue;
    if (s.charAt(0) === '#') {
      if (!/^#EXT/i.test(s) && _AD_MARKER.test(s)) markers.push(i);
      if (s.indexOf('#EXTINF') === 0) extinf = i;
      else if (s.indexOf('#EXT-X-DISCONTINUITY') === 0 || s.indexOf('#EXT-X-CUE-OUT') === 0) disc = i;
      continue;
    }
    var m = extinf >= 0 ? /#EXTINF:\s*([\d.]+)/.exec(lines[extinf]) : null;
    segs.push({ line: i, uri: s, dur: m ? parseFloat(m[1]) : 0, extinfLine: extinf, discLine: disc, sus: '' });
    extinf = -1; disc = -1;
  }
  if (segs.length < 8) return null;

  var hostCount = {}, rootCount = {};
  segs.forEach(function (sg) {
    var h = '';
    try { h = new URL(_absUrl(sg.uri, baseUrl)).host; } catch (e) {}
    if (h) hostCount[h] = (hostCount[h] || 0) + 1;
    var r = _pathRoot(sg.uri, baseUrl);
    if (r) rootCount[r] = (rootCount[r] || 0) + 1;
  });
  var hostKeys = Object.keys(hostCount).sort(function (a, b) { return hostCount[b] - hostCount[a]; });
  var rootKeys = Object.keys(rootCount).sort(function (a, b) { return rootCount[b] - rootCount[a]; });
  var domHost = hostKeys[0] || '', domRoot = rootKeys[0] || '';
  var hostLim = Math.max(3, (hostCount[domHost] || 0) * 0.15);
  var rootLim = Math.max(3, (rootCount[domRoot] || 0) * 0.15);
  var rootSane = rootKeys.length > 1 && rootKeys.length <= segs.length * 0.3;

  segs.forEach(function (sg) {
    var h = '';
    try { h = new URL(_absUrl(sg.uri, baseUrl)).host; } catch (e) {}
    if (h && h !== domHost && hostCount[h] <= hostLim) sg.sus = 'host';
    var r = _pathRoot(sg.uri, baseUrl);
    if (!sg.sus && rootSane && r && r !== domRoot && rootCount[r] <= rootLim) sg.sus = 'root';
    if (!sg.sus && _AD_TOKENS.test(sg.uri)) sg.sus = 'token';
  });

  // 断点分组
  var runs = [], cur = null;
  segs.forEach(function (sg, idx) {
    if (!cur || sg.discLine >= 0) { cur = { start: idx, count: 0, dur: 0, end: idx }; runs.push(cur); }
    cur.count++; cur.dur += sg.dur; cur.end = idx;
  });
  function runOf(idx) {
    for (var k = 0; k < runs.length; k++) if (idx >= runs[k].start && idx <= runs[k].end) return k;
    return -1;
  }

  // 源站自己写的广告标记
  var marked = {};
  markers.forEach(function (ln) {
    for (var k = 0; k < segs.length; k++) {
      if (segs[k].line > ln) {
        var ri = runOf(k);
        if (ri >= 0 && runs[ri].count <= 40) marked[ri] = 1;
        return;
      }
    }
  });

  var durs = segs.map(function (sg) { return sg.dur; }).filter(function (d) { return d > 0; }).sort(function (a, b) { return a - b; });
  var median = durs.length ? durs[Math.floor(durs.length / 2)] : 0;

  var cand = [];
  runs.forEach(function (r, ri) {
    if (ri === 0 || ri === runs.length - 1) return;   // 首尾不判，避免误伤片头片尾
    if (r.dur < 5 || r.dur > 45) return;
    if (r.count > 12) return;
    cand.push(r);
  });

  var confirmed = {};
  cand.forEach(function (r, ci) {
    if (marked[runOf(r.start)]) { confirmed[ci] = 1; return; }
    var hit = false;
    for (var k = r.start; k <= r.end && !hit; k++) if (segs[k].sus) hit = true;
    if (hit) { confirmed[ci] = 1; return; }
    var avg = r.dur / r.count;
    if (median > 0 && Math.abs(avg - median) > median * 0.35) { confirmed[ci] = 1; return; }
    for (var j = 0; j < cand.length; j++) {
      if (j === ci) continue;
      var o = cand[j].dur;
      if (Math.abs(o - r.dur) <= Math.max(2, Math.min(o, r.dur) * 0.3)) { confirmed[ci] = 1; return; }
    }
  });

  var drop = {}, removed = 0, removedDur = 0;
  Object.keys(confirmed).forEach(function (ci) {
    var r = cand[ci];
    for (var k = r.start; k <= r.end; k++) {
      drop[segs[k].line] = 1;
      if (segs[k].extinfLine >= 0) drop[segs[k].extinfLine] = 1;
      removed++;
      removedDur += segs[k].dur || 0;
    }
  });
  segs.forEach(function (sg) {
    if (sg.sus === 'token' && !drop[sg.line]) {
      drop[sg.line] = 1;
      if (sg.extinfLine >= 0) drop[sg.extinfLine] = 1;
      removed++;
    }
  });
  if (!removed) return null;

  // 安全阀：有些源把整片按 ~25 秒一段打散并塞满断点，判据会整段整段地误杀。
  // 宁可带着广告放，也不能把正片剪没。
  if (removed > segs.length * 0.18 || removedDur > 100) {
    console.warn('[去广告] 判定要剪 ' + removed + '/' + segs.length + ' 段（' + Math.round(removedDur) + 's），超出安全阈值，本次跳过 · ' + baseUrl);
    return null;
  }

  // 挖掉广告岛会留下连续两条断点，合并成一条（不合并 hls.js 会告警）
  var out = [], prevDisc = false;
  for (i = 0; i < lines.length; i++) {
    if (drop[i]) continue;
    var isDisc = lines[i].trim() === '#EXT-X-DISCONTINUITY';
    if (isDisc && prevDisc) continue;
    prevDisc = isDisc;
    out.push(lines[i]);
  }
  return { text: out.join('\n'), removed: removed };
}

// 包一层 hls.js 的清单加载器：解析前把广告剪掉
function _makeAdLoader(Base) {
  return class AdStripLoader extends Base {
    load(context, config, callbacks) {
      var orig = callbacks.onSuccess;
      callbacks.onSuccess = function (response, stats, ctx, xhr) {
        try {
          if (response && typeof response.data === 'string' && response.data.indexOf('#EXTM3U') === 0) {
            var base = (ctx && ctx.url) || response.url || _curSrcUrl;
            var r = _stripAdsFromText(response.data, base);
            if (r) {
              console.log('[去广告] 剪掉 ' + r.removed + ' 个广告分片 · ' + base);
              response.data = r.text;
            }
          }
        } catch (e) {}
        orig(response, stats, ctx, xhr);
      };
      super.load(context, config, callbacks);
    }
  };
}

function relayUrl(u) {
  if (!RELAY_BASE || !u) return u;
  return RELAY_BASE.replace(/\/+$/, '') + '/p?u=' + encodeURIComponent(u);
}

// 一键体检：播放任意一集 → F12 → 输入 tcInspect() 回车
// 作用：把当前这集的 m3u8 拆开看，判断那 15 秒广告是「独立分片」（能删）还是
//       已经混进正片分片里（删不掉，只能换线路或跳过）
window.tcInspect = function (u) {
  var target = u || _curSrcUrl || _currentM3u8Url;
  if (!target) {
    console.warn('[体检] 先播一集，或者自己传地址进来：tcInspect("https://xxx/index.m3u8")');
    return '';
  }
  if (!RELAY_BASE) {
    console.warn('[体检] RELAY_BASE 还是空的 —— 先把 Worker 域名填进 index.html');
    return '';
  }
  var box = RELAY_BASE.replace(/\/+$/, '') + '/inspect?u=' + encodeURIComponent(target);
  console.log('[体检] ' + box);
  fetch(box).then(function (r) { return r.json(); }).then(function (d) {
    console.log('[体检] 原始结果', d);
    if (d.kind === 'master') {
      console.warn('[体检] 这是多码率主清单，广告不在里面。把其中一条子清单地址再查一次。');
      return;
    }
    if (d.error) { console.warn('[体检] 上游没返回 m3u8：' + d.error); return; }
    console.log('%c判定：' + d.verdict, 'font-size:14px;font-weight:700;color:' + (d.suspectCount ? '#e0413a' : '#7a8699'));
    console.log('段数 ' + d.segments + ' · 总时长 ' + d.totalDuration + 's · 断点 ' + d.discontinuities
      + ' · 正片段长中位数 ' + d.medianSegDur + 's · 可疑 ' + d.suspectCount + ' 段');
    if (d.suspects && d.suspects.length) console.table(d.suspects.slice(0, 30));
  }).catch(function (e) { console.warn('[体检] 请求失败：' + e.message + '（多半是 Worker 没部署或域名填错）'); });
  return box;
};

function destroyHls() {
  if(_dpUpdateTimer){ clearInterval(_dpUpdateTimer); _dpUpdateTimer=null; }
  if(_aggressiveBufferTimer){ clearInterval(_aggressiveBufferTimer); _aggressiveBufferTimer=null; }
  // Clean up event listeners from old video element to prevent memory leaks
  if(_hlsVideo) {
    try {
      var oldVideo = _hlsVideo;
      var newVideo = oldVideo.cloneNode(false);
      if (oldVideo.parentNode) oldVideo.parentNode.replaceChild(newVideo, oldVideo);
      oldVideo.src = '';
      oldVideo.load();
    } catch(e) {}
  }
  if(_hlsInstance){ try{_hlsInstance.destroy();}catch(e){} _hlsInstance=null; }
  _hlsVideo = null;
  _currentM3u8Url = '';
  // Remove injected controls
  var el1 = document.getElementById('dpBufferStatus'); if(el1) el1.remove();
  var el2 = document.getElementById('dpControls'); if(el2) el2.remove();
}

function initDirectPlayer(url) {
  destroyHls();
  _curSrcUrl = url;          // 原始地址，中转失败时回退解析线路要用它
  _relayAttempted = false;
  _currentM3u8Url = url;
  try { console.log('[播放源] ' + url + '\n[提示] 想查这集的广告能不能删，输入 tcInspect()'); } catch (e) {}
  const video = document.getElementById('dpVideo');
  if(!video) return;
  _hlsVideo = video;

  // Inject controls into modalBox (outside player-area overflow:hidden)
  injectDPControls();

  // Check if it's an m3u8 URL
  const isM3u8 = /\.m3u8/i.test(url) || /m3u8/i.test(url);

  // 通用播放尝试函数：处理 autoplay 策略限制
  function tryPlay() {
    var p = video.play();
    if (p && p.then) {
      p.then(function() {
        // 播放成功后立即取消静音
        setTimeout(function() { video.muted = false; }, 300);
      }).catch(function(err) {
        if (err.name === 'NotAllowedError') {
          video.muted = true;
          video.play().then(function() {
            setTimeout(function() { video.muted = false; }, 800);
          }).catch(function(){});
        }
      });
    }
  }

  // 失败降级：直连 → 中转 → 解析线路（解析线路是最后手段，会有广告）
  var _autoFallbackTimeout = null;

  function _fallbackToIframe() {
    if (_autoFallbackTimeout) { clearTimeout(_autoFallbackTimeout); _autoFallbackTimeout = null; }
    console.log('[播放] 中转不可用，降级到解析线路（此线路可能有广告）');
    var savedUrl = _curSrcUrl || _currentM3u8Url;
    destroyHls();
    setChannelBadge('解析线路', true);
    var pa = document.getElementById('playerArea');
    if (pa && savedUrl) {
      pa.innerHTML = _origPlayerIframe(savedUrl);
      // 重建检测层，确保UI自动隐藏系统继续工作
      if (_playerUIActive) {
        _ensureDetectOverlay();
        _showPlayerUI();
      }
    }
  }

  function _escalate(reason) {
    if (_autoFallbackTimeout) { clearTimeout(_autoFallbackTimeout); _autoFallbackTimeout = null; }
    // 第二级：走自己的中转，补 CORS / 改 Referer / 缓存分片
    if (RELAY_BASE && !_relayAttempted) {
      _relayAttempted = true;
      console.log('[播放] ' + reason + ' → 切换到中转');
      setChannelBadge('中转');
      _createHls(relayUrl(_curSrcUrl), true);
      return;
    }
    _fallbackToIframe();
  }

  function _createHls(sourceUrl, isRelay) {
    if (_hlsInstance) { try { _hlsInstance.destroy(); } catch(e){} _hlsInstance = null; }

    // 播放器参数沿用线上调优，只是从内联对象改成变量，好挂去广告加载器
    var _cfg = {
      // === 极致预载策略：尽快缓冲整集视频 ===
      maxBufferLength: 45,             // 45秒起播缓冲（增加以确保流畅）
      maxMaxBufferLength: 1800,        // 最大缓冲到30分钟（整集预载）
      maxBufferSize: 800 * 1024 * 1024, // 800MB内存缓冲上限（增加以支持更高清视频）
      maxBufferHole: 0.5,             // 更小的buffer空洞容忍，减少卡顿
      highBufferWatchdogPeriod: 1.5,   // 更快的缓冲检测
      nudgeOffset: 0.2,
      nudgeMaxRetry: 12,               // 增加重试次数
      enableWorker: true,
      lowLatencyMode: false,           // 关闭低延迟模式，优先预载
      startLevel: -1,                  // 自动选择清晰度，快速连接时直接高清
      abrEwmaDefaultEstimate: 8000000, // 8Mbps带宽估计，鼓励更高质量
      abrBandWidthFactor: 0.6,         // 更激进的ABR策略
      abrBandWidthUpFactor: 0.6,
      fragLoadingTimeOut: 10000,       // 增加超时时间以适应慢速网络
      fragLoadingMaxRetry: 6,          // 增加重试次数
      fragLoadingRetryDelay: 150,      // 更快重试
      manifestLoadingTimeOut: 8000,    // manifest超时
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 150,
      levelLoadingTimeOut: 8000,
      levelLoadingMaxRetry: 4,
      levelLoadingRetryDelay: 150,
      startFragPrefetch: true,         // 预取首个分片
      testBandwidth: true,
      progressive: true,
      backBufferLength: 120,           // 增加后退缓冲
      maxFragLookUpTolerance: 0.2,
      appendErrorMaxRetry: 6,
      stretchShortVideoTrack: true,    // 处理短分片
      // 自定义XHR设置
      xhrSetup: function(xhr, xhrUrl) {
        xhr.timeout = 12000;           // 增加XHR超时
      }
    };

    // 挂上"清单加载时顺手剪广告"的加载器（源站允许 CORS 才有效，不允许就静静跳过）
    try {
      if (Hls.DefaultConfig && Hls.DefaultConfig.loader) {
        _cfg.pLoader = _makeAdLoader(Hls.DefaultConfig.loader);
      }
    } catch (e) {
      console.warn('[去广告] 加载器挂载失败，跳过：' + e.message);
    }

    var hls = new Hls(_cfg);
    _hlsInstance = hls;
    hls.loadSource(sourceUrl);
    hls.attachMedia(video);

    // 设置8秒超时：如果8秒内没有解析到manifest就回退iframe
    _autoFallbackTimeout = setTimeout(function() {
      if (_hlsInstance === hls && video.readyState < 2) {
        _escalate(isRelay ? '中转超时' : '直连超时');
      }
    }, 8000);

    hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
      if (_autoFallbackTimeout) { clearTimeout(_autoFallbackTimeout); _autoFallbackTimeout = null; }
      tryPlay();
      // 起播后立即放开缓冲限制，全力预载
      setTimeout(function() {
        if (hls && hls.config) {
          hls.config.maxBufferLength = 1800;  // 30分钟，等于预载整集
          hls.config.maxMaxBufferLength = 1800;
          hls.config.maxBufferSize = 800 * 1024 * 1024;
        }
      }, 500); // 更快放开限制
    });

    var _hlsNetRetry = 0;
    var _hlsMediaRetry = 0;
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (!data.fatal) return;
      // 记住当前播放位置，防止恢复后从头播放
      var savedPos = video.currentTime || 0;
      var wasPlaying = !video.paused;
      var detail = data.details || '';
      switch(data.type) {
        case Hls.ErrorTypes.NETWORK_ERROR:
          // manifest 拉不到，多半是 CORS 或防盗链 —— 重试没用，直接升级到中转
          if (detail.indexOf('manifest') === 0) {
            _escalate('manifest 失败(' + detail + ')');
            break;
          }
          _hlsNetRetry++;
          if (_hlsNetRetry <= 2) {
            hls.startLoad(savedPos);
          } else {
            _escalate('分片加载失败');
          }
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          _hlsMediaRetry++;
          if (_hlsMediaRetry <= 3) {
            hls.recoverMediaError();
            // recoverMediaError可能重置播放位置，恢复之
            setTimeout(function() {
              if (video && savedPos > 1 && Math.abs(video.currentTime - savedPos) > 3) {
                video.currentTime = savedPos;
              }
              if (wasPlaying && video.paused) video.play();
            }, 300);
          } else {
            _escalate('解码失败');
          }
          break;
        default:
          _escalate('致命错误(' + detail + ')');
          break;
      }
    });
  }

  if(isM3u8 && typeof Hls !== 'undefined' && Hls.isSupported()) {
    if (RELAY_BASE && _forceRelay) {
      // 强制中转：广告剥离只在这一层发生
      _relayAttempted = true;
      setChannelBadge('中转');
      _createHls(relayUrl(url), true);
    } else {
      setChannelBadge('直连');
      _createHls(url, false);
    }
  } else if(isM3u8 && video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari native HLS
    video.src = url;
    tryPlay();
  } else if(!isM3u8) {
    // Direct mp4/other format
    video.src = url;
    tryPlay();
  } else {
    showDPError('浏览器不支持HLS直连，请使用iframe模式');
    return;
  }

  // Setup controls interaction
  setupDPControls(video);
  startDPUpdate(video);

  // 直连模式：直接在video元素上监听鼠标/触摸，确保UI能正常显示
  video.addEventListener('mousemove', function() {
    if (_playerUIActive) _showPlayerUI();
  });
  video.addEventListener('touchstart', function() {
    if (_playerUIActive) _showPlayerUI();
  }, {passive:true});
  video.addEventListener('click', function() {
    if (_playerUIActive) _showPlayerUI();
  });

  // 加速起播
  video.addEventListener('canplay', function _onCanPlay() {
    tryPlay();
    video.removeEventListener('canplay', _onCanPlay);
  }, { once: true });

  // 防止画面冻结 — 只在确认当前位置有效时恢复
  video.addEventListener('stalled', function() {
    var pos = video.currentTime;
    if (_hlsInstance && pos > 0) _hlsInstance.startLoad(pos);
    setTimeout(function() {
      // 确保没有跳回开头
      if (video.paused && video.readyState >= 2 && Math.abs(video.currentTime - pos) < 2) {
        video.play();
      }
    }, 800);
  });

  // 卡住超过2秒恢复加载 — 保持在当前位置
  var _waitingTimer = null;
  video.addEventListener('waiting', function() {
    if (_waitingTimer) clearTimeout(_waitingTimer);
    var pos = video.currentTime;
    _waitingTimer = setTimeout(function() {
      if (_hlsInstance && pos > 0) _hlsInstance.startLoad(pos);
    }, 2000);
  });
  video.addEventListener('playing', function() {
    if (_waitingTimer) { clearTimeout(_waitingTimer); _waitingTimer = null; }
  });

  // Restore saved playback time
  if (window._pendingSavedTime && window._pendingSavedTime > 5) {
    seekToSavedTime(video, window._pendingSavedTime);
    window._pendingSavedTime = 0;
  }

  // Seek时立即从新位置加载
  video.addEventListener('seeking', function(){
    if(_hlsInstance) _hlsInstance.startLoad(video.currentTime);
  });
}

function setupDPControls(video) {
  const controls = document.getElementById('dpControls');
  if(!controls) return;

  // Click video to toggle play
  video.addEventListener('click', function(){ video.paused ? video.play() : video.pause(); });

  // Progress bar seek — 使用正确的 HLS seek 方式
  var progressWrap = document.getElementById('dpProgressWrap');
  if(progressWrap) {
    var _isSeeking = false;
    function seekTo(e) {
      var rect = progressWrap.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if(video.duration && isFinite(video.duration)) {
        _isSeeking = true;
        var seekTime = pct * video.duration;
        // 先暂停播放避免声画不同步
        var wasPlaying = !video.paused;
        video.pause();
        // 设置目标时间
        video.currentTime = seekTime;
        // 通知HLS.js从新位置加载分片
        if(_hlsInstance) {
          _hlsInstance.startLoad(seekTime);
        }
        // 等待 seeked 事件后再恢复播放
        function onSeeked() {
          _isSeeking = false;
          video.removeEventListener('seeked', onSeeked);
          if (wasPlaying) video.play();
        }
        video.addEventListener('seeked', onSeeked);
        // 超时保护：3秒内没有 seeked 事件也恢复播放
        setTimeout(function() {
          if (_isSeeking) {
            _isSeeking = false;
            video.removeEventListener('seeked', onSeeked);
            if (wasPlaying) video.play();
          }
        }, 3000);
        // 立即更新进度条UI
        var playBar = document.getElementById('dpPlayBar');
        if(playBar) playBar.style.width = (pct*100)+'%';
        var timeEl = document.getElementById('dpTime');
        if(timeEl) timeEl.textContent = fmtTime(seekTime) + ' / ' + fmtTime(video.duration);
      }
    }
    var dragging = false;
    progressWrap.addEventListener('mousedown', function(e){ dragging=true; seekTo(e); });
    document.addEventListener('mousemove', function(e){ if(dragging) seekTo(e); });
    document.addEventListener('mouseup', function(){ dragging=false; });
    progressWrap.addEventListener('touchstart', function(e){ dragging=true; seekTo(e.touches[0]); }, {passive:true});
    progressWrap.addEventListener('touchmove', function(e){ if(dragging) seekTo(e.touches[0]); }, {passive:true});
    progressWrap.addEventListener('touchend', function(){ dragging=false; }, {passive:true});
  }

  // Video ended -> trigger auto next
  video.addEventListener('ended', function(){ triggerAutoNext(); });

  // Double-click fullscreen
  video.addEventListener('dblclick', function(){ toggleDPFullscreen(); });
}

function startDPUpdate(video) {
  if(_dpUpdateTimer) clearInterval(_dpUpdateTimer);
  // 缓冲状态初始显示后自动隐藏的计时器
  var _bufStatusShownAt = Date.now();
  var _bufStatusAutoHidden = false;
  _dpUpdateTimer = setInterval(function(){
    if(!video || !video.parentNode) { clearInterval(_dpUpdateTimer); return; }
    var dur = video.duration || 0;
    var cur = video.currentTime || 0;

    // Update play bar
    var playBar = document.getElementById('dpPlayBar');
    if(playBar && dur > 0) playBar.style.width = (cur/dur*100)+'%';

    // Update buffer bar — show maximum buffered point
    var bufBar = document.getElementById('dpBufferBar');
    if(bufBar && dur > 0 && video.buffered.length > 0) {
      var bufEnd = 0;
      for(var i=0; i<video.buffered.length; i++){
        if(video.buffered.end(i) > bufEnd) bufEnd = video.buffered.end(i);
      }
      bufBar.style.width = (bufEnd/dur*100)+'%';

      // Update buffer status text (但跟随UI自动隐藏系统)
      var dot = document.getElementById('dpBufferDot');
      var txt = document.getElementById('dpBufferText');
      var statusEl = document.getElementById('dpBufferStatus');
      var bufPct = Math.floor(bufEnd/dur*100);
      var aheadSec = Math.max(0, Math.floor(bufEnd - cur));
      if(bufPct >= 99) {
        if(dot) dot.className = 'dp-buffer-dot ready';
        if(txt) txt.textContent = '已全部缓冲 100%';
      } else {
        if(dot) dot.className = 'dp-buffer-dot buffering';
        if(txt) txt.textContent = '缓冲 '+bufPct+'% · 预载'+aheadSec+'s';
      }
      // 缓冲状态跟随UI自动隐藏 — 不再单独控制opacity
      // 由 _uiAllEls 中的 .dp-buffer-status 和 autohide class 统一管理
    }

    // Update time
    var timeEl = document.getElementById('dpTime');
    if(timeEl) timeEl.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);

    // Update play button
    var playBtn = document.getElementById('dpPlayBtn');
    if(playBtn) playBtn.innerHTML = video.paused
      ? '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    // Near-end detection for auto-next
    if(dur > 120 && cur > 60 && (dur - cur) < 2 && !video.paused) triggerAutoNext();
  }, 500);
}

function fmtTime(s) {
  if(!s || isNaN(s)) return '00:00';
  s = Math.floor(s);
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  var ss = s%60;
  if(h > 0) return h+':'+(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
  return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

function toggleSpeedMenu() {

function toggleDPFullscreen() {
  var el = document.getElementById('modalBox');
  if(!el) el = document.getElementById('playerArea');
  if(!el) return;
  
  // 检测是否已全屏
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreenElement;
  
  if(fsEl || _iosFullscreen) {
    // 退出全屏
    if(fsEl) {
      forceExitAllFullscreen();
    }
    if(_iosFullscreen) {
      exitIosFullscreen();
    }
  } else {
    // 尝试标准全屏API
    var fsApi = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || el.mozRequestFullScreen;
    if(fsApi) {
      try {
        var result = fsApi.call(el);
        if(result && result.then) {
          result.then(function(){
            startIframeFsWatch();
          }).catch(function(){
            enterIosFullscreen();
          });
        } else {
          startIframeFsWatch();
        }
      } catch(e) {
        enterIosFullscreen();
      }
    } else {
      enterIosFullscreen();
    }
  }
}

// iOS/降级全屏方案 - 使用内联样式确保可靠
var _iosFullscreen = false;
function enterIosFullscreen() {
  var mask = document.getElementById('modalMask');
  var box = document.getElementById('modalBox');
  var pa = document.getElementById('playerArea');
  
  // 保存原始样式
  if(mask) mask.setAttribute('data-orig-style', mask.getAttribute('style') || '');
  if(box) box.setAttribute('data-orig-style', box.getAttribute('style') || '');
  
  // 设置内联样式（最高优先级）
  if(mask) {
    mask.style.cssText = 'position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:2147483647!important;background:#000!important;overflow:hidden!important;display:block!important';
  }
  if(box) {
    box.style.cssText = 'position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:2147483647!important;background:#000!important;overflow:hidden!important';
  }
  if(pa) {
    pa.style.cssText = 'position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:2147483647!important;background:#000!important;overflow:hidden!important';
  }
  
  // 锁定body滚动
  document.body.style.overflow = 'hidden';

  document.body.style.top = '0';
  
  _iosFullscreen = true;

function exitIosFullscreen() {
  var mask = document.getElementById('modalMask');
  var box = document.getElementById('modalBox');
  var pa = document.getElementById('playerArea');
  
  // 恢复原始样式
  if(mask) {
    var orig = mask.getAttribute('data-orig-style');
    mask.setAttribute('style', orig || '');
    mask.removeAttribute('data-orig-style');
  }
  if(box) {
    var orig = box.getAttribute('data-orig-style');
    box.setAttribute('style', orig || '');
    box.removeAttribute('data-orig-style');
  }
  if(pa) {
    pa.style.cssText = '';
  }
  
  // 恢复body滚动
  document.body.style.overflow = '';
  document.body.style.position = '';
  document.body.style.width = '';
  document.body.style.top = '';
  
  _iosFullscreen = false;
  updateFsBtn();
}

// === 全屏退出修复：彻底解决退出视频全屏后网页仍然全屏的问题 ===
var _fsStack = []; // 记录全屏层级
function forceExitAllFullscreen() {
  try { if (document.exitFullscreen) document.exitFullscreen().catch(function(){}); } catch(e) {}
  try { if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch(e) {}
  try { if (document.msExitFullscreen) document.msExitFullscreen(); } catch(e) {}
  try { if (document.mozCancelFullScreen) document.mozCancelFullScreen(); } catch(e) {}
}
function onFullscreenChanged() {
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreenElement;
  updateFsBtn();
  if (fsEl) {
    _fsStack.push(fsEl);
  } else {
    // 全屏已退出，但可能还有残留的全屏层级
    _fsStack = [];
    // 延迟再检查一次，确保彻底退出
    setTimeout(function() {
      var stillFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreenElement;
      if (stillFs) {
        forceExitAllFullscreen();
      }
    }, 100);
    // 再次延迟检查（有些浏览器/iframe退出较慢）
    setTimeout(function() {
      var stillFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreenElement;
      if (stillFs) {
        forceExitAllFullscreen();
      }
    }, 500);
  }
}
document.addEventListener('fullscreenchange', onFullscreenChanged);
document.addEventListener('webkitfullscreenchange', onFullscreenChanged);
document.addEventListener('mozfullscreenchange', onFullscreenChanged);
document.addEventListener('MSFullscreenChange', onFullscreenChanged);

// 监听iframe内部的全屏变化消息
window.addEventListener('message', function(e) {
  try {
    var data = e.data;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch(ex) { return; }
    }
    if (!data || typeof data !== 'object') return;

// 监听iframe内video元素的全屏退出（通过轮询检测）
var _iframeFsCheckTimer = null;
function startIframeFsWatch() {

  _iframeFsCheckTimer = setInterval(function() {
    var mask = document.getElementById('modalMask');
    if (!mask || !mask.classList.contains('show')) { clearInterval(_iframeFsCheckTimer); _iframeFsCheckTimer = null; return; }
    // 检查iframe内部是否有全屏元素
    try {
      var iframe = document.querySelector('.player-area iframe');
      if (iframe && iframe.contentDocument) {
        var iframeFs = iframe.contentDocument.fullscreenElement || iframe.contentDocument.webkitFullscreenElement;
        // 如果iframe内没有全屏元素，但父页面还在全屏，退出父页面全屏
        if (!iframeFs) {
          var parentFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (parentFs && parentFs !== document.getElementById('modalBox') && parentFs !== document.getElementById('playerArea')) {
            forceExitAllFullscreen();

}

// === 统一的播放器UI自动隐藏系统（document级别，iframe和直连模式通用） ===
var _uiHideTimer = null;
var _uiAllEls = '.p-bottom-btns,.dp-mode-btn,.p-research-btn,.p-top,.p-open-btn,.dp-buffer-status';
var _playerUIActive = false;

function _getDetectOverlay() {
  return document.getElementById('uiDetectOverlay');
}

function _showPlayerUI() {
  // 显示所有浮动按钮
  document.querySelectorAll(_uiAllEls).forEach(function(b){ b.classList.remove('autohide'); });
  // 如果是直连模式，也显示进度条
  var dpCtrl = document.getElementById('dpControls');
  if (dpCtrl) dpCtrl.classList.add('show');
  // 检测层变为透传，让用户可以操作视频/iframe
  var ov = _getDetectOverlay();
  if (ov) ov.style.pointerEvents = 'none';
  // 重置隐藏定时器
  clearTimeout(_uiHideTimer);
  _uiHideTimer = setTimeout(_hidePlayerUI, 3500);
}

function _hidePlayerUI() {
  // 直连模式下，视频暂停时不隐藏
  if (_directMode && _hlsVideo && _hlsVideo.paused) return;
  document.querySelectorAll(_uiAllEls).forEach(function(b){ b.classList.add('autohide'); });
  var dpCtrl = document.getElementById('dpControls');
  if (dpCtrl) dpCtrl.classList.remove('show');
  var sm = document.getElementById('dpSpeedMenu'); if(sm) sm.classList.remove('show');
  // 检测层重新激活，捕获下次鼠标移动
  var ov = _getDetectOverlay();
  if (ov) ov.style.pointerEvents = 'auto';
}

function _ensureDetectOverlay() {
  if (_getDetectOverlay()) return;
  var pa = document.getElementById('playerArea');
  if (!pa) return;
  var ov = document.createElement('div');
  ov.id = 'uiDetectOverlay';
  ov.style.cssText = 'position:absolute;inset:0;z-index:2147483646;pointer-events:auto;background:transparent;cursor:default;';
  // 鼠标移动 → 显示控件
  ov.addEventListener('mousemove', function(){ if(_playerUIActive) _showPlayerUI(); });
  ov.addEventListener('touchstart', function(e){
    if (!_playerUIActive) return;
    _showPlayerUI();
  }, {passive:true});
  // 点击穿透：第一次点击显示控件后，pointer-events已变none，后续点击直接到视频/iframe
  pa.appendChild(ov);
}

function startPlayerUIAutoHide() {
  _playerUIActive = true;
  _ensureDetectOverlay();
  _showPlayerUI();
}

function stopPlayerUIAutoHide() {
  _playerUIActive = false;
  clearTimeout(_uiHideTimer);
  document.querySelectorAll(_uiAllEls).forEach(function(b){ b.classList.remove('autohide'); });
  var dpCtrl = document.getElementById('dpControls');
  if (dpCtrl) dpCtrl.classList.add('show');
  var ov = _getDetectOverlay();
  if (ov) ov.remove();
}

// document级别也监听——捕获检测层之外区域的交互（鼠标移动/触摸）

document.addEventListener('touchstart', function(e) {

  if (e.target.closest('.modal-mask,.modal-box,.player-area,.direct-video,.dp-controls,.dp-btn,.dp-progress-wrap,.dp-speed,.dp-vol-wrap,.dp-speed-wrap,.dp-speed-menu,.p-next-btn,.dp-mode-btn,.p-research-btn,.p-top,.p-back,.p-open-btn,.p-fs-btn,.dp-buffer-status,.p-side,.p-pill,.p-ep,#dpVideo,#uiDetectOverlay,#adBlockOverlay')) {

document.addEventListener('keydown', e => {

    var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if(fsEl){ (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document); return; }
    closePlayer();cancelAutoNextCountdown();document.getElementById('historyMask').classList.remove('show');document.getElementById('settingsMask').classList.remove('show');document.getElementById('settingsPwdMask').classList.remove('show');
  }
  // Direct player keyboard shortcuts
  if(_directMode && _hlsVideo){
    if(e.key===' '||e.key==='k'){e.preventDefault();_hlsVideo.paused?_hlsVideo.play():_hlsVideo.pause();}
    if(e.key==='ArrowLeft'){e.preventDefault();_hlsVideo.currentTime=Math.max(0,_hlsVideo.currentTime-10);}
    if(e.key==='ArrowRight'){e.preventDefault();_hlsVideo.currentTime=Math.min(_hlsVideo.duration||0,_hlsVideo.currentTime+10);}
    if(e.key==='ArrowUp'){e.preventDefault();_hlsVideo.volume=Math.min(1,_hlsVideo.volume+0.1);}
    if(e.key==='ArrowDown'){e.preventDefault();_hlsVideo.volume=Math.max(0,_hlsVideo.volume-0.1);}
    if(e.key==='f'){e.preventDefault();toggleDPFullscreen();}
    if(e.key==='m'){e.preventDefault();_hlsVideo.muted=!_hlsVideo.muted;}
  }
});

// === 调试入口：?test=<encodeURIComponent(直链)> 直接播放任意 m3u8 / mp4 ===
// 用途：不搜索、不依赖采集接口，直接验证某条源能不能播、走的是直连还是中转。
// 例：index.html?test=https%3A%2F%2Fxxx.com%2Fplay.m3u8
(function(){
  function bootTest(){
    var t;
    try { t = new URLSearchParams(location.search).get('test'); } catch(e){ return; }
    if (!t) return;
    var u = t;
    try { u = decodeURIComponent(t); } catch(e){}
    setTimeout(function(){
      if (typeof openPlayer !== 'function') return;
      openPlayer({
        name: '\u8c03\u8bd5\u76f4\u94fe',
        playFrom: 'm3u8$$$',
        playUrl: '\u7b2c01\u96c6$' + u + '$$$'
      });
    }, 500);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootTest);
  } else {
    bootTest();
  }
})();
