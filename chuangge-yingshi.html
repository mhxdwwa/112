<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#ff6b6b;--accent-g:linear-gradient(135deg,#ff6b6b,#ff8e8e);--bg:#f4f6f8;--card:#ffffff;--surface:#ffffff;--text:#2d3748;--sub:#718096;--border:rgba(0,0,0,.06);--radius:14px;--glow:0 4px 12px rgba(255,107,107,.15)}
body{font-family:-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;font-size:15px;position:relative}
/* 浅色清新背景图案层 */
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
background:
  radial-gradient(1.5px 1.5px at 10% 15%, rgba(255,107,107,.08) 50%, transparent 50%),
  radial-gradient(2px 2px at 45% 8%, rgba(255,142,142,.06) 50%, transparent 50%),
  radial-gradient(1.5px 1.5px at 65% 25%, rgba(255,107,107,.07) 50%, transparent 50%),
  radial-gradient(1.5px 1.5px at 55% 85%, rgba(255,142,142,.06) 50%, transparent 50%)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
background:
  radial-gradient(ellipse 300px 300px at 5% 15%, rgba(255,107,107,.03) 0%, transparent 70%),
  radial-gradient(ellipse 250px 250px at 92% 20%, rgba(255,142,142,.03) 0%, transparent 70%)}
/* prefers-reduced-motion: disable decorative animations */
@media (prefers-reduced-motion: reduce) {
  body::before, body::after { display: none; }
  #bgDecorations { display: none !important; }
  .hero::after { animation: none; }
  .footer::before { display: none; }
  @keyframes floatDeco { 0%,100% { transform: none; } }
  @keyframes scrollDeco { 0%,100% { transform: none; } }
  .card:hover { transform: none; }
  .section { animation: none; }
}
/* 浮动装饰动画 */
@keyframes floatDeco{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-8px) rotate(2deg)}50%{transform:translateY(-4px) rotate(-1deg)}75%{transform:translateY(-10px) rotate(1.5deg)}}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;border:none;outline:none}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
img{max-width:100%}

/* HEADER */
.header{background:rgba(255,255,255,.9);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(16px) saturate(1.5)}
.hd-inner{display:flex;align-items:center;height:56px;gap:16px}
.logo{font-size:26px;font-weight:800;background:var(--accent-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;letter-spacing:1px;white-space:nowrap}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav-link{padding:6px 14px;border-radius:8px;font-size:15px;color:var(--sub);cursor:pointer;transition:.25s;white-space:nowrap}
.nav-link:hover{background:rgba(255,107,107,.08);color:var(--accent)}
.nav-link.active{background:var(--accent-g);color:#fff}
.hd-right{display:flex;align-items:center;gap:12px}
.hd-link{font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;transition:.2s;padding:6px 12px;border-radius:8px;border:1px solid var(--border)}
.hd-link:hover{color:var(--accent);border-color:rgba(255,140,107,.3)}

/* HERO */
.hero{text-align:center;padding:32px 20px 16px;background:linear-gradient(180deg,rgba(255,107,107,.06) 0%,rgba(255,142,142,.03) 40%,var(--bg) 100%);position:relative;overflow:visible}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,107,107,.08) 0%,transparent 60%);pointer-events:none}
.hero::after{content:'🎬 🍿 🎞️ ⭐ 🎬 🍿 🎞️ ⭐ 🎬 🍿';position:absolute;bottom:8px;left:0;right:0;font-size:14px;letter-spacing:18px;opacity:.08;pointer-events:none;white-space:nowrap;overflow:hidden;animation:scrollDeco 30s linear infinite}
@keyframes scrollDeco{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.hero-title{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--text),var(--sub));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:2px}
.hero-subtitle{font-size:16px;color:var(--sub);margin-bottom:20px}
.hero-search{display:flex;height:52px;background:#ffffff;border-radius:26px;border:1px solid var(--border);overflow:hidden;transition:.3s;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.hero-search:focus-within{border-color:var(--accent);box-shadow:var(--glow)}
.hero-search input{flex:1;padding:0 22px;font-size:16px;background:none;color:var(--text)}
.hero-search input::placeholder{color:#a0aec0}
.hero-search button{padding:0 30px;background:var(--accent-g);color:#fff;font-size:15px;font-weight:600;transition:.2s}
.hero-search button:hover{filter:brightness(1.05)}

/* INLINE SEARCH */
.inline-search{display:flex;height:46px;background:#ffffff;border-radius:23px;border:1px solid var(--border);overflow:hidden;transition:.3s;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:20px}
.inline-search:focus-within{border-color:var(--accent);box-shadow:var(--glow)}
.inline-search input{flex:1;padding:0 18px;font-size:15px;background:none;color:var(--text)}
.inline-search input::placeholder{color:#a0aec0}
.inline-search button{padding:0 22px;background:var(--accent-g);color:#fff;font-size:14px;font-weight:600}

/* MAIN */
.main{padding:16px 20px 40px}

/* SECTION */
.section{margin-bottom:40px;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid transparent;border-image:var(--accent-g) 1;position:relative}
.section-title{font-size:20px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.section-more{font-size:13px;color:var(--accent);cursor:pointer;padding:5px 14px;border-radius:8px;border:1px solid rgba(255,107,107,.2);transition:all .25s;font-weight:500}
.section-more:hover{background:rgba(255,107,107,.1);border-color:var(--accent);transform:translateX(2px)}

/* CARD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.25,.46,.45,.94);border:1px solid var(--border);position:relative;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 12px 32px rgba(0,0,0,.1),0 0 0 1px rgba(255,107,107,.2);border-color:rgba(255,107,107,.3)}
.card-poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:linear-gradient(135deg,#e2e8f0,#cbd5e0)}
.card-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.25,.46,.45,.94),filter .3s}
.card:hover .card-poster img{transform:scale(1.08);filter:brightness(1.05)}
.card-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#4a5568;font-size:15px;font-weight:700;padding:12px;text-align:center;line-height:1.4;letter-spacing:1px}
.card:nth-child(6n+1) .card-ph{background:linear-gradient(135deg,#fed7d7,#feb2b2)}
.card:nth-child(6n+2) .card-ph{background:linear-gradient(135deg,#feebc8,#fbd38d)}
.card:nth-child(6n+3) .card-ph{background:linear-gradient(135deg,#c6f6d5,#9ae6b4)}
.card:nth-child(6n+4) .card-ph{background:linear-gradient(135deg,#bee3f8,#90cdf4)}
.card:nth-child(6n+5) .card-ph{background:linear-gradient(135deg,#e9d8fd,#d6bcfa)}
.card:nth-child(6n+6) .card-ph{background:linear-gradient(135deg,#fed7e2,#fbb6ce)}
.card-badge{position:absolute;top:8px;left:8px;background:var(--accent-g);color:#fff;font-size:11px;padding:3px 10px;border-radius:8px;font-weight:600;box-shadow:0 2px 8px rgba(255,140,107,.3);backdrop-filter:blur(4px);letter-spacing:.5px}
.card-ep{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));color:#fff;font-size:12px;padding:24px 10px 6px;text-align:right;font-weight:500}
.card-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:all .35s;backdrop-filter:blur(2px)}
.card:hover .card-play{opacity:1}
.card-play svg{width:44px;height:44px;fill:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5));transition:transform .3s}
.card:hover .card-play svg{transform:scale(1.1)}
/* Touch feedback for mobile */
.card:active{transform:translateY(-4px) scale(1.01);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.sr-item:active{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.05)}
.hot-tag:active{background:rgba(255,140,107,.2);color:var(--accent)}
.pager-btn:active{background:rgba(255,107,107,.15);transform:scale(.95)}
.nav-link:active{background:rgba(255,107,107,.12)}
.p-pill:active,.p-ep:active{transform:scale(.93);opacity:.8}
.filter-btn:active{transform:scale(.93);background:rgba(255,140,107,.2)}
.hd-link:active{background:rgba(255,140,107,.1)}
.card-info{padding:10px 12px 12px}
.card-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card-sub{font-size:12px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-score{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#ffd700;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid rgba(255,215,0,.2)}

/* SEARCH RESULTS */
.sr-tip{padding:14px 0;font-size:14px;color:var(--sub);margin-bottom:12px}
.sr-back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:15px;cursor:pointer;font-weight:600;margin-bottom:18px;padding:8px 16px;border-radius:10px;background:rgba(255,140,107,.08);border:1px solid rgba(255,140,107,.15);transition:all .25s}
.sr-back:hover{background:rgba(255,140,107,.15);border-color:var(--accent);transform:translateX(-4px)}
.sr-item{display:flex;gap:16px;padding:18px;background:var(--card);border-radius:var(--radius);margin-bottom:12px;cursor:pointer;transition:all .3s;border:1px solid var(--border);position:relative;overflow:hidden}
.sr-item::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent-g);opacity:0;transition:.3s}
.sr-item:hover{border-color:rgba(255,107,107,.3);box-shadow:0 4px 20px rgba(255,107,107,.08);transform:translateX(4px)}
.sr-item:hover::before{opacity:1}
.sr-poster{width:100px;min-width:100px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#e2e8f0,#cbd5e0)}
.sr-poster img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.sr-item:hover .sr-poster img{transform:scale(1.05)}
.sr-body{flex:1;min-width:0}
.sr-name{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:6px}
.sr-tag{background:rgba(255,140,107,.1);color:var(--accent);padding:3px 10px;border-radius:8px;font-weight:500;border:1px solid rgba(255,140,107,.15)}
.sr-source{color:var(--accent);font-weight:600}
.sr-desc{font-size:13px;color:var(--sub);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-actors{font-size:13px;color:var(--sub);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* LOADING & EMPTY */
.loading{text-align:center;padding:60px 0;color:var(--sub)}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 0;color:var(--sub);font-size:15px}
.sr-progress{text-align:center;padding:12px;color:var(--sub);font-size:14px}

/* PLAYER */
.modal-mask{position:fixed;inset:0;z-index:10000;background:#000;display:none;overflow:hidden}
.modal-mask.show{display:block}
.modal-box{width:100%;height:100%;position:relative}
.player-area{position:absolute;inset:0;background:#000;overflow:hidden}
.player-area iframe{width:100%;height:100%;border:none}
/* Mobile ad blocking: hide common ad containers injected outside our UI */
.player-area > div:not(#adBlockOverlay):not(#uiDetectOverlay):not(.player-loading):not(.p-top):not(.p-side):not(.p-bottom):not(.p-bottom-btns):not(.p-next-btn):not(.p-open-btn):not(.p-fs-btn):not(.dp-controls):not(.dp-buffer-status):not(.dp-error){pointer-events:none!important}
.player-area > a{display:none!important}
@media(max-width:768px){.player-area > div:not(#adBlockOverlay):not(#uiDetectOverlay):not(.player-loading):not(.dp-controls):not(.dp-buffer-status):not(.dp-error){z-index:auto!important}}
.player-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-direction:column;gap:8px}

/* Top bar */
.p-top{position:fixed;top:0;left:0;right:0;z-index:220;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);pointer-events:none;transition:opacity .3s}
.p-top>*{pointer-events:auto}
.p-back{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;border:none;backdrop-filter:blur(6px);flex-shrink:0}
.p-back:hover{background:var(--accent)}
.p-title{font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Side panel */
.p-side{position:fixed;top:0;right:0;bottom:0;z-index:220;width:280px;max-width:75vw;background:rgba(26,18,16,.95);backdrop-filter:blur(12px);border-left:1px solid rgba(255,200,160,.1);transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
.p-side.open{transform:translateX(0)}
.p-side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.p-side-head span{font-size:14px;font-weight:700;color:#fff}
.p-side-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;border:none}
.p-side-close:hover{background:var(--accent)}
.p-controls{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.p-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.p-row-label{font-size:12px;color:rgba(255,255,255,.5);margin-right:4px;white-space:nowrap;width:100%;margin-bottom:4px}
.p-pill{padding:5px 12px;border-radius:6px;font-size:12px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);cursor:pointer;transition:.2s;white-space:nowrap;border:1px solid transparent}
.p-pill:hover{background:rgba(255,255,255,.2);color:#fff}
.p-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.p-ep-grid{display:flex;flex-wrap:wrap;gap:6px}
.p-ep{min-width:44px;height:32px;border-radius:6px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;padding:0 8px;border:1px solid transparent}
.p-ep:hover{background:rgba(255,255,255,.2);color:#fff}
.p-ep.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Floating open-btn (top-right) */
.p-open-btn{position:fixed;top:10px;right:16px;z-index:221;width:auto;height:38px;padding:0 14px;border-radius:19px;background:rgba(255,255,255,.15);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s;border:none;pointer-events:auto}
.p-open-btn:active{transform:scale(0.95)}
.p-open-btn:hover{background:var(--accent)}
.p-open-btn svg{width:16px;height:16px;fill:currentColor}

/* Next-episode button & fullscreen wrapper */
.p-bottom-btns{position:fixed;bottom:60px;left:16px;z-index:221;display:flex;align-items:center;gap:10px;flex-direction:row}
.p-next-btn{height:36px;padding:0 16px;border-radius:18px;background:rgba(255,107,107,.3);backdrop-filter:blur(6px);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s;border:1px solid rgba(255,107,107,.4)}
.p-next-btn:hover{background:var(--accent)}
.p-next-btn svg{width:14px;height:14px;fill:currentColor}

/* 清晰度选择按钮与菜单 */
.dp-quality-wrap{position:relative;display:flex;align-items:center}
.p-quality-btn{height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.15);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,.2)}
.p-quality-btn:hover{background:var(--accent);border-color:var(--accent)}
.dp-quality-menu{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:10px;background:rgba(20,14,12,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,200,160,.15);border-radius:10px;padding:6px 0;display:none;min-width:100px;z-index:230;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.dp-quality-menu.show{display:block}
.dp-quality-opt{padding:8px 16px;font-size:13px;color:rgba(255,255,255,.8);cursor:pointer;text-align:center;white-space:nowrap;transition:.15s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dp-quality-opt:hover{background:rgba(255,107,107,.15);color:#fff}
.dp-quality-opt.active{color:var(--accent);font-weight:700}
.dp-quality-opt .q-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,107,107,.2);color:var(--accent)}

/* HISTORY MODAL */
.history-panel{background:rgba(38,30,26,.92);backdrop-filter:blur(20px) saturate(1.5);border-radius:16px;width:100%;max-width:420px;margin:40px auto;border:1px solid rgba(255,200,160,.1);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.hist-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.hist-head h3{font-size:17px;font-weight:700;color:#fff}
.hist-head button{color:var(--sub);font-size:18px}
.hist-list{flex:1;overflow-y:auto;padding:12px 20px}
.hist-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.hist-item:hover{padding-left:8px}
.hist-item:hover .hist-name{color:var(--accent)}
.hist-name{font-size:15px;color:#fff}
.hist-time{font-size:11px;color:var(--sub)}
.hist-empty{text-align:center;padding:40px 0;color:var(--sub);font-size:13px}
.hist-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);text-align:center}
.hist-foot button{font-size:14px;color:var(--sub);padding:6px 16px;border-radius:6px;transition:.2s}
.hist-foot button:hover{color:var(--accent);background:rgba(255,140,107,.1)}

/* FOOTER */
.footer{text-align:center;padding:32px 20px;color:var(--sub);font-size:13px;border-top:1px solid var(--border);margin-top:24px;background:#ffffff;position:relative;overflow:hidden}
.footer::before{content:'🎬 🍿 ⭐ 🎞️ 🌙 💫 🎬 🍿 ⭐ 🎞️ 🌙 💫';position:absolute;top:8px;left:0;right:0;font-size:12px;letter-spacing:14px;opacity:.06;pointer-events:none;white-space:nowrap;overflow:hidden}
.footer-brand{margin-top:6px;font-weight:600;background:var(--accent-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.6}

/* PAGINATION */
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:24px;flex-wrap:wrap;padding:8px 0}
.pager-btn{min-width:38px;height:36px;padding:0 12px;border-radius:10px;font-size:14px;background:var(--card);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;border:1px solid var(--border);font-weight:500}
.pager-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,107,107,.08);transform:translateY(-2px)}
.pager-btn.active{background:var(--accent-g);color:#fff;border-color:var(--accent);box-shadow:0 2px 12px rgba(255,107,107,.2)}
.pager-btn.disabled{opacity:.3;pointer-events:none}
.pager-info{font-size:12px;color:var(--sub);margin:0 8px}

/* FILTER BAR */
.filter-bar{background:rgba(255,255,255,.95);border-bottom:1px solid var(--border);padding:0;display:none;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.filter-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,107,107,.2),transparent)}
.filter-bar.show{display:block;animation:filterSlideIn .35s ease}
@keyframes filterSlideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.filter-inner{max-width:1200px;margin:0 auto;padding:16px 16px 14px;text-align:left}
.filter-row{display:flex;align-items:flex-start;gap:0;margin-bottom:10px;flex-wrap:wrap;position:relative;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.04)}
.filter-row:last-child{margin-bottom:0;border-bottom:none}
.filter-label{font-size:13px;color:var(--accent);min-width:52px;white-space:nowrap;font-weight:700;padding:5px 12px 5px 0;border-right:2px solid rgba(255,107,107,.3);margin-right:10px;line-height:1.4}
.filter-btn{font-size:14px;color:var(--sub);padding:10px 16px;border-radius:20px;cursor:pointer;transition:all .25s;white-space:nowrap;background:transparent;border:1px solid transparent;margin:3px 4px;position:relative;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.filter-btn:hover{color:var(--accent);background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.2);transform:translateY(-1px)}
.filter-btn.active{background:var(--accent-g);color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(255,107,107,.25);transform:translateY(-1px);font-weight:600}
.filter-summary{display:flex;align-items:center;gap:8px;padding:8px 0 2px;flex-wrap:wrap}
.filter-tag-active{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:14px;font-size:12px;background:rgba(255,107,107,.1);color:var(--accent);border:1px solid rgba(255,107,107,.2);cursor:pointer;transition:.2s}
.filter-tag-active:hover{background:rgba(255,107,107,.15)}
.filter-tag-active .tag-x{font-size:14px;margin-left:2px;opacity:.6}
.filter-count{font-size:12px;color:var(--sub);margin-left:auto}
.filter-expand-btn{font-size:12px;color:var(--accent);cursor:pointer;padding:3px 10px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.15);transition:.2s;margin-left:4px;white-space:nowrap}
.filter-expand-btn:hover{background:rgba(255,107,107,.15)}
.filter-row.collapsed .filter-btn:nth-child(n+14){display:none}
.filter-sort-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.filter-sort-btn{font-size:12px;color:var(--sub);padding:4px 12px;border-radius:6px;cursor:pointer;transition:.2s;background:rgba(0,0,0,.04);border:1px solid transparent}
.filter-sort-btn:hover{color:var(--accent);border-color:rgba(255,107,107,.2)}
.filter-sort-btn.active{color:var(--accent);font-weight:600;border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.08)}

/* SEARCH SUGGESTIONS */
.suggest-wrap{position:relative;z-index:9999;max-width:580px;margin:0 auto;width:100%}
.suggest-list{position:absolute;top:100%;left:0;right:0;z-index:9999;background:rgba(20, 15, 12, 0.98);backdrop-filter:blur(16px);border:1px solid rgba(255,200,160,.15);border-top:none;border-radius:0 0 12px 12px;max-height:320px;overflow-y:auto;display:none;box-shadow:0 12px 32px rgba(0,0,0,.6)}
.suggest-list.show{display:block}
.suggest-item{padding:12px 20px;font-size:15px;color:#f0f0f0;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;gap:10px}
.suggest-item:hover{background:rgba(255,140,107,.15);color:#ffffff}
.suggest-item .sg-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.suggest-item .sg-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.suggest-item .sg-tag{font-size:11px;color:#ffaa80;padding:2px 8px;border-radius:4px;background:rgba(255,140,107,.12);border:1px solid rgba(255,140,107,.2);font-weight:600}
/* 历史记录单条删除按钮 */
.suggest-item .sg-del{font-size:18px;color:#ff6b7a;cursor:pointer;padding:4px 8px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;min-width:28px;min-height:28px}
.suggest-item .sg-del:active{background:rgba(255,107,122,.2);border-radius:50%}

/* SETTINGS */
.src-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.src-item .src-name{font-size:14px;color:#fff;min-width:70px}
.src-item .src-url{font-size:12px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-item .src-del{color:#ff6b7a;font-size:13px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:.2s;flex-shrink:0}
.src-item .src-del:hover{background:rgba(255,107,122,.15)}
.src-add-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.src-add-form input{flex:1;min-width:100px;padding:8px 12px;border-radius:8px;background:rgba(255,200,160,.06);color:#fff;font-size:14px;border:1px solid var(--border)}
.src-add-form input:focus{border-color:var(--accent)}
.src-add-form button{padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.settings-section{margin-bottom:16px}
.settings-section h4{font-size:14px;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.settings-section h4 span{font-size:11px;color:var(--sub);font-weight:400}

/* RESPONSIVE */
@media(max-width:768px){
  .container{padding:0 12px}
  .hd-inner{gap:8px;flex-wrap:wrap;height:auto;padding:8px 0}
  .nav{gap:2px;width:100%;order:3;padding-top:4px}
  .nav-link{padding:6px 10px;font-size:13px}
  .hd-right{margin-left:auto}
  .hero{padding:24px 12px 20px}
  .hero-title{font-size:22px}
  /* 移动端搜索框优化：限制最大宽度，防止横屏时过长 */
  .hero-search{height:42px;max-width:90vw!important;margin:0 auto}
  .hero-search input{padding:0 12px!important}
  .hero-search button{padding:0 16px!important}
  .inline-search{max-width:90vw!important;margin:0 auto 20px}
  .main{padding:12px 8px 24px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .card-info{padding:6px 6px 8px}
  .card-title{font-size:12px}
  .sr-item{gap:10px;padding:10px}
  .sr-poster{width:70px;min-width:70px}
  .sr-name{font-size:14px}
  .modal-box{margin:0;border-radius:0}
  .modal-info{padding:12px 16px}
  .p-side{width:100%;max-width:320px;right:0}
  .p-open-btn{font-size:12px;height:32px;padding:0 8px;right:8px;top:8px}
  
  /* 移动端播放器按钮调整到右下角，避免遮挡左侧内容 */
  .p-bottom-btns{left:auto;right:12px;bottom:50px;gap:8px}
  .p-research-btn{left:auto;right:12px;bottom:140px}
  
  /* 移动端专属优化：隐藏不需要的悬浮按钮 (全屏、直连/iframe切换、重新搜索、下一集) */
  .p-fs-btn{display:none!important}
  .dp-mode-btn{display:none!important}
  .p-next-btn{display:none!important}
  .p-research-btn{display:none!important}
  /* 移动端放大全屏按钮 */
  #dpFsBtn{width:44px;height:44px;padding:8px}
  #dpFsBtn svg{width:28px;height:28px}
}

/* iOS全屏降级样式 */
.ios-fullscreen{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:99999!important;background:#000!important}
.ios-fullscreen .player-area{position:fixed!important;inset:0!important}
.ios-fullscreen .player-area iframe{width:100%!important;height:100%!important}
.ios-fullscreen .p-top,.ios-fullscreen .p-side,.ios-fullscreen .p-open-btn,.ios-fullscreen .p-bottom-btns,.ios-fullscreen .dp-controls{z-index:100000!important}

/* DIRECT PLAYER (HLS.js) */
.direct-video{width:100%;height:100%;background:#000;outline:none}
.dp-controls{position:fixed;bottom:0;left:0;right:0;z-index:225;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:10px 16px 14px;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .3s;pointer-events:none}
.dp-controls.show{opacity:1;pointer-events:auto}
.dp-progress-wrap{position:relative;height:6px;background:rgba(255,255,255,.15);border-radius:3px;cursor:pointer;overflow:visible}
.dp-progress-wrap:hover{height:10px}
.dp-buffer-bar{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,.25);border-radius:3px;transition:width .3s}
.dp-play-bar{position:absolute;top:0;left:0;height:100%;background:var(--accent);border-radius:3px;min-width:0}
.dp-play-thumb{position:absolute;top:50%;right:-6px;width:12px;height:12px;background:#fff;border-radius:50%;transform:translateY(-50%);box-shadow:0 0 4px rgba(0,0,0,.5);display:none}
.dp-progress-wrap:hover .dp-play-thumb{display:block}
.dp-btns{display:flex;align-items:center;gap:12px}
.dp-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;border-radius:6px;transition:.2s;background:none;border:none;flex-shrink:0}
.dp-btn:hover{background:rgba(255,255,255,.15)}
.dp-btn svg{width:20px;height:20px;fill:currentColor}
.dp-time{font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap;flex-shrink:0}
.dp-spacer{flex:1}
.dp-speed{font-size:12px;color:rgba(255,255,255,.7);cursor:pointer;padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.2);transition:.2s;flex-shrink:0;position:relative}
.dp-speed:hover{border-color:var(--accent);color:var(--accent)}
/* Volume slider popup */
.dp-vol-wrap{position:relative;display:flex;align-items:center}
.dp-vol-slider{width:0;overflow:hidden;transition:width .25s;display:flex;align-items:center}
.dp-vol-wrap:hover .dp-vol-slider,.dp-vol-wrap.active .dp-vol-slider{width:80px}
.dp-vol-slider input[type=range]{-webkit-appearance:none;appearance:none;width:72px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;outline:none;margin:0 4px;cursor:pointer}
.dp-vol-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
.dp-vol-slider input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
/* Speed menu popup */
.dp-speed-wrap{position:relative}
.dp-speed-menu{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;background:rgba(20,14,12,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,200,160,.15);border-radius:8px;padding:4px 0;display:none;min-width:64px;z-index:230}
.dp-speed-menu.show{display:block}
.dp-speed-opt{padding:6px 14px;font-size:12px;color:rgba(255,255,255,.7);cursor:pointer;text-align:center;white-space:nowrap;transition:.15s}
.dp-speed-opt:hover{background:rgba(255,140,107,.15);color:#fff}
.dp-speed-opt.active{color:var(--accent);font-weight:700}
/* Floating buttons auto-hide */
.p-bottom-btns,.dp-mode-btn,.p-research-btn,.p-top,.p-open-btn,.dp-buffer-status{transition:opacity .3s,background .2s}
.p-bottom-btns.autohide,.dp-mode-btn.autohide,.p-research-btn.autohide,.p-top.autohide,.p-open-btn.autohide,.dp-buffer-status.autohide{opacity:0;pointer-events:none}
.p-fs-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;pointer-events:auto}
.p-fs-btn:hover{background:var(--accent)}
.p-fs-btn:active{transform:scale(0.9)}
.p-fs-btn svg{width:18px;height:18px;fill:currentColor}
.dp-buffer-status{position:fixed;top:56px;right:12px;z-index:225;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px;font-size:12px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px;pointer-events:none;transition:opacity .3s}
.dp-buffer-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dp-buffer-dot.buffering{background:#ffaa00;animation:blink 1s infinite}
.dp-buffer-dot.ready{background:#4caf50}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dp-mode-btn{position:fixed;bottom:110px;left:16px;z-index:221;height:36px;padding:0 14px;border-radius:18px;backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s;border:1px solid}
.dp-mode-btn.iframe-mode{background:rgba(76,175,80,.3);border-color:rgba(76,175,80,.4)}
.dp-mode-btn.direct-mode{background:rgba(255,140,107,.3);border-color:rgba(255,140,107,.4)}
.dp-mode-btn:hover{filter:brightness(1.2)}
.p-research-btn{position:fixed;bottom:155px;left:16px;z-index:221;height:36px;padding:0 14px;border-radius:18px;background:rgba(33,150,243,.35);backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s;border:1px solid rgba(33,150,243,.5)}
.p-research-btn:hover{filter:brightness(1.2);background:rgba(33,150,243,.55)}
.p-research-btn:active{transform:scale(0.95)}
.dp-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:14px;gap:12px;background:rgba(0,0,0,.8);z-index:5}
.dp-error button{padding:8px 20px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;border:none}

/* NAME LIST (no posters) */
.name-list{display:flex;flex-wrap:wrap;gap:8px}
.name-item{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--card);border-radius:8px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:all .25s;border:1px solid var(--border);white-space:nowrap;position:relative}
.name-item:hover{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.3);color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,107,107,.1)}
.name-item:active{transform:scale(.96)}
.name-item .ni-idx{font-size:11px;font-weight:800;color:var(--sub);min-width:16px}
.name-item:nth-child(-n+3) .ni-idx{color:var(--accent)}
.name-item .ni-remarks{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.name-list-loading{display:flex;align-items:center;gap:8px;padding:20px 0;color:var(--sub);font-size:13px}
.name-list-loading .spin{width:18px;height:18px;border-width:2px;margin:0}
.name-list-empty{padding:16px 0;color:var(--sub);font-size:13px}
.name-item.name-top{background:linear-gradient(135deg,rgba(255,107,107,.12),rgba(255,142,142,.08));border-color:rgba(255,107,107,.3);font-weight:700;color:var(--text)}
.name-item.name-top .ni-idx{color:#fff;background:var(--accent-g);border-radius:4px;padding:0 5px;font-size:10px;min-width:20px;height:18px;display:flex;align-items:center;justify-content:center}

/* === PLATFORM POSTER GRID (Homepage Discovery) === */
.platform-section{margin-bottom:36px;animation:fadeUp .5s ease both}
.platform-section:last-child{margin-bottom:0}
.platform-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid transparent;border-image:var(--accent-g) 1;position:relative}
.platform-logo{height:32px;padding:4px 14px;border-radius:8px;font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.5px;flex-shrink:0}
.platform-logo.plat-douban{background:linear-gradient(135deg,#2dc84d,#20a03c)}
.platform-logo.plat-qq{background:linear-gradient(135deg,#ff6a13,#ff8f40)}
.platform-logo.plat-iqiyi{background:linear-gradient(135deg,#00be07,#1db924)}
.platform-logo.plat-youku{background:linear-gradient(135deg,#1ebdf5,#0099cc)}
.platform-logo.plat-mgtv{background:linear-gradient(135deg,#ff5f1e,#ff3c00)}
.platform-logo.plat-baidu{background:linear-gradient(135deg,#306cf5,#2654c0)}
.platform-logo.plat-weibo{background:linear-gradient(135deg,#ff6b35,#e6162d)}
.platform-logo.plat-shortdrama{background:linear-gradient(135deg,#ff4081,#f50057)}
.platform-logo.plat-default{background:var(--accent-g)}
.platform-count{font-size:12px;color:var(--sub);font-weight:400;margin-left:4px}
.platform-more{margin-left:auto;font-size:13px;color:var(--accent);cursor:pointer;padding:5px 14px;border-radius:8px;border:1px solid rgba(255,107,107,.2);transition:all .25s;font-weight:500;white-space:nowrap}
.platform-more:hover{background:rgba(255,107,107,.1);border-color:var(--accent);transform:translateX(2px)}
@media(max-width:768px){
  .platform-logo{height:28px;font-size:13px;padding:3px 10px}
}
</style>

<!-- HEADER -->
<header class="header">

    <a class="logo" onclick="goHome()">闯哥影视</a>
    <nav class="nav" id="navLinks"></nav>
    <div class="hd-right">
      <span class="hd-link" onclick="toggleSettings()">⚙ 设置</span>
      <span class="hd-link" onclick="toggleHistory()">观看记录</span>
      <span style="margin-left:12px;font-size:15px;color:#b89a8a;white-space:nowrap;">制作者：闯</span>
    </div>
  </div>
</header>

<!-- HERO SEARCH (homepage only) -->
<div class="hero" id="heroSection">
  <h1 class="hero-title"></h1>
  <p class="hero-subtitle"></p>
  <div class="suggest-wrap">
    <div class="hero-search">
      <input type="search" id="heroInput" name="hero_search_q" placeholder="输入影片名称..." autocomplete="nopemail" autocorrect="off" autocapitalize="off" spellcheck="false"
        oninput="onSearchInput(this.value,'heroSuggest')"
        onclick="onSearchInput(this.value,'heroSuggest')"
        onkeydown="onSearchKeydown(event,'heroSuggest')"
        onfocus="onSearchInput(this.value,'heroSuggest')"
        onblur="setTimeout(()=>hideSuggest('heroSuggest'),100)">
      <button onclick="doSearch(document.getElementById('heroInput').value)">搜索</button>
    </div>
    <div class="suggest-list" id="heroSuggest"></div>
  </div>
</div>
<script>
// 防止360登录管家等扩展自动填充邮箱到搜索框
(function(){
  var emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var input=document.getElementById('heroInput');
  if(!input) return;
  var cleared=false;
  var timer=setInterval(function(){
    if(cleared){clearInterval(timer);return;}
    if(document.activeElement===input){cleared=true;clearInterval(timer);return;}
    if(input.value&&emailRe.test(input.value)){input.value='';}
  },50);
  setTimeout(function(){clearInterval(timer);},5000);
})();
</script>

// === JSONP FETCH ===
let _jpId = 0;
function jpFetch(url, timeout) {
  timeout = timeout || 4000;
  return new Promise((resolve, reject) => {
    const cb = '_jp' + (++_jpId) + '_' + Math.random().toString(36).substr(2,5);
    const s = document.createElement('script');
    s.setAttribute('data-jp','1');
    let done = false;
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeout);
    const beforeScripts = document.querySelectorAll('script:not([data-jp])').length;
    const beforeIframes = document.querySelectorAll('iframe:not(.player-area iframe)').length;
    function cleanup() {
      if (done) return; done = true;
      clearTimeout(timer);
      delete window[cb];
      if (s.parentNode) s.remove();
      document.querySelectorAll('script:not([data-jp])').forEach((el,i) => { if(i >= beforeScripts) el.remove(); });
      document.querySelectorAll('iframe').forEach(el => { if(!el.closest('.player-area,.modal-box')) el.remove(); });
    }
    window[cb] = function(data) { cleanup(); resolve(data); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    s.onerror = function() { cleanup(); reject(new Error('load')); };
    document.head.appendChild(s);
  });
}

}

}

// === KEYWORD EXPANSION (智能搜索扩展) ===
function expandKeywords(keyword) {
  const kw = keyword.trim();
  if (!kw) return [kw];
  const results = new Set();
  results.add(kw);

  const numToCn = {'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九','10':'十','11':'十一','12':'十二','13':'十三','14':'十四','15':'十五'};
  const cnToNum = {};
  for (const [k,v] of Object.entries(numToCn)) cnToNum[v] = k;

  // Pattern 1: trailing Arabic digit(s) → "第X季" variant and base name
  const trailingNum = kw.match(/^(.+?)(\d+)$/);
  if (trailingNum) {
    const base = trailingNum[1].trim();
    const num = trailingNum[2];
    const cn = numToCn[num] || num;
    results.add(base + '第' + cn + '季');
    results.add(base + '第' + num + '季');
    results.add(base + num);
    results.add(base); // base name to catch all seasons
  }

  // Pattern 2: trailing Chinese number → Arabic variant
  const cnNums = Object.keys(cnToNum);
  for (const cn of cnNums) {
    if (kw.endsWith(cn) && kw.length > cn.length) {
      const base = kw.slice(0, -cn.length).trim();
      const num = cnToNum[cn];
      results.add(base + num);
      results.add(base + '第' + cn + '季');
      results.add(base);
    }
  }

  // Pattern 3: "第X季" format → extract base and number variants
  const seasonCnMatch = kw.match(/^(.+?)第([一二三四五六七八九十百]+)季$/);
  if (seasonCnMatch) {
    const base = seasonCnMatch[1].trim();
    const cnNum = seasonCnMatch[2];
    const arabicNum = cnToNum[cnNum] || '';
    if (arabicNum) results.add(base + arabicNum);
    results.add(base);
  }
  const seasonNumMatch = kw.match(/^(.+?)第(\d+)季$/);
  if (seasonNumMatch) {
    const base = seasonNumMatch[1].trim();
    const num = seasonNumMatch[2];
    const cn = numToCn[num] || num;
    results.add(base + '第' + cn + '季');
    results.add(base + num);
    results.add(base);
  }

  // Pattern 4: "SX" / "sX" suffix → "第X季"
  const sxMatch = kw.match(/^(.+?)[Ss](\d+)$/);
  if (sxMatch) {
    const base = sxMatch[1].trim();
    const num = sxMatch[2];
    const cn = numToCn[num] || num;
    results.add(base + '第' + cn + '季');
    results.add(base + num);
    results.add(base);
  }

  // Pattern 5: Roman numerals (II, III, IV...)
  const romanMap = {'II':'2','III':'3','IV':'4','V':'5','VI':'6','VII':'7','VIII':'8','IX':'9','X':'10'};
  for (const [roman, num] of Object.entries(romanMap)) {
    if (kw.toUpperCase().endsWith(roman)) {
      const base = kw.slice(0, -roman.length).trim();
      if (base.length > 0) {
        const cn = numToCn[num] || num;
        results.add(base + '第' + cn + '季');
        results.add(base + num);
        results.add(base);
      }
    }
  }

  // Pattern 6: contains space → try without spaces
  if (kw.includes(' ')) {
    results.add(kw.replace(/\s+/g, ''));
  }

  // Pattern 7: Long Chinese name → extract core keywords for short dramas
  // e.g. "闪婚嫁给残疾大佬后" → "闪婚", "闪婚嫁给", "残疾大佬"
  if (kw.length >= 5 && /^[\u4e00-\u9fff\uff00-\uffef]+$/.test(kw)) {
    var hotPrefixes = ['闪婚','重生','穿越','穿书','替嫁','离婚','退婚','团宠','萌宝','龙王','战神','神医','赘婿','豪门','逆袭','首富','特工','千金','绝品','至尊','鉴宝','凤归','医妃','龙婿','神豪','女总裁','总裁','全民','千亿'];
    for (var pi = 0; pi < hotPrefixes.length; pi++) {
      var pf = hotPrefixes[pi];
      if (kw.startsWith(pf) && kw.length > pf.length) {
        results.add(pf);
        if (kw.length >= pf.length + 2) results.add(kw.slice(0, pf.length + 2));
        if (kw.length >= pf.length + 3) results.add(kw.slice(0, pf.length + 3));
      }
    }
    // Try first 2, 3, 4 chars
    if (kw.length > 4) results.add(kw.slice(0, 4));
    if (kw.length > 3) results.add(kw.slice(0, 3));
    if (kw.length > 2) results.add(kw.slice(0, 2));
    // Remove common trailing particles
    var suffixes = ['后','了','吧','的','啊','呢','吗','着','过'];
    for (var si2 = 0; si2 < suffixes.length; si2++) {
      if (kw.endsWith(suffixes[si2]) && kw.length > 3) {
        results.add(kw.slice(0, -1));
      }
    }
    // Split on "之", "：", ":", "的", "—"
    var splitChars = ['之','：',':','的','—','·'];
    for (var sci = 0; sci < splitChars.length; sci++) {
      var scIdx = kw.indexOf(splitChars[sci]);
      if (scIdx > 1 && scIdx < kw.length - 1) {
        results.add(kw.slice(0, scIdx));
        results.add(kw.slice(scIdx + 1));
      }
    }
  }

  return [...results];
}

// === SEARCH API ===
async function apiSearch(keyword, sourceIdx, onPartial) {
  const cacheKey = 'search:' + keyword + ':' + sourceIdx;
  const cached = cacheGet(cacheKey);
  if (cached) {
    if (onPartial) onPartial(cached, 'cache');
    return cached;
  }

  const sources = sourceIdx === -1 ? [...API_SOURCES, ...SHORT_DRAMA_SOURCES] : [API_SOURCES[sourceIdx]];
  const allResults = [];
  const seen = new Set();
  const failedSources = [];

  // Generate expanded keywords for better coverage
  const keywords = sourceIdx === -1 ? expandKeywords(keyword) : [keyword];
  const primaryKw = keyword.trim();

  let _reportedCompleted = 0;
  const _totalSources = sources.length;

  // Build all search tasks: each source × each keyword, all run in parallel
  const tasks = [];
  for (const src of sources) {
    tasks.push({ src, kw: primaryKw, isPrimary: true });
    // Expanded keywords on top API sources AND all SHORT_DRAMA_SOURCES
    const isTopSource = API_SOURCES.indexOf(src) < 10 || SHORT_DRAMA_SOURCES.indexOf(src) >= 0;
    for (const ekw of keywords) {
      if (ekw === primaryKw) continue;
      if (isTopSource) {
        tasks.push({ src, kw: ekw, isPrimary: false });
      }
    }
  }

  const srcDone = new Map();

  function addItems(data, srcName, isPrimary) {
    if (!data || !data.list) return;
    const items = data.list.map(item => ({
      id: item.vod_id, name: item.vod_name||'', type: item.type_name||'',
      pic: item.vod_pic||'', year: item.vod_year||'', remarks: item.vod_remarks||'',
      actor: item.vod_actor||'', director: item.vod_director||'',
      desc: (item.vod_blurb||item.vod_content||'').replace(/<[^>]+>/g,'').slice(0,200),
      playFrom: item.vod_play_from||'', playUrl: item.vod_play_url||'',
      score: item.vod_score||'', source: srcName,
    })).filter(it => {
      const normName = it.name.replace(/\s+/g,'').toLowerCase();
      const key = normName + '|' + it.source;
      if (seen.has(key)) return false;
      const nameKey = normName + '|' + (it.type||'未知');
      if (seen.has(nameKey)) return false;
      seen.add(key);
      seen.add(nameKey);
      return true;
    });
    allResults.push(...items);
    if (isPrimary && !srcDone.has(srcName)) {
      srcDone.set(srcName, true);
      _reportedCompleted++;
      if (onPartial) onPartial([...allResults], srcName, _reportedCompleted, _totalSources);
    }
  }

  const promises = tasks.map(async (task) => {
    try {
      const url = task.src.api + '?ac=detail&wd=' + encodeURIComponent(task.kw);
      const data = await apiFetch(url);
      addItems(data, task.src.name, task.isPrimary);
    } catch(e) {
      if (task.isPrimary) {
        if (!srcDone.has(task.src.name)) {
          srcDone.set(task.src.name, true);
          _reportedCompleted++;
        }
        failedSources.push(task.src);
      }
    }
  });
  await Promise.all(promises);

  // Retry failed sources once (primary keyword only)
  if (failedSources.length > 0) {
    const retryPromises = failedSources.map(async (src) => {
      try {
        const url = src.api + '?ac=detail&wd=' + encodeURIComponent(primaryKw);
        const data = await apiFetch(url);
        addItems(data, src.name, true);
      } catch(e) {}
    });
    await Promise.all(retryPromises);
  }

  // Sort results: exact/partial name matches first
  allResults.sort(function(a, b) {
    const kwLower = primaryKw.toLowerCase();
    const aName = a.name.toLowerCase();
    const bName = b.name.toLowerCase();
    const aExact = aName === kwLower ? 0 : aName.includes(kwLower) ? 1 : 2;
    const bExact = bName === kwLower ? 0 : bName.includes(kwLower) ? 1 : 2;
    if (aExact !== bExact) return aExact - bExact;
    return 0;
  });

  if (allResults.length) cacheSet(cacheKey, allResults);
  return allResults;
}

// === CATEGORY LOADER ===
const _catCache = {};
const PER_PAGE = 24;

function mapVodItem(item, srcName) {
  return {
    id: item.vod_id, name: item.vod_name||'', type: item.type_name||'',
    pic: item.vod_pic||'', year: item.vod_year||'', remarks: item.vod_remarks||'',
    actor: item.vod_actor||'', playFrom: item.vod_play_from||'',
    playUrl: item.vod_play_url||'', source: srcName,
    area: item.vod_area||'', class: item.vod_class||'',
    sourceIdx: API_SOURCES.indexOf(API_SOURCES.find(s=>s.name===srcName)),
  };
}

function mapListItem(item, srcName) {
  return {
    id: item.vod_id, name: item.vod_name||'', type: item.type_name||'',
    pic: item.vod_pic||'', year: item.vod_year||'', remarks: item.vod_remarks||'',
    actor: '', playFrom: '', playUrl: '', source: srcName,
    area: '', class: '',
    sourceIdx: API_SOURCES.indexOf(API_SOURCES.find(s=>s.name===srcName)),
  };
}

async function apiLoadCatFull(catName) {
  if (_catCache[catName] && _catCache[catName].data.length >= 400 && Date.now() - _catCache[catName].ts < CACHE_TTL) {
    return _catCache[catName].data;
  }
  // Parent + subcategory type IDs per source (different sources use different IDs)
  const typeMap = {'电影':'1','电视剧':'2','动漫':'4','综艺':'3'};
  // Subcategory IDs that commonly map to each category across different sources
  const subTypeMap = {
    '电影':['1','6','7','8','9','10','11','12','20','21','22','23','24'],
    '电视剧':['2','13','14','15','16','25','26','27','28'],
    '综艺':['3','17','18','29','30'],
    '动漫':['4','19','31','32','33','29'],
  };
  const tid = typeMap[catName]||'';
  const subTids = subTypeMap[catName] || [];
  const allItems = [];
  const seen = new Set();
  const TARGET = catName === '综艺' ? 150 : 300;
  const isShortDrama = (catName === '短剧');
  const shortDramaTids = ['44','45','46','43','34','35','36','47','48'];
  const tasks = [];
  const ALL_SOURCES = API_SOURCES;
  const TOP_SOURCES = API_SOURCES.slice(0, 8);

  if (isShortDrama) {
    // 短剧：精简抓取
    for (const src of ALL_SOURCES.slice(0, 8)) {
      for (const sTid of shortDramaTids) {
        tasks.push({ src, pg: 1, tid: sTid, mode:'list' });
        tasks.push({ src, pg: 2, tid: sTid, mode:'list' });
      }
    }
    for (const src of ALL_SOURCES.slice(0, 5)) {
      for (const sTid of shortDramaTids) {
        tasks.push({ src, pg: 1, tid: sTid, mode:'detail' });
      }
    }
  } else {
    // Strategy 1: ac=detail with parent type ID (returns playUrl, pic, etc.)
    for (const src of TOP_SOURCES) {
      for (const pg of [1,2,3,4]) {
        tasks.push({ src, pg, tid, mode:'detail' });
      }
    }
    // Strategy 2: ac=list with parent type ID (faster, more items per page)
    for (const src of TOP_SOURCES) {
      for (const pg of [1,2,3,4,5]) {
        tasks.push({ src, pg, tid, mode:'list' });
      }
    }
    // Strategy 3: ac=list with subcategory IDs (catches items missed by parent ID)
    for (const src of TOP_SOURCES.slice(0, 4)) {
      for (const sTid of subTids) {
        tasks.push({ src, pg: 1, tid: sTid, mode:'list' });
      }
    }
  }

  const results = await Promise.all(tasks.map(async ({ src, pg, tid: t, mode }) => {
    try {
      const url = src.api + '?ac=' + mode + (t ? '&t=' + t : '') + '&pg=' + pg;
      const data = await apiFetch(url);
      if (data && data.list) {
        return mode === 'detail' ? data.list.map(it => mapVodItem(it, src.name)) : data.list.map(it => mapListItem(it, src.name));
      }
    } catch(e) {}
    return [];
  }));

  // Helper: check if item type matches category (flexible matching)
  function typeMatches(itemType, cat) {
    if (!itemType || itemType === '') return true; // unknown type, allow
    const t = itemType.toLowerCase();
    
    const aliases = catAliases[cat] || [cat];
    return aliases.some(a => t.includes(a) || a.includes(t));
  }

  for (const batch of results) {
    for (const item of batch) {
      if (!item.name) continue;
      const key = item.name;
      if (isShortDrama) {
        const t = (item.type||'').toLowerCase();
        if (t && !t.includes('短剧') && !t.includes('短片') && t !== '') continue;
      } else {
        if (!typeMatches(item.type, catName)) continue;
      }
      if (!seen.has(key) && allItems.length < TARGET) {
        seen.add(key);
        allItems.push(item);
      }
    }
  }

  if (isShortDrama && allItems.length < 30) {
    const allSrc = [...API_SOURCES.slice(0, 6), ...SHORT_DRAMA_SOURCES];
    const keywords = ['短剧','红果短剧','微短剧','竖屏短剧'];
    const kwTasks = [];
    for (const src of allSrc) {
      for (const kw of keywords) {
        kwTasks.push((async () => {
          try {
            const url = src.api + '?ac=detail&wd=' + encodeURIComponent(kw) + '&pg=1';
            const data = await apiFetch(url);
            if (data && data.list) return data.list.map(it => mapVodItem(it, src.name));
          } catch(e) {}
          return [];
        })());
      }
      for (const sTid of shortDramaTids) {
        kwTasks.push((async () => {
          try {
            const url = src.api + '?ac=list&t=' + sTid + '&pg=1';
            const data = await apiFetch(url);
            if (data && data.list) return data.list.map(it => mapListItem(it, src.name));
          } catch(e) {}
          return [];
        })());
      }
    }
    const kwResults = await Promise.all(kwTasks);
    for (const batch of kwResults) {
      for (const item of batch) {
        if (!item.name) continue;
        if (!seen.has(item.name) && allItems.length < TARGET) {
          seen.add(item.name);
          allItems.push(item);
        }
      }
    }
  }

  // Final fallback: ac=detail without type filter, filter client-side
  if (allItems.length < 30 && !isShortDrama) {
    const fallbackTasks = [];
    for (const src of API_SOURCES.slice(0, 5)) {
      for (const pg of [1, 2, 3, 4, 5]) {
        fallbackTasks.push({ src, pg });
      }
    }
    const fbResults = await Promise.all(fallbackTasks.map(async ({ src, pg }) => {
      try {
        const url = src.api + '?ac=detail&pg=' + pg;
        const data = await apiFetch(url);
        if (data && data.list) return data.list.map(it => mapVodItem(it, src.name));
      } catch(e) {}
      return [];
    }));
    for (const batch of fbResults) {
      for (const item of batch) {
        if (!item.name) continue;
        if (!typeMatches(item.type, catName)) continue;
        if (!seen.has(item.name) && allItems.length < TARGET) {
          seen.add(item.name);
          allItems.push(item);
        }
      }
    }
  }

  _catCache[catName] = { data: allItems, ts: Date.now() };
  return allItems;
}


// === RENDER FUNCTIONS ===
function proxyImg(url) {
  if (!url) return '';
  if (url.startsWith('data:')) return url;
  if (url.includes('wsrv.nl')) return url;
  // 对已经是https的图片直接使用wsrv代理，降低图片尺寸加速加载
  return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=280&h=420&fit=cover&output=webp&q=80';
}

function cardHTML(item, idx, eager) {
  let pic = item.pic;
  if (!pic) pic = getCachedImg(item.name);
  const d = JSON.stringify(item).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
  const loadAttr = eager ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"';
  const poster = pic
    ? '<img src="'+proxyImg(pic)+'" alt="'+esc(item.name)+' 海报" '+loadAttr+' referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
      + '<div class="card-ph" style="display:none">'+esc(item.name)+'</div>'
    : '<div class="card-ph">'+esc(item.name)+'</div>';
  const scoreHtml = item.score && parseFloat(item.score) > 0 ? '<span class="card-score">'+esc(item.score)+'</span>' : '';
  return '<div class="card" onclick=\'openPlayer('+d+')\'>'
    + '<div class="card-poster">'+poster
    + '<div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>'
    + (item.type?'<span class="card-badge">'+esc(item.type)+'</span>':'')
    + scoreHtml
    + (item.remarks?'<div class="card-ep">'+esc(item.remarks)+'</div>':'')
    + '</div><div class="card-info"><div class="card-title">'+esc(item.name)+'</div>'
    + '<div class="card-sub">'+(item.year?item.year+' · ':'')+esc(item.actor||'')+'</div></div></div>';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

const SECTION_ICONS = {'电视剧':'&#127909;','电影':'&#127916;','综艺':'&#127908;','动漫':'&#127912;','短剧':'&#9889;'};

function sectionHTML(title, items, eager) {
  if (!items||!items.length) return '';
  var sliced = items.slice(0,20);
  // 后台为缺图条目搜索封面
  setTimeout(function() { queueMissingImages(sliced); }, 300);
  return '<div class="section"><div class="section-head"><div class="section-title">'+title+'</div></div>'
    + '<div class="grid">'+sliced.map((it,i)=>cardHTML(it,i,!!eager)).join('')+'</div></div>';
}

function paginatedSectionHTML(title, items, page, catName) {
  if (!items||!items.length) return '';
  const total = items.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  const start = (page - 1) * PER_PAGE;
  const pageItems = items.slice(start, start + PER_PAGE);
  // 后台为缺图的条目搜索封面
  setTimeout(function() { queueMissingImages(pageItems); }, 200);
  let html = '<div class="section"><div class="section-head"><div class="section-title">'
    + title + ' <span style="font-size:12px;color:var(--sub);font-weight:400">（共'+total+'部）</span></div></div>'
    + '<div class="grid">'+pageItems.map((it,i)=>cardHTML(it,i)).join('')+'</div>';
  if (totalPages > 1) {
    html += '<div class="pager">';
    html += '<span class="pager-btn'+(page<=1?' disabled':'')+'" onclick="catPage(\''+catName+'\','+(page-1)+')">上一页</span>';
    for (let p = 1; p <= totalPages; p++) {
      if (totalPages > 10 && Math.abs(p - page) > 3 && p !== 1 && p !== totalPages) {
        if (p === 2 || p === totalPages - 1) html += '<span class="pager-info">...</span>';
        continue;
      }
      html += '<span class="pager-btn'+(p===page?' active':'')+'" onclick="catPage(\''+catName+'\','+p+')">'+p+'</span>';
    }
    html += '<span class="pager-btn'+(page>=totalPages?' disabled':'')+'" onclick="catPage(\''+catName+'\','+(page+1)+')">下一页</span>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// === 从 shows.json 加载剧名列表（GitHub 仓库中的独立文件） ===
var _loadedShows = null; // 缓存从 shows.json 加载的数据
async function loadShowsFromJson() {
  if (_loadedShows) return _loadedShows;
  try {
    const resp = await fetch('shows.json', { cache: 'no-cache' });
    if (resp.ok) {
      const data = await resp.json();
      _loadedShows = data;
      return data;
    }
  } catch(e) {
    console.log('shows.json 加载失败，使用默认列表');
  }
  return null;
}

// === 后台获取最新热播数据（优先用 shows.json，失败则从API获取，最后用静态列表） ===
async function fetchHotShowsByCategory() {
  var result = { tv: [], movie: [], variety: [], anime: [], shortdrama: [] };
  var catMap = { tv: '电视剧', movie: '电影', variety: '综艺', anime: '动漫', shortdrama: '短剧' };
  
  // 优先从 shows.json 加载
  var jsonShows = await loadShowsFromJson();
  if (jsonShows) {
    Object.keys(catMap).forEach(function(key) {
      if (jsonShows[key] && jsonShows[key].length > 0) {
        result[key] = jsonShows[key];
      }
    });
  }
  
  // 对于 shows.json 中没有或为空的分类，从API获取
  var tasks = Object.keys(catMap).map(async function(key) {
    if (result[key] && result[key].length > 0) return; // 已有数据，跳过
    try {
      var catName = catMap[key];
      var items = await apiLoadCatFull(catName);
      if (items && items.length >= 5) {
        result[key] = items.slice(0, 60).map(function(it) { return it.name; }).filter(Boolean);
      }
    } catch(e) {}
  });
  await Promise.all(tasks);
  
  // 对任何没有拿到数据的分类，使用静态列表兜底
  Object.keys(result).forEach(function(key) {
    if (!result[key] || result[key].length < 3) {
      result[key] = STATIC_FALLBACK_SHOWS[key] || [];
    }
  });
  return result;
}

  // 立即用缓存数据渲染（含图片缓存预填充）
  const curated = (_catCache[catName] && _catCache[catName].data) || [];
  const imgCache = getImgCache();
  curated.forEach(function(item) {
    if (!item.pic && imgCache[item.name]) item.pic = imgCache[item.name];
  });
  if (curated.length) {
    _catPageNum[catName] = _catPageNum[catName] || 1;

    _catCache[catName] = { data: curated, ts: Date.now() };

  }

  apiLoadCatFull(catName).then(apiItems => {
    if (gen !== _navGeneration) return; // 用户已切走，丢弃结果
    if (!apiItems.length) return;
    const enriched = enrichWithApi(catName, curated, apiItems);
    _catCache[catName] = { data: enriched, ts: Date.now() };
    // Cache images
    const ic = getImgCache();
    enriched.forEach(function(item) { if (item.pic) ic[item.name] = item.pic; });
    setImgCache(ic);
    if (gen !== _navGeneration) return; // 再次检查
    const pg = _catPageNum[catName] || 1;
    hp.innerHTML = paginatedSectionHTML(catName + '热门', enriched, pg, catName);
    preloadVisibleCards();
  });
}

// 预加载当前页面上所有可见卡片的图片
function preloadVisibleCards() {
  if (_playerOpen) return; // 播放器打开时不加载图片
  requestAnimationFrame(function() {
    var cards = document.querySelectorAll('.card-poster img[loading="lazy"]');
    cards.forEach(function(img) {
      img.loading = 'eager';
      if (img.dataset && img.dataset.src) {
        img.src = img.dataset.src;
      }
    });

}

// 后台为缺图的条目搜索封面图片
var _imgFetchQueue = [];
var _imgFetchRunning = false;
var _playerOpen = false; // 播放器打开时暂停图片加载，释放带宽给视频

function queueMissingImages(items) {
  var imgCache = getImgCache();
  var missing = items.filter(function(it) {
    return it.name && !it.pic && !imgCache[it.name];
  });
  if (!missing.length) return;
  // 去重
  var queued = new Set(_imgFetchQueue.map(function(m) { return m.name; }));
  missing.forEach(function(it) {
    if (!queued.has(it.name)) {
      _imgFetchQueue.push(it);
      queued.add(it.name);
    }
  });
  if (!_imgFetchRunning) runImageFetcher();
}

async function runImageFetcher() {
  _imgFetchRunning = true;
  var batchSize = 4; // 每批并发4个
  while (_imgFetchQueue.length > 0) {
    if (_playerOpen) { _imgFetchRunning = false; return; } // 播放器打开时暂停，释放带宽
    var batch = _imgFetchQueue.splice(0, batchSize);
    await Promise.all(batch.map(async function(item) {
      // 尝试从前3个API源搜索图片
      for (var si = 0; si < Math.min(3, API_SOURCES.length); si++) {
        try {
          var src = API_SOURCES[si];
          var data = await apiFetch(src.api + '?ac=detail&wd=' + encodeURIComponent(item.name));
          if (data && data.list) {
            var match = data.list.find(function(v) {
              return v.vod_pic && v.vod_name && (v.vod_name === item.name || v.vod_name.includes(item.name) || item.name.includes(v.vod_name));
            });
            if (match && match.vod_pic) {
              item.pic = match.vod_pic;
              cacheImg(item.name, match.vod_pic);
              // 将API匹配结果转换为完整的item对象，确保海报和播放数据一致
              var matchedItem = mapVodItem(match, src.name);
              // 保留原始item中有效的字段作为回退
              if (!matchedItem.playUrl && item.playUrl) matchedItem.playUrl = item.playUrl;
              if (!matchedItem.playFrom && item.playFrom) matchedItem.playFrom = item.playFrom;
              // 更新页面上对应的卡片（包括海报和onclick数据）
              updateCardImage(item.name, match.vod_pic, matchedItem);
              break;
            }
          }
        } catch(e) {}
      }
    }));
  }
  _imgFetchRunning = false;
}

function updateCardImage(name, picUrl, matchedItem) {
  var allCards = document.querySelectorAll('.card');
  allCards.forEach(function(card) {
    var titleEl = card.querySelector('.card-title');
    if (!titleEl || titleEl.textContent !== name) return;
    var poster = card.querySelector('.card-poster');
    if (!poster) return;
    var existingImg = poster.querySelector('img');
    if (existingImg && existingImg.src && !existingImg.src.includes('data:')) return;
    var ph = poster.querySelector('.card-ph');
    if (!ph) return;
    var img = document.createElement('img');
    img.src = proxyImg(picUrl);
    img.alt = name + ' 海报';
    img.loading = 'eager';
    img.referrerPolicy = 'no-referrer';
    img.style.opacity = '0';
    img.style.transition = 'opacity 0.4s ease';
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.style.display = 'block';
    img.onload = function() { img.style.opacity = '1'; ph.style.display = 'none'; };
    img.onerror = function() { img.style.display = 'none'; ph.style.display = 'flex'; };
    poster.insertBefore(img, ph);
    // 同步更新onclick数据，确保点击播放的内容与海报一致
    if (matchedItem) {
      var d = JSON.stringify(matchedItem).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
      card.setAttribute('onclick', 'openPlayer('+d+')');
      // 更新集数标签
      var epBadge = poster.querySelector('.card-ep');
      if (matchedItem.remarks) {
        if (epBadge) { epBadge.textContent = matchedItem.remarks; }
        else { var eb = document.createElement('div'); eb.className = 'card-ep'; eb.textContent = matchedItem.remarks; poster.appendChild(eb); }
      }
    }
  });
}

function enrichWithApi(catName, curated, apiItems) {
  const apiMap = {};
  const apiList = [];
  for (const item of apiItems) {
    if (item.name) {
      apiMap[item.name] = item;
      apiList.push(item);
    }
  }
  const usedNames = new Set();
  const result = curated.map(c => {
    let api = apiMap[c.name];
    if (!api) {
      api = apiList.find(a => !usedNames.has(a.name) && (a.name.includes(c.name) || c.name.includes(a.name)));
    }
    if (api) {
      usedNames.add(api.name);
      return { ...c, pic: api.pic || c.pic, actor: api.actor || c.actor,
               playFrom: api.playFrom || c.playFrom || '', playUrl: api.playUrl || c.playUrl || '',
               id: api.id || c.id, sourceIdx: api.sourceIdx !== undefined ? api.sourceIdx : c.sourceIdx,
               source: api.source || c.source,
               remarks: api.remarks || c.remarks };
    }
    return c;
  });
  if (result.length < 300) {
    const curatedNames = new Set(curated.map(c => c.name));
    for (const api of apiList) {
      if (result.length >= 300) break;
      if (!curatedNames.has(api.name) && !usedNames.has(api.name)) {
        result.push(api);
        usedNames.add(api.name);
      }
    }
  }
  // Cache images after enrichment
  const imgCache = getImgCache();
  result.forEach(function(item) { if (item.pic) imgCache[item.name] = item.pic; });
  setImgCache(imgCache);
  return result;
}

// === 智能选源：自动探测最优播放资源和线路 ===
// 探测m3u8 URL是否可达，返回响应时间(ms)，失败返回Infinity
async function probeM3u8(url, timeout) {
  timeout = timeout || 2000;
  var start = performance.now();
  try {
    // 尝试直接fetch m3u8（可能跨域失败，但能测试连通性）
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, timeout);
    var resp = await fetch(url, {
      method: 'HEAD',
      mode: 'no-cors',
      signal: controller.signal,
      cache: 'no-store'
    });
    clearTimeout(timer);
    return performance.now() - start;
  } catch(e) {
    // no-cors模式下即使成功也可能是opaque response，我们用时间来判断
    var elapsed = performance.now() - start;
    // 如果在超时前返回，说明服务器有响应（即使跨域被阻止）
    if (elapsed < timeout - 100) return elapsed;
    return Infinity;
  }
}

// 从所有资源路线中选出最快的一条
async function autoSelectBestRoute(playData, epIndex) {
  if (!playData || playData.length === 0) return 0;
  if (playData.length === 1) return 0;
  epIndex = epIndex || 0;

  var candidates = [];
  for (var ri = 0; ri < playData.length; ri++) {
    if (playData[ri].episodes && playData[ri].episodes.length > epIndex) {
      var url = playData[ri].episodes[epIndex].url;
      if (url && /\.m3u8/i.test(url)) {
        candidates.push({ route: ri, url: url });
      }
    }
  }
  if (candidates.length === 0) return 0;
  if (candidates.length === 1) return candidates[0].route;

  // 优先使用缓存的源评分数据
  var scoreCache = _routeScoreCache || {};
  var hasCachedScores = false;
  candidates.forEach(function(c) {
    var host = extractHost(c.url);
    if (scoreCache[host] && Date.now() - scoreCache[host].ts < 30 * 60 * 1000) {
      c.cachedTime = scoreCache[host].time;
      hasCachedScores = true;
    }
  });
  if (hasCachedScores) {
    var withCache = candidates.filter(function(c) { return c.cachedTime !== undefined; });
    if (withCache.length > 0) {
      withCache.sort(function(a, b) { return a.cachedTime - b.cachedTime; });
      if (withCache[0].cachedTime < 3000) return withCache[0].route;
    }
  }

  // 并发探测所有候选m3u8，选最快的
  var results = await Promise.all(candidates.map(async function(c) {
    var time = await probeM3u8(c.url, 1500);
    // 记录评分
    var host = extractHost(c.url);
    if (!_routeScoreCache) _routeScoreCache = {};
    _routeScoreCache[host] = { time: time, ts: Date.now() };
    return { route: c.route, time: time, url: c.url };
  }));

  // 按响应时间排序
  results.sort(function(a, b) { return a.time - b.time; });

  // 选最快的那条
  if (results[0].time < Infinity) {
    return results[0].route;
  }
  return 0; // 都超时就用第一条
}

function extractHost(url) {
  try { return new URL(url).host; } catch(e) { return url.slice(0, 50); }
}

// === PLAYER ===
function parsePlayData(playFrom, playUrl) {
  const sources = (playFrom||'').split('$$$');
  const groups = (playUrl||'').split('$$$');
  const out = [];
  for (let i = 0; i < sources.length; i++) {
    if (!groups[i]) continue;
    const eps = groups[i].split('#').map(e => {
      const p = e.split('$');
      return p.length >= 2 ? {name:p[0], url:p[1]} : null;
    }).filter(Boolean);
    if (eps.length) out.push({source:sources[i], episodes:eps});
  }
  const m3u8Only = out.filter(s => /m3u8/i.test(s.source));
  return m3u8Only.length > 0 ? m3u8Only : out;
}

let _playData = [], _curRoute = 0;

// === 名称匹配评分函数：精确匹配 > 双向包含 > 单向包含 ===
function nameMatchScore(vodName, searchName) {
  if (!vodName || !searchName) return 0;
  if (vodName === searchName) return 100; // 完全匹配
  if (vodName.includes(searchName) && searchName.includes(vodName)) return 90; // 双向包含（几乎一样）
  if (vodName === searchName + ' ' || ' ' + vodName === searchName) return 85; // 多余空格
  if (vodName.includes(searchName) && vodName.length <= searchName.length + 4) return 70; // 包含且长度接近
  if (searchName.includes(vodName) && searchName.length <= vodName.length + 4) return 65;
  if (vodName.includes(searchName)) return 30; // 单向包含但长度差距大
  if (searchName.includes(vodName)) return 25;
  return 0;
}

// === 从API结果列表中选择最佳匹配 ===
function bestMatch(list, name) {
  if (!list || !list.length) return null;
  let best = null, bestScore = 0;
  for (var i = 0; i < list.length; i++) {
    var v = list[i];
    if (!v.vod_play_url) continue;
    var score = nameMatchScore(v.vod_name, name);
    if (score > bestScore) { bestScore = score; best = v; }
  }
  return best; // 如果没有任何名称匹配（score=0），返回null而不是随机结果
}

// Mobile: after first tap absorbed by overlay, auto-hide overlay so second tap goes to video
(function(){
  document.addEventListener('touchend', function(e){
    var ov = document.getElementById('adBlockOverlay');
    if(!ov || !ov.contains(e.target)) return;
    // First tap: overlay absorbs it (blocks the ad). Then disable overlay.
    ov.style.pointerEvents = 'none';
    ov.style.zIndex = 0;
    // Re-enable overlay after 8s to catch subsequent ad injections
    setTimeout(function(){
      if(ov && ov.parentNode){

        ov.style.zIndex = 2147483647;
      }
    }, 8000);
  }, true);

// Enhanced ad-click blocker for player area (desktop + mobile)
(function(){
  // Block ad clicks in player area
  document.addEventListener('click', function(e) {
    var pa = document.querySelector('.player-area');
    if (!pa || !pa.contains(e.target)) return;
    if (e.target.closest('.p-back,.p-top,.p-next-btn,.p-open-btn,.p-fs-btn,.p-side,.p-pill,.p-ep,#adBlockOverlay,#uiDetectOverlay')) return;
    if (e.target.tagName === 'A' || (e.target.closest && e.target.closest('a'))) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); return false;
    }
  }, true);

  // Mobile: block touchstart on ad overlays within player
  document.addEventListener('touchstart', function(e) {
    var pa = document.querySelector('.player-area');
    if (!pa || !pa.contains(e.target)) return;
    var t = e.target;
    if (t.id === 'adBlockOverlay' || t.id === 'uiDetectOverlay') return; // let our overlays handle it
    if (t.closest('.p-back,.p-top,.p-next-btn,.p-open-btn,.p-fs-btn,.p-side,.p-pill,.p-ep')) return;
    if (t.tagName === 'IFRAME' || t.tagName === 'VIDEO') return;
    // Block touch on suspicious overlay elements inside player
    if (t.tagName === 'A' || t.tagName === 'DIV' || t.tagName === 'SPAN' || t.tagName === 'IMG') {
      try {
        var st = getComputedStyle(t);
        if ((st.position === 'absolute' || st.position === 'fixed') && parseInt(st.zIndex) >= 1) {
          if (!t.closest('.p-top,.p-side,.p-next-btn,.p-open-btn,.p-fs-btn,.p-back') && t.id !== 'adBlockOverlay') {
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
            t.remove();
            return false;
          }
        }
      } catch(ex){}
    }
  }, {capture:true, passive:false});

  // Periodic cleanup inside player area (reduced frequency)
  setInterval(function(){
    var pa = document.querySelector('.player-area');
    if (!pa) return;
    pa.querySelectorAll('a,[style*="z-index"]').forEach(function(el){
      if (el.tagName === 'IFRAME' || el.tagName === 'VIDEO' || el.id === 'adBlockOverlay' || el.id === 'uiDetectOverlay') return;
      if (el.closest('.p-top,.p-side,.p-next-btn,.p-open-btn,.p-fs-btn,.p-back')) return;
      try {
        var st = getComputedStyle(el);
        if ((st.position === 'absolute' || st.position === 'fixed') && parseInt(st.zIndex) > 1) {
          el.remove();
        }
      } catch(ex){}
    });
  }, 5000);
})();

// 获取当前播放进度（尽一切努力拿到时间），用于切换线路/资源时保留
function getCurrentPlayTime() {
  var t = 0;
  // 1. 直连模式：从video元素读取
  if (_directMode && _hlsVideo) {
    try { if (_hlsVideo.currentTime > 0) t = Math.floor(_hlsVideo.currentTime); } catch(e) {}
  }
  // 2. iframe模式：尝试同源访问
  if (t < 1) {
    try {
      var iframe = document.querySelector('.player-area iframe');
      if (iframe) {
        var iDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (iDoc) {
          var videos = iDoc.querySelectorAll('video');
          videos.forEach(function(v) { if (v.currentTime > 0) t = Math.floor(v.currentTime); });
        }
      }
    } catch(e) {}
  }
  // 3. 从localStorage读取上次保存的进度（每5秒自动保存一次）
  if (t < 5) {
    var titleEl = document.querySelector('.p-title');
    if (titleEl) {
      var memEntry = getPlaybackMemFor(titleEl.textContent);
      if (memEntry && memEntry.time > t) t = memEntry.time;
    }
  }
  return t;
}
