<body>
<canvas id="starsCanvas"></canvas>
<canvas id="particleCanvas"></canvas>

<!-- MAIN MENU -->
<div class="screen active" id="mainMenu">
  <div class="menu-moon"></div>
  <div class="menu-title">减法大乱斗</div>
  <div class="menu-subtitle">有理数减法 PK 对战</div>
  <div class="menu-btns">
    <button class="menu-btn primary" onclick="handleStart()">🚀 开始</button>
    <button class="menu-btn secondary" onclick="showModal('questionModal')">📝 导入题目</button>
    <button class="menu-btn secondary" onclick="showModal('nameModal')">👥 导入名单</button>
    <button class="menu-btn secondary" onclick="showModal('ruleModal')">📐 导入法则</button>
  </div>
  <div class="menu-info">
    当前题目：<span id="infoQuestions">10</span> 道 |
    名单人数：<span id="infoNames">0</span> 人 |
    已完成：<span id="infoRound">0</span> 轮<br>
    当前法则：<span id="infoRule">a-b=a+(-b)</span>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="questionModal"><div class="modal-box">
  <button class="modal-close" onclick="hideModal('questionModal')">&times;</button>
  <h2>📝 导入题目</h2>
  <div class="modal-label">输入题目（每行一题）</div>
  <textarea class="modal-textarea" id="questionInput" placeholder="(-3)-(-5)=&#10;0-(-4)=&#10;(-6)-2="></textarea>
  <div class="modal-hint">每行一题，无需答案。<br>当前默认10道有理数减法题。</div>
  <div class="modal-actions">
    <button class="modal-btn cancel" onclick="resetQuestions()">恢复默认</button>
    <button class="modal-btn confirm" onclick="importQuestions()">确认导入</button>
  </div>
</div></div>

<div class="modal-overlay" id="nameModal"><div class="modal-box">
  <button class="modal-close" onclick="hideModal('nameModal')">&times;</button>
  <h2>👥 导入名单</h2>

<script>
/* ========== STATE ========== */
const STATE = {
  names: [], usedNames: [], questions: [], rule: 'a-b=a+(-b)',
  playerLeft: '', playerRight: '',
  scores: { left: 0, right: 0 }, round: 0,
  timers: { left: 0, right: 0 },
  timerIntervals: { left: null, right: null },
  submitted: { left: false, right: false },
  judged: { left: false, right: false },
  results: { left: null, right: null },
  // Each side tracks its own question index
  qIdxLeft: 0, qIdxRight: 0,
  shuffledQuestions: [],
  canvasData: {},
  monsterWins: false
};
window.STATE = STATE;

const DEFAULT_QUESTIONS = [
  { q: '(-3)-(-5)=', ans: '2' },
  { q: '0-(-4)=', ans: '4' },
  { q: '(-6)-2=', ans: '-8' },
  { q: '7-12=', ans: '-5' },
  { q: '(-7)-(-3)=', ans: '-4' },
  { q: '9-4=', ans: '5' },
  { q: '(-2)-6=', ans: '-8' },
  { q: '0-(-9)=', ans: '9' },
  { q: '(-5)-3=', ans: '-8' },
  { q: '4-(-6)=', ans: '10' }
];

const DEFAULT_NAMES = [
  '曹心怡','常艺萱','陈宇正','陈馨瑶','崔皓睿','丁子轩','董柯涵','樊哲熙',
  '冯照钦','高浩轩','郭一言','何珏','惠敬涵','靳稼和','李辰希','李嘉树',
  '李开轩','李若涵','李奕萱','刘朔','刘一诺','刘雨菲','刘怡然','刘宸睿',
  '齐韶甯','申晴','史墨轩','司晨铄','宋紫彤','孙杨','王明杰','王文硕',
  '王希妍','王梓慕','吴俊铭','席雨晴','徐金逸','徐与航','许雯菲','薛宗阳',
  '杨思涵','杨依果','杨子墨','杨昊烁','余欣芮','袁宇乾','张嘉聪','张家乐',
  '张培栋','张诗妍','张煜瑶','赵文硕','仲浩珏','边嘉淇'
];

/* ========== INIT ========== */
function init() {
  STATE.names = [...DEFAULT_NAMES];
  STATE.questions = [...DEFAULT_QUESTIONS];
  updateMenuInfo();
  initStars();
  initParticles();
}
function updateMenuInfo() {
  document.getElementById('infoQuestions').textContent = STATE.questions.length;
  document.getElementById('infoNames').textContent = STATE.names.length;
  document.getElementById('infoRule').textContent = STATE.rule;
  document.getElementById('infoRound').textContent = STATE.round;
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showModal(id) { document.getElementById(id).classList.add('show'); }
function hideModal(id) { document.getElementById(id).classList.remove('show'); }

/* ========== IMPORTS ========== */
function importQuestions() {
  const text = document.getElementById('questionInput').value.trim();
  if (!text) return alert('请输入题目');
  const lines = text.split('\n').filter(l => l.trim());
  const qs = [];
  lines.forEach(line => {
    qs.push({ q: line.trim(), ans: '' });
  });
  if (qs.length === 0) return alert('未检测到有效题目');
  STATE.questions = qs;
  updateMenuInfo(); hideModal('questionModal');
}
function resetQuestions() { STATE.questions = [...DEFAULT_QUESTIONS]; updateMenuInfo(); hideModal('questionModal'); }
function importNames() {
  const text = document.getElementById('nameInput').value.trim();
  if (!text) return alert('请输入姓名');
  const names = text.split(/[\n,，\s]+/).map(n => n.trim()).filter(n => n.length > 0);
  if (names.length === 0) return alert('未检测到有效姓名');
  STATE.names = names; STATE.usedNames = []; updateMenuInfo(); hideModal('nameModal');
}
function loadFileNames() { document.getElementById('nameFileInput').click(); }
function handleNameFile(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { document.getElementById('nameInput').value = e.target.result; };
  reader.readAsText(file, 'UTF-8'); event.target.value = '';
}
function importRule() {
  const text = document.getElementById('ruleInput').value.trim();
  if (!text) return alert('请输入法则');
  STATE.rule = text; updateMenuInfo(); hideModal('ruleModal');
}
function resetRule() { STATE.rule = 'a-b=a+(-b)'; document.getElementById('ruleInput').value = STATE.rule; updateMenuInfo(); hideModal('ruleModal'); }

/* ========== START GAME ========== */
function handleStart() {
  if (STATE.names.length < 2) return alert('至少需要2名学生，请先导入名单');
  const available = STATE.names.filter(n => !STATE.usedNames.includes(n));
  if (available.length < 2) {
    if (confirm('可用学生不足2人，是否重置已抽取记录？')) {
      STATE.usedNames = []; STATE.scores = { left: 0, right: 0 }; STATE.round = 0;
    }
    return;
  }
  // Shuffle questions for this round so each side gets them in different order
  STATE.shuffledQuestions = shuffleArray([...STATE.questions]);
  STATE.qIdxLeft = 0;
  STATE.qIdxRight = Math.min(1, STATE.shuffledQuestions.length - 1); // start at different offset
  showScreen('preGame');
  renderPreGame();
}
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ========== PRE-GAME: NAME PICKING ========== */
let rollingInterval = null;
window.isRolling = false;
window.pickRotationSpeed = 0.001;

/* ========== 3D NAME SPHERE (Three.js) ========== */
let pickRotationSpeed = 0.001;
let pickSphereInitialized = false;

function initPickSphere() {
  // Call the module function that has access to THREE
  if (window.initPickSphereModule) {
    window.initPickSphereModule();
  } else {
    // Module not loaded yet, retry after a delay
    setTimeout(initPickSphere, 100);
  }
}

/* ========== VOICE ANNOUNCEMENT ========== */
function speakNames(name1, name2) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  
  const text = `有请${name1}和${name2}同学`;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';
  utterance.pitch = 1.1;
  utterance.rate = 1.0;
  utterance.volume = 1.0;
  
  window.speechSynthesis.speak(utterance);
}

/* ========== ROLLING SOUND ========== */
let rollingSoundInterval = null;
let rollingAudioCtx = null;

function startRollingSound() {
  try {
    rollingAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let tickCount = 0;
    
    rollingSoundInterval = setInterval(() => {
      if (!rollingAudioCtx) return;
      const now = rollingAudioCtx.currentTime;
      
      // Create tick sound
      const osc = rollingAudioCtx.createOscillator();
      const gain = rollingAudioCtx.createGain();
      
      osc.type = 'square';
      osc.frequency.value = 800 + (tickCount % 3) * 200; // Vary pitch slightly
      
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      
      osc.connect(gain);
      gain.connect(rollingAudioCtx.destination);
      
      osc.start(now);
      osc.stop(now + 0.05);
      
      tickCount++;
    }, 80);
  } catch(e) {
    console.log('Rolling sound not supported');
  }
}

function stopRollingSound() {
  if (rollingSoundInterval) {
    clearInterval(rollingSoundInterval);
    rollingSoundInterval = null;
  }
  if (rollingAudioCtx) {
    rollingAudioCtx.close();
    rollingAudioCtx = null;
  }
}

function renderPreGame() {
  const pickNames = document.getElementById('pickNames');
  const pickTitle = document.getElementById('pickTitle');
  const startBtn = document.getElementById('pickStartBtn');
  const stopBtn = document.getElementById('pickStopBtn');
  pickTitle.textContent = `第 ${STATE.round + 1} 轮 - 点击抽取选手`;
  pickNames.innerHTML = `
    <div class="pick-card left"><div class="pick-name" id="pickNameLeft">?</div></div>
    <div class="pick-vs">VS</div>
    <div class="pick-card right"><div class="pick-name" id="pickNameRight">?</div></div>
  `;
  startBtn.style.display = '';
  stopBtn.classList.remove('show');
  startBtn.textContent = '🎲 开始抽取';
  startBtn.onclick = startPick;
  window.isRolling = false;
  
  // Initialize 3D name sphere
  setTimeout(() => initPickSphere(), 100);
}

function startPick() {
  if (window.isRolling) return;
  window.isRolling = true;
  const available = STATE.names.filter(n => !STATE.usedNames.includes(n));
  if (available.length < 2) return alert('可用学生不足');
  const startBtn = document.getElementById('pickStartBtn');
  const stopBtn = document.getElementById('pickStopBtn');
  startBtn.style.display = 'none';
  stopBtn.classList.add('show');
  const nameLeft = document.getElementById('pickNameLeft');
  const nameRight = document.getElementById('pickNameRight');
  const pickTitle = document.getElementById('pickTitle');
  pickTitle.textContent = '正在抽取... 点击停止';

  // Start rolling sound
  startRollingSound();

  rollingInterval = setInterval(() => {
    const r1 = available[Math.floor(Math.random() * available.length)];
    let r2 = available[Math.floor(Math.random() * available.length)];
    if (r2 === r1) r2 = available[(available.indexOf(r1) + 1) % available.length];
    nameLeft.textContent = r1;
    nameRight.textContent = r2;
  }, 80);
}

function stopPick() {
  if (!window.isRolling) return;
  clearInterval(rollingInterval);
  window.isRolling = false;
  
  // Stop rolling sound
  stopRollingSound();
  
  const available = STATE.names.filter(n => !STATE.usedNames.includes(n));
  const idx1 = Math.floor(Math.random() * available.length);
  let idx2 = Math.floor(Math.random() * (available.length - 1));
  if (idx2 >= idx1) idx2++;
  STATE.playerLeft = available[idx1];
  STATE.playerRight = available[idx2];
  const nameLeft = document.getElementById('pickNameLeft');
  const nameRight = document.getElementById('pickNameRight');
  nameLeft.textContent = STATE.playerLeft;
  nameRight.textContent = STATE.playerRight;
  const pickTitle = document.getElementById('pickTitle');
  pickTitle.textContent = `${STATE.playerLeft} VS ${STATE.playerRight}`;
  const startBtn = document.getElementById('pickStartBtn');
  const stopBtn = document.getElementById('pickStopBtn');
  stopBtn.classList.remove('show');
  startBtn.textContent = '⚔️ 开始答题';
  startBtn.style.display = '';
  
  // Voice announcement
  speakNames(STATE.playerLeft, STATE.playerRight);
  
  startBtn.onclick = goToGame;
}

/* ========== GO TO GAME ========== */
function goToGame() {
  STATE.submitted = { left: false, right: false };
  STATE.judged = { left: false, right: false };
  STATE.results = { left: null, right: null };
  STATE.timers = { left: 0, right: 0 };
  STATE.canvasData = {};
  document.getElementById('gamePlayerLeft').textContent = '🐰 ' + STATE.playerLeft;
  document.getElementById('gamePlayerRight').textContent = '🐰 ' + STATE.playerRight;
  document.getElementById('gameRoundInfo').textContent = `第${STATE.round + 1}轮`;
  document.getElementById('gameRuleInfo').textContent = `法则：${STATE.rule}`;
  showScreen('gameScreen');
  ['judgeBtnsLeft','judgeBtnsRight'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  requestAnimationFrame(() => {
    initCanvases();
    showCountdown(() => { startTimers(); });
  });
}

/* ========== COUNTDOWN ========== */
function showCountdown(callback) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);';
  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:120px;font-weight:900;color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.6);transition:all .3s;';
  overlay.appendChild(numEl);
  document.getElementById('gameScreen').appendChild(overlay);
  let count = 3;
  numEl.textContent = count;
  numEl.style.transform = 'scale(1.5)';
  setTimeout(() => { numEl.style.transform = 'scale(1)'; }, 50);
  const interval = setInterval(() => {
    count--;
    if (count > 0) {
      numEl.textContent = count;
      numEl.style.transform = 'scale(1.5)';
      setTimeout(() => { numEl.style.transform = 'scale(1)'; }, 50);
    } else if (count === 0) {
      numEl.textContent = '开始！';
      numEl.style.fontSize = '80px';
      numEl.style.transform = 'scale(1.3)';
      setTimeout(() => { numEl.style.transform = 'scale(1)'; }, 50);
    } else {
      clearInterval(interval);
      overlay.style.transition = 'opacity .3s';
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.remove(); callback(); }, 300);
    }
  }, 800);
}

/* ========== TIMERS ========== */
function startTimers() {
  const startL = performance.now(), startR = performance.now();
  STATE.timerIntervals.left = setInterval(() => {
    STATE.timers.left = (performance.now() - startL) / 1000;
    document.getElementById('gameTimerLeft').textContent = STATE.timers.left.toFixed(1) + 's';
  }, 100);
  STATE.timerIntervals.right = setInterval(() => {
    STATE.timers.right = (performance.now() - startR) / 1000;
    document.getElementById('gameTimerRight').textContent = STATE.timers.right.toFixed(1) + 's';
  }, 100);
}
function stopTimers() { clearInterval(STATE.timerIntervals.left); clearInterval(STATE.timerIntervals.right); }

/* ========== HANDWRITING CANVAS (independent per side) ========== */
const hwState = {
  left: { ctx: null, canvas: null, drawing: false, tool: 'pen', color: '#ffd700', size: 4, paths: [], currentPath: null },
  right: { ctx: null, canvas: null, drawing: false, tool: 'pen', color: '#ffd700', size: 4, paths: [], currentPath: null }
};

function initCanvases() {
  ['left', 'right'].forEach(side => {
    const canvasId = side === 'left' ? 'canvasLeft' : 'canvasRight';
    const wrapId = side === 'left' ? 'canvasWrapLeft' : 'canvasWrapRight';
    const qId = side === 'left' ? 'canvasQLeft' : 'canvasQRight';
    const canvas = document.getElementById(canvasId);
    const wrap = document.getElementById(wrapId);
    const qOverlay = document.getElementById(qId);

    // Set question text on overlay (not on canvas - can't be erased)
    const qIdx = side === 'left' ? STATE.qIdxLeft : STATE.qIdxRight;
    const q = STATE.shuffledQuestions[qIdx];
    qOverlay.textContent = q ? q.q : '';

    // Size canvas to fill wrap
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    const ctx = canvas.getContext('2d');
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    hwState[side].ctx = ctx;
    hwState[side].canvas = canvas;
    hwState[side].paths = [];
    hwState[side].currentPath = null;
    hwState[side].drawing = false;
    hwState[side].tool = 'pen';
    canvas.classList.remove('eraser-cursor');

    // Fill background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Clone to remove old listeners
    const newCanvas = canvas.cloneNode(true);
    canvas.parentNode.replaceChild(newCanvas, canvas);
    const newCtx = newCanvas.getContext('2d');
    newCtx.lineCap = 'round'; newCtx.lineJoin = 'round';
    hwState[side].ctx = newCtx;
    hwState[side].canvas = newCanvas;
    newCtx.fillStyle = '#1a1a2e';
    newCtx.fillRect(0, 0, newCanvas.width, newCanvas.height);

    // Independent event listeners per side
    newCanvas.addEventListener('mousedown', (e) => hwStart(e, side));
    newCanvas.addEventListener('mousemove', (e) => hwMove(e, side));
    newCanvas.addEventListener('mouseup', () => hwEnd(side));
    newCanvas.addEventListener('mouseleave', () => hwEnd(side));
    newCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); hwStart(e, side); }, { passive: false });
    newCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); hwMove(e, side); }, { passive: false });
    newCanvas.addEventListener('touchend', () => hwEnd(side));
  });
}

function hwGetPos(e, side) {
  const canvas = hwState[side].canvas;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches && e.touches.length > 0) {
    return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
  }
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}
function hwStart(e, side) {
  if (STATE.submitted[side]) return;
  const s = hwState[side];
  s.drawing = true;
  const pos = hwGetPos(e, side);
  s.currentPath = s.tool === 'pen'
    ? { color: s.color, size: s.size, points: [pos] }
    : { eraser: true, size: s.size * 3, points: [pos] };
}
function hwMove(e, side) {
  const s = hwState[side];
  if (!s.drawing || !s.currentPath) return;
  const pos = hwGetPos(e, side);
  s.currentPath.points.push(pos);
  if (s.tool === 'eraser') eraseAt(side, pos.x, pos.y, s.currentPath.size);
  else drawSegment(side, s.currentPath);
}
function hwEnd(side) {
  const s = hwState[side];
  if (!s.drawing) return;
  s.drawing = false;
  if (s.currentPath && s.currentPath.points.length > 0) s.paths.push(s.currentPath);
  s.currentPath = null;
}
function drawSegment(side, path) {
  const ctx = hwState[side].ctx;
  if (!ctx || path.points.length < 2) return;
  const pts = path.points;
  ctx.save();
  ctx.strokeStyle = path.color; ctx.lineWidth = path.size;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[pts.length-2].x, pts[pts.length-2].y);
  ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y); ctx.stroke(); ctx.restore();
}
function eraseAt(side, x, y, radius) {
  const ctx = hwState[side].ctx;
  if (!ctx) return;
  ctx.save();
  // Erase to background color instead of transparent (so question overlay is unaffected)
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ========== SUBMIT & JUDGE ========== */
function submitAnswer(side) {
  if (STATE.submitted[side]) return;
  STATE.submitted[side] = true;
  clearInterval(STATE.timerIntervals[side]);
  // Save canvas data immediately when submitting
  STATE.canvasData[side] = hwState[side].canvas.toDataURL();
  // Show inline judge buttons
  document.getElementById(side === 'left' ? 'judgeBtnsLeft' : 'judgeBtnsRight').style.display = 'flex';
}
function judgeAnswer(side, isCorrect) {
  if (STATE.judged[side]) return;
  STATE.judged[side] = true;
  STATE.results[side] = isCorrect;

  document.getElementById(side === 'left' ? 'judgeBtnsLeft' : 'judgeBtnsRight').style.display = 'none';

  if (STATE.judged.left && STATE.judged.right) { stopTimers(); setTimeout(() => goToAttack(), 800); }
}

/* ========== ATTACK ========== */
function goToAttack() {
  const leftWin = STATE.results.left && !STATE.results.right;
  const rightWin = STATE.results.right && !STATE.results.left;
  let winner;
  if (leftWin) winner = 'left';
  else if (rightWin) winner = 'right';
  else if (STATE.results.left && STATE.results.right) winner = STATE.timers.left <= STATE.timers.right ? 'left' : 'right';
  else {
    // Both wrong - monster wins!
    showScreen('attackScreen');
    playMonsterWinsAnimation();
    return;
  }
  const winnerName = winner === 'left' ? STATE.playerLeft : STATE.playerRight;
  showScreen('attackScreen');
  playAttackAnimation(winner, winnerName);
}

  // --- MOONCAKE ---

  const totalFrames = 600;
  
  // Reset projectiles for this attack
  window.attackProjectiles = [];
  window._resultCardsShown = false;

  // Time-based animation for consistent speed on all refresh rates (60Hz-240Hz+)
  let _lastTime = 0;
  let _projTimer = 0;

  function animate(now) {
    if (!_lastTime) _lastTime = now;
    const dt = Math.min(now - _lastTime, 50);
    _lastTime = now;
    const dtFactor = dt / 16.667;
    frame += dtFactor;
    ctx.clearRect(0, 0, W, H);
    // BG
    const bg = ctx.createRadialGradient(W/2, H*0.15, 30, W/2, H*0.15, W*0.8);
    bg.addColorStop(0, '#1a2a5e'); bg.addColorStop(0.5, '#0d1533'); bg.addColorStop(1, '#060a1a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // Stars
    for (let i = 0; i < 100; i++) {
      const sx = (i*137.5+frame*0.05)%W, sy = (i*97.3)%H;
      ctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(frame*0.03+i)*0.2})`;
      ctx.beginPath(); ctx.arc(sx, sy, 1+Math.sin(frame*0.05+i)*0.5, 0, Math.PI*2); ctx.fill();
    }
    // Moon
    ctx.save();
    const mGrad = ctx.createRadialGradient(W*0.85, H*0.1, 8, W*0.85, H*0.1, 50);
    mGrad.addColorStop(0, '#ffffff'); mGrad.addColorStop(0.7, '#f0f0f0'); mGrad.addColorStop(1, '#d0d0d0');
    ctx.fillStyle = mGrad;
    ctx.beginPath(); ctx.arc(W*0.85, H*0.1, 45, 0, Math.PI*2); ctx.fill(); ctx.restore();

    if (frame < 50) {
      // Phase 0: Hero AND loser AND monster appear simultaneously
      heroScale = Math.min(2, frame / 12 * 2);
      monsterScale = Math.min(2, frame / 12 * 2);
      drawHero(heroX, heroY, heroScale);
      drawLoserHero(loserX, loserY, heroScale);
      // Draw monster at center
      const monsterDrawX = monsterX + Math.sin(frame) * 3;
      if (monsterType === 0) drawMonsterType0(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 1) drawMonsterType1(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 2) drawMonsterType2(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 3) drawMonsterType3(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 4) drawMonsterType4(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      drawMonsterName(monsterDrawX, monsterY, monsterScale);
      showText = '';
      textAlpha = 0;
    } else if (frame < 200) {
      // Phase 1: Attack effect
      heroScale = 2; drawHero(heroX, heroY, heroScale);
      drawLoserHero(loserX, loserY, 2);
      const ap = (frame-50)/150;
      
      // Initialize projectile array if not exists
      if (!window.attackProjectiles) window.attackProjectiles = [];
      
      if (ap < 0.3) {
        // Charge up - varies by attack type
        const cp = ap/0.3;
        ctx.save();
        const chargeColors = [
          ['rgba(255,215,0,','rgba(255,140,0,'], // Type 0: Gold
          ['rgba(125,211,252,','rgba(14,165,233,'], // Type 1: Ice blue
          ['rgba(251,191,36,','rgba(220,38,38,'], // Type 2: Fire
          ['rgba(250,204,21,','rgba(124,58,237,'], // Type 3: Electric
          ['rgba(245,158,11,','rgba(146,64,14,'] // Type 4: Math gold
        ];
        const colors = chargeColors[monsterType];
        for (let i = 0; i < 12; i++) {
          const a = (i/12)*Math.PI*2 + frame*0.15;
          const r = 110 + cp*50;
          ctx.fillStyle = `${colors[i%2]}${cp*0.6})`;
          ctx.beginPath(); ctx.arc(heroX+Math.cos(a)*r, heroY+Math.sin(a)*r, 6+cp*4, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
      } else if (ap < 0.8) {
        // Attack phase - launch projectiles
        const attackPhase = (ap - 0.3) / 0.5;
        const startX = heroX+(heroX<W/2?90:-90);
        
        // Launch new projectiles periodically (time-based)
        _projTimer += dt;
        if (_projTimer >= 250) {
          _projTimer -= 250;
          const projSpeed = 8;
          const angle = Math.atan2(monsterY - heroY, monsterX - startX);
          
          if (monsterType === 0) {
            // Type 0: Golden energy balls
            window.attackProjectiles.push({
              x: startX, y: heroY,
              vx: Math.cos(angle) * projSpeed,
              vy: Math.sin(angle) * projSpeed,
              type: 'gold', life: 1, size: 15
            });
          } else if (monsterType === 1) {
            // Type 1: Ice shards (triangular)
            window.attackProjectiles.push({
              x: startX, y: heroY,
              vx: Math.cos(angle) * projSpeed * 1.2,
              vy: Math.sin(angle) * projSpeed * 1.2,
              type: 'ice', life: 1, size: 20, rot: 0
            });
          } else if (monsterType === 2) {
            // Type 2: Fireballs
            window.attackProjectiles.push({
              x: startX, y: heroY,
              vx: Math.cos(angle) * projSpeed * 0.8,
              vy: Math.sin(angle) * projSpeed * 0.8,
              type: 'fire', life: 1, size: 25
            });
          } else if (monsterType === 3) {
            // Type 3: Lightning bolts (instant hit effect)
            // Draw instant lightning
            ctx.save();
            ctx.strokeStyle = 'rgba(250,204,21,0.8)'; ctx.lineWidth = 12+Math.random()*8;
            ctx.shadowBlur = 50; ctx.shadowColor = '#facc15';
            ctx.beginPath(); ctx.moveTo(startX, heroY);
            const segments = 10;
            for (let i = 1; i <= segments; i++) {
              const t = i / segments;
              const px = startX + (monsterX - startX) * t + (Math.random() - 0.5) * 40;
              const py = heroY + (monsterY - heroY) * t + (Math.random() - 0.5) * 40;
              ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.strokeStyle = '#fef9c3'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(startX, heroY);
            for (let i = 1; i <= segments; i++) {
              const t = i / segments;
              const px = startX + (monsterX - startX) * t + (Math.random() - 0.5) * 25;
              const py = heroY + (monsterY - heroY) * t + (Math.random() - 0.5) * 25;
              ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
            // Impact sparks
            for (let i = 0; i < 8; i++) {
              particles.push({ x: monsterX+(Math.random()-0.5)*30, y: monsterY+(Math.random()-0.5)*30,
                vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1,
                color: ['#facc15','#fbbf24','#fff'][Math.floor(Math.random()*3)] });
            }
          } else if (monsterType === 4) {
            // Type 4: Math symbols
            const symbols = ['+', '-', '×', '÷', '='];
            window.attackProjectiles.push({
              x: startX, y: heroY,
              vx: Math.cos(angle) * projSpeed,
              vy: Math.sin(angle) * projSpeed,
              type: 'math', life: 1, size: 30,
              symbol: symbols[Math.floor(Math.random()*symbols.length)],
              rot: 0
            });
          }
        }
      }
      
      // Update and draw projectiles
      window.attackProjectiles = window.attackProjectiles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        
        // Check if hit monster
        const dist = Math.sqrt((p.x - monsterX)**2 + (p.y - monsterY)**2);
        if (dist < 60) {
          // Impact effect
          if (p.type === 'gold') {
            for (let i = 0; i < 5; i++) {
              particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                life: 1, color: ['#ffd700','#ff8c00','#fff'][Math.floor(Math.random()*3)] });
            }
          } else if (p.type === 'ice') {
            for (let i = 0; i < 6; i++) {
              particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                life: 1, color: ['#7dd3fc','#bae6fd','#fff'][Math.floor(Math.random()*3)] });
            }
          } else if (p.type === 'fire') {
            for (let i = 0; i < 8; i++) {
              particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12-3,
                life: 1, color: ['#fbbf24','#f97316','#dc2626'][Math.floor(Math.random()*3)] });
            }
          } else if (p.type === 'math') {
            for (let i = 0; i < 4; i++) {
              particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
                life: 1, color: ['#f59e0b','#fbbf24','#fff'][Math.floor(Math.random()*3)],
                symbol: p.symbol });
            }
          }
          return false; // Remove projectile
        }
        
        // Draw projectile
        ctx.save();
        ctx.globalAlpha = p.life;
        
        if (p.type === 'gold') {
          // Golden energy ball
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
          grad.addColorStop(0, '#fff');
          grad.addColorStop(0.3, '#ffd700');
          grad.addColorStop(1, 'rgba(255,140,0,0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
          ctx.shadowBlur = 20; ctx.shadowColor = '#ffd700';
        } else if (p.type === 'ice') {
          // Ice shard (triangle)
          p.rot += 0.2;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = '#bae6fd';
          ctx.shadowBlur = 15; ctx.shadowColor = '#7dd3fc';
          ctx.beginPath();
          ctx.moveTo(0, -p.size);
          ctx.lineTo(-p.size*0.6, p.size*0.5);
          ctx.lineTo(p.size*0.6, p.size*0.5);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
          ctx.stroke();
        } else if (p.type === 'fire') {

          ctx.shadowBlur = 30; ctx.shadowColor = '#f97316';
          // Fire trail
          for (let i = 0; i < 2; i++) {

          }
        } else if (p.type === 'math') {
          // Math symbol

          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.font = `bold ${p.size}px monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        ctx.restore();
        return p.life > 0;
      });
      
      if (ap > 0.6) monsterScale = 2 + Math.sin(frame*0.8)*0.24;
      // Draw monster based on type
      const monsterDrawX = monsterX + Math.sin(frame) * 3;
      if (monsterType === 0) drawMonsterType0(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 1) drawMonsterType1(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 2) drawMonsterType2(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 3) drawMonsterType3(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      else if (monsterType === 4) drawMonsterType4(monsterDrawX, monsterY, monsterScale, monsterAlpha);
      drawMonsterName(monsterDrawX, monsterY, monsterScale);
    } else if (frame < 280) {
      // Phase 2: Monster defeated - flash effect then lie down

      drawLoserHero(loserX, loserY, 2);
      const ep = (frame-200)/80;
      const cornerX = winnerSide === 'right' ? W * 0.15 : W * 0.85;
      const cornerY = H * 0.82;
      // Brief white flash at impact
      if (ep < 0.15) {

      }
      // Monster slides to corner and lies down
      const slideP = Math.min(1, ep / 0.5);

      const mCurX = monsterX + (cornerX - monsterX) * slideEase;
      const mCurY = monsterY + (cornerY - monsterY) * slideEase;
      const mCurScale = 2 - 1.3 * slideEase; // 2 -> 0.7
      const mCurAngle = (winnerSide === 'right' ? Math.PI / 2 : -Math.PI / 2) * slideEase;
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.translate(mCurX, mCurY);
      ctx.rotate(mCurAngle);
      ctx.scale(mCurScale, mCurScale);
      if (monsterType === 0) drawMonsterType0(0, 0, 1, 0.7);
      else if (monsterType === 1) drawMonsterType1(0, 0, 1, 0.7);
      else if (monsterType === 2) drawMonsterType2(0, 0, 1, 0.7);
      else if (monsterType === 3) drawMonsterType3(0, 0, 1, 0.7);
      else if (monsterType === 4) drawMonsterType4(0, 0, 1, 0.7);
      ctx.restore();
      // Dizzy stars for lying monster
      if (slideP > 0.5) {

      }
      // Name follows monster

        ctx.beginPath();
        const rx = mCurX - nm.width/2 - pw, ry = mCurY - 55;
        const rw = nm.width + pw*2, rh = 28, cr = 6;
        ctx.moveTo(rx+cr, ry); ctx.lineTo(rx+rw-cr, ry);
        ctx.quadraticCurveTo(rx+rw, ry, rx+rw, ry+cr);
        ctx.lineTo(rx+rw, ry+rh-cr);
        ctx.quadraticCurveTo(rx+rw, ry+rh, rx+rw-cr, ry+rh);
        ctx.lineTo(rx+cr, ry+rh);
        ctx.quadraticCurveTo(rx, ry+rh, rx, ry+rh-cr);
        ctx.lineTo(rx, ry+cr);
        ctx.quadraticCurveTo(rx, ry, rx+cr, ry);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.fillText(n, mCurX, mCurY - 42);

      }
    } else if (frame < 400) {
      // Phase 3: Chang'e flies in FAST, result cards appear immediately

      drawLoserHero(loserX, loserY, 2);
      // Draw lying defeated monster in the corner

      const cornerY = H * 0.82;
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.translate(cornerX, cornerY);
      const lieAngle = winnerSide === 'right' ? Math.PI / 2 : -Math.PI / 2;

      ctx.scale(0.7, 0.7);

      else if (monsterType === 1) drawMonsterType1(0, 0, 1, 0.7);

      else if (monsterType === 3) drawMonsterType3(0, 0, 1, 0.7);
      else if (monsterType === 4) drawMonsterType4(0, 0, 1, 0.7);
      ctx.restore();
      // Draw name for lying defeated monster

      const lyingName = MONSTER_NAMES[monsterType];
      const lnm = ctx.measureText(lyingName);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      const lnpw = 10, lnph = 4;
      ctx.beginPath();
      const lrx = cornerX - lnm.width/2 - lnpw, lry = cornerY - 55;
      const lrw = lnm.width + lnpw*2, lrh = 24 + lnph*2, lcr = 6;
      ctx.moveTo(lrx+lcr, lry); ctx.lineTo(lrx+lrw-lcr, lry);
      ctx.quadraticCurveTo(lrx+lrw, lry, lrx+lrw, lry+lcr);
      ctx.lineTo(lrx+lrw, lry+lrh-lcr);
      ctx.quadraticCurveTo(lrx+lrw, lry+lrh, lrx+lrw-lcr, lry+lrh);
      ctx.lineTo(lrx+lcr, lry+lrh);
      ctx.quadraticCurveTo(lrx, lry+lrh, lrx, lry+lrh-lcr);
      ctx.lineTo(lrx, lry+lcr);
      ctx.quadraticCurveTo(lrx, lry, lrx+lcr, lry);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd700';
      ctx.fillText(lyingName, cornerX, cornerY - 42);
      ctx.restore();
      // Dizzy stars for lying monster
      drawDizzyStars(cornerX, cornerY - 20, 0.7);
      // Chang'e flies in FAST
      const cp = (frame-280)/80;
      const ease = 1 - Math.pow(1-Math.min(1,cp), 3);
      changeY = H+100 - (H*0.42+100)*ease;
      if (cp < 1 && particles.length < 150) {
        const spawnCount = Math.min(2, Math.round(2 * dtFactor));
        for (let i = 0; i < spawnCount; i++) particles.push({ x: W*0.5+(Math.random()-0.5)*30, y: changeY+60+Math.random()*20,
          vx: (Math.random()-0.5)*2, vy: Math.random()*2+1, life: 0.8, color: ['#e0c0ff','#fff','#ffd700'][Math.floor(Math.random()*3)] });
      }
      drawChange(W*0.5, changeY, 2);
    } else {
      // Phase 4: Mooncake flies from Chang'e's hands to hero
      heroScale = 2; drawHero(heroX, heroY, heroScale);
      drawLoserHero(loserX, loserY, 2);
      drawChange(W*0.5, H*0.38, 2);
      // Draw lying defeated monster in the corner
      const cornerX = winnerSide === 'right' ? W * 0.15 : W * 0.85;
      const cornerY = H * 0.82;
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.translate(cornerX, cornerY);
      const lieAngle = winnerSide === 'right' ? Math.PI / 2 : -Math.PI / 2;
      ctx.rotate(lieAngle);
      ctx.scale(0.7, 0.7);
      if (monsterType === 0) drawMonsterType0(0, 0, 1, 0.7);
      else if (monsterType === 1) drawMonsterType1(0, 0, 1, 0.7);
      else if (monsterType === 2) drawMonsterType2(0, 0, 1, 0.7);
      else if (monsterType === 3) drawMonsterType3(0, 0, 1, 0.7);
      else if (monsterType === 4) drawMonsterType4(0, 0, 1, 0.7);
      ctx.restore();
      // Dizzy stars for lying monster
      drawDizzyStars(cornerX, cornerY - 20, 0.7);
      // Draw name for lying defeated monster

      const lrx2 = cornerX - lnm2.width/2 - lnpw2, lry2 = cornerY - 55;
      const lrw2 = lnm2.width + lnpw2*2, lrh2 = 24 + lnph2*2, lcr2 = 6;
      ctx.moveTo(lrx2+lcr2, lry2); ctx.lineTo(lrx2+lrw2-lcr2, lry2);
      ctx.quadraticCurveTo(lrx2+lrw2, lry2, lrx2+lrw2, lry2+lcr2);
      ctx.lineTo(lrx2+lrw2, lry2+lrh2-lcr2);
      ctx.quadraticCurveTo(lrx2+lrw2, lry2+lrh2, lrx2+lrw2-lcr2, lry2+lrh2);
      ctx.lineTo(lrx2+lcr2, lry2+lrh2);
      ctx.quadraticCurveTo(lrx2, lry2+lrh2, lrx2, lry2+lrh2-lcr2);
      ctx.lineTo(lrx2, lry2+lcr2);
      ctx.quadraticCurveTo(lrx2, lry2, lrx2+lcr2, lry2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#ffd700'; ctx.shadowBlur = 8; ctx.shadowColor = '#ffd700';
      ctx.fillText(lyingName2, cornerX, cornerY - 42);
      ctx.restore();
      // Loser's text bubble "下次我一定行！" appears when Chang'e delivers mooncake
      const bubbleAlpha = Math.min(1, (frame-400)/30);
      if (bubbleAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = bubbleAlpha;
        // Draw speech bubble
        const bubbleX = loserX;
        const bubbleY = loserY - 120;
        const bubbleW = 180;
        const bubbleH = 50;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.moveTo(bubbleX - bubbleW/2 + 10, bubbleY - bubbleH/2);
        ctx.lineTo(bubbleX + bubbleW/2 - 10, bubbleY - bubbleH/2);
        ctx.quadraticCurveTo(bubbleX + bubbleW/2, bubbleY - bubbleH/2, bubbleX + bubbleW/2, bubbleY - bubbleH/2 + 10);
        ctx.lineTo(bubbleX + bubbleW/2, bubbleY + bubbleH/2 - 10);
        ctx.quadraticCurveTo(bubbleX + bubbleW/2, bubbleY + bubbleH/2, bubbleX + bubbleW/2 - 10, bubbleY + bubbleH/2);
        // Tail pointing down to loser
        ctx.lineTo(bubbleX + 10, bubbleY + bubbleH/2);
        ctx.lineTo(bubbleX, bubbleY + bubbleH/2 + 15);
        ctx.lineTo(bubbleX - 10, bubbleY + bubbleH/2);
        ctx.lineTo(bubbleX - bubbleW/2 + 10, bubbleY + bubbleH/2);
        ctx.quadraticCurveTo(bubbleX - bubbleW/2, bubbleY + bubbleH/2, bubbleX - bubbleW/2, bubbleY + bubbleH/2 - 10);
        ctx.lineTo(bubbleX - bubbleW/2, bubbleY - bubbleH/2 + 10);
        ctx.quadraticCurveTo(bubbleX - bubbleW/2, bubbleY - bubbleH/2, bubbleX - bubbleW/2 + 10, bubbleY - bubbleH/2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();
        // Text
        ctx.fillStyle = '#333';
        ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('下次我一定行！', bubbleX, bubbleY);
        ctx.restore();
      }
      const mp = Math.min(1, (frame-400)/70);
      // Mooncake starts at Chang'e's hands (slightly below her center) and flies to hero
      const cakeStartX = W*0.5 + (winnerSide === 'left' ? -30 : 30);
      const cakeStartY = H*0.38 + 20; // Chang'e's hand level
      // Mooncake flies to hero's hand (right hand if hero on left, left hand if hero on right)
      const cakeEndX = winnerSide === 'left' ? heroX + 76 : heroX - 76;
      const cakeEndY = heroY + 20; // Hero's hand level
      const cakeX = cakeStartX + (cakeEndX - cakeStartX) * mp;
      const cakeY = cakeStartY + (cakeEndY - cakeStartY) * mp;
      drawMooncake(cakeX, cakeY, Math.min(0.8, mp*1.6));
      if (particles.length < 150) {
        const spawnCount = Math.min(2, Math.round(2 * dtFactor));
        for (let i = 0; i < spawnCount; i++) {
          const a = Math.random()*Math.PI*2, d = 15+Math.random()*10;
          particles.push({ x: cakeX+Math.cos(a)*d, y: cakeY+Math.sin(a)*d, vx: Math.cos(a)*1.5, vy: -Math.random()*2-0.5,
            life: 0.7, color: ['#ffd700','#ffaa00','#fff'][Math.floor(Math.random()*3)] });
        }
      }
      if (frame > 400) {
        ctx.save(); ctx.globalAlpha = Math.min(1, (frame-400)/20);

        ctx.textAlign = 'center'; ctx.fillStyle = '#ffd700';
        ctx.fillText(`${winnerName} 获胜！`, W/2, H*0.12); ctx.restore();
      }
    }
    // Particles (time-scaled, capped, no shadowBlur for performance)
    if (particles.length > 300) particles.splice(0, particles.length - 300);
    particles = particles.filter(p => {
      p.x += p.vx * dtFactor; p.y += p.vy * dtFactor; p.vy += 0.04 * dtFactor; p.vx *= Math.pow(0.99, dtFactor); p.life -= 0.018 * dtFactor;
      if (p.life > 0) {
        ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        if (p.symbol) {
          ctx.font = `bold ${12 + p.life * 8}px monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(p.symbol, p.x, p.y);
        } else {
          ctx.beginPath(); ctx.arc(p.x, p.y, 3*p.life+1, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
        return true;
      } return false;
    });
    // Text
    if (showText && textAlpha > 0) {
      ctx.save(); ctx.globalAlpha = textAlpha;
      ctx.font = `900 ${Math.min(W/15,44)}px Microsoft YaHei, sans-serif`;
      ctx.textAlign = 'center'; ctx.fillStyle = '#ffd700';
      ctx.fillText(showText, W/2, H*0.9); ctx.restore();
    }
    if (frame < totalFrames) requestAnimationFrame(animate);
    else {
      // Show result cards and buttons at bottom (if not already shown)
      if (!window._resultCardsShown) {
        window._resultCardsShown = true;
        showAttackResultCards();
        document.getElementById('attackBottomArea').style.display = 'flex';
      }
    }
    // Show result cards early when Chang'e appears (Phase 3 starts)
    if (frame >= 280 && frame < 282 && !window._resultCardsShown) {
      window._resultCardsShown = true;
      showAttackResultCards();
      document.getElementById('attackBottomArea').style.display = 'flex';
    }
  }
  requestAnimationFrame(animate);
  playAttackSound();
}

/* ========== MONSTER WINS ANIMATION (both students wrong) ========== */

    ctx.lineTo(rx+rw, ry+rh-cr);
    ctx.quadraticCurveTo(rx+rw, ry+rh, rx+rw-cr, ry+rh);
    ctx.lineTo(rx+cr, ry+rh);
    ctx.quadraticCurveTo(rx, ry+rh, rx, ry+rh-cr);

    ctx.closePath(); ctx.fill();

  }

  const totalFrames = 600;
  window._resultCardsShownMW = false;

  // Draw a chibi student character
  function drawStudent(x, y, sc, color, name, angle) {

    ctx.beginPath(); ctx.arc(0, -26, 18, Math.PI * 0.8, Math.PI * 2.2); ctx.fill();

  // Draw lying student (fallen on side)
  function drawLyingStudent(x, y, sc, color, name, faceDir) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    // Lying on side - rotate 90 degrees
    const rot = faceDir === 'left' ? Math.PI / 2 : -Math.PI / 2;

    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.arc(0, 5, 32, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#ffe4c4';
    ctx.beginPath(); ctx.arc(0, -22, 18, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#2a1a4e';

    ctx.strokeStyle = '#2a1a4e'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, -25); ctx.lineTo(-4, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, -25); ctx.lineTo(-10, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -25); ctx.lineTo(10, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -25); ctx.lineTo(4, -19); ctx.stroke();
    // Sad mouth
    ctx.strokeStyle = '#c05050'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -10, 5, 1.1 * Math.PI, 1.9 * Math.PI); ctx.stroke();
    // Arms (limp)
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(-28, 12, 10, 6, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(28, 12, 10, 6, -0.5, 0, Math.PI * 2); ctx.fill();
    // Feet
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.ellipse(-10, 35, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, 35, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
    // Name label
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 14px Microsoft YaHei';
    ctx.textAlign = 'center'; ctx.fillText(name, 0, 55);
    ctx.restore();
  }

  // Draw monster using existing type functions
  function drawMonsterAt(x, y, sc, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    if (monsterType === 0) { /* inline drawMonsterType0 */ 
      ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, 55, 40, 10, 0, 0, Math.PI*2); ctx.fill();
      const bGrad = ctx.createRadialGradient(-8, -10, 5, 0, 0, 55);
      bGrad.addColorStop(0, '#8b5cf6'); bGrad.addColorStop(0.7, '#5b21b6'); bGrad.addColorStop(1, '#2e1065');
      ctx.fillStyle = bGrad; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-16, -10, 14, 16, -0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(16, -10, 14, 16, 0.1, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#2e1065'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-28, -28); ctx.lineTo(-8, -22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(28, -28); ctx.lineTo(8, -22); ctx.stroke();
      ctx.fillStyle = '#dc2626';
      ctx.beginPath(); ctx.arc(-16, -8, 8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -8, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(-16, -8, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -8, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a0030'; ctx.beginPath(); ctx.arc(0, 18, 18, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#fff';
      for (let i = -12; i <= 12; i += 8) { ctx.beginPath(); ctx.moveTo(i-3, 18); ctx.lineTo(i, 26); ctx.lineTo(i+3, 18); ctx.fill(); }
      ctx.fillStyle = '#7c3aed';
      ctx.beginPath(); ctx.moveTo(-25, -40); ctx.quadraticCurveTo(-35, -70, -20, -65); ctx.lineTo(-15, -42); ctx.fill();
      ctx.beginPath(); ctx.moveTo(25, -40); ctx.quadraticCurveTo(35, -70, 20, -65); ctx.lineTo(15, -42); ctx.fill();
    } else if (monsterType === 1) {
      ctx.translate(x, y); ctx.scale(sc, sc);
      const iceGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 55);
      iceGrad.addColorStop(0, '#e0f7ff'); iceGrad.addColorStop(0.5, '#7dd3fc'); iceGrad.addColorStop(1, '#0369a1');
      ctx.fillStyle = iceGrad;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const angle = (i / 6) * Math.PI * 2 - Math.PI / 2; const px = Math.cos(angle) * 50; const py = Math.sin(angle) * 50; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-15, -10, 12, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15, -10, 12, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath(); ctx.arc(-15, -8, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(15, -8, 7, 0, Math.PI*2); ctx.fill();
    } else if (monsterType === 2) {
      ctx.translate(x, y); ctx.scale(sc, sc);
      const fireGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 55);
      fireGrad.addColorStop(0, '#fef3c7'); fireGrad.addColorStop(0.4, '#f97316'); fireGrad.addColorStop(0.8, '#dc2626'); fireGrad.addColorStop(1, '#7f1d1d');
      ctx.fillStyle = fireGrad; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fbbf24';
      for (let i = 0; i < 8; i++) { const angle = (i / 8) * Math.PI * 2; const flicker = Math.sin(frame * 0.3 + i) * 8; ctx.save(); ctx.rotate(angle); ctx.beginPath(); ctx.moveTo(0, -45); ctx.quadraticCurveTo(-10, -65 - flicker, 0, -80 - flicker); ctx.quadraticCurveTo(10, -65 - flicker, 0, -45); ctx.fill(); ctx.restore(); }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-16, -10, 13, 15, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(16, -10, 13, 15, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#dc2626';
      ctx.beginPath(); ctx.arc(-16, -8, 8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -8, 8, 0, Math.PI*2); ctx.fill();
    } else if (monsterType === 3) {
      ctx.translate(x, y); ctx.scale(sc, sc);
      const thunderGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 55);
      thunderGrad.addColorStop(0, '#fef9c3'); thunderGrad.addColorStop(0.5, '#facc15'); thunderGrad.addColorStop(1, '#7c3aed');
      ctx.fillStyle = thunderGrad; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 5; i++) { const angle = (i / 5) * Math.PI * 2 + frame * 0.1; const dist = 55 + Math.sin(frame * 0.2 + i) * 5; ctx.save(); ctx.rotate(angle); ctx.beginPath(); ctx.moveTo(0, -dist); ctx.lineTo(-5, -dist - 10); ctx.lineTo(5, -dist - 15); ctx.lineTo(0, -dist - 25); ctx.stroke(); ctx.restore(); }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-15, -10, 12, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15, -10, 12, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(-15, -8, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(15, -8, 3, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.translate(x, y); ctx.scale(sc, sc);
      const bookGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 55);
      bookGrad.addColorStop(0, '#fef3c7'); bookGrad.addColorStop(0.5, '#f59e0b'); bookGrad.addColorStop(1, '#92400e');
      ctx.fillStyle = bookGrad;
      ctx.beginPath(); ctx.moveTo(-45, -30); ctx.lineTo(-45, 30); ctx.quadraticCurveTo(0, 40, 45, 30); ctx.lineTo(45, -30); ctx.quadraticCurveTo(0, -20, -45, -30); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-15, -5, 12, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15, -5, 12, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#92400e';
      ctx.beginPath(); ctx.arc(-15, -3, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(15, -3, 7, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Time-based animation for consistent speed on all refresh rates
  let _lastTimeMW = 0;

  function animate(now) {
    if (!_lastTimeMW) _lastTimeMW = now;
    const dt = Math.min(now - _lastTimeMW, 50);
    _lastTimeMW = now;
    const dtFactor = dt / 16.667;
    frame += dtFactor;
    ctx.clearRect(0, 0, W, H);
    // Background
    const bg = ctx.createRadialGradient(W/2, H*0.15, 30, W/2, H*0.15, W*0.8);
    bg.addColorStop(0, '#2a1a3e'); bg.addColorStop(0.5, '#150d28'); bg.addColorStop(1, '#060a1a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // Stars
    for (let i = 0; i < 100; i++) {
      const sx = (i*137.5+frame*0.05)%W, sy = (i*97.3)%H;
      ctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(frame*0.03+i)*0.2})`;
      ctx.beginPath(); ctx.arc(sx, sy, 1+Math.sin(frame*0.05+i)*0.5, 0, Math.PI*2); ctx.fill();
    }

    if (frame < 60) {
      // Phase 0: Monster appears in center, students appear on sides
      monsterScale = Math.min(2, frame / 12 * 2);
      if (monsterScale > 2) monsterScale = 2;
      drawMonsterAt(monsterX, monsterY, monsterScale, 1);
      drawMonsterNameMW(monsterX, monsterY, monsterScale);
      // Students appear
      const studentAlpha = Math.min(1, frame / 36);
      ctx.save(); ctx.globalAlpha = studentAlpha;
      drawStudent(studentLeftX, studentY, 1.8, '#ff6b6b', STATE.playerLeft, 0);
      drawStudent(studentRightX, studentY, 1.8, '#6ba3ff', STATE.playerRight, 0);
      ctx.restore();
    } else if (frame < 120) {
      // Phase 1: Monster charges up
      drawMonsterAt(monsterX, monsterY, 2, 1);
      drawMonsterNameMW(monsterX, monsterY, 2);
      drawStudent(studentLeftX, studentY, 1.8, '#ff6b6b', STATE.playerLeft, 0);
      drawStudent(studentRightX, studentY, 1.8, '#6ba3ff', STATE.playerRight, 0);
      // Charge effect
      const cp = (frame - 60) / 60;
      ctx.save();
      const chargeColors = [
        ['rgba(139,92,246,','rgba(220,38,38,'],
        ['rgba(125,211,252,','rgba(14,165,233,'],
        ['rgba(251,191,36,','rgba(220,38,38,'],
        ['rgba(250,204,21,','rgba(124,58,237,'],
        ['rgba(245,158,11,','rgba(146,64,14,']
      ];
      const colors = chargeColors[attackType];
      for (let i = 0; i < 16; i++) {
        const a = (i/16)*Math.PI*2 + frame*0.15;
        const r = 100 + cp*60;
        ctx.fillStyle = `${colors[i%2]}${cp*0.6})`;
        ctx.beginPath(); ctx.arc(monsterX+Math.cos(a)*r, monsterY+Math.sin(a)*r, 6+cp*4, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    } else if (frame < 320) {
      // Phase 2: Monster attacks both students
      drawMonsterAt(monsterX, monsterY, 2 + Math.sin(frame*0.5)*0.15, 1);
      drawMonsterNameMW(monsterX, monsterY, 2 + Math.sin(frame*0.5)*0.15);
      const ap = (frame - 120) / 200;

      // Attack left student
      if (ap > 0.1 && !leftHit) {
        // Draw attack projectile to left student
        const projP = Math.min(1, (ap - 0.1) / 0.3);
        const projX = monsterX + (studentLeftX - monsterX) * projP;
        const projY = monsterY + (studentY - monsterY) * projP;
        ctx.save();
        if (attackType === 0) {
          const grad = ctx.createRadialGradient(projX, projY, 0, projX, projY, 20);
          grad.addColorStop(0, '#fff'); grad.addColorStop(0.3, '#8b5cf6'); grad.addColorStop(1, 'rgba(139,92,246,0)');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(projX, projY, 20, 0, Math.PI*2); ctx.fill();
        } else if (attackType === 1) {
          ctx.fillStyle = '#bae6fd'; ctx.shadowBlur = 15; ctx.shadowColor = '#7dd3fc';
          ctx.beginPath(); ctx.moveTo(projX, projY-15); ctx.lineTo(projX-10, projY+8); ctx.lineTo(projX+10, projY+8); ctx.closePath(); ctx.fill();
        } else if (attackType === 2) {
          const grad = ctx.createRadialGradient(projX, projY, 0, projX, projY, 25);
          grad.addColorStop(0, '#fef3c7'); grad.addColorStop(0.4, '#f97316'); grad.addColorStop(1, 'rgba(220,38,38,0)');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(projX, projY, 25, 0, Math.PI*2); ctx.fill();
        } else if (attackType === 3) {
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 8; ctx.shadowBlur = 30; ctx.shadowColor = '#facc15';
          ctx.beginPath(); ctx.moveTo(monsterX, monsterY);
          for (let i = 1; i <= 8; i++) { const t = i/8; ctx.lineTo(monsterX+(studentLeftX-monsterX)*t+(Math.random()-0.5)*30, monsterY+(studentY-monsterY)*t+(Math.random()-0.5)*30); }
          ctx.stroke();
        } else {
          ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#fbbf24'; ctx.shadowBlur = 20; ctx.shadowColor = '#f59e0b';
          ctx.fillText('×', projX, projY);
        }
        ctx.restore();
        if (projP >= 1) {
          leftHit = true;
          for (let i = 0; i < 20; i++) particles.push({ x: studentLeftX+(Math.random()-0.5)*20, y: studentY+(Math.random()-0.5)*20, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 1, color: ['#ff6b6b','#fff','#ffd700'][Math.floor(Math.random()*3)] });
        }
      }
      // Attack right student
      if (ap > 0.4 && !rightHit) {
        const projP = Math.min(1, (ap - 0.4) / 0.3);
        const projX = monsterX + (studentRightX - monsterX) * projP;
        const projY = monsterY + (studentRightY - monsterY) * projP;
        ctx.save();
        if (attackType === 0) {
          const grad = ctx.createRadialGradient(projX, projY, 0, projX, projY, 20);
          grad.addColorStop(0, '#fff'); grad.addColorStop(0.3, '#8b5cf6'); grad.addColorStop(1, 'rgba(139,92,246,0)');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(projX, projY, 20, 0, Math.PI*2); ctx.fill();
        } else if (attackType === 1) {
          ctx.fillStyle = '#bae6fd'; ctx.shadowBlur = 15; ctx.shadowColor = '#7dd3fc';
          ctx.beginPath(); ctx.moveTo(projX, projY-15); ctx.lineTo(projX-10, projY+8); ctx.lineTo(projX+10, projY+8); ctx.closePath(); ctx.fill();
        } else if (attackType === 2) {
          const grad = ctx.createRadialGradient(projX, projY, 0, projX, projY, 25);
          grad.addColorStop(0, '#fef3c7'); grad.addColorStop(0.4, '#f97316'); grad.addColorStop(1, 'rgba(220,38,38,0)');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(projX, projY, 25, 0, Math.PI*2); ctx.fill();
        } else if (attackType === 3) {
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 8; ctx.shadowBlur = 30; ctx.shadowColor = '#facc15';
          ctx.beginPath(); ctx.moveTo(monsterX, monsterY);
          for (let i = 1; i <= 8; i++) { const t = i/8; ctx.lineTo(monsterX+(studentRightX-monsterX)*t+(Math.random()-0.5)*30, monsterY+(studentRightY-monsterY)*t+(Math.random()-0.5)*30); }
          ctx.stroke();
        } else {
          ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#fbbf24'; ctx.shadowBlur = 20; ctx.shadowColor = '#f59e0b';
          ctx.fillText('÷', projX, projY);
        }
        ctx.restore();
        if (projP >= 1) {
          rightHit = true;
          for (let i = 0; i < 20; i++) particles.push({ x: studentRightX+(Math.random()-0.5)*20, y: studentRightY+(Math.random()-0.5)*20, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 1, color: ['#6ba3ff','#fff','#ffd700'][Math.floor(Math.random()*3)] });
        }
      }

      // Draw students (shake when hit, then fall)
      if (leftHit && !studentLeftFallen) {
        const shakeX = Math.sin(frame * 2) * 5 * Math.max(0, 1 - (ap - 0.4) * 5);
        drawStudent(studentLeftX + shakeX, studentY, 1.8, '#ff6b6b', STATE.playerLeft, 0);
        if (ap > 0.5) studentLeftFallen = true;
      } else if (studentLeftFallen) {
        // Animate falling to bottom-left
        const fallP = Math.min(1, (ap - 0.5) / 0.4);
        const ease = 1 - Math.pow(1 - fallP, 3);
        const targetX = W * 0.12;
        const targetY = H * 0.85;
        const curX = studentLeftX + (targetX - studentLeftX) * ease;
        const curY = studentY + (targetY - studentY) * ease;
        const curAngle = ease * Math.PI / 2;
        drawLyingStudent(curX, curY, 1.5, '#ff6b6b', STATE.playerLeft, 'left');
      } else {
        drawStudent(studentLeftX, studentY, 1.8, '#ff6b6b', STATE.playerLeft, 0);
      }

      if (rightHit && !studentRightFallen) {
        const shakeX = Math.sin(frame * 2) * 5 * Math.max(0, 1 - (ap - 0.7) * 5);
        drawStudent(studentRightX + shakeX, studentRightY, 1.8, '#6ba3ff', STATE.playerRight, 0);
        if (ap > 0.8) studentRightFallen = true;
      } else if (studentRightFallen) {
        const fallP = Math.min(1, (ap - 0.8) / 0.3);
        const ease = 1 - Math.pow(1 - fallP, 3);
        const targetX = W * 0.88;
        const targetY = H * 0.85;
        drawLyingStudent(studentRightX + (targetX - studentRightX) * ease, studentRightY + (targetY - studentRightY) * ease, 1.5, '#6ba3ff', STATE.playerRight, 'right');
      } else {
        drawStudent(studentRightX, studentRightY, 1.8, '#6ba3ff', STATE.playerRight, 0);
      }
    } else {
      // Phase 3: Monster victorious, students lying in corners
      // Monster in center, celebrating
      const monsterBounce = Math.sin(frame * 0.1) * 5;
      drawMonsterAt(monsterX, monsterY + monsterBounce, 2.2, 1);
      drawMonsterNameMW(monsterX, monsterY + monsterBounce, 2.2);

      // Students lying in corners
      drawLyingStudent(W * 0.12, H * 0.85, 1.5, '#ff6b6b', STATE.playerLeft, 'left');
      drawLyingStudent(W * 0.88, H * 0.85, 1.5, '#6ba3ff', STATE.playerRight, 'right');

      // Victory particles around monster
      if (frame % 8 === 0) {
        const a = Math.random() * Math.PI * 2;
        particles.push({ x: monsterX + Math.cos(a) * 60, y: monsterY + Math.sin(a) * 60, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1, life: 0.8, color: ['#8b5cf6','#ffd700','#fff'][Math.floor(Math.random()*3)] });
      }

      // Text
      if (frame > 320) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, (frame - 320) / 30);
        ctx.font = `900 ${Math.min(W/10, 72)}px Microsoft YaHei, sans-serif`;
        ctx.textAlign = 'center'; ctx.fillStyle = '#ef4444';
        ctx.fillText('怪兽获胜！', W/2, H*0.12);
        ctx.restore();
      }
    }

    // Particles (time-scaled, capped, no shadowBlur)
    if (particles.length > 300) particles.splice(0, particles.length - 300);
    particles = particles.filter(p => {
      p.x += p.vx * dtFactor; p.y += p.vy * dtFactor; p.vy += 0.04 * dtFactor; p.vx *= Math.pow(0.99, dtFactor); p.life -= 0.018 * dtFactor;
      if (p.life > 0) {
        ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3*p.life+1, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        return true;
      } return false;
    });

    if (frame < totalFrames) requestAnimationFrame(animate);
    else {
      STATE.monsterWins = true;
      if (!window._resultCardsShownMW) {
        window._resultCardsShownMW = true;
        showAttackResultCards();
        document.getElementById('attackBottomArea').style.display = 'flex';
      }
    }
    // Show result cards early when monster victory phase starts (Phase 3)
    if (frame >= 320 && frame < 322 && !window._resultCardsShownMW) {
      window._resultCardsShownMW = true;
      STATE.monsterWins = true;
      showAttackResultCards();
      document.getElementById('attackBottomArea').style.display = 'flex';
    }
  }
  requestAnimationFrame(animate);
  // Play monster victory sound
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const now = ac.currentTime;
    [200,180,150,120].forEach((f,i) => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const g = ac.createGain(); g.gain.setValueAtTime(0, now+i*0.2); g.gain.linearRampToValueAtTime(0.15, now+i*0.2+0.05);
      g.gain.exponentialRampToValueAtTime(0.001, now+i*0.2+0.4);
      o.connect(g); g.connect(ac.destination); o.start(now+i*0.2); o.stop(now+i*0.2+0.4);
    });
  } catch(e) {}
}

function showAttackResultCards() {
  const monsterWins = STATE.monsterWins || (!STATE.results.left && !STATE.results.right);
  if (monsterWins) {
    STATE.monsterWins = true;
    const lr = '✗ 错误';
    const rr = '✗ 错误';
    document.getElementById('attackResultCards').innerHTML = `
      <div class="attack-result-card loser" onclick="openReview('left')">
        <div class="card-name" style="color:#ff6b6b">🐰 ${STATE.playerLeft}</div>
        <div class="card-result">${lr}</div>
        <div class="card-time">用时 ${STATE.timers.left.toFixed(1)}s</div>
      </div>
      <div class="attack-result-card loser" onclick="openReview('right')">
        <div class="card-name" style="color:#6ba3ff">🐰 ${STATE.playerRight}</div>
        <div class="card-result">${rr}</div>
        <div class="card-time">用时 ${STATE.timers.right.toFixed(1)}s</div>
      </div>`;
    document.getElementById('attackGiftText').textContent = '怪兽获胜！两位同学都要加油哦！';
    return;
  }
  const leftWin = (STATE.results.left && !STATE.results.right) ||
    (STATE.results.left && STATE.results.right && STATE.timers.left <= STATE.timers.right);
  const lr = STATE.results.left ? '✓ 正确' : '✗ 错误';
  const rr = STATE.results.right ? '✓ 正确' : '✗ 错误';
  document.getElementById('attackResultCards').innerHTML = `
    <div class="attack-result-card ${leftWin?'winner':'loser'}" onclick="openReview('left')">

function openReview(side) {
  const playerName = side === 'left' ? STATE.playerLeft : STATE.playerRight;
  const qIdx = side === 'left' ? STATE.qIdxLeft : STATE.qIdxRight;
  const q = STATE.shuffledQuestions[qIdx];
  const canvasData = STATE.canvasData[side];
  
  document.getElementById('reviewTitle').textContent = `${playerName} 的答题情况`;
  document.getElementById('reviewQuestion').textContent = q ? q.q : '';
  
  // Reset review tool to pen
  reviewDraw.tool = 'pen';
  reviewDraw.color = '#ffd700';
  reviewDraw._lastPos = null;
  
  // Show overlay first so dimensions are available
  document.getElementById('reviewOverlay').classList.add('show');
  
  // Wait for layout to settle, then size canvas and draw
  requestAnimationFrame(() => {
    const reviewCanvas = document.getElementById('reviewCanvas');
    const wrap = document.getElementById('reviewCanvasWrap');
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    reviewCanvas.width = w;
    reviewCanvas.height = h;
    const ctx = reviewCanvas.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Store references for drawing
    reviewDraw.ctx = ctx;
    reviewDraw.canvas = reviewCanvas;
    
    // Fill background first
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);
    
    if (canvasData) {
      // Load the saved canvas image (includes student handwriting)
      const img = new Image();
      img.onload = () => {
        // Draw the saved handwriting scaled to fit the review canvas
        ctx.drawImage(img, 0, 0, w, h);
        // Now set up listeners after image is loaded
        setupReviewCanvasListeners(reviewCanvas);
      };
      img.src = canvasData;
    } else {
      // No saved data - show placeholder text
      ctx.fillStyle = '#94a3b8';
      ctx.font = '24px Microsoft YaHei, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('暂无作答记录', w / 2, h / 2);
      // Still set up listeners
      setupReviewCanvasListeners(reviewCanvas);
    }
    
    // Reset toolbar UI
    const toolbar = document.getElementById('reviewToolbar');
    toolbar.querySelectorAll('.hw-color-dot').forEach((d, i) => d.classList.toggle('active', i === 0));
    document.getElementById('reviewPenBtn').classList.add('active');
    document.getElementById('reviewEraserBtn').classList.remove('active');
    reviewCanvas.classList.remove('eraser-cursor');
  });
}

function closeReview() {
  document.getElementById('reviewOverlay').classList.remove('show');
  // Clean up review canvas listeners
  if (reviewDraw.cleanup) reviewDraw.cleanup();
}

/* ========== REVIEW ANNOTATION DRAWING ========== */
const reviewDraw = {
  ctx: null, canvas: null, drawing: false,
  tool: 'pen', color: '#ffd700', size: 4,
  cleanup: null
};

function setReviewColor(color, el) {
  reviewDraw.color = color;
  reviewDraw.tool = 'pen';
  setReviewTool('pen');
  const toolbar = document.getElementById('reviewToolbar');
  toolbar.querySelectorAll('.hw-color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

function setReviewTool(tool) {
  reviewDraw.tool = tool;
  document.getElementById('reviewPenBtn').classList.toggle('active', tool === 'pen');
  document.getElementById('reviewEraserBtn').classList.toggle('active', tool === 'eraser');
  if (reviewDraw.canvas) {
    reviewDraw.canvas.classList.toggle('eraser-cursor', tool === 'eraser');
  }
}

function clearReviewCanvas() {
  if (!reviewDraw.ctx || !reviewDraw.canvas) return;
  reviewDraw.ctx.fillStyle = '#1a1a2e';
  reviewDraw.ctx.fillRect(0, 0, reviewDraw.canvas.width, reviewDraw.canvas.height);
}

function reviewHwGetPos(e) {
  const canvas = reviewDraw.canvas;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches && e.touches.length > 0) {
    return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
  }
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function reviewHwStart(e) {
  reviewDraw.drawing = true;
  const pos = reviewHwGetPos(e);
  const ctx = reviewDraw.ctx;
  if (reviewDraw.tool === 'eraser') {
    // Erase immediately at start point
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(pos.x, pos.y, reviewDraw.size * 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    // Start a pen stroke (single point, will extend on move)
    ctx.save();
    ctx.fillStyle = reviewDraw.color;
    ctx.beginPath(); ctx.arc(pos.x, pos.y, reviewDraw.size / 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function reviewHwMove(e) {
  if (!reviewDraw.drawing) return;
  const pos = reviewHwGetPos(e);
  const ctx = reviewDraw.ctx;
  if (reviewDraw.tool === 'eraser') {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(pos.x, pos.y, reviewDraw.size * 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    // Draw segment from last point - use lineTo approach
    ctx.save();
    ctx.strokeStyle = reviewDraw.color;
    ctx.lineWidth = reviewDraw.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Get last position from stored history
    if (reviewDraw._lastPos) {
      ctx.beginPath();
      ctx.moveTo(reviewDraw._lastPos.x, reviewDraw._lastPos.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, reviewDraw.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  reviewDraw._lastPos = pos;
}

function reviewHwEnd() {
  reviewDraw.drawing = false;
  reviewDraw._lastPos = null;
}

function setupReviewCanvasListeners(canvas) {
  // Remove old listeners if any
  if (reviewDraw.cleanup) reviewDraw.cleanup();
  
  const onMouseDown = (e) => reviewHwStart(e);
  const onMouseMove = (e) => reviewHwMove(e);
  const onMouseUp = () => reviewHwEnd();
  const onTouchStart = (e) => { e.preventDefault(); reviewHwStart(e); };
  const onTouchMove = (e) => { e.preventDefault(); reviewHwMove(e); };
  const onTouchEnd = () => reviewHwEnd();
  
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('mouseleave', onMouseUp);
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd);
  
  reviewDraw.cleanup = () => {
    canvas.removeEventListener('mousedown', onMouseDown);
    canvas.removeEventListener('mousemove', onMouseMove);
    canvas.removeEventListener('mouseup', onMouseUp);
    canvas.removeEventListener('mouseleave', onMouseUp);
    canvas.removeEventListener('touchstart', onTouchStart);
    canvas.removeEventListener('touchmove', onTouchMove);
    canvas.removeEventListener('touchend', onTouchEnd);
  };
}

function spawnResultParticles() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  const ps = [];
  const colors = ['#ffd700','#ff8c00','#ff6b6b','#4ade80','#6ba3ff','#fff'];
  for (let i = 0; i < 60; i++) ps.push({ x: Math.random()*canvas.width, y: canvas.height+20, vx: (Math.random()-0.5)*4, vy: -(3+Math.random()*6), size: 3+Math.random()*5, color: colors[Math.floor(Math.random()*colors.length)], life: 1, decay: 0.005+Math.random()*0.01, gravity: 0.05 });
  let animId;
  let _lastT = 0;
  function anim(now) {
    if (!_lastT) _lastT = now;
    const dt = Math.min(now - _lastT, 50);
    _lastT = now;
    const dtF = dt / 16.667;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    ps.forEach(p => { p.x+=p.vx*dtF; p.y+=p.vy*dtF; p.vy+=p.gravity*dtF; p.life-=p.decay*dtF;
      if(p.life>0){alive=true;ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore();}
    });
    if(alive) animId=requestAnimationFrame(anim); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animId = requestAnimationFrame(anim);
  setTimeout(()=>{cancelAnimationFrame(animId);ctx.clearRect(0,0,canvas.width,canvas.height);},5000);
}

import * as THREE from 'three';

// Make THREE available globally for the sphere functions
window.THREE = THREE;

// Initialize sphere when module loads
function initSphereOnLoad() {
  const preGameScreen = document.getElementById('preGame');
  if (preGameScreen && preGameScreen.classList.contains('active')) {

// Re-initialize sphere when called from global scope
window.initPickSphereModule = function() {
  const container = document.getElementById('pickSphereContainer');
  if (!container) return;
  
  // Clean up previous instance if any
  if (window.pickRenderer) {
    try { container.removeChild(window.pickRenderer.domElement); } catch(e) {}
    window.pickRenderer.dispose();
  }
  
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  
  window.pickScene = new THREE.Scene();
  window.pickCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  window.pickCamera.position.z = 24;
  window.pickRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  window.pickRenderer.setSize(w, h);
  window.pickRenderer.setClearColor(0x000000, 0);
  container.appendChild(window.pickRenderer.domElement);
  
  window.pickMainGroup = new THREE.Group();
  window.pickScene.add(window.pickMainGroup);
  
  createPickNameTagsModule();
  window.pickSphereInitialized = true;
  animatePickSphereModule();
};

function createPickNameTagsModule() {
  const names = window.STATE ? window.STATE.names : [];
  if (!names || names.length === 0) return;
  
  // Clear existing tags
  if (window.pickNameTags && window.pickNameTags.length) {
    window.pickNameTags.forEach(t => window.pickMainGroup.remove(t.mesh));
  }
  window.pickNameTags = [];
  
  const radius = 13;
  const count = names.length;
  const colors = ['#ffd700', '#ff6b6b', '#4ECDC4', '#A8E6CF', '#C77DFF', '#9D4EDD', '#80FFDB', '#FFE66D'];
  
  for (let i = 0; i < count; i++) {
    const phi = Math.acos(-1 + (2 * i) / count);
    const theta = Math.sqrt(count * Math.PI) * phi;
    
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = colors[i % colors.length];
    ctx.font = 'bold 78px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(names[i], 256, 128);
    
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 1 });
    const sprite = new THREE.Sprite(material);
    
    sprite.position.set(
      radius * Math.cos(theta) * Math.sin(phi),
      radius * Math.sin(theta) * Math.sin(phi),
      radius * Math.cos(phi)
    );
    sprite.scale.set(6, 3, 1);
    
    window.pickMainGroup.add(sprite);
    window.pickNameTags.push({ name: names[i], mesh: sprite });
  }
}

function animatePickSphereModule() {
  if (!window.pickSphereInitialized) return;
  requestAnimationFrame(animatePickSphereModule);
  
  const isRolling = window.isRolling || false;
  
  if (isRolling) {
    window.pickMainGroup.rotation.y += window.pickRotationSpeed * 48;
    window.pickMainGroup.rotation.x += window.pickRotationSpeed * 18;
    if (window.pickRotationSpeed < 0.05) window.pickRotationSpeed += 0.0005;
  } else {
    window.pickMainGroup.rotation.y += 0.002;
    window.pickRotationSpeed = 0.001;
  }
  
  window.pickRenderer.render(window.pickScene, window.pickCamera);
}

// Handle window resize
window.addEventListener('resize', () => {
  if (window.pickRenderer && window.pickCamera) {
    const container = document.getElementById('pickSphereContainer');
    if (container) {
      const w = container.clientWidth;
      const h = container.clientHeight;
      window.pickRenderer.setSize(w, h);
      window.pickCamera.aspect = w / h;
      window.pickCamera.updateProjectionMatrix();
    }
  }
});

// Initialize sphere when module loads if preGame is active
setTimeout(initSphereOnLoad, 200);

// Watch for preGame screen activation
const observer = new MutationObserver((mutations) => {
  mutations.forEach((mutation) => {
    if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
      const preGameScreen = document.getElementById('preGame');
      if (preGameScreen && preGameScreen.classList.contains('active') && !window.pickSphereInitialized) {
        setTimeout(initPickSphereModule, 100);
      }
    }
  });
});

// Start observing after DOM is ready
setTimeout(() => {
  const preGameScreen = document.getElementById('preGame');
  if (preGameScreen) {
    observer.observe(preGameScreen, { attributes: true });
  }
}, 100);
</script>
