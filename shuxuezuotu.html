    cylinder:'点击顶部中心，再点击底部边缘确定大小',
    cone:'点击顶部中心，再点击底部边缘确定大小',
    sphere:'点击球心，再点击球面一点确定半径',
    unfold:'选择立体图形，点击放置展开图',
    ruler:'点击起点，再点击终点放置直尺',
    compass:'点击圆心，再按住鼠标拖动画弧',
    pen:'按住鼠标自由绘画',
    eraser:'按住鼠标拖动擦除，可调节擦除范围大小',
    measure:'点击两个点测量距离，或点击三个点测量角度',
  };
  document.getElementById('sHint').textContent=hints[t]||'';
  mainC.style.cursor=t==='move'?'default':t==='pen'?'crosshair':t==='eraser'?'none':'crosshair';
  // Show/hide eraser size slider
  if(eraserSizeWrap)eraserSizeWrap.style.display=t==='eraser'?'flex':'none';
  // Show/hide pen color panel and position it above the pen button
  const pcp=document.getElementById('penColorRow');
  if(pcp){
    if(t==='pen'){
      pcp.classList.add('on');
      // Position above the pen button, relative to toolbar
      const penBtn=document.querySelector('.tb[data-t="pen"]');
      if(penBtn){
        const btnRect=penBtn.getBoundingClientRect();
        const tbRect=document.getElementById('toolbarEl').getBoundingClientRect();
        // Force layout to get accurate dimensions
        const pcpRect=pcp.getBoundingClientRect();
        let left=btnRect.left+btnRect.width/2-pcpRect.width/2-tbRect.left;
        // Keep within toolbar/viewport bounds
        left=Math.max(10,Math.min(left,tbRect.width-pcpRect.width-10));
        pcp.style.left=left+'px';
        pcp.style.bottom='100%';
        pcp.style.marginBottom='8px';
      }
    }else{
      pcp.classList.remove('on');
    }
  }
  draw();
}

// === POINTER EVENTS ===
mainC.addEventListener('pointerdown',onDown);
mainC.addEventListener('pointermove',onMove);
mainC.addEventListener('pointerup',onUp);
mainC.addEventListener('pointercancel',onUp);
mainC.addEventListener('wheel',onWheel,{passive:false});
mainC.addEventListener('contextmenu',e=>e.preventDefault());

// === PINCH ZOOM (Touch) ===
const activePointers=new Map();
let pinchStartDist=0,pinchStartScale=0,pinchCenterPx={x:0,y:0},pinchCenterMath={x:0,y:0},isPinching=false;
mainC.addEventListener('pointerdown',function(e){
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===2){
    isPinching=true;
    G.pointerDown=false;G.fhPts=[];
    const pts=[...activePointers.values()];
    const r=mainC.getBoundingClientRect();
    const p0={x:pts[0].x-r.left,y:pts[0].y-r.top};
    const p1={x:pts[1].x-r.left,y:pts[1].y-r.top};
    pinchStartDist=Math.hypot(p1.x-p0.x,p1.y-p0.y);
    pinchStartScale=G.scale;
    pinchCenterPx={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
    pinchCenterMath=p2m(pinchCenterPx.x,pinchCenterPx.y);
  }
},{capture:true});
mainC.addEventListener('pointermove',function(e){
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(isPinching&&activePointers.size===2){
    e.preventDefault();e.stopPropagation();
    const pts=[...activePointers.values()];
    const r=mainC.getBoundingClientRect();
    const p0={x:pts[0].x-r.left,y:pts[0].y-r.top};
    const p1={x:pts[1].x-r.left,y:pts[1].y-r.top};
    const dist=Math.hypot(p1.x-p0.x,p1.y-p0.y);
    if(pinchStartDist>0){
      const ratio=dist/pinchStartDist;
      G.scale=pinchStartScale*ratio;
      G.scale=Math.max(8,Math.min(200,G.scale));
      const newCenterPx={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
      G.ox=newCenterPx.x-pinchCenterMath.x*G.scale;
      G.oy=newCenterPx.y+pinchCenterMath.y*G.scale;
      drawBg();draw();
      document.getElementById('sZoom').textContent=Math.round(G.scale/40*100)+'%';
    }
  }
},{capture:true,passive:false});
function removePointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size<2){isPinching=false}
}
mainC.addEventListener('pointerup',removePointer,{capture:true});
mainC.addEventListener('pointercancel',removePointer,{capture:true});

function getPos(e){
  const r=mainC.getBoundingClientRect();
  return{px:e.clientX-r.left,py:e.clientY-r.top};
}

function onDown(e){
  mainC.setPointerCapture(e.pointerId);
  const{px,py}=getPos(e);
  const m=p2m(px,py);
  const sp=G.tool==='point'?{x:Math.round(m.x*100)/100,y:Math.round(m.y*100)/100}:snapPt(m);
  G.touchId=e.pointerId;G.pointerDown=true;
  const t=G.tool;

  if(t==='move'){
    const hit=hitTest(px,py);
    if(hit){
      G.selected=hit.id;G.dragging=true;G.dragObj=hit;
      saveUndo();
      // Check if clicking near a rotation handle
      const handles=getRotHandles(hit);
      const rotThresh=18;
      let foundRot=false;
      for(const h of handles){
        if(Math.hypot(px-h.x,py-h.y)<rotThresh){
          G.rotating=true;
          const center=getShapeCenter(hit);
          G.rotCenter=center;
          G.rotPivot=m; // current mouse in math coords
          // Store original shape data
          G.rotOrig=JSON.parse(JSON.stringify(hit));
          foundRot=true;break;
        }
      }
      if(!foundRot){
        G.rotating=false;
        if(hit.type==='point')G.dragOff={x:hit.x-m.x,y:hit.y-m.y};
        else if(hit.type==='circle'||hit.type==='arc'||hit.type==='sector'||hit.type==='sphere')G.dragOff={x:hit.cx-m.x,y:hit.cy-m.y};
        else if(hit.type==='cylinder'||hit.type==='cone')G.dragOff={x:hit.cx-m.x,y:hit.cy-m.y};
        else if(hit.type==='unfold')G.dragOff={x:hit.x-m.x,y:hit.y-m.y};
        else if(hit.type==='segment'||hit.type==='line'||hit.type==='ray'||hit.type==='ruler')G.dragOff={x:0,y:0};
        else if(hit.type==='box')G.dragOff={x:0,y:0};
        else if(hit.type==='polygon')G.dragOff={x:0,y:0};
        else if(hit.type==='freehand')G.dragOff={x:0,y:0};
        else G.dragOff={x:0,y:0};
      }
    }else{
      G.selected=null;G.panning=true;
      G.panSX=e.clientX;G.panSY=e.clientY;G.panOX=G.ox;G.panOY=G.oy;
      mainC.style.cursor='grabbing';
    }
    draw();return;
  }

  if(t==='eraser'){
    G.eraserActive=true;
    G._eraserSaved=false; // will save undo on first actual erase
    G._eraserPx=px;G._eraserPy=py;
    eraseAt(px,py);
    draw();
    return;
  }

  if(t==='pen'){G.fhPts=[{x:m.x,y:m.y}];return}

  // Ruler
  if(t==='ruler'){
    if(!G.drawState||G.drawState.type!=='ruler'){
      G.drawState={type:'ruler',pts:[{x:sp.x,y:sp.y}]};
    }else{
      G.drawState.pts.push({x:sp.x,y:sp.y});
      const p1=G.drawState.pts[0],p2=G.drawState.pts[1];
      saveUndo();
      G.objs.push({id:G.nextId++,type:'ruler',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color:'#eab308'});
      G.drawState=null;
    }
    draw();return;
  }

  // Measure tool: click 2 points for distance, 3 points for angle
  if(t==='measure'){
    if(!G.drawState||G.drawState.type!=='measure'){
      G.drawState={type:'measure',pts:[{x:sp.x,y:sp.y}]};
    }else{
      G.drawState.pts.push({x:sp.x,y:sp.y});
      if(G.drawState.pts.length===2){
        // Show distance measurement temporarily
        const a=G.drawState.pts[0],b=G.drawState.pts[1];
        const dist=Math.hypot(b.x-a.x,b.y-a.y);
        G.measureResult={type:'distance',pts:G.drawState.pts.slice(),dist};
        G.drawState=null;
      }else if(G.drawState.pts.length===3){
        // Show angle measurement
        const v=G.drawState.pts[0],a1=G.drawState.pts[1],a2=G.drawState.pts[2];
        const d1x=a1.x-v.x,d1y=a1.y-v.y,d2x=a2.x-v.x,d2y=a2.y-v.y;
        const angle=Math.acos((d1x*d2x+d1y*d2y)/(Math.hypot(d1x,d1y)*Math.hypot(d2x,d2y)))*180/Math.PI;
        G.measureResult={type:'angle',pts:G.drawState.pts.slice(),angle};
        G.drawState=null;
      }
    }
    draw();return;
  }

  // Compass: click center, then press+drag to draw arc
  if(t==='compass'){
    if(!G.drawState||G.drawState.type!=='compass'){
      G.drawState={type:'compass',step:1,center:{x:sp.x,y:sp.y},radius:0,startAngle:0,endAngle:0,startAngleCanvas:0,endAngleCanvas:0,drawing:false};
    }
    draw();return;
  }

  // Two-click tools: segment, line, ray, circle, sector, box, cylinder, cone, sphere
  if(['segment','line','ray','circle','sector','box','cylinder','cone','sphere'].includes(t)){
    if(!G.drawState||G.drawState.type!==t){
      G.drawState={type:t,pts:[{x:sp.x,y:sp.y}]};
      draw();return;
    }else{
      G.drawState.pts.push({x:sp.x,y:sp.y});
      finalizeTwoClickTool();
    }
    return;
  }

  // Multi-click tools: triangle, quad
  if(t==='triangle'||t==='quad'){
    if(!G.drawState||G.drawState.type!==t){
      G.drawState={type:t,pts:[{x:sp.x,y:sp.y}]};
    }else{
      G.drawState.pts.push({x:sp.x,y:sp.y});
      const needed=t==='triangle'?3:4;
      if(G.drawState.pts.length>=needed){
        saveUndo();
        const poly={id:G.nextId++,type:'polygon',pts:[...G.drawState.pts],color:G.color};
        addLabelsToPolygon(poly);
        G.objs.push(poly);
        G.drawState=null;
      }
    }
    draw();return;
  }

  handleToolClick(t,sp);
}

function onMove(e){
  const{px,py}=getPos(e);
  const m=p2m(px,py);
  G.mpx=px;G.mpy=py;G.mmx=m.x;G.mmy=m.y;
  document.getElementById('sCoord').textContent=`(${m.x.toFixed(2)}, ${m.y.toFixed(2)})`;

  if(G.panning){G.ox=G.panOX+(e.clientX-G.panSX);G.oy=G.panOY+(e.clientY-G.panSY);drawBg();draw();return}

  if(G.dragging&&G.dragObj){
    const o=G.dragObj;
    if(G.rotating&&G.rotCenter){
      // Rotation mode
      const oldAngle=Math.atan2(G.rotPivot.y-G.rotCenter.y,G.rotPivot.x-G.rotCenter.x);
      const newAngle=Math.atan2(m.y-G.rotCenter.y,m.x-G.rotCenter.x);
      const da=newAngle-oldAngle;
      // Restore original shape then apply rotation
      const orig=G.rotOrig;
      Object.assign(o,JSON.parse(JSON.stringify(orig)));
      rotateShape(o,G.rotCenter,da);
    }else{
      const nm={x:m.x+G.dragOff.x,y:m.y+G.dragOff.y};
      if(o.type==='point'){o.x=nm.x;o.y=nm.y}
      else if(o.type==='circle'||o.type==='arc'||o.type==='sector'||o.type==='sphere'){o.cx=nm.x;o.cy=nm.y}
      else if(o.type==='cylinder'||o.type==='cone'){o.cx=nm.x;o.cy=nm.y}
      else if(o.type==='segment'||o.type==='line'||o.type==='ray'||o.type==='ruler'){const dx=nm.x-(o.x1+o.x2)/2,dy=nm.y-(o.y1+o.y2)/2;o.x1+=dx;o.y1+=dy;o.x2+=dx;o.y2+=dy}
      else if(o.type==='box'){const dx=nm.x-(o.x+o.w/2),dy=nm.y-(o.y+o.h/2);o.x+=dx;o.y+=dy}
      else if(o.type==='polygon'){const cx=o.pts.reduce((s,p)=>s+p.x,0)/o.pts.length,cy=o.pts.reduce((s,p)=>s+p.y,0)/o.pts.length;const dx=nm.x-cx,dy=nm.y-cy;o.pts.forEach(p=>{p.x+=dx;p.y+=dy})}
      else if(o.type==='unfold'){o.x=nm.x;o.y=nm.y}
      else if(o.type==='freehand'){const cx=o.pts.reduce((s,p)=>s+p.x,0)/o.pts.length,cy=o.pts.reduce((s,p)=>s+p.y,0)/o.pts.length;const dx=nm.x-cx,dy=nm.y-cy;o.pts.forEach(p=>{p.x+=dx;p.y+=dy})}
    }
    draw();return;
  }

  // Eraser: drag to erase (throttled via requestAnimationFrame)
  if(G.tool==='eraser'&&G.pointerDown){
    G._eraserPx=px;G._eraserPy=py;G._eraserDirty=true;
    if(!G._eraserRaf)G._eraserRaf=requestAnimationFrame(_eraserTick);
    return;
  }

  // Compass: activate drawing on press+drag from center
  if(G.tool==='compass'&&G.drawState&&G.drawState.step===1&&G.pointerDown&&!G.drawState.drawing){
    const r=Math.hypot(m.x-G.drawState.center.x,m.y-G.drawState.center.y);
    if(r>0.05){
      const p1=m2p(G.drawState.center.x,G.drawState.center.y);
      const curP=m2p(m.x,m.y);
      G.drawState.radius=r;
      const startAngleCanvas=Math.atan2(curP.y-p1.y,curP.x-p1.x);
      G.drawState.startAngleCanvas=startAngleCanvas;
      G.drawState.prevAngleCanvas=startAngleCanvas;
      G.drawState.totalAngle=0;
      G.drawState.endAngleCanvas=startAngleCanvas;
      G.drawState.step=2;
      G.drawState.drawing=true;
    }
  }

  // Compass drawing: update arc by accumulating angle delta
  if(G.tool==='compass'&&G.drawState&&G.drawState.step===2&&G.drawState.drawing&&G.pointerDown){
    const p1=m2p(G.drawState.center.x,G.drawState.center.y);
    const curP=m2p(m.x,m.y);
    const newAngle=Math.atan2(curP.y-p1.y,curP.x-p1.x);
    let delta=newAngle-G.drawState.prevAngleCanvas;
    // Normalize delta to [-π, π]
    while(delta>Math.PI)delta-=2*Math.PI;
    while(delta<-Math.PI)delta+=2*Math.PI;
    G.drawState.totalAngle+=delta;
    G.drawState.prevAngleCanvas=newAngle;
    G.drawState.endAngleCanvas=G.drawState.startAngleCanvas+G.drawState.totalAngle;
    draw();return;
  }

  // Pen tool
  if(G.tool==='pen'&&G.pointerDown&&G.fhPts.length>0){
    let drawX=m.x,drawY=m.y;
    // Check if current point is inside any ruler - if so, don't draw
    let insideRuler=false;
    for(const obj of G.objs){
      if(obj.type==='ruler'){
        const info=getRulerEdgeInfo(obj);
        if(info){
          const{ux,uy,nx,ny,rwMath}=info;
          // Check if point is within ruler width
          const dx=m.x-obj.x1,dy=m.y-obj.y1;
          const along=dx*ux+dy*uy;
          const perp=dx*nx+dy*ny;
          if(along>=0&&along<=info.len&&Math.abs(perp)<rwMath){
            insideRuler=true;break;
          }
        }
      }
    }
    if(!insideRuler){
      const snapThreshPx=18;
      for(const obj of G.objs){
        if(obj.type==='ruler'){
          const distMath=distToRulerEdge(m.x,m.y,obj);
          if(distMath*G.scale<snapThreshPx){
            const snapped=snapToRulerEdge(m.x,m.y,obj);
            drawX=snapped.x;drawY=snapped.y;break;
          }
        }
      }
      G.fhPts.push({x:drawX,y:drawY});
    }
    draw();
    mx.strokeStyle=G.color;mx.lineWidth=2.5;mx.lineCap='round';mx.beginPath();
    G.fhPts.forEach((p,i)=>{const pp=m2p(p.x,p.y);if(i===0)mx.moveTo(pp.x,pp.y);else mx.lineTo(pp.x,pp.y)});
    mx.stroke();return;
  }

  if(G.tool==='move'){
    const hit=hitTest(px,py);G.hovered=hit?hit.id:null;
    if(hit){
      const handles=getRotHandles(hit);
      let nearHandle=false;
      for(const h of handles){if(Math.hypot(px-h.x,py-h.y)<18){nearHandle=true;break}}
      mainC.style.cursor=nearHandle?'grab':'move';
    }else{mainC.style.cursor='default'}
  }

  if(G.drawState||G.tempPts.length>0)draw();
  // Update eraser preview overlay on every mouse move
  else if(G.tool==='eraser')drawOverlay();
}

// === SMART DRAWING RECOGNITION ===
function recognizeShape(pts) {
  if (pts.length < 5) return null;
  
  // Calculate total path length
  let pathLen = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i-1].x;
    const dy = pts[i].y - pts[i-1].y;
    pathLen += Math.sqrt(dx*dx + dy*dy);
  }
  
  // Direct distance from start to end
  const directDist = Math.sqrt(
    Math.pow(pts[pts.length-1].x - pts[0].x, 2) +
    Math.pow(pts[pts.length-1].y - pts[0].y, 2)
  );
  
  // Check if path is closed (for rectangle/circle detection)
  const isClosed = directDist < pathLen * 0.15;
  
  // 1. LINE DETECTION
  const straightness = directDist / pathLen;
  if (straightness > 0.92) {
    return { type: 'line', x1: pts[0].x, y1: pts[0].y, x2: pts[pts.length-1].x, y2: pts[pts.length-1].y };
  }
  
  // Only check closed shapes if path is roughly closed
  if (!isClosed) return null;
  
  // 2. CIRCLE DETECTION
  // Calculate centroid
  let cx = 0, cy = 0;
  pts.forEach(p => { cx += p.x; cy += p.y; });
  cx /= pts.length; cy /= pts.length;
  
  // Calculate average radius and variance
  let avgR = 0;
  const radii = pts.map(p => Math.sqrt(Math.pow(p.x - cx, 2) + Math.pow(p.y - cy, 2)));
  radii.forEach(r => avgR += r);
  avgR /= pts.length;
  
  let variance = 0;
  radii.forEach(r => variance += Math.pow(r - avgR, 2));
  variance /= pts.length;
  const stdDev = Math.sqrt(variance);
  const cv = stdDev / avgR; // coefficient of variation
  
  // If all points are roughly equidistant from center, it's a circle
  if (cv < 0.15 && avgR > 10) {
    return { type: 'circle', cx, cy, r: avgR };
  }
  
  // 3. RECTANGLE DETECTION
  // Find bounding box
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  pts.forEach(p => {
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x);
    maxY = Math.max(maxY, p.y);
  });
  
  const bboxW = maxX - minX;
  const bboxH = maxY - minY;
  const bboxArea = bboxW * bboxH;
  
  // Calculate how much of the bounding box is covered by the path
  // Use a simple grid-based approach
  const gridSize = 5;
  const gridW = Math.ceil(bboxW / gridSize);
  const gridH = Math.ceil(bboxH / gridSize);
  const occupied = new Set();
  
  pts.forEach(p => {
    const gx = Math.floor((p.x - minX) / gridSize);
    const gy = Math.floor((p.y - minY) / gridSize);
    occupied.add(`${gx},${gy}`);
  });
  
  const occupiedArea = occupied.size * gridSize * gridSize;
  const coverage = occupiedArea / bboxArea;
  
  // Check if the path follows the edges of the bounding box
  // Count how many points are near the edges
  const edgeThreshold = Math.max(bboxW, bboxH) * 0.15;
  let edgePoints = 0;
  pts.forEach(p => {
    const distToEdges = Math.min(
      Math.abs(p.x - minX),
      Math.abs(p.x - maxX),
      Math.abs(p.y - minY),
      Math.abs(p.y - maxY)
    );
    if (distToEdges < edgeThreshold) edgePoints++;
  });
  
  const edgeRatio = edgePoints / pts.length;
  
  // If most points are near edges and coverage is reasonable, it's a rectangle
  if (edgeRatio > 0.7 && coverage > 0.3 && coverage < 0.8 && bboxArea > 400) {
    return { type: 'rectangle', x: minX, y: minY, w: bboxW, h: bboxH };
  }
  
  return null;
}

function onUp(e){
  G.pointerDown=false;
  G.eraserActive=false;
  // Finalize eraser: cancel pending RAF, do final erase, save undo once
  if(G.tool==='eraser'){
    if(G._eraserRaf){cancelAnimationFrame(G._eraserRaf);G._eraserRaf=null}
    G._eraserDirty=false;
    // One final erase at release position
    eraseAt(G._eraserPx||0,G._eraserPy||0);
    // Save undo state once for the entire erase session
    saveUndo();
    draw();
  }
  if(G.panning){G.panning=false;mainC.style.cursor=G.tool==='move'?'default':'crosshair'}
  if(G.dragging){G.dragging=false;G.dragObj=null;G.rotating=false;G.rotPivot=null;G.rotOrig=null;G.rotCenter=null}
  
  // Finalize compass arc
  if(G.tool==='compass'&&G.drawState&&G.drawState.step===2&&G.drawState.drawing){
    const ds=G.drawState;
    if(Math.abs(ds.totalAngle)>0.05){
      saveUndo();
      G.objs.push({
        id:G.nextId++,type:'arc',
        cx:ds.center.x,cy:ds.center.y,r:ds.radius,
        startAngleCanvas:ds.startAngleCanvas,
        endAngleCanvas:ds.startAngleCanvas+ds.totalAngle,
        anticlockwise:ds.totalAngle<0,
        color:G.color
      });
    }
    G.drawState=null;draw();
  }
  
  if(G.tool==='pen'&&G.fhPts.length>1){
    saveUndo();
    // Smart drawing recognition
    if(G.smartDraw){
      const shape = recognizeShape(G.fhPts);
      if(shape){
        if(shape.type === 'line'){
          G.objs.push({id:G.nextId++,type:'segment',x1:shape.x1,y1:shape.y1,x2:shape.x2,y2:shape.y2,color:G.color});
        } else if(shape.type === 'circle'){
          G.objs.push({id:G.nextId++,type:'circle',cx:shape.cx,cy:shape.cy,r:shape.r,color:G.color});
        } else if(shape.type === 'rectangle'){
          G.objs.push({id:G.nextId++,type:'polygon',pts:[
            {x:shape.x,y:shape.y},
            {x:shape.x+shape.w,y:shape.y},
            {x:shape.x+shape.w,y:shape.y+shape.h},
            {x:shape.x,y:shape.y+shape.h}
          ],color:G.color});
        }
        G.fhPts=[];
        draw();
        return;
      }
    }
    G.objs.push({id:G.nextId++,type:'freehand',pts:[...G.fhPts],color:G.color});G.fhPts=[];draw();
  }
  G.touchId=null;
}

function onWheel(e){
  e.preventDefault();const{px,py}=getPos(e);const mBefore=p2m(px,py);
  G.scale*=e.deltaY>0?0.9:1.1;G.scale=Math.max(8,Math.min(200,G.scale));
  G.ox=px-mBefore.x*G.scale;G.oy=py+mBefore.y*G.scale;
  drawBg();draw();
  document.getElementById('sZoom').textContent=Math.round(G.scale/40*100)+'%';
}

// === AUTO-LABEL HELPER ===
function getNextLabel(){
  G.pointN++;
  return String.fromCharCode(64+Math.min(G.pointN,26));
}
function addLabelsToPolygon(polygon){
  // Add labels to each vertex of a polygon
  polygon.labels=polygon.pts.map(()=>getNextLabel());
  return polygon;
}
function addLabelsToBox(box){
  // Add labels to all 8 corners of a box
  // Order: front face (bottom-left, bottom-right, top-right, top-left), back face (same order)
  box.labels=[getNextLabel(),getNextLabel(),getNextLabel(),getNextLabel(),
              getNextLabel(),getNextLabel(),getNextLabel(),getNextLabel()];
  return box;
}

function finalizeTwoClickTool(){
  const ds=G.drawState;if(!ds||ds.pts.length<2){G.drawState=null;return}
  const p1=ds.pts[0],p2=ds.pts[1];
  saveUndo();
  const t=ds.type;
  if(t==='segment')G.objs.push({id:G.nextId++,type:'segment',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color:G.color});
  else if(t==='line')G.objs.push({id:G.nextId++,type:'line',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color:G.color});
  else if(t==='ray')G.objs.push({id:G.nextId++,type:'ray',x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,color:G.color});
  else if(t==='circle'){const r=Math.hypot(p2.x-p1.x,p2.y-p1.y);G.objs.push({id:G.nextId++,type:'circle',cx:p1.x,cy:p1.y,r,color:G.color})}
  else if(t==='sector'){
    const r=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const p1px=m2p(p1.x,p1.y),p2px=m2p(p2.x,p2.y);
    const startAngleCanvas=Math.atan2(p2px.y-p1px.y,p2px.x-p1px.x);
    const endAngleCanvas=startAngleCanvas+Math.PI/2; // 90 degree sector
    G.objs.push({id:G.nextId++,type:'sector',cx:p1.x,cy:p1.y,r,startAngleCanvas,endAngleCanvas,color:G.color});
  }
  else if(t==='box'){
    const x=Math.min(p1.x,p2.x),y=Math.min(p1.y,p2.y),w=Math.abs(p2.x-p1.x),h=Math.abs(p2.y-p1.y);
    const d=Math.min(w,h); // depth = min of w,h for cube-like appearance; user can adjust
    const box={id:G.nextId++,type:'box',x,y,w,h,d,color:G.color};
    addLabelsToBox(box);
    G.objs.push(box);
  }
  else if(t==='cylinder'||t==='cone'){const cx=p1.x,cy=Math.min(p1.y,p2.y),r=Math.abs(p2.x-p1.x),h=Math.abs(p2.y-p1.y);G.objs.push({id:G.nextId++,type:t,cx,cy,r,h,color:G.color})}
  else if(t==='sphere'){const cx=p1.x,cy=p1.y,r=Math.hypot(p2.x-p1.x,p2.y-p1.y);G.objs.push({id:G.nextId++,type:'sphere',cx,cy,r,color:G.color})}
  G.drawState=null;G.tempPts=[];draw();
}

function handleToolClick(t,sp){
  switch(t){
    case'point':
      saveUndo();
      G.objs.push({id:G.nextId++,type:'point',x:sp.x,y:sp.y,color:G.color,label:getNextLabel()});
      draw();break;
    case'perp':case'parallel':
      G.tempPts.push(sp);
      if(G.tempPts.length===2){G.objs.push({id:G.nextId++,type:'line',x1:G.tempPts[0].x,y1:G.tempPts[0].y,x2:G.tempPts[1].x,y2:G.tempPts[1].y,color:'#9ca3af'})}
      if(G.tempPts.length===3){
        const dx=G.tempPts[1].x-G.tempPts[0].x,dy=G.tempPts[1].y-G.tempPts[0].y;
        if(t==='perp')G.objs.push({id:G.nextId++,type:'line',x1:sp.x-dy,y1:sp.y+dx,x2:sp.x+dy,y2:sp.y-dx,color:G.color});
        else G.objs.push({id:G.nextId++,type:'line',x1:sp.x-dx,y1:sp.y-dy,x2:sp.x+dx,y2:sp.y+dy,color:G.color});
        G.objs.push({id:G.nextId++,type:'point',x:sp.x,y:sp.y,color:G.color,label:getNextLabel()});
        G.tempPts=[];
      }
      draw();break;
    case'midperp':
      G.tempPts.push(sp);
      if(G.tempPts.length===2){
        saveUndo();const a=G.tempPts[0],b=G.tempPts[1];
        const midx=(a.x+b.x)/2,midy=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
        G.objs.push({id:G.nextId++,type:'segment',x1:a.x,y1:a.y,x2:b.x,y2:b.y,color:'#9ca3af'});
        G.objs.push({id:G.nextId++,type:'line',x1:midx-dy/len*10,y1:midy+dx/len*10,x2:midx+dy/len*10,y2:midy-dx/len*10,color:G.color});
        G.objs.push({id:G.nextId++,type:'point',x:midx,y:midy,color:G.color,label:'M'});
        G.tempPts=[];
      }
      draw();break;
    case'tangent':
      G.tempPts.push(sp);
      if(G.tempPts.length===2){const r=Math.hypot(sp.x-G.tempPts[0].x,sp.y-G.tempPts[0].y);G.objs.push({id:G.nextId++,type:'circle',cx:G.tempPts[0].x,cy:G.tempPts[0].y,r,color:'#9ca3af'});G.tempPts[0].r=r}
      if(G.tempPts.length===3){
        saveUndo();const c=G.tempPts[0],r=c.r,d=Math.hypot(sp.x-c.x,sp.y-c.y);
        if(d>r){const dx=sp.x-c.x,dy=sp.y-c.y,d2=dx*dx+dy*dy;const f1=r*r/d2,f2=r*Math.sqrt(d2-r*r)/d2;
          const t1={x:c.x+f1*dx+f2*dy,y:c.y+f1*dy-f2*dx},t2={x:c.x+f1*dx-f2*dy,y:c.y+f1*dy+f2*dx};
          // Draw tangent lines from external point to tangent points only
          G.objs.push({id:G.nextId++,type:'segment',x1:sp.x,y1:sp.y,x2:t1.x,y2:t1.y,color:G.color});
          G.objs.push({id:G.nextId++,type:'segment',x1:sp.x,y1:sp.y,x2:t2.x,y2:t2.y,color:G.color});
          G.objs.push({id:G.nextId++,type:'point',x:sp.x,y:sp.y,color:G.color,label:getNextLabel()});
        }
        G.tempPts=[];
      }
      draw();break;
    case'bisect':
      G.tempPts.push(sp);
      if(G.tempPts.length===3){
        saveUndo();const v=G.tempPts[0],a1=G.tempPts[1],a2=G.tempPts[2];
        const d1x=a1.x-v.x,d1y=a1.y-v.y,l1=Math.hypot(d1x,d1y);
        const d2x=a2.x-v.x,d2y=a2.y-v.y,l2=Math.hypot(d2x,d2y);
        if(l1>0&&l2>0){const u1x=d1x/l1,u1y=d1y/l1,u2x=d2x/l2,u2y=d2y/l2;
          const bx=u1x+u2x,by=u1y+u2y,bl=Math.hypot(bx,by);
          if(bl>0){
            G.objs.push({id:G.nextId++,type:'ray',x1:v.x,y1:v.y,x2:a1.x,y2:a1.y,color:'#9ca3af'});
            G.objs.push({id:G.nextId++,type:'ray',x1:v.x,y1:v.y,x2:a2.x,y2:a2.y,color:'#9ca3af'});
            G.objs.push({id:G.nextId++,type:'ray',x1:v.x,y1:v.y,x2:v.x+bx/bl*10,y2:v.y+by/bl*10,color:G.color});
            G.objs.push({id:G.nextId++,type:'point',x:v.x,y:v.y,color:G.color,label:getNextLabel()});
          }
        }
        G.tempPts=[];
      }
      draw();break;
    case'polygon':
      G.tempPts.push(sp);
      if(G.tempPts.length===2){
        saveUndo();
        const A=G.tempPts[0],B=G.tempPts[1];
        const n=parseInt(prompt('请输入正多边形边数 (3-12):','6'))||6;
        // Compute regular polygon with AB as first edge
        const dx=B.x-A.x,dy=B.y-A.y;
        const L=Math.hypot(dx,dy);
        if(L>0.01){
          // Midpoint of AB
          const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
          // Perpendicular direction (left of A→B)
          const px=-dy/L,py=dx/L;
          // Distance from center to edge midpoint
          const r=L/(2*Math.tan(Math.PI/n));
          // Center of polygon
          const cx=mx+r*px,cy=my+r*py;
          // Distance from center to vertex
          const R=L/(2*Math.sin(Math.PI/n));
          // Angle of first vertex A from center
          const theta0=Math.atan2(A.y-cy,A.x-cx);
          // Generate vertices
          const pts=[];
          for(let i=0;i<n;i++){
            const angle=theta0+i*2*Math.PI/n;
            pts.push({x:cx+R*Math.cos(angle),y:cy+R*Math.sin(angle)});
          }
          const poly={id:G.nextId++,type:'polygon',pts,color:G.color};
          addLabelsToPolygon(poly);
          G.objs.push(poly);
        }
        G.tempPts=[];
      }
      draw();break;
    case'unfold':
      saveUndo();G.objs.push({id:G.nextId++,type:'unfold',x:sp.x,y:sp.y,color:G.color});draw();break;
  }
}

function undo(){if(!G.undoStack.length)return;G.redoStack.push(JSON.stringify(G.objs));G.objs=JSON.parse(G.undoStack.pop());G.selected=null;draw()}

// === AUTO-HIDE TOOLBAR IN FULLSCREEN ===
let autoHideTimer=null;
let isToolbarVisible=true;
const toolbar=document.getElementById('toolRow');

function isFullscreen(){
  return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);
}

const funcPanel=document.getElementById('funcPanel');

function showToolbar(){
  if(!isFullscreen())return;
  toolbar.classList.remove('auto-hidden');
  funcPanel.classList.remove('auto-hidden');
  isToolbarVisible=true;
  resetAutoHideTimer();
}

function hideToolbar(){
  if(!isFullscreen())return;
  toolbar.classList.add('auto-hidden');
  funcPanel.classList.add('auto-hidden');
  isToolbarVisible=false;
}

function resetAutoHideTimer(){
  if(autoHideTimer)clearTimeout(autoHideTimer);
  autoHideTimer=setTimeout(()=>{
    if(isFullscreen()&&isToolbarVisible){
      hideToolbar();
    }
  },3000);
}

// Show toolbar on mouse movement near bottom
document.addEventListener('mousemove',e=>{
  if(!isFullscreen())return;
  if(e.clientY>window.innerHeight-80){
    showToolbar();
  }
});

// Show toolbar on touch near bottom
document.addEventListener('touchstart',e=>{
  if(!isFullscreen())return;
  const touch=e.touches[0];
  if(touch.clientY>window.innerHeight-80){
    showToolbar();
  }
});

// Start auto-hide timer when entering fullscreen
document.addEventListener('fullscreenchange',()=>{
  if(isFullscreen()){
    resetAutoHideTimer();
  }else{
    if(autoHideTimer)clearTimeout(autoHideTimer);
    toolbar.classList.remove('auto-hidden');
    funcPanel.classList.remove('auto-hidden');
    isToolbarVisible=true;
  }
});

  intercept:{label:'y = a(x-x₁)(x-x₂)', params:[
    {id:'qa',label:'a',val:1},{id:'qx1',label:'x₁',val:-1},{id:'qx2',label:'x₂',val:1}
  ]},
  no_c:{label:'y = ax² + bx', params:[
    {id:'qa',label:'a',val:1},{id:'qb',label:'b',val:0}
  ]}
};
let currentQForm='general';

function buildQCoeffs(){
  const def=qFormDefs[currentQForm];
  const container=document.getElementById('qCoeffs');
  document.getElementById('qFormLabel').textContent=def.label;
  let html='';
  def.params.forEach(p=>{
    html+=`<div class="func-coeff"><label>${p.label}</label><input type="number" id="${p.id}" value="${p.val}" step="0.5"><input type="range" id="${p.id}s" min="-20" max="20" step="0.1" value="${p.val}"></div>`;
  });
  container.innerHTML=html;
  // Sync inputs
  def.params.forEach(p=>{syncInputs(p.id,p.id+'s')});
}
buildQCoeffs();

document.getElementById('qFormSelect').addEventListener('change',e=>{
  currentQForm=e.target.value;
  buildQCoeffs();
});

function getQExprAndLabel(){
  const def=qFormDefs[currentQForm];
  const vals={};
  def.params.forEach(p=>{vals[p.id]=parseFloat(document.getElementById(p.id).value)||0});
  let expr,label;
  switch(currentQForm){
    case'general':{
      const{qa:a,qb:b,qc:c}=vals;
      expr=`(${a})*x^2+(${b})*x+(${c})`;
      label=`y = ${a}x² + ${b}x + ${c}`;
      break;
    }
    case'vertex_hk':{
      const{qa:a,qh:h,qk:k}=vals;
      expr=`(${a})*(x-(${h}))^2+(${k})`;
      label=`y = ${a}(x - ${h})² + ${k}`;
      break;
    }
    case'vertex_simple':{
      const{qa:a,qh:h}=vals;
      expr=`(${a})*(x-(${h}))^2`;
      label=`y = ${a}(x - ${h})²`;
      break;
    }
    case'simple':{
      const{qa:a}=vals;
      expr=`(${a})*x^2`;
      label=`y = ${a}x²`;
      break;
    }
    case'shift_c':{
      const{qa:a,qc:c}=vals;
      expr=`(${a})*x^2+(${c})`;
      label=`y = ${a}x² + ${c}`;
      break;
    }
    case'intercept':{
      const{qa:a,qx1:x1,qx2:x2}=vals;
      expr=`(${a})*(x-(${x1}))*(x-(${x2}))`;
      label=`y = ${a}(x - ${x1})(x - ${x2})`;
      break;
    }
    case'no_c':{
      const{qa:a,qb:b}=vals;
      expr=`(${a})*x^2+(${b})*x`;
      label=`y = ${a}x² + ${b}x`;
      break;
    }
  }
  return{expr,label};
}

document.querySelectorAll('.draw-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const ft=btn.dataset.ft;
    if(ft==='linear'){const k=parseFloat(document.getElementById('lk').value)||0,b=parseFloat(document.getElementById('lb').value)||0;addFunc(`${k}*x+${b}`,`y = ${k}x + ${b}`)}
    else if(ft==='quadratic'){const{expr,label}=getQExprAndLabel();addFunc(expr,label)}
    else if(ft==='inverse'){const k=parseFloat(document.getElementById('ik').value)||1;addFunc(`${k}/x`,`y = ${k}/x`)}
  });
});
document.querySelectorAll('.demo-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{const ft=btn.dataset.ft;if(G.demo&&G.demo.type===ft){stopDemo();return}startDemo(ft)});
});
function addFunc(expr,label){
  try{const compiled=math.compile(expr);compiled.evaluate({x:1});const color=funcColors[G.funcs.length%funcColors.length];G.funcs.push({id:G.nextId++,expr,compiled,label,color});updateFuncList();draw()}catch(e){}
}
function updateFuncList(){
  const list=document.getElementById('funcList');
  list.innerHTML=G.funcs.map(f=>`<div class="func-tag"><div class="dot" style="background:${f.color}"></div><span>${f.label}</span><span class="x" data-id="${f.id}">×</span></div>`).join('');
  list.querySelectorAll('.x').forEach(x=>{x.addEventListener('click',()=>{G.funcs=G.funcs.filter(f=>f.id!==parseInt(x.dataset.id));updateFuncList();draw()})});
}

// === DEMO MODE ===
let demoOverlay=null;
function startDemo(ft){
  stopDemo();G.funcs=G.funcs.filter(f=>f._demoType!==ft);
  const color=funcColors[(G.funcs.length)%funcColors.length];
  let expr,label,sliders;
  if(ft==='linear'){sliders=[{id:'demo_k',label:'k',min:-20,max:20,step:0.1,val:1},{id:'demo_b',label:'b',min:-20,max:20,step:0.1,val:0}];expr=`1*x+0`;label='y = kx + b'}
  else if(ft==='quadratic'){
    // Use current form selection for demo
    const def=qFormDefs[currentQForm];
    sliders=def.params.map(p=>({id:'demo_'+p.id,label:p.label,min:-20,max:20,step:0.1,val:p.val}));
    // Build initial expression based on current form
    const initVals={};
    def.params.forEach(p=>{initVals[p.id]=p.val});
    const{expr:e,label:l}=buildQExprFromVals(currentQForm,initVals);
    expr=e;label=l;
  }
  else{sliders=[{id:'demo_k',label:'k',min:-20,max:20,step:0.1,val:1}];expr=`1/x`;label='y = k/x'}
  const demoFunc={id:G.nextId++,expr,compiled:math.compile(expr),label,color,_demo:true,_demoType:ft};
  G.funcs.push(demoFunc);G.demo={type:ft,funcId:demoFunc.id,sliders,color,qForm:currentQForm};
  demoOverlay=document.createElement('div');demoOverlay.className='demo-overlay on';
  let html='<div class="demo-title">'+label+' (拖动滑块观察变化)</div><div class="demo-sliders">';
  sliders.forEach(s=>{html+=`<div class="demo-row"><label>${s.label}</label><input type="range" id="${s.id}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.val}"><span class="demo-val" id="${s.id}_v">${s.val}</span></div>`});
  html+='</div><button class="demo-close" id="demoClose">关闭演示</button>';
  demoOverlay.innerHTML=html;cw.appendChild(demoOverlay);
  sliders.forEach(s=>{const el=document.getElementById(s.id),valEl=document.getElementById(s.id+'_v');el.addEventListener('input',()=>{valEl.textContent=parseFloat(el.value).toFixed(1);updateDemoFunc()})});
  document.getElementById('demoClose').addEventListener('click',stopDemo);
  document.querySelectorAll('.demo-btn').forEach(b=>b.classList.toggle('active',b.dataset.ft===ft));
  updateFuncList();draw();
}
function buildQExprFromVals(form,vals){
  let expr,label;
  switch(form){
    case'general':{
      const a=vals.qa||0,b=vals.qb||0,c=vals.qc||0;
      expr=`(${a})*x^2+(${b})*x+(${c})`;label=`y = ${a}x² + ${b}x + ${c}`;break;
    }
    case'vertex_hk':{
      const a=vals.qa||0,h=vals.qh||0,k=vals.qk||0;
      expr=`(${a})*(x-(${h}))^2+(${k})`;label=`y = ${a}(x - ${h})² + ${k}`;break;
    }
    case'vertex_simple':{
      const a=vals.qa||0,h=vals.qh||0;
      expr=`(${a})*(x-(${h}))^2`;label=`y = ${a}(x - ${h})²`;break;
    }
    case'simple':{
      const a=vals.qa||0;
      expr=`(${a})*x^2`;label=`y = ${a}x²`;break;
    }
    case'shift_c':{
      const a=vals.qa||0,c=vals.qc||0;
      expr=`(${a})*x^2+(${c})`;label=`y = ${a}x² + ${c}`;break;
    }
    case'intercept':{
      const a=vals.qa||0,x1=vals.qx1||0,x2=vals.qx2||0;
      expr=`(${a})*(x-(${x1}))*(x-(${x2}))`;label=`y = ${a}(x - ${x1})(x - ${x2})`;break;
    }
    case'no_c':{
      const a=vals.qa||0,b=vals.qb||0;
      expr=`(${a})*x^2+(${b})*x`;label=`y = ${a}x² + ${b}x`;break;
    }
  }
  return{expr,label};
}
function updateDemoFunc(){
  if(!G.demo)return;const f=G.funcs.find(f=>f.id===G.demo.funcId);if(!f)return;
  let expr,label;
  if(G.demo.type==='linear'){const k=parseFloat(document.getElementById('demo_k').value)||0,b=parseFloat(document.getElementById('demo_b').value)||0;expr=`${k}*x+${b}`;label=`y = ${k}x + ${b}`}
  else if(G.demo.type==='quadratic'){
    const form=G.demo.qForm||'general';
    const def=qFormDefs[form];
    const vals={};
    def.params.forEach(p=>{vals[p.id]=parseFloat(document.getElementById('demo_'+p.id).value)||0});
    const r=buildQExprFromVals(form,vals);
    expr=r.expr;label=r.label;
  }
  else{const k=parseFloat(document.getElementById('demo_k').value)||1;expr=`${k}/x`;label=`y = ${k}/x`}
  try{f.expr=expr;f.compiled=math.compile(expr);f.label=label;updateFuncList();draw()}catch(e){}
}
function stopDemo(){
  if(!G.demo)return;G.funcs=G.funcs.filter(f=>f.id!==G.demo.funcId);G.demo=null;
  if(demoOverlay){demoOverlay.remove();demoOverlay=null}
  document.querySelectorAll('.demo-btn').forEach(b=>b.classList.remove('active'));
  updateFuncList();draw();
}

// === KEYBOARD ===
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='v'||e.key==='V')setTool('move');
  else if(e.key==='p'||e.key==='P')setTool('point');
  else if(e.key==='c'||e.key==='C')setTool('circle');
  else if(e.key==='Delete'||e.key==='Backspace'){if(G.selected){saveUndo();G.objs=G.objs.filter(o=>o.id!==G.selected);G.selected=null;draw()}}
  else if(e.key==='z'&&(e.ctrlKey||e.metaKey)){e.preventDefault();undo()}
  else if(e.key==='y'&&(e.ctrlKey||e.metaKey)){e.preventDefault();redo()}
  else if(e.key==='Escape'){G.tempPts=[];G.drawState=null;G.selected=null;setTool('move')}
  // 3D rotation with arrow keys
  else if(e.key==='ArrowLeft'){G.viewAngleX-=0.1;draw()}
  else if(e.key==='ArrowRight'){G.viewAngleX+=0.1;draw()}
  else if(e.key==='ArrowUp'){G.viewAngleY=Math.min(Math.PI/2,G.viewAngleY+0.1);draw()}
  else if(e.key==='ArrowDown'){G.viewAngleY=Math.max(0.1,G.viewAngleY-0.1);draw()}
  else if(e.key==='r'||e.key==='R'){G.viewAngleX=0.5;G.viewAngleY=0.6;draw()}
});

// === UNFOLD PANEL ===
// All 11 valid cube nets defined as arrays of [col, row] unit squares
// Verified mathematically - each folds into a valid cube
const unfoldData={
  cube:{
    name:'正方体',
    nets:[
      // 1-4-1 type (6 nets): strip of 4 horizontal, 1 above, 1 below
      // T=above position (0-3), B=below position (0-3), T≠B
      [[0,1],[1,1],[2,1],[3,1],[1,2],[2,0]],  // T=1,B=2
      [[0,1],[1,1],[2,1],[3,1],[2,2],[1,0]],  // T=2,B=1
      [[0,1],[1,1],[2,1],[3,1],[1,2],[3,0]],  // T=1,B=3
      [[0,1],[1,1],[2,1],[3,1],[3,2],[1,0]],  // T=3,B=1
      [[0,1],[1,1],[2,1],[3,1],[2,2],[3,0]],  // T=2,B=3
      [[0,1],[1,1],[2,1],[3,1],[3,2],[2,0]],  // T=3,B=2
      // 2-3-1 type (3 nets)
      [[0,0],[1,0],[0,1],[1,1],[2,1],[2,2]],  // staircase right
      [[1,0],[2,0],[0,1],[1,1],[2,1],[0,2]],  // staircase left
      [[0,0],[1,0],[1,1],[2,1],[3,1],[3,2]],  // Z-shape
      // 2-2-2 type (1 net)
      [[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]],  // full staircase
      // 3-3 type (1 net) - two rows of 3, offset by 1
      [[0,0],[1,0],[2,0],[1,1],[2,1],[3,1]],  // offset rows
    ]
  },
  cuboid:{
    name:'长方体',
    nets:[
      [[0,0],[1,0],[2,0],[3,0],[1,1],[2,1]],
      [[0,0],[1,0],[2,0],[3,0],[0,1],[2,1]],
      [[0,0],[1,0],[0,1],[1,1],[2,1],[2,2]],
    ]
  },
  cylinder:{name:'圆柱',nets:[]},
  cone:{name:'圆锥',nets:[]},
  sector:{name:'扇形',nets:[]},
};

let unfoldState={shape:null,netIdx:null};

function toggleUnfoldPanel(){
  const panel=document.getElementById('unfoldPanel');
  panel.classList.toggle('on');
  if(panel.classList.contains('on'))buildUnfoldPanel();
}

function buildUnfoldPanel(){
  const shapesDiv=document.getElementById('upShapes');
  const netsDiv=document.getElementById('upNets');
  shapesDiv.innerHTML='';netsDiv.innerHTML='';
  Object.keys(unfoldData).forEach(key=>{
    const shape=unfoldData[key];
    const btn=document.createElement('button');
    btn.className='up-shape'+(unfoldState.shape===key?' on':'');
    btn.textContent=shape.name;
    btn.addEventListener('click',()=>{unfoldState.shape=key;unfoldState.netIdx=null;buildUnfoldPanel()});
    shapesDiv.appendChild(btn);
  });
  if(unfoldState.shape&&unfoldData[unfoldState.shape]){
    const shape=unfoldData[unfoldState.shape];
    if(shape.nets.length===0){
      if(unfoldState.shape==='cylinder'){
        const netDiv=document.createElement('div');netDiv.className='up-net';
        netDiv.innerHTML=`<svg viewBox="0 0 80 80" width="72" height="72" style="display:block">
          <rect x="10" y="22" width="60" height="36" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/>
          <circle cx="40" cy="68" r="10" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/>
          <circle cx="40" cy="12" r="10" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/>
        </svg>`;
        netDiv.addEventListener('click',()=>{placeUnfoldNet(unfoldState.shape,0);toggleUnfoldPanel()});
        netsDiv.appendChild(netDiv);
      }else if(unfoldState.shape==='cone'){
        // Correct cone net: sector (lateral) on top, circle (base) below
        const netDiv=document.createElement('div');netDiv.className='up-net';
        netDiv.innerHTML=`<svg viewBox="0 0 80 80" width="72" height="72" style="display:block">
          <path d="M40 8 L18 52 A28 28 0 0 0 62 52 Z" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/>
          <circle cx="40" cy="66" r="10" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.5"/>
          <text x="40" y="36" text-anchor="middle" font-size="7" fill="#374151">侧面</text>
          <text x="40" y="69" text-anchor="middle" font-size="7" fill="#374151">底面</text>
        </svg>`;
        netDiv.addEventListener('click',()=>{placeUnfoldNet(unfoldState.shape,0);toggleUnfoldPanel()});
        netsDiv.appendChild(netDiv);
      }else if(unfoldState.shape==='sector'){
        // Sector unfolds to itself
        const netDiv=document.createElement('div');netDiv.className='up-net';
        netDiv.innerHTML=`<svg viewBox="0 0 80 80" width="72" height="72" style="display:block">
          <path d="M40 40 L40 8 A32 32 0 0 1 72 40 Z" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/>
          <text x="50" y="32" text-anchor="middle" font-size="8" fill="#374151">扇形</text>
        </svg>`;
        netDiv.addEventListener('click',()=>{placeUnfoldNet(unfoldState.shape,0);toggleUnfoldPanel()});
        netsDiv.appendChild(netDiv);
      }
      return;
    }
    shape.nets.forEach((net,idx)=>{
      const netDiv=document.createElement('div');
      netDiv.className='up-net'+(unfoldState.netIdx===idx?' on':'');
      netDiv.innerHTML=buildNetSVG(net);
      netDiv.addEventListener('click',()=>{unfoldState.netIdx=idx;placeUnfoldNet(unfoldState.shape,idx);toggleUnfoldPanel()});
      netsDiv.appendChild(netDiv);
    });
  }
}

function buildNetSVG(net){
  let minX=99,maxX=-99,minY=99,maxY=-99;
  net.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)});
  const cols=maxX-minX+1,rows=maxY-minY+1;
  const s=Math.min(70/cols,70/rows,24);
  const ox=(80-cols*s)/2-minX*s,oy=(80-rows*s)/2-minY*s;
  let rects='';
  net.forEach(([x,y])=>{
    const rx=(ox+x*s).toFixed(1),ry=(oy+y*s).toFixed(1),rs=s.toFixed(1);
    rects+=`<rect x="${rx}" y="${ry}" width="${rs}" height="${rs}" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.2"/>`;
  });
  return `<svg viewBox="0 0 80 80" width="72" height="72" style="display:block">${rects}</svg>`;
}

function drawNetPreview(cvs,net){
  const ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,cvs.width,cvs.height);
  // Find bounds
  let minX=99,maxX=-99,minY=99,maxY=-99;
  net.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)});
  const cols=maxX-minX+1,rows=maxY-minY+1;
  const s=Math.min(140/cols,140/rows,40);
  const ox=(160-cols*s)/2-minX*s,oy=(160-rows*s)/2-minY*s;
  ctx.strokeStyle='#2563eb';ctx.lineWidth=1.5;ctx.fillStyle='rgba(37,99,235,0.1)';
  net.forEach(([x,y])=>{
    ctx.strokeRect(ox+x*s,oy+y*s,s,s);
    ctx.fillRect(ox+x*s,oy+y*s,s,s);
  });
}

function placeUnfoldNet(shapeType,netIdx){
  const shape=unfoldData[shapeType];if(!shape)return;
  const center=p2m(cw.clientWidth/2,cw.clientHeight/2);
  saveUndo();
  if(shapeType==='cylinder'){
    G.objs.push({id:G.nextId++,type:'unfold',x:center.x-2,y:center.y-1,net:[],size:1,shapeType,color:G.color});
  }else if(shapeType==='cone'){
    // Default cone: r=1, h=2
    G.objs.push({id:G.nextId++,type:'unfold',x:center.x-3,y:center.y-1,net:[],size:1,shapeType,color:G.color,coneR:1,coneH:2});
  }else if(shapeType==='sector'){
    // Default sector: r=2
    G.objs.push({id:G.nextId++,type:'unfold',x:center.x-2.5,y:center.y-1,net:[],size:1,shapeType,color:G.color,secR:2});
  }else{
    const net=shape.nets[netIdx];
    G.objs.push({id:G.nextId++,type:'unfold',x:center.x-2,y:center.y-1,net:net,size:1,shapeType,color:G.color});
  }
  draw();
}

  document.getElementById('unfoldPanel').classList.remove('on');
});
