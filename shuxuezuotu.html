<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MathLab · 初中数学作图工具</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff;--bd:#d1d5db;--t:#000000;--td:#1a1a1a;
  --blue:#2563eb;--blueg:rgba(37,99,235,.12);--red:#dc2626;
  --f:'Noto Sans SC',system-ui,sans-serif;--m:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;font-family:var(--f);background:var(--bg);color:var(--t);font-size:13px;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;color:var(--t);background:#fff;border:1px solid var(--bd);border-radius:6px;padding:6px 10px;outline:none;font-size:13px}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blueg)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.canvas-wrap{flex:1;position:relative;overflow:hidden;touch-action:none}
.canvas-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#bgC{z-index:1}#mainC{z-index:2}#ovC{z-index:3;pointer-events:none}
.status{position:absolute;top:10px;right:10px;z-index:50;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);padding:6px 12px;border-radius:8px;border:1px solid var(--bd);font-size:12px;color:#111827;font-family:var(--m)}
.status span{display:flex;align-items:center;gap:4px}
.obj-panel{position:absolute;top:10px;left:10px;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:8px;max-width:180px;max-height:260px;overflow-y:auto}
.obj-panel-h{padding:6px 10px;border-bottom:1px solid var(--bd);font-size:12px;font-weight:600;color:#111827}
.obj-item{padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.04)}
.obj-item.sel{background:var(--blueg);color:var(--blue)}
.obj-item .od{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.obj-item .on{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj-item .ox{color:var(--td);font-size:16px;padding:2px 6px;cursor:pointer}
.func-panel{border-top:1px solid var(--bd);background:#fafafa;flex-shrink:0;padding:6px 12px;display:flex;flex-direction:column;gap:4px}
.func-btn-row{display:flex;gap:4px;align-items:center}
.func-type-btn{padding:5px 14px;border-radius:6px;font-size:13px;font-weight:600;border:2px solid var(--bd);transition:all .15s;white-space:nowrap;color:#111827}
.func-type-btn:active{transform:scale(.95)}
.func-type-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.func-content{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:#fff;border-radius:6px;border:1px solid var(--bd)}
.func-content.on{display:flex}
.func-label{font-size:13px;color:var(--t);font-weight:600;white-space:nowrap;font-family:var(--m)}
.func-coeffs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.func-coeff{display:flex;align-items:center;gap:4px}
.func-coeff label{font-size:13px;color:#111827;font-weight:600;min-width:14px;font-family:var(--m)}
.func-coeff input[type="number"]{width:50px;padding:4px;font-size:12px;text-align:center;font-family:var(--m)}
.func-coeff input[type="range"]{width:90px;height:5px;-webkit-appearance:none;background:var(--bd);border-radius:3px;outline:none}
.func-coeff input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.func-actions{display:flex;gap:4px;margin-left:auto}
.func-btn{padding:5px 14px;border-radius:5px;font-size:12px;font-weight:600;transition:all .1s;white-space:nowrap}
.draw-btn{background:var(--blue);color:#fff}.draw-btn:active{background:#1d4ed8}
.demo-btn{background:#059669;color:#fff}.demo-btn:active{background:#047857}
.demo-btn.active{background:var(--red)}
.func-list{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto}
.func-tag{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-family:var(--m);background:rgba(0,0,0,.04);white-space:nowrap;color:#111827}
.func-tag .dot{width:7px;height:7px;border-radius:50%}
.func-tag .x{cursor:pointer;color:var(--td);font-size:14px;padding:0 3px}
.demo-overlay{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:10px;padding:10px 16px;display:none;flex-direction:column;gap:6px;min-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.demo-overlay.on{display:flex}
.demo-overlay .demo-title{font-size:13px;font-weight:700;color:var(--t);font-family:var(--m);text-align:center}
.demo-overlay .demo-sliders{display:flex;flex-direction:column;gap:4px}
.demo-overlay .demo-row{display:flex;align-items:center;gap:6px}
.demo-overlay .demo-row label{font-size:13px;font-weight:600;color:#111827;min-width:16px;font-family:var(--m)}
.demo-overlay .demo-row input[type="range"]{flex:1;height:5px;-webkit-appearance:none;background:var(--bd);border-radius:3px;outline:none}
.demo-overlay .demo-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.demo-overlay .demo-row .demo-val{font-size:12px;font-family:var(--m);color:var(--t);min-width:32px;text-align:right}
.demo-overlay .demo-close{align-self:center;padding:4px 16px;border-radius:5px;font-size:11px;font-weight:600;background:var(--red);color:#fff;margin-top:2px}
.toolbar{background:#fff;border-top:1px solid var(--bd);flex-shrink:0;box-shadow:0 -1px 6px rgba(0,0,0,.04);position:relative;overflow:visible}
.toolbar-row{display:flex;align-items:center;padding:5px 8px;gap:3px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.toolbar-row::-webkit-scrollbar{height:0}
.tb{min-width:34px;height:34px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:15px;transition:all .08s;border:1.5px solid transparent;flex-shrink:0;padding:1px 3px}
.tb:active{background:rgba(0,0,0,.08);transform:scale(.92)}
.tb.on{background:var(--blueg);border-color:var(--blue);color:var(--blue)}
.tb-l{font-size:9px;color:var(--td);font-weight:600;line-height:1}
.tb.on .tb-l{color:var(--blue)}
.tsep{width:1px;height:28px;background:var(--bd);flex-shrink:0;margin:0 2px}
/* Auto-hide toolbar in fullscreen */
.toolbar-row.auto-hidden,.func-panel.auto-hidden{transform:translateY(100%);opacity:0;pointer-events:none}
.toolbar-row{transition:transform .3s ease,opacity .3s ease}
.toolbar-trigger{position:fixed;bottom:0;left:0;right:0;height:40px;z-index:50}
.tg{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;border:1.5px solid var(--bd);transition:all .08s;white-space:nowrap;flex-shrink:0;color:#111827}
.tg:active{transform:scale(.95)}
.tg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ab{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .08s;border:1.5px solid var(--bd);flex-shrink:0}
.ab:active{background:rgba(0,0,0,.08);transform:scale(.92)}
.unfold-panel{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);z-index:70;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;display:none;flex-direction:column;gap:8px;max-width:90vw;max-height:70vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.unfold-panel.on{display:flex}
.unfold-panel .up-title{font-size:12px;font-weight:700;color:var(--t);text-align:center}
.unfold-panel .up-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.unfold-panel .up-shape{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;border:1.5px solid var(--bd);cursor:pointer;transition:all .1s;white-space:nowrap}
.unfold-panel .up-shape:active{transform:scale(.95)}
.unfold-panel .up-shape.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.unfold-panel .up-nets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.unfold-panel .up-net{width:96px;height:96px;border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .1s;flex-direction:column;gap:2px;padding:4px}
.unfold-panel .up-net:active{transform:scale(.95)}
.unfold-panel .up-net.on{border-color:var(--blue);background:var(--blueg)}
.unfold-panel .up-net svg{display:block}
.unfold-panel .up-close{align-self:center;padding:4px 16px;border-radius:5px;font-size:11px;font-weight:600;background:#6b7280;color:#fff}
.pen-color-row{position:absolute;z-index:80;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;display:none;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);flex-wrap:wrap}
.pen-color-row.on{display:flex}
.pen-color-row .pcp-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .1s;flex-shrink:0}
.pen-color-row .pcp-swatch:active{transform:scale(.9)}
.pen-color-row .pcp-swatch.on{border-color:#111827;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.pen-color-row .pcp-custom{display:flex;align-items:center;gap:4px}
.pen-color-row .pcp-custom label{font-size:11px;font-weight:600;color:#111827}
.pen-color-row .pcp-custom input[type="color"]{width:28px;height:26px;border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;padding:1px}
.pen-color-row .pcp-close{padding:4px 12px;border-radius:5px;font-size:10px;font-weight:600;background:#6b7280;color:#fff;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
  <div class="canvas-wrap" id="cw">
    <canvas id="bgC"></canvas>
    <canvas id="mainC"></canvas>
    <canvas id="ovC"></canvas>
    <div class="status"><span id="sHint">选择工具开始作图</span><span id="sCoord">(0, 0)</span><span id="sZoom">100%</span><span id="s3D" style="display:none;color:var(--blue)">3D视角 ← → ↑ ↓</span></div>
    <div class="unfold-panel" id="unfoldPanel">
      <div class="up-title">选择几何体展开图</div>
      <div class="up-row" id="upShapes"></div>
      <div class="up-nets" id="upNets"></div>
      <button class="up-close" id="upClose">关闭</button>
    </div>
  </div>
  <div class="func-panel" id="funcPanel">
    <div class="func-btn-row">
      <button class="func-type-btn" data-ft="linear">一次函数</button>
      <button class="func-type-btn" data-ft="quadratic">二次函数</button>
      <button class="func-type-btn" data-ft="inverse">反比例函数</button>
    </div>
    <div class="func-content" id="fc-linear">
      <span class="func-label">y = kx + b</span>
      <div class="func-coeffs">
        <div class="func-coeff"><label>k</label><input type="number" id="lk" value="1" step="0.5"><input type="range" id="lks" min="-20" max="20" step="0.1" value="1"></div>
        <div class="func-coeff"><label>b</label><input type="number" id="lb" value="0" step="0.5"><input type="range" id="lbs" min="-20" max="20" step="0.1" value="0"></div>
      </div>
      <div class="func-actions"><button class="func-btn draw-btn" data-ft="linear">绘制</button><button class="func-btn demo-btn" data-ft="linear">演示</button></div>
    </div>
    <div class="func-content" id="fc-quadratic">
      <div style="display:flex;flex-direction:column;gap:6px;width:100%">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="func-label" id="qFormLabel">y = ax² + bx + c</span>
          <select id="qFormSelect" style="font-size:11px;padding:3px 6px;border:1px solid var(--bd);border-radius:4px;font-family:var(--m)">
            <option value="general">一般式 y=ax²+bx+c</option>
            <option value="vertex_hk">顶点式 y=a(x-h)²+k</option>
            <option value="vertex_simple">顶点式 y=a(x-h)²</option>
            <option value="simple">y=ax²</option>
            <option value="shift_c">y=ax²+c</option>
            <option value="intercept">交点式 y=a(x-x₁)(x-x₂)</option>
            <option value="no_c">y=ax²+bx</option>
          </select>
        </div>
        <div class="func-coeffs" id="qCoeffs"></div>
        <div class="func-actions"><button class="func-btn draw-btn" data-ft="quadratic">绘制</button><button class="func-btn demo-btn" data-ft="quadratic">演示</button></div>
      </div>
    </div>
    <div class="func-content" id="fc-inverse">
      <span class="func-label">y = k/x</span>
      <div class="func-coeffs">
        <div class="func-coeff"><label>k</label><input type="number" id="ik" value="1" step="0.5"><input type="range" id="iks" min="-20" max="20" step="0.1" value="1"></div>
      </div>
      <div class="func-actions"><button class="func-btn draw-btn" data-ft="inverse">绘制</button><button class="func-btn demo-btn" data-ft="inverse">演示</button></div>
    </div>
    <div class="func-list" id="funcList"></div>
  </div>
  <div class="toolbar" id="toolbarEl">
    <div class="pen-color-row" id="penColorRow">
      <div id="pcpSwatches" style="display:flex;gap:6px;align-items:center"></div>
      <div class="pcp-custom"><label>自定义</label><input type="color" id="pcpCustom" value="#2563eb"></div>
      <button class="pcp-close" id="pcpClose">关闭</button>
    </div>
    <div class="toolbar-row" id="toolRow"></div>
  </div>
</div>
<script>
// ============================================================
// MathLab v8.0 - Complete rewrite with fixes
// ============================================================
const bgC=document.getElementById('bgC'),mainC=document.getElementById('mainC'),ovC=document.getElementById('ovC');
const bgX=bgC.getContext('2d'),mx=mainC.getContext('2d'),ox=ovC.getContext('2d');
const cw=document.getElementById('cw');
let dpr=window.devicePixelRatio||1;

const G={
  ox:0,oy:0,scale:40,tool:'move',color:'#2563eb',
  objs:[],nextId:1,selected:null,hovered:null,
  tempPts:[],dragging:false,dragObj:null,dragOff:{x:0,y:0},
  panning:false,panSX:0,panSY:0,panOX:0,panOY:0,
  mpx:0,mpy:0,mmx:0,mmy:0,
  fhPts:[],pointerDown:false,
  showGrid:false,showAxes:false,showNumberLine:false,snap:false,smartDraw:false,
  undoStack:[],redoStack:[],
  funcs:[],pointN:0,
  drawState:null,demo:null,
  measureResult:null,
  eraserSize:40,eraserActive:false,_eraserRaf:null,_eraserDirty:false,_eraserPx:0,_eraserPy:0,_eraserSaved:false,
  // Rotation state
  rotating:false,rotPivot:null,rotOrig:null,rotCenter:null,
  // 3D view angles for shapes
  viewAngleX:0.5,viewAngleY:0.6,
  // Selected 3D shape rotation
  sel3DRot:false,sel3DObj:null,sel3DAngleX:0,sel3DAngleY:0
};

function m2p(x,y){return{x:G.ox+x*G.scale,y:G.oy-y*G.scale}}
function p2m(px,py){return{x:(px-G.ox)/G.scale,y:(G.oy-py)/G.scale}}
function snapPt(m){
  if(!G.snap)return{x:Math.round(m.x*100)/100,y:Math.round(m.y*100)/100};
  const sx=Math.round(m.x),sy=Math.round(m.y);
  if(Math.abs(m.x-sx)<0.18&&Math.abs(m.y-sy)<0.18)return{x:sx,y:sy};
  return{x:Math.round(m.x*10)/10,y:Math.round(m.y*10)/10};
}

function resize(){
  dpr=window.devicePixelRatio||1;
  const w=cw.clientWidth,h=cw.clientHeight;
  [bgC,mainC,ovC].forEach(c=>{
    c.width=w*dpr;c.height=h*dpr;
    c.style.width=w+'px';c.style.height=h+'px';
  });
  bgX.setTransform(dpr,0,0,dpr,0,0);
  mx.setTransform(dpr,0,0,dpr,0,0);
  ox.setTransform(dpr,0,0,dpr,0,0);
  if(G.ox===0){G.ox=w/2;G.oy=h/2}
  drawBg();draw();
}

function drawBg(){
  const W=cw.clientWidth,H=cw.clientHeight;
  bgX.clearRect(0,0,W,H);
  if(G.showGrid){
    bgX.strokeStyle='#a8adb5';bgX.lineWidth=0.8;
    const sc=G.scale;
    for(let x=G.ox%sc;x<W;x+=sc){bgX.beginPath();bgX.moveTo(x,0);bgX.lineTo(x,H);bgX.stroke()}
    for(let y=G.oy%sc;y<H;y+=sc){bgX.beginPath();bgX.moveTo(0,y);bgX.lineTo(W,y);bgX.stroke()}
  }
  if(G.showAxes){
    bgX.strokeStyle='#0f172a';bgX.lineWidth=2;
    bgX.beginPath();bgX.moveTo(0,G.oy);bgX.lineTo(W,G.oy);bgX.stroke();
    bgX.beginPath();bgX.moveTo(G.ox,0);bgX.lineTo(G.ox,H);bgX.stroke();
    bgX.fillStyle='#0f172a';
    bgX.beginPath();bgX.moveTo(W-1,G.oy);bgX.lineTo(W-10,G.oy-4);bgX.lineTo(W-10,G.oy+4);bgX.fill();
    bgX.beginPath();bgX.moveTo(G.ox,1);bgX.lineTo(G.ox-4,10);bgX.lineTo(G.ox+4,10);bgX.fill();
    // X-axis: tick marks above only, numbers below
    bgX.strokeStyle='#0f172a';bgX.lineWidth=1.5;
    bgX.fillStyle='#0f172a';bgX.font='bold 11px JetBrains Mono';
    bgX.textAlign='center';bgX.textBaseline='top';
    const ixMin=Math.ceil(-G.ox/G.scale),ixMax=Math.floor((W-G.ox)/G.scale);
    for(let i=ixMin;i<=ixMax;i++){
      if(i===0)continue;
      const px=G.ox+i*G.scale;
      // Tick mark above x-axis only
      bgX.beginPath();bgX.moveTo(px,G.oy-5);bgX.lineTo(px,G.oy);bgX.stroke();
      // Number below x-axis
      bgX.fillText(i,px,G.oy+5);
    }
    // Y-axis: tick marks right side only, numbers right of axis
    bgX.textAlign='left';bgX.textBaseline='middle';
    const iyMin=Math.ceil(-(H-G.oy)/G.scale),iyMax=Math.floor(G.oy/G.scale);
    for(let i=iyMin;i<=iyMax;i++){
      if(i===0)continue;
      const py=G.oy-i*G.scale;
      // Tick mark right of y-axis only
      bgX.beginPath();bgX.moveTo(G.ox,py);bgX.lineTo(G.ox+5,py);bgX.stroke();
      // Number right of y-axis
      bgX.fillText(i,G.ox+8,py);
    }
    bgX.textAlign='right';bgX.textBaseline='top';bgX.fillText('O',G.ox-5,G.oy+4);
    bgX.font='bold 13px JetBrains Mono';bgX.textAlign='left';bgX.textBaseline='middle';
    bgX.fillText('x',W-22,G.oy+16);
    bgX.textAlign='center';bgX.textBaseline='bottom';
    bgX.fillText('y',G.ox+14,16);
  }
  // Number line: only x-axis, with ticks above and numbers below
  if(G.showNumberLine){
    const axisY=G.oy;
    bgX.strokeStyle='#0f172a';bgX.lineWidth=2;
    // Main horizontal line
    bgX.beginPath();bgX.moveTo(0,axisY);bgX.lineTo(W,axisY);bgX.stroke();
    // Arrow at right end
    bgX.fillStyle='#0f172a';
    bgX.beginPath();bgX.moveTo(W-1,axisY);bgX.lineTo(W-10,axisY-4);bgX.lineTo(W-10,axisY+4);bgX.fill();
    // Tick marks and numbers
    bgX.strokeStyle='#0f172a';bgX.lineWidth=1.5;
    bgX.fillStyle='#0f172a';bgX.font='bold 12px JetBrains Mono';
    bgX.textAlign='center';bgX.textBaseline='top';
    const ixMin=Math.ceil(-G.ox/G.scale),ixMax=Math.floor((W-G.ox)/G.scale);
    for(let i=ixMin;i<=ixMax;i++){
      const px=G.ox+i*G.scale;
      // Tick mark above the line only
      bgX.beginPath();bgX.moveTo(px,axisY-6);bgX.lineTo(px,axisY);bgX.stroke();
      // Number below the line
      bgX.fillText(i,px,axisY+10);
    }
  }
}

function draw(){
  const W=cw.clientWidth,H=cw.clientHeight;
  mx.clearRect(0,0,W,H);
  G.funcs.forEach(f=>drawFunc(f));
  G.objs.forEach(o=>drawObj(o,o.id===G.selected,o.id===G.hovered));
  if(G.tempPts.length>0){
    G.tempPts.forEach(p=>{const pp=m2p(p.x,p.y);mx.fillStyle=G.color;mx.beginPath();mx.arc(pp.x,pp.y,5,0,Math.PI*2);mx.fill()});

  }
  drawOverlay();

  const has3D=G.objs.some(o=>['box','cylinder','cone','sphere'].includes(o.type));
  document.getElementById('s3D').style.display=has3D?'inline':'none';

function drawObj(o,sel,hov){

    }

    }

      const dx3d=Math.cos(va)*d*0.5,dy3d=Math.sin(va)*d*0.5;
      const p1=m2p(x,y+h),p2=m2p(x+w,y+h),p3=m2p(x+w,y),p4=m2p(x,y);
      const p5=m2p(x+dx3d,y+h+dy3d),p6=m2p(x+w+dx3d,y+h+dy3d),p7=m2p(x+w+dx3d,y+dy3d),p8=m2p(x+dx3d,y+dy3d);

      else{mx.beginPath();mx.moveTo(p1.x,p1.y);mx.lineTo(p5.x,p5.y);mx.stroke();mx.beginPath();mx.moveTo(p2.x,p2.y);mx.lineTo(p6.x,p6.y);mx.stroke()}

      }

        mx.fillStyle='#0f172a';mx.font='bold 13px Noto Sans SC';mx.textAlign='center';mx.textBaseline='bottom';
        // Front face labels
        mx.fillText(o.labels[0]||'',p1.x-10,p1.y-5); // bottom-left
        mx.fillText(o.labels[1]||'',p2.x+10,p2.y-5); // bottom-right
        mx.fillText(o.labels[2]||'',p3.x+10,p3.y+15); // top-right
        mx.fillText(o.labels[3]||'',p4.x-10,p4.y+15); // top-left
        // Back face labels
        if(o.labels[4])mx.fillText(o.labels[4],p5.x-10,p5.y-5); // back bottom-left
        if(o.labels[5])mx.fillText(o.labels[5],p6.x+10,p6.y-5); // back bottom-right
        if(o.labels[6])mx.fillText(o.labels[6],p7.x+10,p7.y+15); // back top-right

      mx.setLineDash([6,4]);mx.strokeStyle=(sel?'#2563eb':hov?'#60a5fa':c)+'80';mx.lineWidth=1.5;

        mx.arc(c_.x,c_.y,r,sa,ea,anticlockwise);
        mx.stroke();
      }
      if(sel){mx.fillStyle='#2563eb';mx.beginPath();mx.arc(c_.x,c_.y,4,0,Math.PI*2);mx.fill()}
      break;
    }
  }
  mx.restore();
}

function drawFunc(f){
  const W=cw.clientWidth;mx.strokeStyle=f.color;mx.lineWidth=2.5;mx.beginPath();let started=false;
  for(let px=0;px<W;px++){
    const mathX=(px-G.ox)/G.scale;
    try{
      const mathY=f.compiled.evaluate({x:mathX});
      if(!isFinite(mathY)||Math.abs(mathY)>1e6){started=false;continue}
      const py=G.oy-mathY*G.scale;
      if(py<-1000||py>cw.clientHeight+1000){started=false;continue}
      if(!started){mx.moveTo(px,py);started=true}else mx.lineTo(px,py);
    }catch(e){started=false}
  }
  mx.stroke();
}

function drawPreview(){
  if(G.tempPts.length===0)return;
  const last=snapPt({x:G.mmx,y:G.mmy}),lastP=m2p(last.x,last.y);
  mx.strokeStyle=G.color;mx.lineWidth=2;mx.setLineDash([5,4]);
  const tool=G.tool;
  if(G.tempPts.length===1){
    const p=m2p(G.tempPts[0].x,G.tempPts[0].y);
    if(['segment','line','ray','perp','parallel','midperp','polygon'].includes(tool)){mx.beginPath();mx.moveTo(p.x,p.y);mx.lineTo(lastP.x,lastP.y);mx.stroke()}
    else if(tool==='circle'){const r=Math.hypot(last.x-G.tempPts[0].x,last.y-G.tempPts[0].y)*G.scale;mx.beginPath();mx.arc(p.x,p.y,r,0,Math.PI*2);mx.stroke()}
  }else if(G.tempPts.length===2){
    const p1=m2p(G.tempPts[0].x,G.tempPts[0].y),p2=m2p(G.tempPts[1].x,G.tempPts[1].y);
    if(tool==='triangle'){mx.beginPath();mx.moveTo(p1.x,p1.y);mx.lineTo(p2.x,p2.y);mx.lineTo(lastP.x,lastP.y);mx.closePath();mx.stroke()}
    else if(tool==='bisect'){mx.beginPath();mx.moveTo(p1.x,p1.y);mx.lineTo(p2.x,p2.y);mx.stroke();mx.beginPath();mx.moveTo(p1.x,p1.y);mx.lineTo(lastP.x,lastP.y);mx.stroke()}
  }else if(G.tempPts.length===3){
    const pts=G.tempPts.map(p=>m2p(p.x,p.y));
    if(tool==='quad'){mx.beginPath();pts.forEach((p,i)=>{if(i===0)mx.moveTo(p.x,p.y);else mx.lineTo(p.x,p.y)});mx.lineTo(lastP.x,lastP.y);mx.stroke()}
  }
  mx.setLineDash([]);
}

function drawOverlay(){
  const W=cw.clientWidth,H=cw.clientHeight;
  ox.clearRect(0,0,W,H);
  
  // Eraser preview: show eraser circle at mouse position
  if(G.tool==='eraser'){
    const mp=m2p(G.mmx,G.mmy);
    ox.strokeStyle='rgba(220,38,38,0.6)';ox.lineWidth=2;ox.setLineDash([4,4]);
    ox.beginPath();ox.arc(mp.x,mp.y,G.eraserSize,0,Math.PI*2);ox.stroke();
    ox.setLineDash([]);
    // Fill with semi-transparent red
    ox.fillStyle='rgba(220,38,38,0.1)';
    ox.beginPath();ox.arc(mp.x,mp.y,G.eraserSize,0,Math.PI*2);ox.fill();
    // Draw crosshair in center
    ox.strokeStyle='rgba(220,38,38,0.8)';ox.lineWidth=1.5;
    ox.beginPath();ox.moveTo(mp.x-8,mp.y);ox.lineTo(mp.x+8,mp.y);ox.stroke();
    ox.beginPath();ox.moveTo(mp.x,mp.y-8);ox.lineTo(mp.x,mp.y+8);ox.stroke();
  }
  
  if(!G.drawState)return;
  const ds=G.drawState;
  const cur=snapPt({x:G.mmx,y:G.mmy});
  const curP=m2p(cur.x,cur.y);

  if(ds.type==='ruler'&&ds.pts.length===1){
    const p1=m2p(ds.pts[0].x,ds.pts[0].y);
    const dx=curP.x-p1.x,dy=curP.y-p1.y,len=Math.hypot(dx,dy);
    if(len>5){
      const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;const rw=22;
      ox.fillStyle='rgba(253,224,71,0.5)';ox.strokeStyle='#a16207';ox.lineWidth=1.5;
      ox.beginPath();
      ox.moveTo(p1.x+nx*rw,p1.y+ny*rw);ox.lineTo(curP.x+nx*rw,curP.y+ny*rw);
      ox.lineTo(curP.x-nx*rw,curP.y-ny*rw);ox.lineTo(p1.x-nx*rw,p1.y-ny*rw);
      ox.closePath();ox.fill();ox.stroke();
      const tickSpacing=G.scale*0.5;const numTicks=Math.floor(len/tickSpacing);
      ox.strokeStyle='#713f12';ox.lineWidth=1;
      for(let i=0;i<=numTicks;i++){
        const t=i*tickSpacing;const tx=p1.x+ux*t,ty=p1.y+uy*t;const tickLen=(i%2===0)?12:6;
        ox.beginPath();ox.moveTo(tx+nx*(rw-tickLen),ty+ny*(rw-tickLen));ox.lineTo(tx+nx*rw,ty+ny*rw);ox.stroke();
      }
      ox.strokeStyle='#92400e';ox.lineWidth=1.2;
      ox.beginPath();ox.moveTo(p1.x+nx*rw,p1.y+ny*rw);ox.lineTo(curP.x+nx*rw,curP.y+ny*rw);ox.stroke();
      ox.beginPath();ox.moveTo(p1.x-nx*rw,p1.y-ny*rw);ox.lineTo(curP.x-nx*rw,curP.y-ny*rw);ox.stroke();
    }
  }

  if(ds.type==='compass'){
    const p1=m2p(ds.center.x,ds.center.y);
    if(ds.step===1){
      const r=Math.hypot(cur.x-ds.center.x,cur.y-ds.center.y)*G.scale;
      ox.strokeStyle='#9ca3af';ox.lineWidth=1.5;ox.setLineDash([4,4]);
      ox.beginPath();ox.arc(p1.x,p1.y,r,0,Math.PI*2);ox.stroke();ox.setLineDash([]);
      const hingeX=p1.x,hingeY=p1.y-Math.max(r*0.4,25);
      ox.strokeStyle='#4b5563';ox.lineWidth=3;ox.lineCap='round';
      ox.beginPath();ox.moveTo(hingeX,hingeY);ox.lineTo(p1.x,p1.y);ox.stroke();
      ox.beginPath();ox.moveTo(hingeX,hingeY);ox.lineTo(curP.x,curP.y);ox.stroke();
      ox.fillStyle='#6b7280';ox.beginPath();ox.arc(hingeX,hingeY,5,0,Math.PI*2);ox.fill();
      ox.strokeStyle='#374151';ox.lineWidth=1;ox.beginPath();ox.arc(hingeX,hingeY,5,0,Math.PI*2);ox.stroke();
      ox.fillStyle='#374151';ox.beginPath();ox.arc(p1.x,p1.y,3,0,Math.PI*2);ox.fill();
      ox.fillStyle='#dc2626';ox.beginPath();ox.arc(curP.x,curP.y,4,0,Math.PI*2);ox.fill();
    }else if(ds.step===2&&ds.drawing){
      const r=ds.radius*G.scale;
      const currentAngleCanvas=ds.startAngleCanvas+ds.totalAngle;
      // Draw arc preview using accumulated angle
      const anticlockwise=ds.totalAngle<0;
      ox.strokeStyle=G.color;ox.lineWidth=2;
      ox.beginPath();
      ox.arc(p1.x,p1.y,r,ds.startAngleCanvas,currentAngleCanvas,anticlockwise);
      ox.stroke();
      // Compass visual
      const hingeX=p1.x,hingeY=p1.y-Math.max(r*0.4,25);
      const pencilX=p1.x+Math.cos(currentAngleCanvas)*r;
      const pencilY=p1.y+Math.sin(currentAngleCanvas)*r;
      ox.strokeStyle='#4b5563';ox.lineWidth=3;ox.lineCap='round';
      ox.beginPath();ox.moveTo(hingeX,hingeY);ox.lineTo(p1.x,p1.y);ox.stroke();
      ox.beginPath();ox.moveTo(hingeX,hingeY);ox.lineTo(pencilX,pencilY);ox.stroke();
      ox.fillStyle='#6b7280';ox.beginPath();ox.arc(hingeX,hingeY,5,0,Math.PI*2);ox.fill();
      ox.fillStyle='#374151';ox.beginPath();ox.arc(p1.x,p1.y,3,0,Math.PI*2);ox.fill();
      ox.fillStyle='#dc2626';ox.beginPath();ox.arc(pencilX,pencilY,4,0,Math.PI*2);ox.fill();
    }
  }

  // Triangle/quad multi-click preview
  if(ds.type==='triangle'&&ds.pts){
    const pts=ds.pts.map(p=>m2p(p.x,p.y));
    ox.strokeStyle=G.color;ox.lineWidth=1.5;ox.setLineDash([6,4]);
    pts.forEach(p=>{ox.fillStyle=G.color;ox.beginPath();ox.arc(p.x,p.y,5,0,Math.PI*2);ox.fill()});
    if(pts.length===1){ox.beginPath();ox.moveTo(pts[0].x,pts[0].y);ox.lineTo(curP.x,curP.y);ox.stroke()}
    else if(pts.length===2){ox.beginPath();ox.moveTo(pts[0].x,pts[0].y);ox.lineTo(pts[1].x,pts[1].y);ox.lineTo(curP.x,curP.y);ox.closePath();ox.stroke()}
    ox.setLineDash([]);
  }
  if(ds.type==='quad'&&ds.pts){
    const pts=ds.pts.map(p=>m2p(p.x,p.y));
    ox.strokeStyle=G.color;ox.lineWidth=1.5;ox.setLineDash([6,4]);
    pts.forEach(p=>{ox.fillStyle=G.color;ox.beginPath();ox.arc(p.x,p.y,5,0,Math.PI*2);ox.fill()});
    if(pts.length===1){ox.beginPath();ox.moveTo(pts[0].x,pts[0].y);ox.lineTo(curP.x,curP.y);ox.stroke()}
    else if(pts.length===2){ox.beginPath();ox.moveTo(pts[0].x,pts[0].y);ox.lineTo(pts[1].x,pts[1].y);ox.lineTo(curP.x,curP.y);ox.stroke()}
    else if(pts.length===3){ox.beginPath();pts.forEach((p,i)=>{if(i===0)ox.moveTo(p.x,p.y);else ox.lineTo(p.x,p.y)});ox.lineTo(curP.x,curP.y);ox.closePath();ox.stroke()}
    ox.setLineDash([]);
  }

  // Segment/line/ray preview
  if((ds.type==='segment'||ds.type==='line'||ds.type==='ray')&&ds.pts&&ds.pts.length===1){
    const p1=m2p(ds.pts[0].x,ds.pts[0].y);
    ox.strokeStyle=G.color;ox.lineWidth=2;ox.setLineDash([6,4]);
    ox.beginPath();ox.moveTo(p1.x,p1.y);ox.lineTo(curP.x,curP.y);ox.stroke();ox.setLineDash([]);
    ox.fillStyle=G.color;ox.beginPath();ox.arc(curP.x,curP.y,4,0,Math.PI*2);ox.fill();
  }

  // Circle preview
  if(ds.type==='circle'&&ds.pts&&ds.pts.length===1){
    const p1=m2p(ds.pts[0].x,ds.pts[0].y);
    const r=Math.hypot(cur.x-ds.pts[0].x,cur.y-ds.pts[0].y)*G.scale;
    ox.strokeStyle=G.color;ox.lineWidth=1.5;ox.setLineDash([6,4]);
    ox.beginPath();ox.arc(p1.x,p1.y,r,0,Math.PI*2);ox.stroke();ox.setLineDash([]);
    ox.strokeStyle='#9ca3af';ox.lineWidth=1;
    ox.beginPath();ox.moveTo(p1.x,p1.y);ox.lineTo(curP.x,curP.y);ox.stroke();
    ox.fillStyle=G.color;ox.beginPath();ox.arc(p1.x,p1.y,4,0,Math.PI*2);ox.fill();
  }

  // Sector preview
  if(ds.type==='sector'&&ds.pts&&ds.pts.length===1){
    const p1=m2p(ds.pts[0].x,ds.pts[0].y);
    const r=Math.hypot(cur.x-ds.pts[0].x,cur.y-ds.pts[0].y)*G.scale;
    const startAngle=Math.atan2(curP.y-p1.y,curP.x-p1.x);
    const endAngle=startAngle+Math.PI/2;
    ox.strokeStyle=G.color;ox.lineWidth=1.5;ox.setLineDash([6,4]);
    // Draw sector outline
    ox.fillStyle=G.color+'20';
    ox.beginPath();ox.moveTo(p1.x,p1.y);
    ox.arc(p1.x,p1.y,r,startAngle,endAngle);
    ox.closePath();ox.fill();
    ox.beginPath();ox.moveTo(p1.x,p1.y);
    ox.lineTo(p1.x+Math.cos(startAngle)*r,p1.y+Math.sin(startAngle)*r);
    ox.stroke();
    ox.beginPath();ox.moveTo(p1.x,p1.y);
    ox.lineTo(p1.x+Math.cos(endAngle)*r,p1.y+Math.sin(endAngle)*r);
    ox.stroke();
    ox.beginPath();ox.arc(p1.x,p1.y,r,startAngle,endAngle);ox.stroke();
    ox.setLineDash([]);
    ox.fillStyle=G.color;ox.beginPath();ox.arc(p1.x,p1.y,4,0,Math.PI*2);ox.fill();
  }

  // Box preview
  if(ds.type==='box'&&ds.pts&&ds.pts.length===1){
    const p1=m2p(ds.pts[0].x,ds.pts[0].y);
    ox.strokeStyle=G.color;ox.lineWidth=1.5;ox.setLineDash([6,4]);
    ox.strokeRect(p1.x,p1.y,curP.x-p1.x,curP.y-p1.y);ox.setLineDash([]);
  }

  // Cylinder/cone preview
  if((ds.type==='cylinder'||ds.type==='cone')&&ds.pts&&ds.pts.length===1){
    const p1=m2p(ds.pts[0].x,ds.pts[0].y);
    ox.strokeStyle=G.color;ox.lineWidth=1.5;ox.setLineDash([6,4]);
    const w=Math.abs(curP.x-p1.x),h=Math.abs(curP.y-p1.y);
    const cx=p1.x,cy=Math.min(p1.y,curP.y);
    const ey=Math.abs(Math.sin(G.viewAngleY))*0.5+0.1;
    ox.beginPath();ox.ellipse(cx,cy-h/2,w,w*ey,0,0,Math.PI*2);ox.stroke();
    ox.beginPath();ox.moveTo(cx-w,cy-h/2);ox.lineTo(cx-w,cy+h/2);ox.stroke();
    ox.beginPath();ox.moveTo(cx+w,cy-h/2);ox.lineTo(cx+w,cy+h/2);ox.stroke();
    if(ds.type==='cone'){ox.beginPath();ox.moveTo(cx-w,cy+h/2);ox.lineTo(cx,cy-h);ox.lineTo(cx+w,cy+h/2);ox.stroke()}
    ox.setLineDash([]);
  }

  // Sphere preview
  if(ds.type==='sphere'&&ds.pts&&ds.pts.length===1){
    const p1=m2p(ds.pts[0].x,ds.pts[0].y);
    const r=Math.hypot(cur.x-ds.pts[0].x,cur.y-ds.pts[0].y)*G.scale;
    ox.strokeStyle=G.color;ox.lineWidth=1.5;ox.setLineDash([6,4]);
    ox.beginPath();ox.arc(p1.x,p1.y,r,0,Math.PI*2);ox.stroke();ox.setLineDash([]);
  }

  // Measure preview
  if(ds.type==='measure'&&ds.pts){
    const pts=ds.pts.map(p=>m2p(p.x,p.y));
    ox.strokeStyle='#dc2626';ox.lineWidth=1.5;ox.setLineDash([4,3]);
    pts.forEach(p=>{ox.fillStyle='#dc2626';ox.beginPath();ox.arc(p.x,p.y,5,0,Math.PI*2);ox.fill()});
    if(pts.length===1){ox.beginPath();ox.moveTo(pts[0].x,pts[0].y);ox.lineTo(curP.x,curP.y);ox.stroke()}
    else if(pts.length===2){
      ox.beginPath();ox.moveTo(pts[0].x,pts[0].y);ox.lineTo(pts[1].x,pts[1].y);ox.lineTo(curP.x,curP.y);ox.stroke();
      // Show angle preview
      const v=ds.pts[0],a1=ds.pts[1];
      const d1x=a1.x-v.x,d1y=a1.y-v.y,d2x=cur.x-v.x,d2y=cur.y-v.y;
      const l1=Math.hypot(d1x,d1y),l2=Math.hypot(d2x,d2y);
      if(l1>0.01&&l2>0.01){
        const angle=Math.acos(Math.max(-1,Math.min(1,(d1x*d2x+d1y*d2y)/(l1*l2))))*180/Math.PI;
        ox.fillStyle='#dc2626';ox.font='bold 13px JetBrains Mono';ox.textAlign='center';
        const mid=m2p(v.x+(d1x/l1+d2x/l2)*0.8,v.y+(d1y/l1+d2y/l2)*0.8);
        ox.fillText(angle.toFixed(1)+'°',mid.x,mid.y-10);
      }
    }
    ox.setLineDash([]);
  }

  // Measure result display
  if(G.measureResult){
    const mr=G.measureResult;
    if(mr.type==='distance'){
      const a=m2p(mr.pts[0].x,mr.pts[0].y),b=m2p(mr.pts[1].x,mr.pts[1].y);
      ox.strokeStyle='#dc2626';ox.lineWidth=2;ox.setLineDash([]);
      ox.beginPath();ox.moveTo(a.x,a.y);ox.lineTo(b.x,b.y);ox.stroke();
      ox.fillStyle='#dc2626';ox.beginPath();ox.arc(a.x,a.y,5,0,Math.PI*2);ox.fill();
      ox.beginPath();ox.arc(b.x,b.y,5,0,Math.PI*2);ox.fill();
      // Distance label
      const dist=mr.dist;
      const midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
      ox.fillStyle='rgba(220,38,38,0.9)';
      const label='d = '+dist.toFixed(2);
      ox.font='bold 13px JetBrains Mono';
      const tw=ox.measureText(label).width;
      ox.fillStyle='rgba(255,255,255,0.9)';ox.fillRect(midX-tw/2-6,midY-22,tw+12,22);
      ox.strokeStyle='#dc2626';ox.lineWidth=1;ox.strokeRect(midX-tw/2-6,midY-22,tw+12,22);
      ox.fillStyle='#dc2626';ox.textAlign='center';ox.textBaseline='middle';
      ox.fillText(label,midX,midY-11);
    }else if(mr.type==='angle'){
      const v=m2p(mr.pts[0].x,mr.pts[0].y),a1=m2p(mr.pts[1].x,mr.pts[1].y),a2=m2p(mr.pts[2].x,mr.pts[2].y);
      ox.strokeStyle='#dc2626';ox.lineWidth=2;ox.setLineDash([]);
      ox.beginPath();ox.moveTo(a1.x,a1.y);ox.lineTo(v.x,v.y);ox.lineTo(a2.x,a2.y);ox.stroke();
      // Draw angle arc
      const ang1=Math.atan2(a1.y-v.y,a1.x-v.x),ang2=Math.atan2(a2.y-v.y,a2.x-v.x);
      const arcR=30;
      ox.beginPath();ox.arc(v.x,v.y,arcR,ang1,ang2,false);ox.stroke();
      // Angle label
      const label=mr.angle.toFixed(1)+'°';
      const midAng=(ang1+ang2)/2;
      const lx=v.x+Math.cos(midAng)*(arcR+20),ly=v.y+Math.sin(midAng)*(arcR+20);
      ox.fillStyle='rgba(255,255,255,0.9)';ox.font='bold 13px JetBrains Mono';
      const tw=ox.measureText(label).width;
      ox.fillRect(lx-tw/2-6,ly-11,tw+12,22);
      ox.strokeStyle='#dc2626';ox.lineWidth=1;ox.strokeRect(lx-tw/2-6,ly-11,tw+12,22);
      ox.fillStyle='#dc2626';ox.textAlign='center';ox.textBaseline='middle';
      ox.fillText(label,lx,ly);
      // Points
      ox.fillStyle='#dc2626';
      [v,a1,a2].forEach(p=>{ox.beginPath();ox.arc(p.x,p.y,4,0,Math.PI*2);ox.fill()});
    }
  }
}

// === UNFOLD BBOX HELPER ===
function getUnfoldBBox(o){
  if(o.type!=='unfold')return null;
  const s=o.size||1;
  if(o.shapeType==='cylinder'){return{x:o.x-s,y:o.y-2*s,w:3*s+2*s,h:2*s+4*s}}
  if(o.shapeType==='cone'){
    const coneR=o.coneR||1, coneH=o.coneH||2;
    const slantH=Math.sqrt(coneR*coneR+coneH*coneH);
    const sectorAngle=2*Math.PI*coneR/slantH;
    const sR=slantH*s, bR=coneR*s;
    // Sector vertex at (o.x+2.5*s, o.y+0.5*s), extends down by sR, then base circle
    const cx=o.x+2.5*s, cy=o.y+0.5*s;
    const startA=Math.PI/2-sectorAngle/2, endA=Math.PI/2+sectorAngle/2;
    const leftX=cx+Math.cos(startA)*sR;
    const rightX=cx+Math.cos(endA)*sR;
    const bottomY=cy+sR+bR+12/G.scale;
    return{x:Math.min(leftX,rightX)-0.5,y:cy-0.5,w:Math.abs(rightX-leftX)+1,h:(bottomY-cy)+1};
  }
  if(o.shapeType==='sector'){
    const secR=2*s;
    return{x:o.x,y:o.y,w:5*s,h:4*s};
  }
  if(o.net&&o.net.length>0){
    let minX=99,maxX=-99,minY=99,maxY=-99;
    o.net.forEach(([fx,fy])=>{minX=Math.min(minX,fx);maxX=Math.max(maxX,fx);minY=Math.min(minY,fy);maxY=Math.max(maxY,fy)});
    return{x:o.x+minX*s,y:o.y+minY*s,w:(maxX-minX+1)*s,h:(maxY-minY+1)*s};
  }
  return null;
}

// === HIT TESTING ===
function hitTest(px,py){
  const threshold=12;
  for(let i=G.objs.length-1;i>=0;i--){const o=G.objs[i];if(hitObj(o,px,py,threshold))return o}
  return null;
}
function hitObj(o,px,py,th){
  switch(o.type){
    case'point':{const p=m2p(o.x,o.y);return Math.hypot(px-p.x,py-p.y)<th}
    case'segment':case'line':case'ray':{const a=m2p(o.x1,o.y1),b=m2p(o.x2,o.y2);return distToSeg(px,py,a.x,a.y,b.x,b.y)<th}
    case'circle':{const c=m2p(o.cx,o.cy),r=o.r*G.scale;return Math.abs(Math.hypot(px-c.x,py-c.y)-r)<th}
    case'polygon':{for(let i=0;i<o.pts.length;i++){const j=(i+1)%o.pts.length;const a=m2p(o.pts[i].x,o.pts[i].y),b=m2p(o.pts[j].x,o.pts[j].y);if(distToSeg(px,py,a.x,a.y,b.x,b.y)<th)return true}return false}
    case'freehand':{for(const p of o.pts){const pp=m2p(p.x,p.y);if(Math.hypot(px-pp.x,py-pp.y)<th)return true}return false}
    case'ruler':{const a=m2p(o.x1,o.y1),b=m2p(o.x2,o.y2);return distToSeg(px,py,a.x,a.y,b.x,b.y)<24}
    case'box':{
      const{x,y,w,h}=o;
      const p1=m2p(x,y+h),p2=m2p(x+w,y+h),p3=m2p(x+w,y),p4=m2p(x,y);
      return distToSeg(px,py,p1.x,p1.y,p2.x,p2.y)<th||distToSeg(px,py,p2.x,p2.y,p3.x,p3.y)<th||distToSeg(px,py,p3.x,p3.y,p4.x,p4.y)<th||distToSeg(px,py,p4.x,p4.y,p1.x,p1.y)<th;
    }
    case'arc':{
      const c=m2p(o.cx,o.cy),r=o.r*G.scale;
      const d=Math.hypot(px-c.x,py-c.y);
      if(Math.abs(d-r)>th)return false;
      const angle=Math.atan2(py-c.y,px-c.x);
      if(o.startAngleCanvas!==undefined){
        // New format: check if angle is within the swept arc
        let sa=o.startAngleCanvas,ea=o.endAngleCanvas;
        const ac=o.anticlockwise;
        // Normalize all to [0, 2π)
        const norm=a=>{a=a%(2*Math.PI);return a<0?a+2*Math.PI:a};
        const na=norm(angle),ns=norm(sa),ne=norm(ea);
        if(ac){
          // Counterclockwise sweep: from sa to ea going CCW
          // Equivalent to clockwise from ea to sa
          if(ns<ne)return na>=ns&&na<=ne?false:na>=ne||na<=ns?true:false;
          // Actually, simpler: check if angle is on the arc
          // For CCW from sa to ea, the arc covers angles NOT in the CW range from sa to ea
          // Let's just use a different approach: check if the point angle is within the sweep
          const sweep=sa-ea; // positive for CCW
          let diff=na-ns;while(diff<0)diff+=2*Math.PI;while(diff>=2*Math.PI)diff-=2*Math.PI;
          let totalSweep=Math.abs(sweep)%(2*Math.PI);if(totalSweep<0.001)totalSweep=2*Math.PI;
          return diff<=totalSweep+0.01;
        }else{
          // Clockwise sweep: from sa to ea going CW
          let diff=na-ns;while(diff<0)diff+=2*Math.PI;while(diff>=2*Math.PI)diff-=2*Math.PI;
          let totalSweep=(ne-ns+2*Math.PI)%(2*Math.PI);if(totalSweep<0.001)totalSweep=2*Math.PI;
          return diff<=totalSweep+0.01;
        }
      }else{
        // Legacy format
        let start=-o.startAngle,end=-o.endAngle;
        while(start<0)start+=Math.PI*2;while(end<0)end+=Math.PI*2;
        let a=angle;while(a<0)a+=2*Math.PI;
        if(start<end)return a>=start&&a<=end;
        else return a>=start||a<=end;
      }
    }
    case'sector':{
      const c=m2p(o.cx,o.cy),r=o.r*G.scale;
      const d=Math.hypot(px-c.x,py-c.y);
      // Check if point is within the sector area (inside radius and within angle range)
      if(d>r+th)return false;
      // Check if within angle range
      const angle=Math.atan2(py-c.y,px-c.x);
      const norm=a=>{a=a%(2*Math.PI);return a<0?a+2*Math.PI:a};
      const na=norm(angle),ns=norm(o.startAngleCanvas),ne=norm(o.endAngleCanvas);
      let inAngle;
      if(ns<ne)inAngle=na>=ns&&na<=ne;
      else inAngle=na>=ns||na<=ne;
      if(!inAngle)return false;
      // Check if on the boundary (arc or radii)
      if(Math.abs(d-r)<th)return true; // on arc
      // Check if on one of the radii
      const p1x=c.x+Math.cos(o.startAngleCanvas)*r,p1y=c.y+Math.sin(o.startAngleCanvas)*r;
      const p2x=c.x+Math.cos(o.endAngleCanvas)*r,p2y=c.y+Math.sin(o.endAngleCanvas)*r;
      if(distToSeg(px,py,c.x,c.y,p1x,p1y)<th)return true;
      if(distToSeg(px,py,c.x,c.y,p2x,p2y)<th)return true;
      // Check if inside the sector fill
      return d<=r;
    }
    case'unfold':{
      const bb=getUnfoldBBox(o);
      if(!bb)return false;
      const p1=m2p(bb.x,bb.y+bb.h),p2=m2p(bb.x+bb.w,bb.y);
      return px>=p1.x&&px<=p2.x&&py>=p2.y&&py<=p1.y;
    }
  }
  return false;
}

// === BLACKBOARD ERASER: splits objects, only removes what it touches ===

// Convert math coords to pixel coords
function _m2px(x,y){return{x:G.ox+x*G.scale,y:G.oy-y*G.scale}}
// Convert pixel coords to math coords
function _px2m(px,py){return{x:(px-G.ox)/G.scale,y:(G.oy-py)/G.scale}}

// Find t values where line segment (ax,ay)→(bx,by) intersects circle (cx,cy,r)
function _segCircleTs(ax,ay,bx,by,cx,cy,r){
  const dx=bx-ax,dy=by-ay,fx=ax-cx,fy=ay-cy;
  const A=dx*dx+dy*dy,B=2*(fx*dx+fy*dy),C=fx*fx+fy*fy-r*r;
  if(A<1e-12)return[];
  const disc=B*B-4*A*C;
  if(disc<0)return[];
  const sq=Math.sqrt(disc);
  const t1=(-B-sq)/(2*A),t2=(-B+sq)/(2*A);
  const ts=[];
  if(t1>0.001&&t1<0.999)ts.push(t1);
  if(t2>0.001&&t2<0.999&&Math.abs(t2-t1)>0.001)ts.push(t2);
  return ts.sort((a,b)=>a-b);
}

// Clip a finite segment to the part(s) outside circle → array of {x1,y1,x2,y2} in math coords
function _clipSegCircle(mx1,my1,mx2,my2,ecx,ecy,r){
  const p1=_m2px(mx1,my1),p2=_m2px(mx2,my2);
  const d1=Math.hypot(p1.x-ecx,p1.y-ecy),d2=Math.hypot(p2.x-ecx,p2.y-ecy);
  const in1=d1<r,in2=d2<r;
  if(in1&&in2)return[]; // entirely inside
  if(!in1&&!in2){
    const ts=_segCircleTs(p1.x,p1.y,p2.x,p2.y,ecx,ecy,r);
    if(ts.length<2)return[{x1:mx1,y1:my1,x2:mx2,y2:my2}]; // no intersection
    const e1x=p1.x+ts[0]*(p2.x-p1.x),e1y=p1.y+ts[0]*(p2.y-p1.y);
    const e2x=p1.x+ts[1]*(p2.x-p1.x),e2y=p1.y+ts[1]*(p2.y-p1.y);
    const m1=_px2m(e1x,e1y),m2=_px2m(e2x,e2y);
    return[{x1:mx1,y1:my1,x2:m1.x,y2:m1.y},{x1:m2.x,y2:m2.y,x2:mx2,y2:my2}];
  }
  // One end inside, one outside
  const ts=_segCircleTs(p1.x,p1.y,p2.x,p2.y,ecx,ecy,r);
  if(ts.length===0)return in1?[]:[{x1:mx1,y1:my1,x2:mx2,y2:my2}];
  const t=ts[0];
  const ex=p1.x+t*(p2.x-p1.x),ey=p1.y+t*(p2.y-p1.y);
  const em=_px2m(ex,ey);
  if(in1)return[{x1:em.x,y1:em.y,x2:mx2,y2:my2}];
  return[{x1:mx1,y1:my1,x2:em.x,y2:em.y}];
}

// Clip an infinite line (extend far beyond canvas)
function _clipLineCircle(mx1,my1,mx2,my2,ecx,ecy,r){
  const p1=_m2px(mx1,my1),p2=_m2px(mx2,my2);
  const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy);
  if(len<0.01)return[{x1:mx1,y1:my1,x2:mx2,y2:my2}];
  const ux=dx/len,uy=dy/len;
  const fx=p1.x-ecx,fy=p1.y-ecy;
  const B=2*(fx*ux+fy*uy),C=fx*fx+fy*fy-r*r;
  const disc=B*B-4*C;
  if(disc<0)return[{x1:mx1,y1:my1,x2:mx2,y2:my2}];
  const sq=Math.sqrt(disc);
  const t1=(-B-sq)/2,t2=(-B+sq)/2;
  const ext=6000;
  const s1=_px2m(p1.x+ux*t1,p1.y+uy*t1);
  const s2=_px2m(p1.x+ux*t2,p1.y+uy*t2);
  const far1=_px2m(p1.x-ux*ext,p1.y-uy*ext);
  const far2=_px2m(p1.x+ux*ext,p1.y+uy*ext);
  return[{x1:far1.x,y1:far1.y,x2:s1.x,y2:s1.y},{x1:s2.x,y1:s2.y,x2:far2.x,y2:far2.y}];
}

// Clip a ray (from p1 through p2, extending to infinity)
function _clipRayCircle(mx1,my1,mx2,my2,ecx,ecy,r){
  const p1=_m2px(mx1,my1),p2=_m2px(mx2,my2);
  const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy);
  if(len<0.01)return[{x1:mx1,y1:my1,x2:mx2,y2:my2}];
  const ux=dx/len,uy=dy/len;
  const fx=p1.x-ecx,fy=p1.y-ecy;
  const B=2*(fx*ux+fy*uy),C=fx*fx+fy*fy-r*r;
  const disc=B*B-4*C;
  const ext=6000;
  if(disc<0)return[{x1:mx1,y1:my1,x2:mx2,y2:my2}];
  const sq=Math.sqrt(disc);
  const t1=(-B-sq)/2,t2=(-B+sq)/2;
  const far=_px2m(p1.x+ux*ext,p1.y+uy*ext);
  if(t1<0&&t2<0)return[{x1:mx1,y1:my1,x2:mx2,y2:my2}]; // circle behind ray
  if(t1<0){
    // Ray starts inside circle, exits at t2
    const ex=_px2m(p1.x+ux*t2,p1.y+uy*t2);
    return[{x1:ex.x,y1:ex.y,x2:far.x,y2:far.y}];
  }
  // Both intersections ahead
  const s1=_px2m(p1.x+ux*t1,p1.y+uy*t1);
  const s2=_px2m(p1.x+ux*t2,p1.y+uy*t2);
  return[{x1:mx1,y1:my1,x2:s1.x,y2:s1.y},{x1:s2.x,y1:s2.y,x2:far.x,y2:far.y}];
}

// Check if angle is between a and b going clockwise (canvas convention)
function _angleBetweenCW(angle,a,b){
  angle=((angle%(2*Math.PI))+(2*Math.PI))%(2*Math.PI);
  a=((a%(2*Math.PI))+(2*Math.PI))%(2*Math.PI);
  b=((b%(2*Math.PI))+(2*Math.PI))%(2*Math.PI);
  if(a<=b)return angle>=a&&angle<=b;
  return angle>=a||angle<=b;
}

// Clip a circle → returns array of arc objects (in math coords) to keep
function _clipCircleArcs(ccx,ccy,cr,ecx,ecy,er,color){
  const cp=_m2px(ccx,ccy);
  const rPx=cr*G.scale;
  const d=Math.hypot(cp.x-ecx,cp.y-ecy);
  if(d+rPx<er)return[]; // entirely inside eraser
  if(d>rPx+er)return[{type:'circle',cx:ccx,cy:ccy,r:cr,color}]; // no overlap

  // Sample 72 points around circle, determine which are outside eraser
  const N=72,step=2*Math.PI/N;
  const outside=[];
  for(let i=0;i<N;i++){
    const a=i*step;
    const ptx=cp.x+rPx*Math.cos(a),pty=cp.y+rPx*Math.sin(a);
    outside.push(Math.hypot(ptx-ecx,pty-ecy)>=er);
  }

  // Find contiguous runs of outside=true
  const arcs=[];
  let inRun=false,runStart=0;
  for(let i=0;i<=N;i++){
    const idx=i%N;
    if(outside[idx]&&!inRun){inRun=true;runStart=i}
    else if(!outside[idx]&&inRun){
      inRun=false;
      arcs.push({sa:runStart*step,ea:i*step});
    }
  }

  if(arcs.length===0)return[]; // all inside
  if(arcs.length===1&&arcs[0].ea-arcs[0].sa>=2*Math.PI-0.05){
    return[{type:'circle',cx:ccx,cy:ccy,r:cr,color}]; // all outside
  }

  // Convert kept angle ranges to arc objects
  const result=[];
  for(const arc of arcs){
    const sa=arc.sa,ea=arc.ea;
    const sx=ccx+cr*Math.cos(sa),sy=ccy+cr*Math.sin(sa);
    const ex=ccx+cr*Math.cos(ea),ey=ccy+cr*Math.sin(ea);
    // Canvas angles: negate math angles
    const saC=-sa,eaC=-ea;
    // The kept arc goes CW from sa to ea in canvas (since math CCW → canvas CW)
    result.push({
      type:'arc',cx:ccx,cy:ccy,r:cr,
      startAngleCanvas:saC,endAngleCanvas:eaC,
      anticlockwise:false,color
    });
  }
  return result;
}

// Clip an existing arc → returns array of arc objects to keep
function _clipArcCircle(o,ecx,ecy,er){
  const cp=_m2px(o.cx,o.cy);
  const rPx=o.r*G.scale;
  const d=Math.hypot(cp.x-ecx,cp.y-ecy);
  if(d+rPx<er)return[];
  if(d>rPx+er)return[o]; // no overlap

  // Sample points along the arc, check which are outside eraser
  const sa=o.startAngleCanvas,ea=o.endAngleCanvas;
  const ac=o.anticlockwise;
  // Compute sweep
  let sweep;
  if(ac){
    sweep=sa-ea;if(sweep<=0)sweep+=2*Math.PI;
  }else{
    sweep=ea-sa;if(sweep<=0)sweep+=2*Math.PI;
  }
  if(sweep<0.01)return[o];

  const N=Math.max(36,Math.round(sweep/(2*Math.PI)*72));
  const outside=[];
  for(let i=0;i<=N;i++){
    const t=i/N;
    let a;
    if(ac)a=sa-t*sweep; else a=sa+t*sweep;
    const ptx=cp.x+rPx*Math.cos(a),pty=cp.y+rPx*Math.sin(a);
    outside.push(Math.hypot(ptx-ecx,pty-ecy)>=er);
  }

  // Find contiguous runs of outside
  const runs=[];
  let inRun=false,runStart=0;
  for(let i=0;i<=N;i++){
    if(i<N&&outside[i]&&!inRun){inRun=true;runStart=i}
    else if((i===N||!outside[i])&&inRun){
      inRun=false;
      if(i-runStart>=2)runs.push({s:runStart,e:i});
    }
  }

  if(runs.length===0)return[];
  if(runs.length===1&&runs[0].s===0&&runs[0].e===N)return[o];

  const result=[];
  for(const run of runs){
    const t1=run.s/N,t2=run.e/N;
    let a1,a2;
    if(ac){a1=sa-t1*sweep;a2=sa-t2*sweep}
    else{a1=sa+t1*sweep;a2=sa+t2*sweep}
    result.push({
      type:'arc',cx:o.cx,cy:o.cy,r:o.r,
      startAngleCanvas:a1,endAngleCanvas:a2,
      anticlockwise:ac,color:o.color
    });
  }
  return result;
}

// Main eraser function — blackboard-style: splits objects, only removes what it touches
function eraseAt(px,py){
  const r=G.eraserSize;
  const r2=r*r;
  let erased=false;
  const newObjs=[];

  // Clear measurement display if eraser passes over it
  if(G.measureResult){
    const mr=G.measureResult;
    let clearMeasure=false;
    if(mr.type==='distance'&&mr.pts.length===2){
      const a=m2p(mr.pts[0].x,mr.pts[0].y),b=m2p(mr.pts[1].x,mr.pts[1].y);
      if(distToSeg(px,py,a.x,a.y,b.x,b.y)<r)clearMeasure=true;
    }else if(mr.type==='angle'&&mr.pts.length===3){
      const v=m2p(mr.pts[0].x,mr.pts[0].y),a1=m2p(mr.pts[1].x,mr.pts[1].y),a2=m2p(mr.pts[2].x,mr.pts[2].y);
      if(distToSeg(px,py,v.x,v.y,a1.x,a1.y)<r||distToSeg(px,py,v.x,v.y,a2.x,a2.y)<r)clearMeasure=true;
    }
    if(clearMeasure){G.measureResult=null;erased=true}
  }

  // Erase function curves that pass through eraser area
  const W=cw.clientWidth;
  const funcsBefore=G.funcs.length;
  G.funcs=G.funcs.filter(f=>{
    for(let ppx=0;ppx<W;ppx+=4){
      const mathX=(ppx-G.ox)/G.scale;
      try{
        const mathY=f.compiled.evaluate({x:mathX});
        if(!isFinite(mathY))continue;
        const ppy=G.oy-mathY*G.scale;
        if((ppx-px)*(ppx-px)+(ppy-py)*(ppy-py)<r2)return false;
      }catch(e){}
    }
    return true;
  });
  if(G.funcs.length<funcsBefore){erased=true;updateFuncList()}

  // Process geometric objects
  for(const o of G.objs){
    const c=o.color||G.color;

    // --- FREEHAND: split stroke at eraser, keep parts outside ---
    if(o.type==='freehand'){
      const segs=[];let cur=[];
      for(const p of o.pts){
        const pp=m2p(p.x,p.y);
        const d2=(pp.x-px)*(pp.x-px)+(pp.y-py)*(pp.y-py);
        if(d2<r2){if(cur.length>=2)segs.push(cur);cur=[]}
        else cur.push(p);
      }
      if(cur.length>=2)segs.push(cur);
      if(segs.length===0){erased=true}
      else if(segs.length===1&&segs[0].length===o.pts.length){newObjs.push(o)}
      else{
        erased=true;
        segs.forEach(seg=>newObjs.push({id:G.nextId++,type:'freehand',pts:seg,color:c,lw:o.lw||2.5}));
      }
      continue;
    }

    // --- SEGMENT: split into parts outside eraser circle ---
    if(o.type==='segment'){
      // Skip if this segment was recently created by eraser (to prevent infinite recursion)
      if(o._eraserTick===G._eraserFrameCount){
        newObjs.push(o);
        continue;
      }
      
      const parts=_clipSegCircle(o.x1,o.y1,o.x2,o.y2,px,py,r);
      if(parts.length===0){erased=true}
      else if(parts.length===1){
        // Check if the part is essentially the same as the original
        const d1=Math.hypot(parts[0].x1-o.x1,parts[0].y1-o.y1);
        const d2=Math.hypot(parts[0].x2-o.x2,parts[0].y2-o.y2);
        if(d1<0.1&&d2<0.1){
          newObjs.push(o);
        }else{
          erased=true;
          G._eraserFrameCount=(G._eraserFrameCount||0)+1;
          if(Math.hypot(parts[0].x2-parts[0].x1,parts[0].y2-parts[0].y1)>0.01){
            const newSeg={id:G.nextId++,type:'segment',x1:parts[0].x1,y1:parts[0].y1,x2:parts[0].x2,y2:parts[0].y2,color:c};
            newSeg._eraserTick=G._eraserFrameCount;
            newObjs.push(newSeg);
          }
        }
      }
      else{
        erased=true;
        G._eraserFrameCount=(G._eraserFrameCount||0)+1;
        parts.forEach(p=>{
          if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01){
            const newSeg={id:G.nextId++,type:'segment',x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2,color:c};
            newSeg._eraserTick=G._eraserFrameCount;
            newObjs.push(newSeg);
          }
        });
      }
      continue;
    }

    // --- LINE: clip infinite line, keep parts outside ---
    if(o.type==='line'){
      // Skip if this line was recently created by eraser (to prevent infinite recursion)
      if(o._eraserTick===G._eraserFrameCount){
        newObjs.push(o);
        continue;
      }
      
      const parts=_clipLineCircle(o.x1,o.y1,o.x2,o.y2,px,py,r);
      if(parts.length===0){erased=true}
      else if(parts.length===1){newObjs.push(o)}
      else{
        erased=true;
        G._eraserFrameCount=(G._eraserFrameCount||0)+1;
        parts.forEach(p=>{
          const len=Math.hypot(p.x2-p.x1,p.y2-p.y1);
          if(len>0.01){
            const newLine={id:G.nextId++,type:'line',x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2,color:c};
            newLine._eraserTick=G._eraserFrameCount;
            newObjs.push(newLine);
          }
        });
      }
      continue;
    }

    // --- RAY: clip ray, keep parts outside ---
    if(o.type==='ray'){
      // Skip if this ray was recently created by eraser (to prevent infinite recursion)
      if(o._eraserTick===G._eraserFrameCount){
        newObjs.push(o);
        continue;
      }
      
      const parts=_clipRayCircle(o.x1,o.y1,o.x2,o.y2,px,py,r);
      if(parts.length===0){erased=true}
      else if(parts.length===1){newObjs.push(o)}
      else{
        erased=true;
        G._eraserFrameCount=(G._eraserFrameCount||0)+1;
        parts.forEach(p=>{
          const len=Math.hypot(p.x2-p.x1,p.y2-p.y1);
          if(len>0.01){
            const newRay={id:G.nextId++,type:'ray',x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2,color:c};
            newRay._eraserTick=G._eraserFrameCount;
            newObjs.push(newRay);
          }
        });
      }
      continue;
    }

    // --- CIRCLE: convert to arc(s) with gap ---
    if(o.type==='circle'){
      const arcs=_clipCircleArcs(o.cx,o.cy,o.r,px,py,r,c);
      if(arcs.length===0){erased=true}
      else if(arcs.length===1&&arcs[0].type==='circle'){newObjs.push(o)}
      else{
        erased=true;
        arcs.forEach(a=>newObjs.push({id:G.nextId++,...a}));
      }
      continue;
    }

    // --- ARC: split arc, keep parts outside ---
    if(o.type==='arc'){
      if(o.startAngleCanvas===undefined){
        // Legacy format — just remove if touched
        if(hitObj(o,px,py,r)){erased=true}else{newObjs.push(o)}
        continue;
      }
      const arcs=_clipArcCircle(o,px,py,r);
      if(arcs.length===0){erased=true}
      else if(arcs.length===1&&arcs[0]===o){newObjs.push(o)}
      else{
        erased=true;
        arcs.forEach(a=>newObjs.push({id:G.nextId++,...a}));
      }
      continue;
    }

    // --- POLYGON: break edges, keep edges outside eraser ---
    if(o.type==='polygon'){
      const pts=o.pts;
      const newEdges=[];
      let anyCut=false;
      for(let i=0;i<pts.length;i++){
        const j=(i+1)%pts.length;
        const parts=_clipSegCircle(pts[i].x,pts[i].y,pts[j].x,pts[j].y,px,py,r);
        if(parts.length===0){anyCut=true}
        else if(parts.length===1&&parts[0].x1===pts[i].x&&parts[0].y1===pts[i].y&&parts[0].x2===pts[j].x&&parts[0].y2===pts[j].y){
          newEdges.push(parts[0]);
        }else{
          anyCut=true;
          parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push(p)});
        }
      }
      if(!anyCut){newObjs.push(o)}
      else if(newEdges.length===0){erased=true}
      else{
        erased=true;
        newEdges.forEach(e=>newObjs.push({id:G.nextId++,type:'segment',x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,color:c}));
      }
      continue;
    }

    // --- SECTOR: remove entirely if eraser touches any part ---
    if(o.type==='sector'){
      if(hitObj(o,px,py,r)){erased=true}else{newObjs.push(o)}
      continue;
    }

    // --- POINT: remove if inside eraser ---
    if(o.type==='point'){
      const pp=m2p(o.x,o.y);
      if(Math.hypot(pp.x-px,pp.y-py)<r){erased=true}else{newObjs.push(o)}
      continue;
    }

    // --- RULER: split like segment ---
    if(o.type==='ruler'){
      const parts=_clipSegCircle(o.x1,o.y1,o.x2,o.y2,px,py,r);
      if(parts.length===0){erased=true}
      else if(parts.length===1&&parts[0].x1===o.x1&&parts[0].y1===o.y1&&parts[0].x2===o.x2&&parts[0].y2===o.y2){newObjs.push(o)}
      else{
        erased=true;
        parts.forEach(p=>{
          if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)
            newObjs.push({id:G.nextId++,type:'ruler',x1:p.x1,y1:p.y1,x2:p.x2,y2:p.y2,color:c});
        });
      }
      continue;
    }

    // --- BOX: extract edges and clip each ---
    if(o.type==='box'){
      const{x,y,w,h,d}=o;
      const va=o._va!==undefined?o._va:G.viewAngleX;
      const vb=o._vb!==undefined?o._vb:G.viewAngleY;
      const dx3d=Math.cos(va)*d*0.5,dy3d=Math.sin(va)*d*0.5;
      // 8 corners
      const c1={x:x,y:y+h},c2={x:x+w,y:y+h},c3={x:x+w,y:y},c4={x:x,y:y};
      const c5={x:x+dx3d,y:y+h+dy3d},c6={x:x+w+dx3d,y:y+h+dy3d},c7={x:x+w+dx3d,y:y+dy3d},c8={x:x+dx3d,y:y+dy3d};
      // 12 edges of a box
      const edges=[[c1,c2],[c2,c3],[c3,c4],[c4,c1],[c5,c6],[c6,c7],[c7,c8],[c8,c5],[c1,c5],[c2,c6],[c3,c7],[c4,c8]];
      const newEdges=[];
      let anyCut=false;
      for(const[a,b]of edges){
        const parts=_clipSegCircle(a.x,a.y,b.x,b.y,px,py,r);
        if(parts.length===0){anyCut=true}
        else if(parts.length===1&&parts[0].x1===a.x&&parts[0].y1===a.y&&parts[0].x2===b.x&&parts[0].y2===b.y){
          newEdges.push({a,b});
        }else{
          anyCut=true;
          parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push({a:{x:p.x1,y:p.y1},b:{x:p.x2,y:p.y2}})});
        }
      }
      if(!anyCut){newObjs.push(o)}
      else if(newEdges.length===0){erased=true}
      else{
        erased=true;
        // Convert remaining edges to segments
        newEdges.forEach(e=>newObjs.push({id:G.nextId++,type:'segment',x1:e.a.x,y1:e.a.y,x2:e.b.x,y2:e.b.y,color:c}));
      }
      continue;
    }

    // --- CYLINDER: extract edges and clip ---
    if(o.type==='cylinder'){
      const cx=o.cx,cy=o.cy,radius=o.r,h=o.h;
      const ey=Math.abs(Math.sin(G.viewAngleY))*0.5+0.1;
      // Sample ellipse points
      const N=24;
      const topPts=[],botPts=[];
      for(let i=0;i<N;i++){
        const a=2*Math.PI*i/N;
        topPts.push({x:cx+radius*Math.cos(a),y:cy+h/2+radius*ey*Math.sin(a)});
        botPts.push({x:cx+radius*Math.cos(a),y:cy-h/2+radius*ey*Math.sin(a)});
      }
      const newEdges=[];
      let anyCut=false;
      // Top ellipse edges
      for(let i=0;i<N;i++){
        const j=(i+1)%N;
        const parts=_clipSegCircle(topPts[i].x,topPts[i].y,topPts[j].x,topPts[j].y,px,py,r);
        if(parts.length===0){anyCut=true}
        else if(parts.length===1&&parts[0].x1===topPts[i].x&&parts[0].y1===topPts[i].y&&parts[0].x2===topPts[j].x&&parts[0].y2===topPts[j].y){
          newEdges.push({a:topPts[i],b:topPts[j]});
        }else{
          anyCut=true;
          parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push({a:{x:p.x1,y:p.y1},b:{x:p.x2,y:p.y2}})});
        }
      }
      // Bottom ellipse edges
      for(let i=0;i<N;i++){
        const j=(i+1)%N;
        const parts=_clipSegCircle(botPts[i].x,botPts[i].y,botPts[j].x,botPts[j].y,px,py,r);
        if(parts.length===0){anyCut=true}
        else if(parts.length===1&&parts[0].x1===botPts[i].x&&parts[0].y1===botPts[i].y&&parts[0].x2===botPts[j].x&&parts[0].y2===botPts[j].y){
          newEdges.push({a:botPts[i],b:botPts[j]});
        }else{
          anyCut=true;
          parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push({a:{x:p.x1,y:p.y1},b:{x:p.x2,y:p.y2}})});
        }
      }
      // Side edges (4 vertical lines at cardinal points)
      const sideIdx=[0,N/4,N/2,3*N/4];
      for(const idx of sideIdx){
        const parts=_clipSegCircle(topPts[idx].x,topPts[idx].y,botPts[idx].x,botPts[idx].y,px,py,r);
        if(parts.length===0){anyCut=true}
        else if(parts.length===1&&parts[0].x1===topPts[idx].x&&parts[0].y1===topPts[idx].y&&parts[0].x2===botPts[idx].x&&parts[0].y2===botPts[idx].y){
          newEdges.push({a:topPts[idx],b:botPts[idx]});
        }else{
          anyCut=true;
          parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push({a:{x:p.x1,y:p.y1},b:{x:p.x2,y:p.y2}})});
        }
      }
      if(!anyCut){newObjs.push(o)}
      else if(newEdges.length===0){erased=true}
      else{
        erased=true;
        newEdges.forEach(e=>newObjs.push({id:G.nextId++,type:'segment',x1:e.a.x,y1:e.a.y,x2:e.b.x,y2:e.b.y,color:c}));
      }
      continue;
    }

    // --- CONE: extract edges and clip ---
    if(o.type==='cone'){
      const cx=o.cx,cy=o.cy,radius=o.r,h=o.h;
      const ey=Math.abs(Math.sin(G.viewAngleY))*0.5+0.1;
      const tip={x:cx,y:cy+h/2};
      // Sample base ellipse points
      const N=24;
      const botPts=[];
      for(let i=0;i<N;i++){
        const a=2*Math.PI*i/N;
        botPts.push({x:cx+radius*Math.cos(a),y:cy-h/2+radius*ey*Math.sin(a)});
      }
      const newEdges=[];
      let anyCut=false;
      // Base ellipse edges
      for(let i=0;i<N;i++){
        const j=(i+1)%N;
        const parts=_clipSegCircle(botPts[i].x,botPts[i].y,botPts[j].x,botPts[j].y,px,py,r);
        if(parts.length===0){anyCut=true}
        else if(parts.length===1&&parts[0].x1===botPts[i].x&&parts[0].y1===botPts[i].y&&parts[0].x2===botPts[j].x&&parts[0].y2===botPts[j].y){
          newEdges.push({a:botPts[i],b:botPts[j]});
        }else{
          anyCut=true;
          parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push({a:{x:p.x1,y:p.y1},b:{x:p.x2,y:p.y2}})});
        }
      }
      // Side edges (2 lines from tip to base)
      const sideIdx=[0,N/2];
      for(const idx of sideIdx){
        const parts=_clipSegCircle(tip.x,tip.y,botPts[idx].x,botPts[idx].y,px,py,r);
        if(parts.length===0){anyCut=true}
        else if(parts.length===1&&parts[0].x1===tip.x&&parts[0].y1===tip.y&&parts[0].x2===botPts[idx].x&&parts[0].y2===botPts[idx].y){
          newEdges.push({a:tip,b:botPts[idx]});
        }else{
          anyCut=true;
          parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push({a:{x:p.x1,y:p.y1},b:{x:p.x2,y:p.y2}})});
        }
      }
      if(!anyCut){newObjs.push(o)}
      else if(newEdges.length===0){erased=true}
      else{
        erased=true;
        newEdges.forEach(e=>newObjs.push({id:G.nextId++,type:'segment',x1:e.a.x,y1:e.a.y,x2:e.b.x,y2:e.b.y,color:c}));
      }
      continue;
    }

    // --- SPHERE: extract edges and clip ---
    if(o.type==='sphere'){
      const cx=o.cx,cy=o.cy,radius=o.r;
      // Sample 3 circles (equator + 2 meridians)
      const N=24;
      const circles=[];
      // Equator (horizontal)
      const eqPts=[];
      for(let i=0;i<N;i++){
        const a=2*Math.PI*i/N;
        eqPts.push({x:cx+radius*Math.cos(a),y:cy+radius*0.3*Math.sin(a)});
      }
      circles.push(eqPts);
      // Vertical meridian 1
      const m1Pts=[];
      for(let i=0;i<N;i++){
        const a=2*Math.PI*i/N;
        m1Pts.push({x:cx+radius*0.3*Math.cos(a),y:cy+radius*Math.sin(a)});
      }
      circles.push(m1Pts);
      // Outer circle
      const ocPts=[];
      for(let i=0;i<N;i++){
        const a=2*Math.PI*i/N;
        ocPts.push({x:cx+radius*Math.cos(a),y:cy+radius*Math.sin(a)});
      }
      circles.push(ocPts);

      const newEdges=[];
      let anyCut=false;
      for(const pts of circles){
        for(let i=0;i<N;i++){
          const j=(i+1)%N;
          const parts=_clipSegCircle(pts[i].x,pts[i].y,pts[j].x,pts[j].y,px,py,r);
          if(parts.length===0){anyCut=true}
          else if(parts.length===1&&parts[0].x1===pts[i].x&&parts[0].y1===pts[i].y&&parts[0].x2===pts[j].x&&parts[0].y2===pts[j].y){
            newEdges.push({a:pts[i],b:pts[j]});
          }else{
            anyCut=true;
            parts.forEach(p=>{if(Math.hypot(p.x2-p.x1,p.y2-p.y1)>0.01)newEdges.push({a:{x:p.x1,y:p.y1},b:{x:p.x2,y:p.y2}})});
          }
        }
      }
      if(!anyCut){newObjs.push(o)}
      else if(newEdges.length===0){erased=true}
      else{
        erased=true;
        newEdges.forEach(e=>newObjs.push({id:G.nextId++,type:'segment',x1:e.a.x,y1:e.a.y,x2:e.b.x,y2:e.b.y,color:c}));
      }
      continue;
    }

    // --- UNFOLD: remove if touched ---
    if(o.type==='unfold'){
      if(hitObj(o,px,py,r)){erased=true}else{newObjs.push(o)}
      continue;
    }
  }

  G.objs=newObjs;
  return erased;
}

// Batched eraser update via requestAnimationFrame
function _eraserTick(){
  G._eraserRaf=null;
  if(!G._eraserDirty)return;
  G._eraserDirty=false;
  const didErase=eraseAt(G._eraserPx,G._eraserPy);
  if(didErase){
    draw();
  }else{
    drawOverlay();
  }
}

function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(len2===0)return Math.hypot(px-x1,py-y1);
  let t=((px-x1)*dx+(py-y1)*dy)/len2;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}

// Ruler edge helpers
function getRulerEdgeInfo(ruler){
  const dx=ruler.x2-ruler.x1,dy=ruler.y2-ruler.y1;
  const len=Math.hypot(dx,dy);if(len===0)return null;
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  const rwMath=22/G.scale;
  return{ux,uy,nx,ny,rwMath,len};
}
function distToRulerEdge(mx,my,ruler){
  const info=getRulerEdgeInfo(ruler);if(!info)return 999;
  const{nx,ny,rwMath}=info;
  const a1x=ruler.x1+nx*rwMath,a1y=ruler.y1+ny*rwMath;
  const b1x=ruler.x2+nx*rwMath,b1y=ruler.y2+ny*rwMath;
  const a2x=ruler.x1-nx*rwMath,a2y=ruler.y1-ny*rwMath;
  const b2x=ruler.x2-nx*rwMath,b2y=ruler.y2-ny*rwMath;
  return Math.min(distToSeg(mx,my,a1x,a1y,b1x,b1y),distToSeg(mx,my,a2x,a2y,b2x,b2y));
}
function snapToRulerEdge(mx,my,ruler){
  const info=getRulerEdgeInfo(ruler);if(!info)return{x:ruler.x1,y:ruler.y1};
  const{nx,ny,rwMath}=info;
  const dx=ruler.x2-ruler.x1,dy=ruler.y2-ruler.y1;
  const len2=dx*dx+dy*dy;
  let t=((mx-ruler.x1)*dx+(my-ruler.y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  const cx=ruler.x1+t*dx,cy=ruler.y1+t*dy;
  const e1x=cx+nx*rwMath,e1y=cy+ny*rwMath;
  const e2x=cx-nx*rwMath,e2y=cy-ny*rwMath;
  return Math.hypot(mx-e1x,my-e1y)<Math.hypot(mx-e2x,my-e2y)?{x:e1x,y:e1y}:{x:e2x,y:e2y};
}

// Get rotation handles for a shape (returns array of {x,y} in pixel coords)
function getRotHandles(o){
  switch(o.type){
    case'segment':case'line':case'ray':case'ruler':{
      const a=m2p(o.x1,o.y1),b=m2p(o.x2,o.y2);return[{x:a.x,y:a.y},{x:b.x,y:b.y}];
    }
    case'polygon':{return o.pts.map(p=>m2p(p.x,p.y))}
    case'box':{
      const{x,y,w,h}=o;
      return[m2p(x,y),m2p(x+w,y),m2p(x+w,y+h),m2p(x,y+h)];
    }
    case'circle':{
      const c=m2p(o.cx,o.cy),r=o.r*G.scale;
      return[{x:c.x+r,y:c.y},{x:c.x-r,y:c.y},{x:c.x,y:c.y+r},{x:c.x,y:c.y-r}];
    }
    case'arc':{
      const c=m2p(o.cx,o.cy),r=o.r*G.scale;
      return[{x:c.x,y:c.y}];
    }
    case'sector':{
      const c=m2p(o.cx,o.cy),r=o.r*G.scale;
      return[{x:c.x,y:c.y},{x:c.x+Math.cos(o.startAngleCanvas)*r,y:c.y+Math.sin(o.startAngleCanvas)*r},{x:c.x+Math.cos(o.endAngleCanvas)*r,y:c.y+Math.sin(o.endAngleCanvas)*r}];
    }
    case'cylinder':case'cone':{
      const cx=m2p(o.cx,o.cy+o.h/2),r=o.r*G.scale;
      return[{x:cx.x,y:cx.y}];
    }
    case'sphere':{
      const c=m2p(o.cx,o.cy),r=o.r*G.scale;
      return[{x:c.x+r,y:c.y}];
    }
    default:return[];
  }
}
// Get center of shape in math coords
function getShapeCenter(o){
  switch(o.type){
    case'segment':case'line':case'ray':case'ruler':return{x:(o.x1+o.x2)/2,y:(o.y1+o.y2)/2};
    case'polygon':{const cx=o.pts.reduce((s,p)=>s+p.x,0)/o.pts.length,cy=o.pts.reduce((s,p)=>s+p.y,0)/o.pts.length;return{x:cx,y:cy}}
    case'box':return{x:o.x+o.w/2,y:o.y+o.h/2};
    case'circle':case'arc':case'sector':case'sphere':return{x:o.cx,y:o.cy};
    case'cylinder':case'cone':return{x:o.cx,y:o.cy};
    default:return{x:0,y:0};
  }
}
// Rotate a shape around a center by angle delta
function rotateShape(o,center,da){
  const cos=Math.cos(da),sin=Math.sin(da);
  function rot(x,y){const rx=x-center.x,ry=y-center.y;return{x:center.x+rx*cos-ry*sin,y:center.y+rx*sin+ry*cos}}
  switch(o.type){
    case'segment':case'line':case'ray':case'ruler':{
      const a=rot(o.x1,o.y1),b=rot(o.x2,o.y2);o.x1=a.x;o.y1=a.y;o.x2=b.x;o.y2=b.y;break;
    }
    case'polygon':{o.pts=o.pts.map(p=>rot(p.x,p.y));break}
    case'box':{
      // Rotate all 4 corners, then recompute bounding box
      const corners=[rot(o.x,o.y),rot(o.x+o.w,o.y),rot(o.x+o.w,o.y+o.h),rot(o.x,o.y+o.h)];
      // For a box, we rotate the center and keep w,h (approximate for small rotations)
      // Actually for a proper box rotation, store as polygon
      // Simplified: rotate center, keep dimensions
      const c=rot(o.x+o.w/2,o.y+o.h/2);
      o.x=c.x-o.w/2;o.y=c.y-o.h/2;
      break;
    }
    case'circle':case'arc':case'sector':case'sphere':{
      const c=rot(o.cx,o.cy);o.cx=c.x;o.cy=c.y;
      if(o.type==='arc'||o.type==='sector'){
        if(o.startAngleCanvas!==undefined){o.startAngleCanvas+=da;o.endAngleCanvas+=da}
        else if(o.startAngle!==undefined){o.startAngle+=da;o.endAngle+=da}
      }
      break;
    }
    case'cylinder':case'cone':{
      const c=rot(o.cx,o.cy);o.cx=c.x;o.cy=c.y;break;
    }
  }
}
