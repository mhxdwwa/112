<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src wss: https:; frame-src 'self'">
  <title>班级桌面管理 · DeskBoard</title>
  <style>
:root {
  --accent: #2f6d8f;
  --ink: #1e2329;
  --ink-2: #5b6470;
  --ink-3: #98a1ab;
  --line: #e6e3dc;
  --line-2: #efede7;
  --bg: #f7f5f1;
  --card: #ffffff;
  --danger: #b04a3a;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; height: 100%; }

/* ---------------- 侧栏 ---------------- */
.side {
  width: 208px;
  flex: 0 0 208px;
  background: linear-gradient(175deg, #fbfaf7, #f4f2ec);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 12px 10px;
}

.brand { display: flex; gap: 9px; align-items: center; padding: 2px 6px 18px; }
.logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent));
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 4px 12px -6px color-mix(in srgb, var(--accent) 70%, transparent);
}
.brand-t b { display: block; font-size: 13.5px; letter-spacing: .01em; }
.brand-t span { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; }

.nav { display: flex; flex-direction: column; gap: 1px; flex: 1; }
.nav-i {
  display: flex; align-items: center; gap: 9px;
  border: 0; background: transparent; text-align: left;
  padding: 8px 10px; border-radius: 8px;
  font-size: 12.5px; color: var(--ink-2); font-family: inherit;
  cursor: pointer; transition: background .15s, color .15s;
}
.nav-i i {
  font-style: normal; font-size: 9.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums; letter-spacing: .04em;
  width: 15px;
}
.nav-i:hover { background: rgba(30, 35, 41, .045); color: var(--ink); }
.nav-i.is-on {
  background: color-mix(in srgb, var(--accent) 11%, transparent);
  color: var(--accent); font-weight: 600;
}
.nav-i.is-on i { color: color-mix(in srgb, var(--accent) 65%, transparent); }

.side-f { padding: 8px 10px 2px; border-top: 1px solid var(--line-2); margin-top: 8px; }
.dirty { font-size: 11px; color: var(--ink-3); }
.dirty.is-dirty { color: #a8761f; }

/* ---------------- 主区 ---------------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding: 20px 26px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .55);
}
.top h1 { font-size: 16px; margin: 0; letter-spacing: .01em; }
.top p { font-size: 11.5px; color: var(--ink-3); margin: 4px 0 0; }

.acts { display: flex; gap: 8px; align-items: center; }

.btn {
  border: 0; border-radius: 8px; padding: 8px 15px;
  font-size: 12.5px; font-family: inherit; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 500;
  box-shadow: 0 6px 16px -12px color-mix(in srgb, var(--accent) 90%, transparent);
  transition: filter .15s, transform .06s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn.ghost {
  background: #fff; color: var(--ink-2);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn.ghost:hover { background: #faf9f6; color: var(--ink); }

.pane {
  flex: 1; overflow-y: auto; padding: 20px 26px 40px;
}
.pane::-webkit-scrollbar { width: 9px; }
.pane::-webkit-scrollbar-thumb { background: #d9d5cc; border-radius: 5px; border: 2px solid var(--bg); }

/* ---------------- 卡片与表单 ---------------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 14px;
}
.card > h2 {
  font-size: 12.5px; font-weight: 600; margin: 0 0 3px;
  display: flex; align-items: center; gap: 7px;
}
.card > h2::before {
  content: ""; width: 3px; height: 12px; border-radius: 2px;
  background: var(--accent);
}
.card > .hint { font-size: 11.5px; color: var(--ink-3); margin: 0 0 14px 10px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 11.5px; color: var(--ink-2); }
.field small { font-size: 10.5px; color: var(--ink-3); }

input[type="text"], input[type="date"], input[type="time"], select, textarea {
  font-family: inherit; font-size: 12.5px; color: var(--ink);
  background: #fff; border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: color-mix(in srgb, var(--accent) 55%, #fff);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] {
  width: 100%; height: 32px; padding: 2px; border: 1px solid var(--line);
  border-radius: 7px; background: #fff; cursor: pointer;
}
textarea { resize: vertical; min-height: 60px; line-height: 1.55; }

.row-inline { display: flex; align-items: center; gap: 8px; }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.chk input { accent-color: var(--accent); width: 14px; height: 14px; }

/* 表格式列表 */
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tbl th {
  text-align: left; font-weight: 500; font-size: 11px; color: var(--ink-3);
  padding: 0 8px 7px; letter-spacing: .03em;
}
table.tbl td { padding: 3px 4px; vertical-align: middle; }
table.tbl td.tight { width: 1%; white-space: nowrap; }

.icon-btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
  display: inline-grid; place-items: center; font-size: 13px; line-height: 1;
  font-family: inherit; transition: all .15s;
}
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

.add-row {
  margin-top: 10px; border: 1px dashed var(--line); background: transparent;
  color: var(--ink-2); border-radius: 8px; padding: 7px 12px;
  font-size: 12px; font-family: inherit; cursor: pointer; width: 100%;
  transition: all .15s;
}
.add-row:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }

/* 课程表网格 */
.tt-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
/* 编辑类表格（作息/值日/通知/特殊日期/学生）横向滚动容器 */
.tbscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; }
table.tt th {
  position: sticky; top: 0; z-index: 2; background: #faf9f6;
  font-weight: 600; font-size: 11.5px; color: var(--ink-2);
  padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center;
}
table.tt th.pc { text-align: left; padding-left: 10px; min-width: 130px; }
table.tt td { border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2); padding: 4px; }
table.tt td:last-child { border-right: 0; }
table.tt tr:last-child td { border-bottom: 0; }
.pcell { font-size: 11px; color: var(--ink-3); line-height: 1.4; padding-left: 6px; }
.pcell b { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.cell { display: flex; flex-direction: column; gap: 3px; }
.cell input {
  padding: 4px 6px; font-size: 11.5px; border-radius: 5px;
  border-color: transparent; background: transparent;
}
.cell input:hover { border-color: var(--line); background: #fff; }
.cell input:focus { background: #fff; }
.cell .r2 { display: flex; gap: 3px; }
.cell .r2 input { flex: 1; min-width: 0; }
.cell input.s { font-weight: 600; }
table.tt col.is-weekend { background: #fcfbf8; }

/* 成员标签 */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--accent); border-radius: 999px;
  padding: 3px 10px; font-size: 11.5px;
}

/* 关于 */
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 12.5px; }
.kv b { font-weight: 500; color: var(--ink-3); }
.kv span { color: var(--ink-2); word-break: break-all; font-family: Consolas, monospace; font-size: 11.5px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
  background: rgba(30, 35, 41, .93); color: #fff;
  padding: 9px 18px; border-radius: 999px; font-size: 12.5px;
  opacity: 0; pointer-events: none; transition: all .22s ease;
  box-shadow: 0 12px 30px -14px rgba(0, 0, 0, .6);
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------- 网页控制台：连接状态 ---------------- */
.conn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--ink-2);
  background: #fff; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px 5px 9px;
  white-space: nowrap;
}
.conn i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ink-3); flex: 0 0 7px;
}
.conn b { font-weight: 500; }
.conn[data-s="online"] { color: #2f7a54; border-color: #cfe6d9; background: #f2faf5; }
.conn[data-s="online"] i { background: #37a06a; box-shadow: 0 0 0 3px rgba(55, 160, 106, .14); }
.conn[data-s="connecting"] { color: #8a6b26; border-color: #ece1c4; background: #fdf8ec; }
.conn[data-s="connecting"] i { background: #d0a13c; animation: pulse 1.1s ease-in-out infinite; }
.conn[data-s="offline"] { color: #97392c; border-color: #eed5d0; background: #fdf2f0; }
.conn[data-s="offline"] i { background: #c0503c; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }

.banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 26px; padding: 10px 14px;
  border: 1px solid #eed5d0; background: #fdf2f0; color: #97392c;
  border-radius: 10px; font-size: 12px;
}
.banner b { font-weight: 600; }
.banner span { color: #a85a4c; }
.banner[hidden] { display: none !important; }

.host {
  display: block; font-size: 10.5px; color: var(--ink-3);
  margin-top: 3px; font-family: Consolas, monospace;
}

/* ---------------- 网页控制台：看板预览 ---------------- */
.pv-wrap {
  position: relative; width: 100%; height: 240px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 10px;
  background: #e9e6df;
}
.pv-wrap iframe {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  border: 0; transform-origin: 0 0;
  pointer-events: none;
}


/* ---------- 主题色卡 ---------- */
.themes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.theme {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 8px;
  border: 1.5px solid #e4e8ee;
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  transition: border-color .16s, box-shadow .16s, transform .16s;
  font-family: inherit;
}
.theme:hover { border-color: #c6d1dc; transform: translateY(-1px); }
.theme.on {
  border-color: var(--accent, #2f6d8f);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #2f6d8f) 15%, transparent);
}
.theme .sw {
  position: relative;
  display: block;
  height: 48px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06);
}
.theme .sw i { position: absolute; border-radius: 50%; }
.theme .sw i:first-child { width: 17px; height: 17px; left: 8px; bottom: 8px; opacity: .92; }
.theme .sw i:last-child { width: 9px; height: 9px; right: 10px; top: 9px; }
.theme b { font-size: 12px; font-weight: 600; color: #46505a; text-align: center; letter-spacing: .02em; }
.theme.on b { color: var(--accent, #2f6d8f); }

/* 主题色卡预览（每种主题一个小样） */
.sw[data-t="ivory"] { background: linear-gradient(160deg, #fcfbf8 0%, #eff2f4 100%); }
.sw[data-t="ivory"] i:first-child { background: #1e2329; }
.sw[data-t="ivory"] i:last-child { background: #2f6d8f; }
.sw[data-t="mist"] { background: linear-gradient(160deg, #f6f9fc 0%, #e2ebf3 100%); }
.sw[data-t="mist"] i:first-child { background: #16222c; }
.sw[data-t="mist"] i:last-child { background: #2b6f95; }
.sw[data-t="paper"] { background: linear-gradient(160deg, #fbf6ea 0%, #ede1c9 100%); }
.sw[data-t="paper"] i:first-child { background: #2b2318; }
.sw[data-t="paper"] i:last-child { background: #9a6a24; }
.sw[data-t="sage"] { background: linear-gradient(160deg, #f7faf5 0%, #e1ebdf 100%); }
.sw[data-t="sage"] i:first-child { background: #1b2a22; }
.sw[data-t="sage"] i:last-child { background: #3f7a5e; }
.sw[data-t="graphite"] { background: linear-gradient(160deg, #191d23 0%, #11141a 100%); }
.sw[data-t="graphite"] i:first-child { background: #ecf0f4; }
.sw[data-t="graphite"] i:last-child { background: #6ea8c9; }
.sw[data-t="midnight"] { background: linear-gradient(160deg, #141c2a 0%, #0b111b 100%); }
.sw[data-t="midnight"] i:first-child { background: #e8eff8; }
.sw[data-t="midnight"] i:last-child { background: #6aa3d8; }
.sw[data-t="forest"] { background: linear-gradient(160deg, #15201a 0%, #0c1410 100%); }
.sw[data-t="forest"] i:first-child { background: #e5efe8; }
.sw[data-t="forest"] i:last-child { background: #6fae8b; }
.sw[data-t="cocoa"] { background: linear-gradient(160deg, #1e1915 0%, #120e0b 100%); }
.sw[data-t="cocoa"] i:first-child { background: #f2e9df; }
.sw[data-t="cocoa"] i:last-child { background: #c08a5e; }

/* ==========================================================================
   移动端 / 窄屏自适应
   —— 让「班级桌面管理」在手机浏览器里也能顺畅操作：
   侧栏从固定 208px 变成顶部横向滑动条，网格收成单列，点按区域与输入框放大。
   ========================================================================== */

/* 平板 / 大手机：侧栏转顶部，双列网格收成单列 */
@media (max-width: 860px) {
  .app { flex-direction: column; }

  .side {
    width: 100%;
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    gap: 0;
    padding: 8px 10px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .side::-webkit-scrollbar { height: 0; }

  .brand { display: none; }            /* 顶部空间宝贵，隐藏 Logo 区 */
  .nav { flex-direction: row; flex: 1 1 auto; gap: 6px; }
  .nav-i { white-space: nowrap; padding: 9px 13px; font-size: 12.5px; }
  .nav-i i { display: none; }          /* 窄屏去掉序号，省宽度 */
  .side-f { display: none; }           /* 隐藏「已保存」角标，省空间 */

  .main { min-height: 0; }

  .top {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 14px 16px 12px;
  }
  .top h1 { font-size: 15px; }
  .top p { font-size: 11px; }
  .acts { width: 100%; flex-wrap: wrap; gap: 8px; }
  .conn { margin-right: auto; }
  .btn, .btn.ghost { flex: 1 1 120px; padding: 12px 12px; font-size: 13px; }

  .pane { padding: 14px 16px 40px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .themes { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .kv { grid-template-columns: 86px 1fr; }

  /* 行内组合（导入卡片、行为开关等）在手机上改为竖向堆叠，避免按钮被裁切 */
  .row-inline { flex-direction: column; align-items: stretch; }
  .row-inline select, .row-inline input { width: 100%; max-width: 100%; }

  /* 更大的点按与输入区域 */
  input[type="text"], input[type="date"], input[type="time"], select, textarea {
    padding: 11px 10px; font-size: 14px; min-height: 42px;
  }
  textarea { min-height: 72px; }
  .icon-btn { width: 34px; height: 34px; font-size: 15px; }
  .add-row { padding: 13px; font-size: 12.5px; }

  .pv-wrap { height: 200px; }
}

/* 小手机：进一步收紧，课程表可横向滚动由 .tt-wrap 承担 */
@media (max-width: 480px) {
  .top { padding: 12px 12px 10px; }
  .pane { padding: 12px 12px 36px; }
  .card { padding: 13px 13px; }
  /* 按钮在小手机上整行堆叠，避免被裁切 */
  .acts { flex-direction: column; align-items: stretch; }
  .conn { margin-right: 0; align-self: flex-start; }
  .btn, .btn.ghost { flex: 1 1 auto; font-size: 13px; padding: 13px 10px; }
  table.tt th, table.tt td { padding: 6px 3px; }
  .pcell b { font-size: 11px; }
  .cell input { padding: 6px 5px; font-size: 12px; }
  table.tt th.pc { min-width: 96px; padding-left: 7px; }
  .themes { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
  .kv { grid-template-columns: 74px 1fr; font-size: 12px; }
}

/* 超窄屏：表格字号再小一点，保证一屏能扫到更多 */
@media (max-width: 360px) {
  .cell input { font-size: 11px; }
  .cell .r2 { flex-direction: column; gap: 3px; }
}

</style>
</head>
<body>
  <div class="app">

    <aside class="side">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm2.6 4.2v1.9h8.8V8.2H7.6Zm0 3.9v1.9h6.2v-1.9H7.6Zm0 3.9v1.9h8.8v-1.9H7.6Z"/></svg>
        </div>
        <div class="brand-t">
          <b>DeskBoard</b>
          <span>班级桌面管理 · 远程控制端</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-i is-on" data-tab="basic"><i>01</i>班级信息</button>
        <button class="nav-i" data-tab="timetable"><i>02</i>课程表</button>
        <button class="nav-i" data-tab="duty"><i>03</i>值日安排</button>
        <button class="nav-i" data-tab="notices"><i>04</i>通知公告</button>
        <button class="nav-i" data-tab="special"><i>05</i>特殊日期</button>
        <button class="nav-i" data-tab="look"><i>06</i>外观与行为</button>
        <button class="nav-i" data-tab="students"><i>07</i>学生名册</button>
        <button class="nav-i" data-tab="exam"><i>08</i>考试模式</button>
      </nav>

      <div class="side-f">
        <span id="dirty" class="dirty">已保存</span>
        <small id="host" class="host"></small>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1 id="ttl">班级信息</h1>
          <p id="sub">这些信息会显示在看板的顶部</p>
        </div>
        <div class="acts">
          <button class="btn ghost" id="btnBack" hidden>← 返回学勤管家</button>
          <span class="conn" id="conn" data-s="connecting"><i></i><b>连接中…</b></span>
          <button class="btn ghost" id="btnReset">恢复示例数据</button>
          <button class="btn" id="btnSave">保存并应用</button>
        </div>
      </header>

      <div class="banner" id="banner" hidden></div>

      <div class="pane" id="pane"></div>
    </main>

}\n\n.shell[data-band=\"narrow\"] .hd-top { flex-wrap: wrap; row-gap: .5rem; }\n.shell[data-band=\"narrow\"] .cname { font-size: 1.55rem; }\n.shell[data-band=\"narrow\"] .school { font-size: .95rem; }\n\n/* 图标区与内容区之间的一道极淡分隔，视觉上把留白收住 */\n.shell[data-layout=\"full\"][data-avoid=\"left\"] .body::before {\n  content: \"\";\n  position: absolute;\n  left: -1.7rem;\n  top: 0;\n  bottom: 0;\n  width: 1px;\n  background: linear-gradient(180deg, transparent, var(--line) 10%, var(--line) 90%, transparent);\n  pointer-events: none;\n}\n.shell[data-layout=\"full\"] .body { position: relative; }\n\n/* 壁纸层模式下收不到鼠标事件，隐藏交互元素 */\n.mode-wallpaper .gear { display: none; }\n\n/* ---------- 入场动画 ---------- */\n.sec-anim > * {\n  opacity: 0;\n  transform: translateY(6px);\n}\nbody.booted .sec-anim > * {\n  animation: rise .46s cubic-bezier(.22, .61, .36, 1) forwards;\n}\nbody.booted .sec-anim > *:nth-child(2) { animation-delay: .06s; }\nbody.booted .sec-anim > *:nth-child(3) { animation-delay: .12s; }\n\n@keyframes rise {\n  to { opacity: 1; transform: none; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .sec-anim > * { opacity: 1; transform: none; }\n}\n\n/* ---------- 调试可视化 ---------- */\n#dbgbox {\n  position: fixed;\n  display: none;\n  z-index: 9999;\n  outline: 2px dashed #d2453f;\n  outline-offset: -2px;\n  box-shadow: 0 0 0 9999px rgba(210, 69, 63, .16);\n  pointer-events: none;\n}\n#dbgbox::after {\n  content: attr(data-txt);\n  position: absolute;\n  left: 0;\n  top: -1.7em;\n  padding: .12em .5em;\n  font: 600 12px/1.5 \"Microsoft YaHei UI\", system-ui, sans-serif;\n  color: #fff;\n  background: #d2453f;\n  border-radius: 4px;\n  white-space: nowrap;\n}\n\n/* ==========================================================================\n   壁纸模式（body.wp）\n   整屏画面会被截图直接设为桌面壁纸：桌面上没有窗口，\n   所以不再需要“贴在壁纸边上”的视觉处理，也不再有可点击控件。\n   ========================================================================== */\n\nbody.wp .shell::after { display: none; }      /* 去掉面板与壁纸交界的那道高光 */\nbody.wp .gear { display: none; }              /* 不可交互，齿轮没意义 */\nbody.wp .shell {\n  /* 壁纸模式下整屏就是一块干净的底，内容区域再叠加渐变 */\n  background:\n    radial-gradient(130% 55% at 100% 0%, color-mix(in srgb, var(--accent) 13%, transparent) 0%, transparent 62%),\n    radial-gradient(95% 55% at 0% 100%, color-mix(in srgb, var(--amber) 11%, transparent) 0%, transparent 58%),\n    linear-gradient(168deg, var(--bg1) 0%, var(--bg2) 56%, var(--bg3) 100%);\n}\n\n/* ===== 考试模式（控制台发布后桌面整屏显示） ===== */\n.exam-box {\n  padding: 1.6rem 1rem 1.4rem;\n  text-align: center;\n}\n.exam-label {\n  font-size: .95rem;\n  color: var(--ink-2);\n  letter-spacing: .06em;\n}\n.exam-digits {\n  margin: .5rem 0 .9rem;\n  font: 700 4.2rem/1.1 ui-monospace, Consolas, monospace;\n  letter-spacing: .04em;\n  color: var(--accent);\n  font-variant-numeric: tabular-nums;\n}\n.exam-box .prog { height: .5rem; }\n\n<\/style>\n<\/head>\n<body>\n  <div class=\"shell\" id=\"shell\" data-side=\"right\" data-theme=\"light\">\n\n    <header class=\"hd\">\n      <div class=\"hd-top\">\n        <div class=\"school\" id=\"school\"><\/div>\n      <\/div>\n      <div class=\"hd-mid\">\n        <h1 class=\"cname\" id=\"cname\">班级看板<\/h1>\n        <span class=\"wk\" id=\"week\"><\/span>\n      <\/div>\n      <div class=\"hd-date\" id=\"date\"><\/div>\n      <div class=\"special\" id=\"special\" hidden><\/div>\n    <\/header>\n\n    <main class=\"body\" id=\"body\"><\/main>\n\n    <footer class=\"ft\">\n      <span id=\"stamp\" class=\"stamp\"><\/span>\n      <button class=\"gear\" id=\"gear\" type=\"button\" aria-label=\"设置\">\n        <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" aria-hidden=\"true\">\n          <path fill=\"currentColor\" d=\"M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.3 2.5h4l.3-2.5a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z\"/>\n        <\/svg>\n      <\/button>\n    <\/footer>\n\n  <\/div>\n  <script>\nwindow.deskboard = {\n  getConfig: function(){ return Promise.resolve(window.__DB_DEFAULTS || {}); },\n  info: function(){ return Promise.resolve({}); },\n  scanIcons: function(){ return Promise.resolve(null); },\n  openEditor: function(){},\n  onUpdate: function(){}, onIcons: function(){}, onMode: function(){}, onDebug: function(){}\n};\n<\/script>\n<script>\n'use strict';\n\n/* ==========================================================================\n   DeskBoard · 看板渲染\n   ========================================================================== */\n\nconst WD_LONG = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];\nconst WD_SHORT = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];\nconst DENSITY_PX = { compact: 15, normal: 16, comfy: 17.5 };\nconst DUTY_COLS = [1, 2, 3, 4, 5, 6, 7]; // 周一 ~ 周日\n\nlet CFG = null;\nlet ICONS = null;         // 桌面图标占用信息 { count, cell, right, gapX, gapW, area, kind }\nlet DBG = false;          // 调试模式：把「已避开的图标区」画出来\nlet curRange = null;      // { start, end } 当前进行中的课\nlet lastDateKey = '';\nlet lastMinute = -1;\nlet booted = false;\n\nconst $ = (id) => document.getElementById(id);\nconst pad = (n) => String(n).padStart(2, '0');\n\nfunction toMin(t) {\n  const p = String(t || '0:0').split(':');\n  return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);\n}\nfunction dayKey(d) {\n  const w = d.getDay();\n  return String(w === 0 ? 7 : w);\n}\nfunction dateKey(d) {\n  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\n}\nfunction parseDate(s) {\n  const m = /^(\\d{4})-(\\d{1,2})-(\\d{1,2})$/.exec(String(s || ''));\n  if (!m) return null;\n  return new Date(+m[1], +m[2] - 1, +m[3]);\n}\nfunction daysBetween(a, b) {\n  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());\n  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());\n  return Math.round((B - A) / 86400000);\n}\nfunction esc(s) {\n  return String(s == null ? '' : s).replace(/[&<>\"']/g, (c) => (\n    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]\n  ));\n}\nfunction hueOf(name) {\n  let h = 0;\n  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;\n  return h;\n}\nfunction maxWidth() { return window.innerWidth; }\n\n/* ------------------------------------------------------------------ */\n\nconst THEMES = ['ivory', 'mist', 'paper', 'sage', 'graphite', 'midnight', 'forest', 'cocoa'];\nconst FONTS = ['hei', 'song', 'kai', 'yuan'];\n\nfunction applyAppearance() {\n  const a = CFG.appearance || {};\n  const base = DENSITY_PX[a.density] || 16;\n  const full = a.layout === 'full';\n  document.documentElement.style.fontSize = (full ? base * 1.14 : base) + 'px';\n  const shell = $('shell');\n  // 兼容旧配置：light/dark\n  let t = a.theme === 'light' ? 'ivory' : a.theme === 'dark' ? 'graphite' : a.theme;\n  shell.dataset.theme = THEMES.includes(t) ? t : 'ivory';\n  document.documentElement.dataset.font = FONTS.includes(a.font) ? a.font : 'hei';\n  shell.dataset.side = a.side === 'left' ? 'left' : 'right';\n  shell.dataset.layout = full ? 'full' : 'column';\n  shell.dataset.bg = a.wallpaperBg === 'photo' ? 'photo' : 'solid';\n  // 壁纸模式：整屏画面会被截图当桌面壁纸，没有窗口可以点，齿轮隐藏\n  document.body.classList.toggle('wp', a.renderMode !== 'window');\n  document.documentElement.style.setProperty('--accent', a.accent || '#2f6d8f');\n  applySafeArea();\n}\n\n/* ------------------------------------------------------------------\n   桌面图标避让\n   主进程把图标占用的横向空白带（gapX / gapW）传进来，\n   全屏模式下把内容整体挪到这条空白带里，图标区留空。\n   ------------------------------------------------------------------ */\n\nconst SAFE_GAP = 34;   // 内容离图标区的间距\n\nfunction applySafeArea() {\n  const a = CFG.appearance || {};\n  const shell = $('shell');\n  const root = document.documentElement;\n\n  const reset = () => {\n    root.style.setProperty('--safe-l', '0px');\n    root.style.setProperty('--safe-r', '0px');\n    root.style.setProperty('--safe-t', '0px');\n    root.style.setProperty('--safe-b', '0px');\n    shell.dataset.band = 'wide';\n    shell.dataset.avoid = '';\n  };\n\n  // 侧边栏模式由主进程直接挪窗口，不需要额外留白\n  if (a.avoidIcons === false || a.layout !== 'full') { reset(); return; }\n\n  const info = ICONS;\n  const vw = window.innerWidth || 1920;\n  const vh = window.innerHeight || 1080;\n  if (!info || !info.area) { reset(); return; }\n\n  const padL = Math.max(0, Math.min(vw, info.padL || 0));\n  const padT = Math.max(0, Math.min(vh, info.padT || 0));\n  const padR = Math.max(0, Math.min(vw - padL, info.padR || 0));\n  const padB = Math.max(0, Math.min(vh - padT, info.padB || 0));\n\n  const usableW = vw - padL - padR;\n  const usableH = vh - padT - padB;\n\n  // 空白区太小（比如图标铺满整屏）就不硬躲，退回整屏避免挤成一团\n  if (usableW < 520 || usableH < 320) { reset(); return; }\n\n  root.style.setProperty('--safe-l', padL + 'px');\n  root.style.setProperty('--safe-r', padR + 'px');\n  root.style.setProperty('--safe-t', padT + 'px');\n  root.style.setProperty('--safe-b', padB + 'px');\n\n  shell.dataset.avoid = (info.kind || '') + (padL > 0 ? '-l' : '');\n  shell.dataset.kind = info.kind || '';\n\n  const cols = usableW >= 1180 ? 'wide' : (usableW >= 760 ? 'mid' : 'narrow');\n  shell.dataset.band = (usableH < 520 && cols === 'wide') ? 'mid' : cols;\n\n  renderDebug();\n}\n\n/* ------------------------------------------------------------------\n   调试可视化：把识别到的内容区和图标占用框画出来\n   ------------------------------------------------------------------ */\nfunction renderDebug() {\n  let box = document.getElementById('dbgbox');\n  if (!box) {\n    box = document.createElement('div');\n    box.id = 'dbgbox';\n    document.body.appendChild(box);\n  }\n  if (!DBG) { box.style.display = 'none'; return; }\n\n  const info = ICONS;\n  if (!info || !info.area) { box.style.display = 'none'; return; }\n  const [x, y, w, h] = info.area;\n  box.style.display = 'block';\n  box.style.left = x + 'px';\n  box.style.top = y + 'px';\n  box.style.width = w + 'px';\n  box.style.height = h + 'px';\n  box.dataset.txt = `内容区 ${w}×${h} @ ${x},${y} · 图标 ${info.count} 个 · ${info.kind || ''}`;\n}\n\n/* ------------------------------------------------------------------ */\n/* 课程                                                                */\n/* ------------------------------------------------------------------ */\n\nfunction buildCourses(now, animate) {
  const list = (CFG.timetable || {})[dayKey(now)] || [];
  // Filter to only entries with a course name
  const courses = list.filter((c) => c && c.s && c.s.trim());
  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

  if (!courses.length) {
    return {
      html: buildEmpty(now),
      meta: '今日无课',
      cur: null
    };
  }

  // Sort by period number
  courses.sort((a, b) => (a.p || 0) - (b.p || 0));

  const upcoming = courses.find((c) => toMin(c.start) > nowMin) || null;
  const current = courses.find((c) => nowMin >= toMin(c.start) && nowMin < toMin(c.end)) || null;
  const animCls = animate ? ' sec-anim' : '';

  let html = `<div class="clist${animCls}">`;
  for (const c of courses) {
    const st = toMin(c.start);
    const en = toMin(c.end);
    let state = 'todo';
    if (nowMin >= en) state = 'done';
    else if (nowMin >= st) state = 'now';

    const isNext = upcoming && c.p === upcoming.p;
    let tag = '';
    if (state === 'now') tag = '<span class="tag now">进行中<\/span>';
    else if (isNext) tag = '<span class="tag next">下一节<\/span>';
    else if (state === 'done') tag = '<span class="tag done">已结束<\/span>';

    const subj = esc(c.s || '');
    const sub = [];
    sub.push(esc(c.name || ''));
    if (c.t) sub.push(esc(c.t));
    if (c.r) sub.push(esc(c.r));
    const subHtml = sub.filter(Boolean).join('<span class="dotsep">·<\/span>');

    html += `<div class="row is-${state}">
      <div class="t"><b>${esc(c.start || '')}<\/b><i>${esc(c.end || '')}<\/i><\/div>
      <div class="rail"><span class="dot"><\/span><\/div>
      <div class="c">
        <div class="c-top"><span class="subj">${subj}</span>${tag}<\/div>
        <div class="c-sub">${subHtml}<\/div>
        ${state === 'now' ? '<div class="prog"><i><\/i><\/div>' : ''}
      <\/div>
    <\/div>`;
  }
  html += '<\/div>';

  let meta = `${courses.length} 节`;
  if (current) meta = `第 ${esc(current.name || '')} · ${esc(current.end)} 下课`;
  else if (upcoming) meta = `${upcoming.start} 起 · ${esc(upcoming.name || '')}`;
  else meta = '今日课程已结束';

  return {
    html,
    meta,
    cur: current ? { start: toMin(current.start), end: toMin(current.end) } : null
  };
}
\nfunction findNextTeachingDay(now) {\n  for (let i = 1; i <= 8; i++) {\n    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);\n    const list = ((CFG.timetable || {})[dayKey(d)] || []).filter((x) => x && x.s);\n    if (list.length) return { date: d, list };\n  }\n  return null;\n}\n\nfunction buildEmpty(now) {
  const nx = findNextTeachingDay(now);
  const today = now.getDay();
  let big = '今天没有课，好好休息';
  if (today === 0 || today === 6) big = '周末愉快，今天没有课';

  let preview = '';
  if (nx) {
    const items = nx.list
      .slice()
      .sort((a, b) => (a.p || 0) - (b.p || 0))
      .slice(0, 5)
      .map((c) => {
        return `<div class="pitem"><em>${esc(c.start || '')}<\/em><span><b>${esc(c.s || '')}<\/b>${esc(c.r || '')}<\/span><\/div>`;
      })
      .join('');
    preview = `<div class="preview">
      <div class="ph">${esc(WD_LONG[nx.date.getDay()].replace('星期', '周'))} · ${nx.date.getMonth() + 1}/${nx.date.getDate()} 的课<\/div>
      <div class="plist">${items}<\/div>
    <\/div>`;
  }

  return `<div class="empty">
    <div class="big">${big}<\/div>
    <div class="sub">${nx ? '下一个上课日的安排' : '课表还没有填写，打开网页控制台就能编辑'}<\/div>
    ${preview}
  <\/div>`;
}
\n/* ------------------------------------------------------------------ */\n/* 值日                                                                */\n/* ------------------------------------------------------------------ */\n\nfunction dutyIndexOf(d, groups) {\n  const start = parseDate(CFG.dutyStartDate) || parseDate(CFG.semesterStart);\n  if (!start || !groups.length) return 0;\n  const diff = daysBetween(start, d);\n  return ((diff % groups.length) + groups.length) % groups.length;\n}\n\nfunction buildDuty(now, animate) {\n  const groups = CFG.dutyGroups || [];\n  if (!groups.length) return { html: '', meta: '' };\n\n  const idx = dutyIndexOf(now, groups);\n  const key = dateKey(now);\n  const ov = (CFG.dutyOverrides || {})[key];\n  const members = (Array.isArray(ov) && ov.length) ? ov : (groups[idx].members || []);\n  const gname = groups[idx].name || '';\n  const animCls = animate ? ' sec-anim' : '';\n\n  const people = members.map((n) => {\n    const h = hueOf(n);\n    return `<span class=\"person\">\n      <i class=\"avatar\" style=\"background:hsl(${h} 34% 52%)\">${esc(String(n).slice(0, 1))}<\/i>${esc(n)}\n    <\/span>`;\n  }).join('');\n\n  // 本周轮值表\n  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));\n  const cells = DUTY_COLS.map((w) => {\n    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + (w - 1));\n    const gi = dutyIndexOf(d, groups);\n    const isToday = dateKey(d) === key;\n    const name = groups[gi] ? groups[gi].name : '—';\n    return `<div class=\"dg${isToday ? ' is-today' : ''}\"><b>${WD_SHORT[d.getDay()]}<\/b><span>${esc(name)}<\/span><\/div>`;\n  }).join('');\n\n  return {\n    meta: `${groups.length} 组轮换`,\n    html: `${animCls ? `<div class=\"${animCls.trim()}\">` : ''}\n      <div class=\"duty-now\">\n        <div class=\"people\">${people || '<span class=\"person\" style=\"color:var(--ink-3)\">今日未安排<\/span>'}<\/div>\n        <span class=\"duty-tag\">${esc(gname || '轮值')}<\/span>\n      <\/div>\n      <div class=\"duty-grid\">${cells}<\/div>\n      ${animCls ? '<\/div>' : ''}`\n  };\n}\n\n/* ------------------------------------------------------------------ */\n/* 通知                                                                */\n/* ------------------------------------------------------------------ */\n\nfunction buildNotices(animate) {\n  const list = (CFG.notices || []).filter((n) => n && String(n.text || '').trim());\n  if (!list.length) return { html: '', meta: '' };\n  const sorted = list.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));\n  const items = sorted.map((n) =>\n    `<li class=\"${n.pinned ? 'pinned' : ''}\"><span class=\"bul\"><\/span><span>${esc(n.text)}<\/span><\/li>`\n  ).join('');\n  const animCls = animate ? ' sec-anim' : '';\n  const inner = `<ul class=\"notices\">${items}<\/ul>`;\n  return {\n    meta: `${list.length} 条`,\n    html: animCls ? `<div class=\"${animCls.trim()}\">${inner}<\/div>` : inner\n  };\n}\n\n/* ------------------------------------------------------------------ */\n/* 主渲染                                                              */\n/* ------------------------------------------------------------------ */\n\n/* ------------------------------------------------------------------ */\n/* 考试模式：控制台「发布」后，整屏显示考试计时画面                     */\n/* ------------------------------------------------------------------ */\n\nlet examTimer = null;\n\nfunction examMsOf(v) {\n  if (!v) return null;\n  const m = /^(\\d{1,2}):(\\d{2})$/.exec(String(v).trim());\n  if (!m) return null;\n  const d = new Date();\n  d.setHours(+m[1], +m[2], 0, 0);\n  return d.getTime();\n}\n\nfunction stopExamTimer() {\n  if (examTimer) { clearInterval(examTimer); examTimer = null; }\n}\n\nfunction updateExamTick() {\n  const ex = CFG && CFG.exam;\n  if (!ex || !ex.enabled) return;\n  const start = examMsOf(ex.start);\n  const end = examMsOf(ex.end);\n  const digits = document.getElementById('examDigits');\n  const label = document.getElementById('examLabel');\n  const prog = document.getElementById('examProg');\n  if (!digits) return;\n  if (end === null) { digits.textContent = '--:--:--'; return; }\n\n  const nowMs = Date.now();\n  let target = end, text = '距离考试结束';\n  if (start !== null && nowMs < start) { target = start; text = '距离考试开始'; }\n\n  let diff = Math.max(0, target - nowMs);\n  const h = Math.floor(diff / 3600000);\n  const m = Math.floor((diff % 3600000) / 60000);\n  const s = Math.floor((diff % 60000) / 1000);\n  const pad = (n) => String(n).padStart(2, '0');\n  digits.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;\n  if (label) label.textContent = text + (diff === 0 ? '（时间到）' : '');\n\n  if (prog && start !== null && end > start) {\n    const pct = Math.min(100, Math.max(0, ((nowMs - start) / (end - start)) * 100));\n    prog.style.width = pct.toFixed(1) + '%';\n  }\n}\n\nfunction renderExam(now) {\n  const ex = CFG.exam || {};\n  $('school').textContent = ex.school || CFG.school || '';\n  $('cname').textContent = ex.subject || '考试';\n  $('week').textContent = '';\n  $('date').innerHTML = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日\n    <span class=\"sep\">·<\/span> ${WD_LONG[now.getDay()]}`;\n\n  const spEl = $('special');\n  spEl.hidden = true;\n  spEl.innerHTML = '';\n\n  $('body').innerHTML = `\n    <section>\n      <div class=\"sec-h\"><h3>考试计时<\/h3><span class=\"meta\">${esc(ex.start || '')} - ${esc(ex.end || '')}<\/span><\/div>\n      <div class=\"exam-box\">\n        <div class=\"exam-label\" id=\"examLabel\">距离考试结束<\/div>\n        <div class=\"exam-digits\" id=\"examDigits\">--:--:--<\/div>\n        <div class=\"prog\"><i id=\"examProg\"><\/i><\/div>\n      <\/div>\n    <\/section>`;\n\n  updateExamTick();\n  stopExamTimer();\n  examTimer = setInterval(updateExamTick, 1000);\n  curRange = null;\n}\n\nfunction render(animate) {\n  if (!CFG) return;\n  const now = new Date();\n\n  applyAppearance();\n\n  // 考试模式：控制台点 dateProgress(new Date());\n}\n\nfunction updateProgress(now) {\n  if (!curRange) return;\n  const node = document.querySelector('.row.is-now .prog > i');\n  if (!node) return;\n  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;\n  const total = Math.max(1, curRange.end - curRange.start);\n  const pct = Math.min(100, Math.max(0, ((nowMin - curRange.start) / total) * 100));\n  node.style.width = pct.toFixed(1) + '%';\n}\n\nfunction tick() {\n  if (!CFG) return;\n  const now = new Date();\n  if (dateKey(now) !== lastDateKey) { render(false); return; }\n  if (now.getMinutes() !== lastMinute) { render(false); return; }\n  updateProgress(now);\n}\n\n/* ------------------------------------------------------------------ */\n/* 启动                                                                */\n/* ------------------------------------------------------------------ */\n\n(async function boot() {\n  try {\n    CFG = await window.deskboard.getConfig();\n  } catch (e) {\n    CFG = { className: '看板', appearance: {}, bell: [], timetable: {}, dutyGroups: [], notices: [] };\n  }\n  render(true);\n  booted = true;\n  setInterval(tick, 1000);\n\n  window.deskboard.onUpdate((cfg) => {\n    CFG = cfg;\n    render(false);\n  });\n\n  // 图标位置（主进程每次贴合桌面时刷新）→ 重算内容安全区\n  window.deskboard.onIcons((info) => {\n    ICONS = info || null;\n    applySafeArea();\n    renderDebug();\n  });\n\n  window.deskboard.onDebug((on) => {\n    DBG = !!on;\n    renderDebug();\n  });\n\n  try {\n    const inf = await window.deskboard.info();\n    if (inf && inf.icons) { ICONS = inf.icons; applySafeArea(); }\n  } catch (e) { /* ignore */ }\n\n  // 壁纸层模式下窗口收不到鼠标事件，改为只做展示，设置从托盘进入\n  window.deskboard.onMode((mode) => {\n    const wall = mode === 'wallpaper';\n    document.body.classList.toggle('mode-wallpaper', wall);\n  });\n\n  $('gear').addEventListener('click', () => window.deskboard.openEditor());\n  document.addEventListener('dblclick', (e) => {\n    if (e.target.closest('.row') 'use strict';

/* ==========================================================================
   MQTTLite · 零依赖 MQTT 3.1.1 客户端

   · 电脑端（Electron 主进程）：mqtt:// 或 mqtts:// → 直接 TCP/TLS
   · 浏览器（控制页）：ws:// 或 wss:// → 原生 WebSocket
   只实现用得到的部分：CONNECT / SUBSCRIBE / PUBLISH(QoS0) / PING / 断线重连
   ========================================================================== */

(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MQTTLite = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  var isNode = typeof process !== 'undefined' && !!(process.versions && process.versions.node) && typeof window === 'undefined';

  function utf8(s) { return new TextEncoder().encode(s); }
  function fromUtf8(b) { return new TextDecoder('utf-8').decode(b); }

  function concat(list) {
    var n = 0;
    for (var i = 0; i < list.length; i++) n += list[i].length;
    var out = new Uint8Array(n);
    var o = 0;
    for (var j = 0; j < list.length; j++) { out.set(list[j], o); o += list[j].length; }
    return out;
  }

  function u16(n) { return new Uint8Array([(n >> 8) & 255, n & 255]); }
  function mstr(b) { return concat([u16(b.length), b]); }
  function varint(n) {
    var out = [];
    do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0);
    return new Uint8Array(out);
  }
  function packet(type, flags, body) {
    return concat([new Uint8Array([(type << 4) | flags]), varint(body.length), body]);
  }

  function connPacket(clientId, ka) {
    return packet(1, 0, concat([
      mstr(utf8('MQTT')),
      new Uint8Array([4, 0x02]),        // level 4, clean session
      u16(ka),
      mstr(utf8(clientId))
    ]));
  }
  function subPacket(id, topic) {
    return packet(8, 2, concat([u16(id), mstr(utf8(topic)), new Uint8Array([0])]));
  }
  function unsubPacket(id, topic) {
    return packet(10, 2, concat([u16(id), mstr(utf8(topic))]));
  }
  function pubPacket(topic, payload, retain) {
    return packet(3, retain ? 1 : 0, concat([mstr(utf8(topic)), payload]));
  }

  function parsePackets(buf) {
    var out = [];
    var off = 0;
    while (off < buf.length) {
      var start = off;
      var h = buf[off++];
      var mult = 1;
      var len = 0;
      var b = 0;
      var ok = false;
      do {
        if (off >= buf.length) break;
        b = buf[off++];
        len += (b & 127) * mult;
        mult *= 128;
        ok = true;
      } while (b & 128);
      if (!ok || off + len > buf.length) { off = start; break; }
      out.push({ type: h >> 4, flags: h & 15, body: buf.subarray(off, off + len) });
      off += len;
    }
    return { packets: out, rest: buf.subarray(off) };
  }

  function readStr(body, off) {
    var len = (body[off] << 8) | body[off + 1];
    var s = fromUtf8(body.subarray(off + 2, off + 2 + len));
    return { value: s, next: off + 2 + len };

  function topicMatch(filter, topic) {
    var f = filter.split('/');
    var t = topic.split('/');
    for (var i = 0; i < f.length; i++) {
      if (f[i] === '#') return true;
      if (i >= t.length) return false;
      if (f[i] !== '+' && f[i] !== t[i]) return false;
    }
    return f.length === t.length;
  }

  function parseUrl(url) {
    var m = String(url).match(/^(\w+):\/\/([^/:]+)(?::(\d+))?(\/.*)?$/);
    if (!m) return null;
    return {
      scheme: m[1].toLowerCase(),
      host: m[2],
      port: parseInt(m[3], 10) || (m[1] === 'mqtts' ? 8883 : m[1] === 'wss' ? 443 : 1883),
      path: m[4] || '/mqtt'
    };

  /* ------------------------------------------------------------------ */

  function Client(urls, opts) {
    this.urls = Array.isArray(urls) ? urls.slice() : [urls];
    this.opt = opts || {};
    this.clientId = this.opt.clientId || ('db' + Math.random().toString(16).slice(2, 10));
    this.ka = this.opt.keepalive || 40;
    this.buf = new Uint8Array(0);
    this.subs = [];
    this.sock = null;
    this.connected = false;
    this.stopped = false;
    this.idx = 0;
    this.pid = 1;
    this.retry = 1200;
    this.timers = {};
    this.handlers = { connect: [], message: [], close: [], error: [], log: [] };
  }

  Client.prototype.on = function (evt, fn) {
    if (!this.handlers[evt]) this.handlers[evt] = [];
    this.handlers[evt].push(fn);
    return this;
  };

  Client.prototype._emit = function (evt) {
    var args = Array.prototype.slice.call(arguments, 1);
    var list = this.handlers[evt] || [];

    }
  };

  Client.prototype._log = function () {
    this._emit.apply(this, ['log'].concat(Array.prototype.slice.call(arguments)));
  };

  Client.prototype.start = function () {
    this.stopped = false;
    this._open();
    return this;
  };

  Client.prototype._open = function () {
    if (this.stopped) return;
    var self = this;
    var url = this.urls[this.idx % this.urls.length];
    var u = parseUrl(url);
    if (!u) { this._fail('bad url ' + url); return; }

    this._teardown();
    this.buf = new Uint8Array(0);

    var timeout = setTimeout(function () { self._fail('连接超时 ' + url); }, 9000);
    this.timers.conn = timeout;

    var opened = function () {
      clearTimeout(timeout);
      self.retry = 1200;
      self._send(connPacket(self.clientId, self.ka));
    };

      var ws;

        ws = new WebSocket(url, ['mqtt']);
      } catch (e) { this._fail(e.message); return; }
      ws.binaryType = 'arraybuffer';
      ws.onopen = opened;
      ws.onmessage = function (ev) { self._feed(new Uint8Array(ev.data)); };
      ws.onclose = function () { self._lost('websocket closed'); };
      ws.onerror = function () { self._lost('websocket error'); };
      this.sock = ws;
      this.kind = 'ws';
      return;
    }

    if (!isNode) { this._fail('浏览器只支持 ws/wss'); return; }

    var net = require('net');
    var sock;
    try {
      if (u.scheme === 'mqtts') {
        var tls = require('tls');
        sock = tls.connect({ host: u.host, port: u.port, servername: u.host });
        sock.once('secureConnect', opened);
      } else {
        sock = net.connect({ host: u.host, port: u.port });
        sock.once('connect', opened);
      }
    } catch (e) { this._fail(e.message); return; }

    sock.setNoDelay(true);
    sock.on('data', function (d) { self._feed(new Uint8Array(d)); });
    sock.on('error', function (e) { self._lost(e.code || e.message); });
    sock.on('close', function () { self._lost('tcp closed'); });

    this.kind = 'tcp';
  };

  Client.prototype._send = function (bytes) {
    if (!this.sock) return false;
    try {
      if (this.kind === 'ws') {
        if (this.sock.readyState !== 1) return false;
        this.sock.send(bytes);
      } else {
        if (this.sock.destroyed) return false;
        this.sock.write(Buffer.from(bytes));
      }
      return true;
    } catch (e) { return false; }
  };

  Client.prototype._feed = function (bytes) {
    this.buf = concat([this.buf, bytes]);
    var r = parsePackets(this.buf);
    this.buf = r.rest;
    for (var i = 0; i < r.packets.length; i++) this._handle(r.packets[i]);
  };

  Client.prototype._handle = function (p) {
    var self = this;
    if (p.type === 2) {                       // CONNACK
      if (p.body[1] === 0) {
        this.connected = true;
        clearTimeout(this.timers.conn);
        this._log('connected to', this.urls[this.idx % this.urls.length]);
        this.subs.forEach(function (s) { self._doSub(s.topic); });
        this._startPing();
        this._emit('connect');
      } else {
        this._fail('broker refused rc=' + p.body[1]);
      }
      return;
    }
    if (p.type === 3) {                       // PUBLISH
      var qos = (p.flags >> 1) & 3;
      var t = readStr(p.body, 0);
      var off = t.next;
      if (qos > 0) off += 2;
      var payload = p.body.subarray(off);
      this._emit('message', t.value, fromUtf8(payload), payload);
      return;
    }
    if (p.type === 6) {                       // PUBREL (不该出现，但别卡住)
      return;
    }
    if (p.type === 13) return;                // PINGRESP
    if (p.type === 9) {                       // SUBACK
      return;
    }
  };

  Client.prototype._startPing = function () {
    var self = this;
    clearInterval(this.timers.ping);
    this.timers.ping = setInterval(function () {
      if (self.connected) self._send(new Uint8Array([0xc0, 0]));
    }, this.ka * 600);
  };

  Client.prototype._doSub = function (topic) {
    if (!this.connected) return;
    this._send(subPacket(this.pid++, topic));
  };

  Client.prototype.subscribe = function (topic) {
    var hit = null;
    for (var i = 0; i < this.subs.length; i++) if (this.subs[i].topic === topic) hit = this.subs[i];
    if (!hit) { hit = { topic: topic, cb: null }; this.subs.push(hit); }
    this._doSub(topic);
    return this;
  };

  Client.prototype.unsubscribe = function (topic) {
    this.subs = this.subs.filter(function (s) { return s.topic !== topic; });
    if (this.connected) this._send(unsubPacket(this.pid++, topic));
    return this;
  };

  Client.prototype.publish = function (topic, payload, retain) {
    var bytes = typeof payload === 'string' ? utf8(payload) : payload;
    return this._send(pubPacket(topic, bytes, !!retain));
  };

  Client.prototype.publishJSON = function (topic, obj, retain) {
    return this.publish(topic, JSON.stringify(obj), retain);
  };

  Client.prototype._teardown = function () {
    clearInterval(this.timers.ping);
    clearTimeout(this.timers.conn);
    var s = this.sock;
    this.sock = null;
    this.connected = false;
    if (!s) return;
    try {
      if (this.kind === 'ws') { s.onclose = null; s.onerror = null; s.close(); }
      else { s.removeAllListeners && s.removeAllListeners(); s.destroy(); }
    } catch (e) { /* ignore */ }
  };

  Client.prototype._lost = function (why) {
    if (!this.connected && !this.sock) return;
    var was = this.connected;
    this._teardown();
    if (was) { this._log('disconnected', why); this._emit('close', why); }
    this._retryLater();
  };

  Client.prototype._fail = function (why) {
    this._teardown();
    this.idx++;
    this._log('connect failed', why);
    this._emit('error', why);
    this._retryLater();
  };

  Client.prototype._retryLater = function () {
    if (this.stopped) return;
    var self = this;
    clearTimeout(this.timers.retry);
    var d = this.retry;
    this.retry = Math.min(15000, Math.round(this.retry * 1.7));
    this.timers.retry = setTimeout(function () { self._open(); }, d);
  };

  Client.prototype.stop = function () {
    this.stopped = true;
    clearTimeout(this.timers.retry);
    this._teardown();
  };

  return {
    Client: Client,
    topicMatch: topicMatch,
    encode: { packet: packet, connPacket: connPacket, subPacket: subPacket, pubPacket: pubPacket },
    decode: parsePackets
  };
});

<script>

/* ==========================================================================
   DeskBoard · 远程控制端桥接

   主题：
     deskboard/v3/<code>/rpc   我 → 教室机
     deskboard/v3/<code>/rep   教室机 → 我
     deskboard/v3/<code>/cfg   教室机 → 我（当前配置，retain）

(function () {

      setTimeout(function () {
        var v = $('#rmveil');
        if (v) v.hidden = true;
      }, 500);
    }
  }

  function loadRooms() {
    try { rooms = JSON.parse(localStorage.getItem(LS_ROOMS) || '[]'); } catch (e) { rooms = []; }
    if (!Array.isArray(rooms)) rooms = [];
    return rooms;
  }

  function saveRooms() {
    try { localStorage.setItem(LS_ROOMS, JSON.stringify(rooms)); } catch (e) { /* ignore */ }
  }

  function normCode(v) {
    var s = String(v || '').replace(/[^0-9]/g, '');
    return s.length === 8 ? s : '';
  }

  function roomOf(c) {
    for (var i = 0; i < rooms.length; i++) if (rooms[i].code === c) return rooms[i];
    return null;
  }

  function upsertRoom(c, name) {
    var r = roomOf(c);
    if (!r) { r = { code: c, name: name || ('教室 ' + c) }; rooms.push(r); }
    if (name) r.name = name;
    r.last = Date.now();
    saveRooms();
  }

  /* ---------------- MQTT ---------------- */

  function base() { return PREFIX + '/' + code; }

  function connect(c) {
    if (!window.MQTTLite) { setState('offline', '缺少 MQTT 组件'); return; }
    code = c;
    try { localStorage.setItem(LS_LAST, c); } catch (e) { /* ignore */ }

    if (client) { try { client.stop(); } catch (e) { /* ignore */ } }
    cfg = null;
    remoteInfo = {};
    setState('connecting', '正在连接 ' + c + '…');

    client = new window.MQTTLite.Client(BROKERS, {
      clientId: 'ctl_' + c + '_' + Math.random().toString(16).slice(2, 8),
      keepalive: 40
    });

    client.on('connect', function () {
      client.subscribe(base() + '/state');
      client.subscribe(base() + '/cfg');
      client.subscribe(base() + '/rep');
      setState('connecting', '已连上中转服务器，正在确认教室机…');
      setTimeout(function () {
        if (state !== 'online') setState('offline', '这台教室没有响应（检查是否开机 / 码是否正确）');
      }, 6000);
    });

    client.on('message', function (topic, payload) {
      var m = null;
      try { m = JSON.parse(payload); } catch (e) { return; }
      if (!m || typeof m !== 'object') return;

      if (topic === base() + '/state') {
        remoteInfo = m;
        if (m.online) {
          setState('online', '已连接：' + (m.className || m.school || code));
          if (m.className) upsertRoom(code, m.className);
          emit('info', { version: m.version, className: m.className, code: code });
        } else {
          setState('offline', '教室机已退出');
        }
        return;
      }

      if (topic === base() + '/cfg') {
        cfg = m;
        emit('config', m);
        emit('info', { code: code });
        return;
      }

      if (topic === base() + '/rep') {
        var p = pending[m.id];
        if (!p) return;
        delete pending[m.id];
        clearTimeout(p.timer);
        if (m.ok) p.resolve(m.data);
        else p.reject(new Error(m.err || '操作失败'));
      }
    });

    client.on('close', function (why) {
      if (state === 'online') setState('connecting', '连接中断，正在重连…（' + (why || '') + '）');
    });

    client.start();
  }

  function rpc(op, payload, timeout) {
    return new Promise(function (resolve, reject) {
      if (!client || !client.connected || !code) {
        reject(new Error('还没连接到教室'));
        return;
      }
      var id = 'c' + (++seq) + '_' + Math.random().toString(16).slice(2, 6);
      var timer = setTimeout(function () {
        delete pending[id];
        reject(new Error('教室没有响应（超时）'));
      }, timeout || 9000);
      pending[id] = { resolve: resolve, reject: reject, timer: timer };
      var msg = { id: id, op: op, from: 'control-page' };
      if (payload !== undefined) {
        if (op === 'set') msg.config = payload;
        else Object.assign(msg, payload);
      }
      client.publishJSON(base() + '/rpc', msg);
    });
  }

  /* ---------------- 界面 ---------------- */

  var STYLE = ''
    + '#rmveil{position:fixed;inset:0;z-index:9999;background:rgba(20,24,30,.55);backdrop-filter:blur(6px);'

    + '.rmcard{width:min(92vw,460px);background:#fff;border-radius:16px;padding:26px 26px 20px;box-shadow:0 24px 60px rgba(0,0,0,.28)}'
    + '.rmcard h2{margin:0 0 6px;font-size:19px;letter-spacing:.02em}'
    + '.rmcard p{margin:0 0 16px;color:#7a8189;font-size:13px}'
    + '.rminput{width:100%;box-sizing:border-box;padding:14px 16px;font-size:26px;letter-spacing:.28em;'

    + '.rminput:focus{border-color:#2f6d8f;box-shadow:0 0 0 4px rgba(47,109,143,.12)}'
    + '.rmrow{display:flex;gap:10px;margin-top:14px}'
    + '.rmbtn{flex:1;padding:12px 16px;border:0;border-radius:11px;background:#2f6d8f;color:#fff;font-size:14px;'
    + 'font-weight:600;cursor:pointer;transition:.16s}'
    + '.rmbtn:hover{background:#275a77}'
    + '.rmbtn[disabled]{opacity:.55;cursor:default}'
    + '.rmbtn.ghost{background:#f0f2f5;color:#4a5460}'

    + '.rmlist{margin-top:16px;border-top:1px solid #edf0f3;padding-top:12px;max-height:180px;overflow:auto}'
    + '.rmlist h3{margin:0 0 8px;font-size:12px;color:#9aa1a9;font-weight:500;letter-spacing:.06em}'

    + '.rmitem:hover{background:#f4f6f8}'

    + '.rmitem span{margin-left:auto;font-family:ui-monospace,Consolas,monospace;color:#8b939b;font-size:12.5px}'

    + 'padding:9px 15px;border-radius:999px;background:linear-gradient(135deg,#2f6d8f,#3e88ae);color:#fff;'
    + 'box-shadow:0 8px 22px rgba(47,109,143,.36);cursor:pointer;font:600 13px/1 system-ui,"Microsoft YaHei",sans-serif}'

    + '#rmpanel[hidden]{display:none}'
    + '.rmp-card{width:min(94vw,520px);background:#fff;border-radius:16px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}'
    + '.rmp-card h2{margin:0 0 6px;font-size:18px}'
    + '.rmp-card p{margin:0 0 14px;color:#7a8189;font-size:12.5px}'

    + '#rmtext:focus{border-color:#2f6d8f;box-shadow:0 0 0 4px rgba(47,109,143,.12)}'
    + '.rmp-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}'
    + '.chip{padding:7px 12px;border-radius:999px;background:#f0f2f5;color:#4a5460;font-size:12.5px;cursor:pointer;'
    + 'border:1.5px solid transparent;transition:.14s;user-select:none}'
    + '.chip:hover{background:#e7ebf0}'
    + '.chip.on{border-color:#2f6d8f;color:#2f6d8f;background:#eef4f8}';

  function injectUI() {
    var st = document.createElement('style');
    st.textContent = STYLE;
    document.head.appendChild(st);

    var veil = document.createElement('div');
    veil.id = 'rmveil';
    veil.innerHTML = ''
      + '<div class="rmcard">'
      + '  <h2>连接教室</h2>'
      + '  <p>输入那台教室电脑的 8 位连接码（托盘菜单里能看到，点击即可复制）</p>'
      + '  <input id="rmcode" class="rminput" inputmode="numeric" maxlength="12" placeholder="00000000" autocomplete="off">'
      + '  <div class="rmrow">'
      + '    <button class="rmbtn" id="rmgo">连接</button>'
      + '    <button class="rmbtn ghost" id="rmclose">先不连</button>'
      + '  </div>'
      + '  <div class="rmmsg" id="rmmsg"></div>'
      + '  <div class="rmlist" id="rmlist" hidden><h3>我的教室</h3><div id="rmrooms"></div></div>'
      + '</div>';
    document.body.appendChild(veil);

    var pill = document.createElement('div');
    pill.id = 'rmpill';
    pill.hidden = true;
    pill.innerHTML = '<i></i><b>未连接</b><span></span>';
    document.body.appendChild(pill);

    var shoutBtn = document.createElement('div');
    shoutBtn.id = 'rmshout';
    shoutBtn.hidden = true;
    shoutBtn.title = '向这间教室喊话';
    shoutBtn.innerHTML = '<span style="font-size:15px">📢</span><b>喊话</b>';
    document.body.appendChild(shoutBtn);

    var panel = document.createElement('div');
    panel.id = 'rmpanel';
    panel.hidden = true;
    panel.innerHTML = ''
      + '<div class="rmp-card">'
      + '  <h2>教室喊话</h2>'
      + '  <p>内容会以大字横幅出现在那间教室的屏幕正中，到时间自动消失。</p>'
      + '  <textarea id="rmtext" maxlength="80" placeholder="例如：请安静，开始自习"></textarea>'
      + '  <div class="rmp-row" id="rmpresets"></div>'
      + '  <div class="rmp-row" id="rmdurs"></div>'
      + '  <div class="rmp-row"><span class="chip on" id="rmvoice" data-on="1">🔊 同时语音播报</span></div>'
      + '  <div class="rmrow">'
      + '    <button class="rmbtn" id="rmsend">发送喊话</button>'
      + '    <button class="rmbtn ghost" id="rmpclose">关闭</button>'
      + '  </div>'
      + '  <div class="rmmsg" id="rmpmsg"></div>'
      + '</div>';
    document.body.appendChild(panel);

    var PRESETS = ['请安静，开始自习', '上课了，请回座位', '请把作业交上来', '值日生留下打扫', '午休时间，请勿喧哗', '认真听讲，注意纪律'];
    $('#rmpresets').innerHTML = PRESETS.map(function (t) {
      return '<span class="chip" data-t="' + esc(t) + '">' + esc(t) + '</span>';
    }).join('');
    $('#rmdurs').innerHTML = [
      ['10 秒', 10000], ['30 秒', 30000], ['1 分钟', 60000], ['5 分钟', 300000]
    ].map(function (d, i) {
      return '<span class="chip' + (i === 1 ? ' on' : '') + '" data-ms="' + d[1] + '">' + d[0] + '</span>';
    }).join('');

    shoutBtn.addEventListener('click', function () {
      panel.hidden = false;
      setTimeout(function () { $('#rmtext').focus(); }, 80);
    });
    $('#rmpclose').addEventListener('click', function () { panel.hidden = true; });
    $('#rmpresets').addEventListener('click', function (e) {
      var c = e.target.closest('.chip');
      if (!c) return;
      $('#rmtext').value = c.getAttribute('data-t');
      $('#rmtext').focus();
    });
    $('#rmdurs').addEventListener('click', function (e) {
      var c = e.target.closest('.chip');
      if (!c) return;
      Array.prototype.forEach.call($('#rmdurs').children, function (x) { x.classList.remove('on'); });
      c.classList.add('on');
    });
    $('#rmsend').addEventListener('click', sendShout);
    $('#rmvoice').addEventListener('click', function (e) {
      var c = e.currentTarget;
      var on = c.getAttribute('data-on') === '1' ? '0' : '1';
      c.setAttribute('data-on', on);
      c.classList.toggle('on', on === '1');
      c.textContent = on === '1' ? '🔊 同时语音播报' : '🔇 只显示文字';
    });
    $('#rmtext').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendShout();
    });

    var input = $('#rmcode');
    input.addEventListener('input', function () {
      var v = input.value.replace(/[^0-9]/g, '').slice(0, 8);
      input.value = v;
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') go();
    });
    $('#rmgo').addEventListener('click', go);
    $('#rmclose').addEventListener('click', function () { veil.hidden = true; });
    pill.addEventListener('click', function () { veil.hidden = false; paint(); input.focus(); input.select(); });

    renderRooms();
    paint();
    setTimeout(function () { try { input.focus(); } catch (e) { /* ignore */ } }, 120);
  }

  function go() {
    var c = normCode($('#rmcode').value);
    if (!c) { msg('连接码是 8 位数字', true); return; }
    msg('正在连接 ' + c + ' …', false);
    $('#rmgo').disabled = true;
    connect(c);
    var started = Date.now();
    var wait = setInterval(function () {
      if (state === 'online') {
        clearInterval(wait);
        $('#rmgo').disabled = false;
        msg('已连接：' + (remoteInfo.className || c), false, true);
        setTimeout(function () {
          $('#rmveil').hidden = true;
          var ed = window.__dbBoot;
          if (typeof ed === 'function') ed();
        }, 600);
      } else if (Date.now() - started > 9000) {
        clearInterval(wait);
        $('#rmgo').disabled = false;
        msg('这台教室没有响应：确认那台电脑开着 DeskBoard、连接码正确', true);
      }
    }, 300);
  }

  function msg(t, isErr, ok) {
    var el = $('#rmmsg');
    if (!el) return;
    el.textContent = t || '';
    el.className = 'rmmsg' + (isErr ? ' err' : ok ? ' ok' : '');
  }

  function msgPan(t, isErr, ok) {
    var el = $('#rmpmsg');
    if (!el) return;
    el.textContent = t || '';
    el.className = 'rmmsg' + (isErr ? ' err' : ok ? ' ok' : '');
  }

  function sendShout() {
    var el = $('#rmtext');
    var text = (el && el.value ? el.value : '').trim();
    var durEl = $('#rmdurs .chip.on');
    var ms = durEl ? parseInt(durEl.getAttribute('data-ms'), 10) : 30000;
    if (!text) { msgPan('先写点内容再发送', true); return; }
    if (state !== 'online') { msgPan('还没连上教室', true); return; }

    var btn = $('#rmsend');
    var voiceEl = $('#rmvoice');
    var voice = voiceEl ? voiceEl.getAttribute('data-on') === '1' : true;
    btn.disabled = true;
    msgPan('发送中…', false);
    rpc('shout', { text: text, ms: ms, voice: voice }, 8000).then(function () {
      msgPan('已发送到 ' + (remoteInfo.className || code) + '，显示 ' + Math.round(ms / 1000) + ' 秒' + (voice ? '，同时语音播报' : ''), false, true);
      btn.disabled = false;
      setTimeout(function () {
        var p = $('#rmpanel');
        if (p) p.hidden = true;
        if (el) el.value = '';
        msgPan('', false);
      }, 900);
    }).catch(function (e) {
      msgPan((e && e.message) || '发送失败', true);
      btn.disabled = false;
    });
  }

  function renderRooms() {
    var list = $('#rmlist');
    var box = $('#rmrooms');
    if (!list || !box) return;
    if (!rooms.length) { list.hidden = true; return; }
    list.hidden = false;
    box.innerHTML = rooms
      .slice()
      .sort(function (a, b) { return (b.last || 0) - (a.last || 0); })
      .map(function (r) {
        return '<div class="rmitem" data-code="' + esc(r.code) + '">'
          + '<i class="' + (r.code === code && state === 'online' ? 'on' : '') + '"></i>'
          + '<b>' + esc(r.name || ('教室 ' + r.code)) + '</b>'
          + '<span>' + esc(r.code) + '</span></div>';
      })
      .join('');
    Array.prototype.forEach.call(box.querySelectorAll('.rmitem'), function (el) {
      el.addEventListener('click', function () {
        $('#rmcode').value = el.getAttribute('data-code');
        go();
      });
    });
  }

  function paint() {
    var pill = $('#rmpill');
    if (!pill) return;
    pill.hidden = state !== 'online';
    pill.setAttribute('data-s', state);
    var b = pill.querySelector('b');
    var s = pill.querySelector('span');
    if (b) b.textContent = state === 'online' ? (remoteInfo.className || '已连接') : '连接中…';
    if (s) s.textContent = state === 'online' ? code : '';
    var sb = $('#rmshout');
    if (sb) sb.hidden = state !== 'online';
    var v = $('#rmveil');
    if (v && state === 'online' && !v.hidden) renderRooms();
  }

  /* ---------------- 对外接口（编辑器复用） ---------------- */

  function on(list, cb) {
    if (!handlers[list]) handlers[list] = [];
    handlers[list].push(cb);
    return function () {
      var i = handlers[list].indexOf(cb);
      if (i >= 0) handlers[list].splice(i, 1);
    };
  }

  var bridge = {
    __remote: true,

    getConfig: function () {
      if (cfg) return Promise.resolve(clone(cfg));
      return rpc('get').then(function (d) {
        cfg = d && d.config;
        if (!cfg) throw new Error('教室没有返回配置');
        return clone(cfg);
      });
    },

    saveConfig: function (next) {
      return rpc('set', next, 12000).then(function (d) {
        cfg = (d && d.config) || next;
        emit('config', cfg);
        return { ok: true, config: clone(cfg) };
      });
    },

    resetConfig: function () {
      return rpc('reset', undefined, 12000).then(function (d) {
        cfg = (d && d.config) || cfg;
        emit('config', cfg);
        return { ok: true, config: clone(cfg) };
      });
    },

    info: function () {
      return Promise.resolve({
        version: remoteInfo.version || '',
        code: code,
        className: remoteInfo.className || '',
        configPath: '教室机本地',
        embedOk: true,
        embedMode: 'wallpaper',
        webUrl: '',
        remote: true
      });
    },

    scanIcons: function () { return rpc('scan', undefined, 15000); },
    refresh: function () { return rpc('scan', undefined, 15000); },
    setCode: function () { return Promise.resolve({ ok: false, err: '连接码只能在教室那台电脑上改' }); },
    openFolder: function () { return Promise.resolve(false); },
    quit: function () { return Promise.resolve(false); },
    openEditor: function () {},
    closeEditor: function () { try { window.close(); } catch (e) { /* ignore */ } },

    onUpdate: function (cb) { return on('config', cb); },
    onIcons: function (cb) { return on('icons', cb); },
    onMode: function (cb) { return on('mode', cb); },
    onDebug: function (cb) { return on('debug', cb); },
    onInfo: function (cb) { return on('info', cb); },
    onStatus: function (cb) {
      on('status', cb);
      setTimeout(function () { cb({ state: state, detail: detail }); }, 0);
      return function () {};
    },
    reconnect: function () { if (code) connect(code); },
    get code() { return code; },
    get state() { return state; }
  };

  window.deskboard = bridge;

  /* ---------------- 实时预览（单文件版没有 /preview 接口） ---------------- */

  function setupPreview() {
    var f = document.querySelector('#pv');
    if (!f || f.dataset.dbLocal) return;
    if (!window.__DB_PREVIEW_HTML) return;
    f.dataset.dbLocal = '1';
    f.removeAttribute('src');
    f.srcdoc = window.__DB_PREVIEW_HTML;
  }

  function watchPreview() {
    setupPreview();
    if (typeof MutationObserver === 'undefined') return;
    var mo = new MutationObserver(function () { setupPreview(); });
    mo.observe(document.body, { childList: true, subtree: true });
  }

  function boot() {
    loadRooms();
    injectUI();
    watchPreview();
    var last = '';
    try { last = localStorage.getItem(LS_LAST) || ''; } catch (e) { /* ignore */ }
    // 支持 教室控制端.html?code=43079865 直接连（可以做成快捷方式发给老师）
    try {
      var q = new URLSearchParams(location.search).get('code');
      if (normCode(q)) last = normCode(q);
    } catch (e) { /* ignore */ }
    if (normCode(last)) {
      var inp = $('#rmcode');
      if (inp) inp.value = last;
      connect(last);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

<script>
'use strict';

/* ==========================================================================
   DeskBoard · 设置界面
   ========================================================================== */

let cfg = null;
let INFO = {};
let tab = 'basic';
let dirty = false;

// 是否嵌在「学勤管家」里打开（经父页 postMessage 拿到学生/作息/课程表）

const DAYS = [
  { k: '1', n: '周一' }, { k: '2', n: '周二' }, { k: '3', n: '周三' },
  { k: '4', n: '周四' }, { k: '5', n: '周五' }, { k: '6', n: '周六' },
  { k: '7', n: '周日' }
];

/* ---------------- 路径读写 ---------------- */
function setPath(obj, path, val) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    if (o[k] === undefined || o[k] === null) o[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    o = o[k];
  }
  o[parts[parts.length - 1]] = val;
}
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}

function field(label, bind, value, opts) {
  const o = opts || {};
  const type = o.type || 'text';
  const attrs = [
    `data-b="${bind}"`,
    o.num ? 'data-num="1"' : '',
    o.arr ? 'data-arr="1"' : '',
    o.ph ? `placeholder="${esc(o.ph)}"` : '',
    o.step ? `step="${o.step}"` : '',
    o.min !== undefined ? `min="${o.min}"` : '',
    o.max !== undefined ? `max="${o.max}"` : ''
  ].filter(Boolean).join(' ');
  return `<div class="field">
    <label>${esc(label)}</label>
    <input type="${type}" ${attrs} value="${esc(value == null ? '' : value)}">
    ${o.hint ? `<small>${esc(o.hint)}</small>` : ''}
  </div>`;
}

function selectField(label, bind, value, options) {
  const opts = options.map((o) =>
    `<option value="${esc(o.v)}"${String(o.v) === String(value) ? ' selected' : ''}>${esc(o.t)}</option>`
  ).join('');
  return `<div class="field"><label>${esc(label)}</label>
    <select data-b="${bind}">${opts}</select></div>`;
}

   —— 控制台被内联进学勤管家浮层时，通过 postMessage 向父页要数据，
      父页回传 STUDENTS / classTimetableData / timetableSchedule / timetablePeriodNames。

// 课程表可选班级下拉
function classOptions() {
  const ct = (xqgjData && xqgjData.classTimetable) || {};
  const keys = Object.keys(ct);
  if (!keys.length) return '<option value="">（学勤管家暂无班级课程表）</option>';
  const cur = cfg.className || '';
  return keys.map((k) =>
    `<option value="${esc(k)}"${k === cur ? ' selected' : ''}>${esc(k)}</option>`
  ).join('');
}

// 从作息表里挑"节次最多"的那天作为模板（周一~周四通常最全，周五少、周末空）
function bestScheduleDay(schedule) {
  let best = '1', cnt = -1;
  for (const d of ['1', '2', '3', '4', '5', '6', '7']) {
    const arr = (schedule && schedule[d]) || [];
    const n = arr.filter((s) => s && s.start && s.end).length;
    if (n > cnt) { cnt = n; best = d; }
  }
  return best;
}

// 把学勤管家的作息（每天节次时间）转成 DeskBoard 的 bell 列表
function buildBellFromSchedule(schedule, periodNames) {
  const arr = ((schedule && schedule[bestScheduleDay(schedule)]) || []);
  const bell = [];
  arr.forEach((slot, i) => {
    if (slot && slot.start && slot.end) {
      bell.push({
        id: i + 1,
        name: (periodNames && periodNames[i]) || ('第' + (i + 1) + '节'),
        start: slot.start,
        end: slot.end,
        brk: false
      });
    }
  });
  return bell;
}

// 把学勤管家某个班的课程表转成 DeskBoard 的 timetable
function buildTimetableFromClass(classTimetable, className) {
  const cls = (classTimetable && classTimetable[className]) || {};
  const tt = {};
  Object.keys(cls).forEach((key) => {
    const m = /^(\d+)-(\d+)$/.exec(key);
    if (!m) return;
    const d = m[1], p = Number(m[2]);
    const cell = cls[key] || {};
    (tt[d] = tt[d] || []).push({ p, s: cell.subject || '', t: cell.teacher || '', r: cell.room || '' });
  });
  Object.keys(tt).forEach((d) => tt[d].sort((a, b) => a.p - b.p));
  return tt;
}

function importBellFromXqgj() {
  if (!xqgjData) { toast('正在读取学勤管家数据…'); return; }
  const bell = buildBellFromSchedule(xqgjData.schedule, xqgjData.periodNames);
  if (!bell.length) {
    // 作息取自「我的课程表」里每节课的时间设置；没设置过就取不到
    toast(xqgjData.scheduleConfigured === false
      ? '学勤管家里还没有设置每节课的时间，无法获取作息'
      : '没有取到作息数据');
    return;
  }
  cfg.bell = bell;
  cfg.bellSource = 'xqgj';
  markDirty(); render();
  toast('已从学勤管家获取作息时间');
}

function importDutyFromXqgj() {
  if (!xqgjData) { toast('正在读取学勤管家数据…'); return; }
  const list = xqgjData.dutyGroups || [];
  if (!list.length) {
    toast(xqgjData.dutyClass
      ? ('学勤管家「' + xqgjData.dutyClass + '」还没有设置值日分组')
      : '学勤管家还没有设置值日分组');
    return;
  }
  cfg.dutyGroups = list.map((g) => ({ name: g.name || '', members: (g.members || []).slice() }));
  markDirty(); render();
  toast('已导入 ' + cfg.dutyGroups.length + ' 个值日分组');
}

function importStudentsFromXqgj(cls) {
  if (!xqgjData) { toast('正在读取学勤管家数据…'); return; }
  const list = (xqgjData.students && xqgjData.students[cls]) || [];
  if (!list.length) { toast('学勤管家「' + cls + '」没有学生'); return; }
  cfg.students = list.map((s) => ({ name: s.name || '', gender: s.gender || '' }));
  markDirty(); render();
  toast('已导入 ' + cfg.students.length + ' 名学生');
}

function importTimetableFromXqgj(cls) {
  if (!xqgjData) { toast('正在读取学勤管家数据…'); return; }
  const ct = (xqgjData.classTimetable) || {};
  if (!ct[cls]) { toast('学勤管家没有「' + cls + '」的课程表'); return; }
  // 课程表和作息在学勤管家是一体的，一并导入保证节次一致
  cfg.bell = buildBellFromSchedule(xqgjData.schedule, xqgjData.periodNames);
  cfg.timetable = buildTimetableFromClass(ct, cls);
  if (cls) cfg.className = cls;
  markDirty(); render();
  toast('已导入「' + cls + '」课程表与作息时间');
}

/* 读取内嵌「考试计时器」页面当前设置，发布到桌面看板 */
function readExamSettings() {
  return new Promise((resolve) => {
    const fr = $('examFrame');
    if (!fr || !fr.contentWindow) { resolve(null); return; }
    let done = false;
    const onMsg = (e) => {
      const d = e && e.data;
      if (!d || d.type !== 'ksjsq-settings') return;
      done = true;
      window.removeEventListener('message', onMsg);
      resolve(d.payload || null);
    };
    window.addEventListener('message', onMsg);
    try { fr.contentWindow.postMessage({ type: 'ksjsq-get-settings' }, '*'); } catch (e) { /* ignore */ }
    setTimeout(() => { if (!done) { window.removeEventListener('message', onMsg); resolve(null); } }, 2500);
  });
}

async function publishExam() {
  const got = await readExamSettings();
  if (!got || (!got.subject && !got.start)) {
    toast('还没读到考试设置，请先在下面的计时器里点「设置」并确定');
    return;
  }
  cfg.exam = {
    enabled: true,
    school: got.school || '',
    subject: got.subject || '',
    start: got.start || '',
    end: got.end || '',
    publishedAt: Date.now()
  };
  markDirty(); render();
  try { await save(); } catch (e) { /* ignore */ }
  toast('已发布，电脑桌面已切换为考试计时器');
}

async function stopExam() {
  cfg.exam = Object.assign({}, cfg.exam || {}, { enabled: false });
  markDirty(); render();
  try { await save(); } catch (e) { /* ignore */ }
  toast('已结束考试，桌面恢复常规看板');
}

function onXqgjMessage(e) {
  const d = e && e.data;
  if (!d || d.type !== 'db-xqgj-data') return;
  xqgjData = (d.payload) || {};
  // 作息时间默认取自「学勤管家」的课程表时间设定：
  // 只要用户没有手工改过作息（bellSource !== 'manual'），就以其为准。
  if (inXqgj && xqgjData.schedule && cfg.bellSource !== 'manual') {
    const nb = buildBellFromSchedule(xqgjData.schedule, xqgjData.periodNames);
    if (nb && nb.length) {
      cfg.bell = nb;
      cfg.bellSource = 'xqgj';
      markDirty();
      toast('已从学勤管家获取作息时间');
    }
  }
  if (tab === 'timetable' || tab === 'students' || tab === 'duty') render();
}
