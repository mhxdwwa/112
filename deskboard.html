<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src wss: https:; frame-src 'self' https:">
  <title>班级桌面管理 · DeskBoard</title>
  <style>
:root {
  --accent: #2f6d8f;
  --ink: #1e2329;
  --ink-2: #5b6470;
  --ink-3: #98a1ab;
  --line: #e6e3dc;
  --line-2: #efede7;
  --bg: #f7f5f1;
  --card: #ffffff;
  --danger: #b04a3a;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; height: 100%; }

/* ---------------- 侧栏 ---------------- */
.side {
  width: 208px;
  flex: 0 0 208px;
  background: linear-gradient(175deg, #fbfaf7, #f4f2ec);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 12px 10px;
}

.brand { display: flex; gap: 9px; align-items: center; padding: 2px 6px 18px; }
.logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent));
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 4px 12px -6px color-mix(in srgb, var(--accent) 70%, transparent);
}
.brand-t b { display: block; font-size: 13.5px; letter-spacing: .01em; }
.brand-t span { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; }

.nav { display: flex; flex-direction: column; gap: 1px; flex: 1; }
.nav-i {
  display: flex; align-items: center; gap: 9px;
  border: 0; background: transparent; text-align: left;
  padding: 8px 10px; border-radius: 8px;
  font-size: 12.5px; color: var(--ink-2); font-family: inherit;
  cursor: pointer; transition: background .15s, color .15s;
}
.nav-i i {
  font-style: normal; font-size: 9.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums; letter-spacing: .04em;
  width: 15px;
}
.nav-i:hover { background: rgba(30, 35, 41, .045); color: var(--ink); }
.nav-i.is-on {
  background: color-mix(in srgb, var(--accent) 11%, transparent);
  color: var(--accent); font-weight: 600;
}
.nav-i.is-on i { color: color-mix(in srgb, var(--accent) 65%, transparent); }

.side-f { padding: 8px 10px 2px; border-top: 1px solid var(--line-2); margin-top: 8px; }
.dirty { font-size: 11px; color: var(--ink-3); }
.dirty.is-dirty { color: #a8761f; }

/* ---------------- 主区 ---------------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding: 20px 26px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .55);
}
.top h1 { font-size: 16px; margin: 0; letter-spacing: .01em; }
.top p { font-size: 11.5px; color: var(--ink-3); margin: 4px 0 0; }

.acts { display: flex; gap: 8px; align-items: center; }

.btn {
  border: 0; border-radius: 8px; padding: 8px 15px;
  font-size: 12.5px; font-family: inherit; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 500;
  box-shadow: 0 6px 16px -12px color-mix(in srgb, var(--accent) 90%, transparent);
  transition: filter .15s, transform .06s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn.ghost {
  background: #fff; color: var(--ink-2);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn.ghost:hover { background: #faf9f6; color: var(--ink); }

.pane {
  flex: 1; overflow-y: auto; padding: 20px 26px 40px;
}
.pane::-webkit-scrollbar { width: 9px; }
.pane::-webkit-scrollbar-thumb { background: #d9d5cc; border-radius: 5px; border: 2px solid var(--bg); }

/* ---------------- 卡片与表单 ---------------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 14px;
}
.card > h2 {
  font-size: 12.5px; font-weight: 600; margin: 0 0 3px;
  display: flex; align-items: center; gap: 7px;
}
.card > h2::before {
  content: ""; width: 3px; height: 12px; border-radius: 2px;
  background: var(--accent);
}
.card > .hint { font-size: 11.5px; color: var(--ink-3); margin: 0 0 14px 10px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 11.5px; color: var(--ink-2); }
.field small { font-size: 10.5px; color: var(--ink-3); }

input[type="text"], input[type="date"], input[type="time"], select, textarea {
  font-family: inherit; font-size: 12.5px; color: var(--ink);
  background: #fff; border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: color-mix(in srgb, var(--accent) 55%, #fff);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] {
  width: 100%; height: 32px; padding: 2px; border: 1px solid var(--line);
  border-radius: 7px; background: #fff; cursor: pointer;
}
textarea { resize: vertical; min-height: 60px; line-height: 1.55; }

.row-inline { display: flex; align-items: center; gap: 8px; }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.chk input { accent-color: var(--accent); width: 14px; height: 14px; }

/* 表格式列表 */
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tbl th {
  text-align: left; font-weight: 500; font-size: 11px; color: var(--ink-3);
  padding: 0 8px 7px; letter-spacing: .03em;
}
table.tbl td { padding: 3px 4px; vertical-align: middle; }
table.tbl td.tight { width: 1%; white-space: nowrap; }

.icon-btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
  display: inline-grid; place-items: center; font-size: 13px; line-height: 1;
  font-family: inherit; transition: all .15s;
}
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

.add-row {
  margin-top: 10px; border: 1px dashed var(--line); background: transparent;
  color: var(--ink-2); border-radius: 8px; padding: 7px 12px;
  font-size: 12px; font-family: inherit; cursor: pointer; width: 100%;
  transition: all .15s;
}
.add-row:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }

/* 编辑类表格（作息/值日/通知/特殊日期）横向滚动容器 */
.tbscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* 课程表网格（格式对齐学勤管家「我的课程表」：节次列 + 周一~周日，点格子编辑） */
.ttg-wrap {
  overflow-x: auto; border: 1px solid var(--line); border-radius: 10px;
  -webkit-overflow-scrolling: touch; background: var(--card);
}
.ttg { display: grid; min-width: 100%; }
.ttg-h {
  background: #faf9f6; font-weight: 600; font-size: 12px; color: var(--ink-2);
  padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line);
}
.ttg-corner { color: var(--ink-3); }
.ttg-p {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 8px 4px; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  background: #fcfbf8; text-align: center;
}
.ttg-p b { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.ttg-p span { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ttg-c {
  min-height: 52px; padding: 6px 4px; cursor: pointer;
  border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: background .15s;
}
.ttg-c:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.ttg-c:active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ttg-c b { font-size: 13px; font-weight: 700; color: var(--ink); }
.ttg-c span { font-size: 10.5px; color: var(--ink-2); }
.ttg-c.is-empty i { font-style: normal; font-size: 15px; color: #c9cdd3; }
.ttg-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 12px; }
.ttg-lb { font-size: 12px; color: var(--ink-2); }
.ttg-sel {
  padding: 7px 8px; font-size: 12px; border: 1px solid var(--line);
  border-radius: 7px; background: #fff; color: var(--ink);
}
.ttg-grow { flex: 1; }
.ttg-empty {
  padding: 26px 16px; text-align: center; font-size: 12.5px; color: var(--ink-3);
  border: 1px dashed var(--line); border-radius: 10px; line-height: 1.7;
}
/* 课程表格子里显示「当天这一节的时间」 */
.ttg-t { font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* 分日作息时间编辑（学勤管家风格：7 天 × N 节，批量复制）。
   注意：input[type=time] 宽度小于 ~58px 时浏览器不绘制值（只显示时钟图标），
   所以每列至少 150px、节次名单独占一行，两个时间框各 ~73px。 */
.dtt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dtt { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 8px; min-width: 1220px; }
.dtt-col { background: #fcfbf8; border: 1px solid var(--line-2); border-radius: 9px; padding: 8px; }
.dtt-col.is-weekend { background: #faf7f0; }
.dtt-h {
  font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: center;
  padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line);
}
.dtt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 7px; }
.dtt-row span {
  grid-column: 1 / -1; font-size: 10.5px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dtt-row input {
  width: 100%; min-width: 0; padding: 4px; font-size: 11px;
  border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink);
}
.dtt-row input:focus { outline: none; border-color: var(--accent); }
.dtt-none { font-size: 11px; color: var(--ink-3); text-align: center; padding: 10px 0; }

/* 控制台轻量弹窗（课程格子 / 节次名称） */
.dbm-mask {
  position: fixed; inset: 0; z-index: 3000;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: rgba(20, 24, 28, .45);
}
.dbm-card {
  width: 340px; max-width: 100%; max-height: 86vh; overflow: auto;
  background: var(--card); border-radius: 12px; padding: 20px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
}
.dbm-card h3 { font-size: 15px; margin: 0 0 2px; color: var(--ink); }
.dbm-sub { font-size: 11.5px; color: var(--ink-3); margin: 0 0 12px; }
.dbm-card label { display: block; font-size: 11.5px; color: var(--ink-2); margin: 10px 0 4px; }
.dbm-card input {
  width: 100%; padding: 8px 10px; font-size: 13px;
  border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink);
}
.dbm-card input:focus { outline: none; border-color: var(--accent); }
.dbm-time { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; }
.dbm-time input { flex: 1; min-width: 0; }
.dbm-dash { color: var(--ink-3); }
.dbm-list { max-height: 46vh; overflow: auto; margin: 4px -4px 0; padding: 0 4px; }
.dbm-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dbm-row span { min-width: 44px; font-size: 11.5px; color: var(--ink-3); text-align: right; }
.dbm-row input { flex: 1; }
.dbm-btns { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
.btn.sm { padding: 7px 13px; font-size: 12px; border-radius: 7px; }

/* 成员标签 */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  color: var(--accent); border-radius: 999px;
  padding: 3px 10px; font-size: 11.5px;
}

/* 关于 */
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 12.5px; }
.kv b { font-weight: 500; color: var(--ink-3); }
.kv span { color: var(--ink-2); word-break: break-all; font-family: Consolas, monospace; font-size: 11.5px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
  background: rgba(30, 35, 41, .93); color: #fff;
  padding: 9px 18px; border-radius: 999px; font-size: 12.5px;
  opacity: 0; pointer-events: none; transition: all .22s ease;
  box-shadow: 0 12px 30px -14px rgba(0, 0, 0, .6);
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------- 网页控制台：连接状态 ---------------- */
.conn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--ink-2);
  background: #fff; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px 5px 9px;
  white-space: nowrap;
}
.conn i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ink-3); flex: 0 0 7px;
}
.conn b { font-weight: 500; }
.conn[data-s="online"] { color: #2f7a54; border-color: #cfe6d9; background: #f2faf5; }
.conn[data-s="online"] i { background: #37a06a; box-shadow: 0 0 0 3px rgba(55, 160, 106, .14); }
.conn[data-s="connecting"] { color: #8a6b26; border-color: #ece1c4; background: #fdf8ec; }
.conn[data-s="connecting"] i { background: #d0a13c; animation: pulse 1.1s ease-in-out infinite; }
.conn[data-s="offline"] { color: #97392c; border-color: #eed5d0; background: #fdf2f0; }
.conn[data-s="offline"] i { background: #c0503c; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }

.banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 26px; padding: 10px 14px;
  border: 1px solid #eed5d0; background: #fdf2f0; color: #97392c;
  border-radius: 10px; font-size: 12px;
}
.banner b { font-weight: 600; }
.banner span { color: #a85a4c; }
.banner[hidden] { display: none !important; }

.host {
  display: block; font-size: 10.5px; color: var(--ink-3);
  margin-top: 3px; font-family: Consolas, monospace;
}

/* ---------------- 网页控制台：看板预览 ---------------- */
.pv-wrap {
  position: relative; width: 100%; height: 240px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 10px;
  background: #e9e6df;
}
.pv-wrap iframe {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  border: 0; transform-origin: 0 0;
  pointer-events: none;
}


/* ---------- 主题色卡 ---------- */
.themes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.theme {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 8px;
  border: 1.5px solid #e4e8ee;
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  transition: border-color .16s, box-shadow .16s, transform .16s;
  font-family: inherit;
}
.theme:hover { border-color: #c6d1dc; transform: translateY(-1px); }
.theme.on {
  border-color: var(--accent, #2f6d8f);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #2f6d8f) 15%, transparent);
}
.theme .sw {
  position: relative;
  display: block;
  height: 48px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06);
}
.theme .sw i { position: absolute; border-radius: 50%; }
.theme .sw i:first-child { width: 17px; height: 17px; left: 8px; bottom: 8px; opacity: .92; }
.theme .sw i:last-child { width: 9px; height: 9px; right: 10px; top: 9px; }
.theme b { font-size: 12px; font-weight: 600; color: #46505a; text-align: center; letter-spacing: .02em; }
.theme.on b { color: var(--accent, #2f6d8f); }

/* 主题色卡预览（每种主题一个小样） */
.sw[data-t="ivory"] { background: linear-gradient(160deg, #fcfbf8 0%, #eff2f4 100%); }
.sw[data-t="ivory"] i:first-child { background: #1e2329; }
.sw[data-t="ivory"] i:last-child { background: #2f6d8f; }
.sw[data-t="mist"] { background: linear-gradient(160deg, #f6f9fc 0%, #e2ebf3 100%); }
.sw[data-t="mist"] i:first-child { background: #16222c; }
.sw[data-t="mist"] i:last-child { background: #2b6f95; }
.sw[data-t="paper"] { background: linear-gradient(160deg, #fbf6ea 0%, #ede1c9 100%); }
.sw[data-t="paper"] i:first-child { background: #2b2318; }
.sw[data-t="paper"] i:last-child { background: #9a6a24; }
.sw[data-t="sage"] { background: linear-gradient(160deg, #f7faf5 0%, #e1ebdf 100%); }
.sw[data-t="sage"] i:first-child { background: #1b2a22; }
.sw[data-t="sage"] i:last-child { background: #3f7a5e; }
.sw[data-t="graphite"] { background: linear-gradient(160deg, #191d23 0%, #11141a 100%); }
.sw[data-t="graphite"] i:first-child { background: #ecf0f4; }
.sw[data-t="graphite"] i:last-child { background: #6ea8c9; }
.sw[data-t="midnight"] { background: linear-gradient(160deg, #141c2a 0%, #0b111b 100%); }
.sw[data-t="midnight"] i:first-child { background: #e8eff8; }
.sw[data-t="midnight"] i:last-child { background: #6aa3d8; }
.sw[data-t="forest"] { background: linear-gradient(160deg, #15201a 0%, #0c1410 100%); }
.sw[data-t="forest"] i:first-child { background: #e5efe8; }
.sw[data-t="forest"] i:last-child { background: #6fae8b; }
.sw[data-t="cocoa"] { background: linear-gradient(160deg, #1e1915 0%, #120e0b 100%); }
.sw[data-t="cocoa"] i:first-child { background: #f2e9df; }
.sw[data-t="cocoa"] i:last-child { background: #c08a5e; }

/* ==========================================================================
   移动端 / 窄屏自适应
   —— 让「班级桌面管理」在手机浏览器里也能顺畅操作：
   侧栏从固定 208px 变成顶部横向滑动条，网格收成单列，点按区域与输入框放大。
   ========================================================================== */

/* 平板 / 大手机：侧栏转顶部，双列网格收成单列 */
@media (max-width: 860px) {
  .app { flex-direction: column; }

  .side {
    width: 100%;
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    gap: 0;
    padding: 8px 10px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .side::-webkit-scrollbar { height: 0; }

  .brand { display: none; }            /* 顶部空间宝贵，隐藏 Logo 区 */
  .nav { flex-direction: row; flex: 1 1 auto; gap: 6px; }
  .nav-i { white-space: nowrap; padding: 9px 13px; font-size: 12.5px; }
  .nav-i i { display: none; }          /* 窄屏去掉序号，省宽度 */
  .side-f { display: none; }           /* 隐藏「已保存」角标，省空间 */

  .main { min-height: 0; }

  .top {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 14px 16px 12px;
  }
  .top h1 { font-size: 15px; }
  .top p { font-size: 11px; }
  .acts { width: 100%; flex-wrap: wrap; gap: 8px; }
  .conn { margin-right: auto; }
  .btn, .btn.ghost { flex: 1 1 120px; padding: 12px 12px; font-size: 13px; }

  .pane { padding: 14px 16px 40px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .themes { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .kv { grid-template-columns: 86px 1fr; }

  /* 行内组合（导入卡片、行为开关等）在手机上改为竖向堆叠，避免按钮被裁切 */
  .row-inline { flex-direction: column; align-items: stretch; }
  .row-inline select, .row-inline input { width: 100%; max-width: 100%; }

  /* 更大的点按与输入区域 */
  input[type="text"], input[type="date"], input[type="time"], select, textarea {
    padding: 11px 10px; font-size: 14px; min-height: 42px;
  }
  textarea { min-height: 72px; }
  .icon-btn { width: 34px; height: 34px; font-size: 15px; }
  .add-row { padding: 13px; font-size: 12.5px; }

  .pv-wrap { height: 200px; }
}

/* 小手机：进一步收紧，课程表可横向滚动由 .ttg-wrap 承担 */
@media (max-width: 480px) {
  .top { padding: 12px 12px 10px; }
  .pane { padding: 12px 12px 36px; }
  .card { padding: 13px 13px; }
  /* 按钮在小手机上整行堆叠，避免被裁切 */
  .acts { flex-direction: column; align-items: stretch; }
  .conn { margin-right: 0; align-self: flex-start; }
  .btn, .btn.ghost { flex: 1 1 auto; font-size: 13px; padding: 13px 10px; }
  .ttg-h { padding: 8px 3px; font-size: 11.5px; }
  .ttg-p { padding: 7px 2px; }
  .ttg-p b { font-size: 11.5px; }
  .ttg-p span { font-size: 10px; }
  .ttg-c { min-height: 48px; }
  .ttg-c b { font-size: 12px; }
  .ttg-c span { font-size: 10px; }
  .themes { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
  .kv { grid-template-columns: 74px 1fr; font-size: 12px; }
}

/* 超窄屏：课程表字号再小一点，保证一屏能扫到更多 */
@media (max-width: 360px) {
  .ttg-c b { font-size: 11.5px; }
  .ttg-p b { font-size: 11px; }
}

/* ---------- 值日类型 ---------- */
.dtype-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 12px;
}
.dtype {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 12px 12px;
  background: color-mix(in srgb, var(--card) 55%, transparent);
}
.dtype-h {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 9px;
}
.dtype-name {
  flex: 1 1 150px;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  padding: 5px 8px;
}
.dtype-name:hover { border-color: var(--line); }
.dtype-name:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg);
}
.dtype-meta {
  font-size: 11.5px;
  color: var(--ink-3);
  white-space: nowrap;
}
.dtype-sd {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--ink-3);
  white-space: nowrap;
}
.dtype-sd input {
  font-size: 12px;
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--bg);
  color: var(--ink);
}
.dtype-ov { margin-top: 10px; }
.dtype-ov > summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--ink-3);
  padding: 4px 2px;
  user-select: none;
}
.dtype-ov > summary:hover { color: var(--accent); }
.dtype-ov[open] > summary { margin-bottom: 6px; }
.btn-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.btn-row .add-row { flex: 1 1 auto; }
@media (max-width: 480px) {
  .dtype-name { flex: 1 1 100%; }
  .btn-row .btn.ghost { flex: 1 1 auto; }
}

/* ---------- 桌面背景图模板 ---------- */
.bgthumbs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}
.bgthumb {
  border: 2px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  padding: 0 0 6px 0;
  cursor: pointer;
  overflow: hidden;
  text-align: center;
  transition: border-color .15s ease;
}
.bgthumb:hover { border-color: var(--ink-3); }
.bgthumb.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
.bgthumb .pic {
  display: block;
  width: 100%;
  height: 62px;
  background-size: cover;
  background-position: center;
  border-bottom: 1px solid var(--line);
}
.bgthumb .pic-none {
  display: grid;
  place-items: center;
  background: repeating-linear-gradient(45deg, var(--card) 0 8px, var(--bg) 8px 16px);
}
.bgthumb .pic-none i { font-style: normal; font-size: 12px; color: var(--ink-3); }
.bgthumb b { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); padding-top: 5px; }
.bgthumb.on b { color: var(--accent); font-weight: 600; }

/* 值日类型的「方式 / 周末不安排 / 起始日」一行 */
.dtype-opts {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 6px 2px 9px;
  border-bottom: 1px dashed var(--line);
  margin-bottom: 9px;
}
.dtype-opts select {
  font-size: 12.5px;
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--bg);
  color: var(--ink);
}
.dtype-opts .chk {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}
.dtype-opts .chk input { width: 14px; }
/* 板块布局 / 自定义板块 */
.modlist { display: flex; flex-direction: column; gap: 8px; }
.modrow {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 10px;
  background: color-mix(in srgb, var(--card) 55%, transparent);
}
.modrow b { flex: 0 0 auto; font-size: 13px; color: var(--ink); }

}
.modrow .grow { flex: 1 1 auto; }
.modrow .mv {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 6px;
  width: 26px; height: 26px;
  font-size: 13px;
  line-height: 1;
  color: var(--ink-2);

.modrow .mv:hover { border-color: var(--accent); color: var(--accent); }
.modrow .mv:disabled { opacity: .35; cursor: default; }
.cmod { border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px 10px; margin-bottom: 9px; background: color-mix(in srgb, var(--card) 55%, transparent); }

<script>window.__DB_PREVIEW_HTML = "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:\">\n  <title>DeskBoard<\/title>\n  <style>\n/* ==========================================================================\n   DeskBoard · 桌面看板样式\n   ========================================================================== */\n\n:root {\n  --accent: #2f6d8f;\n  --ink: #1e2329;\n  --ink-2: #58626d;\n  --ink-3: #98a1ab;\n  --line: rgba(30, 35, 41, .09);\n  --line-strong: rgba(30, 35, 41, .16);\n  --card: #ffffff;\n  --bg1: #fcfbf8;\n  --bg2: #f5f3ed;\n  --bg3: #eff2f4;\n  --amber: #a8761f;\n  --shadow: 0 1px 2px rgba(20, 28, 38, .05), 0 12px 32px -24px rgba(20, 28, 38, .55);\n  --radius: 14px;\n  /* 字体：外观页可切换 */\n  --font-body: \"HarmonyOS Sans SC\", \"Source Han Sans SC\", \"Noto Sans SC\", \"Microsoft YaHei UI\", \"Microsoft YaHei\", \"PingFang SC\", \"Segoe UI\", system-ui, sans-serif;\n  --font-num: \"Bahnschrift\", \"Segoe UI Variable Display\", \"Segoe UI\", \"Microsoft YaHei UI\", sans-serif;\n}\n\n/* 宋体 · 书卷气 */\nhtml[data-font=\"song\"] {\n  --font-body: \"Source Han Serif SC\", \"Noto Serif SC\", \"Songti SC\", \"SimSun\", \"STSong\", serif;\n}\n/* 楷体 · 手写感 */\nhtml[data-font=\"kai\"] {\n  --font-body: \"KaiTi\", \"STKaiti\", \"Kaiti SC\", \"楷体\", \"SimSun\", serif;\n}\n/* 幼圆 · 圆润亲和 */\nhtml[data-font=\"yuan\"] {\n  --font-body: \"YouYuan\", \"Yuanti SC\", \"Microsoft YaHei UI\", \"Microsoft YaHei\", sans-serif;\n}\n\n/* --------------------------------------------------------------------------\n   主题配色（外观页里可选）\n   深色主题同时也把卡片、分隔线调成浅色半透明，保证对比度\n   -------------------------------------------------------------------------- */\n\n/* 1 象牙白 · 细点阵 */\n[data-theme=\"ivory\"], [data-theme=\"light\"] {\n  --ink: #1f2b33; --ink-2: #58626d; --ink-3: #98a1ab;\n  --line: rgba(31, 43, 51, .09); --line-strong: rgba(31, 43, 51, .16);\n  --card: #ffffff;\n  --bg1: #fdfcf9; --bg2: #f4f1ea; --bg3: #e9eef2;\n  --amber: #b07d22;\n  --shadow: 0 1px 2px rgba(20, 28, 38, .05), 0 12px 32px -24px rgba(20, 28, 38, .55);\n  --bg-pattern: radial-gradient(circle at center, color-mix(in srgb, var(--accent) 11%, transparent) 1.3px, transparent 1.7px);\n  --bg-size: 26px 26px;\n}\n\n/* 2 雾蓝 · 斜向细纹 */\n[data-theme=\"mist\"] {\n  --ink: #16222c; --ink-2: #4f5f6d; --ink-3: #8e9dab;\n  --line: rgba(22, 34, 44, .09); --line-strong: rgba(22, 34, 44, .17);\n  --card: #ffffff;\n  --bg1: #f7fafd; --bg2: #e9f1f8; --bg3: #dde9f2;\n  --amber: #9a6a2c;\n  --shadow: 0 1px 2px rgba(20, 40, 60, .05), 0 12px 32px -24px rgba(20, 40, 60, .5);\n  --bg-pattern: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 8%, transparent) 0 1px, transparent 1px 16px);\n  --bg-size: auto;\n}\n\n/* 3 宣纸 · 经纬格 */\n[data-theme=\"paper\"] {\n  --ink: #2b2318; --ink-2: #6b5b45; --ink-3: #a2907a;\n  --line: rgba(43, 35, 24, .12); --line-strong: rgba(43, 35, 24, .2);\n  --card: #fffdf7;\n  --bg1: #fcf8ee; --bg2: #f3ebd9; --bg3: #ebdfc6;\n  --amber: #9a6a24;\n  --shadow: 0 1px 2px rgba(90, 70, 40, .07), 0 12px 32px -24px rgba(90, 70, 40, .5);\n  --bg-pattern: repeating-linear-gradient(0deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 17px),\n                repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 17px);\n  --bg-size: auto;\n}\n\n/* 4 松石 · 圆点阵 */\n[data-theme=\"sage\"] {\n  --ink: #1b2a22; --ink-2: #4f665a; --ink-3: #8ba396;\n  --line: rgba(27, 42, 34, .1); --line-strong: rgba(27, 42, 34, .18);\n  --card: #ffffff;\n  --bg1: #f8fbf6; --bg2: #eaf2e8; --bg3: #dde9da;\n  --amber: #97762c;\n  --shadow: 0 1px 2px rgba(30, 50, 40, .06), 0 12px 32px -24px rgba(30, 50, 40, .5);\n  --bg-pattern: radial-gradient(circle at center, color-mix(in srgb, var(--accent) 12%, transparent) 1.6px, transparent 1.9px);\n  --bg-size: 30px 30px;\n}\n\n/* 5 石墨（深） · 细网格 */\n[data-theme=\"graphite\"], [data-theme=\"dark\"] {\n  --ink: #ecf0f4; --ink-2: #a3adb8; --ink-3: #6d7883;\n  --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .16);\n  --card: rgba(255, 255, 255, .045);\n  --bg1: #1a1e25; --bg2: #151920; --bg3: #10131a;\n  --amber: #d6a75a;\n  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 16px 40px -28px rgba(0, 0, 0, .9);\n  --bg-pattern: linear-gradient(color-mix(in srgb, var(--accent) 10%, transparent) 1px, transparent 1px),\n                linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent) 1px, transparent 1px);\n  --bg-size: 30px 30px;\n}\n\n/* 6 午夜蓝（深） · 星点 */\n[data-theme=\"midnight\"] {\n  --ink: #e8eff8; --ink-2: #9fb0c4; --ink-3: #6b7d93;\n  --line: rgba(160, 200, 255, .12); --line-strong: rgba(160, 200, 255, .2);\n  --card: rgba(120, 170, 230, .07);\n  --bg1: #141c2a; --bg2: #101724; --bg3: #0b111b;\n  --amber: #d9b273;\n  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -28px rgba(0, 0, 0, .95);\n  --bg-pattern: radial-gradient(circle at center, color-mix(in srgb, var(--accent) 18%, transparent) 1.3px, transparent 1.8px);\n  --bg-size: 34px 34px;\n}\n\n/* 7 墨绿（深） · 圆点阵 */\n[data-theme=\"forest\"] {\n  --ink: #e5efe8; --ink-2: #9db3a5; --ink-3: #6a8074;\n  --line: rgba(150, 220, 180, .12); --line-strong: rgba(150, 220, 180, .2);\n  --card: rgba(140, 220, 175, .06);\n  --bg1: #15201a; --bg2: #111a15; --bg3: #0c1410;\n  --amber: #cfa964;\n  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -28px rgba(0, 0, 0, .95);\n  --bg-pattern: radial-gradient(circle at center, color-mix(in srgb, var(--accent) 12%, transparent) 1.6px, transparent 1.9px);\n  --bg-size: 30px 30px;\n}\n\n/* 8 栗棕（深） · 暖点阵 */\n[data-theme=\"cocoa\"] {\n  --ink: #f2e9df; --ink-2: #bda997; --ink-3: #85705f;\n  --line: rgba(255, 220, 190, .12); --line-strong: rgba(255, 220, 190, .2);\n  --card: rgba(255, 210, 170, .06);\n  --bg1: #1e1915; --bg2: #181310; --bg3: #120e0b;\n  --amber: #d8a86a;\n  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -28px rgba(0, 0, 0, .95);\n  --bg-pattern: radial-gradient(circle at center, color-mix(in srgb, var(--accent) 14%, transparent) 1.4px, transparent 1.7px);\n  --bg-size: 26px 26px;\n}\n\n* { box-sizing: border-box; }\n\n[hidden] { display: none !important; }\n\nhtml, body {\n  height: 100%;\n  margin: 0;\n  overflow: hidden;\n}\n\nbody {\n  font-family: var(--font-body);\n  color: var(--ink);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  user-select: none;\n  cursor: default;\n}\n\n.num, .t b {\n  font-family: var(--font-num);\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\" 1;\n}\n\n/* ---------- 外壳 ---------- */\n.shell {\n  position: relative;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  padding: 1.55rem 1.5rem .85rem;\n  background:\n    var(--bg-pattern, none),\n    radial-gradient(130% 55% at 100% 0%, color-mix(in srgb, var(--accent) 11%, transparent) 0%, transparent 62%),\n    radial-gradient(95% 55% at 0% 100%, color-mix(in srgb, var(--amber) 9%, transparent) 0%, transparent 58%),\n    linear-gradient(168deg, var(--bg1) 0%, var(--bg2) 56%, var(--bg3) 100%);\n  background-size: var(--bg-size, auto), auto, auto, auto;\n  background-position: center, center, center, center;\n}\n\n/* 与桌面交界处的一道极细高光，让面板像是\"贴\"在壁纸上 */\n.shell::after {\n  content: \"\";\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  width: 1px;\n  background: linear-gradient(180deg, transparent, var(--line-strong) 10%, var(--line-strong) 90%, transparent);\n  pointer-events: none;\n}\n.shell[data-side=\"right\"]::after { left: 0; }\n.shell[data-side=\"left\"]::after { right: 0; left: auto; }\n\n/* ---------- 头部 ---------- */\n.hd { flex: 0 0 auto; }\n\n.hd-top {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: 1rem;\n}\n\n.school {\n  font-size: .76rem;\n  letter-spacing: .22em;\n  color: var(--ink-3);\n  padding-top: .5rem;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.hd-mid {\n  display: flex;\n  align-items: center;\n  gap: .65rem;\n  margin-top: .35rem;\n}\n.cname {\n  font-size: 1.45rem;\n  font-weight: 700;\n  margin: 0;\n  letter-spacing: .02em;\n  line-height: 1.25;\n  text-shadow: 0 1px 2px color-mix(in srgb, var(--bg1) 55%, transparent);\n}\n.wk {\n  font-size: .68rem;\n  padding: .2rem .5rem;\n  border-radius: 999px;\n  color: var(--accent);\n  background: color-mix(in srgb, var(--accent) 12%, transparent);\n  border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);\n  white-space: nowrap;\n}\n\n.hd-date {\n  font-size: .78rem;\n  color: var(--ink-2);\n  margin-top: .4rem;\n  padding-bottom: .85rem;\n  border-bottom: 1px solid var(--line);\n  display: flex;\n  align-items: center;\n  gap: .5rem;\n}\n.hd-date .sep { color: var(--ink-3); opacity: .6; }\n\n.special {\n  margin-top: .7rem;\n  font-size: .74rem;\n  line-height: 1.5;\n  padding: .5rem .7rem;\n  border-radius: 9px;\n  color: var(--amber);\n  background: color-mix(in srgb, var(--amber) 10%, transparent);\n  border: 1px solid color-mix(in srgb, var(--amber) 26%, transparent);\n  display: flex;\n  gap: .45rem;\n  align-items: flex-start;\n}\n.special b { font-weight: 600; }\n\n/* ---------- 主体 ---------- */\n.body {\n  flex: 1 1 auto;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 1.1rem .1rem .4rem 0;\n  display: flex;\n  flex-direction: column;\n  gap: 1.6rem;\n}\n.body::-webkit-scrollbar { width: 5px; }\n.body::-webkit-scrollbar-track { background: transparent; }\n.body::-webkit-scrollbar-thumb {\n  background: var(--line-strong);\n  border-radius: 3px;\n}\n\n.sec-h {\n  display: flex;\n  align-items: baseline;\n  gap: .5rem;\n  margin-bottom: .55rem;\n}\n.sec-h h3 {\n  margin: 0;\n  font-size: 1.3rem;\n  font-weight: 700;\n  letter-spacing: .02em;\n  display: flex;\n  align-items: center;\n}\n.sec-h h3::before {\n  content: \"\";\n  width: 3px;\n  height: .82em;\n  border-radius: 2px;\n  background: var(--accent);\n  margin-right: .5rem;\n}\n.sec-h .meta {\n  margin-left: auto;\n  font-size: .9rem;\n  color: var(--ink-3);\n  white-space: nowrap;\n}\n\n/* ---------- 课程列表 ---------- */\n.clist { display: flex; flex-direction: column; }\n.clist .preview { margin-top: .9rem; }\n\n.row {\n  display: grid;\n  grid-template-columns: 3.5rem 1rem 1fr;\n  position: relative;\n  transition: opacity .25s ease;\n}\n.row + .row { margin-top: 1px; }\n\n.t {\n  text-align: right;\n  padding: .72rem .1rem 0 0;\n  line-height: 1.15;\n}\n.t b {\n  display: block;\n  font-size: 1.3rem;\n  font-weight: 700;\n  color: var(--ink-2);\n}\n.t i {\n  display: block;\n  font-style: normal;\n  font-size: .9rem;\n  color: var(--ink-3);\n  margin-top: .12rem;\n}\n\n.rail {\n  display: flex;\n  justify-content: center;\n  position: relative;\n}\n.rail::before {\n  content: \"\";\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  width: 1px;\n  background: var(--line);\n}\n.dot {\n  position: relative;\n  z-index: 1;\n  width: .5rem;\n  height: .5rem;\n  border-radius: 50%;\n  background: #c9d1d9;\n  margin-top: .95rem;\n  box-shadow: 0 0 0 .22rem var(--bg2);\n}\n[data-theme=\"dark\"] .dot { background: #4a545f; }\n\n.c {\n  padding: .68rem 0 .8rem .6rem;\n  min-width: 0;\n}\n.c-top {\n  display: flex;\n  align-items: baseline;\n  gap: .5rem;\n}\n.subj {\n  font-size: 1.7rem;\n  font-weight: 700;\n  color: var(--ink);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  text-shadow: 0 1px 1px color-mix(in srgb, var(--bg1) 50%, transparent);\n}\n.c-sub {\n  font-size: .84rem;\n  color: var(--ink-3);\n  margin-top: .18rem;\n  display: flex;\n  gap: .45rem;\n  flex-wrap: wrap;\n}\n.c-sub .dotsep { opacity: .5; }\n\n.tag {\n  font-size: .7rem;\n  line-height: 1.6;\n  padding: 0 .36rem;\n  border-radius: 4px;\n  white-space: nowrap;\n  letter-spacing: .04em;\n  font-weight: 500;\n}\n.tag.now {\n  color: #fff;\n  background: var(--accent);\n}\n.tag.next {\n  color: var(--accent);\n  background: color-mix(in srgb, var(--accent) 14%, transparent);\n}\n.tag.done {\n  color: var(--ink-3);\n  background: color-mix(in srgb, var(--ink-3) 12%, transparent);\n}\n\n/* 已结束（只轻微淡化，靠「已结束」标签区分） */\n.row.is-done { opacity: .82; }\n\n/* 进行中 */\n.row.is-now .dot {\n  background: var(--accent);\n  box-shadow: 0 0 0 .22rem color-mix(in srgb, var(--accent) 22%, transparent);\n  animation: breathe 2.6s ease-in-out infinite;\n}\n.row.is-now .c {\n  background: color-mix(in srgb, var(--accent) 7%, transparent);\n  border-radius: 10px;\n  margin: -.06rem -.5rem 0 -.3rem;\n  padding: .56rem .5rem .6rem .85rem;\n  box-shadow: inset 2px 0 0 var(--accent);\n}\n.row.is-now .subj { color: var(--accent); }\n\n@keyframes breathe {\n  0%, 100% { box-shadow: 0 0 0 .22rem color-mix(in srgb, var(--accent) 22%, transparent); }\n  50% { box-shadow: 0 0 0 .34rem color-mix(in srgb, var(--accent) 8%, transparent); }\n}\n\n.prog {\n  margin-top: .48rem;\n  height: 3px;\n  border-radius: 2px;\n  background: color-mix(in srgb, var(--accent) 15%, transparent);\n  overflow: hidden;\n}\n.prog > i {\n  display: block;\n  height: 100%;\n  width: 0;\n  border-radius: 2px;\n  background: var(--accent);\n  transition: width .8s linear;\n}\n\n/* ---------- 背景图片模板 ---------- */\n#bgimg {\n  position: fixed;\n  inset: 0;\n  z-index: -2;\n  background-size: cover;\n  background-position: center;\n  background-repeat: no-repeat;\n}\n/* 选中背景图后，主题底色变成半透明罩层：\n   照片透出来 ~20%，文字仍然落在熟悉的主题色上，保证可读性。\n   注意：1) 不再叠主题的点阵/条纹纹理（会在照片上形成一片小点点）；\n         2) 带上 body.wp.has-bgimg：壁纸模式的 body.wp .shell（不透明底）在文件末尾，\n            同权重会按顺序覆盖这里的半透明罩层，导致背景图永远显示不出来 */\nbody.has-bgimg .shell,\nbody.wp.has-bgimg .shell {\n  /* --wp-a1/2/3 由渲染层按「背景图浓度」写入：\n     数值越小 = 主题色越透明 = 照片越清晰（也不会盖住文字 readability 由下限兜住） */\n  background:\n    radial-gradient(130% 55% at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 62%),\n    radial-gradient(95% 55% at 0% 100%, color-mix(in srgb, var(--amber) 8%, transparent) 0%, transparent 58%),\n    linear-gradient(168deg,\n      color-mix(in srgb, var(--bg1) var(--wp-a1, 72%), transparent) 0%,\n      color-mix(in srgb, var(--bg2) var(--wp-a2, 76%), transparent) 56%,\n      color-mix(in srgb, var(--bg3) var(--wp-a3, 79%), transparent) 100%);\n}\n\n/* ---------- 空状态 ---------- */\n.empty {\n  padding: 1.5rem 1.1rem;\n  text-align: center;\n  border: 1px dashed var(--line-strong);\n  border-radius: var(--radius);\n  background: color-mix(in srgb, var(--card) 55%, transparent);\n}\n.empty .big {\n  font-size: .95rem;\n  color: var(--ink-2);\n  font-weight: 600;\n  margin-bottom: .3rem;\n}\n.empty .sub { font-size: .72rem; color: var(--ink-3); }\n\n/* 下个上课日预览 */\n.preview {\n  margin-top: .7rem;\n  border-top: 1px solid var(--line);\n  padding-top: .65rem;\n  text-align: left;\n}\n.preview .ph {\n  font-size: .84rem;\n  font-weight: 600;\n  color: var(--ink-3);\n  letter-spacing: .06em;\n  margin-bottom: .45rem;\n}\n.preview .plist { display: flex; flex-direction: column; gap: .4rem; }\n.pitem {\n  display: grid;\n  grid-template-columns: 3.6rem 1fr;\n  gap: .6rem;\n  font-size: 1.14rem;\n  align-items: baseline;\n}\n.pitem em {\n  font-style: normal;\n  font-size: .9rem;\n  color: var(--ink-3);\n  font-family: \"Bahnschrift\", \"Segoe UI\", sans-serif;\n  font-variant-numeric: tabular-nums;\n}\n.pitem span { color: var(--ink-2); }\n.pitem span b { font-weight: 700; color: var(--ink); margin-right: .4rem; }\n\n/* ---------- 值日 ---------- */\n.duty-now {\n  display: flex;\n  align-items: center;\n  gap: .6rem;\n  padding: .78rem .85rem;\n  border-radius: var(--radius);\n  background: var(--card);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow);\n}\n[data-theme=\"dark\"] .duty-now { background: rgba(255, 255, 255, .05); }\n\n.people { display: flex; flex-wrap: wrap; gap: .45rem .7rem; align-items: center; }\n.person {\n  display: inline-flex;\n  align-items: center;\n  gap: .42rem;\n  font-size: 1.18rem;\n  color: var(--ink);\n  font-weight: 500;\n}\n.avatar {\n  width: 1.8rem;\n  height: 1.8rem;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  font-size: .8rem;\n  font-weight: 600;\n  color: #fff;\n  letter-spacing: 0;\n  flex: 0 0 auto;\n}\n.duty-tag {\n  margin-left: auto;\n  font-size: .86rem;\n  color: var(--ink-3);\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  padding: .1rem .45rem;\n  white-space: nowrap;\n}\n\n.duty-grid {\n  display: grid;\n  grid-template-columns: repeat(7, 1fr);\n  gap: .28rem;\n  margin-top: .5rem;\n}\n.dg {\n  border: 1px solid var(--line);\n  border-radius: 9px;\n  padding: .4rem .2rem .34rem;\n  text-align: center;\n  background: color-mix(in srgb, var(--card) 60%, transparent);\n}\n.dg b {\n  display: block;\n  font-size: .68rem;\n  font-weight: 500;\n  color: var(--ink-3);\n  margin-bottom: .1rem;\n}\n.dg span {\n  font-size: .84rem;\n  color: var(--ink-2);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  display: block;\n}\n.dg.is-today {\n  border-color: color-mix(in srgb, var(--accent) 45%, transparent);\n  background: color-mix(in srgb, var(--accent) 10%, transparent);\n}\n.dg.is-today b { color: var(--accent); font-weight: 600; }\n.dg.is-today span { color: var(--accent); font-weight: 600; }\n\n/* ---------- 多值日类型（宿舍值日 / 清洁区值日 …） ---------- */\n.duty-types {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));\n  gap: .5rem;\n}\n.dty {\n  padding: .62rem .72rem .68rem;\n  border-radius: var(--radius);\n  background: var(--card);\n  border: 1px solid var(--line);\n  box-shadow: var(--shadow);\n}\n.dty-h {\n  display: flex;\n  align-items: center;\n  gap: .5rem;\n  margin-bottom: .45rem;\n}\n.dty-name {\n  font-size: 1.12rem;\n  font-weight: 700;\n  color: var(--ink);\n  letter-spacing: .02em;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.dty-h . x))\n    calc(2rem + var(--safe-r, 0px))\n    calc(1.1rem + var(--safe-b, 0px))\n    calc(2rem + var(--safe-l, 0px));\n}\n.shell[data-layout=\"full\"]::after { display: none; }\n\n/* 头部收成一行：左边学校·班级·周次，右边日期，特殊日期横跨一行 */\n.shell[data-layout=\"full\"] .hd {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  grid-template-areas:\n    \"top date\"\n    \"mid date\"\n    \"special special\";\n  align-items: end;\n  column-gap: 1.2rem;\n  padding-bottom: .7rem;\n  border-bottom: 1px solid var(--line);\n}\n.shell[data-layout=\"full\"] .hd-top { grid-area: top; }\n.shell[data-layout=\"full\"] .hd-mid { grid-area: mid; margin-top: .05rem; }\n.shell[data-layout=\"full\"] .hd-date {\n  grid-area: date; justify-self: end; white-space: nowrap;\n  border-bottom: 0; padding-bottom: 0; margin-top: 0;\n}\n.shell[data-layout=\"full\"] .special { grid-area: special; margin-top: .55rem; }\n.shell[data-layout=\"full\"] .school { padding-top: 0; }\n.shell[data-layout=\"full\"] .cname { font-size: 1.85rem; }\n\n/* 主体两列：左=今日课程（宽栏），右=今日值日 + 班级通知。\n   除极窄空白带外都保持两列——竖排堆叠会把值日/通知挤出屏幕。 */\n.shell[data-layout=\"full\"] .body {\n  display: grid;\n  grid-template-columns: minmax(0, 1.9fr) minmax(13rem, 1fr);\n  column-gap: 2.4rem;\n  align-items: start;\n  padding-top: .85rem;\n  overflow: hidden;               /* 壁纸不会滚动，靠分栏+紧凑排版保证一屏排完 */\n}\n.shell[data-layout=\"full\"] .body > section:nth-child(1) { grid-column: 1; grid-row: 1 / span 2; min-width: 0; }\n.shell[data-layout=\"full\"] .body > section:nth-child(2) { grid-column: 2; grid-row: 1; min-width: 0; }\n.shell[data-layout=\"full\"] .body > section:nth-child(3) { grid-column: 2; grid-row: 2; margin-top: 1.25rem; min-width: 0; }\n\n/* 紧凑一点，12 节（甚至带休息段的 14 行）也能一屏放下 */\n.shell[data-layout=\"full\"] .sec-h { margin-bottom: .25rem; }\n.shell[data-layout=\"full\"] .sec-h h3 { font-size: .92rem; }\n.shell[data-layout=\"full\"] .subj { font-size: .92rem; line-height: 1.1; }\n.shell[data-layout=\"full\"] .c-sub { font-size: .68rem; line-height: 1.2; margin-top: .06rem; }\n.shell[data-layout=\"full\"] .tag { font-size: .58rem; line-height: 1.3; padding: 0 .26rem; }\n.shell[data-layout=\"full\"] .row { grid-template-columns: 3.2rem 1rem 1fr; }\n.shell[data-layout=\"full\"] .row + .row { margin-top: 0; }\n.shell[data-layout=\"full\"] .t { padding-top: .3rem; }\n.shell[data-layout=\"full\"] .t b { font-size: .8rem; line-height: 1.1; }\n.shell[data-layout=\"full\"] .t i { font-size: .64rem; margin-top: .02rem; }\n.shell[data-layout=\"full\"] .c { padding: .22rem 0 .28rem .5rem; }\n.shell[data-layout=\"full\"] .dot { margin-top: .48rem; }\n.shell[data-layout=\"full\"] .clist,\n.shell[data-layout=\"full\"] .empty { max-width: none; }\n\n/* 课多的时候课程列表分多栏排（每栏最多 6 行，列数由渲染层按行数决定） */\n.clist-cols { display: grid; column-gap: 1.6rem; }\n\n/* 整屏时今天是空课：横过来排，左边一句话、右边下一上课日预览，宽屏不留大片空白 */\n.shell[data-layout=\"full\"] .empty {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) minmax(16rem, 24rem);\n  grid-template-rows: auto auto;\n  grid-template-areas:\n    \"big preview\"\n    \"sub preview\";\n  column-gap: 2.2rem;\n  align-items: start;\n  max-width: none;\n  padding: .85rem 1.15rem;\n  text-align: left;\n  border-style: solid;\n  border-color: var(--line);\n  background: color-mix(in srgb, var(--card) 70%, transparent);\n}\n.shell[data-layout=\"full\"] .empty .big { grid-area: big; font-size: 1.1rem; margin-bottom: .3rem; }\n.shell[data-layout=\"full\"] .empty .sub { grid-area: sub; font-size: .78rem; }\n.shell[data-layout=\"full\"] .empty .preview {\n  grid-area: preview;\n  margin-top: 0;\n  padding-top: 0;\n  border-top: 0;\n  border-left: 1px solid var(--line);\n  padding-left: 1.6rem;\n}\n.shell[data-layout=\"full\"] .empty .preview .plist {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  column-gap: 1.4rem;\n  row-gap: .3rem;\n}\n\n/* 空白带比较窄时，空课状态竖着排，避免挤 */\n.shell[data-band=\"mid\"] .empty,\n.shell[data-band=\"narrow\"] .empty {\n  display: block;\n  text-align: center;\
