      } catch (e) { /* ignore */ }

      const st = ex.enabled
        ? `<b>已发布</b><span>${esc(ex.subject || '')}　${esc(ex.start || '')} - ${esc(ex.end || '')}${ex.school ? '　·　' + esc(ex.school) : ''}　·　电脑已弹出计时器</span>`
        : '<b>未发布</b><span>电脑桌面显示常规看板内容</span>';

      return `
      <div class="card">
        <h2>考试计时器设置</h2>
        <p class="hint">下面就是「考试计时器」本身：点它里面的「设置」配置学校、科目、开始时间与时长（或结束时间），确定后回到这里点「发布」。</p>
        <div style="width:100%;height:540px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px">
          <iframe id="examFrame" src="${esc(src)}" title="考试计时器" style="width:100%;height:100%;border:0;display:block"></iframe>
        </div>
      </div>

      <div class="card">
        <h2>发布到电脑</h2>
        <p class="hint">点「发布」后，教室电脑会弹出一个始终置顶的考试计时器窗口，按上面设好的学校、科目与时间倒计时；桌面看板不受影响。点「结束考试」即可关闭它。</p>
        <div class="kv">${st}</div>
        <div class="row-inline" style="margin-top:14px;gap:10px;flex-wrap:wrap">
          <button class="btn" data-act="exam-publish">发布到电脑</button>
          <button class="btn ghost" data-act="exam-stop">结束考试（关闭计时器）</button>
        </div>
      </div>`;
    }
  }
};

/* ==========================================================================
   渲染
   ========================================================================== */

function render() {
  let conf = TABS[tab];
  if (!conf) { tab = 'basic'; conf = TABS[tab]; }   // 分栏被删掉后，旧的深链不再报错
  // 同一个分栏里重绘（改了个设置、点了个按钮）要保住滚动位置，
  // 否则每改一项就被弹回顶部，调外观时根本没法连续操作
  const keepScroll = (lastTab === tab) ? ($('pane').scrollTop || 0) : 0;
  // 预览 iframe 留下来复用：每改一项设置都重建一个 iframe 会整块闪一下
  const oldPv = $('pv');
  if (oldPv) { pvEl = oldPv; oldPv.remove(); }
  $('ttl').textContent = conf.t;
  $('sub').textContent = conf.s;
  $('pane').innerHTML = conf.render();
  $('pane').scrollTop = keepScroll;
  lastTab = tab;
  if (pvEl) {
    const fresh = $('pv');
    if (fresh && fresh !== pvEl) fresh.replaceWith(pvEl);
  }

  document.querySelectorAll('.nav-i').forEach((b) => {
    b.classList.toggle('is-on', b.dataset.tab === tab);
  });

  const cw = $('chkWeekend');
  if (cw) cw.addEventListener('change', (e) => { showWeekend = e.target.checked; render(); });

  // 课程表：节数下拉（change 事件，兼容手机浏览器）
  const tp = $('ttgPeriods');
  if (tp) tp.addEventListener('change', () => {
    const n = Number(tp.value);
    if (!n || n === classBell().length) return;
    setPeriodCount(n);
    markDirty();
    render();
    toast('已调整为 ' + classBell().length + ' 节课');
  });

  mountPreview();
}

/* 预览：把 1920×1080 的看板等比缩放进卡片 */
function mountPreview() {
  const wrap = $('pvWrap');
  const frame = $('pv');
  if (!wrap || !frame) return;

  // 预览刚创建/重建：等它加载完，把当前（可能还没保存的）配置推过去
  // （iframe 是复用的，监听器只能挂一次，否则每渲染一次就多一份）
  if (!frame.dataset.dbMounted) {
    frame.dataset.dbMounted = '1';
    frame.addEventListener('load', () => { updatePreview(); setTimeout(updatePreview, 260); });
  }
  setTimeout(updatePreview, 320);

  const fit = () => {
    const availW = wrap.clientWidth || 900;
    const maxH = 420;                                  // 预览最高 420px，别把下面的设置顶出屏幕
    const s = Math.min(availW / 1920, maxH / 1080);
    frame.style.transform = `scale(${s})`;
    frame.style.left = Math.max(0, (availW - 1920 * s) / 2) + 'px';
    wrap.style.height = Math.round(1080 * s) + 'px';
  };
  fit();

  if (previewRO) { try { previewRO.disconnect(); } catch (e) { /* ignore */ } }
  if (window.ResizeObserver) {
    previewRO = new ResizeObserver(fit);
    previewRO.observe(wrap);
  } else {
    window.addEventListener('resize', fit);
  }
}

let previewTimer = null;
function updatePreview() {
  const f = document.getElementById('pv');
  if (!f || !f.contentWindow || !cfg) return;
  try { f.contentWindow.postMessage({ type: 'db:cfg', config: cfg }, '*'); } catch (e) { /* ignore */ }
}

function markDirty() {
  dirty = true;
  const d = $('dirty');
  d.textContent = '有未保存的修改';
  d.classList.add('is-dirty');
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 120);
}

function clearDirty() {
  dirty = false;
  const d = $('dirty');
  d.textContent = '已保存';
  d.classList.remove('is-dirty');
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ==========================================================================
   事件
   ========================================================================== */

function bindEvents() {
  $('nav').addEventListener('click', (e) => {
    const b = e.target.closest('.nav-i');
    if (!b) return;
    tab = b.dataset.tab;
    render();
  });

  $('btnSave').addEventListener('click', save);
  $('btnReset').addEventListener('click', reset);

  const pane = $('pane');

  pane.addEventListener('input', onInput);
  pane.addEventListener('change', onChange);

  pane.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    const i = b.dataset.i !== undefined ? Number(b.dataset.i) : -1;

    if (act === 'dtype-add' || act === 'dtype-preset') {
      const preset = act === 'dtype-preset' ? (b.dataset.name || '') : '';
      (cfg.dutyTypes = cfg.dutyTypes || []).push(newDutyType(preset));
      markDirty(); render(); return;
    }
    if (act === 'dtype-del') {
      const t = (cfg.dutyTypes || [])[i];
      if (!t) return;
      if (!window.confirm('删除值日类型「' + (t.name || '未命名') + '」？该类型下的分组和临时指定会一并删除。')) return;
      (cfg.dutyTypes || []).splice(i, 1);
      if (t.id && cfg.dutyOverrides) delete cfg.dutyOverrides[t.id];
      markDirty(); render(); return;
    }
    if (act === 'group-add') {
      const ti = b.dataset.ti !== undefined ? Number(b.dataset.ti) : 0;
      const t = (cfg.dutyTypes = cfg.dutyTypes || [])[ti];
      if (!t) return;
      (t.groups = t.groups || []).push({ name: '新组', members: [] });
      markDirty(); render(); return;
    }
    if (act === 'group-del') {
      const ti = b.dataset.ti !== undefined ? Number(b.dataset.ti) : 0;
      const t = (cfg.dutyTypes || [])[ti];
      if (!t) return;
      (t.groups || []).splice(i, 1);
      markDirty(); render(); return;
    }

    if (act === 'notice-add') {
      (cfg.notices = cfg.notices || []).push({ text: '', pinned: false });
      markDirty(); render(); return;
    }
    if (act === 'notice-del') { cfg.notices.splice(i, 1); markDirty(); render(); return; }

    if (act === 'special-add') {
      const d = new Date();
      const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      cfg.specialDays = cfg.specialDays || {};
      if (!cfg.specialDays[k]) cfg.specialDays[k] = '';
      markDirty(); render(); return;
    }
    if (act === 'special-del') { delete cfg.specialDays[b.dataset.k]; markDirty(); render(); return; }

    if (act === 'ov-add') {
      const ti = b.dataset.ti !== undefined ? Number(b.dataset.ti) : 0;
      const t = (cfg.dutyTypes = cfg.dutyTypes || [])[ti];
      if (!t) return;
      const d = new Date();
      const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      cfg.dutyOverrides = cfg.dutyOverrides || {};
      const byType = cfg.dutyOverrides[t.id] = cfg.dutyOverrides[t.id] || {};
      if (!byType[k]) byType[k] = [];
      markDirty(); render(); return;
    }
    if (act === 'ov-del') {
      const ti = b.dataset.ti !== undefined ? Number(b.dataset.ti) : 0;
      const t = (cfg.dutyTypes || [])[ti];
      if (!t) return;
      const byType = (cfg.dutyOverrides || {})[t.id] || {};
      delete byType[b.dataset.k];
      markDirty(); render(); return;
    }

    if (act === 'bg-set') {
      cfg.appearance.wallpaperImage = b.dataset.id || '';
      markDirty(); render();
      // 「点一下立刻套用」：立刻下发到桌面，不必等手动保存
      try { await save(); } catch (e) { /* 保存失败时仍保留未保存状态 */ }
      return;
    }
    if (act === 'pv-refresh') {
      const f = $('pv');
      if (f) { try { f.contentWindow.location.reload(); } catch (e) { mountPreview(); } }
      setTimeout(updatePreview, 400);
      toast('预览已刷新');
      return;
    }
    if (act === 'wp-pick') { pickCustomWallpaper(); return; }
    if (act === 'wp-clear') {
      if (!window.confirm('删除这台电脑上保存的自定义背景图？')) return;
      const r = await window.deskboard.clearWallpaper();
      if (r && r.ok) {
        if (r.config) cfg = r.config;
        if (r.info) INFO = r.info;
        clearDirty();
        render();
        toast('已删除自定义背景图');
      } else {
        toast((r && r.err) || '删除失败');
      }
      return;
    }
    if (act === 'icons-arrange' || act === 'icons-restore') {
      const btn = b;
      const doing = act === 'icons-arrange' ? '整理中…' : '还原中…';
      btn.disabled = true;
      const old = btn.textContent;
      btn.textContent = doing;
      try {
        const r = act === 'icons-arrange'
          ? await window.deskboard.arrangeIcons()
          : await window.deskboard.restoreIcons();
        if (r && r.ok) {
          toast(act === 'icons-arrange'
            ? ('已把 ' + (r.arranged || 0) + ' 个图标整理到左侧，桌面看板已重新排布')
            : '已还原图标位置');
        } else {
          toast((r && r.err) || '操作失败');
        }
      } catch (e) {
        toast('操作失败：' + (e.message || e));
      }
      btn.disabled = false;
      btn.textContent = old;
      render();
      return;
    }
    if (act === 'mod-move') {
      const id = b.dataset.id;
      const dir = Number(b.dataset.dir) || 0;
      const order = (cfg.appearance.moduleOrder = cfg.appearance.moduleOrder || ['courses', 'duty', 'notices']).slice();
      const i = order.indexOf(id);
      const j = i + dir;
      if (i >= 0 && j >= 0 && j < order.length) {
        order.splice(j, 0, order.splice(i, 1)[0]);
        markDirty(); render();
      }
      return;
    }
    if (act === 'cmod-add') {
      (cfg.customModules = cfg.customModules || []).push({
        id: 'cm' + Date.now().toString(36),
        title: '',
        text: ''
      });
      markDirty(); render(); return;
    }
    if (act === 'cmod-del') {
      const arr = cfg.customModules || [];
      if (arr[i]) arr.splice(i, 1);
      markDirty(); render(); return;
    }
    if (act === 'open-folder') { window.deskboard.openFolder(); return; }
    if (act === 'theme') {
      const id = b.getAttribute('data-id');
      const t = THEME_LIST.find((x) => x.id === id);
      if (!t) return;
      cfg.appearance.theme = t.id;
      cfg.appearance.accent = t.accent;
      document.documentElement.style.setProperty('--accent', t.accent);
      markDirty();
      render();
      // 「点一下立刻套用」：立刻下发到桌面，不必等手动保存
      try { await save(); } catch (e) { /* 保存失败时仍保留未保存状态 */ }
      return;
    }
    if (act === 'copy-code') {
      const code = (INFO && INFO.code) || '';
      if (!code) { toast('还没有连接码'); return; }
      try {
        navigator.clipboard.writeText(code);
        toast('连接码已复制：' + code);
      } catch (e) { toast('复制失败，请手动记下：' + code); }
      return;
    }
    if (act === 'regen-code') {
      if (!window.confirm('按当前硬件重新生成连接码？生成后控制端需要重新输入新码。')) return;
      const r = await window.deskboard.setCode('');
      if (r && r.ok) {
        INFO.code = r.code;
        INFO.codeSource = 'hardware';
        toast('新的连接码：' + r.code);
        render();
      } else {
        toast((r && r.err) || '生成失败');
      }
      return;
    }
    if (act === 'set-code') {
      const el = $('mcodeCustom');
      const v = el ? el.value.trim() : '';
      const r = await window.deskboard.setCode(v);
      if (r && r.ok) {
        INFO.code = r.code;
        INFO.codeSource = v ? 'custom' : 'hardware';
        toast('连接码已更新：' + r.code);
        render();
      } else {
        toast((r && r.err) || '保存失败');
      }
      return;
    }
    if (act === 'quit') { window.deskboard.quit(); return; }
    if (act === 'refresh-icons') {
      b.disabled = true;
      b.textContent = '识别中…';
      const run = window.deskboard.refresh ? window.deskboard.refresh() : window.deskboard.scanIcons();
      run
        .then((ic) => {
          if (ic) INFO.icons = ic;
          toast(ic ? `已识别 ${ic.count} 个图标，看板已重排` : '识别失败，请确认 DeskBoard 正在运行');
          render();
        })
        .catch(() => toast('无法连接 DeskBoard'))
        .finally(() => { b.disabled = false; b.textContent = '重新识别图标并贴合'; });
      return;
    }

    if (act === 'xq-bell') { importBellFromXqgj(); return; }
    if (act === 'xq-tt') {
      const sel = $('xqCls');
      importTimetableFromXqgj(sel ? sel.value : cfg.className);
      return;
    }
    if (act === 'xq-duty') { importDutyFromXqgj(); return; }
    if (act === 'exam-publish') { await publishExam(); return; }
    if (act === 'exam-stop') { await stopExam(); return; }
    // 课程表（学勤管家格式）：点格子编辑 / 节次名称
    if (act === 'slot-edit') { openSlotModal(b.dataset.day, b.dataset.p); return; }
    if (act === 'period-names') { openPeriodNamesModal(); return; }
    // 分日作息：把周一的时间批量复制到其它天
    if (act === 'dt-copy-mon' || act === 'dt-copy-6' || act === 'dt-copy-7') {
      const src = {};
      (cfg.bell || []).forEach((x) => {
        const tm = dayTimeOf(x, 1);
        if (tm.start && tm.end) src[x.id] = { start: tm.start, end: tm.end };
      });
      if (!Object.keys(src).length) { toast('周一还没有时间可复制'); return; }
      cfg.dayTimes = cfg.dayTimes || {};
      const targets = act === 'dt-copy-mon' ? [2, 3, 4] : (act === 'dt-copy-6' ? [6] : [7]);
      targets.forEach((d) => { cfg.dayTimes[String(d)] = JSON.parse(JSON.stringify(src)); });
      cfg.bellSource = 'manual';
      markDirty(); render();
      toast('已复制到 ' + targets.map((d) => '周' + '一二三四五六日'[d - 1]).join('、'));
      return;
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      save();
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });
}

/* 松手 / 选完才触发：外观类设置改完立刻下发，不用再点保存 */
function onChange(e) {
  const el = e.target;

  if (el.id === 'chkAutoStart') {
    const on = el.checked;
    if (!window.deskboard || typeof window.deskboard.setAutoStart !== 'function') {
      toast('这个控制端不支持设置开机自启');
      el.checked = !on;
      return;
    }
    window.deskboard.setAutoStart(on)
      .then((r) => {
        if (r && r.ok) {
          INFO.autoStart = (r.autoStart === undefined) ? on : !!r.autoStart;
          toast(INFO.autoStart ? '已设为开机自动启动' : '已取消开机自动启动');
        } else {
          el.checked = !on;
          toast((r && r.err) || '设置失败');
        }
      })
      .catch(() => { el.checked = !on; toast('设置失败'); });
    return;
  }

  const p = el.dataset.b || '';
  if (p.indexOf('appearance.') === 0) save();
}

function onInput(e) {
  const el = e.target;

  // 分日作息时间输入（不重绘，避免输入过程被打断）
  if (el.dataset.dtDay) {
    const day = el.dataset.dtDay, id = el.dataset.dtId, f = el.dataset.dtF;
    cfg.dayTimes = cfg.dayTimes || {};
    const obj = cfg.dayTimes[day] || (cfg.dayTimes[day] = {});
    const cur = obj[id] || { start: '', end: '' };
    cur[f] = el.value;
    if (!cur.start && !cur.end) delete obj[id];
    else obj[id] = cur;
    cfg.bellSource = 'manual';
    markDirty();
    return;
  }

  // 特殊日期 / 临时值日的日期字段（改键名）
  if (el.dataset.specialKey) {
    const oldK = el.dataset.specialKey;
    const val = cfg.specialDays[oldK];
    delete cfg.specialDays[oldK];
    if (el.value) cfg.specialDays[el.value] = val;
    markDirty();
    setTimeout(render, 0);
    return;
  }
  if (el.dataset.ovkey) {
    const typeId = el.dataset.ovtype || '';
    const oldK = el.dataset.ovkey;
    const byType = (cfg.dutyOverrides[typeId] = cfg.dutyOverrides[typeId] || {});
    const val = byType[oldK] || [];
    delete byType[oldK];
    const nk = el.value || oldK;
    byType[nk] = el.tagName === 'INPUT' && el.type === 'date' ? val
      : el.value.split(/[、,，;；\s]+/).filter(Boolean);
    markDirty();
    setTimeout(render, 0);
    return;
  }

  const path = el.dataset.b;
  if (!path) return;

  // 显示方式是 renderMode + layout 的组合字段，单独落到真实字段上
  if (path === 'appearance.__display') {
    setDisplay(el.value);
    markDirty();
    setTimeout(render, 0);
    return;
  }

  let v = el.value;
  if (el.dataset.arr) v = String(el.value).split(/[、,，;；\s]+/).filter(Boolean);
  if (el.type === 'checkbox') v = el.checked;
  if (el.dataset.num) v = Number(el.value);

  if (el.dataset.bool && el.tagName === 'SELECT') v = el.value === '1';

  setPath(cfg, path, v);
  // 值日类型的「方式」切换会改变整个分栏的表单结构，立即重绘
  if (el.dataset.rerender) {
    markDirty();
    setTimeout(render, 0);
    return;
  }
  // 看板字号 / 背景图浓度：百分数实时显示
  if (path === 'appearance.fontScale') {
    const out = $('fsOut');
    if (out) out.textContent = Math.round(v * 100) + '%';
  }
  if (path === 'appearance.wallpaperAlpha') {
    const out = $('wpAlphaOut');
    if (out) out.textContent = v + '%';
  }
  // 强调色：控制台自己也跟着换，改完一眼就能看出来
  if (path === 'appearance.accent' && /^#[0-9a-fA-F]{6}$/.test(String(v))) {
    document.documentElement.style.setProperty('--accent', v);
  }
  // 手工改过作息时间后，就不再被学勤管家的时间设定覆盖
  if (path.indexOf('bell.') === 0) cfg.bellSource = 'manual';
  markDirty();

  if (el.dataset.out) {
    const out = document.getElementById(el.dataset.out);
    if (out) out.textContent = el.value;
  }
}

/* ==========================================================================
   保存 / 重置
   ========================================================================== */

async function save() {
  // 值日部分统一形状（旧配置迁移 + 清掉空的临时指定）
  ensureDutyShape();
  // 「显示方式」是界面上的组合选择，已经落到 renderMode/layout，别把中间字段写进配置
  if (cfg.appearance) delete cfg.appearance.__display;
  // 清理空课程行
  if (cfg.timetable) {
    for (const day of Object.keys(cfg.timetable)) {
      const arr = (cfg.timetable[day] || []).filter((c) => c && (c.s || c.ts || c.te));
      if (arr.length) cfg.timetable[day] = arr;
      else delete cfg.timetable[day];
    }
  }
  const btn = $('btnSave');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  try {
    const res = await window.deskboard.saveConfig(cfg);
    if (res && res.ok) {
      cfg = res.config;
      ensureDutyShape();
      if (res.info) INFO = res.info;
      clearDirty();
      toast('已保存，桌面看板已更新');
      render();
    } else {
      toast('保存失败，请重试');
    }
  } catch (e) {
    toast('无法连接 DeskBoard，保存没生效');
    showBanner('保存失败：没有连上桌面程序', '请确认 DeskBoard 正在运行，然后重新保存。');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '保存并应用'; }
  }
}

async function reset() {
  if (!window.confirm('确定要用示例数据覆盖当前所有内容吗？此操作不可撤销。')) return;
  try {
    const res = await window.deskboard.resetConfig();
    if (res && res.ok) {
      cfg = res.config;
      ensureDutyShape();
      if (res.info) INFO = res.info;
      clearDirty();
      toast('已恢复示例数据');
      render();
    }
  } catch (e) {
    toast('无法连接 DeskBoard');
  }
}

/* ==========================================================================
   连接状态
   ========================================================================== */

let waitingOnline = false;

function showBanner(title, desc) {
  const b = $('banner');
  if (!b) return;
  b.hidden = false;
  b.innerHTML = `<b>${esc(title)}</b><span>${esc(desc)}</span>`;
}

function bindStatus() {
  const conn = $('conn');
  const host = $('host');
  if (host) host.textContent = location.host || '本地';

  window.deskboard.onStatus(({ state }) => {
    linkState = state;
    if (conn) {
      conn.dataset.s = state;
      const b = conn.querySelector('b');
      if (b) b.textContent = state === 'online' ? '已连接桌面看板' : state === 'connecting' ? '连接中…' : '未连接';
    }
    if (state === 'offline') {
      showBanner('没有连接到 DeskBoard', '桌面程序可能没有启动。启动后这里会自动恢复，已经输入的内容仍然保留在页面上。');
    } else if (state === 'online') {
      const b = $('banner');
      if (b) { b.hidden = true; b.innerHTML = ''; }
      if (!cfg && !waitingOnline) { waitingOnline = true; boot(); }
    }
  });
}

/* ==========================================================================
   启动
   ========================================================================== */

let bootRetry = 0;
let booting = false;
async function boot() {
  // 防重入：连接状态回调可能在配置加载完成之前就触发（同步回调时），
  // 若此时又跑一次 boot，事件监听会绑两份（一次点击开两个弹窗之类的怪毛病）
  if (booting) return;
  booting = true;
  try {
    await bootInner();
  } finally {
    booting = false;
  }
}

async function bootInner() {
  // 检测是否嵌在「学勤管家」里：是的话向父页要学生/作息/课程表数据
  try {
    if (window.parent && window.parent !== window) {
      inXqgj = true;
      window.addEventListener('message', onXqgjMessage);
      window.parent.postMessage({ type: 'db-xqgj-request-data' }, '*');
      // 嵌在学勤管家里时显示「返回」按钮，点了请外层关掉浮层
      const bb = document.getElementById('btnBack');
      if (bb) {
        bb.hidden = false;
        bb.addEventListener('click', () => {
          try { window.parent.postMessage({ type: 'db-console-close' }, '*'); } catch (err) { /* ignore */ }
        });
      }
    }
  } catch (e) { /* ignore */ }

  bindStatus();

  try {
    cfg = await window.deskboard.getConfig();
    ensureDutyShape();
    INFO = await window.deskboard.info().catch(() => ({}));
  } catch (e) {
    // 打不开就先放着：连上之后会由状态回调重来，同时自己再兜底重试几次
    waitingOnline = false;
    if (bootRetry < 40) {
      bootRetry++;
      setTimeout(() => {
        if (!cfg && !waitingOnline) { waitingOnline = true; boot(); }
      }, 700);
    }
    return;
  }
  bootRetry = 0;
  waitingOnline = false;

  // 支持 #look 这类深链，托盘点「看板宽度」直接跳到对应标签
  const h = (location.hash || '').replace(/^#/, '').trim();
  if (h && TABS[h]) tab = h;

  const a = cfg.appearance || {};
  document.documentElement.style.setProperty('--accent', a.accent || '#2f6d8f');

  // 有周末课程时默认展开
  const tt = cfg.timetable || {};
  showWeekend = !!(tt['6'] && tt['6'].length) || !!(tt['7'] && tt['7'].length);

  bindEvents();
  render();
  clearDirty();

  // 桌面端（托盘操作）改了配置 → 非脏状态下自动同步到界面
  window.deskboard.onUpdate((c) => {
    if (dirty) return;
    cfg = c;
    ensureDutyShape();
    const a2 = c.appearance || {};
    document.documentElement.style.setProperty('--accent', a2.accent || '#2f6d8f');
    render();
  });

  window.deskboard.onIcons((info) => {
    INFO.icons = info;
    if (tab === 'look' && !dirty) render();
  });

  window.deskboard.onInfo((info) => {
    INFO = Object.assign({}, INFO, info || {});
    if (tab === 'look' && !dirty) render();
  });

  window.addEventListener('hashchange', () => {
    const k = (location.hash || '').replace(/^#/, '').trim();
    if (k && TABS[k] && k !== tab) { tab = k; render(); }
  });
}

boot();

</script>
<script>
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" || e.key === "Esc") {
    try { parent.postMessage({ type: "db-console-close" }, "*"); } catch (err) { /* ignore */ }
  }
});
</script>
