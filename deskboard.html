body.wp .gear { display: none; }\nbody.wp .ft { display: none; }\n\n/* ---------- 入场动画 ---------- */\n.sec-anim > * {\n  opacity: 0;\n  transform: translateY(6px);\n}\nbody.booted .sec-anim > * {\n  animation: rise .46s cubic-bezier(.22, .61, .36, 1) forwards;\n}\nbody.booted .sec-anim > *:nth-child(2) { animation-delay: .06s; }\nbody.booted .sec-anim > *:nth-child(3) { animation-delay: .12s; }\n\n@keyframes rise {\n  to { opacity: 1; transform: none; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .sec-anim > * { opacity: 1; transform: none; }\n}\n\n/* ---------- 调试可视化 ---------- */\n#dbgbox {\n  position: fixed;\n  display: none;\n  z-index: 9999;\n  outline: 2px dashed #d2453f;\n  outline-offset: -2px;\n  box-shadow: 0 0 0 9999px rgba(210, 69, 63, .16);\n  pointer-events: none;\n}\n#dbgbox::after {\n  content: attr(data-txt);\n  position: absolute;\n  left: 0;\n  top: -1.7em;\n  padding: .12em .5em;\n  font: 600 12px/1.5 \"Microsoft YaHei UI\", system-ui, sans-serif;\n  color: #fff;\n  background: #d2453f;\n  border-radius: 4px;\n  white-space: nowrap;\n}\n\n/* ==========================================================================\n   壁纸模式（body.wp）\n   整屏画面会被截图直接设为桌面壁纸：桌面上没有窗口，\n   所以不再需要“贴在壁纸边上”的视觉处理，也不再有可点击控件。\n   ========================================================================== */\n\nbody.wp .shell::after { display: none; }      /* 去掉面板与壁纸交界的那道高光 */\nbody.wp .gear { display: none; }              /* 不可交互，齿轮没意义 */\nbody.wp .shell {\n  /* 壁纸模式下整屏就是一块干净的底，内容区域再叠加渐变 */\n  background:\n    radial-gradient(130% 55% at 100% 0%, color-mix(in srgb, var(--accent) 13%, transparent) 0%, transparent 62%),\n    radial-gradient(95% 55% at 0% 100%, color-mix(in srgb, var(--amber) 11%, transparent) 0%, transparent 58%),\n    linear-gradient(168deg, var(--bg1) 0%, var(--bg2) 56%, var(--bg3) 100%);\n}\n\n/* ---------- 固定分工 / 周末休 / 周末不安排 ---------- */\n.fgroups { display: flex; flex-direction: column; gap: .32rem; }\n.frow {\n  display: flex;\n  align-items: baseline;\n  gap: .65rem;\n  font-size: 1.08rem;\n  line-height: 1.45;\n}\n.frow b {\n  flex: 0 0 auto;\n  font-weight: 700;\n  color: var(--accent);\n  white-space: nowrap;\n}\n.frow span { color: var(--ink); font-weight: 500; }\n.dg.is-off { opacity: .5; }\n.dg.is-off span { color: var(--ink-3); font-weight: 500; }\n.duty-off {\n  padding: .85rem .95rem;\n  border-radius: var(--radius);\n  background: var(--card);\n  border: 1px solid var(--line);\n  color: var(--ink-2);\n  font-size: 1.1rem;\n  font-weight: 600;\n}\n\n<\/style>\n<\/head>\n<body>\n  <div class=\"shell\" id=\"shell\" data-side=\"right\" data-theme=\"light\">\n\n    <header class=\"hd\">\n      <div class=\"hd-top\">\n        <div class=\"school\" id=\"school\"><\/div>\n      <\/div>\n      <div class=\"hd-mid\">\n        <h1 class=\"cname\" id=\"cname\">班级看板<\/h1>\n        <span class=\"wk\" id=\"week\"><\/span>\n      <\/div>\n      <div class=\"hd-date\" id=\"date\"><\/div>\n      <div class=\"special\" id=\"special\" hidden><\/div>\n    <\/header>\n\n    <main class=\"body\" id=\"body\"><\/main>\n\n    <footer class=\"ft\">\n      <span id=\"stamp\" class=\"stamp\"><\/span>\n      <button class=\"gear\" id=\"gear\" type=\"button\" aria-label=\"设置\">\n        <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" aria-hidden=\"true\">\n          <path fill=\"currentColor\" d=\"M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.3 2.5h4l.3-2.5a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z\"/>\n        <\/svg>\n      <\/button>\n    <\/footer>\n\n  <\/div>\n  <script>\nwindow.deskboard = {\n  getConfig: function(){ return Promise.resolve(window.__DB_DEFAULTS || {}); },\n  info: function(){ return Promise.resolve({}); },\n  scanIcons: function(){ return Promise.resolve(null); },\n  arrangeIcons: function(){ return Promise.resolve({ ok:false, err:\"请在教室那台电脑上操作\" }); },\n  restoreIcons: function(){ return Promise.resolve({ ok:false, err:\"请在教室那台电脑上操作\" }); },\n  wallpaper: function(){ return Promise.resolve({ custom:\"\" }); },\n  saveWallpaper: function(){ return Promise.resolve({ ok:false, err:\"上传图片请在教室那台电脑上操作\" }); },\n  clearWallpaper: function(){ return Promise.resolve({ ok:false, err:\"请在教室那台电脑上操作\" }); },\n  setAutoStart: function(){ return Promise.resolve({ ok:false, err:\"请在教室那台电脑上操作\" }); },\n  openEditor: function(){},\n  onUpdate: function(){}, onIcons: function(){}, onMode: function(){}, onDebug: function(){}\n};\n<\/script>\n<script>\n'use strict';\n\n/* ==========================================================================\n   DeskBoard · 看板渲染\n   ========================================================================== */\n\nconst WD_LONG = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];\nconst WD_SHORT = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];\nconst DENSITY_PX = { compact: 15, normal: 16, comfy: 17.5 };\nconst DUTY_COLS = [1, 2, 3, 4, 5, 6, 7]; // 周一 ~ 周日\n\nlet CFG = null;\nlet ICONS = null;         // 桌面图标占用信息 { count, cell, right, gapX, gapW, area, kind }\nlet DBG = false;          // 调试模式：把「已避开的图标区」画出来\nlet curRange = null;      // { start, end } 当前进行中的课\nlet lastDateKey = '';\nlet lastMinute = -1;\nlet booted = false;\n\nconst $ = (id) => document.getElementById(id);\nconst pad = (n) => String(n).padStart(2, '0');\n\nfunction toMin(t) {\n  const p = String(t || '0:0').split(':');\n  return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);\n}\nfunction dayKey(d) {\n  const w = d.getDay();\n  return String(w === 0 ? 7 : w);\n}\nfunction dateKey(d) {\n  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\n}\nfunction parseDate(s) {\n  const m = /^(\\d{4})-(\\d{1,2})-(\\d{1,2})$/.exec(String(s || ''));\n  if (!m) return null;\n  return new Date(+m[1], +m[2] - 1, +m[3]);\n}\nfunction daysBetween(a, b) {\n  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());\n  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());\n  return Math.round((B - A) / 86400000);\n}\nfunction esc(s) {\n  return String(s == null ? '' : s).replace(/[&<>\"']/g, (c) => (\n    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]\n  ));\n}\nfunction hueOf(name) {\n  let h = 0;\n  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;\n  return h;\n}\nfunction maxWidth() { return window.innerWidth; }\n\n/* ------------------------------------------------------------------ */\n\nconst THEMES = ['ivory', 'mist', 'paper', 'sage', 'graphite', 'midnight', 'forest', 'cocoa'];\nconst FONTS = ['hei', 'song', 'kai', 'yuan'];\n\nconst WALLPAPER_IDS = ['geometry', 'sunrise', 'bluesky'];\nconst CUSTOM_WP = 'custom';   // 用户自己上传的桌面背景图\n\n// 自定义壁纸存在本机（主进程 / 本地服务器），看板启动时按需取回一次\nfunction loadCustomWallpaper() {\n  const api = window.deskboard;\n  if (!api || typeof api.wallpaper !== 'function') return Promise.resolve(null);\n  return Promise.resolve(api.wallpaper())\n    .then((r) => {\n      const d = r && r.custom;\n      if (!d) return null;\n      window.__DB_WALLPAPERS = window.__DB_WALLPAPERS || {};\n      window.__DB_WALLPAPERS[CUSTOM_WP] = d;\n      return d;\n    })\n    .catch(() => null);\n}\n\nfunction ensureBgLayer() {\n  let el = document.getElementById('bgimg');\n  if (!el) {\n    el = document.createElement('div');\n    el.id = 'bgimg';\n    el.hidden = true;\n    document.body.insertBefore(el, document.body.firstChild);\n  }\n  return el;\n}\n\nfunction rootFont(a, full) {\n  const base = DENSITY_PX[a.density] || 16;\n  const fs = Math.max(0.5, Math.min(2, Number(a.fontScale) || 1));\n  return (full ? base * 1.25 : base) * fs;\n}\n\nfunction applyAppearance() {\n  const a = CFG.appearance || {};\n  const full = a.layout === 'full';\n  document.documentElement.style.fontSize = rootFont(a, full) + 'px';\n  const shell = $('shell');\n  // 兼容旧配置：light/dark\n  let t = a.theme === 'light' ? 'ivory' : a.theme === 'dark' ? 'graphite' : a.theme;\n  shell.dataset.theme = THEMES.includes(t) ? t : 'ivory';\n  document.documentElement.dataset.font = FONTS.includes(a.font) ? a.font : 'hei';\n  shell.dataset.side = a.side === 'left' ? 'left' : 'right';\n  shell.dataset.layout = full ? 'full' : 'column';\n  shell.dataset.bg = a.wallpaperBg === 'photo' ? 'photo' : 'solid';\n  // 背景图片：垫在内容层下面，主题色半透明罩住保证文字可读。\n  // 罩层浓度由「背景图浓度」控制（0=几乎纯主题色，100=照片最清晰）\n  const av = (a.wallpaperAlpha === undefined || a.wallpaperAlpha === null || a.wallpaperAlpha === '')\n    ? 35 : Math.max(0, Math.min(100, Number(a.wallpaperAlpha) || 0));\n  const a1 = (90 - av * 0.5).toFixed(1) + '%';\n  const rs = document.documentElement.style;\n  rs.setProperty('--wp-a1', a1);\n  rs.setProperty('--wp-a2', (90 - av * 0.5 + 4).toFixed(1) + '%');\n  rs.setProperty('--wp-a3', (90 - av * 0.5 + 7).toFixed(1) + '%');\n\n  const bgEl = ensureBgLayer();\n  const wp = (a.wallpaperImage === CUSTOM_WP || WALLPAPER_IDS.includes(a.wallpaperImage))\n    ? a.wallpaperImage : '';\n  let needLoad = false;\n  if (wp) {\n    let src = '';\n    if (wp === CUSTOM_WP) {\n      src = (window.__DB_WALLPAPERS && window.__DB_WALLPAPERS[CUSTOM_WP]) || '';\n      if (!src) needLoad = true;\n    } else {\n      src = (window.__DB_WALLPAPERS && window.__DB_WALLPAPERS[wp])\n        || ('assets/wallpapers/' + wp + '.jpg');\n    }\n    if (src) {\n      if (bgEl.style.backgroundImage !== 'url(\"' + src + '\")') {\n        bgEl.style.backgroundImage = 'url(\"' + src + '\")';\n      }\n      bgEl.hidden = false;\n      document.body.classList.add('has-bgimg');\n    } else {\n      bgEl.hidden = true;\n      bgEl.style.backgroundImage = '';\n      document.body.classList.remove('has-bgimg');\n    }\n  } else {\n    bgEl.hidden = true;\n    bgEl.style.backgroundImage = '';\n    document.body.classList.remove('has-bgimg');\n  }\n  if (needLoad) {\n    // 自定义图还没取回来：取到后重画一次（只做一次，避免死循环）\n    if (!loadCustomWallpaper._busy) {\n      loadCustomWallpaper._busy = true;\n      loadCustomWallpaper().then((d) => {\n        loadCustomWallpaper._busy = false;\n        if (d && CFG) render(false);\n      });\n    }\n  }\n  // 壁纸模式：整屏画面会被截图当桌面壁纸，没有窗口可以点，齿轮隐藏\n  document.body.classList.toggle('wp', a.renderMode !== 'window');\n  document.documentElement.style.setProperty('--accent', a.accent || '#2f6d8f');\n  applySafeArea();\n}\n\n/* ------------------------------------------------------------------\n   桌面图标避让\n   主进程把图标占用的横向空白带（gapX / gapW）传进来，\n   全屏模式下把内容整体挪到这条空白带里，图标区留空。\n   ------------------------------------------------------------------ */\n\nconst SAFE_GAP = 34;   // 内容离图标区的间距\n\nfunction applySafeArea() {\n  const a = CFG.appearance || {};\n  const shell = $('shell');\n  const root = document.documentElement;\n\n  const reset = () => {\n    root.style.setProperty('--safe-l', '0px');\n    root.style.setProperty('--safe-r', '0px');\n    root.style.setProperty('--safe-t', '0px');\n    root.style.setProperty('--safe-b', '0px');\n    shell.dataset.band = 'wide';\n    shell.dataset.avoid = '';\n  };\n\n  // 侧边栏模式由主进程直接挪窗口，不需要额外留白\n  if (a.avoidIcons === false || a.layout !== 'full') { reset(); return; }\n\n  const info = ICONS;\n  const vw = window.innerWidth || 1920;\n  const vh = window.innerHeight || 1080;\n  if (!info || !info.area) {\n    // 还没扫到图标位置：按 Windows 默认（图标从左上角按列往下排）保守避开上半屏，\n    // 内容先落到下半屏，绝不会被图标压住；扫描成功后按真实位置再校准。\n    const padT = Math.round(vh * 0.55);\n    root.style.setProperty('--safe-l', '0px');\n    root.style.setProperty('--safe-r', '0px');\n    root.style.setProperty('--safe-t', padT + 'px');\n    root.style.setProperty('--safe-b', '0px');\n    shell.dataset.band = 'wide';\n    shell.dataset.avoid = 'default';\n    return;\n  }\n\n  const padL = Math.max(0, Math.min(vw, info.padL || 0));\n  const padT = Math.max(0, Math.min(vh, info.padT || 0));\n  const padR = Math.max(0, Math.min(vw - padL, info.padR || 0));\n  const padB = Math.max(0, Math.min(vh - padT, info.padB || 0));\n\n  const usableW = vw - padL - padR;\n  const usableH = vh - padT - padB;\n\n  // 空白区太小（比如图标铺满整屏）就不硬躲，退回整屏避免挤成一团\n  if (usableW < 520 || usableH < 320) { reset(); return; }\n\n  root.style.setProperty('--safe-l', padL + 'px');\n  root.style.setProperty('--safe-r', padR + 'px');\n  root.style.setProperty('--safe-t', padT + 'px');\n  root.style.setProperty('--safe-b', padB + 'px');\n\n  shell.dataset.avoid = (info.kind || '') + (padL > 0 ? '-l' : '');\n  shell.dataset.kind = info.kind || '';\n\n  const cols = usableW >= 1180 ? 'wide' : (usableW >= 760 ? 'mid' : 'narrow');\n  shell.dataset.band = (usableH < 520 && cols === 'wide') ? 'mid' : cols;\n\n  renderDebug();\n}\n\n/* ------------------------------------------------------------------\n   调试可视化：把识别到的内容区和图标占用框画出来\n   ------------------------------------------------------------------ */\nfunction renderDebug() {\n  let box = document.getElementById('dbgbox');\n  if (!box) {\n    box = document.createElement('div');\n    box.id = 'dbgbox';\n    document.body.appendChild(box);\n  }\n  if (!DBG) { box.style.display = 'none'; return; }\n\n  const info = ICONS;\n  if (!info || !info.area) { box.style.display = 'none'; return; }\n  const [x, y, w, h] = info.area;\n  box.style.display = 'block';\n  box.style.left = x + 'px';\n  box.style.top = y + 'px';\n  box.style.width = w + 'px';\n  box.style.height = h + 'px';\n  box.dataset.txt = `内容区 ${w}×${h} @ ${x},${y} · 图标 ${info.count} 个 · ${info.kind || ''}`;\n}\n\n/* ------------------------------------------------------------------ */\n/* 课程                                                                */\n/* ------------------------------------------------------------------ */\n\n// 某一天某一节的时间：分日设置（dayTimes）优先；某天有显式作息但该节没排 → 不显示时间；\n// 仅当整天平都没设置才退回 bell 里的兜底时间（保证周五只显示到第六节）\nfunction dayTime(b, day) {\n  const dt = CFG.dayTimes && CFG.dayTimes[String(day)];\n  if (dt) {\n    const t = dt[String(b.id)];\n    if (t && t.start && t.end) return { start: t.start, end: t.end };\n    return { start: '', end: '' };\n  }\n  return { start: b.start, end: b.end };\n}\n\nfunction buildCourses(now, animate) {\n  const day = now.getDay() === 0 ? 7 : now.getDay();\n  // 当天的课按「当天的时间」排序：周五/周日的节次时间和周一~周四不一样\n  const bell = (CFG.bell || []).slice().sort((x, y) => toMin(dayTime(x, day).start) - toMin(dayTime(y, day).start));\n  const list = (CFG.timetable || {})[dayKey(now)] || [];\n  const byId = new Map();\n  for (const c of list) if (c && c.p != null) byId.set(Number(c.p), c);\n\n  // 只显示「写了课程名称」的节次；没写名称 = 不用上课，桌面不显示这段时间（含其时间）\n  const classRows = bell.filter((b) => {\n    if (b.brk) return false;\n    const c = byId.get(Number(b.id));\n    return !!(c && c.s);\n  });\n  const filled = classRows.filter((b) => byId.has(Number(b.id)));\n  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;\n\n  if (!filled.length) {\n    return {\n      html: buildEmpty(now),\n      meta: '今日无课',\n      cur: null\n    };\n  }\n\n  const timed = (b) => {\n    const cc = byId.get(Number(b.id));          // 这节课若自定义了时间则优先用它\n    const d = dayTime(b, day);\n    return (cc && cc.ts && cc.te) ? { start: cc.ts, end: cc.te } : d;\n  };\n  const upcoming = filled.find((b) => toMin(timed(b).start) > nowMin) || null;\n  const current = filled.find((b) => nowMin >= toMin(timed(b).start) && nowMin < toMin(timed(b).end)) || null;\n  const animCls = animate ? ' sec-anim' : '';\n\n  const rows = [];\n  // 只渲染「有课程名称」的节次：\n  // 大课间、午休等休息段（brk）和没排课的节次都不出现在桌面看板上，\n  // 每一行只剩下「时间 + 课程名称」。\n  for (const b of classRows) {\n    const tm = timed(b);\n    const c = byId.get(Number(b.id));\n    const st = toMin(tm.start);\n    const en = toMin(tm.end);\n    let state = 'todo';\n    if (c) {\n      if (nowMin >= en) state = 'done';\n      else if (nowMin >= st) state = 'now';\n    }\n    const isNext = upcoming && b.id === upcoming.id && c;\n    let tag = '';\n    if (state === 'now') tag = '<span class=\"tag now\">进行中<\/span>';\n    else if (isNext) tag = '<span class=\"tag next\">下一节<\/span>';\n    else if (state === 'done') tag = '<span class=\"tag done\">已结束<\/span>';\n\n    const subj = c ? esc(c.s || '') : '<span style=\"color:var(--ink-3)\">—<\/span>';\n\n    rows.push(`<div class=\"row is-${state}\">\n      <div class=\"t\"><b>${esc(tm.start)}<\/b><i>${esc(tm.end)}<\/i><\/div>\n      <div class=\"rail\"><span class=\"dot\"><\/span><\/div>\n      <div class=\"c\">\n        <div class=\"c-top\"><span class=\"subj\">${subj}<\/span>${tag}<\/div>\n        ${state === 'now' ? '<div class=\"prog\"><i><\/i><\/div>' : ''}\n      <\/div>\n    <\/div>`);\n  }\n\n  // 今日课程全部结束后：左侧大片空白不好看也没信息量，\n  // 补一段「明日先看」——把下一个上课日的前几节课列出来（时间 + 课程名）。\n  if (!current && !upcoming) {\n    const nx = findNextTeachingDay(now);\n    if (nx) {\n      const nd = nx.date.getDay() === 0 ? 7 : nx.date.getDay();\n      const nbell = (CFG.bell || []).slice().sort((x, y) => toMin(dayTime(x, nd).start) - toMin(dayTime(y, nd).start));\n      const nb = new Map(nbell.map((b) => [Number(b.id), b]));\n      const items = nx.list.slice()\n        .sort((a, b) => toMin(dayTime(nb.get(Number(a.p)) || {}, nd).start) - toMin(dayTime(nb.get(Number(b.p)) || {}, nd).start))\n        .map((c) => {\n          const b = nb.get(Number(c.p)) || {};\n          const tm = (c.ts && c.te) ? { start: c.ts, end: c.te } : dayTime(b, nd);\n          return `<div class=\"pitem\"><em>${esc(tm.start || '')}<\/em><span><b>${esc(c.s || '')}<\/b><\/span><\/div>`;\n        }).join('');\n      rows.push(`<div class=\"preview\">\n        <div class=\"ph\">明日先看 · ${esc(WD_LONG[nx.date.getDay()].replace('星期', '周'))} ${nx.date.getMonth() + 1}/${nx.date.getDate()}<\/div>\n        <div class=\"plist\">${items}<\/div>\n      <\/div>`);\n    }\n  }\n\n  // 课多的时候在整屏壁纸下分多栏排（每栏最多 6 行，最多 3 栏），保证一屏看得完\n  let html;\n  const shell = $('shell');\n  const canSplit = shell && shell.dataset.band && shell.dataset.band !== 'narrow';\n  if (canSplit && rows.length > 6) {\n    const cols = Math.min(3, Math.ceil(rows.length / 6));\n    const per = Math.ceil(rows.length / cols);\n    let colsHtml = '';\n    for (let i = 0; i < cols; i++) {\n      colsHtml += `<div class=\"clist\">${rows.slice(i * per, (i + 1) * per).join('')}<\/div>`;\n    }\n    html = `<div class=\"clist-cols\" style=\"grid-template-columns:repeat(${cols}, minmax(0, 1fr))\">${colsHtml}<\/div>`;\n  } else {\n    html = `<div class=\"clist${animCls}\">${rows.join('')}<\/div>`;\n  }\n\n  // 副标题也只给「时间 + 课程名称」，不再出现节次名（大课间/午休等文字一概不上墙）\n  const subjOf = (b) => ((byId.get(Number(b.id)) || {}).s || '');\n  let meta = `${filled.length} 节课`;\n  if (current) {\n    const tm = timed(current);\n    meta = `${esc(tm.start)}–${esc(tm.end)} · ${esc(subjOf(current))}`;\n  }\n  else if (upcoming) {\n    const tm = timed(upcoming);\n    meta = `${esc(tm.start)} 起 · ${esc(subjOf(upcoming))}`;\n  }\n  else meta = '今日课程已结束';\n\n  return {\n    html,\n    meta,\n    cur: current ? { start: toMin(timed(current).start), end: toMin(timed(current).end) } : null\n  };\n}\n\nfunction findNextTeachingDay(now) {\n  for (let i = 1; i <= 8; i++) {\n    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);\n    const list = ((CFG.timetable || {})[dayKey(d)] || []).filter((x) => x && x.s);\n    if (list.length) return { date: d, list };\n  }\n  return null;\n}\n\nfunction buildEmpty(now) {\n  const nx = findNextTeachingDay(now);\n  const today = now.getDay();\n  let big = '今天没有课，好好休息';\n  if (today === 0 || today === 6) big = '周末愉快，今天没有课';\n\n  let preview = '';\n  if (nx) {\n    const nd = nx.date.getDay() === 0 ? 7 : nx.date.getDay();\n    const bell = (CFG.bell || []).slice().sort((x, y) => toMin(dayTime(x, nd).start) - toMin(dayTime(y, nd).start));\n    const bb = new Map(bell.map((b) => [Number(b.id), b]));\n    const items = nx.list\n      .slice()\n      .sort((a, b) => toMin(dayTime(bb.get(Number(a.p)) || {}, nd).start) - toMin(dayTime(bb.get(Number(b.p)) || {}, nd).start))\n      .slice(0, 4)\n      .map((c) => {\n        const b = bb.get(Number(c.p)) || {};\n        const tm = (c.ts && c.te) ? { start: c.ts, end: c.te } : dayTime(b, nd);\n        return `<div class=\"pitem\"><em>${esc(tm.start || '')}<\/em><span><b>${esc(c.s || '')}<\/b><\/span><\/div>`;\n      })\n      .join('');\n    preview = `<div class=\"preview\">\n      <div class=\"ph\">${esc(WD_LONG[nx.date.getDay()].replace('星期', '周'))} · ${nx.date.getMonth() + 1}/${nx.date.getDate()} 的课<\/div>\n      <div class=\"plist\">${items}<\/div>\n    <\/div>`;\n  }\n\n  return `<div class=\"empty\">\n    <div class=\"big\">${big}<\/div>\n    <div class=\"sub\">${nx ? '下一个上课日的安排' : '课表还没有填写，打开网页控制台就能编辑'}<\/div>\n    ${preview}\n  <\/div>`;\n}\n\n/* ------------------------------------------------------------------ */\n/* 值日                                                                */\n/* ------------------------------------------------------------------ */\n\n// 读取值日类型（新配置 dutyTypes；旧配置 dutyGroups 也能正常读）\n// mode: rotate=按天轮换（班级值日）| fixed=固定分工（宿舍值日/清洁区值日，宿舍和区域固定、成员固定，不轮换）\nfunction dutyTypes() {\n  const t = CFG.dutyTypes;\n  const norm = (x) => ({\n    id: String(x.id || ''),\n    name: String(x.name || ''),\n    startDate: String(x.startDate || ''),\n    mode: x.mode === 'fixed' ? 'fixed' : 'rotate',\n    skipWeekends: x.skipWeekends !== false,\n    groups: (Array.isArray(x.groups) ? x.groups : []).map((g) => ({\n      name: String(g.name || ''),\n      members: (Array.isArray(g.members) ? g.members : []).map(String)\n    }))\n  });\n  if (Array.isArray(t) && t.length) return t.map(norm);\n  const g = CFG.dutyGroups;\n  if (Array.isArray(g) && g.length) {\n    return [norm({ id: 'class', name: '班级值日', groups: g })];\n  }\n  return [];\n}\n\n// 某个值日类型某天的临时指定名单\nfunction dutyOverride(typeId, key) {\n  const ov = CFG.dutyOverrides || {};\n  const byType = (ov[typeId] && typeof ov[typeId] === 'object') ? ov[typeId] : null;\n  if (byType) return byType[key];\n  return ov[key];                       // 旧扁平格式\n}\n\n// 轮到第几组：skipWeekends 时只数工作日（周末不推进轮换）\nfunction dutyIndexOf(d, groups, startDate, skipWeekends) {\n  const start = parseDate(startDate) || parseDate(CFG.dutyStartDate) || parseDate(CFG.semesterStart);\n  if (!start || !groups.length) return 0;\n  if (!skipWeekends) {\n    const diff = daysBetween(start, d);\n    return ((diff % groups.length) + groups.length) % groups.length;\n  }\n  const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());\n  const end = new Date(d.getFullYear(), d.getMonth(), d.getDate());\n  if (end < start) return 0;\n  let n = 0;\n  while (cur <= end) {\n    const w = cur.getDay();\n    if (w !== 0 && w !== 6) n++;\n    cur.setDate(cur.getDate() + 1);\n  }\n  return n > 0 ? (n - 1) % groups.length : 0;\n}\n\nfunction buildDuty(now, animate) {\n  const all = dutyTypes();\n  // 只显示「组里填了人」的值日类型，空类型不占看板版面\n  const types = all.filter((t) => t.groups.some((g) => g.members.length));\n  if (!types.length) return { html: '', meta: '' };\n\n  const key = dateKey(now);\n  const animCls = animate ? ' sec-anim' : '';\n  const isWknd = now.getDay() === 0 || now.getDay() === 6;\n  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));\n\n  const personHtml = (names) => names.map((n) => {\n    const h = hueOf(n);\n    return `<span class=\"person\">\n      <i class=\"avatar\" style=\"background:hsl(${h} 34% 52%)\">${esc(String(n).slice(0, 1))}<\/i>${esc(n)}\n    <\/span>`;\n  }).join('');\n\n  // 这一天轮到哪一组（固定分工类型用不到）\n  const groupOfDay = (t, d) => {\n    const gi = dutyIndexOf(d, t.groups, t.startDate, t.skipWeekends);\n    return t.groups[gi] || { name: '', members: [] };\n  };\n\n  // 本周轮值格子（只给「按天轮换」的类型画；周末且不轮值时显示「休」）\n  const weekCells = (t) => DUTY_COLS.map((w) => {\n    const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + (w - 1));\n    const wknd = d.getDay() === 0 || d.getDay() === 6;\n    const off = wknd && t.skipWeekends;\n    const isToday = dateKey(d) === key;\n    const label = off ? '休' : (groupOfDay(t, d).name || '—');\n    return `<div class=\"dg${off ? ' is-off' : ''}${isToday ? ' is-today' : ''}\"><b>${WD_SHORT[d.getDay()]}<\/b><span>${esc(label)}<\/span><\/div>`;\n  }).join('');\n\n  // 一种类型的今日块\n  const blockOf = (t) => {\n    if (t.mode === 'fixed') {\n      // 固定分工：宿舍/区域是固定的，成员也是固定的——每天都是这些组，全部列出\n      const rows = t.groups.filter((g) => g.members.length).map((g) =>\n        `<div class=\"frow\"><b>${esc(g.name || '未命名')}<\/b><span>${esc(g.members.join('、'))}<\/span><\/div>`\n      ).join('');\n      return `<div class=\"dty\">\n        <div class=\"dty-h\">\n          <span class=\"dty-name\">${esc(t.name || '值日')}<\/span>\n          <span class=\"duty-tag\">固定分工<\/span>\n        <\/div>\n        <div class=\"fgroups\">${rows}<\/div>\n      <\/div>`;\n    }\n    const g = groupOfDay(t, now);\n    const ov = dutyOverride(t.id, key);\n    const members = (Array.isArray(ov) && ov.length) ? ov : g.members;\n    const people = personHtml(members);\n    return `<div class=\"dty\">\n      <div class=\"dty-h\">\n        <span class=\"dty-name\">${esc(t.name || '值日')}<\/span>\n        <span class=\"duty-tag\">${esc(g.name || '轮值')}<\/span>\n      <\/div>\n      <div class=\"people\">${people || '<span class=\"person\" style=\"color:var(--ink-3)\">今日未安排<\/span>'}<\/div>\n    <\/div>`;\n  };\n\n  // 周末且该类型「周末不安排」→ 不参与今日值日\n  const active = types.filter((t) => !(isWknd && t.skipWeekends));\n  if (!active.length) {\n    return {\n      meta: '周末不安排',\n      html: `${animCls ? `<div class=\"${animCls.trim()}\">` : ''}\n        <div class=\"duty-off\">周末不用值日 · 周一照常<\/div>\n        ${animCls ? '<\/div>' : ''}`\n    };\n  }\n\n  const rotateTypes = active.filter((t) => t.mode !== 'fixed');\n\n  // 只有一种类型：大块排版\n  if (active.length === 1) {\n    const t = active[0];\n    if (t.mode === 'fixed') {\n      return {\n        meta: t.name ? `${t.name} · ${t.groups.length} 组固定` : `${t.groups.length} 组固定`,\n        html: `${animCls ? `<div class=\"${animCls.trim()}\">` : ''}${blockOf(t)}${animCls ? '<\/div>' : ''}`\n      };\n    }\n    const g = groupOfDay(t, now);\n    const ov = dutyOverride(t.id, key);\n    const members = (Array.isArray(ov) && ov.length) ? ov : g.members;\n    const people = personHtml(members);\n    return {\n      meta: t.name ? `${t.name} · ${t.groups.length} 组轮换` : `${t.groups.length} 组轮换`,\n      html: `${animCls ? `<div class=\"${animCls.trim()}\">` : ''}\n        <div class=\"duty-now\">\n          <div class=\"people\">${people || '<span class=\"person\" style=\"color:var(--ink-3)\">今日未安排<\/span>'}<\/div>\n          <span class=\"duty-tag\">${esc(g.name || '轮值')}<\/span>\n        <\/div>\n        <div class=\"duty-grid\">${weekCells(t)}<\/div>\n        ${animCls ? '<\/div>' : ''}`\n    };\n  }\n\n  // 多种类型：每类一张卡片；周轮值表只画「按天轮换」的类型\n  const blocks = active.map(blockOf).join('');\n  const weekHtml = rotateTypes.length\n    ? `<div class=\"duty-week\">${rotateTypes.map((t) => `<div class=\"dw-row\">\n        <span class=\"dw-name\">${esc(t.name || '值日')}<\/span>\n        <div class=\"duty-grid\">${weekCells(t)}<\/div>\n      <\/div>`).join('')}<\/div>`\n    : '';\n  const totalGroups = active.reduce((a, t) => a + t.groups.length, 0);\n  return {\n    meta: `${active.length} 类值日 · ${totalGroups} 组`,\n    html: `${animCls ? `<div class=\"${animCls.trim()}\">` : ''}\n      <div class=\"duty-types\">${blocks}<\/div>\n      ${weekHtml}\n      ${animCls ? '<\/div>' : ''}`\n  };\n}\n\n/* ------------------------------------------------------------------ */\n/* 通知                                                                */\n/* ------------------------------------------------------------------ */\n\nfunction buildNotices(animate) {\n  const list = (CFG.notices || []).filter((n) => n && String(n.text || '').trim());\n  if (!list.length) return { html: '', meta: '' };\n  const sorted = list.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));\n  const items = sorted.map((n) =>\n    `<li class=\"${n.pinned ? 'pinned' : ''}\"><span class=\"bul\"><\/span><span>${esc(n.text)}<\/span><\/li>`\n  ).join('');\n  const animCls = animate ? ' sec-anim' : '';\n  const inner = `<ul class=\"notices\">${items}<\/ul>`;\n  return {\n    meta: `${list.length} 条`,\n    html: animCls ? `<div class=\"${animCls.trim()}\">${inner}<\/div>` : inner\n  };\n}\n\n/* ------------------------------------------------------------------ */\n/* 主渲染                                                              */\n/* ------------------------------------------------------------------ */\n\nfunction render(animate) {\n  if (!CFG) return;\n  const now = new Date();\n  // 注意：下面整段都用到 a（外观设置），必须在这里声明。\n  // 曾经漏了这一行，严格模式下 a 未定义 → ReferenceError → 看板主体一片空白。\n  const a = CFG.appearance || {};\n\n  applyAppearance();\n\n  $('school').textContent = CFG.school || '';\n  $('cname').textContent = CFG.className || '班级看板';\n\n  const ds = parseDate(CFG.semesterStart);\n  const weekNo = ds ? Math.floor(daysBetween(ds, now) / 7) + 1 : null;\n  $('week').textContent = weekNo && weekNo > 0 ? `第 ${weekNo} 周` : '';\n\n  $('date').innerHTML = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日\n    <span class=\"sep\">·<\/span> ${WD_LONG[now.getDay()]}`;\n\n  const sp = (CFG.specialDays || {})[dateKey(now)];\n  const spEl = $('special');\n  if (sp) {\n    spEl.hidden = false;\n    spEl.innerHTML = `<b>今日安排<\/b><span>${esc(sp)}<\/span>`;\n  } else {\n    spEl.hidden = true;\n    spEl.innerHTML = '';\n  }\n\n  const courses = buildCourses(now, animate);\n  const duty = buildDuty(now, animate);\n  const notices = buildNotices(animate);\n  curRange = courses.cur;\n\n  // 板块：顺序可调、可隐藏（moduleOrder / moduleHidden）。\n  // 自定义板块用 cm:<id> 编号，和三个内置板块一起参与排序与隐藏。\n  const MOD_NAMES = { courses: '今日课程', duty: '今日值日', notices: '班级通知' };\n  const cms = Array.isArray(CFG.customModules) ? CFG.customModules : [];\n  const cmKey = (m, i) => 'cm:' + ((m && m.id) || i);\n  cms.forEach((m, i) => { MOD_NAMES[cmKey(m, i)] = (m && m.title) || '自定义板块'; });\n\n  let order = (Array.isArray(a.moduleOrder) && a.moduleOrder.length)\n    ? a.moduleOrder.filter((x) => MOD_NAMES[x])\n    : [];\n  // 配置里没有的新板块（升级后新增的）默认排到最后，不会凭空消失\n  Object.keys(MOD_NAMES).forEach((m) => { if (!order.includes(m)) order.push(m); });\n  const hidden = a.moduleHidden || {};\n  // 三个内置板块全被隐藏时，看板会一片空白——至少保留「今日课程」\n  const coreHidden = ['courses', 'duty', 'notices'].every((k) => hidden[k]);\n  if (coreHidden) hidden.courses = false;\n\n  const secHtml = {\n    courses: courses.html ? `<section>\n      <div class=\"sec-h\"><h3>今日课程<\/h3><span class=\"meta\">${courses.meta}<\/span><\/div>\n      ${courses.html}\n    <\/section>` : '',\n    duty: duty.html ? `<section>\n      <div class=\"sec-h\"><h3>今日值日<\/h3><span class=\"meta\">${esc(duty.meta)}<\/span><\/div>\n      ${duty.html}\n    <\/section>` : '',\n    notices: notices.html ? `<section>\n      <div class=\"sec-h\"><h3>班级通知<\/h3><span class=\"meta\">${esc(notices.meta)}<\/span><\/div>\n      ${notices.html}\n    <\/section>` : ''\n  };\n  cms.forEach((m, i) => {\n    const lines = String((m && m.text) || '').split(/\\n+/).map((x) => x.trim()).filter(Boolean);\n    secHtml[cmKey(m, i)] = lines.length ? `<section>\n      <div class=\"sec-h\"><h3>${esc((m && m.title) || '班级公告')}<\/h3><span class=\"meta\">${lines.length} 条<\/span><\/div>\n      <ul class=\"notices\">${lines.map((l) => `<li><span class=\"bul\"><\/span><span>${esc(l)}<\/span><\/li>`).join('')}<\/ul>\n    <\/section>` : '';\n  });\n\n  let html = '';\n  for (const id of order) {\n    if (hidden[id]) continue;\n    html += secHtml[id] || '';\n  }\n\n  $('body').innerHTML = html;\n  // 按需求移除看板上的时间显示（原右下角「更新于 HH:MM」）\n  { const st = $('stamp'); if (st) { st.textContent = ''; st.hidden = true; st.style.display = 'none'; } }\n  lastDateKey = dateKey(now);\n  lastMinute = now.getMinutes();\n\n  autoFit();\n  if (animate) {\n    requestAnimationFrame(() => document.body.classList.add('booted'));\n  }\n  updateProgress(new Date());\n}\n\n/* 内容超高自动缩小：\n   壁纸是一张静态图，看板内容超出可视区 = 直接看不见（也没法滚动）。\n   渲染完先按基准字号排版，若 .body 出现纵向溢出就逐步缩小字号，\n   直到全部内容装进安全区（最小缩到 0.72 倍，保证字仍可读）。 */\nfunction autoFit() {\n  const shell = $('shell');\n  const body = $('body');\n  if (!shell || !body) return;\n  const a = CFG.appearance || {};\n  const base = rootFont(a, a.layout === 'full');\n  document.documentElement.style.fontSize = base + 'px';\n\n  // 只有铺满/壁纸模式需要保证「一屏全显示」；侧边栏窗口本身可以滚动\n  if (a.layout !== 'full') { shell.dataset.fitScale = '1'; return; }\n\n  let scale = 1;\n  let guard = 14;\n  while (guard-- > 0 && body.scrollHeight > body.clientHeight + 2) {\n    scale -= 0.04;\n    if (scale < 0.72) { scale = 0.72; document.documentElement.style.fontSize = (base * scale) + 'px'; break; }\n    document.documentElement.style.fontSize = (base * scale) + 'px';\n  }\n  shell.dataset.fitScale = scale.toFixed(2);\n}\n\nfunction updateProgress(now) {\n  if (!curRange) return;\n  const node = document.querySelector('.row.is-now .prog > i');\n  if (!node) return;\n  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;\n  const total = Math.max(1, curRange.end - curRange.start);\n  const pct = Math.min(100, Math.max(0, ((nowMin - curRange.start) / total) * 100));\n  node.style.width = pct.toFixed(1) + '%';\n}\n\nfunction tick() {\n  if (!CFG) return;\n  const now = new Date();\n  if (dateKey(now) !== lastDateKey) { render(false); return; }\n  if (now.getMinutes() !== lastMinute) { render(false); return; }\n  updateProgress(now);\n}\n\n/* ------------------------------------------------------------------ */\n/* 启动                                                                */\n/* ------------------------------------------------------------------ */\n\n(async function boot() {\n  try {\n    CFG = await window.deskboard.getConfig();\n  } catch (e) {\n    CFG = { className: '看板', appearance: {}, bell: [], 'use strict';

/* ==========================================================================
   MQTTLite · 零依赖 MQTT 3.1.1 客户端

   · 电脑端（Electron 主进程）：mqtt:// 或 mqtts:// → 直接 TCP/TLS
   · 浏览器（控制页）：ws:// 或 wss:// → 原生 WebSocket
   只实现用得到的部分：CONNECT / SUBSCRIBE / PUBLISH(QoS0) / PING / 断线重连
   ========================================================================== */

(function (root, factory) {

})(typeof self !== 'undefined' ? self : this, function () {

  function utf8(s) { return new TextEncoder().encode(s); }
  function fromUtf8(b) { return new TextDecoder('utf-8').decode(b); }

  function concat(list) {
    var n = 0;
    for (var i = 0; i < list.length; i++) n += list[i].length;
    var out = new Uint8Array(n);
    var o = 0;
    for (var j = 0; j < list.length; j++) { out.set(list[j], o); o += list[j].length; }
    return out;
  }

  function u16(n) { return new Uint8Array([(n >> 8) & 255, n & 255]); }
  function mstr(b) { return concat([u16(b.length), b]); }
  function varint(n) {
    var out = [];
    do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0);
    return new Uint8Array(out);
  }
  function packet(type, flags, body) {
    return concat([new Uint8Array([(type << 4) | flags]), varint(body.length), body]);
  }

  function connPacket(clientId, ka) {
    return packet(1, 0, concat([
      mstr(utf8('MQTT')),
      new Uint8Array([4, 0x02]),        // level 4, clean session
      u16(ka),
      mstr(utf8(clientId))
    ]));
  }
  function subPacket(id, topic) {
    return packet(8, 2, concat([u16(id), mstr(utf8(topic)), new Uint8Array([0])]));
  }
  function unsubPacket(id, topic) {
    return packet(10, 2, concat([u16(id), mstr(utf8(topic))]));
  }
  function pubPacket(topic, payload, retain) {
    return packet(3, retain ? 1 : 0, concat([mstr(utf8(topic)), payload]));
  }

  function parsePackets(buf) {
    var out = [];
    var off = 0;
    while (off < buf.length) {
      var start = off;
      var h = buf[off++];
      var mult = 1;
      var len = 0;
      var b = 0;
      var ok = false;
      do {
        if (off >= buf.length) break;
        b = buf[off++];
        len += (b & 127) * mult;
        mult *= 128;
        ok = true;
      } while (b & 128);
      if (!ok || off + len > buf.length) { off = start; break; }
      out.push({ type: h >> 4, flags: h & 15, body: buf.subarray(off, off + len) });
      off += len;
    }
    return { packets: out, rest: buf.subarray(off) };
  }

  function readStr(body, off) {
    var len = (body[off] << 8) | body[off + 1];

  function topicMatch(filter, topic) {
    var f = filter.split('/');

      if (f[i] === '#') return true;
      if (i >= t.length) return false;
      if (f[i] !== '+' && f[i] !== t[i]) return false;
    }

  function parseUrl(url) {
    var m = String(url).match(/^(\w+):\/\/([^/:]+)(?::(\d+))?(\/.*)?$/);

      host: m[2],

  function Client(urls, opts) {

    this.opt = opts || {};

    this.ka = this.opt.keepalive || 40;
    this.buf = new Uint8Array(0);
    this.subs = [];
    this.sock = null;
    this.connected = false;
    this.stopped = false;
    this.idx = 0;
    this.pid = 1;
    this.retry = 1200;
    this.timers = {};

    if (!this.handlers[evt]) this.handlers[evt] = [];

  };

    }

    this._emit.apply(this, ['log'].concat(Array.prototype.slice.call(arguments)));
  };

  Client.prototype.start = function () {
    this.stopped = false;
    this._open();
    return this;
  };

    var self = this;
    var url = this.urls[this.idx % this.urls.length];
    var u = parseUrl(url);
    if (!u) { this._fail('bad url ' + url); return; }

    this.buf = new Uint8Array(0);

    var timeout = setTimeout(function () { self._fail('连接超时 ' + url); }, 9000);
    this.timers.conn = timeout;

      self._send(connPacket(self.clientId, self.ka));
    };

      } catch (e) { this._fail(e.message); return; }

      ws.onopen = opened;
      ws.onmessage = function (ev) { self._feed(new Uint8Array(ev.data)); };
      ws.onclose = function () { self._lost('websocket closed'); };
      ws.onerror = function () { self._lost('websocket error'); };
      this.sock = ws;
      this.kind = 'ws';
      return;
    }

    if (!isNode) { this._fail('浏览器只支持 ws/wss'); return; }

    var net = require('net');
    var sock;
    try {
      if (u.scheme === 'mqtts') {
        var tls = require('tls');
        sock = tls.connect({ host: u.host, port: u.port, servername: u.host });
        sock.once('secureConnect', opened);
      } else {
        sock = net.connect({ host: u.host, port: u.port });
        sock.once('connect', opened);
      }

    sock.on('data', function (d) { self._feed(new Uint8Array(d)); });

    this.kind = 'tcp';

      } else {
        if (this.sock.destroyed) return false;

      }
      return true;
    } catch (e) { return false; }
  };

  Client.prototype._feed = function (bytes) {
    this.buf = concat([this.buf, bytes]);
    var r = parsePackets(this.buf);
    this.buf = r.rest;
    for (var i = 0; i < r.packets.length; i++) this._handle(r.packets[i]);
  };

  Client.prototype._handle = function (p) {
    var self = this;
    if (p.type === 2) {                       // CONNACK
      if (p.body[1] === 0) {

        clearTimeout(this.timers.conn);
        this._log('connected to', this.urls[this.idx % this.urls.length]);
        this.subs.forEach(function (s) { self._doSub(s.topic); });

        this._emit('connect');
      } else {
        this._fail('broker refused rc=' + p.body[1]);
      }
      return;
    }
    if (p.type === 3) {                       // PUBLISH
      var qos = (p.flags >> 1) & 3;
      var t = readStr(p.body, 0);
      var off = t.next;
      if (qos > 0) off += 2;
      var payload = p.body.subarray(off);
      this._emit('message', t.value, fromUtf8(payload), payload);
      return;
    }
    if (p.type === 6) {                       // PUBREL (不该出现，但别卡住)
      return;
    }
    if (p.type === 13) return;                // PINGRESP
    if (p.type === 9) {                       // SUBACK
      return;
    }
  };

  Client.prototype._startPing = function () {
    var self = this;
    clearInterval(this.timers.ping);
    this.timers.ping = setInterval(function () {
      if (self.connected) self._send(new Uint8Array([0xc0, 0]));
    }, this.ka * 600);
  };

  Client.prototype._doSub = function (topic) {
    if (!this.connected) return;
    this._send(subPacket(this.pid++, topic));
  };

  Client.prototype.subscribe = function (topic) {
    var hit = null;
    for (var i = 0; i < this.subs.length; i++) if (this.subs[i].topic === topic) hit = this.subs[i];

    return this;
  };

  Client.prototype.unsubscribe = function (topic) {
    this.subs = this.subs.filter(function (s) { return s.topic !== topic; });

  };

  Client.prototype.publishJSON = function (topic, obj, retain) {

    } catch (e) { /* ignore */ }
  };

  Client.prototype._lost = function (why) {

    var was = this.connected;
    this._teardown();
    if (was) { this._log('disconnected', why); this._emit('close', why); }
    this._retryLater();
  };

  Client.prototype._fail = function (why) {
    this._teardown();
    this.idx++;
    this._log('connect failed', why);
    this._emit('error', why);
    this._retryLater();
  };

  Client.prototype._retryLater = function () {
    if (this.stopped) return;
    var self = this;
    clearTimeout(this.timers.retry);
    var d = this.retry;
    this.retry = Math.min(15000, Math.round(this.retry * 1.7));
    this.timers.retry = setTimeout(function () { self._open(); }, d);
  };

  Client.prototype.stop = function () {
    this.stopped = true;
    clearTimeout(this.timers.retry);
    this._teardown();
  };

  return {
    Client: Client,
    topicMatch: topicMatch,
    encode: { packet: packet, connPacket: connPacket, subPacket: subPacket, pubPacket: pubPacket },
    decode: parsePackets
  };
});

<script>
'use strict';

/* ==========================================================================
   DeskBoard · 远程控制端桥接

   把 window.deskboard 换成"通过 MQTT 操作某间教室"的版本，
   编辑器（editor.js）完全不用改。

   主题：
     deskboard/v3/<code>/rpc   我 → 教室机
     deskboard/v3/<code>/rep   教室机 → 我
     deskboard/v3/<code>/cfg   教室机 → 我（当前配置，retain）
     deskboard/v3/<code>/state 教室机 → 我（在线状态，retain）

   ========================================================================== */

(function () {

    'wss://broker.emqx.io:8084/mqtt'
  ];
  var PREFIX = 'deskboard/v3';
  var LS_ROOMS = 'deskboard:rooms:v1';
  var LS_LAST = 'deskboard:last:v1';

  var DEFAULTS = window.__DB_DEFAULTS || {};

  var client = null;
  var code = '';
  var rooms = [];
  var state = 'offline';        // offline | connecting | online
  var detail = '';
  var cfg = null;
  var remoteInfo = {};
  var pending = {};

    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function emit(name, payload) {
    (handlers[name] || []).slice().forEach(function (fn) {
      try { fn(payload); } catch (e) { console.error(e); }
    });
  }

  function setState(s, d) {
    state = s;
    detail = d || '';
    emit('status', { state: s, detail: d || '' });
    paint();
    // 连上之后把"连接教室"卡片收起来，露出编辑器
    if (s === 'online') {
      setTimeout(function () {
        var v = $('#rmveil');
        if (v) v.hidden = true;
      }, 500);
    }
  }

  function loadRooms() {
    try { rooms = JSON.parse(localStorage.getItem(LS_ROOMS) || '[]'); } catch (e) { rooms = []; }

    return rooms;
  }

  function saveRooms() {
    try { localStorage.setItem(LS_ROOMS, JSON.stringify(rooms)); } catch (e) { /* ignore */ }
  }

  function normCode(v) {
    var s = String(v || '').replace(/[^0-9]/g, '');

    return null;
  }

  function upsertRoom(c, name) {
    var r = roomOf(c);
    if (!r) { r = { code: c, name: name || ('教室 ' + c) }; rooms.push(r); }
    if (name) r.name = name;
    r.last = Date.now();
    saveRooms();
  }

  /* ---------------- MQTT ---------------- */

  function base() { return PREFIX + '/' + code; }

  function connect(c) {
    if (!window.MQTTLite) { setState('offline', '缺少 MQTT 组件'); return; }
    code = c;
    try { localStorage.setItem(LS_LAST, c); } catch (e) { /* ignore */ }

    if (client) { try { client.stop(); } catch (e) { /* ignore */ } }
    cfg = null;
    remoteInfo = {};
    setState('connecting', '正在连接 ' + c + '…');

    client = new window.MQTTLite.Client(BROKERS, {
      clientId: 'ctl_' + c + '_' + Math.random().toString(16).slice(2, 8),
      keepalive: 40
    });

    client.on('connect', function () {
      client.subscribe(base() + '/state');
      client.subscribe(base() + '/cfg');
      client.subscribe(base() + '/rep');
      setState('connecting', '已连上中转服务器，正在确认教室机…');
      setTimeout(function () {
        if (state !== 'online') setState('offline', '这台教室没有响应（检查是否开机 / 码是否正确）');
      }, 6000);
    });

    client.on('message', function (topic, payload) {
      var m = null;
      try { m = JSON.parse(payload); } catch (e) { return; }
      if (!m || typeof m !== 'object') return;

      if (topic === base() + '/state') {
        remoteInfo = m;
        if (m.online) {
          setState('online', '已连接：' + (m.className || m.school || code));
          if (m.className) upsertRoom(code, m.className);
          emit('info', { version: m.version, className: m.className, code: code });
        } else {
          setState('offline', '教室机已退出');
        }
        return;
      }

      if (topic === base() + '/cfg') {
        cfg = m;
        emit('config', m);
        emit('info', { code: code });
        return;
      }

      if (topic === base() + '/rep') {
        var p = pending[m.id];
        if (!p) return;
        delete pending[m.id];
        clearTimeout(p.timer);
        if (m.ok) p.resolve(m.data);
        else p.reject(new Error(m.err || '操作失败'));
      }
    });

    client.on('close', function (why) {
      if (state === 'online') setState('connecting', '连接中断，正在重连…（' + (why || '') + '）');
    });

    client.start();
  }

  function rpc(op, payload, timeout) {
    return new Promise(function (resolve, reject) {
      if (!client || !client.connected || !code) {
        reject(new Error('还没连接到教室'));
        return;
      }
      var id = 'c' + (++seq) + '_' + Math.random().toString(16).slice(2, 6);
      var timer = setTimeout(function () {
        delete pending[id];
        reject(new Error('教室没有响应（超时）'));
      }, timeout || 9000);
      pending[id] = { resolve: resolve, reject: reject, timer: timer };
      var msg = { id: id, op: op, from: 'control-page' };
      if (payload !== undefined) {
        if (op === 'set') msg.config = payload;
        else Object.assign(msg, payload);
      }
      client.publishJSON(base() + '/rpc', msg);
    });
  }

  /* ---------------- 界面 ---------------- */

  var STYLE = ''
    + '#rmveil{position:fixed;inset:0;z-index:9999;background:rgba(20,24,30,.55);backdrop-filter:blur(6px);'
    + 'display:flex;align-items:center;justify-content:center;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}'
    + '#rmveil[hidden]{display:none}'
    + '.rmcard{width:min(92vw,460px);background:#fff;border-radius:16px;padding:26px 26px 20px;box-shadow:0 24px 60px rgba(0,0,0,.28)}'
    + '.rmcard h2{margin:0 0 6px;font-size:19px;letter-spacing:.02em}'
    + '.rmcard p{margin:0 0 16px;color:#7a8189;font-size:13px}'
    + '.rminput{width:100%;box-sizing:border-box;padding:14px 16px;font-size:26px;letter-spacing:.28em;'
    + 'text-align:center;border:1.5px solid #d8dde3;border-radius:12px;outline:none;font-variant-numeric:tabular-nums;'
    + 'font-family:ui-monospace,Consolas,monospace;transition:.18s}'
    + '.rminput:focus{border-color:#2f6d8f;box-shadow:0 0 0 4px rgba(47,109,143,.12)}'
    + '.rmrow{display:flex;gap:10px;margin-top:14px}'
    + '.rmbtn{flex:1;padding:12px 16px;border:0;border-radius:11px;background:#2f6d8f;color:#fff;font-size:14px;'
    + 'font-weight:600;cursor:pointer;transition:.16s}'
    + '.rmbtn:hover{background:#275a77}'
    + '.rmbtn[disabled]{opacity:.55;cursor:default}'
    + '.rmbtn.ghost{background:#f0f2f5;color:#4a5460}'
    + '.rmbtn.ghost:hover{background:#e5e8ed}'
    + '.rmmsg{margin-top:12px;font-size:13px;min-height:20px;color:#7a8189}'
    + '.rmmsg.err{color:#c0503f}'
    + '.rmmsg.ok{color:#2f7d52}'
    + '.rmlist{margin-top:16px;border-top:1px solid #edf0f3;padding-top:12px;max-height:180px;overflow:auto}'
    + '.rmlist h3{margin:0 0 8px;font-size:12px;color:#9aa1a9;font-weight:500;letter-spacing:.06em}'
    + '.rmitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}'
    + '.rmitem:hover{background:#f4f6f8}'
    + '.rmitem b{font-weight:600;font-size:13.5px}'
    + '.rmitem span{margin-left:auto;font-family:ui-monospace,Consolas,monospace;color:#8b939b;font-size:12.5px}'
    + '.rmitem i{font-style:normal;width:7px;height:7px;border-radius:50%;background:#cfd6dd}'
    + '.rmitem i.on{background:#3ba06a}'
    + '#rmpill{position:fixed;left:16px;bottom:16px;z-index:9998;display:flex;align-items:center;gap:9px;'
    + 'padding:9px 14px;border-radius:999px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.14);cursor:pointer;'
    + 'font:13px/1 system-ui,"Microsoft YaHei",sans-serif;color:#333}'
    + '#rmpill[hidden]{display:none}'
    + '#rmpill i{width:8px;height:8px;border-radius:50%;background:#cfd6dd}'
    + '#rmpill[data-s="online"] i{background:#3ba06a}'
    + '#rmpill[data-s="connecting"] i{background:#e2a33c}'
    + '#rmpill b{font-weight:600}'
    + '#rmpill span{color:#8b939b;font-family:ui-monospace,Consolas,monospace}'
    + '#rmshout{position:fixed;left:16px;bottom:62px;z-index:9998;display:flex;align-items:center;gap:7px;'
    + 'padding:9px 15px;border-radius:999px;background:linear-gradient(135deg,#2f6d8f,#3e88ae);color:#fff;'
    + 'box-shadow:0 8px 22px rgba(47,109,143,.36);cursor:pointer;font:600 13px/1 system-ui,"Microsoft YaHei",sans-serif}'
    + '#rmshout[hidden]{display:none}'
    + '#rmshout:active{transform:scale(.97)}'
    + '#rmpanel{position:fixed;inset:0;z-index:10000;background:rgba(20,24,30,.5);backdrop-filter:blur(6px);'
    + 'display:flex;align-items:center;justify-content:center;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}'
    + '#rmpanel[hidden]{display:none}'
    + '.rmp-card{width:min(94vw,520px);background:#fff;border-radius:16px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}'
    + '.rmp-card h2{margin:0 0 6px;font-size:18px}'
    + '.rmp-card p{margin:0 0 14px;color:#7a8189;font-size:12.5px}'
    + '#rmtext{width:100%;box-sizing:border-box;min-height:104px;padding:13px 14px;font-size:17px;line-height:1.5;'
    + 'border:1.5px solid #d8dde3;border-radius:12px;outline:none;resize:vertical;font-family:inherit;transition:.16s}'
    + '#rmtext:focus{border-color:#2f6d8f;box-shadow:0 0 0 4px rgba(47,109,143,.12)}'
    + '.rmp-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}'
    + '.chip{padding:7px 12px;border-radius:999px;background:#f0f2f5;color:#4a5460;font-size:12.5px;cursor:pointer;'
    + 'border:1.5px solid transparent;transition:.14s;user-select:none}'
    + '.chip:hover{background:#e7ebf0}'
    + '.chip.on{border-color:#2f6d8f;color:#2f6d8f;background:#eef4f8}';

  function injectUI() {
    var st = document.createElement('style');
    st.textContent = STYLE;
    document.head.appendChild(st);

    var veil = document.createElement('div');
    veil.id = 'rmveil';
    veil.innerHTML = ''
      + '<div class="rmcard">'
      + '  <h2>连接教室</h2>'
      + '  <p>输入那台教室电脑的 8 位连接码（托盘菜单里能看到，点击即可复制）</p>'
      + '  <input id="rmcode" class="rminput" inputmode="numeric" maxlength="12" placeholder="00000000" autocomplete="off">'
      + '  <div class="rmrow">'
      + '    <button class="rmbtn" id="rmgo">连接</button>'
      + '    <button class="rmbtn ghost" id="rmclose">先不连</button>'
      + '  </div>'
      + '  <div class="rmmsg" id="rmmsg"></div>'
      + '  <div class="rmlist" id="rmlist" hidden><h3>我的教室</h3><div id="rmrooms"></div></div>'
      + '</div>';
    document.body.appendChild(veil);

    var pill = document.createElement('div');
    pill.id = 'rmpill';
    pill.hidden = true;
    pill.innerHTML = '<i></i><b>未连接</b><span></span>';
    document.body.appendChild(pill);

    var shoutBtn = document.createElement('div');
    shoutBtn.id = 'rmshout';
    shoutBtn.hidden = true;
    shoutBtn.title = '向这间教室喊话';
    shoutBtn.innerHTML = '<span style="font-size:15px">📢</span><b>喊话</b>';
    document.body.appendChild(shoutBtn);

    var panel = document.createElement('div');
    panel.id = 'rmpanel';
    panel.hidden = true;
    panel.innerHTML = ''
      + '<div class="rmp-card">'
      + '  <h2>教室喊话</h2>'
      + '  <p>内容会以大字横幅出现在那间教室的屏幕正中，到时间自动消失。</p>'
      + '  <textarea id="rmtext" maxlength="80" placeholder="例如：请安静，开始自习"></textarea>'
      + '  <div class="rmp-row" id="rmpresets"></div>'
      + '  <div class="rmp-row" id="rmdurs"></div>'
      + '  <div class="rmp-row"><span class="chip on" id="rmvoice" data-on="1">🔊 同时语音播报</span></div>'
      + '  <div class="rmrow">'
      + '    <button class="rmbtn" id="rmsend">发送喊话</button>'
      + '    <button class="rmbtn ghost" id="rmpclose">关闭</button>'
      + '  </div>'
      + '  <div class="rmmsg" id="rmpmsg"></div>'
      + '</div>';
    document.body.appendChild(panel);

    var PRESETS = ['请安静，开始自习', '上课了，请回座位', '请把作业交上来', '值日生留下打扫', '午休时间，请勿喧哗', '认真听讲，注意纪律'];
    $('#rmpresets').innerHTML = PRESETS.map(function (t) {
      return '<span class="chip" data-t="' + esc(t) + '">' + esc(t) + '</span>';
    }).join('');
    $('#rmdurs').innerHTML = [
      ['10 秒', 10000], ['30 秒', 30000], ['1 分钟', 60000], ['5 分钟', 300000]
    ].map(function (d, i) {
      return '<span class="chip' + (i === 1 ? ' on' : '') + '" data-ms="' + d[1] + '">' + d[0] + '</span>';
    }).join('');

    shoutBtn.addEventListener('click', function () {
      panel.hidden = false;
      setTimeout(function () { $('#rmtext').focus(); }, 80);
    });
    $('#rmpclose').addEventListener('click', function () { panel.hidden = true; });
    $('#rmpresets').addEventListener('click', function (e) {
      var c = e.target.closest('.chip');
      if (!c) return;
      $('#rmtext').value = c.getAttribute('data-t');
      $('#rmtext').focus();
    });
    $('#rmdurs').addEventListener('click', function (e) {
      var c = e.target.closest('.chip');
      if (!c) return;
      Array.prototype.forEach.call($('#rmdurs').children, function (x) { x.classList.remove('on'); });
      c.classList.add('on');
    });
    $('#rmsend').addEventListener('click', sendShout);
    $('#rmvoice').addEventListener('click', function (e) {
      var c = e.currentTarget;
      var on = c.getAttribute('data-on') === '1' ? '0' : '1';
      c.setAttribute('data-on', on);
      c.classList.toggle('on', on === '1');
      c.textContent = on === '1' ? '🔊 同时语音播报' : '🔇 只显示文字';
    });
    $('#rmtext').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendShout();
    });

    var input = $('#rmcode');
    input.addEventListener('input', function () {
      var v = input.value.replace(/[^0-9]/g, '').slice(0, 8);
      input.value = v;
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') go();
    });
    $('#rmgo').addEventListener('click', go);
    $('#rmclose').addEventListener('click', function () { veil.hidden = true; });
    pill.addEventListener('click', function () { veil.hidden = false; paint(); input.focus(); input.select(); });

    renderRooms();
    paint();
    setTimeout(function () { try { input.focus(); } catch (e) { /* ignore */ } }, 120);
  }

  function go() {
    var c = normCode($('#rmcode').value);
    if (!c) { msg('连接码是 8 位数字', true); return; }
    msg('正在连接 ' + c + ' …', false);
    $('#rmgo').disabled = true;
    connect(c);
    var started = Date.now();
    var wait = setInterval(function () {
      if (state === 'online') {
        clearInterval(wait);
        $('#rmgo').disabled = false;
        msg('已连接：' + (remoteInfo.className || c), false, true);
        setTimeout(function () {
          $('#rmveil').hidden = true;
          var ed = window.__dbBoot;
          if (typeof ed === 'function') ed();
        }, 600);
      } else if (Date.now() - started > 9000) {
        clearInterval(wait);
        $('#rmgo').disabled = false;
        msg('这台教室没有响应：确认那台电脑开着 DeskBoard、连接码正确', true);
      }
    }, 300);
  }

  function msg(t, isErr, ok) {
    var el = $('#rmmsg');
    if (!el) return;
    el.textContent = t || '';
    el.className = 'rmmsg' + (isErr ? ' err' : ok ? ' ok' : '');
  }

  function msgPan(t, isErr, ok) {
    var el = $('#rmpmsg');
    if (!el) return;
    el.textContent = t || '';
    el.className = 'rmmsg' + (isErr ? ' err' : ok ? ' ok' : '');
  }

  function sendShout() {
    var el = $('#rmtext');
    var text = (el && el.value ? el.value : '').trim();
    var durEl = $('#rmdurs .chip.on');
    var ms = durEl ? parseInt(durEl.getAttribute('data-ms'), 10) : 30000;
    if (!text) { msgPan('先写点内容再发送', true); return; }
    if (state !== 'online') { msgPan('还没连上教室', true); return; }

    var btn = $('#rmsend');
    var voiceEl = $('#rmvoice');
    var voice = voiceEl ? voiceEl.getAttribute('data-on') === '1' : true;
    btn.disabled = true;
    msgPan('发送中…', false);
    rpc('shout', { text: text, ms: ms, voice: voice }, 8000).then(function () {
      msgPan('已发送到 ' + (remoteInfo.className || code) + '，显示 ' + Math.round(ms / 1000) + ' 秒' + (voice ? '，同时语音播报' : ''), false, true);
      btn.disabled = false;
      setTimeout(function () {
        var p = $('#rmpanel');
        if (p) p.hidden = true;
        if (el) el.value = '';
        msgPan('', false);
      }, 900);
    }).catch(function (e) {
      msgPan((e && e.message) || '发送失败', true);
      btn.disabled = false;
    });
  }

  function renderRooms() {
    var list = $('#rmlist');
    var box = $('#rmrooms');
    if (!list || !box) return;
    if (!rooms.length) { list.hidden = true; return; }
    list.hidden = false;
    box.innerHTML = rooms
      .slice()
      .sort(function (a, b) { return (b.last || 0) - (a.last || 0); })
      .map(function (r) {
        return '<div class="rmitem" data-code="' + esc(r.code) + '">'
          + '<i class="' + (r.code === code && state === 'online' ? 'on' : '') + '"></i>'
          + '<b>' + esc(r.name || ('教室 ' + r.code)) + '</b>'
          + '<span>' + esc(r.code) + '</span></div>';
      })
      .join('');
    Array.prototype.forEach.call(box.querySelectorAll('.rmitem'), function (el) {
      el.addEventListener('click', function () {
        $('#rmcode').value = el.getAttribute('data-code');
        go();
      });
    });
  }

  function paint() {
    var pill = $('#rmpill');
    if (!pill) return;
    pill.hidden = state !== 'online';
    pill.setAttribute('data-s', state);
    var b = pill.querySelector('b');
    var s = pill.querySelector('span');
    if (b) b.textContent = state === 'online' ? (remoteInfo.className || '已连接') : '连接中…';
    if (s) s.textContent = state === 'online' ? code : '';
    var sb = $('#rmshout');
    if (sb) sb.hidden = state !== 'online';
    var v = $('#rmveil');
    if (v && state === 'online' && !v.hidden) renderRooms();
  }

  /* ---------------- 对外接口（编辑器复用） ---------------- */

  function on(list, cb) {
    if (!handlers[list]) handlers[list] = [];
    handlers[list].push(cb);
    return function () {
      var i = handlers[list].indexOf(cb);
      if (i >= 0) handlers[list].splice(i, 1);
    };
  }

  var bridge = {
    __remote: true,

    getConfig: function () {
      if (cfg) return Promise.resolve(clone(cfg));
      return rpc('get').then(function (d) {
        cfg = d && d.config;
        if (!cfg) throw new Error('教室没有返回配置');
        return clone(cfg);
      });
    },

    saveConfig: function (next) {
      return rpc('set', next, 12000).then(function (d) {
        cfg = (d && d.config) || next;
        emit('config', cfg);
        return { ok: true, config: clone(cfg) };
      });
    },

    resetConfig: function () {
      return rpc('reset', undefined, 12000).then(function (d) {
        cfg = (d && d.config) || cfg;
        emit('config', cfg);
        return { ok: true, config: clone(cfg) };
      });
    },

    info: function () {
      return Promise.resolve({
        version: remoteInfo.version || '',
        code: code,
        className: remoteInfo.className || '',
        configPath: '教室机本地',
        embedOk: true,
        embedMode: 'wallpaper',
        webUrl: '',
        remote: true
      });
    },

    scanIcons: function () { return rpc('scan', undefined, 15000); },
    refresh: function () { return rpc('scan', undefined, 15000); },
    arrangeIcons: function () { return rpc('arrange', undefined, 30000); },
    restoreIcons: function () { return rpc('restore', undefined, 30000); },
    setCode: function () { return Promise.resolve({ ok: false, err: '连接码只能在教室那台电脑上改' }); },
    // 自定义背景图/开机自启都要碰教室机本地文件，远程控制端不做
    wallpaper: function () { return Promise.resolve({ custom: '' }); },
    saveWallpaper: function () { return Promise.resolve({ ok: false, err: '上传图片请在教室那台电脑上操作' }); },
    clearWallpaper: function () { return Promise.resolve({ ok: false, err: '请在教室那台电脑上操作' }); },
    setAutoStart: function () { return Promise.resolve({ ok: false, err: '请在教室那台电脑上操作' }); },
    openFolder: function () { return Promise.resolve(false); },
    quit: function () { return Promise.resolve(false); },
    openEditor: function () {},
    closeEditor: function () { try { window.close(); } catch (e) { /* ignore */ } },

    onUpdate: function (cb) { return on('config', cb); },
    onIcons: function (cb) { return on('icons', cb); },
    onMode: function (cb) { return on('mode', cb); },
    onDebug: function (cb) { return on('debug', cb); },
    onInfo: function (cb) { return on('info', cb); },
    onStatus: function (cb) {
      on('status', cb);
      setTimeout(function () { cb({ state: state, detail: detail }); }, 0);
      return function () {};
    },
    reconnect: function () { if (code) connect(code); },
    get code() { return code; },
    get state() { return state; }
  };

  window.deskboard = bridge;

  /* ---------------- 实时预览（单文件版没有 /preview 接口） ---------------- */

  function setupPreview() {
    var f = document.querySelector('#pv');
    if (!f || f.dataset.dbLocal) return;
    f.dataset.dbLocal = '1';
    f.removeAttribute('src');
    if (window.__DB_PREVIEW_HTML) {
      f.srcdoc = window.__DB_PREVIEW_HTML;
      return;
    }
    // 没有内嵌看板模板时也不能去请求 /preview：
    // 嵌在学勤管家网页里时，/preview 会解析到平台的 /preview（班级积分宠物页面）
    // 注意：这里不能出现字面量 </body>（转义成 <\/body>），
    // 否则 make-control.js 往 HTML 注入脚本时会把这段字符串拦腰截断，整个控制台就坏了
    f.srcdoc = '<!doctype html><meta charset="utf-8">'
      + '<body style="margin:0;display:grid;place-items:center;height:100vh;background:#f6f7f8;'
      + 'color:#6b7280;font:14px/1.7 system-ui,\'Microsoft YaHei\',sans-serif;text-align:center">'
      + '实时预览不可用<br>请通过「教室控制端.html」或本机网页控制台打开<\/body>';
  }

  function watchPreview() {
    setupPreview();
    if (typeof MutationObserver === 'undefined') return;
    var mo = new MutationObserver(function () { setupPreview(); });
    mo.observe(document.body, { childList: true, subtree: true });
  }

  function boot() {
    loadRooms();
    injectUI();
    watchPreview();
    var last = '';
    try { last = localStorage.getItem(LS_LAST) || ''; } catch (e) { /* ignore */ }
    // 支持 教室控制端.html?code=43079865 直接连（可以做成快捷方式发给老师）
    try {
      var q = new URLSearchParams(location.search).get('code');
      if (normCode(q)) last = normCode(q);
    } catch (e) { /* ignore */ }
    if (normCode(last)) {
      var inp = $('#rmcode');
      if (inp) inp.value = last;
      connect(last);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
'use strict';

/* ==========================================================================
   DeskBoard · 值日类型（主进程与控制台共用）

   值日从「只有一组轮换」升级为「多种值日类型各自轮换」：
     班级值日 / 宿舍值日 / 清洁区值日 …… 类型可以随意新增、删除、改名。

    const arr = (schedule && schedule[d]) || [];
    const n = arr.filter((s) => s && s.start && s.end).length;
    if (n > cnt) { cnt = n; best = d; }
  }
  return best;

    if (arr.length > maxP) maxP = arr.length;
  }
  if (periodNames && periodNames.length > maxP) maxP = periodNames.length;

  const bell = [];

  const r = buildBellFromSchedule(xqgjData.schedule, xqgjData.periodNames);
  if (!r.bell.length) {
    // 作息取自「我的课程表」里每节课的时间设置；没设置过就取不到
    toast(xqgjData.scheduleConfigured === false
      ? '学勤管家里还没有设置每节课的时间，无法获取作息'
      : '没有取到作息数据');
    return;
  }
  cfg.bell = r.bell;
  cfg.dayTimes = r.dayTimes;
  cfg.bellSource = 'xqgj';
  markDirty(); render();
  toast('已从学勤管家获取分日作息时间');
}

function importDutyFromXqgj() {
  if (!xqgjData) { toast('正在读取学勤管家数据…'); return; }
  // 新接口：按「值日类别」导出，每个类别对应一个值日类型
  const cats = xqgjData.dutyCategories || [];
  // 旧接口：只有扁平的分组列表
  const list = xqgjData.dutyGroups || [];

  if (!cats.length && !list.length) {
    toast(xqgjData.dutyClass
      ? ('学勤管家「' + xqgjData.dutyClass + '」还没有设置值日分组')
      : '学勤管家还没有设置值日分组');
    return;
  }

  cfg.dutyTypes = cfg.dutyTypes || [];
  let n = 0;

  if (cats.length) {
    cats.forEach((c) => {
      const name = (c && c.name) || '';
      if (!name) return;
      const groups = (c.groups || []).map((g) => ({
        name: g.name || '', members: (g.members || []).slice()
      }));
      const exist = cfg.dutyTypes.find((t) => t.name === name);
      if (exist) {
        exist.groups = groups;
      } else {
        const t = newDutyType(name);
        t.groups = groups;
        cfg.dutyTypes.push(t);
      }
      n++;
    });
  } else {
    // 旧数据只有一组轮换 → 放进「班级值日」
    const groups = list.map((g) => ({ name: g.name || '', members: (g.members || []).slice() }));
    const exist = cfg.dutyTypes.find((t) => t.name === '班级值日');
    if (exist) exist.groups = groups;
    else cfg.dutyTypes.push({ id: 'class', name: '班级值日', startDate: '', groups });
    n = 1;
  }

  markDirty(); render();
  toast('已导入 ' + n + ' 个值日类型');
}

function importTimetableFromXqgj(cls) {
  if (!xqgjData) { toast('正在读取学勤管家数据…'); return; }
  const ct = (xqgjData.classTimetable) || {};
  if (!ct[cls]) { toast('学勤管家没有「' + cls + '」的课程表'); return; }
  // 课程表和作息在学勤管家是一体的，一并导入保证节次一致（作息按天带过来）
  const r = buildBellFromSchedule(xqgjData.schedule, xqgjData.periodNames);
  if (r.bell.length) {
    cfg.bell = r.bell;
    cfg.dayTimes = r.dayTimes;
    cfg.bellSource = 'xqgj';
  }
  cfg.timetable = buildTimetableFromClass(ct, cls);
  if (cls) cfg.className = cls;
  markDirty(); render();
  toast('已导入「' + cls + '」课程表与分日作息');
}

/* ==========================================================================
   课程表：节数 / 节次名称 / 格子编辑（格式对齐学勤管家「我的课程表」）
   ========================================================================== */

// 只看「上课节次」：大课间、午休这些休息段不占课表的行
function classBell() {
  return (cfg.bell || []).filter((b) => !b.brk);
}

// 某一天某一节的时间：分日设置（dayTimes）优先；某天有显式作息但该节没排 → 不显示时间；
// 仅当整天平都没设置才退回 bell 里的兜底时间（保证周五只显示到第六节）
function dayTimeOf(b, day) {
  const dt = cfg.dayTimes && cfg.dayTimes[String(day)];
  if (dt) {
    const t = dt[String(b.id)];
    if (t && t.start && t.end) return { start: t.start, end: t.end };
    return { start: '', end: '' };
  }
  return { start: b.start || '', end: b.end || '' };
}

function bellById(id) {
  return (cfg.bell || []).find((b) => Number(b.id) === Number(id)) || null;
}

function toMin(v) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '').trim());
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}

function minToHM(v) {
  return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
}

// 改节数：加就在末尾补（时间顺着上一节顺延，课间 10 分钟），减就从末尾删（连同学节表里的课一起清）
function setPeriodCount(n) {
  n = Math.max(1, Math.min(20, n | 0));
  const list = classBell();
  if (n === list.length) return;
  if (n > list.length) {
    for (let i = list.length; i < n; i++) {
      const prev = list[i - 1];
      let start = 8 * 60, dur = 45;
      if (prev) {
        const ps = toMin(prev.start), pe = toMin(prev.end);
        if (pe !== null) start = pe + 10;
        if (ps !== null && pe !== null && pe > ps) dur = pe - ps;
      }
      const maxId = (cfg.bell || []).reduce((m, b) => Math.max(m, Number(b.id) || 0), 0);
      const item = { id: maxId + 1, name: '第' + (i + 1) + '节', start: minToHM(start), end: minToHM(start + dur) };
      cfg.bell.push(item);
      list.push(item);
    }
  } else {
    const ids = new Set(list.slice(n).map((b) => Number(b.id)));
    cfg.bell = (cfg.bell || []).filter((b) => !ids.has(Number(b.id)));
    for (const day of Object.keys(cfg.timetable || {})) {
      const arr = (cfg.timetable[day] || []).filter((c) => !ids.has(Number(c.p)));
      if (arr.length) cfg.timetable[day] = arr;
      else delete cfg.timetable[day];
    }
  }
  cfg.bellSource = 'manual';
}

/* 控制台里的轻量弹窗：Esc 或点遮罩关闭 */
function dbModal(html, onMount) {
  const mask = document.createElement('div');
  mask.className = 'dbm-mask';
  mask.innerHTML = `<div class="dbm-card">${html}</div>`;
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', (e) => { if (e.target === mask) close(); });
  const onKey = (e) => {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey, true); }
  };
  document.addEventListener('keydown', onKey, true);
  if (onMount) onMount(mask, close);
  return mask;
}

// 编辑某一格：课程 + 可自定义的时间（教师/教室不再使用）
function openSlotModal(day, pid) {
  const b = bellById(pid);
  if (!b) return;
  const dayName = (DAYS.find((d) => d.k === String(day)) || {}).n || '';
  const arr = (cfg.timetable || {})[day] || [];
  const c = arr.find((x) => Number(x.p) === Number(pid)) || { s: '', ts: '', te: '' };
  const tm = dayTimeOf(b, day);                 // 这一节在「作息时间」里的默认时间
  const ts0 = c.ts || tm.start || '';           // 已有自定义时间就用自定义，否则用默认
  const te0 = c.te || tm.end || '';

  dbModal(`
    <h3>${esc(dayName)} · ${esc(b.name || '')}</h3>
    <label>时间（留空则使用「课时时间段」里这一节的默认时间）</label>
    <div class="dbm-time">
      <input type="time" id="dbmTS" value="${esc(ts0)}" aria-label="开始时间">
      <span class="dbm-dash">–</span>
      <input type="time" id="dbmTE" value="${esc(te0)}" aria-label="结束时间">
    </div>
    <label>课程</label>
    <input type="text" id="dbmS" value="${esc(c.s || '')}" placeholder="如：数学（留空表示没课）" maxlength="20">
    <div class="dbm-btns">
      <button class="btn ghost sm" data-x="del">删除这一课</button>
      <span class="ttg-grow"></span>
      <button class="btn ghost sm" data-x="cancel">取消</button>
      <button class="btn sm" data-x="save">保存</button>
    </div>`, (mask, close) => {
    const save = () => {
      const s = $('dbmS').value.trim();
      const ts = $('dbmTS').value.trim(), te = $('dbmTE').value.trim();
      // 自定义时间：两项都填且与默认不同才保存；否则视为「用默认时间」
      let tsSave = '', teSave = '';
      if (ts && te && !(ts === tm.start && te === tm.end)) { tsSave = ts; teSave = te; }
      cfg.timetable = cfg.timetable || {};
      const list = cfg.timetable[day] || (cfg.timetable[day] = []);
      let item = list.find((x) => Number(x.p) === Number(pid));
      if (!s && !tsSave && !teSave) {
        if (item) list.splice(list.indexOf(item), 1);
        if (!list.length) delete cfg.timetable[day];
      } else {
        if (!item) { item = { p: Number(pid), s: '', ts: '', te: '' }; list.push(item); list.sort((a, b2) => a.p - b2.p); }
        item.s = s; item.ts = tsSave; item.te = teSave;
        item.t = ''; item.r = '';   // 不再使用教师/教室，清掉旧数据
      }
      markDirty(); render(); close();
    };
    mask.querySelector('[data-x="save"]').addEventListener('click', save);
    mask.querySelector('[data-x="cancel"]').addEventListener('click', close);
    mask.querySelector('[data-x="del"]').addEventListener('click', () => {
      const list = (cfg.timetable || {})[day] || [];
      const idx = list.findIndex((x) => Number(x.p) === Number(pid));
      if (idx >= 0) list.splice(idx, 1);
      if (!list.length) delete cfg.timetable[day];
      markDirty(); render(); close();
    });
    ['dbmS', 'dbmTS', 'dbmTE'].forEach((id) => {
      $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
    });
    setTimeout(() => { try { $('dbmS').focus(); } catch (e) { /* ignore */ } }, 60);
  });
}

    </div>

      <span class="ttg-grow"></span>
      <button class="btn ghost sm" data-x="cancel">取消</button>

      markDirty(); render(); close();
      toast('节次名称已更新');
    });
  });
}

/* 读取内嵌「考试计时器」页面当前设置，发布到桌面看板 */
function readExamSettings() {
  return new Promise((resolve) => {
    const fr = $('examFrame');
    if (!fr || !fr.contentWindow) { resolve(null); return; }
    let done = false;
    const onMsg = (e) => {
      const d = e && e.data;
      if (!d || d.type !== 'ksjsq-settings') return;
      done = true;
      window.removeEventListener('message', onMsg);
      resolve(d.payload || null);
    };
    window.addEventListener('message', onMsg);
    try { fr.contentWindow.postMessage({ type: 'ksjsq-get-settings' }, '*'); } catch (e) { /* ignore */ }
    setTimeout(() => { if (!done) { window.removeEventListener('message', onMsg); resolve(null); } }, 2500);
  });
}

async function publishExam() {
  const got = await readExamSettings();
  if (!got || (!got.subject && !got.start)) {
    toast('还没读到考试设置，请先在下面的计时器里点「设置」并确定');
    return;
  }
  cfg.exam = {
    enabled: true,
    school: got.school || '',
    subject: got.subject || '',
    start: got.start || '',
    end: got.end || '',
    publishedAt: Date.now()
  };
  markDirty(); render();
  try { await save(); } catch (e) { /* ignore */ }
  toast('已发布，教室电脑会弹出考试计时器');
}

async function stopExam() {
  cfg.exam = Object.assign({}, cfg.exam || {}, { enabled: false });
  markDirty(); render();
  try { await save(); } catch (e) { /* ignore */ }
  toast('已结束考试，电脑上的计时器已关闭');
}

function onXqgjMessage(e) {
  const d = e && e.data;
  if (!d || d.type !== 'db-xqgj-data') return;
  xqgjData = (d.payload) || {};
  // 作息时间默认取自「学勤管家」的课程表时间设定（按天分日）：
  // 只要用户没有手工改过作息（bellSource !== 'manual'），就以其为准。
  if (inXqgj && xqgjData.schedule && cfg.bellSource !== 'manual') {
    const r = buildBellFromSchedule(xqgjData.schedule, xqgjData.periodNames);
    if (r && r.bell.length) {
      cfg.bell = r.bell;
      cfg.dayTimes = r.dayTimes;
      cfg.bellSource = 'xqgj';
      markDirty();
      toast('已从学勤管家获取作息时间');
    }
  }
  if (tab === 'bell' || tab === 'timetable' || tab === 'duty') render();
}
