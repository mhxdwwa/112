function importStudentsFromExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  readExcelFile(file, function(data) {
    if (!data || data.length < 2) { showToast('文件内容为空', 'error'); return; }
    
    // 查找表头行
    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(data.length, 10); i++) {
      const row = data[i].map(c => String(c).trim());
      if (row.some(c => c.includes('班级') || c.includes('姓名'))) { headerRowIdx = i; break; }
    }
    if (headerRowIdx === -1) { showToast('未找到"班级"或"姓名"列', 'error'); return; }
    
    const header = data[headerRowIdx].map(c => String(c).trim());
    let classCol = -1, nameCol = -1, parentCol = -1, phoneCol = -1;
    
    header.forEach((c, i) => {
      if (c.includes('班级') || c === '班') classCol = i;
      else if (c.includes('电话') || c.includes('手机') || c.includes('联系')) phoneCol = i;
      else if (c.includes('家长')) parentCol = i;
      else if (c.includes('姓名') || c.includes('名字')) nameCol = i;
    });
    
    console.log('[XQ Import] Header:', header);
    console.log('[XQ Import] Column mapping: class=', classCol, 'name=', nameCol, 'parent=', parentCol, 'phone=', phoneCol);
    
    if (classCol === -1 || nameCol === -1) {
      showToast('未找到"班级"或"学生姓名"列', 'error');
      return;
    }
    
    // 解析数据
    let importCount = 0;
    let skipCount = 0;
    let classStats = {};
    
    for (let i = headerRowIdx + 1; i < data.length; i++) {
      const row = data[i];
      const cls = String(row[classCol] || '').trim();
      const name = String(row[nameCol] || '').trim();
      const parent = parentCol >= 0 ? String(row[parentCol] || '').trim() : '';
      const phone = phoneCol >= 0 ? String(row[phoneCol] || '').trim() : '';
      
      if (!cls || !name) continue;
      
      // 确保班级存在
      if (!STUDENTS[cls]) {
        STUDENTS[cls] = [];
        if (!CLASS_LIST.includes(cls)) CLASS_LIST.push(cls);
      }
      
      // 检查是否已存在同名学生
      const exists = STUDENTS[cls].find(s => s.name === name);
      if (exists) {
        skipCount++;
        continue;
      }
      
      // 添加学生
      const maxId = Math.max(...Object.values(STUDENTS).flat().map(s => s.id), 0);
      const seat = STUDENTS[cls].length + 1;
      
      STUDENTS[cls].push({
        id: maxId + 1,
        seat: seat,
        name: name,
        phone: phone,
        parent: parent,
        status: 'present',
        leaveReason: '',
        leaveNote: '',
        leaveDays: 0,
        mark: '',
        boarding: 'inner',
        familyType: '',
        familyNote: '',
        leftBehind: false,
        leftBehindNote: '',
      });
      
      importCount++;
      classStats[cls] = (classStats[cls] || 0) + 1;
    }
    
    if (importCount === 0) {
      showToast(skipCount > 0 ? `所有学生已存在，跳过 ${skipCount} 人` : '未解析到有效数据', 'warning');
      return;
    }
    
    // 保存到本地存储
    saveStudentsToStorage();
    
    // 显示统计
    let statsHtml = Object.entries(classStats).map(([cls, count]) => 
      `<div style="display:inline-block;padding:4px 10px;background:var(--gray-50);border-radius:4px;margin:2px;font-size:12px">
        <strong>${cls}</strong>: ${count}人
      </div>`
    ).join('');
    
    let msg = `成功导入 <strong style="color:var(--accent)">${importCount}</strong> 名学生`;
    if (skipCount > 0) msg += `，跳过 ${skipCount} 人（已存在）`;
    
    showToast(msg, 'success');
    
    // 刷新页面
    navigate('admin-students');
  });
  
  event.target.value = '';
}

function clearClassStudents(cls) {
  const count = (STUDENTS[cls] || []).length;
  
  if (!confirm(`确定要彻底删除班级 ${cls} 吗？\n\n该班级共有 ${count} 名学生，删除后班级号也将不存在，此操作不可恢复！`)) {
    return;
  }
  
  // 1. 删除学生数据
  delete STUDENTS[cls];
  
  // 2. 从 CLASS_LIST 中移除
  const idx = CLASS_LIST.indexOf(cls);
  if (idx >= 0) CLASS_LIST.splice(idx, 1);
  
  // 3. 从 setupClasses 中移除
  setupClasses = setupClasses.filter(c => c.name !== cls);
  
  // 4. 从年级映射中移除
  delete classGradeMap[cls];
  
  // 5. 记录已删除的班级（等待同步到云端）
  if (!deletedClasses.includes(cls)) {
    deletedClasses.push(cls);
  }
  
  // 6. 仅保存到本地（不自动同步云端）
  saveStudentsToStorage();
  saveClassGradeMap();
  
  showToast(`已删除班级 ${cls}（含 ${count} 名学生），请点击"保存到云端"使更改生效`, 'success');
  
  // 刷新页面
  navigate('admin-students');
}

  STUDENTS[cls] = STUDENTS[cls].filter(st => st.id !== id);
  
  // 重新编号座号
  STUDENTS[cls].forEach((st, idx) => {
    st.seat = idx + 1;
  });
  
  saveStudentsToStorage();
  showToast(`已删除学生 ${s.name}`, 'success');
  navigate('admin-class-students');

function exportAdminRoster(cls) {
  const sts = STUDENTS[cls] || [];
  if (sts.length === 0) { showToast('暂无学生数据', 'warning'); return; }
  
  let csv = '座号,姓名,家长,电话\n';
  sts.forEach(s => {
    csv += `${s.seat},"${s.name}","${s.parent || ''}","${s.phone || ''}"\n`;
  });
  
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cls}_学生名单.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderPasswordMgmt() {
  // 获取所有教师（包括领导、班主任、科任老师）
  const allTeachers = [];
  
  // 从 setupRoles 获取领导
  if (setupRoles && setupRoles.length > 0) {
    setupRoles.forEach(r => {
      allTeachers.push({ name: r.name, role: r.role || 'leader', title: r.title || '校领导' });

  }
  
  // 从 setupTeaching 获取老师（从 subjects 中提取教师名字）
  if (setupTeaching && setupTeaching.length > 0) {
    setupTeaching.forEach(t => {
      // 添加班主任

        allTeachers.push({ name: t.headteacher, role: 'headteacher', title: t.className + '班主任' });
      }
      // 从 subjects 中提取科任老师

        });

  // 从 setupClasses 获取班主任

    setupClasses.forEach(cls => {
      if (cls.headteacher && !allTeachers.find(x => x.name === cls.headteacher)) {
        allTeachers.push({ name: cls.headteacher, role: 'headteacher', title: '班主任' });

    if (label) {
      if (select) {
        label.style.borderColor = 'var(--primary)';

async function resetSelectedPasswords() {
  const selected = [];
  document.querySelectorAll('.teacher-reset-checkbox:checked').forEach(cb => {
    selected.push(cb.dataset.name);
  });
  
  if (selected.length === 0) {
    showToast('请先勾选要重置密码的教师', 'warning');
    return;
  }
  
  if (!confirm(`确定要重置以下 ${selected.length} 位教师的密码吗？\n\n${selected.join('、')}\n\n密码将被重置为：123456\n重置后教师下次登录时需修改新密码`)) {
    return;
  }
  
  const defaultPassword = '123456';
  let successCount = 0;
  let failCount = 0;
  
  for (const name of selected) {
    try {
      await setUserPassword(name, defaultPassword, null, [], null);
      // 标记该教师下次登录时必须修改密码
      if (xqCredentials[name]) {
        xqCredentials[name].mustChangePassword = true;
      }
      successCount++;
      console.log('[XQ] Password reset for:', name);
    } catch (e) {
      failCount++;
      console.warn('[XQ] Failed to reset password for:', name, e);
    }
  }
  
  // 保存 mustChangePassword 标记到云端
  if (successCount > 0) {
    try {
      await xqSaveCredentials();
    } catch (e) {
      console.warn('[XQ] Failed to sync mustChangePassword flag:', e);
    }
  }
  
  // 同步到云端
  if (xqCurrentUser && isXqAdmin()) {
    try {
      await xqSaveCredentials();
      console.log('[XQ] Credentials synced to cloud');
    } catch (e) {
      console.warn('[XQ] Failed to sync credentials:', e);
    }
  }
  
  let msg = `已重置 ${successCount} 位教师的密码`;
  if (failCount > 0) msg += `，${failCount} 位失败`;
  
  showToast(msg, failCount > 0 ? 'warning' : 'success');
  
  if (successCount > 0) {
    // 刷新页面
    setTimeout(() => navigate('password-mgmt'), 1000);
  }
}

// Helper: Render cadre info for seating chart podium
function renderCadreInfo(cls, side) {
  if (!CLASS_CADRES[cls] || Object.keys(CLASS_CADRES[cls]).length === 0) return '';
  
  const cadres = Object.entries(CLASS_CADRES[cls]);
  if (cadres.length === 0) return '';
  
  // Split cadres between left and right sides
  const halfLen = Math.ceil(cadres.length / 2);
  const displayCadres = side === 'left' ? cadres.slice(0, halfLen) : cadres.slice(halfLen);
  
  if (displayCadres.length === 0) return '';
  
  return displayCadres.map(([pos, name]) => 
    `<div style="margin:2px 0"><span style="font-weight:500">${pos}：</span>${name}</div>`
  ).join('');
}

/* ----- REUSABLE: Seating Chart for Any Class ----- */
function renderClassSeatingPage() {
  const cls = currentViewClass || getHeadteacherClass();
  if (!cls || !STUDENTS[cls]) return emptyStateHtml('暂无班级数据');
  
  // 加载该班级的座位配置
  loadSeatConfig(cls);
  
  const sts = STUDENTS[cls];
  const cols = seatingCols;
  const totalRows = seatingRows > 0 ? seatingRows : Math.ceil(sts.length / cols);
  const canEdit = canEditClass(cls);

  // 构建扁平座位数组：null=空位，对象=学生
  const totalSlots = totalRows * cols;
  const studentCount = sts.length;
  const emptyCount = Math.max(0, totalSlots - studentCount);
  
  // 初始化或获取该班级的座位布局
  if (!seatLayout[cls] || seatLayout[cls].length !== totalSlots) {
    // 首次渲染：空位在前（后排），学生在后（前排靠近讲台）
    seatLayout[cls] = [];
    for (let i = 0; i < emptyCount; i++) seatLayout[cls].push(null);
    for (let i = 0; i < studentCount; i++) seatLayout[cls].push(sts[i].id);
  }
  
  // 根据布局构建座位数组
  let seatSlots = [];
  for (let i = 0; i < totalSlots; i++) {
    const studentId = seatLayout[cls][i];
    if (studentId === null) {
      seatSlots.push(null);
    } else {
      const student = sts.find(s => s.id === studentId);
      seatSlots.push(student || null);
    }
  }

  // 渲染每个格子
  let seats = '';
  for (let i = 0; i < totalSlots; i++) {
    const s = seatSlots[i];
    if (s) {
      const statusCls = s.status === 'present' ? 'present' : s.status === 'leave' ? 'leave' : s.status === 'absent' ? 'absent' : 'present';
      const editCls = seatingEditMode && canEdit ? 'editing' : '';
      const outerCls = s.boarding === 'outer' ? 'outer-boarder' : '';
      const markBadge = s.mark ? `<span class="seat-mark-badge" title="标记: ${s.mark}">!</span>` : '';
      const boardingBadge = s.boarding === 'outer' ? `<span class="seat-boarding-badge" title="外宿">🏠</span>` : '';
      const titleText = `${s.name} - ${STATUS[s.status]}${s.mark ? ' [标记:'+s.mark+']' : ''}${s.boarding === 'outer' ? ' [外宿]' : ' [内宿]'}`;
      seats += `<div class="seat ${statusCls} ${editCls} ${outerCls}" data-slot="${i}" data-sid="${s.id}" data-slot-idx="${i}"
        ${seatingEditMode && canEdit ? `draggable="true" ondragstart="onSeatDragStart(event,${i})" ondragover="onSeatDragOver(event)" ondrop="onSeatDrop(event,${i})" ondragend="onSeatDragEnd(event)" ontouchstart="onSeatTouchStart(event,${i})" ontouchmove="onSeatTouchMove(event)" ontouchend="onSeatTouchEnd(event)"` :
        `onclick="showStudentDetail('${cls}',${s.id})"`}
        title="${titleText}">
        ${markBadge}${boardingBadge}
        <span class="seat-name">${s.name}</span>
      </div>`;
    } else {
      seats += `<div class="seat empty" data-slot="${i}" data-slot-idx="${i}"
        ${seatingEditMode && canEdit ? `ondragover="onSeatDragOver(event)" ondrop="onSeatDrop(event,${i})" ontouchstart="onSeatTouchStart(event,${i})" ontouchmove="onSeatTouchMove(event)" ontouchend="onSeatTouchEnd(event)"` : ''}>
        <span class="seat-name">空</span></div>`;
    }
  }

  // Stats
  const total = sts.length;
  const present = sts.filter(s => s.status === 'present').length;
  const leave = sts.filter(s => s.status === 'leave').length;
  const absent = sts.filter(s => s.status === 'absent').length;
  const late = sts.filter(s => s.status === 'late').length;
  const rate = ((present / total) * 100).toFixed(1);

  // 编辑按钮
  let editBtns = '';
  if (canEdit) {
    if (seatingEditMode) {
      editBtns = `<button class="toolbar-btn primary" style="font-size:12px" onclick="saveSeating()">保存</button>
        <button class="toolbar-btn ghost" style="font-size:12px" onclick="cancelSeatingEdit()">取消</button>`;
    } else {
      editBtns = `<button class="toolbar-btn ghost" style="font-size:12px" onclick="enterSeatingEdit()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        编辑座位</button>`;
    }
  }

  const editBar = seatingEditMode && canEdit ? `
    <div class="seat-edit-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      编辑模式：拖拽学生交换/移入空位。拖动列间竖条调整间距。
    </div>
  ` : '';

  // 计算列分组边界：哪些列索引之间是组边界
  const groupBoundaries = new Set();
  if (colGroups.length > 0) {
    let cumCol = 0;
    for (const groupSize of colGroups) {
      cumCol += groupSize;
      if (cumCol < cols) groupBoundaries.add(cumCol - 1); // gap index = cumCol - 1
    }
  }

  // 确保 colGaps 数组大小正确
  while (colGaps.length < cols - 1) colGaps.push(10);
  if (colGaps.length > cols - 1) colGaps.length = cols - 1;

  // 使用 flex 布局，行间用 rowGap，列间用可变间距 div（支持拖动调整）
  let flexRows = '';
  flexRows += `<div id="seatingGrid" style="display:flex;flex-direction:column;gap:${rowGap}px;flex:1;min-height:0;width:100%">`;

  for (let row = 0; row < totalRows; row++) {
    flexRows += `<div style="display:flex;align-items:stretch;flex:1;min-height:0">`;
    for (let col = 0; col < cols; col++) {
      const i = row * cols + col;
      const s = seatSlots[i];

      // 座位
      if (s) {
        const statusCls = s.status === 'present' ? 'present' : s.status === 'leave' ? 'leave' : s.status === 'absent' ? 'absent' : 'present';
        const editCls = seatingEditMode && canEdit ? 'editing' : '';
        const outerCls = s.boarding === 'outer' ? 'outer-boarder' : '';
        const markBadge = s.mark ? `<span class="seat-mark-badge" title="标记: ${s.mark}">!</span>` : '';
        const boardingBadge = s.boarding === 'outer' ? `<span class="seat-boarding-badge" title="外宿">🏠</span>` : '';
        const titleText = `${s.name} - ${STATUS[s.status]}`;
        flexRows += `<div class="seat ${statusCls} ${editCls} ${outerCls}" data-slot="${i}" data-sid="${s.id}" data-slot-idx="${i}" style="flex:1;min-width:0"
          ${seatingEditMode && canEdit ? `draggable="true" ondragstart="onSeatDragStart(event,${i})" ondragover="onSeatDragOver(event)" ondrop="onSeatDrop(event,${i})" ondragend="onSeatDragEnd(event)" ontouchstart="onSeatTouchStart(event,${i})" ontouchmove="onSeatTouchMove(event)" ontouchend="onSeatTouchEnd(event)"` :
          `onclick="showStudentDetail('${cls}',${s.id})"`}
          title="${titleText}">
          ${markBadge}${boardingBadge}
          <span class="seat-name">${s.name}</span>
        </div>`;
      } else {
        flexRows += `<div class="seat empty" data-slot="${i}" data-slot-idx="${i}" style="flex:1;min-width:0"
          ${seatingEditMode && canEdit ? `ondragover="onSeatDragOver(event)" ondrop="onSeatDrop(event,${i})" ontouchstart="onSeatTouchStart(event,${i})" ontouchmove="onSeatTouchMove(event)" ontouchend="onSeatTouchEnd(event)"` : ''}>
          <span class="seat-name">空</span></div>`;
      }

      // 列间间距（非最后一列时插入）
      if (col < cols - 1) {
        const gapIdx = col;
        const isGroupBoundary = groupBoundaries.has(gapIdx);
        const baseGap = colGaps[gapIdx] || 10;
        const gapW = isGroupBoundary ? Math.max(baseGap, 20) : baseGap;
        if (seatingEditMode && canEdit) {
          flexRows += `<div class="col-gap-handle" data-gap-idx="${gapIdx}" style="width:${gapW}px" onmousedown="startColResize(event,${gapIdx})"><div class="col-resizer-line"></div></div>`;
        } else {
          flexRows += `<div style="width:${gapW}px;flex-shrink:0"></div>`;
        }
      }
    }
    flexRows += `</div>`;
  }
  flexRows += `</div>`;

  return `
    <div class="card" style="overflow:hidden;display:flex;flex-direction:column">
      <div style="display:flex;gap:16px;padding:16px 20px;flex:1;min-height:0;overflow:hidden">
        <!-- 左侧：统计信息 -->
        <div style="display:flex;flex-direction:column;gap:8px;min-width:90px;padding-top:8px;flex-shrink:0">
          <div style="font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:4px">${cls}</div>
          <div style="text-align:center;padding:6px 10px;background:var(--gray-50);border-radius:6px">
            <div style="font-size:10px;color:var(--gray-500)">总人数</div>
            <div style="font-size:18px;font-weight:700;color:var(--gray-800)">${total}</div>
          </div>
          <div style="text-align:center;padding:6px 10px;background:#E8F5E9;border-radius:6px">
            <div style="font-size:10px;color:#2E7D32">在校</div>
            <div style="font-size:18px;font-weight:700;color:#2E7D32">${present}</div>
            <div style="font-size:11px;color:#2E7D32">${rate}%</div>
          </div>
          <div style="text-align:center;padding:6px 10px;background:#FFF3E0;border-radius:6px">
            <div style="font-size:10px;color:#E65100">请假</div>
            <div style="font-size:18px;font-weight:700;color:#E65100">${leave}</div>
          </div>
          <div style="text-align:center;padding:6px 10px;background:#FFEBEE;border-radius:6px">
            <div style="font-size:10px;color:#C62828">缺勤</div>
            <div style="font-size:18px;font-weight:700;color:#C62828">${absent}</div>
          </div>
          <div style="text-align:center;padding:6px 10px;background:var(--primary-bg);border-radius:6px">
            <div style="font-size:10px;color:#1E40AF">迟到</div>
            <div style="font-size:18px;font-weight:700;color:#1E40AF">${late}</div>
          </div>
        </div>
        <!-- 中间：座位表 -->
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden">
          ${editBar}
          <div id="seatingFlexWrapper" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden">${flexRows}</div>
          <div style="margin-top:12px;flex-shrink:0;display:flex;align-items:center;gap:16px">
            <div style="flex:1;text-align:right;font-size:13px;color:var(--gray-600)">
              ${renderCadreInfo(cls, 'left')}
            </div>
            <div class="seating-podium" style="flex-shrink:0">讲 台</div>
            <div style="flex:1;text-align:left;font-size:13px;color:var(--gray-600)">
              ${renderCadreInfo(cls, 'right')}
            </div>
          </div>
          <div class="seat-legend" style="margin-top:8px;flex-shrink:0">
            <div class="seat-legend-item"><div class="seat-legend-dot" style="background:linear-gradient(135deg,#8BC34A,#7CB342);border:1px solid rgba(139,195,74,0.4)"></div>在校</div>
            <div class="seat-legend-item"><div class="seat-legend-dot" style="background:linear-gradient(135deg,#FFB74D,#FFA726);border:1px solid rgba(255,152,0,0.3)"></div>请假</div>
            <div class="seat-legend-item"><div class="seat-legend-dot" style="background:linear-gradient(135deg,#EF5350,#E53935);border:1px solid rgba(220,38,38,0.3)"></div>缺勤</div>
            <div class="seat-legend-item"><div class="seat-legend-dot" style="background:var(--gray-100);border:1px solid var(--gray-200)"></div>空位</div>
            <div class="seat-legend-item"><div style="width:14px;height:14px;border-radius:50%;background:var(--danger);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center">!</div>特殊</div>
            <div class="seat-legend-item"><span style="font-size:11px">🏠</span>外宿</div>
          </div>
        </div>
        <!-- 右侧：控制按钮 -->
        <div style="display:flex;flex-direction:column;gap:8px;min-width:110px;padding-top:8px;align-items:flex-end">
          ${canEdit ? `
            <label style="font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:4px">列
              <input type="number" value="${seatingCols}" min="2" max="12" style="width:42px;padding:3px 6px;border-radius:5px;border:1px solid var(--gray-200);text-align:center;font-size:12px" onchange="changeSeatCols(this.value)">
            </label>
            <label style="font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:4px">行
              <input type="number" value="${totalRows}" min="1" max="20" style="width:42px;padding:3px 6px;border-radius:5px;border:1px solid var(--gray-200);text-align:center;font-size:12px" onchange="changeSeatRows(this.value)">
            </label>
            <div style="font-size:11px;color:var(--gray-500);display:flex;align-items:center;gap:4px;width:100%" title="列分组：每N列为一组，组间大间距。设为1则每列独立。">
              <span>分组</span>
              <input type="number" value="${colGroups.length > 0 ? colGroups[0] : 1}" min="1" max="${seatingCols}" style="width:42px;padding:3px 6px;border-radius:5px;border:1px solid var(--gray-200);text-align:center;font-size:12px" onchange="changeColGrouping(this.value)" title="每N列为一组">
            </div>
            <button class="toolbar-btn ghost" style="font-size:12px;padding:4px 10px" onclick="showAutoArrangeModal()">自动排列</button>
          ` : ''}
          ${editBtns}
          <button class="toolbar-btn ghost" style="font-size:12px" onclick="printSeating()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            导出Word</button>
          <button class="toolbar-btn ghost" style="font-size:12px" onclick="navigate((xqCurrentUser && xqCurrentUser.isLeader) ? 'all-classes' : 'teach-classes')">← 返回</button>
        </div>
      </div>
    </div>`;
}

/* ----- LEADER: Leave View (read-only) / HEADTEACHER: Leave Management (editable) ----- */
function renderLeaveMgmt() {
  const user = xqCurrentUser || {};
  let classes;
  if (user.isLeader) {
    classes = CLASS_LIST;
  } else {
    // 班主任和科任老师：显示所有相关班级
    classes = user.allClasses || [];
  }
  let leaveStudents = [];
  classes.forEach(cls => {
    if (!STUDENTS[cls]) return;
    STUDENTS[cls].forEach(s => {
      if (s.status === 'leave') leaveStudents.push({ ...s, class: cls });
    });
  });
  const isLeader = user.isLeader;
  const canEdit = user.isHeadteacher || isXqAdmin();
  let rows = leaveStudents.map(s => `<tr>
    <td>${s.class}</td>
    <td style="font-weight:500">${s.name}</td>
    <td><span class="badge orange">${s.leaveReason}</span></td>
    <td style="white-space:normal;max-width:200px;font-size:12.5px;color:var(--gray-600)">${s.leaveNote || '-'}</td>
    <td>${s.leaveDays}天</td>
    <td>${s.parent}</td>
    ${canEdit ? `<td style="white-space:nowrap">
      <button class="toolbar-btn ghost" style="padding:4px 10px;font-size:12px" onclick="editLeaveReason('${s.class}',${s.id})">请假原因</button>
      <button class="toolbar-btn ghost" style="padding:4px 10px;font-size:12px;color:var(--warning)" onclick="cancelLeaveInMgmt('${s.class}',${s.id})">销假</button>
      <button class="toolbar-btn primary" style="padding:4px 10px;font-size:12px" onclick="approveLeave('${s.class}',${s.id})">审批</button>
      <button class="toolbar-btn ghost" style="padding:4px 10px;font-size:12px;color:var(--danger)" onclick="rejectLeave('${s.class}',${s.id})">驳回</button>
    </td>` : ''}
  </tr>`).join('');

  const statLabel = isLeader ? '请假中' : '待审批';
  const tableCols = canEdit ? 7 : 6;

  return `
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card orange anim-in anim-d1">
        <div class="stat-label">${statLabel}</div>
        <div class="stat-value">${leaveStudents.length}</div>
      </div>
      <div class="stat-card blue anim-in anim-d2">
        <div class="stat-label">今日请假人次</div>
        <div class="stat-value">${leaveStudents.length}</div>
      </div>
      <div class="stat-card green anim-in anim-d3">
        <div class="stat-label">病假占比</div>
        <div class="stat-value">${leaveStudents.length ? Math.round(leaveStudents.filter(s=>s.leaveReason==='病假').length/leaveStudents.length*100) : 0}%</div>
      </div>
    </div>
    <div class="card anim-in anim-d2">
      <div class="card-header">
        <span class="card-title">请假记录</span>
        ${isLeader ? '<span style="font-size:12px;color:var(--gray-400)">全校查看（只读）</span>' : ''}
      </div>
      <div class="card-body no-pad"><div class="table-wrap">
        <table><thead><tr><th>班级</th><th>姓名</th><th>类型</th><th>请假原因</th><th>天数</th><th>家长</th>${canEdit ? '<th>操作</th>' : ''}</tr></thead>
        <tbody>${rows || `<tr><td colspan="${tableCols}" style="text-align:center;color:var(--gray-400);padding:40px">暂无请假记录</td></tr>`}</tbody></table>
      </div></div>
    </div>`;
}

function editLeaveReason(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  showModal('编辑请假原因', `
    <div class="form-group">
      <label class="form-label">学生</label>
      <input class="form-input" value="${s.name}" disabled style="background:var(--gray-50)">
    </div>
    <div class="form-group">
      <label class="form-label">请假类型</label>
      <select class="form-select" id="editReasonType">
        <option value="病假" ${s.leaveReason==='病假'?'selected':''}>病假</option>
        <option value="事假" ${s.leaveReason==='事假'?'selected':''}>事假</option>
        <option value="就医" ${s.leaveReason==='就医'?'selected':''}>就医</option>
        <option value="其他" ${s.leaveReason==='其他'?'selected':''}>其他</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="form-label">请假天数</label>
        <input class="form-input" id="editReasonDays" type="number" value="${s.leaveDays}" min="0.5" step="0.5">
      </div>
      <div class="form-group">
        <label class="form-label">开始日期</label>
        <input class="form-input" id="editReasonDate" type="date" value="${new Date().toISOString().split('T')[0]}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">详细说明</label>
      <textarea class="form-textarea" id="editReasonDetail" placeholder="请输入请假具体原因...">${s.leaveNote || ''}</textarea>
    </div>
  `, `<button class="toolbar-btn ghost" onclick="hideModal()">取消</button>
      <button class="toolbar-btn primary" onclick="saveLeaveReason('${cls}',${id})">保存</button>`);
}

function saveLeaveReason(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  s.leaveReason = document.getElementById('editReasonType').value;
  s.leaveNote = document.getElementById('editReasonDetail').value.trim();
  s.leaveDays = parseFloat(document.getElementById('editReasonDays').value) || s.leaveDays;
  saveStudentsToStorage();
  hideModal();
  showToast('请假原因已更新');
  navigate('leave-mgmt');
}

function cancelLeaveInMgmt(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  showModal('确认销假', `<p style="font-size:14px">确认 <strong>${s.name}</strong> 已返校销假？</p>`,
    `<button class="toolbar-btn ghost" onclick="hideModal()">取消</button>
     <button class="toolbar-btn primary" onclick="confirmCancelLeaveInMgmt('${cls}',${id})">确认销假</button>`);
}

function confirmCancelLeaveInMgmt(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (s) {
    s.status = 'present';
    s.leaveReason = '';
    s.leaveDays = 0;
    saveStudentsToStorage();
  }
  hideModal();
  showToast(`${s.name} 已销假`);
  navigate('leave-mgmt');
}

function approveLeave(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  showModal('审批通过', `<p style="color:var(--accent);font-size:14px">已批准 <strong>${s.name}</strong> 的请假申请。</p>`, `<button class="toolbar-btn primary" onclick="hideModal()">确定</button>`);
}

function rejectLeave(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  showModal('已驳回', `<p style="color:var(--danger);font-size:14px">已驳回 <strong>${s.name}</strong> 的请假申请，该生状态将恢复为在校。</p>`,
    `<button class="toolbar-btn ghost" onclick="hideModal()">取消</button>
     <button class="toolbar-btn primary" style="background:var(--danger)" onclick="confirmRejectLeave('${cls}',${id})">确认驳回</button>`);
}

function confirmRejectLeave(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (s) {
    s.status = 'present';
    s.leaveReason = '';
    s.leaveDays = 0;
    saveStudentsToStorage();
  }
  hideModal();
  showToast('已驳回请假申请');
  navigate('leave-mgmt');
}

/* ----- LEADER: Attendance Statistics (Comprehensive) ----- */
function renderAttendanceStats() {
  // Calculate overall stats
  let total = 0, present = 0, leave = 0, absent = 0, late = 0;
  let leaveByReason = { '病假': 0, '事假': 0, '就医': 0, '其他': 0 };
  
  CLASS_LIST.forEach(cls => STUDENTS[cls].forEach(s => {
    total++;
    if (s.status === 'present') present++;
    else if (s.status === 'leave') {
      leave++;
      if (leaveByReason.hasOwnProperty(s.leaveReason)) {
        leaveByReason[s.leaveReason]++;
      }
    }
    else if (s.status === 'absent') absent++;
    else if (s.status === 'late') late++;
  }));
  
  const attendanceRate = ((present / total) * 100).toFixed(1);
  
  // Grade-level stats
  let gradeRows = '';
  SCHOOL.grades.forEach(g => {
    let gt = 0, gp = 0, gl = 0, ga = 0;
    CLASS_LIST.filter(c => c.startsWith(g)).forEach(cls => STUDENTS[cls].forEach(s => {
      gt++;
      if (s.status === 'present') gp++;
      else if (s.status === 'leave') gl++;
      else if (s.status === 'absent') ga++;
    }));
    const gr = ((gp/gt)*100).toFixed(1);
    gradeRows += `<tr>
      <td style="font-weight:500">${g}</td>
      <td>${gt}</td>
      <td style="color:var(--accent);font-weight:600">${gp}</td>
      <td style="color:var(--warning)">${gl}</td>
      <td style="color:var(--danger)">${ga}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden">
            <div style="width:${gr}%;height:100%;background:var(--primary);border-radius:3px"></div>
          </div>
          <span style="font-weight:600;font-size:13px;min-width:45px">${gr}%</span>
        </div>
      </td>
    </tr>`;
  });
  
  // Class ranking by attendance rate
  let classRanking = CLASS_LIST.map(cls => {
    const sts = STUDENTS[cls];
    const t = sts.length;
    const p = sts.filter(s => s.status === 'present').length;
    const l = sts.filter(s => s.status === 'leave').length;
    const a = sts.filter(s => s.status === 'absent').length;
    const rate = ((p/t)*100).toFixed(1);
    return { cls, t, p, l, a, rate: parseFloat(rate) };
  }).sort((a, b) => b.rate - a.rate);
  
  let rankingRows = classRanking.map((c, i) => `<tr>
    <td style="font-weight:600;color:${i<3?'var(--primary)':'var(--gray-600)'}">${i+1}</td>
    <td style="font-weight:500">${c.cls}</td>
    <td>${c.t}</td>
    <td style="color:var(--accent)">${c.p}</td>
    <td style="color:var(--warning)">${c.l}</td>
    <td style="color:var(--danger)">${c.a}</td>
    <td style="font-weight:600">${c.rate}%</td>
  </tr>`).join('');
  
  // Abnormal students (absent without leave)
  let abnormalStudents = [];
  CLASS_LIST.forEach(cls => {
    STUDENTS[cls].forEach(s => {
      if (s.status === 'absent') abnormalStudents.push({ ...s, class: cls });
    });
  });
  
  let abnormalRows = abnormalStudents.map(s => `<tr>
    <td>${s.class}</td>
    <td style="font-weight:500">${s.name}</td>
    <td><span class="badge red"><span class="badge-dot red"></span>缺勤</span></td>
    <td style="color:var(--danger)">未请假</td>
  </tr>`).join('');

  return `
    <!-- Overall Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-card blue anim-in anim-d1">
        <div class="stat-label">全校总人数</div>
        <div class="stat-value">${total}</div>
        <div class="stat-sub">${CLASS_LIST.length} 个班级</div>
      </div>
      <div class="stat-card green anim-in anim-d2">
        <div class="stat-label">在校人数</div>
        <div class="stat-value">${present}</div>
        <div class="stat-sub"><span class="up">↑</span> 到校率 ${attendanceRate}%</div>
      </div>
      <div class="stat-card orange anim-in anim-d3">
        <div class="stat-label">请假人数</div>
        <div class="stat-value">${leave}</div>
        <div class="stat-sub">病假 ${leaveByReason['病假']} · 事假 ${leaveByReason['事假']}</div>
      </div>
      <div class="stat-card red anim-in anim-d4">
        <div class="stat-label">缺勤人数</div>
        <div class="stat-value">${absent}</div>
        <div class="stat-sub">未请假缺勤</div>
      </div>
      <div class="stat-card blue anim-in anim-d4">
        <div class="stat-label">迟到人数</div>
        <div class="stat-value">${late}</div>
        <div class="stat-sub">今日累计</div>
      </div>
    </div>

    <!-- Grade Stats & Class Ranking -->
    <div class="grid-2 mb-24">
      <div class="card anim-in anim-d2">
        <div class="card-header">
          <span class="card-title">各年级出勤统计</span>
        </div>
        <div class="card-body no-pad">
          <table>
            <thead><tr><th>年级</th><th>总人数</th><th>在校</th><th>请假</th><th>缺勤</th><th>到校率</th></tr></thead>
            <tbody>${gradeRows}</tbody>
          </table>
        </div>
      </div>
      <div class="card anim-in anim-d3">
        <div class="card-header">
          <span class="card-title">请假类型分布</span>
        </div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div style="text-align:center;padding:16px;background:var(--gray-50);border-radius:8px">
              <div style="font-size:28px;font-weight:700;color:var(--warning)">${leaveByReason['病假']}</div>
              <div style="font-size:13px;color:var(--gray-600);margin-top:4px">病假</div>
              <div style="font-size:12px;color:var(--gray-400)">${leave>0?((leaveByReason['病假']/leave)*100).toFixed(0):0}%</div>
            </div>
            <div style="text-align:center;padding:16px;background:var(--gray-50);border-radius:8px">
              <div style="font-size:28px;font-weight:700;color:var(--primary)">${leaveByReason['事假']}</div>
              <div style="font-size:13px;color:var(--gray-600);margin-top:4px">事假</div>
              <div style="font-size:12px;color:var(--gray-400)">${leave>0?((leaveByReason['事假']/leave)*100).toFixed(0):0}%</div>
            </div>
            <div style="text-align:center;padding:16px;background:var(--gray-50);border-radius:8px">
              <div style="font-size:28px;font-weight:700;color:var(--accent)">${leaveByReason['就医']}</div>
              <div style="font-size:13px;color:var(--gray-600);margin-top:4px">就医</div>

            </div>

        </div>

            <thead><tr><th>排名</th><th>班级</th><th>总人数</th><th>在校</th><th>请假</th><th>缺勤</th><th>到校率</th></tr></thead>

}

/* ----- HEADTEACHER: Class Cadres Editor ----- */
function renderClassCadres() {
  const cls = getHeadteacherClass();
  if (!cls) {
    return emptyStateHtml('未找到您的班级信息。请联系管理员在「学校数据设置」中确认您的班主任分配。');
  }
  if (!STUDENTS[cls] || STUDENTS[cls].length === 0) {
    return emptyStateHtml(`班级 ${cls} 暂无学生数据。请先在「名单管理」中导入学生。`);
  }
  
  // Initialize cadres for this class if not exists
  if (!CLASS_CADRES[cls]) {
    CLASS_CADRES[cls] = {};
  }
  
  // Default cadre positions
  const defaultPositions = ['班长', '副班长', '学习委员', '纪律委员', '体育委员', '文艺委员', '劳动委员', '生活委员'];
  
  // Get student names for dropdown
  const studentNames = STUDENTS[cls].map(s => s.name).sort();
  
  // Build cadre rows
  let cadreRows = '';
  const positions = Object.keys(CLASS_CADRES[cls]).length > 0 
    ? Object.keys(CLASS_CADRES[cls]) 
    : defaultPositions;
  
  for (const pos of positions) {
    const currentStudent = CLASS_CADRES[cls][pos] || '';
    cadreRows += `
      <tr>
        <td style="font-weight:500;width:120px">${pos}</td>
        <td>
          <select class="toolbar-select" style="width:100%;padding:8px 12px" data-position="${pos}" onchange="updateCadre('${cls}','${pos}',this.value)">
            <option value="">-- 请选择 --</option>
            ${studentNames.map(name => `<option value="${name}" ${name === currentStudent ? 'selected' : ''}>${name}</option>`).join('')}
          </select>
        </td>
        <td style="width:80px">
          <button class="toolbar-btn ghost" style="padding:6px 12px;font-size:12px;color:var(--danger)" onclick="removeCadrePosition('${pos}')">删除</button>
        </td>
      </tr>`;
  }
  
  return `
    <div class="toolbar">
      <div class="toolbar-left">
        <span style="font-size:14px;color:var(--gray-600)">为班级设置班干部，信息将显示在座位表讲台两侧</span>
      </div>
      <div class="toolbar-spacer"></div>
      <button class="toolbar-btn primary" onclick="addCadrePosition()">+ 添加职务</button>
      <button class="toolbar-btn ghost" onclick="saveClassCadres();saveClassCadresToCloud('${cls}');showToast('班干部信息已保存','success')">保存</button>
    </div>
    <div class="card">
      <div class="card-body no-pad">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:120px">职务</th>
                <th>学生</th>
                <th style="width:80px">操作</th>
              </tr>
            </thead>
            <tbody id="cadreTableBody">
              ${cadreRows}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

function updateCadre(cls, position, studentName) {
  if (!CLASS_CADRES[cls]) CLASS_CADRES[cls] = {};
  if (studentName) {
    CLASS_CADRES[cls][position] = studentName;
  } else {
    delete CLASS_CADRES[cls][position];
  }
  saveClassCadres();
}

function addCadrePosition() {
  showModal('添加职务', `
    <div class="form-group">
      <label class="form-label">职务名称</label>
      <input type="text" class="form-input" id="newCadrePosition" placeholder="如：宣传委员、组织委员等">
    </div>
  `, `
    <button class="toolbar-btn ghost" onclick="hideModal()">取消</button>
    <button class="toolbar-btn primary" onclick="confirmAddCadrePosition()">添加</button>
  `);
}

function confirmAddCadrePosition() {
  const pos = document.getElementById('newCadrePosition').value.trim();
  if (!pos) {
    showToast('请输入职务名称', 'warning');
    return;
  }
  const cls = getHeadteacherClass();
  if (!CLASS_CADRES[cls]) CLASS_CADRES[cls] = {};
  if (CLASS_CADRES[cls][pos]) {
    showToast('该职务已存在', 'warning');
    return;
  }
  CLASS_CADRES[cls][pos] = '';
  saveClassCadres();
  hideModal();
  navigate('class-cadres');
}

function removeCadrePosition(position) {
  const cls = getHeadteacherClass();
  if (CLASS_CADRES[cls] && CLASS_CADRES[cls][position]) {
    delete CLASS_CADRES[cls][position];
    saveClassCadres();
    navigate('class-cadres');
  }
}

function changeStatus(cls, id, val) {
  const s = STUDENTS[cls].find(s => s.id === id);
  if (s) {
    s.status = val;
    saveStudentsToStorage();
  }
}
function filterStudentRows(input) {
  const q = input.value.toLowerCase();
  input.closest('.toolbar').parentElement.querySelector('tbody').querySelectorAll('tr').forEach(tr => {
    const name = tr.children[1]?.textContent.toLowerCase() || '';
    tr.style.display = name.includes(q) ? '' : 'none';
  });
}
function filterStatusRows(sel) {
  const v = sel.value;
  sel.closest('.toolbar').parentElement.querySelector('tbody').querySelectorAll('tr').forEach(tr => {
    if (!v) { tr.style.display = ''; return; }
    const select = tr.querySelector('select');
    tr.style.display = select && select.value === v ? '' : 'none';
  });
}
function saveAttendance() {
  showModal('保存成功', '<p style="color:var(--accent);font-size:14px">考勤数据已保存。</p>', '<button class="toolbar-btn primary" onclick="hideModal()">确定</button>');
}

function copyPhoneNumber(phone, btn) {
  // Create a temporary textarea to copy the text
  const textarea = document.createElement('textarea');
  textarea.value = phone;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  
  try {
    document.execCommand('copy');
    // Show success feedback
    const originalText = btn.innerHTML;
    btn.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="margin-right:4px">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      已复制
    `;
    btn.style.color = 'var(--accent)';
    
    // Reset after 2 seconds
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.style.color = '';
    }, 2000);
    
    showToast('电话号码已复制到剪贴板');
  } catch (err) {
    showToast('复制失败，请手动复制', 'error');
  }
  
  document.body.removeChild(textarea);
}

function renderTeachClasses() {
  let classes = {};
  const user = xqCurrentUser || {};
  const classSubjects = getTeacherClassSubjects();
  
  // 如果是班主任，先添加班主任班级
  if (user.isHeadteacher) {
    const htClasses = user.headteacherClasses || [];
    htClasses.forEach(cls => {
      classes[cls] = '班主任（本班）';
    });
  }
  
  // 如果是科任老师，添加科任班级（不包括已经是班主任的班级）
  if (user.isTeacher) {
    const teachClasses = user.teachingClasses || [];
    teachClasses.forEach(cls => {
      if (!classes[cls]) {
        classes[cls] = classSubjects[cls] || '科任';
      }
    });
  }
  
  // 领导如果没有分配授课班级，显示提示
  if (user.isLeader && Object.keys(classes).length === 0) {
    return emptyStateHtml('未找到您的授课班级信息。请联系管理员在「学校数据设置」中确认您的授课分配。');

  let cards = '';

  }
  const htClassesSet = new Set(user.headteacherClasses || []);
  Object.entries(classes).forEach(([cls, subject], index) => {
    const sts = STUDENTS[cls] || [];
    const t = sts.length;
    const p = sts.filter(s=>s.status==='present').length;
    const l = sts.filter(s=>s.status==='leave').length;
    const a = sts.filter(s=>s.status==='absent').length;
    const rate = t > 0 ? ((p/t)*100).toFixed(0) : 0;
    const isOwnClass = htClassesSet.has(cls);
    
    cards += `<div class="class-card" onclick="showClassDetail('${cls}')" style="${isOwnClass ? 'border-color:var(--primary-light);border-width:2px' : ''}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">

      </div>

        <div class="class-card-stat"><strong style="color:var(--accent)">${p}</strong>在校</div>

  return `
    <div class="toolbar">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

let importData = [];
function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const cls = getHeadteacherClass();
  
  // 检查文件类型
  const isExcel = file.name.endsWith('.xlsx') || file.name.endsWith('.xls');
  
  if (isExcel) {
    // 使用 XLSX 库读取 Excel 文件
    readExcelFile(file, function(data) {
      if (!data || data.length < 2) { showToast('文件内容为空', 'error'); return; }
      
      // 查找表头行
      let headerRowIdx = -1;
      for (let i = 0; i < Math.min(data.length, 10); i++) {
        const row = data[i].map(c => String(c).trim());
        if (row.some(c => c.includes('班级') || c.includes('姓名'))) { headerRowIdx = i; break; }
      }
      if (headerRowIdx === -1) { showToast('未找到"班级"或"姓名"列', 'error'); return; }
      
      const header = data[headerRowIdx].map(c => String(c).trim());
      let classCol = -1, nameCol = -1, parentCol = -1, phoneCol = -1;
      
      header.forEach((c, i) => {
        if (c.includes('班级') || c === '班') classCol = i;
        else if (c.includes('电话') || c.includes('手机') || c.includes('联系')) phoneCol = i;
        else if (c.includes('家长')) parentCol = i;
        else if (c.includes('姓名') || c.includes('名字')) nameCol = i;
      });
      
      console.log('[XQ Import] Header:', header);
      console.log('[XQ Import] Column mapping: class=', classCol, 'name=', nameCol, 'parent=', parentCol, 'phone=', phoneCol);
      
      if (nameCol === -1) {
        showToast('未找到"学生姓名"列', 'error');
        return;
      }
      
      // 解析数据
      importData = [];
      let maxId = Math.max(...Object.values(STUDENTS).flat().map(s => s.id), 0);
      
      for (let i = headerRowIdx + 1; i < data.length; i++) {
        const row = data[i];
        const fileClass = classCol >= 0 ? String(row[classCol] || '').trim() : '';
        const name = String(row[nameCol] || '').trim();
        const parent = parentCol >= 0 ? String(row[parentCol] || '').trim() : '';
        const phone = phoneCol >= 0 ? String(row[phoneCol] || '').trim() : '';
        
        if (!name) continue;
        
        // 如果有班级列，检查是否匹配当前班级
        if (classCol >= 0 && fileClass && fileClass !== cls) {
          continue; // 跳过不匹配的班级
        }
        
        importData.push({
          seat: importData.length + 1,
          name: name,
          phone: phone,
          parent: parent,
          id: ++maxId,
          status: 'present',
          leaveReason: '',
          leaveNote: '',
          leaveDays: 0,
          mark: '',
          boarding: 'inner',
          familyType: '',
          familyNote: '',
          leftBehind: false,
          leftBehindNote: '',
        });
      }
      
      if (importData.length === 0) {
        showToast('未解析到有效数据', 'error');
        return;
      }
      
      showImportPreview();
    });
  } else {
    // 旧的文本格式处理
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      parseImportText(text);
    };
    reader.readAsText(file);
  }
  
  event.target.value = '';
}

function parseImportText(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  importData = [];
  let maxId = Math.max(...Object.values(STUDENTS).flat().map(s => s.id), 0);
  lines.forEach((line, i) => {
    const parts = line.split(/[,，\t]/).map(p => p.trim());
    if (parts.length >= 1 && parts[0]) {
      importData.push({
        seat: importData.length + 1,
        name: parts[0],
        parent: parts[1] || '',
        phone: parts[2] || '',
        id: ++maxId,
        status: 'present',
        leaveReason: '',
        leaveNote: '',
        leaveDays: 0,
        mark: '',
        boarding: 'inner',
        familyType: '',
        familyNote: '',
        leftBehind: false,
        leftBehindNote: '',

/* ============================================================
   SEATING EDIT MODE (座位表编辑)
   ============================================================ */
let seatingEditMode = false;
let seatingCols = 8;
let seatingRows = 7;
let rowGap = 8;
let colGaps = [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10]; // 每列之间的间距
let colGroups = []; // 列分组，如 [2,2,2,2] 表示每2列为一组，空数组表示不分组
let dragSourceSlotIdx = null;
let seatLayout = {}; // 每个班级的座位布局，存储每个位置的学生ID或null
let seatConfig = {}; // 每个班级的座位配置 { cols, rows, colGaps, colGroups }

// 加载指定班级的座位配置到全局变量
function loadSeatConfig(cls) {
  if (!cls) return;
  if (seatConfig[cls]) {
    seatingCols = seatConfig[cls].cols || 8;
    seatingRows = seatConfig[cls].rows || 7;
    colGaps = seatConfig[cls].colGaps || [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10];
    colGroups = seatConfig[cls].colGroups || [];
  } else {
    // 首次访问该班级，使用默认值
    seatingCols = 8;
    seatingRows = 7;
    colGaps = [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10];
    colGroups = [];
    seatConfig[cls] = { cols: seatingCols, rows: seatingRows, colGaps: [...colGaps], colGroups: [...colGroups] };
  }
}

// 保存当前全局配置到指定班级
function saveSeatConfig(cls) {
  if (!cls) return;
  seatConfig[cls] = {
    cols: seatingCols,
    rows: seatingRows,
    colGaps: [...colGaps],
    colGroups: [...colGroups]
  };
}

function enterSeatingEdit() {
  seatingEditMode = true;
  navigate('class-seating');
}

function cancelSeatingEdit() {
  seatingEditMode = false;
  navigate('class-seating');
}

async function saveSeating() {
  seatingEditMode = false;
  const cls = currentViewClass || getHeadteacherClass();
  
  // 先保存当前班级的配置到 seatConfig
  saveSeatConfig(cls);
  
  // 保存座位布局到本地存储
  try {
    const seatingData = {
      seatLayout: seatLayout[cls] || [],
      seatConfig: seatConfig[cls] || {}
    };
    localStorage.setItem('xq_seating_' + cls, JSON.stringify(seatingData));
  } catch (e) {
    console.warn('[XQ] Failed to save seating to localStorage:', e);
  }
  
  // 同步到云端（只保存当前班级）
  if (xqCurrentUser) {
    try {
      const configs = {};
      // 只保存当前班级的座位布局
      if (seatLayout[cls] && seatLayout[cls].length > 0) {
        configs['seating_' + cls] = {
          layout: seatLayout[cls],
          cols: seatConfig[cls]?.cols || seatingCols,
          rows: seatConfig[cls]?.rows || seatingRows,
          colGaps: seatConfig[cls]?.colGaps || colGaps,
          colGroups: seatConfig[cls]?.colGroups || colGroups
        };
      }
      
      const result = await xqApi('config', {
        action: 'set_all',
        configs: configs,
        teacherName: xqCurrentUser?.teacherName || ''
      });
      
      if (result && result.ok) {
        showToast('座位表已保存到云端', 'success');
        console.log('[XQ] Seating saved to cloud for class:', cls);
      } else {
        showToast('座位表已保存（本地），云端同步失败', 'warning');
        console.warn('[XQ] Failed to save seating to cloud:', result);
      }
    } catch (e) {
      showToast('座位表已保存（本地），云端同步失败', 'warning');
      console.warn('[XQ] Failed to save seating to cloud:', e);
    }
  } else {
    showToast('座位表已保存');
  }
  
  navigate('class-seating');
}

function changeSeatCols(val) {
  const cls = currentViewClass || getHeadteacherClass();
  seatingCols = Math.max(2, Math.min(12, parseInt(val) || 8));
  // 调整 colGaps 数组大小
  while (colGaps.length < seatingCols - 1) colGaps.push(10);
  if (colGaps.length > seatingCols - 1) colGaps.length = seatingCols - 1;
  // 保存到该班级的配置
  saveSeatConfig(cls);
  navigate('class-seating');
}

function changeSeatRows(val) {
  const cls = currentViewClass || getHeadteacherClass();
  seatingRows = Math.max(1, Math.min(20, parseInt(val) || 7));
  // 保存到该班级的配置
  saveSeatConfig(cls);
  navigate('class-seating');
}

function changeColGrouping(val) {
  const cls = currentViewClass || getHeadteacherClass();
  const groupSize = Math.max(1, Math.min(seatingCols, parseInt(val) || 1));
  if (groupSize === 1) {
    colGroups = []; // 不分组，每列独立
  } else {
    // 均匀分组
    colGroups = [];
    let remaining = seatingCols;
    while (remaining > 0) {
      const size = Math.min(groupSize, remaining);
      colGroups.push(size);
      remaining -= size;
    }
  }
  // 保存到该班级的配置
  saveSeatConfig(cls);
  navigate('class-seating');
}

function showAutoArrangeModal() {

        <div style="font-weight:600;font-size:14px;margin-bottom:4px">座位轮换</div>
        <div style="font-size:12px;color:var(--gray-500)">每组向右轮换一列，公平换座</div>
      </div>

        <div style="font-weight:600;font-size:14px;margin-bottom:4px">随机排列</div>
        <div style="font-size:12px;color:var(--gray-500)">完全随机打乱座位</div>
      </div>
      <div class="arrange-option" onclick="doAutoArrange('height')">
        <div style="font-size:24px;margin-bottom:8px">📏</div>
        <div style="font-weight:600;font-size:14px;margin-bottom:4px">按身高排列</div>

function doAutoArrange(method) {
  const cls = currentViewClass || getHeadteacherClass();
  const sts = STUDENTS[cls];
  
  switch(method) {
    case 'name':
      sts.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
      break;
    case 'seat':
      sts.sort((a, b) => a.seat - b.seat);
      break;
    case 'rotate':
      // 座位轮换：每个学生向右移动一列
      const cols = seatingCols;
      const rotated = [...sts];
      sts.forEach((s, i) => {
        const row = Math.floor(i / cols);
        const col = i % cols;
        const newCol = (col + 1) % cols;
        const newIdx = row * cols + newCol;
        if (newIdx < sts.length) {
          sts[newIdx] = rotated[i];
        }
      });
      break;
    case 'gender':
      // 男女间隔（随机分配性别）
      const males = sts.filter(() => Math.random() > 0.5);
      const females = sts.filter(s => !males.includes(s));
      let idx = 0;
      for (let i = 0; i < sts.length; i++) {
        if (i % 2 === 0 && males.length > 0) {
          sts[i] = males.pop();
        } else if (females.length > 0) {
          sts[i] = females.pop();
        } else if (males.length > 0) {
          sts[i] = males.pop();
        }
      }
      break;
    case 'random':
      // 完全随机
      for (let i = sts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sts[i], sts[j]] = [sts[j], sts[i]];
      }
      break;
    case 'height':
      // 按身高（模拟：按座号奇偶分组，奇数矮前排）
      const short = sts.filter((_, i) => i % 2 === 0);
      const tall = sts.filter((_, i) => i % 2 === 1);
      let h = 0;
      for (let i = 0; i < sts.length; i++) {
        if (i < sts.length / 2 && short.length > 0) {
          sts[i] = short.shift();
        } else if (tall.length > 0) {
          sts[i] = tall.shift();
        } else {
          sts[i] = short.shift();
        }
      }
      break;
  }
  
  // 更新座号
  sts.forEach((s, i) => { s.seat = i + 1; });
  
  // 更新座位布局
  const cols = seatingCols;
  const totalRows = seatingRows > 0 ? seatingRows : Math.ceil(sts.length / cols);
  const totalSlots = totalRows * cols;
  const studentCount = sts.length;
  const emptyCount = Math.max(0, totalSlots - studentCount);
  
  // 重建布局：空位在前，学生按新顺序排列
  seatLayout[cls] = [];
  for (let i = 0; i < emptyCount; i++) seatLayout[cls].push(null);
  for (let i = 0; i < studentCount; i++) seatLayout[cls].push(sts[i].id);
  
  saveStudentsToStorage();
  hideModal();
  showToast('座位已重新排列');
  navigate('class-seating');
}

/* ----- Drag & Drop ----- */
function onSeatDragStart(e, slotIdx) {
  dragSourceSlotIdx = slotIdx;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', slotIdx);
}

function onSeatDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const seat = e.target.closest('.seat');
  if (seat) {
    document.querySelectorAll('.seat.drag-over').forEach(s => s.classList.remove('drag-over'));
    seat.classList.add('drag-over');
  }
}

function onSeatDrop(e, targetSlotIdx) {
  e.preventDefault();
  document.querySelectorAll('.seat.drag-over').forEach(s => s.classList.remove('drag-over'));
  
  if (dragSourceSlotIdx === null || dragSourceSlotIdx === targetSlotIdx) return;
  
  const cls = currentViewClass || getHeadteacherClass();
  const sts = STUDENTS[cls];
  const cols = seatingCols;
  const totalRows = seatingRows > 0 ? seatingRows : Math.ceil(sts.length / cols);
  const totalSlots = totalRows * cols;
  
  // 确保布局已初始化
  if (!seatLayout[cls] || seatLayout[cls].length !== totalSlots) {
    const studentCount = sts.length;
    const emptyCount = Math.max(0, totalSlots - studentCount);
    seatLayout[cls] = [];
    for (let i = 0; i < emptyCount; i++) seatLayout[cls].push(null);
    for (let i = 0; i < studentCount; i++) seatLayout[cls].push(sts[i].id);
  }
  
  // 直接交换两个位置
  const temp = seatLayout[cls][dragSourceSlotIdx];
  seatLayout[cls][dragSourceSlotIdx] = seatLayout[cls][targetSlotIdx];
  seatLayout[cls][targetSlotIdx] = temp;
  
  // 更新学生的座号（按布局顺序）
  let seatNum = 1;
  for (let i = 0; i < totalSlots; i++) {
    const studentId = seatLayout[cls][i];
    if (studentId !== null) {
      const student = sts.find(s => s.id === studentId);
      if (student) student.seat = seatNum++;
    }
  }
  
  saveStudentsToStorage();
  dragSourceSlotIdx = null;
  navigate('class-seating');
}

function onSeatDragEnd(e) {
  dragSourceSlotIdx = null;
  document.querySelectorAll('.seat.dragging, .seat.drag-over').forEach(s => {
    s.classList.remove('dragging', 'drag-over');
  });
}

/* ----- Touch Drag & Drop for Mobile ----- */
let touchDragSourceSlotIdx = null;
let touchDragElement = null;
let touchDragClone = null;
let touchStartX = 0;
let touchStartY = 0;
let touchCloneOffsetX = 0;
let touchCloneOffsetY = 0;

function onSeatTouchStart(e, slotIdx) {
  if (!seatingEditMode) return;
  
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchDragSourceSlotIdx = slotIdx;
  touchDragElement = e.target.closest('.seat');
  
  // Prevent scrolling while dragging
  e.preventDefault();
}

function onSeatTouchMove(e) {
  if (touchDragSourceSlotIdx === null || !touchDragElement) return;
  
  const touch = e.touches[0];
  const deltaX = Math.abs(touch.clientX - touchStartX);
  const deltaY = Math.abs(touch.clientY - touchStartY);
  
  // Only start dragging after moving a bit
  if (!touchDragClone && (deltaX > 10 || deltaY > 10)) {
    // Get the element's position
    const rect = touchDragElement.getBoundingClientRect();
    
    // Calculate offset from touch point to element center
    touchCloneOffsetX = touch.clientX - rect.left;
    touchCloneOffsetY = touch.clientY - rect.top;
    
    // Create a floating clone
    touchDragClone = touchDragElement.cloneNode(true);
    touchDragClone.style.position = 'fixed';
    touchDragClone.style.zIndex = '9999';
    touchDragClone.style.pointerEvents = 'none';
    touchDragClone.style.opacity = '0.9';
    touchDragClone.style.width = rect.width + 'px';
    touchDragClone.style.height = rect.height + 'px';
    touchDragClone.style.left = (touch.clientX - touchCloneOffsetX) + 'px';
    touchDragClone.style.top = (touch.clientY - touchCloneOffsetY) + 'px';
    touchDragClone.style.transform = 'scale(1.05)';
    touchDragClone.style.boxShadow = '0 8px 20px rgba(0,0,0,0.3)';
    touchDragClone.style.borderRadius = '8px';
    document.body.appendChild(touchDragClone);
    
    touchDragElement.style.opacity = '0.3';
  }
  
  if (touchDragClone) {
    // Move the clone - keep the same offset from touch point
    touchDragClone.style.left = (touch.clientX - touchCloneOffsetX) + 'px';
    touchDragClone.style.top = (touch.clientY - touchCloneOffsetY) + 'px';
    
    // Highlight the seat under the finger
    // Temporarily hide the clone to get the element below
    touchDragClone.style.display = 'none';
    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
    touchDragClone.style.display = '';
    const seatBelow = elementBelow ? elementBelow.closest('.seat') : null;
    
    document.querySelectorAll('.seat.drag-over').forEach(s => s.classList.remove('drag-over'));
    if (seatBelow && seatBelow !== touchDragElement) {
      seatBelow.classList.add('drag-over');
    }
    
    e.preventDefault();
  }
}

function onSeatTouchEnd(e) {
  if (touchDragSourceSlotIdx === null) return;
  
  if (touchDragClone) {
    // Get the touch position from the last touch
    const touch = e.changedTouches[0];
    
    // Temporarily hide the clone to get the element below
    touchDragClone.style.display = 'none';
    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
    touchDragClone.style.display = '';
    const targetSeat = elementBelow ? elementBelow.closest('.seat') : null;
    
    if (targetSeat && targetSeat !== touchDragElement) {
      // Find the target slot index
      const targetSlotIdx = parseInt(targetSeat.dataset.slotIdx);
      if (!isNaN(targetSlotIdx)) {
        // Perform the swap
        const cls = currentViewClass || getHeadteacherClass();
        const sts = STUDENTS[cls];
        const cols = seatingCols;
        const totalRows = seatingRows > 0 ? seatingRows : Math.ceil(sts.length / cols);
        const totalSlots = totalRows * cols;
        
        // Ensure layout is initialized
        if (!seatLayout[cls] || seatLayout[cls].length !== totalSlots) {
          const studentCount = sts.length;
          const emptyCount = Math.max(0, totalSlots - studentCount);
          seatLayout[cls] = [];
          for (let i = 0; i < emptyCount; i++) seatLayout[cls].push(null);
          for (let i = 0; i < studentCount; i++) seatLayout[cls].push(sts[i].id);
        }
        
        // Swap positions
        const temp = seatLayout[cls][touchDragSourceSlotIdx];
        seatLayout[cls][touchDragSourceSlotIdx] = seatLayout[cls][targetSlotIdx];
        seatLayout[cls][targetSlotIdx] = temp;
        
        // Update seat numbers
        let seatNum = 1;
        for (let i = 0; i < totalSlots; i++) {
          const studentId = seatLayout[cls][i];
          if (studentId !== null) {
            const student = sts.find(s => s.id === studentId);
            if (student) student.seat = seatNum++;
          }
        }
        
        saveStudentsToStorage();
        
        // Clean up and refresh
        if (touchDragClone) {
          touchDragClone.remove();
          touchDragClone = null;
        }
        if (touchDragElement) {
          touchDragElement.style.opacity = '';
        }
        document.querySelectorAll('.seat.drag-over').forEach(s => s.classList.remove('drag-over'));
        
        touchDragSourceSlotIdx = null;
        touchDragElement = null;
        
        navigate('class-seating');
        return;
      }
    }
  }
  
  // Clean up if no swap
  if (touchDragClone) {
    touchDragClone.remove();
    touchDragClone = null;
  }
  if (touchDragElement) {
    touchDragElement.style.opacity = '';
  }
  document.querySelectorAll('.seat.drag-over').forEach(s => s.classList.remove('drag-over'));
  
  touchDragSourceSlotIdx = null;
  touchDragElement = null;
}

/* ----- Column Gap Resize ----- */
let resizingGapIdx = -1;
let resizeStartX = 0;
let resizeStartGap = 0;

function startColResize(e, gapIdx) {
  if (!seatingEditMode) return;
  resizingGapIdx = gapIdx;
  resizeStartX = e.clientX;
  resizeStartGap = colGaps[gapIdx] || 10;
  e.preventDefault();
  e.stopPropagation();
  
  document.addEventListener('mousemove', doColResize);
  document.addEventListener('mouseup', stopColResize);
}

function doColResize(e) {
  if (resizingGapIdx < 0) return;
  const dx = e.clientX - resizeStartX;
  const newGap = Math.max(4, Math.min(40, resizeStartGap + dx));
  colGaps[resizingGapIdx] = newGap;
  
  // 更新所有列间距handle的宽度
  document.querySelectorAll('.col-gap-handle').forEach(handle => {
    const idx = parseInt(handle.dataset.gapIdx);
    if (idx === resizingGapIdx) {
      handle.style.width = newGap + 'px';
    }
  });
}

function stopColResize(e) {
  // 保存当前配置到该班级
  const cls = currentViewClass || getHeadteacherClass();
  saveSeatConfig(cls);
  
  resizingGapIdx = -1;
  document.removeEventListener('mousemove', doColResize);
  document.removeEventListener('mouseup', stopColResize);
}

/* ----- Export Seating Chart as Word ----- */
function printSeating() {
  const cls = currentViewClass || getHeadteacherClass();
  if (!cls || !STUDENTS[cls]) {
    showToast('暂无班级数据', 'warning');
    return;
  }
  
  const sts = STUDENTS[cls];
  const cols = seatingCols;
  const totalRows = seatingRows > 0 ? seatingRows : Math.ceil(sts.length / cols);
  const totalSlots = totalRows * cols;
  
  // Build seat slots array
  let seatSlots = [];
  for (let i = 0; i < totalSlots; i++) {
    const studentId = seatLayout[cls] && seatLayout[cls][i];
    if (studentId) {
      const student = sts.find(s => s.id === studentId);
      seatSlots.push(student || null);
    } else {
      seatSlots.push(null);
    }
  }
  
  // Calculate group boundaries (same as screen)
  const groupBoundaries = [];
  const groupSizes = [];
  if (colGroups.length > 0) {
    let cumCol = 0;
    for (const groupSize of colGroups) {
      cumCol += groupSize;
      groupSizes.push(groupSize);
      if (cumCol < cols) groupBoundaries.push(cumCol - 1);
    }
  }
  const gapSet = new Set(groupBoundaries);
  const numGaps = gapSet.size;
  
  // === Column width calculation ===
  // A4 portrait: 11906 DXA, margins 1440 top/bottom, 1800 left/right
  // Content width = 11906 - 1800 - 1800 = 8306 DXA
  // Use same table width as reference template
  const TABLE_W = 8306;
  const GAP_W = 480; // ~8.5mm visible gap between groups
  const totalGapW = numGaps * GAP_W;
  const seatColW = Math.floor((TABLE_W - totalGapW) / cols);
  
  // Build actual column widths array (seat + gap alternating)
  const colWidths = [];
  for (let c = 0; c < cols; c++) {
    colWidths.push(seatColW);
    if (gapSet.has(c)) colWidths.push(GAP_W);
  }
  const totalTableCols = colWidths.length;
  // Fix rounding on last column
  const usedW = colWidths.reduce((a, b) => a + b, 0);
  colWidths[colWidths.length - 1] += TABLE_W - usedW;
  
  // Build gridCol XML
  let gridColsXml = '';
  for (const w of colWidths) {
    gridColsXml += '<w:gridCol w:w="' + w + '"/>';
  }
  
  // Font settings
  const FONT = '\u4eff\u5b8b_GB2312';
  const SZ = '32'; // 三号 = 16pt
  
  // Border XML for data cells (single black border)
  const dataBorderXml = '<w:tcBorders>' +
    '<w:top w:val="single" w:color="000000" w:sz="4" w:space="0"/>' +
    '<w:left w:val="single" w:color="000000" w:sz="4" w:space="0"/>' +
    '<w:bottom w:val="single" w:color="000000" w:sz="4" w:space="0"/>' +
    '<w:right w:val="single" w:color="000000" w:sz="4" w:space="0"/>' +
    '</w:tcBorders>';
  
  // Border XML for gap cells (NO borders - creates visible white space)
  const gapBorderXml = '<w:tcBorders>' +
    '<w:top w:val="nil"/>' +
    '<w:left w:val="nil"/>' +
    '<w:bottom w:val="nil"/>' +
    '<w:right w:val="nil"/>' +
    '</w:tcBorders>';
  
  // Table properties
  const tblPr = '<w:tblPr>' +
    '<w:tblStyle w:val="3"/>' +
    '<w:tblW w:w="' + TABLE_W + '" w:type="dxa"/>' +
    '<w:jc w:val="center"/>' +
    '<w:tblBorders>' +
    '<w:top w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:left w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:bottom w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:right w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:insideH w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:insideV w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '</w:tblBorders>' +
    '<w:tblLayout w:type="autofit"/>' +
    '<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/>' +
    '<w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar>' +
    '</w:tblPr>';
  
  const tblPrEx = '<w:tblPrEx>' +
    '<w:tblBorders>' +
    '<w:top w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:left w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:bottom w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:right w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:insideH w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '<w:insideV w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
    '</w:tblBorders>' +
    '<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/>' +
    '<w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar>' +
    '</w:tblPrEx>';
  
  // Seat cell XML
  function seatCell(name, width) {
    return '<w:tc><w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/>' +
      dataBorderXml + '<w:vAlign w:val="center"/></w:tcPr>' +
      '<w:p><w:pPr><w:jc w:val="center"/><w:textAlignment w:val="center"/>' +
      '<w:rPr><w:rFonts w:hint="eastAsia" w:ascii="' + FONT + '" w:hAnsi="' + FONT + '" w:eastAsia="' + FONT + '" w:cs="' + FONT + '"/>' +
      '<w:sz w:val="' + SZ + '"/><w:szCs w:val="' + SZ + '"/></w:rPr></w:pPr>' +

      '<w:t>' + (name || '') + '</w:t></w:r></w:p></w:tc>';
  }
  
  // Gap cell XML (no borders, vMerge for spanning rows)
  function gapCell(width, isFirstRow) {
    const vm = isFirstRow ? '<w:vMerge w:val="restart"/>' : '<w:vMerge w:val="continue"/>';
    return '<w:tc><w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/>' +
      vm + gapBorderXml + '</w:tcPr>' +
      '<w:p><w:pPr><w:rPr><w:sz w:val="2"/><w:szCs w:val="2"/></w:rPr></w:pPr></w:p></w:tc>';
  }
  
  // Empty gap cell for label row (no vMerge)
  function emptyGapCell(width) {
    return '<w:tc><w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/>' +
      gapBorderXml + '</w:tcPr>' +
      '<w:p><w:pPr><w:rPr><w:sz w:val="2"/><w:szCs w:val="2"/></w:rPr></w:pPr></w:p></w:tc>';

  let rowsXml = '';
  for (let row = 0; row < totalRows; row++) {
    let rowCells = '';
    let colIdx = 0;
    for (let c = 0; c < cols; c++) {
      const i = row * cols + c;

      const name = s ? s.name : '';
      rowCells += seatCell(name, colWidths[colIdx]);
      colIdx++;

        rowCells += gapCell(colWidths[colIdx], row === 0);

      dataBorderXml + '<w:vAlign w:val="center"/></w:tcPr>' +
      '<w:p><w:pPr><w:jc w:val="center"/>' +
      '<w:rPr><w:rFonts w:hint="eastAsia" w:ascii="' + FONT + '" w:hAnsi="' + FONT + '" w:eastAsia="' + FONT + '" w:cs="' + FONT + '"/>' +

  let podiumRow = '<w:tr>' + tblPrEx +

    '<w:tc><w:tcPr><w:tcW w:w="' + podiumWidth + '" w:type="dxa"/>' +
    '<w:gridSpan w:val="' + totalTableCols + '"/>' +
    dataBorderXml + '<w:vAlign w:val="center"/></w:tcPr>' +
    '<w:p><w:pPr><w:jc w:val="center"/>' +
    '<w:rPr><w:rFonts w:hint="eastAsia" w:ascii="' + FONT + '" w:hAnsi="' + FONT + '" w:eastAsia="' + FONT + '" w:cs="' + FONT + '"/>' +
    '<w:sz w:val="84"/><w:szCs w:val="84"/></w:rPr></w:pPr>' +

    '<w:sz w:val="84"/><w:szCs w:val="84"/></w:rPr>' +
    '<w:t>\u8bb2     \u53f0</w:t></w:r></w:p></w:tc></w:tr>';
  
  // Full table XML
  const tableXml = '<w:tbl>' + tblPr + '<w:tblGrid>' + gridColsXml + '</w:tblGrid>' + rowsXml + podiumRow + '</w:tbl>';
  
  // Assemble full document XML
  const docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas" ' +
    'xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" ' +
    'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +

    'xmlns:v="urn:schemas-microsoft-com:vml" ' +
    'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
    'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
    'xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" ' +
    'xmlns:w10="urn:schemas-microsoft-com:office:word" ' +
    'xmlns:w15="http://schemas.microsoft.com/office/word/2012/wordml" ' +
    'xmlns:wpg="http://schemas.microsoft.com/office/word/2010/wordprocessingGroup" ' +
    'xmlns:wpi="http://schemas.microsoft.com/office/word/2010/wordprocessingInk" ' +
    'xmlns:wne="http://schemas.microsoft.com/office/word/2006/wordml" ' +
    'xmlns:wpsCustomData="http://www.wps.cn/officeDocument/2013/wpsCustomData" ' +
    'mc:Ignorable="w14 w15 wp14">' +
    '<w:body>' + tableXml +
    '<w:sectPr>' +
    '<w:pgSz w:w="11906" w:h="16838"/>' +
    '<w:pgMar w:top="1440" w:right="1800" w:bottom="1440" w:left="1800" w:header="851" w:footer="992" w:gutter="0"/>' +
    '</w:sectPr>' +
    '</w:body></w:document>';
  
  // Build content_types and rels
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '</Types>';
  
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';
  
  // Create ZIP file
  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypes);
  zip.file('_rels/.rels', rels);
  zip.file('word/document.xml', docXml);
  
  zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' })
    .then(function(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = cls + '_\u5ea7\u4f4d\u8868.docx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('\u5ea7\u4f4d\u8868\u5df2\u5bfc\u51fa\u4e3aWord\u6587\u4ef6');
    });
}

let markSelectedStudents = new Set();

function toggleMarkStudent(id, el) {
  if (markSelectedStudents.has(id)) {
    markSelectedStudents.delete(id);
    el.classList.remove('selected');
  } else {
    markSelectedStudents.add(id);
    el.classList.add('selected');
  }
}

function saveBatchMark() {
  if (markSelectedStudents.size === 0) {
    showToast('请至少选择一名学生', 'warning');
    return;
  }
  const markType = document.getElementById('markType').value;
  const markDetail = document.getElementById('markDetail').value.trim();
  if (!markType) {
    showToast('请选择标记类型', 'warning');
    return;
  }
  const cls = getHeadteacherClass();
  const markText = markDetail ? `${markType}（${markDetail}）` : markType;
  let count = 0;
  markSelectedStudents.forEach(id => {
    const s = STUDENTS[cls].find(st => st.id === id);
    if (s) {
      s.mark = markText;
      count++;
    }
  });
  markSelectedStudents.clear();
  saveStudentsToStorage();
  hideModal();
  showToast(`已为 ${count} 名学生添加标记`);
}

function clearSelectedMarks() {
  if (markSelectedStudents.size === 0) {
    showToast('请先选择要清除标记的学生', 'warning');
    return;
  }
  const cls = getHeadteacherClass();
  let count = 0;
  markSelectedStudents.forEach(id => {
    const s = STUDENTS[cls].find(st => st.id === id);
    if (s) {
      s.mark = '';
      count++;
    }
  });
  markSelectedStudents.clear();
  saveStudentsToStorage();
  hideModal();
  showToast(`已清除 ${count} 名学生的标记`);
}

function showBatchBoardingModal() {

      <label class="form-label">学生列表（点击切换住宿状态）</label>

  `, `<button class="toolbar-btn ghost" onclick="hideModal()">关闭</button>`, true);

function toggleBoardingStudent(id, el) {
  const cls = getHeadteacherClass();
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  
  // Toggle boarding status
  if (s.boarding === 'outer') {
    s.boarding = 'inner';
    el.classList.remove('selected');
    el.innerHTML = s.name;
    el.title = '点击切换：当前为内宿';
  } else {
    s.boarding = 'outer';
    el.classList.add('selected');
    el.innerHTML = s.name + ' 🏠';
    el.title = '点击切换：当前为外宿';
  }
  
  saveStudentsToStorage();
  
  // Update counts
  const sts = STUDENTS[cls];
  const outerCount = sts.filter(s => s.boarding === 'outer').length;
  const innerCount = sts.filter(s => s.boarding === 'inner').length;
  document.getElementById('outerCountDisplay').textContent = outerCount;
  document.getElementById('innerCountDisplay').textContent = innerCount;
  
  showToast(`${s.name} 已设为${s.boarding === 'outer' ? '外宿' : '内宿'}`);
}

/* ============================================================
   TOAST NOTIFICATIONS
   ============================================================ */
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✓', error: '✕', warning: '⚠' };
  toast.innerHTML = `<span style="font-weight:600">${icons[type] || '✓'}</span> ${msg}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'toastOut 0.3s ease-in forwards';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

/* ============================================================

   ============================================================ */
function showModal(title, bodyHtml, footerHtml, wide) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('modal').classList.toggle('wide', !!wide);
  document.getElementById('modalOverlay').classList.add('show');
}
function hideModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) hideModal();
}

   INIT
   ============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideModal();
});

// Drag and drop for import zone
document.addEventListener('dragover', e => {
  const zone = document.getElementById('importZone');
  if (zone && zone.contains(e.target)) {
    e.preventDefault();
    zone.classList.add('dragover');
  }
});
document.addEventListener('dragleave', e => {
  const zone = document.getElementById('importZone');
  if (zone && !zone.contains(e.relatedTarget)) {
    zone.classList.remove('dragover');
  }
});
document.addEventListener('drop', e => {
  const zone = document.getElementById('importZone');
  if (zone && zone.contains(e.target)) {
    e.preventDefault();
    zone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = ev => parseImportText(ev.target.result);
      reader.readAsText(file);
    }
  }
});

// Setup data storage

let setupRoles = [];        // [{name, role, classes: [], subject, username, password}]
let currentSetupTab = 'classes';

// Open/Close setup page
function openSetupPage() {
  // 权限检查：只有管理员可以访问
  if (xqCurrentUser?.teacherName !== XQ_ADMIN_NAME) {
    alert('⛔ 权限不足\n\n只有管理员（' + XQ_ADMIN_NAME + '）才能访问学校数据设置。');
    return;
  }
  document.getElementById('setupPage').classList.add('visible');
  currentSetupTab = 'classes';
  renderSetupContent();
}

function closeSetupPage() {
  document.getElementById('setupPage').classList.remove('visible');
}

async function saveSetupAndBack() {
  // 权限检查：只有管理员可以保存
  if (xqCurrentUser?.teacherName !== XQ_ADMIN_NAME) {
    alert('⛔ 权限不足\n\n只有管理员（' + XQ_ADMIN_NAME + '）才能保存学校数据。');
    return;
  }
  
  // Apply all setup data
  if (setupClasses.length > 0) applyClassesData(setupClasses);
  if (setupTeaching.length > 0) applyTeachingDataFromSetup();
  if (setupRoles.length > 0) await applyRolesData(setupRoles);
  
  // 等待服务器同步完成
  showToast('正在保存到云端...', 'success');
  const result = await saveSchoolConfigToStorage();
  
  if (result.synced) {
    showToast('✓ 学校数据已保存到云端（所有设备可见）');
    closeSetupPage();
  } else if (result.ok && !result.synced) {
    // 本地保存成功但没有同步到服务器
    showToast('⚠ 数据已保存到本地，但未同步到云端。请检查网络连接。', 'warning');
    closeSetupPage();
  } else {
    showToast('✕ 保存失败：' + (result.error || '未知错误'), 'error');
  }
}

function switchSetupTab(tab, el) {
  currentSetupTab = tab;
  document.querySelectorAll('.setup-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderSetupContent();
}

function renderSetupContent() {
  const content = document.getElementById('setupContent');
  if (currentSetupTab === 'classes') {
    content.innerHTML = renderClassesSetup();
  } else if (currentSetupTab === 'teaching') {
    content.innerHTML = renderTeachingSetup();
  } else if (currentSetupTab === 'roles') {
    content.innerHTML = renderRolesSetup();
  } else if (currentSetupTab === 'cloud') {
    content.innerHTML = renderCloudSetup();
  }
}

  const result = await xqClearSemesterData();
  if (result.ok) {

    setTimeout(() => location.reload(), 1500);

}
