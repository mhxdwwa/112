let importData = [];
function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    parseImportText(text);
  };
  reader.readAsText(file);
}

function parsePastedData() {
  const text = document.getElementById('pasteArea').value;
  if (!text.trim()) { showToast('请粘贴数据', 'warning'); return; }
  parseImportText(text);
}

function parseImportText(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  importData = [];
  let maxId = Math.max(...Object.values(STUDENTS).flat().map(s => s.id), 0);
  lines.forEach((line, i) => {
    const parts = line.split(/[,，\t]/).map(p => p.trim());
    if (parts.length >= 2) {
      importData.push({
        seat: parseInt(parts[0]) || i + 1,
        name: parts[1],
        phone: parts[2] || '',
        parent: parts[3] || '',
        id: ++maxId,
        status: 'present',
        leaveReason: '',
        leaveNote: '',
        leaveDays: 0,
        mark: '',
        boarding: 'inner',
        familyType: '',
        familyNote: '',
        leftBehind: false,
        leftBehindNote: '',
      });
    }
  });
  if (importData.length === 0) {
    showToast('未解析到有效数据', 'error');
    return;
  }
  let rows = importData.map(s => `<tr>
    <td>${s.seat}</td><td style="font-weight:500">${s.name}</td>
    <td>${s.phone || '-'}</td><td>${s.parent || '-'}</td>
  </tr>`).join('');
  document.getElementById('importPreviewArea').innerHTML = `
    <div class="import-preview">
      <table><thead><tr><th>座号</th><th>姓名</th><th>电话</th><th>家长</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div style="margin-top:8px;font-size:12px;color:var(--gray-500)">共解析 <strong style="color:var(--primary)">${importData.length}</strong> 条记录</div>`;
  document.getElementById('importConfirmBtn').style.display = '';
}

function confirmImport() {
  const cls = getHeadteacherClass();
  if (!cls || !STUDENTS[cls]) { showToast('请先设置班级数据', 'warning'); return; }
  importData.forEach(s => {
    if (!STUDENTS[cls].find(st => st.name === s.name)) {
      STUDENTS[cls].push(s);
    }
  });
  hideModal();
  showToast(`成功导入 ${importData.length} 名学生`);
  importData = [];
  navigate('roster');
}

function addStudent() {
  const name = document.getElementById('newStudentName').value.trim();
  if (!name) { showToast('请输入学生姓名', 'warning'); return; }
  const cls = getHeadteacherClass();
  if (!cls) { showToast('请先设置班级数据', 'warning'); return; }
  if (!STUDENTS[cls]) STUDENTS[cls] = [];
  const maxId = STUDENTS[cls].length > 0 ? Math.max(...STUDENTS[cls].map(s => s.id), 0) : 0;
  STUDENTS[cls].push({
    id: maxId + 1,
    name: name,
    seat: parseInt(document.getElementById('newStudentSeat').value) || STUDENTS[cls].length + 1,
    phone: document.getElementById('newStudentPhone').value.trim(),
    parent: document.getElementById('newStudentParent').value.trim(),
    status: 'present',
    leaveReason: '',
    leaveNote: '',
    leaveDays: 0,
    mark: '',
    boarding: 'inner',
    familyType: '',
    familyNote: '',
    leftBehind: false,
    leftBehindNote: '',
  });
  hideModal();
  showToast(`已添加学生：${name}`);
  navigate('roster');
}

function deleteStudent(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  showModal('确认删除', `<p style="font-size:14px">确定要删除学生 <strong>${s.name}</strong> 吗？此操作不可撤销。</p>`,
    `<button class="toolbar-btn ghost" onclick="hideModal()">取消</button>
     <button class="toolbar-btn primary" style="background:var(--danger)" onclick="confirmDeleteStudent('${cls}',${id})">确认删除</button>`);
}

function confirmDeleteStudent(cls, id) {
  const idx = STUDENTS[cls].findIndex(s => s.id === id);
  if (idx > -1) {
    const name = STUDENTS[cls][idx].name;
    STUDENTS[cls].splice(idx, 1);
    hideModal();
    showToast(`已删除学生：${name}`);
    navigate('roster');
  }
}

function exportRoster() {
  const cls = getHeadteacherClass();
  if (!cls || !STUDENTS[cls]) { showToast('暂无数据可导出', 'warning'); return; }
  const sts = STUDENTS[cls];
  let csv = '座号,姓名,联系电话,家长\n';
  sts.forEach(s => { csv += `${s.seat},${s.name},${s.phone},${s.parent}\n`; });
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${cls}_名单.csv`; a.click();
  URL.revokeObjectURL(url);
  showToast('名单已导出');
}

let leaveSelectedStudents = new Set();
let leaveSelectedType = '病假';

function renderLeaveRegister() {

      <button class="toolbar-btn ghost" style="padding:4px 10px;font-size:12px;color:var(--danger)" onclick="cancelLeave('${cls}',${s.id})">销假</button>
    </td>
  </tr>`).join('');

  return `
    <div class="grid-2 mb-24">
      <div class="leave-form-card anim-in anim-d1">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:16px">新建请假登记</h3>
        <div class="form-label">请假类型</div>
        <div class="leave-type-grid">
          <div class="leave-type-btn ${leaveSelectedType==='病假'?'selected':''}" onclick="selectLeaveType('病假',this)">病假</div>
          <div class="leave-type-btn ${leaveSelectedType==='事假'?'selected':''}" onclick="selectLeaveType('事假',this)">事假</div>
          <div class="leave-type-btn ${leaveSelectedType==='就医'?'selected':''}" onclick="selectLeaveType('就医',this)">就医</div>
          <div class="leave-type-btn ${leaveSelectedType==='其他'?'selected':''}" onclick="selectLeaveType('其他',this)">其他</div>
        </div>
        <div class="form-group">
          <label class="form-label">选择学生（点击多选）</label>
          <div class="student-picker" id="studentPicker">${chips}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group">
            <label class="form-label">请假天数</label>
            <input class="form-input" id="leaveDays" type="number" value="1" min="0.5" step="0.5">
          </div>
          <div class="form-group">
            <label class="form-label">开始日期</label>
            <input class="form-input" id="leaveDate" type="date" value="${new Date().toISOString().split('T')[0]}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">详细说明</label>
          <textarea class="form-textarea" id="leaveDetail" placeholder="请输入请假具体原因..."></textarea>
        </div>
        <button class="toolbar-btn primary" style="width:100%;justify-content:center;padding:12px" onclick="submitLeaveRegister()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          提交请假登记
        </button>
      </div>
      <div class="card anim-in anim-d2">
        <div class="card-header">
          <span class="card-title">当前请假记录 (${onLeave.length}人)</span>
        </div>
        <div class="card-body no-pad"><div class="table-wrap">
          <table><thead><tr><th>姓名</th><th>类型</th><th>请假原因</th><th>天数</th><th>家长</th><th>操作</th></tr></thead>
          <tbody>${existingRows || '<tr><td colspan="6" style="text-align:center;color:var(--gray-400);padding:30px">暂无请假记录</td></tr>'}</tbody></table>
        </div></div>
      </div>
    </div>`;
}

function selectLeaveType(type, el) {
  leaveSelectedType = type;
  document.querySelectorAll('.leave-type-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function toggleLeaveStudent(id, el) {
  const s = STUDENTS[getHeadteacherClass()].find(st => st.id === id);
  if (s && s.status === 'leave') return; // already on leave, can't re-select
  if (leaveSelectedStudents.has(id)) {
    leaveSelectedStudents.delete(id);
    el.classList.remove('selected');
  } else {
    leaveSelectedStudents.add(id);
    el.classList.add('selected');
  }
}

function submitLeaveRegister() {
  if (leaveSelectedStudents.size === 0) {
    showToast('请至少选择一名学生', 'warning');
    return;
  }
  const days = parseFloat(document.getElementById('leaveDays').value) || 1;
  const detail = document.getElementById('leaveDetail').value.trim();
  const cls = getHeadteacherClass();
  let count = 0;
  leaveSelectedStudents.forEach(id => {
    const s = STUDENTS[cls].find(st => st.id === id);
    if (s) {
      s.status = 'leave';
      s.leaveReason = leaveSelectedType;
      s.leaveNote = detail;
      s.leaveDays = days;
      count++;
    }
  });
  leaveSelectedStudents.clear();
  saveStudentsToStorage();
  showToast(`已为 ${count} 名学生登记请假`);
  navigate('leave-register');
}

  `, `<button class="toolbar-btn ghost" onclick="hideModal()">取消</button>
      <button class="toolbar-btn primary" onclick="saveLeaveEdit('${cls}',${id})">保存</button>`);

function saveLeaveEdit(cls, id) {
  const s = STUDENTS[cls].find(st => st.id === id);
  if (!s) return;
  s.leaveReason = document.getElementById('editLeaveType').value;
  s.leaveNote = document.getElementById('editLeaveNote').value.trim();

function cancelLeave(cls, id) {

let colGroups = []; // 列分组，如 [2,2,2,2] 表示每2列为一组，空数组表示不分组
let dragSourceSlotIdx = null;
let seatLayout = {}; // 每个班级的座位布局，存储每个位置的学生ID或null

function changeSeatCols(val) {
  seatingCols = Math.max(2, Math.min(12, parseInt(val) || 8));
  // 调整 colGaps 数组大小
  while (colGaps.length < seatingCols - 1) colGaps.push(10);
  if (colGaps.length > seatingCols - 1) colGaps.length = seatingCols - 1;
  navigate('class-seating');
}

function changeSeatRows(val) {
  seatingRows = Math.max(1, Math.min(20, parseInt(val) || 7));
  navigate('class-seating');
}

function changeColGrouping(val) {
  const groupSize = Math.max(1, Math.min(seatingCols, parseInt(val) || 1));
  if (groupSize === 1) {
    colGroups = []; // 不分组，每列独立
  } else {
    // 均匀分组
    colGroups = [];
    let remaining = seatingCols;
    while (remaining > 0) {
      const size = Math.min(groupSize, remaining);
      colGroups.push(size);
      remaining -= size;
    }
  }
  navigate('class-seating');
}

      </div>
    </div>

function doAutoArrange(method) {
  const cls = currentViewClass || getHeadteacherClass();
  const sts = STUDENTS[cls];
  
  switch(method) {
    case 'name':
      sts.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
      break;
    case 'seat':
      sts.sort((a, b) => a.seat - b.seat);
      break;
    case 'rotate':
      // 座位轮换：每个学生向右移动一列
      const cols = seatingCols;
      const rotated = [...sts];
      sts.forEach((s, i) => {
        const row = Math.floor(i / cols);
        const col = i % cols;
        const newCol = (col + 1) % cols;
        const newIdx = row * cols + newCol;
        if (newIdx < sts.length) {
          sts[newIdx] = rotated[i];
        }
      });
      break;
    case 'gender':
      // 男女间隔（随机分配性别）
      const males = sts.filter(() => Math.random() > 0.5);
      const females = sts.filter(s => !males.includes(s));
      let idx = 0;
      for (let i = 0; i < sts.length; i++) {
        if (i % 2 === 0 && males.length > 0) {
          sts[i] = males.pop();
        } else if (females.length > 0) {
          sts[i] = females.pop();
        } else if (males.length > 0) {
          sts[i] = males.pop();
        }
      }
      break;
    case 'random':
      // 完全随机
      for (let i = sts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sts[i], sts[j]] = [sts[j], sts[i]];
      }
      break;
    case 'height':
      // 按身高（模拟：按座号奇偶分组，奇数矮前排）
      const short = sts.filter((_, i) => i % 2 === 0);
      const tall = sts.filter((_, i) => i % 2 === 1);
      let h = 0;
      for (let i = 0; i < sts.length; i++) {
        if (i < sts.length / 2 && short.length > 0) {
          sts[i] = short.shift();
        } else if (tall.length > 0) {
          sts[i] = tall.shift();
        } else {
          sts[i] = short.shift();
        }
      }
      break;
  }
  
  // 更新座号
  sts.forEach((s, i) => { s.seat = i + 1; });
  
  // 更新座位布局
  const cols = seatingCols;
  const totalRows = seatingRows > 0 ? seatingRows : Math.ceil(sts.length / cols);
  const totalSlots = totalRows * cols;
  const studentCount = sts.length;
  const emptyCount = Math.max(0, totalSlots - studentCount);
  
  // 重建布局：空位在前，学生按新顺序排列
  seatLayout[cls] = [];
  for (let i = 0; i < emptyCount; i++) seatLayout[cls].push(null);
  for (let i = 0; i < studentCount; i++) seatLayout[cls].push(sts[i].id);
  
  saveStudentsToStorage();
  hideModal();
  showToast('座位已重新排列');
  navigate('class-seating');
}

/* ----- Drag & Drop ----- */
function onSeatDragStart(e, slotIdx) {
  dragSourceSlotIdx = slotIdx;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', slotIdx);
}

function onSeatDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const seat = e.target.closest('.seat');
  if (seat) {
    document.querySelectorAll('.seat.drag-over').forEach(s => s.classList.remove('drag-over'));
    seat.classList.add('drag-over');
  }
}

function onSeatDrop(e, targetSlotIdx) {
  e.preventDefault();
  document.querySelectorAll('.seat.drag-over').forEach(s => s.classList.remove('drag-over'));
  
  if (dragSourceSlotIdx === null || dragSourceSlotIdx === targetSlotIdx) return;
  
  const cls = currentViewClass || getHeadteacherClass();
  const sts = STUDENTS[cls];
  const cols = seatingCols;
  const totalRows = seatingRows > 0 ? seatingRows : Math.ceil(sts.length / cols);
  const totalSlots = totalRows * cols;
  
  // 确保布局已初始化
  if (!seatLayout[cls] || seatLayout[cls].length !== totalSlots) {
    const studentCount = sts.length;
    const emptyCount = Math.max(0, totalSlots - studentCount);
    seatLayout[cls] = [];
    for (let i = 0; i < emptyCount; i++) seatLayout[cls].push(null);
    for (let i = 0; i < studentCount; i++) seatLayout[cls].push(sts[i].id);
  }
  
  // 直接交换两个位置
  const temp = seatLayout[cls][dragSourceSlotIdx];
  seatLayout[cls][dragSourceSlotIdx] = seatLayout[cls][targetSlotIdx];
  seatLayout[cls][targetSlotIdx] = temp;
  
  // 更新学生的座号（按布局顺序）
  let seatNum = 1;
  for (let i = 0; i < totalSlots; i++) {
    const studentId = seatLayout[cls][i];
    if (studentId !== null) {
      const student = sts.find(s => s.id === studentId);
      if (student) student.seat = seatNum++;
    }
  }
  
  saveStudentsToStorage();
  dragSourceSlotIdx = null;
  navigate('class-seating');
}

function onSeatDragEnd(e) {
  dragSourceSlotIdx = null;
  document.querySelectorAll('.seat.dragging, .seat.drag-over').forEach(s => {
    s.classList.remove('dragging', 'drag-over');
  });
}

/* ----- Column Gap Resize ----- */
let resizingGapIdx = -1;
let resizeStartX = 0;
let resizeStartGap = 0;

function startColResize(e, gapIdx) {
  if (!seatingEditMode) return;
  resizingGapIdx = gapIdx;
  resizeStartX = e.clientX;
  resizeStartGap = colGaps[gapIdx] || 10;
  e.preventDefault();
  e.stopPropagation();
  
  document.addEventListener('mousemove', doColResize);
  document.addEventListener('mouseup', stopColResize);
}

function doColResize(e) {
  if (resizingGapIdx < 0) return;
  const dx = e.clientX - resizeStartX;
  const newGap = Math.max(4, Math.min(40, resizeStartGap + dx));
  colGaps[resizingGapIdx] = newGap;
  
  // 更新所有列间距handle的宽度
  document.querySelectorAll('.col-gap-handle').forEach(handle => {
    const idx = parseInt(handle.dataset.gapIdx);
    if (idx === resizingGapIdx) {
      handle.style.width = newGap + 'px';
    }
  });
}

function stopColResize(e) {
  resizingGapIdx = -1;
  document.removeEventListener('mousemove', doColResize);
  document.removeEventListener('mouseup', stopColResize);
}

  }
  
  if (xqSetAdminKey(key)) {

    // 立即同步一次
    xqSaveAllConfigToServer().then(result => {

    });
  } else {

async function clearSemesterData() {
  if (!confirm('确定要清除本学期所有学生记录吗？此操作不可恢复！')) return;
  if (!confirm('再次确认：清除后所有考勤、行为、成绩记录将被删除，但学校配置保留。')) return;
  
  const result = await xqClearSemesterData();
  if (result.ok) {
    showToast(`已清除 ${result.deletedRecords || 0} 条记录`);
    // 刷新页面
    setTimeout(() => location.reload(), 1500);
  } else {
    showToast('清除失败: ' + (result.error || '未知错误'), 'error');
  }
}

function importClassesFromExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  readExcelFile(file, function(data) {
    if (!data || data.length < 2) { showToast('文件内容为空', 'error'); return; }
    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(data.length, 10); i++) {
      const row = data[i].map(c => String(c).trim());
      if (row.some(c => c.includes('班级') || c === '班')) { headerRowIdx = i; break; }
    }
    if (headerRowIdx === -1) { showToast('未找到"班级"列', 'error'); return; }
    
    const header = data[headerRowIdx].map(c => String(c).trim());
    let gradeCol = -1, classCol = -1, countCol = -1;
    header.forEach((c, i) => {
      if (c.includes('年级')) gradeCol = i;
      else if (c.includes('班级') || c === '班') classCol = i;
      else if (c.includes('人数') || c.includes('学生')) countCol = i;
    });
    
    const imported = [];
    for (let i = headerRowIdx + 1; i < data.length; i++) {
      const row = data[i];
      const className = String(row[classCol] || '').trim();
      if (!className) continue;
      const grade = gradeCol >= 0 ? String(row[gradeCol] || '').trim() : '';
      const count = countCol >= 0 ? parseInt(row[countCol]) || 0 : 0;
      imported.push({ grade, name: className, studentCount: count });
    }
    
    if (imported.length === 0) { showToast('未解析到有效数据', 'error'); return; }
    setupClasses = setupClasses.concat(imported);
    showToast(`成功导入 ${imported.length} 个班级`);
    renderSetupContent();
  });
  event.target.value = '';
}

  showToast('已清空所有授课分配数据');
  renderSetupContent();
}

function importTeachingFromExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  readExcelFile(file, function(data) {
    if (!data || data.length < 2) { showToast('文件内容为空', 'error'); return; }
    
    let headerRowIdx = -1;
    let headerRow = null;
    for (let i = 0; i < Math.min(data.length, 10); i++) {
      const row = data[i].map(c => String(c).trim());
      const hasClass = row.some(c => c.includes('班级') || c === '班');
      const hasSubject = row.some(c => isSubjectColumn(c));
      if (hasClass && hasSubject) { headerRowIdx = i; headerRow = row; break; }
    }
    
    if (headerRowIdx === -1) { showToast('未找到有效表头（需包含"班级"和科目）', 'error'); return; }
    
    let gradeCol = -1, classCol = -1, teacherCol = -1;
    let subjectCols = {};
    headerRow.forEach((cell, idx) => {
      const c = String(cell).trim();
      if (c.includes('年级')) gradeCol = idx;
      else if (c.includes('班级') || c === '班') classCol = idx;
      else if (c.includes('班主任')) teacherCol = idx;
      else if (isSubjectColumn(c)) subjectCols[extractSubjectName(c)] = idx;
    });
    
    const imported = [];
    for (let i = headerRowIdx + 1; i < data.length; i++) {
      const row = data[i];
      const className = String(row[classCol] || '').trim();
      if (!className) continue;
      const grade = gradeCol >= 0 ? String(row[gradeCol] || '').trim() : '';
      const headteacher = teacherCol >= 0 ? String(row[teacherCol] || '').trim() : '';
      
      const subjects = {};
      Object.entries(subjectCols).forEach(([subj, colIdx]) => {
        const teacher = String(row[colIdx] || '').trim();
        if (teacher && teacher !== '/' && teacher !== '-') subjects[subj] = teacher;
      });
      
      imported.push({ grade, name: className, headteacher, subjects });
    }
    
    if (imported.length === 0) { showToast('未解析到有效数据', 'error'); return; }
    setupTeaching = setupTeaching.concat(imported);
    showToast(`成功导入 ${imported.length} 个班级的授课安排`);
    renderSetupContent();
  });
  event.target.value = '';
}

// 设置/修改教师密码弹窗
function showSetPasswordModal(name, roleLabel) {
  const hasPassword = xqCredentials[name] && xqCredentials[name].passwordHash;
  const title = hasPassword ? `修改 ${name} 的密码` : `为 ${name} 设置密码`;

  `, `<button class="toolbar-btn ghost" onclick="hideModal()">取消</button>

async function doSetPassword(name) {
  const p1 = document.getElementById('setPwdPassword').value.trim();
  const p2 = document.getElementById('setPwdConfirm').value.trim();
  
  if (!p1 || p1.length < 4) {
    showToast('密码至少4位', 'warning');
    return;
  }
  if (p1 !== p2) {
    showToast('两次密码不一致', 'warning');
    return;
  }
  
  // 使用新的角色推导逻辑
  const roleInfo = getUserRoleInfo(name);
  const role = roleInfo?.role || 'teacher';
  const classes = roleInfo?.classes || [];
  const subject = roleInfo?.subject || null;
  
  const result = await setUserPassword(name, p1, role, classes, subject);
  
  if (result.ok) {
    showToast(`已为 ${name} 设置密码`);
    hideModal();
    renderSetupContent();
  } else {
    showToast('设置失败: ' + (result.error || '未知错误'), 'error');
  }
}

/* ===== APPLY FUNCTIONS ===== */
function applyTeachingDataFromSetup() {
  const teacherMap = {};
  const headteacherMap = {};
  
  setupTeaching.forEach(t => {
    if (t.headteacher) {
      if (!headteacherMap[t.headteacher]) headteacherMap[t.headteacher] = [];
      headteacherMap[t.headteacher].push(t.name);
    }
    
    Object.entries(t.subjects || {}).forEach(([subj, teacher]) => {
      if (!teacherMap[teacher]) teacherMap[teacher] = { subjects: new Set(), classes: new Set() };
      teacherMap[teacher].subjects.add(subj);
      teacherMap[teacher].classes.add(t.name);
    });
  });
  
  Object.values(teacherMap).forEach(t => {
    t.subjects = Array.from(t.subjects);
    t.classes = Array.from(t.classes);
  });
  
  SCHOOL.teacherClasses = teacherMap;
  SCHOOL.headteacherClasses = headteacherMap;
  SCHOOL.importedClasses = setupTeaching;
}

// Apply role assignment data - 现在只处理领导，班主任和科任教师从授课分配推导
async function applyRolesData(data) {
  // 只处理领导角色
  const leaders = data.filter(r => r.role === 'leader');
  
  // 从授课分配推导班主任和科任教师
  const headteacherMap = {};
  const teacherMap = {};
  
  setupTeaching.forEach(t => {
    // 班主任
    if (t.headteacher) {
      if (!headteacherMap[t.headteacher]) {
        headteacherMap[t.headteacher] = [];
      }
      headteacherMap[t.headteacher].push(t.name);
    }
    
    // 科任教师
    Object.entries(t.subjects || {}).forEach(([subj, teacher]) => {
      if (teacher && teacher !== t.headteacher) {
        if (!teacherMap[teacher]) {
          teacherMap[teacher] = { subjects: new Set(), classes: new Set() };
        }
        teacherMap[teacher].subjects.add(subj);
        teacherMap[teacher].classes.add(t.name);
      }
    });
  });
  
  // 构建 headteachers 数组
  const headteachers = Object.entries(headteacherMap).map(([name, classes]) => ({
    name,
    username: name,
    classes
  }));
  
  // 构建 teachers 数组
  const teachers = Object.entries(teacherMap).map(([name, info]) => ({
    name,
    username: name,
    classes: Array.from(info.classes),
    subject: Array.from(info.subjects)[0] || null
  }));
  
  SCHOOL.importedUsers = {
    leaders: leaders.map(r => ({ name: r.name, username: r.username, password: r.password })),
    headteachers: headteachers,
    teachers: teachers
  };
  
  // 同步领导凭证到凭证系统
  for (const user of leaders) {
    if (user.name && user.password) {
      if (!xqCredentials[user.name] || xqCredentials[user.name]._needsUpdate) {
        await setUserPassword(user.name, user.password, 'leader', [], null);
      }
    }
  }
  
  // 为班主任和科任教师自动创建或更新凭证
  for (const ht of headteachers) {
    if (!xqCredentials[ht.name]) {
      // 自动生成默认密码
      await setUserPassword(ht.name, '123456', 'headteacher', ht.classes, null);
    } else {
      // 更新已有凭证的班级和角色信息（保留原密码）
      xqCredentials[ht.name].role = 'headteacher';
      xqCredentials[ht.name].classes = ht.classes;
      xqCredentials[ht.name].updatedAt = new Date().toISOString();
    }
  }
  for (const t of teachers) {
    if (!xqCredentials[t.name]) {
      await setUserPassword(t.name, '123456', 'teacher', t.classes, t.subject);
    } else {
      // 更新已有凭证的班级和科目信息（保留原密码）
      xqCredentials[t.name].role = 'teacher';
      xqCredentials[t.name].classes = t.classes;
      xqCredentials[t.name].subject = t.subject;
      xqCredentials[t.name].updatedAt = new Date().toISOString();
    }
  }
  // 保存更新后的凭证
  await xqSaveCredentials();
  
  applyImportedUsers();
}

// Apply imported users to USERS and TEACHER_CLASSES
function applyImportedUsers() {
  if (!SCHOOL.importedUsers) return;
  
  const leaders = SCHOOL.importedUsers.leaders || [];
  const headteachers = SCHOOL.importedUsers.headteachers || [];
  const teachers = SCHOOL.importedUsers.teachers || [];
  
  if (leaders.length > 0) USERS.leader = { name: leaders[0].name, role: '校领导', avatar: leaders[0].name.charAt(0) };
  if (headteachers.length > 0) {
    const ht = headteachers[0];
    USERS.headteacher = { name: ht.name, role: ht.classes.length > 0 ? ht.classes[0] + '班主任' : '班主任', avatar: ht.name.charAt(0) };
  }
  if (teachers.length > 0) {
    const t = teachers[0];
    USERS.teacher = { name: t.name, role: t.subject ? t.subject + '教师' : '科任教师', avatar: t.name.charAt(0) };
  }
  
  if (headteachers.length > 0) {
    TEACHER_CLASSES.headteacher = {};
    headteachers.forEach(ht => ht.classes.forEach(cls => TEACHER_CLASSES.headteacher[cls] = '班主任'));
  }
  if (teachers.length > 0) {
    TEACHER_CLASSES.teacher = {};
    teachers.forEach(t => t.classes.forEach(cls => TEACHER_CLASSES.teacher[cls] = t.subject || '科任'));
  }
}

function loadSchoolConfigFromStorage() {
  try {
    const data = localStorage.getItem('school_config_data');

      const config = JSON.parse(data);
      if (config.SCHOOL) {
        if (config.SCHOOL.grades) SCHOOL.grades = config.SCHOOL.grades;

        if (config.SCHOOL.importedClasses) SCHOOL.importedClasses = config.SCHOOL.importedClasses;

        if (config.SCHOOL.importedUsers) SCHOOL.importedUsers = config.SCHOOL.importedUsers;
      }
      if (config.USERS) Object.assign(USERS, config.USERS);
      if (config.TEACHER_CLASSES) {
        if (config.TEACHER_CLASSES.headteacher) TEACHER_CLASSES.headteacher = config.TEACHER_CLASSES.headteacher;
        if (config.TEACHER_CLASSES.teacher) TEACHER_CLASSES.teacher = config.TEACHER_CLASSES.teacher;

      return true;
    }

  return false;
}

// Helper: Read Excel file and return array of arrays
function readExcelFile(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
      callback(jsonData);
    } catch (err) {
      showToast('文件解析失败：' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Known subject keywords for column detection
const SUBJECT_KEYWORDS = ['语文', '数学', '英语', '物理', '化学', '生物', '历史', '地理', '道法', '道德与法治', '政治', '音乐', '美术', '体育', '信息技术', '信息', '科学', '综合实践', '班心团劳', '心理', '班会', '文体活动', '心理辅导'];

function isSubjectColumn(header) {
  const h = String(header).trim();
  for (const kw of SUBJECT_KEYWORDS) {
    if (h.includes(kw) || h.startsWith(kw)) return true;
  }
  return false;
}

function extractSubjectName(header) {
  const h = String(header).trim();
  for (const kw of SUBJECT_KEYWORDS) {
    if (h.includes(kw) || h.startsWith(kw)) return kw;
  }
  return h.replace(/\d+$/, '').trim();
}
