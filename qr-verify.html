<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>扫码验证 - 宠物世界</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #ffe6dd, #ffd4e8, #ffe0f0);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.verify-container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 24px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(255, 180, 160, 0.3);
  text-align: center;
}
.verify-title {
  font-size: 24px;
  color: #c04058;
  margin-bottom: 20px;
  font-weight: 700;
}
.verify-icon {
  font-size: 60px;
  margin-bottom: 16px;
}
.verify-msg {
  font-size: 15px;
  color: #666;
  line-height: 1.8;
  margin-bottom: 24px;
}
.verify-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  background: linear-gradient(135deg, #52c41a, #389e0d);
  color: white;
}
.verify-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(82, 196, 26, 0.4);
}
.verify-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.verify-status {
  margin-top: 16px;
  padding: 12px;
  border-radius: 12px;
  font-size: 14px;
  display: none;
}
.verify-status.success {
  display: block;
  background: #f0fff0;
  color: #389e0d;
  border: 1px solid #90ee90;
}
.verify-status.error {
  display: block;
  background: #fff5f5;
  color: #e74c3c;
  border: 1px solid #ffb0b0;
}
.verify-status.loading {
  display: block;
  background: #fffbe6;
  color: #d4a017;
  border: 1px solid #ffd080;
}
</style>
</head>
<body>
<div class="verify-container">
  <div class="verify-icon">📷</div>
  <div class="verify-title">扫码登录</div>
  <div class="verify-msg" id="verifyMsg">
    请从宠物世界应用内扫码<br>此页面不支持直接验证
  </div>
  <div class="verify-status error" id="verifyStatus">
    请使用手机打开宠物世界网站，点击右上角的📷扫码图标进行扫描
  </div>
</div>
</body>
</html>
