<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考试计时器</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg:#070b14;
    --fg:#e8eefc;
    --muted:#5c6b83;
    --accent:#38bdf8;
    --warn:#fbbf24;
    --danger:#f87171;
  }

  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--fg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    cursor:default;
  }

  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%,   rgba(56,189,248,.10), transparent 65%),
      radial-gradient(ellipse 60% 45% at 50% 100%, rgba(129,140,248,.08), transparent 65%);
    transition:background .8s;
  }
  body.mode-warn::before{
    background:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(251,191,36,.10), transparent 65%);
  }
  body.mode-danger::before,
  body.mode-over::before{
    background:radial-gradient(ellipse 80% 60% at 50% 50%, rgba(248,113,113,.13), transparent 70%);
  }

  /* ===== 左上角学校徽标 ===== */
  .school-badge{
    position:fixed;
    top:2vh;
    left:2.5vw;
    z-index:50;
    padding:.35em .95em;
    font-size:clamp(.95rem,1.9vmin,1.4rem);
    font-weight:600;
    letter-spacing:.16em;
    color:rgba(232,238,252,.85);
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);
    border-radius:10px;
    cursor:pointer;
    transition:all .2s;
    white-space:nowrap;
    max-width:34vw;
    overflow:hidden;
    text-overflow:ellipsis;
    backdrop-filter:blur(8px);
  }
  .school-badge:hover{
    color:var(--accent);
    background:rgba(56,189,248,.08);
    border-color:rgba(56,189,248,.28);
    box-shadow:0 0 20px rgba(56,189,248,.15);
  }
  .school-badge:empty{display:none}

  /* ===== 右下角悬浮签名 ===== */
  .corner-mark{
    position:fixed;
    right:2.5vw;
    bottom:2vh;
    z-index:60;
    padding:.32em .85em;
    font-size:clamp(.72rem,1.5vmin,1rem);
    font-weight:500;
    letter-spacing:.14em;
    white-space:nowrap;
    color:rgba(232,238,252,.38);
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);
    border-radius:999px;
    backdrop-filter:blur(8px);
    pointer-events:none;
    user-select:none;
    text-shadow:0 0 14px rgba(56,189,248,.25);
    animation:fadeUp 1.1s cubic-bezier(.2,.8,.3,1) both;
  }
  .corner-mark b{
    font-weight:600;
    color:rgba(56,189,248,.62);
  }

  /* ===== 整体布局 ===== */
  .stage{
    position:relative;
    height:100vh;height:100dvh;
    display:grid;
    grid-template-rows:auto auto 1fr auto;
    padding:7vh 4vw 4vh;
    z-index:1;
  }

  /* ===== 顶栏 ===== */
  .topbar{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:clamp(1.5rem,5vw,4rem);
    font-size:clamp(2rem,4.2vmin,3.4rem);
    font-weight:500;
    animation:fadeDown .8s cubic-bezier(.2,.8,.3,1) both;
  }

  .info{
    display:flex;
    align-items:center;
    gap:.35em;
    white-space:nowrap;
  }

  .label{
    color:var(--muted);
    letter-spacing:.1em;
    font-weight:400;
  }

  .subject{
    color:var(--fg);
    font-weight:600;
    letter-spacing:.12em;
  }

  .time-pill{
    font-family:inherit;
    font-size:inherit;
    font-weight:600;
    letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    background:rgba(56,189,248,.10);
    border:1px solid rgba(56,189,248,.22);
    border-radius:9px;
    padding:.28em .5em;
    cursor:pointer;
    outline:none;
    color-scheme:dark;
    transition:background .2s,border-color .2s;
    width:7.4em;
    text-align:center;
  }
  .time-pill:hover{
    background:rgba(56,189,248,.18);
    border-color:rgba(56,189,248,.45);
  }
  .time-pill:focus{
    border-color:var(--accent);
    background:rgba(56,189,248,.22);
  }
  .time-pill::-webkit-calendar-picker-indicator{
    cursor:pointer;
    opacity:.55;
    transition:opacity .2s;
  }
  .time-pill:hover::-webkit-calendar-picker-indicator{opacity:1}

  .sep{
    color:var(--muted);
    margin:0 .1em;
    letter-spacing:.1em;
  }

  /* ===== 日期栏 ===== */
  .datebar{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:.55em;
    margin-top:clamp(1.6rem,4vh,3rem);
    font-size:clamp(1.6rem,3.2vmin,2.5rem);
    letter-spacing:.1em;
    font-variant-numeric:tabular-nums;
    color:rgba(232,238,252,.78);
    animation:fadeDown .9s cubic-bezier(.2,.8,.3,1) both;
  }
  .datebar .weekday{
    color:var(--accent);
    font-weight:600;
    letter-spacing:.15em;
  }
  .datebar .beijing{
    color:var(--muted);
    font-weight:400;
    letter-spacing:.14em;
    margin-left:.35em;
  }
  .datebar .clock{
    color:#eaf4ff;
    font-weight:600;
    letter-spacing:.08em;
    text-shadow:0 0 20px rgba(56,189,248,.35);
  }

  /* ===== 中部 ===== */
  .timer{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2vh;
  }

  .count-label{
    font-size:clamp(1.7rem,3.8vmin,3.2rem);
    color:rgba(232,238,252,.72);
    letter-spacing:.22em;
    font-weight:400;
    text-align:center;
    transition:color .5s;
  }
  .mode-over .count-label{color:rgba(248,113,113,.9)}

  .digits{
    font-size:clamp(3rem,18vmin,340px);
    font-weight:300;
    line-height:1.05;
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    color:#eaf4ff;
    text-shadow:0 0 90px rgba(56,189,248,.22);
    transition:color .5s,text-shadow .5s;
    white-space:nowrap;
  }

  .mode-warn .digits{
    color:#fde68a;
    text-shadow:0 0 90px rgba(251,191,36,.40);
  }
  .mode-danger .digits{
    color:#fca5a5;
    text-shadow:0 0 100px rgba(248,113,113,.50);
    animation:pulse 1s ease-in-out infinite;
  }
  .mode-over .digits{
    color:#f87171;
    text-shadow:0 0 120px rgba(248,113,113,.65);
    animation:pulse .85s ease-in-out infinite;
  }

  .progress{
    width:min(64vw,820px);
    height:7px;
    margin-top:4vh;
    border-radius:99px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
  }
  .progress i{
    display:block;
    height:100%;
    width:100%;
    border-radius:99px;
    background:linear-gradient(90deg,#38bdf8,#818cf8);
    transition:background .6s;
  }
  .mode-warn .progress i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .mode-danger .progress i,
  .mode-over  .progress i{background:linear-gradient(90deg,#f87171,#ef4444)}

  /* ===== 底栏 ===== */
  .bottom{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(2.6rem,6.5vh,4.5rem);
  }

  .slogan{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:clamp(1.2rem,4vw,3.5rem);
    font-size:clamp(2.6rem,6.5vmin,5.2rem);
    font-weight:700;
    letter-spacing:.3em;
    text-indent:.3em;
    text-align:center;
    line-height:1.4;
  }

  .slogan span{
    background:linear-gradient(135deg,#38bdf8 0%,#818cf8 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(56,189,248,.5));
  }

  .slogan span:last-child{
    background:linear-gradient(135deg,#fbbf24 0%,#f97316 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(251,191,36,.5));
  }

  .controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
  }

  .btn{
    padding:.8em 2em;
    font-family:inherit;
    font-size:clamp(.85rem,1.7vmin,1.05rem);
    letter-spacing:.1em;
    color:var(--fg);
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    cursor:pointer;
    transition:background .2s,border-color .2s,transform .1s,color .2s;
    backdrop-filter:blur(8px);
  }
  .btn:hover{
    background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.24);
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#04121f;
    font-weight:600;
  }
  .btn.primary:hover{background:#5ccbfa;border-color:#5ccbfa}

  /* ===== 设置面板 ===== */
  .overlay{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;
    background:rgba(4,7,14,.82);
    backdrop-filter:blur(14px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto}

  .panel{
    width:min(94vw,520px);
    max-height:90vh;
    overflow-y:auto;
    padding:clamp(24px,4vw,36px);
    background:#0e1626;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    box-shadow:0 40px 90px rgba(0,0,0,.7);
    transform:translateY(14px) scale(.98);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);
  }
  .overlay.show .panel{transform:none}

  .panel h2{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:.14em;
    margin-bottom:1.5em;
    color:var(--fg);
  }

  .field{margin-bottom:1.3em}
  .field label{
    display:block;
    margin-bottom:.55em;
    font-size:.78rem;
    letter-spacing:.14em;
    color:#7b8ba6;
  }

  input[type=text],input[type=number],input[type=time]{
    width:100%;
    padding:.8em 1em;
    font-family:inherit;
    font-size:1rem;
    color:var(--fg);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;
    outline:none;
    transition:border-color .2s,background .2s;
    color-scheme:dark;
  }
  input:focus{
    border-color:var(--accent);
    background:rgba(56,189,248,.07);
  }
  input[type=number],input[type=time]{font-variant-numeric:tabular-nums}
  input[type=time]{letter-spacing:.06em}

  .input-with-btn{display:flex;gap:8px}
  .input-with-btn input{flex:1;min-width:0}
  .btn-handwrite{
    flex-shrink:0;
    padding:0 1.15em;
    font-family:inherit;
    font-size:.85rem;
    letter-spacing:.06em;
    color:var(--accent);
    background:rgba(56,189,248,.10);
    border:1px solid rgba(56,189,248,.25);
    border-radius:11px;
    cursor:pointer;
    transition:all .18s;
    white-space:nowrap;
  }
  .btn-handwrite:hover{
    background:rgba(56,189,248,.22);
    border-color:rgba(56,189,248,.5);
  }
  .btn-handwrite:active{transform:scale(.97)}

  .seg{
    display:flex;
    gap:4px;
    padding:4px;
    margin-bottom:1.3em;
    background:rgba(255,255,255,.05);
    border-radius:12px;
  }
  .seg button{
    flex:1;
    padding:.62em .4em;
    font-family:inherit;
    font-size:.85rem;
    letter-spacing:.06em;
    color:#7b8ba6;
    background:transparent;
    border:none;
    border-radius:9px;
    cursor:pointer;
    transition:all .18s;
  }
  .seg button:hover{color:var(--fg)}
  .seg button.on{
    color:var(--accent);
    background:rgba(56,189,248,.16);
    font-weight:600;
  }

  .chips{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .chip{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:.2em;
    padding:.6em .9em;
    font-family:inherit;
    text-align:left;
    color:#c3cfdf;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.09);
    border-radius:11px;
    cursor:pointer;
    transition:all .18s;
  }
  .chip:hover{color:var(--fg);background:rgba(255,255,255,.09)}
  .chip.on{
    color:var(--accent);
    background:rgba(56,189,248,.12);
    border-color:rgba(56,189,248,.45);
  }
  .chip .chip-name{
    font-size:.9rem;
    font-weight:600;
    letter-spacing:.06em;
  }
  .chip .chip-time{
    font-size:.72rem;
    letter-spacing:.03em;
    color:#7b8ba6;
    font-variant-numeric:tabular-nums;
  }
  .chip.on .chip-time{color:rgba(56,189,248,.85)}

  .preview{
    margin-top:1.3em;
    padding:.85em 1.05em;
    font-size:.88rem;
    letter-spacing:.05em;
    color:#93a4bd;
    background:rgba(56,189,248,.06);
    border:1px solid rgba(56,189,248,.14);
    border-radius:11px;
    font-variant-numeric:tabular-nums;
    transition:all .2s;
    text-align:center;
  }
  .preview b{color:var(--fg);font-weight:600;font-size:1.05em}
  .preview.error{
    color:#fca5a5;
    background:rgba(248,113,113,.08);
    border-color:rgba(248,113,113,.22);
  }

  .panel-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:1.8em;
  }

  /* ===== 手写输入弹窗 ===== */
  .hw-modal{
    position:fixed;inset:0;z-index:200;
    display:grid;place-items:center;
    background:rgba(4,7,14,.9);
    backdrop-filter:blur(16px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .hw-modal.show{opacity:1;pointer-events:auto}

  .hw-panel{
    width:min(94vw,560px);
    max-height:92vh;
    overflow-y:auto;
    padding:clamp(22px,3.4vw,30px);
    background:#0e1626;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    box-shadow:0 40px 90px rgba(0,0,0,.75);
    transform:translateY(14px) scale(.98);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);
  }
  .hw-modal.show .hw-panel{transform:none}

  .hw-panel h3{
    font-size:1rem;
    font-weight:600;
    letter-spacing:.16em;
    margin-bottom:.7em;
    color:var(--fg);
  }

  .hw-hint{
    font-size:.82rem;
    color:#7b8ba6;
    letter-spacing:.06em;
    line-height:1.6;
    margin-bottom:1.1em;
  }

  #hwCanvas{
    display:block;
    width:100%;
    height:240px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    cursor:crosshair;
    touch-action:none;
  }
  #hwCanvas:hover{border-color:rgba(255,255,255,.18)}

  .hw-candidates{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:1em;
    min-height:2.6em;
    align-items:center;
  }
  .hw-candidates:empty::before{
    content:'识别结果将显示在这里';
    font-size:.82rem;
    color:#4b5b73;
    letter-spacing:.06em;
  }

  .hw-candidate{
    padding:.45em 1em;
    font-family:inherit;
    font-size:1.15rem;
    color:var(--fg);
    background:rgba(56,189,248,.12);
    border:1px solid rgba(56,189,248,.3);
    border-radius:9px;
    cursor:pointer;
    transition:all .15s;
    font-weight:500;
  }
  .hw-candidate:hover{
    background:rgba(56,189,248,.24);
    border-color:rgba(56,189,248,.55);
    transform:translateY(-1px);
  }

  .hw-status{
    font-size:.85rem;
    color:#7b8ba6;
    letter-spacing:.05em;
  }
  .hw-status.error{color:#fca5a5}
  .hw-status.ok{color:#86efac}

  .hw-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:1.4em;
  }

  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.35}
  }
  @keyframes fadeDown{
    from{opacity:0;transform:translateY(-14px)}
    to{opacity:1;transform:none}
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  @media (max-width:640px){
    .school-badge{
      top:1.5vh;left:3vw;
      font-size:.78rem;
      letter-spacing:.1em;
      padding:.28em .7em;
      max-width:44vw;
    }
    .corner-mark{
      right:3vw;
      bottom:1.4vh;
      font-size:.68rem;
      letter-spacing:.08em;
      padding:.26em .65em;
    }
    .stage{padding:6vh 5vw 3vh}
    .topbar{gap:.9rem 1.4rem;font-size:clamp(1.2rem,4vmin,1.9rem)}
    .time-pill{width:6em}
    .datebar{font-size:clamp(1rem,3.4vmin,1.6rem);gap:.4em;margin-top:clamp(1rem,2.6vh,1.8rem)}
    .count-label{font-size:clamp(1.2rem,4.4vmin,2rem)}
    .progress{width:82vw}
    .controls{gap:8px}
    .btn{padding:.7em 1.4em}
    .chips{grid-template-columns:1fr}
    .bottom{gap:clamp(1.8rem,5vh,3rem)}
    .slogan{letter-spacing:.15em;text-indent:.15em;font-size:clamp(2rem,7.5vmin,3.2rem)}
  }
</style>
</head>
<body class="mode-normal">

  <!-- ===== 左上角学校徽标（默认：九圩中学） ===== -->
  <div class="school-badge" id="schoolBadge" title="点击修改学校名称">九圩中学</div>

  <div class="stage">

    <header class="topbar">
      <div class="info">
        <span class="label">考试科目：</span>
        <span class="subject" id="subjectLabel">语文</span>
      </div>
      <div class="info">
        <span class="label">考试时间：</span>
        <input type="time" id="startPicker" class="time-pill" value="09:00" aria-label="开始时间">
        <span class="sep">至</span>
        <input type="time" id="endPicker" class="time-pill" value="11:30" aria-label="结束时间">
      </div>
    </header>

    <div class="datebar" id="datebar"></div>

    <main class="timer">
      <div class="count-label" id="countdownLabel">距离考试结束：</div>
      <div class="digits" id="digits">02:30:00</div>
      <div class="progress"><i id="progressBar"></i></div>
    </main>

    <footer class="bottom">
      <div class="slogan">
        <span>严肃考风考纪</span>
        <span>认真规范答题</span>
      </div>
      <div class="controls">
        <button class="btn primary" id="btnToggle">暂停</button>
        <button class="btn" id="btnSettings">设置</button>
        <button class="btn" id="btnFullscreen">全屏</button>
      </div>
    </footer>

  </div>

  <!-- ===== 设置面板 ===== -->
  <div class="overlay" id="overlay">
    <div class="panel" role="dialog" aria-modal="true" aria-label="考试设置">
      <h2>考 试 设 置</h2>

      <div class="field">
        <label for="schoolInput">学校名称</label>
        <div class="input-with-btn">
          <input type="text" id="schoolInput" maxlength="20" placeholder="如：九圩中学">
          <button type="button" class="btn-handwrite" id="btnHandwrite" title="手写输入">✎ 手写</button>
        </div>
      </div>

      <div class="field">
        <label for="subjectInput">科目名称</label>
        <input type="text" id="subjectInput" maxlength="12" placeholder="如：语文">
      </div>

      <div class="field">
        <label for="startInput">开始时间</label>
        <input type="time" id="startInput">
      </div>

      <div class="seg" id="modeSeg">
        <button type="button" data-mode="duration" class="on">按时长设置</button>
        <button type="button" data-mode="endtime">按结束时间设置</button>
      </div>

      <div id="paneDuration">
        <div class="field">
          <label for="minutesInput">考试时长（分钟）</label>
          <input type="number" id="minutesInput" min="1" max="600" step="1">
        </div>
        <div class="field" style="margin-bottom:0">
          <label>常用科目（点击填入）</label>
          <div class="chips" id="presetChips"></div>
        </div>
      </div>

      <div id="paneEndtime" hidden>
        <div class="field" style="margin-bottom:0">
          <label for="endInput">结束时间</label>
          <input type="time" id="endInput">
        </div>
      </div>

      <p class="preview" id="preview"></p>

      <div class="panel-actions">
        <button class="btn" id="btnCancel">取消</button>
        <button class="btn primary" id="btnApply">确定</button>
      </div>
    </div>
  </div>

  <!-- ===== 手写输入弹窗 ===== -->
  <div class="hw-modal" id="hwModal">
    <div class="hw-panel" role="dialog" aria-modal="true" aria-label="手写输入">
      <h3>手 写 输 入</h3>
      <p class="hw-hint">在下方区域内书写文字，然后点击「识别」。识别结果会出现在下方，点选即可填入学校名称。</p>

      <canvas id="hwCanvas"></canvas>

      <div class="hw-candidates" id="hwCandidates"></div>

      <div class="hw-actions">
        <button type="button" class="btn" id="hwClear">清除</button>
        <button type="button" class="btn primary" id="hwRecognize">识别</button>
        <button type="button" class="btn" id="hwClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- ===== 右下角悬浮签名 ===== -->
  <div class="corner-mark" aria-hidden="true">考试计时器<b>@吴胜闯老师</b></div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);

  const els = {
    schoolBadge:   $('schoolBadge'),
    subject:       $('subjectLabel'),
    startPicker:   $('startPicker'),
    endPicker:     $('endPicker'),
    datebar:       $('datebar'),
    digits:        $('digits'),
    countLabel:    $('countdownLabel'),
    progressBar:   $('progressBar'),
    btnToggle:     $('btnToggle'),
    btnSettings:   $('btnSettings'),
    btnFullscreen: $('btnFullscreen'),
    overlay:       $('overlay'),
    schoolInput:   $('schoolInput'),
    subjectInput:  $('subjectInput'),
    startInput:    $('startInput'),
    minutesInput:  $('minutesInput'),
    endInput:      $('endInput'),
    preview:       $('preview'),
    presetChips:   $('presetChips'),
    modeSeg:       $('modeSeg'),
    paneDuration:  $('paneDuration'),
    paneEndtime:   $('paneEndtime'),
    btnApply:      $('btnApply'),
    btnCancel:     $('btnCancel'),
    btnHandwrite:  $('btnHandwrite'),
    hwModal:       $('hwModal'),
    hwCanvas:      $('hwCanvas'),
    hwCandidates:  $('hwCandidates'),
    hwClear:       $('hwClear'),
    hwRecognize:   $('hwRecognize'),
    hwClose:       $('hwClose')
  };

  const PRESETS = [
    ['语文',       '09:00', '11:30'],
    ['物理',       '15:00', '16:30'],
    ['数学',       '09:30', '11:30'],
    ['化学',       '15:00', '16:30'],
    ['生物·地理',  '15:00', '17:00'],
    ['道法·历史',  '09:00', '11:30'],
    ['英语',       '14:30', '16:30']
  ];

  const DEFAULT_SUBJECT = '语文';
  const DEFAULT_SCHOOL  = '九圩中学';
  const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const LS_SCHOOL = 'exam-timer-school-v3';

  const state = {
    school:  DEFAULT_SCHOOL,
    subject: DEFAULT_SUBJECT,
    startMs: 0,
    endMs:   0
  };

  let paused      = false;
  let pausedAt    = 0;
  let extraTime   = 0;
  let lastRem     = null;
  let curMode     = '';
  let settingMode = 'duration';

  let alarmTimer = null;
  let alarmCount = 0;

  let serverOffset = 0;

  /* ============================================================
     学校名称持久化
     ============================================================ */
  function loadSchool(){
    try{
      const v = localStorage.getItem(LS_SCHOOL);
      return (v && v.trim()) ? v.trim() : DEFAULT_SCHOOL;
    }catch(e){ return DEFAULT_SCHOOL; }
  }
  function saveSchool(v){
    try{ localStorage.setItem(LS_SCHOOL, v); }catch(e){}
  }

  /* ============================================================
     音频
     ============================================================ */
  let audioCtx = null;

  function initAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  document.addEventListener('click',   initAudio, { once:true });
  document.addEventListener('keydown', initAudio, { once:true });

  function tone(freq, dur, delay, vol, type){
    if(!audioCtx) return;
    dur   = dur   === undefined ? 0.20 : dur;
    delay = delay === undefined ? 0    : delay;
    vol   = vol   === undefined ? 0.25 : vol;
    type  = type  || 'sine';

    const t0  = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.06);
  }

  function chime(times, freq){
    for(let i = 0; i < times; i++) tone(freq, 0.5, i * 0.62, 0.30);
  }

  /* 语音播报 */
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    // 取消之前的语音队列
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 0.9;
    utter.pitch = 1.0;
    utter.volume = 1.0; // 最大音量
    // 尝试使用中文语音
    const voices = speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh')) || voices[0];
    if(zhVoice) utter.voice = zhVoice;
    speechSynthesis.speak(utter);
  }

  // 预加载语音列表
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  function alarmEnd(){
    chime(3, 880);
    tone(1318, 1.5, 1.85, 0.28);
  }

  function startEndAlarm(){ clearEndAlarm(); playEndAlarm(); }
  function playEndAlarm(){
    alarmEnd();
    alarmCount++;
    if(alarmCount < 6) alarmTimer = setTimeout(playEndAlarm, 3500);
  }
  function clearEndAlarm(){
    if(alarmTimer){ clearTimeout(alarmTimer); alarmTimer = null; }
    alarmCount = 0;
  }

  /* ============================================================
     网络时间校准（失败静默回退本地时间）
     ============================================================ */
  function now(){ return Date.now() + serverOffset; }

  async function fetchJsonWithTimeout(url, timeoutMs){
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try{
      const res = await fetch(url, {
        signal : ctrl.signal,
        cache  : 'no-store',
        mode   : 'cors'
      });
      clearTimeout(timer);
      if(!res.ok) return null;
      return await res.json();
    }catch(e){
      clearTimeout(timer);
      return null;
    }
  }

  async function syncNetworkTime(){
    const endpoints = [
      { url:'https://worldtimeapi.org/api/ip',
        parse: d => d && d.unixtime ? d.unixtime * 1000 : null },
      { url:'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai',
        parse: d => d && d.dateTime ? new Date(d.dateTime).getTime() : null },
      { url:'https://showcase.api.linx.twenty57.net/UnixTime/tounixtimestamp?datetime=now',
        parse: d => d && d.UnixTimeStamp ? Number(d.UnixTimeStamp) * 1000 : null }
    ];

    for(const ep of endpoints){
      const data = await fetchJsonWithTimeout(ep.url, 2500);
      if(!data) continue;
      const t = ep.parse(data);
      if(!Number.isFinite(t) || t <= 0) continue;
      serverOffset = t - Date.now();
      updateDatebar();
      return true;
    }
    serverOffset = 0;
    return false;
  }

  /* ============================================================
     日期栏
     ============================================================ */
  function updateDatebar(){
    const d   = new Date(now());
    const yr  = d.getFullYear();
    const mon = d.getMonth() + 1;
    const day = d.getDate();
    const wd  = WEEKDAYS[d.getDay()];
    const hh  = String(d.getHours()).padStart(2,'0');
    const mm  = String(d.getMinutes()).padStart(2,'0');
    const ss  = String(d.getSeconds()).padStart(2,'0');

    els.datebar.innerHTML =
      yr + '年' + mon + '月' + day + '日' +
      ' <span class="weekday">' + wd + '</span>' +
      '<span class="beijing">北京时间</span>' +
      ' <span class="clock">' + hh + ':' + mm + ':' + ss + '</span>';
  }

  /* ============================================================
     时间工具
     ============================================================ */
  function formatTime(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const p = n => String(n).padStart(2, '0');
    return h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
  }

  function timeToMs(str){
    if(!str) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(str.trim());
    if(!m) return null;
    const h = +m[1], mi = +m[2];
    if(h > 23 || mi > 59) return null;
    const d = new Date(now());
    d.setHours(h, mi, 0, 0);
    return d.getTime();
  }

  function msToTime(ms){
    const d = new Date(ms);
    return String(d.getHours()).padStart(2,'0') + ':' +
           String(d.getMinutes()).padStart(2,'0');
  }

  function calcMinutes(startStr, endStr){
    const s = timeToMs(startStr);
    let   e = timeToMs(endStr);
    if(s === null || e === null) return null;
    if(e <= s) e += 86400000;
    return Math.round((e - s) / 60000);
  }

  function syncStateFromPickers(){
    const s = timeToMs(els.startPicker.value);
    let   e = timeToMs(els.endPicker.value);
    if(s === null || e === null) return false;
    if(e <= s) e += 86400000;
    state.startMs = s;
    state.endMs   = e;
    return true;
  }

  /* ============================================================
     倒计时
     ============================================================ */
  function currentRem(){
    const ref = paused ? pausedAt : now();
    return Math.max(0, state.endMs + extraTime - ref);
  }

  function tick(){
    const rem = currentRem();
    const ref = paused ? pausedAt : now();

    els.digits.textContent = formatTime(rem);

    /* 只保留“距离考试结束”与“考试已结束”两种状态 */
    let label;
    if(rem <= 0) label = '考试已结束';
    else         label = '距离考试结束：';
    if(els.countLabel.textContent !== label) els.countLabel.textContent = label;

    const total = state.endMs - state.startMs;
    const pct   = total > 0 ? rem / total : 0;
    els.progressBar.style.width = Math.max(0, Math.min(1, pct)) * 100 + '%';

    let mode = 'normal';
    if(rem <= 0)           mode = 'over';
    else if(rem <= 60000)  mode = 'danger';
    else if(rem <= 300000) mode = 'warn';
    if(mode !== curMode){
      document.body.classList.remove('mode-normal','mode-warn','mode-danger','mode-over');
      document.body.classList.add('mode-' + mode);
      curMode = mode;
    }

    const btnText = paused ? '开始' : '暂停';
    if(els.btnToggle.textContent !== btnText) els.btnToggle.textContent = btnText;

    if(lastRem !== null){
      if(lastRem > 905000 && rem <= 905000 && rem > 0){
        chime(2, 784);
        speak('距离考试结束时间还有15分钟');
      }
      if(lastRem > 300000 && rem <= 300000 && rem > 60000) chime(2, 784);
      if(lastRem > 60000  && rem <= 60000  && rem > 0)     chime(3, 880);
      if(lastRem > 0      && rem <= 0)                      startEndAlarm();
    }
    lastRem = rem;
  }

  /* ============================================================
     开始 / 暂停
     ============================================================ */
  function toggleTimer(){
    if(paused){
      extraTime += now() - pausedAt;
      paused = false;
    }else{
      pausedAt = now();
      paused = true;
    }
    lastRem = null;
    tick();
  }

  function onPickerChange(){
    if(!syncStateFromPickers()) return;
    extraTime = 0;
    if(paused) pausedAt = now();
    lastRem = null;
    clearEndAlarm();
    tick();
  }

  [els.startPicker, els.endPicker].forEach(p => {
    p.addEventListener('change', onPickerChange);
  });

  /* ============================================================
     学校徽标
     ============================================================ */
  function setSchool(name){
    state.school = name || DEFAULT_SCHOOL;
    els.schoolBadge.textContent = state.school;
    saveSchool(state.school);
  }

  els.schoolBadge.addEventListener('click', openSettings);

  /* ============================================================
     设置面板
     ============================================================ */
  function buildChips(){
    PRESETS.forEach(([name, start, end]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.dataset.name  = name;
      b.dataset.start = start;
      b.dataset.end   = end;

      const nameEl = document.createElement('span');
      nameEl.className = 'chip-name';
      nameEl.textContent = name;

      const timeEl = document.createElement('span');
      timeEl.className = 'chip-time';
      timeEl.textContent = start + ' — ' + end;

      b.appendChild(nameEl);
      b.appendChild(timeEl);

      b.addEventListener('click', () => {
        els.subjectInput.value = name;
        els.startInput.value   = start;

        if(settingMode === 'duration'){
          const min = calcMinutes(start, end);
          if(min !== null) els.minutesInput.value = min;
        }else{
          els.endInput.value = end;
        }
        [...els.presetChips.children].forEach(c => c.classList.toggle('on', c === b));
        updatePreview();
      });

      els.presetChips.appendChild(b);
    });
  }

  function highlightPreset(){
    const curStart = msToTime(state.startMs);
    const curEnd   = msToTime(state.endMs);
    [...els.presetChips.children].forEach(c => {
      const match = c.dataset.name  === state.subject &&
                    c.dataset.start === curStart &&
                    c.dataset.end   === curEnd;
      c.classList.toggle('on', match);
    });
  }

  function updateModeUI(){
    [...els.modeSeg.children].forEach(b =>
      b.classList.toggle('on', b.dataset.mode === settingMode)
    );
    els.paneDuration.hidden = settingMode !== 'duration';
    els.paneEndtime.hidden  = settingMode !== 'endtime';
  }

  function updatePreview(){
    const startStr = els.startInput.value;
    let endStr = '';

    if(settingMode === 'duration'){
      const s   = timeToMs(startStr);
      const min = parseInt(els.minutesInput.value, 10);
      if(s !== null && Number.isFinite(min) && min > 0){
        endStr = msToTime(s + min * 60000);
      }
    }else{
      endStr = els.endInput.value;
    }

    if(startStr && endStr){
      let min = calcMinutes(startStr, endStr);
      els.preview.className = 'preview';
      els.preview.innerHTML =
        '考试时间：<b>' + startStr + '</b> 至 <b>' + endStr + '</b>' +
        (min ? '　共 <b>' + min + '</b> 分钟' : '');
    }else{
      els.preview.className = 'preview error';
      els.preview.textContent = '请填写完整时间';
    }
  }

  function openSettings(){
    els.schoolInput.value  = state.school;
    els.subjectInput.value = state.subject;
    els.startInput.value   = msToTime(state.startMs);

    const totalMin = Math.round((state.endMs - state.startMs) / 60000);
    els.minutesInput.value = totalMin;
    els.endInput.value     = msToTime(state.endMs);

    updateModeUI();
    highlightPreset();
    updatePreview();

    els.overlay.classList.add('show');
    setTimeout(() => els.schoolInput.focus(), 120);
  }

  function closeSettings(){
    els.overlay.classList.remove('show');
  }

  function applySettings(){
    const school = (els.schoolInput.value || '').trim() || DEFAULT_SCHOOL;
    setSchool(school);

    const subject  = (els.subjectInput.value || '').trim() || DEFAULT_SUBJECT;
    const startStr = els.startInput.value;

    const s = timeToMs(startStr);
    if(s === null){
      els.preview.className = 'preview error';
      els.preview.textContent = '开始时间格式不正确';
      return;
    }

    let e;
    if(settingMode === 'duration'){
      const min = parseInt(els.minutesInput.value, 10);
      if(!Number.isFinite(min) || min < 1){
        els.preview.className = 'preview error';
        els.preview.textContent = '请输入有效的考试时长';
        return;
      }
      e = s + min * 60000;
    }else{
      e = timeToMs(els.endInput.value);
      if(e === null){
        els.preview.className = 'preview error';
        els.preview.textContent = '结束时间格式不正确';
        return;
      }
      if(e <= s) e += 86400000;
    }

    state.subject = subject;
    els.subject.textContent = subject;
    els.startPicker.value   = msToTime(s);
    els.endPicker.value     = msToTime(e);
    document.title = subject + ' · 考试计时';

    syncStateFromPickers();
    extraTime = 0;
    paused    = false;
    pausedAt  = 0;
    lastRem   = null;
    clearEndAlarm();

    closeSettings();
    tick();
  }

  els.btnSettings.addEventListener('click', openSettings);
  els.btnCancel.addEventListener('click',   closeSettings);
  els.btnApply.addEventListener('click',    applySettings);

  els.overlay.addEventListener('click', e => {
    if(e.target === els.overlay) closeSettings();
  });

  els.modeSeg.addEventListener('click', e => {
    const btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    const newMode = btn.dataset.mode;
    if(newMode === settingMode) return;

    if(newMode === 'endtime'){
      const s   = timeToMs(els.startInput.value);
      const min = parseInt(els.minutesInput.value, 10);
      if(s !== null && Number.isFinite(min) && min > 0){
        els.endInput.value = msToTime(s + min * 60000);
      }
    }else{
      const min = calcMinutes(els.startInput.value, els.endInput.value);
      if(min !== null) els.minutesInput.value = min;
    }

    settingMode = newMode;
    updateModeUI();
    updatePreview();
  });

  [els.startInput, els.minutesInput, els.endInput].forEach(inp => {
    inp.addEventListener('input',  updatePreview);
    inp.addEventListener('change', updatePreview);
  });

  els.schoolInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') els.subjectInput.focus();
  });
  els.subjectInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') els.startInput.focus();
  });
  els.startInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') els.minutesInput.focus();
  });
  els.minutesInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') applySettings();
  });
  els.endInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') applySettings();
  });

  /* ============================================================
     手写输入
     ============================================================ */
  const hw = {
    ctx: null,
    strokes: [],
    current: null,
    pointerId: null,
    canvasReady: false
  };

  function hwInitCanvas(){
    const canvas = els.hwCanvas;
    const rect = canvas.getBoundingClientRect();
    if(rect.width < 10) return;

    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(rect.width  * dpr);
    canvas.height = Math.round(rect.height * dpr);

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#e8eefc';
    ctx.fillStyle  = '#e8eefc';

    hw.ctx = ctx;
    hw.canvasReady = true;

    hwRedraw();
  }

  function hwRedraw(){
    const canvas = els.hwCanvas;
    const ctx    = hw.ctx;
    if(!ctx) return;

    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    for(const stroke of hw.strokes){
      if(stroke.length === 1){
        ctx.beginPath();
        ctx.arc(stroke[0][0], stroke[0][1], 1.6, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      ctx.beginPath();
      ctx.moveTo(stroke[0][0], stroke[0][1]);
      for(let i = 1; i < stroke.length; i++){
        ctx.lineTo(stroke[i][0], stroke[i][1]);
      }
      ctx.stroke();
    }
  }

  function hwPos(e){
    const rect = els.hwCanvas.getBoundingClientRect();
    return [e.clientX - rect.left, e.clientY - rect.top];
  }

  els.hwCanvas.addEventListener('pointerdown', e => {
    if(hw.pointerId !== null) return;
    e.preventDefault();
    hw.pointerId = e.pointerId;
    try{ els.hwCanvas.setPointerCapture(e.pointerId); }catch(_){}

    const [x, y] = hwPos(e);
    hw.current = [[x, y]];
    hw.strokes.push(hw.current);

    hw.ctx.beginPath();
    hw.ctx.arc(x, y, 1.6, 0, Math.PI * 2);
    hw.ctx.fill();
  });

  els.hwCanvas.addEventListener('pointermove', e => {
    if(e.pointerId !== hw.pointerId || !hw.current) return;
    e.preventDefault();

    const [x, y] = hwPos(e);
    const prev = hw.current[hw.current.length - 1];
    hw.current.push([x, y]);

    hw.ctx.beginPath();
    hw.ctx.moveTo(prev[0], prev[1]);
    hw.ctx.lineTo(x, y);
    hw.ctx.stroke();
  });

  function hwEnd(e){
    if(e.pointerId !== hw.pointerId) return;
    hw.pointerId = null;
    hw.current = null;
  }
  els.hwCanvas.addEventListener('pointerup', hwEnd);
  els.hwCanvas.addEventListener('pointercancel', hwEnd);

  function hwClear(){
    hw.strokes = [];
    hw.current = null;
    hw.pointerId = null;
    els.hwCandidates.innerHTML = '';
    hwRedraw();
  }

  els.hwClear.addEventListener('click', hwClear);

  function openHandwrite(){
    els.hwModal.classList.add('show');
    setTimeout(() => {
      hwInitCanvas();
      hwClear();
      els.hwCandidates.innerHTML =
        '<span class="hw-status">在画布上手写文字，然后点击「识别」</span>';
    }, 60);
  }

  function closeHandwrite(){
    els.hwModal.classList.remove('show');
  }

  els.btnHandwrite.addEventListener('click', openHandwrite);
  els.hwClose.addEventListener('click', closeHandwrite);
  els.hwModal.addEventListener('click', e => {
    if(e.target === els.hwModal) closeHandwrite();
  });

  window.addEventListener('resize', () => {
    if(els.hwModal.classList.contains('show')){
      hwInitCanvas();
    }
  });

  async function callHandwritingAPI(payload){
    const apiUrl = 'https://inputtools.google.com/request?itc=zh-t-i0-handwrit&app=demopage';
    const body   = JSON.stringify(payload);
    const headers = { 'Content-Type': 'application/json' };

    try{
      const res = await fetch(apiUrl, { method:'POST', headers, body });
      if(res.ok){
        const data = await res.json();
        if(data && data[0] === 'SUCCESS') return data;
      }
    }catch(e){}

    try{
      const proxied = 'https://corsproxy.io/?' + encodeURIComponent(apiUrl);
      const res = await fetch(proxied, { method:'POST', headers, body });
      if(res.ok){
        const data = await res.json();
        if(data && data[0] === 'SUCCESS') return data;
      }
    }catch(e){}

    return null;
  }

  els.hwRecognize.addEventListener('click', async () => {
    if(hw.strokes.length === 0){
      els.hwCandidates.innerHTML =
        '<span class="hw-status error">请先在画布上书写</span>';
      return;
    }

    els.hwCandidates.innerHTML =
      '<span class="hw-status">识别中…</span>';

    const rect = els.hwCanvas.getBoundingClientRect();
    const payload = {
      input_type: '0',
      requests: [{
        language: 'zh',
        writing_guide: {
          width:  Math.round(rect.width),
          height: Math.round(rect.height)
        },
        ink: hw.strokes
      }]
    };

    const data = await callHandwritingAPI(payload);

    if(!data){
      els.hwCandidates.innerHTML =
        '<span class="hw-status error">识别服务暂时不可用，请直接打字输入</span>';
      return;
    }

    const list = (data[1] && data[1][0] && data[1][0][1]) || [];
    if(!list.length){
      els.hwCandidates.innerHTML =
        '<span class="hw-status error">未识别到内容，请重新书写</span>';
      return;
    }

    els.hwCandidates.innerHTML = '';
    list.slice(0, 8).forEach(text => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hw-candidate';
      btn.textContent = text;
      btn.addEventListener('click', () => {
        const cur = els.schoolInput.value || '';
        els.schoolInput.value = cur + text;
        closeHandwrite();
      });
      els.hwCandidates.appendChild(btn);
    });
  });

  /* ============================================================
     全屏 / 屏幕常亮
     ============================================================ */
  function toggleFullscreen(){
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      const el  = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if(req) req.call(el);
    }else{
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
    }
  }

  els.btnFullscreen.addEventListener('click', toggleFullscreen);
  els.btnToggle.addEventListener('click', () => { initAudio(); toggleTimer(); });

  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    }catch(e){}
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){
      requestWakeLock();
      syncNetworkTime();
    }
  });

  /* ============================================================
     全局快捷键
     ============================================================ */
  document.addEventListener('keydown', e => {
    if(els.hwModal.classList.contains('show')){
      if(e.key === 'Escape') closeHandwrite();
      return;
    }
    if(e.target.tagName === 'INPUT' || e.target.isContentEditable){
      if(e.key === 'Escape') closeSettings();
      return;
    }
    if(e.code === 'Space'){
      e.preventDefault();
      initAudio();
      toggleTimer();
    }else if(e.key === 'f' || e.key === 'F'){
      toggleFullscreen();
    }else if(e.key === 'Escape'){
      closeSettings();
    }
  });

  /* ============================================================
     初始化
     ============================================================ */
  function init(){
    setSchool(loadSchool());

    let s = timeToMs(els.startPicker.value);
    let e = timeToMs(els.endPicker.value);
    if(e <= s) e += 86400000;
    const cur = now();
    if(e <= cur){
      s += 86400000;
      e += 86400000;
    }
    state.startMs = s;
    state.endMs   = e;
    state.subject = els.subject.textContent.trim() || DEFAULT_SUBJECT;

    document.title = state.subject + ' · 考试计时';
  }

  buildChips();
  init();
  updateDatebar();
  tick();

  setInterval(updateDatebar, 1000);
  setInterval(tick, 100);
  syncNetworkTime();
  setInterval(syncNetworkTime, 30 * 60 * 1000);

})();
</script>
</body>
</html>
