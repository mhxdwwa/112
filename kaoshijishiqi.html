<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261026">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=20261026">
  <link rel="apple-touch-icon" href="/icon-180.png?v=20261026">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考试计时器</title>
<!-- v1.1.1 (2026-11-11)：朱砂金/宣纸的秒数字改成等高（Cambria lining）等宽，不再高低错落；v1.1.0：六套界面风格一键切换；时间数字放大（原来被 input 样式压成 16px）；顶部/日期/标语整体放大并重排 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg:#070b14;
    --fg:#e8eefc;
    --muted:#8496b3;
    --accent:#38bdf8;
    --accent-2:#818cf8;
    --warn:#fbbf24;
    --danger:#f87171;

    /* 发光色（供 rgba() 用）与光晕浓度 */
    --glow:56,189,248;
    --glow-a:.10;
    --glow-a2:.08;

    /* 字体：界面文字 / 数字，两套分开，主题各自覆盖 */
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --font-num:var(--font-ui);
    --num-weight:300;
    --num-track:.01em;
    --num-glow:90px;

    /* 时间胶囊 / 卡片 */
    --pill-bg:rgba(56,189,248,.10);
    --pill-bd:rgba(56,189,248,.26);
    --sheen:rgba(255,255,255,.05);
    --sheen-2:rgba(255,255,255,.10);
    --line:rgba(255,255,255,.12);
  }

  /* ============================================================
     六套风格：只换变量，不动布局；数字字体、字重、发光各不一样
     ============================================================ */

  /* ① 深空蓝（默认） */
  body[data-theme="deep"]{
    --bg:#070b14;
    --fg:#e8eefc;
    --muted:#8496b3;
    --accent:#38bdf8;
    --accent-2:#818cf8;
    --glow:56,189,248;
    --font-num:var(--font-ui);
    --num-weight:300;
    --num-track:.01em;
  }

  /* ② 朱砂金（考场庄重：宋体 + 衬线数字 + 粗体） */
  body[data-theme="crimson"]{
    --bg:#140609;
    --fg:#ffeef0;
    --muted:#d0919c;
    --accent:#ff6b6b;
    --accent-2:#ffd166;
    --warn:#ffd166;
    --glow:255,107,107;
    --glow-a:.11;
    --glow-a2:.07;
    --font-ui:"SimSun","Songti SC","宋体","Microsoft YaHei",serif;
    --font-num:"Cambria","Times New Roman",Georgia,serif;
    --num-weight:700;
    --num-track:.03em;
    --num-glow:80px;
    --pill-bg:rgba(255,107,107,.12);
    --pill-bd:rgba(255,209,102,.30);
    --pill-fg:#ffd166;
  }

  /* ③ 青玉（清爽：黑体 + 半粗等宽数字） */
  body[data-theme="jade"]{
    --bg:#04120f;
    --fg:#e6fff7;
    --muted:#7fb3a3;
    --accent:#34d399;
    --accent-2:#2dd4bf;
    --warn:#fde68a;
    --glow:52,211,153;
    --glow-a:.12;
    --glow-a2:.09;
    --font-ui:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    --font-num:"Consolas","Menlo","Microsoft YaHei",monospace;
    --num-weight:600;
    --num-track:.02em;
    --pill-bg:rgba(52,211,153,.12);
    --pill-bd:rgba(52,211,153,.28);
  }

  /* ④ 墨金（纯黑 + 金色 + Consolas 等宽，最“电子钟”） */
  body[data-theme="gold"]{
    --bg:#0a0904;
    --fg:#fff6e0;
    --muted:#b8a173;
    --accent:#f5c451;
    --accent-2:#ff9f1c;
    --warn:#ffb703;
    --glow:245,196,81;
    --glow-a:.13;
    --glow-a2:.10;
    --font-ui:"Microsoft YaHei","PingFang SC",sans-serif;
    --font-num:"Consolas","Courier New","Lucida Console",monospace;
    --num-weight:700;
    --num-track:.05em;
    --num-glow:70px;
    --pill-bg:rgba(245,196,81,.12);
    --pill-bd:rgba(245,196,81,.30);
    --sheen:rgba(245,196,81,.05);
    --sheen-2:rgba(245,196,81,.10);
  }

  /* ⑤ 夜紫（细体 + 紫粉渐变，最“霓虹”） */
  body[data-theme="violet"]{
    --bg:#0b0616;
    --fg:#f3eaff;
    --muted:#a08cc8;
    --accent:#c084fc;
    --accent-2:#f472b6;
    --glow:192,132,252;
    --glow-a:.14;
    --glow-a2:.11;
    --font-ui:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    --font-num:"Segoe UI Light","Segoe UI","Microsoft YaHei UI",sans-serif;
    --num-weight:200;
    --num-track:.02em;
    --num-glow:110px;
    --pill-bg:rgba(192,132,252,.13);
    --pill-bd:rgba(192,132,252,.30);
  }

  /* ⑥ 宣纸（浅色，适合明亮教室 / 强光环境） */
  body[data-theme="paper"]{
    --bg:#f6f3ea;
    --fg:#1b2320;
    --muted:#7d8a84;
    --accent:#b3541e;
    --accent-2:#0f766e;
    --warn:#b45309;
    --danger:#b91c1c;
    --glow:179,84,30;
    --glow-a:.08;
    --glow-a2:.06;
    --font-ui:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    --font-num:"Cambria","Times New Roman",serif;
    --num-weight:700;
    --num-track:.02em;
    --num-glow:0px;
    --pill-bg:rgba(179,84,30,.08);
    --pill-bd:rgba(179,84,30,.28);
    --pill-fg:#8f3f12;
    --sheen:rgba(0,0,0,.045);
    --sheen-2:rgba(0,0,0,.09);
    --line:rgba(0,0,0,.14);
  }
  body[data-theme="paper"]::before{
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%,   rgba(179,84,30,.07), transparent 65%),
      radial-gradient(ellipse 60% 45% at 50% 100%, rgba(15,118,110,.06), transparent 65%);
  }
  body[data-theme="paper"] .digits{ text-shadow:none }
  body[data-theme="paper"] .school-badge,
  body[data-theme="paper"] .corner-mark{ color:rgba(27,35,32,.72); background:rgba(0,0,0,.03) }
  body[data-theme="paper"] .school-badge:hover{ background:rgba(179,84,30,.10) }
  body[data-theme="paper"] .corner-mark b{ color:rgba(179,84,30,.85) }
  body[data-theme="paper"] .datebar .clock{ color:#1b2320 }
  body[data-theme="paper"] .time-pill{ color-scheme:light }
  body[data-theme="paper"] .overlay,
  body[data-theme="paper"] .hw-modal{ background:rgba(30,34,32,.55) }
  body[data-theme="paper"] .panel,
  body[data-theme="paper"] .hw-panel{ background:#fffdf7; border-color:rgba(0,0,0,.10); color:#1b2320 }
  body[data-theme="paper"] .panel h2,
  body[data-theme="paper"] .hw-panel h3{ color:#1b2320 }
  body[data-theme="paper"] input[type=text],
  body[data-theme="paper"] input[type=number],
  body[data-theme="paper"] input[type=time]{ color:#1b2320; background:rgba(0,0,0,.03); border-color:rgba(0,0,0,.14); color-scheme:light }
  body[data-theme="paper"] .btn:not(.primary){ color:#1b2320; background:rgba(0,0,0,.04); border-color:rgba(0,0,0,.14) }
  body[data-theme="paper"] .btn:not(.primary):hover{ background:rgba(0,0,0,.08) }
  body[data-theme="paper"] .btn.primary{ color:#fff }
  body[data-theme="paper"] .seg{ background:rgba(0,0,0,.05) }
  body[data-theme="paper"] .seg button{ color:#6b7671 }
  body[data-theme="paper"] .chip{ color:#3c4642; background:rgba(0,0,0,.03); border-color:rgba(0,0,0,.10) }
  body[data-theme="paper"] .chip .chip-time{ color:#7d8a84 }
  body[data-theme="paper"] .field label{ color:#7d8a84 }
  body[data-theme="paper"] .hw-hint,
  body[data-theme="paper"] .hw-status{ color:#5f6b66 }
  body[data-theme="paper"] #hwCanvas{ background:rgba(0,0,0,.02); border-color:rgba(0,0,0,.12) }
  body[data-theme="paper"] .preview{ color:#5f6b66; background:rgba(179,84,30,.06) }

  html,body{height:100%}

  body{
    font-family:var(--font-ui);
    background:var(--bg);
    color:var(--fg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    cursor:default;
    transition:background .5s ease,color .5s ease;
  }

  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%,   rgba(var(--glow),var(--glow-a)), transparent 65%),
      radial-gradient(ellipse 60% 45% at 50% 100%, rgba(var(--glow),var(--glow-a2)), transparent 65%);
    transition:background .8s;
  }
  body.mode-warn::before{
    background:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(251,191,36,.10), transparent 65%);
  }
  body.mode-danger::before,
  body.mode-over::before{
    background:radial-gradient(ellipse 80% 60% at 50% 50%, rgba(248,113,113,.13), transparent 70%);
  }

  /* ===== 左上角学校徽标 ===== */
  .school-badge{
    position:fixed;
    top:2vh;
    left:2.5vw;
    z-index:50;
    padding:.35em .95em;
    font-size:clamp(1rem,2.2vmin,1.75rem);
    font-weight:600;
    letter-spacing:.16em;
    color:rgba(232,238,252,.85);
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);
    border-radius:10px;
    cursor:pointer;
    transition:all .2s;
    white-space:nowrap;
    max-width:34vw;
    overflow:hidden;
    text-overflow:ellipsis;
    backdrop-filter:blur(8px);
  }
  .school-badge:hover{
    color:var(--accent);
    background:rgba(56,189,248,.08);
    border-color:rgba(56,189,248,.28);
    box-shadow:0 0 20px rgba(56,189,248,.15);
  }
  .school-badge:empty{display:none}

  /* ===== 右下角悬浮签名 ===== */
  .corner-mark{
    position:fixed;
    right:2.5vw;
    bottom:2vh;
    z-index:60;
    padding:.32em .85em;
    font-size:clamp(.72rem,1.5vmin,1rem);
    font-weight:500;
    letter-spacing:.14em;
    white-space:nowrap;
    color:rgba(232,238,252,.38);
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);
    border-radius:999px;
    backdrop-filter:blur(8px);
    pointer-events:none;
    user-select:none;
    text-shadow:0 0 14px rgba(56,189,248,.25);
    animation:fadeUp 1.1s cubic-bezier(.2,.8,.3,1) both;
  }
  .corner-mark b{
    font-weight:600;
    color:rgba(56,189,248,.62);
  }

  /* ===== 整体布局 ===== */
  .stage{
    position:relative;
    height:100vh;height:100dvh;
    display:grid;
    grid-template-rows:auto auto minmax(0,1fr) auto;
    padding:5.5vh 4vw 3.4vh;
    z-index:1;
  }

  /* ===== 顶栏：科目 / 时间，字号按 vmin 放大，远处也能读 ===== */
  .topbar{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:clamp(1.4rem,4.4vw,4.5rem);
    font-size:clamp(2.1rem,5.4vmin,5.4rem);
    font-weight:500;
    line-height:1.15;
    animation:fadeDown .8s cubic-bezier(.2,.8,.3,1) both;
  }

  .info{
    display:flex;
    align-items:center;
    gap:.34em;
    white-space:nowrap;
  }

  /* 两组之间一条细竖线，视线有分隔，不用加框 */
  .info + .info{
    padding-left:clamp(1.2rem,4vw,4rem);
    border-left:1px solid var(--line);
  }

  .label{
    color:var(--muted);
    letter-spacing:.08em;
    font-weight:400;
    opacity:1;
  }

  .subject{
    color:var(--fg);
    font-weight:700;
    letter-spacing:.14em;
    text-shadow:0 0 calc(var(--num-glow) * .35) rgba(var(--glow),.35);
  }

  .time-pill{
    font-family:var(--font-num);
    font-size:1.12em;
    font-weight:600;
    letter-spacing:.02em;
    font-variant-numeric:lining-nums tabular-nums;
    font-feature-settings:"lnum" 1,"tnum" 1;
    color:var(--pill-fg,var(--accent));
    background:var(--pill-bg);
    border:2px solid var(--pill-bd);
    border-radius:.26em;
    padding:.18em .42em;
    min-width:4.4em;
    width:auto;
    text-align:center;
    cursor:pointer;
    outline:none;
    color-scheme:dark;
    transition:background .2s,border-color .2s;
  }
  /* ★ 关键：input 内部的日期编辑区默认不跟随外层字号，必须显式 inherit，
     否则外框放大了、里面的 09:00 还是 16px（以前就是这样几乎看不见） */
  .time-pill::-webkit-datetime-edit,
  .time-pill::-webkit-datetime-edit-fields-wrapper,
  .time-pill::-webkit-datetime-edit-text,
  .time-pill::-webkit-datetime-edit-hour-field,
  .time-pill::-webkit-datetime-edit-minute-field{
    font:inherit;
    line-height:1.1;
    padding:0;
    margin:0;
  }
  .time-pill:hover{
    background:var(--pill-bg);
    border-color:var(--accent);
  }
  .time-pill:focus{
    border-color:var(--accent);
    background:var(--pill-bg);
    box-shadow:0 0 0 .12em rgba(var(--glow),.18);
  }
  .time-pill::-webkit-calendar-picker-indicator{
    cursor:pointer;
    opacity:.65;
    width:.85em;
    height:.85em;
    transition:opacity .2s;
  }
  .time-pill:hover::-webkit-calendar-picker-indicator{opacity:1}

  .sep{
    color:var(--muted);
    margin:0 .12em;
    letter-spacing:.08em;
    font-size:.86em;
    opacity:.9;
  }

  /* ===== 日期栏 ===== */
  .datebar{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:.55em;
    margin-top:clamp(1.2rem,3.2vh,2.6rem);
    font-size:clamp(1.35rem,3.6vmin,3.6rem);
    letter-spacing:.08em;
    font-variant-numeric:tabular-nums;
    color:rgba(232,238,252,.92);
    animation:fadeDown .9s cubic-bezier(.2,.8,.3,1) both;
  }
  body[data-theme="paper"] .datebar{ color:rgba(27,35,32,.92) }
  .datebar .weekday{
    color:var(--accent);
    font-weight:600;
    letter-spacing:.15em;
  }
  .datebar .beijing{
    color:var(--muted);
    font-weight:400;
    letter-spacing:.14em;
    margin-left:.35em;
  }
  .datebar .clock{
    color:var(--fg);
    font-family:var(--font-num);
    font-weight:600;
    letter-spacing:.06em;
    text-shadow:0 0 20px rgba(var(--glow),.32);
  }

  /* ===== 中部 ===== */
  .timer{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2vh;
  }

  .count-label{
    font-size:clamp(1.8rem,4.4vmin,4rem);
    color:var(--fg);
    opacity:.8;
    letter-spacing:.22em;
    font-weight:400;
    text-align:center;
    transition:color .5s;
  }
  .mode-over .count-label{color:#f87171;opacity:1}

  .digits{
    font-family:var(--font-num);
    font-size:clamp(3rem,min(21vmin,19vw),400px);
    font-weight:var(--num-weight);
    line-height:1.04;
    letter-spacing:var(--num-track);
    font-variant-numeric:lining-nums tabular-nums;
    font-feature-settings:"lnum" 1,"tnum" 1;
    color:var(--fg);
    text-shadow:0 0 var(--num-glow) rgba(var(--glow),.22);
    transition:color .5s,text-shadow .5s;
    white-space:nowrap;
  }

  .mode-warn .digits{
    color:#fde68a;
    text-shadow:0 0 var(--num-glow) rgba(251,191,36,.40);
  }
  .mode-danger .digits{
    color:#fca5a5;
    text-shadow:0 0 var(--num-glow) rgba(248,113,113,.50);
    animation:pulse 1s ease-in-out infinite;
  }
  .mode-over .digits{
    color:#f87171;
    text-shadow:0 0 var(--num-glow) rgba(248,113,113,.65);
    animation:pulse .85s ease-in-out infinite;
  }

  .progress{
    width:min(66vw,900px);
    height:clamp(6px,.9vmin,12px);
    margin-top:3.6vh;
    border-radius:99px;
    background:var(--sheen);
    overflow:hidden;
  }
  .progress i{
    display:block;
    height:100%;
    width:100%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:background .6s;
  }
  .mode-warn .progress i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
  .mode-danger .progress i,
  .mode-over  .progress i{background:linear-gradient(90deg,#f87171,#ef4444)}

  /* ===== 底栏 ===== */
  .bottom{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(1.8rem,4.6vh,3.4rem);
  }

  .slogan{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:clamp(1rem,3.4vw,3rem);
    font-size:clamp(2.2rem,6.8vmin,6rem);
    font-weight:700;
    letter-spacing:.26em;
    text-indent:.26em;
    text-align:center;
    line-height:1.35;
  }

  .slogan span{
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(var(--glow),.45));
  }
  .slogan span:last-child{
    background:none;
    color:var(--accent-2);
    -webkit-text-fill-color:var(--accent-2);
    filter:drop-shadow(0 0 16px rgba(var(--glow),.35));
  }
  body[data-theme="paper"] .slogan span:last-child{ filter:none }

  .controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
  }

  .btn{
    padding:.72em 1.7em;
    font-family:inherit;
    font-size:clamp(.95rem,2.3vmin,1.55rem);
    letter-spacing:.1em;
    color:var(--fg);
    background:var(--sheen);
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    transition:background .2s,border-color .2s,transform .1s,color .2s;
    backdrop-filter:blur(8px);
  }
  .btn:hover{
    background:var(--sheen-2);
    border-color:var(--accent);
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#04121f;
    font-weight:600;
  }
  .btn.primary:hover{filter:brightness(1.1)}

  /* ===== 设置面板 ===== */
  .overlay{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;
    background:rgba(4,7,14,.82);
    backdrop-filter:blur(14px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto}

  .panel{
    width:min(92vw,640px);
    max-height:90vh;
    overflow-y:auto;
    padding:clamp(24px,4vw,36px);
    background:#0e1626;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    box-shadow:0 40px 90px rgba(0,0,0,.7);
    transform:translateY(14px) scale(.98);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);
  }
  .overlay.show .panel{transform:none}

  .panel h2{
    font-size:1.2rem;
    font-weight:600;
    letter-spacing:.14em;
    margin-bottom:1.5em;
    color:var(--fg);
  }

  .field{margin-bottom:1.3em}
  .field label{
    display:block;
    margin-bottom:.55em;
    font-size:.78rem;
    letter-spacing:.14em;
    color:#7b8ba6;
  }

  input[type=text],input[type=number],input[type=time]:not(.time-pill){
    width:100%;
    padding:.8em 1em;
    font-family:inherit;
    font-size:1rem;
    color:var(--fg);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;
    outline:none;
    transition:border-color .2s,background .2s;
    color-scheme:dark;
  }
  input:focus{
    border-color:var(--accent);
    background:rgba(56,189,248,.07);
  }
  input[type=number],input[type=time]:not(.time-pill){font-variant-numeric:tabular-nums}

  .preview{

  /* ===== 手写输入弹窗 ===== */
  .hw-modal{

<body class="mode-normal" data-theme="deep">

  <!-- ===== 左上角学校徽标（默认：九圩中学） ===== -->

        点一下立即生效。选的这一套会记在这台电脑上，下次打开还是它；教室电脑上单独记自己那一套。

  <!-- ===== 右下角悬浮签名 ===== -->

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);

  const els = {
    schoolBadge:   $('schoolBadge'),
    subject:       $('subjectLabel'),
    startPicker:   $('startPicker'),
    endPicker:     $('endPicker'),
    datebar:       $('datebar'),
    digits:        $('digits'),
    countLabel:    $('countdownLabel'),
    progressBar:   $('progressBar'),
    btnToggle:     $('btnToggle'),
    btnTheme:      $('btnTheme'),
    btnSettings:   $('btnSettings'),
    btnFullscreen: $('btnFullscreen'),
    themeOverlay:  $('themeOverlay'),
    themeGrid:     $('themeGrid'),
    btnThemeClose: $('btnThemeClose'),
    overlay:       $('overlay'),
    schoolInput:   $('schoolInput'),
    subjectInput:  $('subjectInput'),
    startInput:    $('startInput'),
    minutesInput:  $('minutesInput'),
    endInput:      $('endInput'),
    preview:       $('preview'),
    presetChips:   $('presetChips'),
    modeSeg:       $('modeSeg'),
    paneDuration:  $('paneDuration'),
    paneEndtime:   $('paneEndtime'),
    btnApply:      $('btnApply'),
    btnCancel:     $('btnCancel'),
    btnHandwrite:  $('btnHandwrite'),
    hwModal:       $('hwModal'),
    hwCanvas:      $('hwCanvas'),
    hwCandidates:  $('hwCandidates'),
    hwClear:       $('hwClear'),
    hwRecognize:   $('hwRecognize'),
    hwClose:       $('hwClose')
  };

  const PRESETS = [
    ['语文',       '09:00', '11:30'],
    ['物理',       '15:00', '16:30'],
    ['数学',       '09:30', '11:30'],
    ['化学',       '15:00', '16:30'],
    ['生物·地理',  '15:00', '17:00'],
    ['道法·历史',  '09:00', '11:30'],
    ['英语',       '14:30', '16:30']
  ];

  const DEFAULT_SUBJECT = '语文';
  const DEFAULT_SCHOOL  = '九圩中学';
  const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const LS_SCHOOL = 'exam-timer-school-v3';
  const LS_THEME  = 'exam-timer-theme-v1';

  /* ============================================================
     界面风格：六套，一键切换
     只换 CSS 变量（配色 / 字体 / 字重 / 发光），布局完全一致。
     ============================================================ */
  const THEMES = [
    { id:'deep',    name:'深空蓝', desc:'青蓝微光 · 细体数字',
      sw:['#070b14','#38bdf8','#818cf8'] },
    { id:'crimson', name:'朱砂金', desc:'宋体标题 · 衬线粗数字',
      sw:['#140609','#ff6b6b','#ffd166'] },
    { id:'jade',    name:'青玉',   desc:'薄荷青 · 半粗等宽',
      sw:['#04120f','#34d399','#2dd4bf'] },
    { id:'gold',    name:'墨金',   desc:'纯黑鎏金 · Consolas',
      sw:['#0a0904','#f5c451','#ff9f1c'] },
    { id:'violet',  name:'夜紫',   desc:'紫粉霓虹 · 极细体',
      sw:['#0b0616','#c084fc','#f472b6'] },
    { id:'paper',   name:'宣纸',   desc:'浅底深字 · 强光教室',
      sw:['#f6f3ea','#b3541e','#0f766e'] }
  ];

  let curTheme = 'deep';

  function themeExists(id){
    return THEMES.some(t => t.id === id);
  }

  function loadTheme(){
    /* ① URL 上的 ?theme= （控制台发布时带的）② 这台电脑上次选的 */
    try{
      const q = new URLSearchParams(location.search).get('theme');
      if(q && themeExists(q)) return q;
    }catch(e){}
    try{
      const v = localStorage.getItem(LS_THEME);
      if(v && themeExists(v)) return v;
    }catch(e){}
    return 'deep';
  }

  function applyTheme(id, opts){
    if(!themeExists(id)) id = 'deep';
    curTheme = id;
    document.body.dataset.theme = id;
    if(!opts || opts.save !== false){
      try{ localStorage.setItem(LS_THEME, id); }catch(e){}
    }
    if(els.themeGrid){
      [].forEach.call(els.themeGrid.children, c => {
        c.classList.toggle('on', c.dataset.id === id);
      });
    }
    /* 在控制台里预览时告诉外面一句：发布到教室就按这个风格开 */
    if(!opts || opts.notify !== false){
      try{
        if(window.parent && window.parent !== window){
          window.parent.postMessage({ type:'ksjsq-theme', theme:id }, '*');
        }
      }catch(e){}
    }
  }

  function buildThemeCards(){
    if(!els.themeGrid) return;
    els.themeGrid.innerHTML = '';
    THEMES.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'theme-card';
      b.dataset.id = t.id;
      b.innerHTML =
        '<span class="sw">' +
          t.sw.map(c => '<i style="background:' + c + '"></i>').join('') +
        '</span>' +
        '<span class="tx"><b>' + t.name + '</b><small>' + t.desc + '</small></span>';
      b.addEventListener('click', () => applyTheme(t.id));
      els.themeGrid.appendChild(b);
    });
  }

  function openTheme(){
    if(!els.themeOverlay) return;
    els.themeOverlay.classList.add('show');
  }
  function closeTheme(){
    if(els.themeOverlay) els.themeOverlay.classList.remove('show');
  }

  function cycleTheme(){
    const i = THEMES.findIndex(t => t.id === curTheme);
    applyTheme(THEMES[(i + 1) % THEMES.length].id);
  }

  const state = {
    school:  DEFAULT_SCHOOL,
    subject: DEFAULT_SUBJECT,
    startMs: 0,
    endMs:   0
  };

  let paused      = false;
  let pausedAt    = 0;
  let extraTime   = 0;
  let lastRem     = null;
  let curMode     = '';
  let settingMode = 'duration';

  let alarmTimer = null;
  let alarmCount = 0;

  let serverOffset = 0;

  /* ============================================================
     学校名称持久化
     ============================================================ */
  function loadSchool(){
    try{
      const v = localStorage.getItem(LS_SCHOOL);
      return (v && v.trim()) ? v.trim() : DEFAULT_SCHOOL;
    }catch(e){ return DEFAULT_SCHOOL; }
  }
  function saveSchool(v){
    try{ localStorage.setItem(LS_SCHOOL, v); }catch(e){}
  }

  /* ============================================================
     音频
     ============================================================ */
  let audioCtx = null;

  function initAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  document.addEventListener('click',   initAudio, { once:true });
  document.addEventListener('keydown', initAudio, { once:true });

  function tone(freq, dur, delay, vol, type){
    if(!audioCtx) return;
    dur   = dur   === undefined ? 0.20 : dur;
    delay = delay === undefined ? 0    : delay;
    vol   = vol   === undefined ? 0.25 : vol;
    type  = type  || 'sine';

    const t0  = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g   = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.06);
  }

  function chime(times, freq){
    for(let i = 0; i < times; i++) tone(freq, 0.5, i * 0.62, 0.30);
  }

  /* 语音播报 */
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    // 取消之前的语音队列
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 0.9;
    utter.pitch = 1.0;
    utter.volume = 1.0; // 最大音量
    // 尝试使用中文语音
    const voices = speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh')) || voices[0];
    if(zhVoice) utter.voice = zhVoice;
    speechSynthesis.speak(utter);

  /* ============================================================
     网络时间校准（失败静默回退本地时间）
     ============================================================ */
  function now(){ return Date.now() + serverOffset; }

  async function fetchJsonWithTimeout(url, timeoutMs){
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try{
      const res = await fetch(url, {
        signal : ctrl.signal,
        cache  : 'no-store',
        mode   : 'cors'
      });
      clearTimeout(timer);
      if(!res.ok) return null;
      return await res.json();
    }catch(e){
      clearTimeout(timer);
      return null;
    }
  }

  async function syncNetworkTime(){
    const endpoints = [
      { url:'https://worldtimeapi.org/api/ip',
        parse: d => d && d.unixtime ? d.unixtime * 1000 : null },
      { url:'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai',
        parse: d => d && d.dateTime ? new Date(d.dateTime).getTime() : null },
      { url:'https://showcase.api.linx.twenty57.net/UnixTime/tounixtimestamp?datetime=now',
        parse: d => d && d.UnixTimeStamp ? Number(d.UnixTimeStamp) * 1000 : null }
    ];

    for(const ep of endpoints){
      const data = await fetchJsonWithTimeout(ep.url, 2500);
      if(!data) continue;
      const t = ep.parse(data);
      if(!Number.isFinite(t) || t <= 0) continue;
      serverOffset = t - Date.now();
      updateDatebar();
      return true;
    }
    serverOffset = 0;
    return false;
  }

  /* ============================================================
     日期栏
     ============================================================ */
  function updateDatebar(){
    const d   = new Date(now());
    const yr  = d.getFullYear();
    const mon = d.getMonth() + 1;
    const day = d.getDate();
    const wd  = WEEKDAYS[d.getDay()];
    const hh  = String(d.getHours()).padStart(2,'0');
    const mm  = String(d.getMinutes()).padStart(2,'0');
    const ss  = String(d.getSeconds()).padStart(2,'0');

    els.datebar.innerHTML =
      yr + '年' + mon + '月' + day + '日' +
      ' <span class="weekday">' + wd + '</span>' +
      '<span class="beijing">北京时间</span>' +
      ' <span class="clock">' + hh + ':' + mm + ':' + ss + '</span>';
  }

  /* ============================================================
     时间工具
     ============================================================ */
  function formatTime(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const p = n => String(n).padStart(2, '0');
    return h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
  }

  function timeToMs(str){
    if(!str) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(str.trim());
    if(!m) return null;
    const h = +m[1], mi = +m[2];
    if(h > 23 || mi > 59) return null;
    const d = new Date(now());
    d.setHours(h, mi, 0, 0);
    return d.getTime();
  }

  function msToTime(ms){
    const d = new Date(ms);
    return String(d.getHours()).padStart(2,'0') + ':' +
           String(d.getMinutes()).padStart(2,'0');
  }

  /* 把 "9:5" / " 14:00 " 之类的输入规整成 <input type=time> 认的 "HH:MM" */
  function padTimeStr(v){
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(v == null ? '' : v).trim());
    if(!m) return '';
    const h = Math.min(23, Math.max(0, parseInt(m[1], 10)));
    const mi = Math.min(59, Math.max(0, parseInt(m[2], 10)));
    return String(h).padStart(2,'0') + ':' + String(mi).padStart(2,'0');
  }

  function calcMinutes(startStr, endStr){
    const s = timeToMs(startStr);
    let   e = timeToMs(endStr);
    if(s === null || e === null) return null;
    if(e <= s) e += 86400000;
    return Math.round((e - s) / 60000);
  }

  function syncStateFromPickers(){
    const s = timeToMs(els.startPicker.value);
    let   e = timeToMs(els.endPicker.value);
    if(s === null || e === null) return false;
    if(e <= s) e += 86400000;
    state.startMs = s;
    state.endMs   = e;
    return true;
  }

  /* ============================================================
     倒计时
     ============================================================ */
  function currentRem(){
    const ref = paused ? pausedAt : now();
    return Math.max(0, state.endMs + extraTime - ref);
  }

  function tick(){
    const rem = currentRem();
    const ref = paused ? pausedAt : now();

    els.digits.textContent = formatTime(rem);

    /* 只保留“距离考试结束”与“考试已结束”两种状态 */
    let label;
    if(rem <= 0) label = '考试已结束';
    else         label = '距离考试结束：';
    if(els.countLabel.textContent !== label) els.countLabel.textContent = label;

    const total = state.endMs - state.startMs;
    const pct   = total > 0 ? rem / total : 0;
    els.progressBar.style.width = Math.max(0, Math.min(1, pct)) * 100 + '%';

    let mode = 'normal';
    if(rem <= 0)           mode = 'over';
    else if(rem <= 60000)  mode = 'danger';
    else if(rem <= 300000) mode = 'warn';
    if(mode !== curMode){
      document.body.classList.remove('mode-normal','mode-warn','mode-danger','mode-over');
      document.body.classList.add('mode-' + mode);
      curMode = mode;
    }

    const btnText = paused ? '开始' : '暂停';
    if(els.btnToggle.textContent !== btnText) els.btnToggle.textContent = btnText;

    if(lastRem !== null){
      if(lastRem > 905000 && rem <= 905000 && rem > 0){
        speak('距离考试结束时间还有15分钟');
      }
    }
    lastRem = rem;
  }

  /* ============================================================
     开始 / 暂停
     ============================================================ */
  function toggleTimer(){
    if(paused){
      extraTime += now() - pausedAt;
      paused = false;
    }else{
      pausedAt = now();
      paused = true;
    }
    lastRem = null;
    tick();
  }

  function onPickerChange(){
    if(!syncStateFromPickers()) return;
    extraTime = 0;
    if(paused) pausedAt = now();
    lastRem = null;
    clearEndAlarm();
    tick();
  }

  [els.startPicker, els.endPicker].forEach(p => {
    p.addEventListener('change', onPickerChange);
  });

  function updatePreview(){
    const startStr = els.startInput.value;
    let endStr = '';

    if(settingMode === 'duration'){
      const s   = timeToMs(startStr);
      const min = parseInt(els.minutesInput.value, 10);
      if(s !== null && Number.isFinite(min) && min > 0){
        endStr = msToTime(s + min * 60000);

    }else{
      endStr = els.endInput.value;

    if(startStr && endStr){
      let min = calcMinutes(startStr, endStr);
      els.preview.className = 'preview';
      els.preview.innerHTML =
        '考试时间：<b>' + startStr + '</b> 至 <b>' + endStr + '</b>' +

  function applySettings(){

    const subject  = (els.subjectInput.value || '').trim() || DEFAULT_SUBJECT;

    let e;

        return;

      e = s + min * 60000;
    }else{
      e = timeToMs(els.endInput.value);
      if(e === null){
        els.preview.className = 'preview error';
        els.preview.textContent = '结束时间格式不正确';
        return;

      if(e <= s) e += 86400000;

    state.subject = subject;
    els.subject.textContent = subject;
    els.startPicker.value   = msToTime(s);
    els.endPicker.value     = msToTime(e);

  els.btnSettings.addEventListener('click', openSettings);

    }else{
      const min = calcMinutes(els.startInput.value, els.endInput.value);

  /* ============================================================
     手写输入
     ============================================================ */
  const hw = {
    ctx: null,
    strokes: [],
    current: null,
    pointerId: null,
    canvasReady: false
  };

  function hwInitCanvas(){
    const canvas = els.hwCanvas;
    const rect = canvas.getBoundingClientRect();
    if(rect.width < 10) return;

    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(rect.width  * dpr);
    canvas.height = Math.round(rect.height * dpr);

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#e8eefc';
    ctx.fillStyle  = '#e8eefc';

    hw.ctx = ctx;
    hw.canvasReady = true;

    hwRedraw();
  }

  function hwRedraw(){
    const canvas = els.hwCanvas;
    const ctx    = hw.ctx;
    if(!ctx) return;

    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    for(const stroke of hw.strokes){
      if(stroke.length === 1){
        ctx.beginPath();
        ctx.arc(stroke[0][0], stroke[0][1], 1.6, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      ctx.beginPath();
      ctx.moveTo(stroke[0][0], stroke[0][1]);
      for(let i = 1; i < stroke.length; i++){
        ctx.lineTo(stroke[i][0], stroke[i][1]);
      }
      ctx.stroke();
    }
  }

  function hwPos(e){
    const rect = els.hwCanvas.getBoundingClientRect();
    return [e.clientX - rect.left, e.clientY - rect.top];
  }

  els.hwCanvas.addEventListener('pointerdown', e => {
    if(hw.pointerId !== null) return;
    e.preventDefault();
    hw.pointerId = e.pointerId;
    try{ els.hwCanvas.setPointerCapture(e.pointerId); }catch(_){}

    const [x, y] = hwPos(e);
    hw.current = [[x, y]];
    hw.strokes.push(hw.current);

    hw.ctx.beginPath();
    hw.ctx.arc(x, y, 1.6, 0, Math.PI * 2);
    hw.ctx.fill();
  });

  els.hwCanvas.addEventListener('pointermove', e => {
    if(e.pointerId !== hw.pointerId || !hw.current) return;
    e.preventDefault();

    const [x, y] = hwPos(e);
    const prev = hw.current[hw.current.length - 1];
    hw.current.push([x, y]);

    hw.ctx.beginPath();
    hw.ctx.moveTo(prev[0], prev[1]);
    hw.ctx.lineTo(x, y);
    hw.ctx.stroke();
  });

  function hwEnd(e){
    if(e.pointerId !== hw.pointerId) return;
    hw.pointerId = null;
    hw.current = null;
  }
  els.hwCanvas.addEventListener('pointerup', hwEnd);
  els.hwCanvas.addEventListener('pointercancel', hwEnd);

  function hwClear(){
    hw.strokes = [];
    hw.current = null;
    hw.pointerId = null;
    els.hwCandidates.innerHTML = '';
    hwRedraw();
  }

  els.hwClear.addEventListener('click', hwClear);

  async function callHandwritingAPI(payload){
    const apiUrl = 'https://inputtools.google.com/request?itc=zh-t-i0-handwrit&app=demopage';
    const body   = JSON.stringify(payload);
    const headers = { 'Content-Type': 'application/json' };

    try{
      const res = await fetch(apiUrl, { method:'POST', headers, body });
      if(res.ok){
        const data = await res.json();
        if(data && data[0] === 'SUCCESS') return data;
      }
    }catch(e){}

    try{
      const proxied = 'https://corsproxy.io/?' + encodeURIComponent(apiUrl);
      const res = await fetch(proxied, { method:'POST', headers, body });
      if(res.ok){
        const data = await res.json();
        if(data && data[0] === 'SUCCESS') return data;
      }
    }catch(e){}

    return null;
  }

  els.hwRecognize.addEventListener('click', async () => {
    if(hw.strokes.length === 0){
      els.hwCandidates.innerHTML =
        '<span class="hw-status error">请先在画布上书写</span>';
      return;
    }

    els.hwCandidates.innerHTML =
      '<span class="hw-status">识别中…</span>';

    const rect = els.hwCanvas.getBoundingClientRect();
    const payload = {
      input_type: '0',
      requests: [{
        language: 'zh',
        writing_guide: {
          width:  Math.round(rect.width),
          height: Math.round(rect.height)
        },
        ink: hw.strokes
      }]
    };

    const data = await callHandwritingAPI(payload);

    if(!data){
      els.hwCandidates.innerHTML =
        '<span class="hw-status error">识别服务暂时不可用，请直接打字输入</span>';
      return;
    }

    const list = (data[1] && data[1][0] && data[1][0][1]) || [];
    if(!list.length){
      els.hwCandidates.innerHTML =
        '<span class="hw-status error">未识别到内容，请重新书写</span>';
      return;
    }

    els.hwCandidates.innerHTML = '';
    list.slice(0, 8).forEach(text => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hw-candidate';
      btn.textContent = text;
      btn.addEventListener('click', () => {
        const cur = els.schoolInput.value || '';
        els.schoolInput.value = cur + text;
        closeHandwrite();
      });
      els.hwCandidates.appendChild(btn);
    });
  });

  function toggleFullscreen(){

      const el  = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if(req) req.call(el);
    }else{

      if(exit) exit.call(document);

  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    }catch(e){}

     ============================================================ */

    if(els.hwModal.classList.contains('show')){
      if(e.key === 'Escape') closeHandwrite();
      return;
    }
    if(e.target.tagName === 'INPUT' || e.target.isContentEditable){
      if(e.key === 'Escape') closeSettings();
      return;
    }
    if(e.code === 'Space'){
      e.preventDefault();
      initAudio();
      toggleTimer();
    }else if(e.key === 'f' || e.key === 'F'){
      toggleFullscreen();
    }else if(e.key === 't' || e.key === 'T'){
      cycleTheme();
    }else if(e.key === 'Escape'){
      closeTheme();
      closeSettings();
    }
  });

  /* ============================================================
     初始化
     ============================================================ */
  function init(){
    setSchool(loadSchool());

    /* 「班级桌面管理 → 考试模式」里点发布后，电脑端会带上设计好的设置打开本页：
       ?school=学校&subject=科目&start=HH:MM&end=HH:MM，打开即按这套时间倒计时 */
    try{
      const qp = new URLSearchParams(location.search);
      const pSchool  = (qp.get('school')  || '').trim();
      const pSubject = (qp.get('subject') || '').trim();
      const pStart   = padTimeStr(qp.get('start'));
      const pEnd     = padTimeStr(qp.get('end'));
      if(pSchool)  setSchool(pSchool);
      if(pSubject){ state.subject = pSubject; els.subject.textContent = pSubject; }
      if(pStart)   els.startPicker.value = pStart;
      if(pEnd)     els.endPicker.value   = pEnd;
    }catch(err){ /* ignore */ }

    let s = timeToMs(els.startPicker.value);
    let e = timeToMs(els.endPicker.value);
    if(e <= s) e += 86400000;
    const cur = now();
    if(e <= cur){
      s += 86400000;
      e += 86400000;
    }
    state.startMs = s;
    state.endMs   = e;
    state.subject = els.subject.textContent.trim() || DEFAULT_SUBJECT;

    document.title = state.subject + ' · 考试计时';
  }

  buildChips();
  buildThemeCards();
  applyTheme(loadTheme(), { notify: false });
  init();
  updateDatebar();
  tick();

  setInterval(updateDatebar, 1000);
  setInterval(tick, 100);
  syncNetworkTime();
  setInterval(syncNetworkTime, 30 * 60 * 1000);

  /* ---- 供「班级桌面管理 → 考试模式」读取当前设置（发布到电脑桌面用） ---- */
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || d.type !== 'ksjsq-get-settings') return;
    try {
      var payload = {
        school:  state.school  || '',
        subject: state.subject || '',
        start:   msToTime(state.startMs),
        end:     msToTime(state.endMs),
        theme:   curTheme || 'deep'
      };
      if (e.source && e.source.postMessage) {
        e.source.postMessage({ type: 'ksjsq-settings', payload: payload }, '*');
      } else {
        window.parent.postMessage({ type: 'ksjsq-settings', payload: payload }, '*');
      }
    } catch (err) { /* ignore */ }
  });
})();
</script>
</body>
